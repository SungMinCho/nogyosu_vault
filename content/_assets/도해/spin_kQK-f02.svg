<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 262" width="800" height="262" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-spike{ fill:var(--spike) }.dg .t-ink{ fill:var(--ink) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-mut{ stroke:var(--muted) }.dg .ln-spike{ stroke:var(--spike) }.dg .f-ink{ fill:var(--ink) }.dg .thick{ stroke-width:2.4 }.lecture > .frame{ max-width:var(--wide) }.dg .clock{ fill:var(--paper); stroke:var(--ink-2); stroke-width:1.2 }svg.pz-root{width:800px!important;height:262px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="RoPE의 64개 쌍을 속도가 다른 시계로 그린 그림. 첫 쌍은 세 토큰에 172도를 돌고 마지막 쌍은 거의 돌지 않는다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 800 262" width="100%"><circle class="clock" cx="70" cy="100" r="44"></circle><line class="ln ln-mut" x1="70" x2="107.4" y1="100" y2="100"></line><line class="ln ln-spike thick" x1="70" x2="32.9743" y1="100" y2="94.7221"></line><circle class="f-ink" cx="70" cy="100" r="2.5"></circle><text class="t-s t-b t-ink" text-anchor="middle" x="70" y="160">쌍 1</text><text class="t-s t-mut" text-anchor="middle" x="70" y="174">θ = 1</text><text class="t-s t-b t-spike" text-anchor="middle" x="70" y="192">3토큰에 172°</text><circle class="clock" cx="198" cy="100" r="44"></circle><line class="ln ln-mut" x1="198" x2="235.4" y1="100" y2="100"></line><line class="ln ln-spike thick" x1="198" x2="165.991" y1="100" y2="80.6562"></line><circle class="f-ink" cx="198" cy="100" r="2.5"></circle><text class="t-s t-b t-ink" text-anchor="middle" x="198" y="160">쌍 2</text><text class="t-s t-mut" text-anchor="middle" x="198" y="174">θ = 0.866</text><text class="t-s t-b t-spike" text-anchor="middle" x="198" y="192">3토큰에 149°</text><circle class="clock" cx="326" cy="100" r="44"></circle><line class="ln ln-mut" x1="326" x2="363.4" y1="100" y2="100"></line><line class="ln ln-spike thick" x1="326" x2="343.114" y1="100" y2="66.7451"></line><circle class="f-ink" cx="326" cy="100" r="2.5"></circle><text class="t-s t-b t-ink" text-anchor="middle" x="326" y="160">쌍 8</text><text class="t-s t-mut" text-anchor="middle" x="326" y="174">θ = 0.365</text><text class="t-s t-b t-spike" text-anchor="middle" x="326" y="192">3토큰에 63°</text><circle class="clock" cx="454" cy="100" r="44"></circle><line class="ln ln-mut" x1="454" x2="491.4" y1="100" y2="100"></line><line class="ln ln-spike thick" x1="454" x2="489.178" y1="100" y2="87.301"></line><circle class="f-ink" cx="454" cy="100" r="2.5"></circle><text class="t-s t-b t-ink" text-anchor="middle" x="454" y="160">쌍 16</text><text class="t-s t-mut" text-anchor="middle" x="454" y="174">θ = 0.115</text><text class="t-s t-b t-spike" text-anchor="middle" x="454" y="192">3토큰에 20°</text><circle class="clock" cx="582" cy="100" r="44"></circle><line class="ln ln-mut" x1="582" x2="619.4" y1="100" y2="100"></line><line class="ln ln-spike thick" x1="582" x2="619.378" y1="100" y2="98.7046"></line><circle class="f-ink" cx="582" cy="100" r="2.5"></circle><text class="t-s t-b t-ink" text-anchor="middle" x="582" y="160">쌍 32</text><text class="t-s t-mut" text-anchor="middle" x="582" y="174">θ = 0.0115</text><text class="t-s t-b t-spike" text-anchor="middle" x="582" y="192">3토큰에 2°</text><circle class="clock" cx="710" cy="100" r="44"></circle><line class="ln ln-mut" x1="710" x2="747.4" y1="100" y2="100"></line><line class="ln ln-spike thick" x1="710" x2="747.4" y1="100" y2="99.987"></line><circle class="f-ink" cx="710" cy="100" r="2.5"></circle><text class="t-s t-b t-ink" text-anchor="middle" x="710" y="160">쌍 64</text><text class="t-s t-mut" text-anchor="middle" x="710" y="174">θ = 0.000115</text><text class="t-s t-b t-spike" text-anchor="middle" x="710" y="192">3토큰에 0°</text><text class="t-s t-b" text-anchor="start" x="30" y="26">토큰 m = 0의 바늘(회색)과 m = 3의 바늘(붉은색) — 헤드 폭 128, 64쌍 중 여섯</text><text class="t-s t-mut" text-anchor="start" x="30" y="250">빠른 시계는 가까운 거리를, 느린 시계는 먼 거리를 구별한다. 가장 느린 쌍은 한 바퀴에 약 5만 4천 토큰.</text></svg></g></g></g></g></svg>
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .dash{ stroke-dasharray:4 3 }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .bar-nv{ fill:var(--c-nv) }.dg .bar-mx{ fill:var(--c-mx) }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="다섯 종류의 4096차원 벡터에 무작위 하다마드 변환을 걸면, 원래 첨두비가 무엇이었든 대부분 3.8 근처로 모인다" class="dg" height="100%" role="img" style="" viewBox="0 0 760 340" width="100%"><line class="ln-hair" x1="70" x2="720" y1="258.855" y2="258.855"></line><text class="t-s t-mono t-mut" text-anchor="end" x="62" y="262.855">1</text><line class="ln-hair" x1="70" x2="720" y1="224.237" y2="224.237"></line><text class="t-s t-mono t-mut" text-anchor="end" x="62" y="228.237">2</text><line class="ln-hair" x1="70" x2="720" y1="189.618" y2="189.618"></line><text class="t-s t-mono t-mut" text-anchor="end" x="62" y="193.618">4</text><line class="ln-hair" x1="70" x2="720" y1="155" y2="155"></line><text class="t-s t-mono t-mut" text-anchor="end" x="62" y="159">8</text><line class="ln-hair" x1="70" x2="720" y1="120.382" y2="120.382"></line><text class="t-s t-mono t-mut" text-anchor="end" x="62" y="124.382">16</text><line class="ln-hair" x1="70" x2="720" y1="85.7631" y2="85.7631"></line><text class="t-s t-mono t-mut" text-anchor="end" x="62" y="89.7631">32</text><line class="ln-hair" x1="70" x2="720" y1="51.1447" y2="51.1447"></line><text class="t-s t-mono t-mut" text-anchor="end" x="62" y="55
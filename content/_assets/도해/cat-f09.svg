<rect class="f-plate s-ink" height="64" rx="4" stroke-width="1.4" width="280" x="360" y="14"></rect><text class="t-b" text-anchor="middle" x="500.0" y="36">WUSH (2025.12)</text><text class="t-s" text-anchor="middle" x="500.0" y="55">블록 absmax 기대 오차를 최소로</text>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 300" width="640" height="300" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#F1F2EC; --paper:#FAFAF6; --soft:#E3E6DE; --tie:#B9BEB5; --stack:#C9CDC4; --grid:#DCE0D6; --rule:#CDD3CA;
  --ink:#1B2420; --ink-2:#44504A; --muted:#6E7871; --on:#FFFFFF;
  --pot:#23825A; --risk:#C0392B; --eq:#A0700F; --un:#2F5DA8; --warn:#8A4FB8;
  --eq-bg:#F3E7CC; --risk-bg:#F6DEDA;
  --f-body:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-disp:"Song Myung","Nanum Myeongjo","Noto Serif KR",serif;
  --f-num:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --f-dg:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --f-math:"Noto Sans Math","STIX Two Math","Cambria Math",math;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}}:root[data-theme="dark"]{
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:2.2rem 4rem}.lecture{display:contents}.fig{margin:.6rem 0 !important;display:grid;gap:.55rem}.fig .frame{overflow-x:auto;background:
  linear-gradient(90deg,var(--paper) 30%,transparent),linear-gradient(270deg,var(--paper) 30%,transparent),
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent),
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent) 100% 0;
  background-color:var(--paper);background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll;
  border:1px solid var(--rule);border-radius:3px;padding:.7rem}.dg{display:block;width:100%;height:auto;font-family:var(--f-dg)}.dg text{fill:var(--ink);font-size:12px}.dg text.mu{fill:var(--muted)}.dg text.b{font-weight:700}.dg text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}.dg text.card{font-family:var(--f-num)}.dg .f-pot{fill:var(--pot)}.dg .f-eq{fill:var(--eq)}.dg .f-ink{fill:var(--ink)}.dg .f-soft{fill:var(--soft)}.dg .f-eq2{fill:color-mix(in srgb,var(--eq) 72%,var(--paper))}.dg .f-eq3{fill:color-mix(in srgb,var(--eq) 48%,var(--paper))}.dg .f-eq4{fill:color-mix(in srgb,var(--eq) 30%,var(--paper))}.dg .s-pot{stroke:var(--pot);stroke-width:1.6}.dg .s-risk{stroke:var(--risk);stroke-width:1.6}.dg .nofill{fill:none}.dg circle:hover,.dg rect[class]:hover{filter:brightness(1.08)}svg.pz-root{width:640px!important;height:300px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="BTN 어림 레인지 494콤보를 K♥7♥2♣에서 세기별로 나눈 막대. 세 줄짜리 전략은 조각마다 다른 행동을 줘서 상대가 크게 걸면 접고, 작게 걸면 레이즈하고, 체크하면 베팅하게 만든다. 레인지로 베팅하면 한 크기 안에 여러 층이 섞인다." class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 640 300" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar-rs" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="mu" style="font-size:12px" text-anchor="start" x="20.0" y="22.0">BTN 41% 어림 레인지가 K♥7♥2♣를 만났을 때 (494콤보)</text><rect class="f-eq" height="30.0" rx="0" width="15.0" x="21.0" y="40.0"><title>셋·투페어 14콤보 (2.8%)</title></rect><rect class="f-eq2" height="30.0" rx="0" width="96.4" x="38.0" y="40.0"><title>탑페어·AA 81콤보 (16.4%)</title></rect><rect class="f-eq3" height="30.0" rx="0" width="63.6" x="136.4" y="40.0"><title>낮은 포켓 페어 54콤보 (10.9%)</title></rect><rect class="f-eq4" height="30.0" rx="0" width="52.7" x="202.0" y="40.0"><title>약한 페어 45콤보 (9.1%)</title></rect><rect class="f-pot" height="30.0" rx="0" width="34.4" x="256.6" y="40.0"><title>플러시 드로우 30콤보 (6.1%)</title></rect><rect class="f-soft" height="30.0" rx="0" width="325.9" x="293.1" y="40.0"><title>허공 270콤보 (54.7%)</title></rect><text class="sm" style="font-size:11px" text-anchor="start" x="20.0" y="86.0">셋·투페어 14</text><text class="sm" style="font-size:11px" text-anchor="middle" x="86.2" y="100.0">탑페어·AA 81</text><text class="sm" style="font-size:11px" text-anchor="middle" x="168.2" y="86.0">낮은 페어 54</text><text class="sm" style="font-size:11px" text-anchor="middle" x="228.3" y="100.0">약한 페어 45</text><text class="sm" style="font-size:11px" text-anchor="middle" x="273.8" y="86.0">드로우 30</text><text class="sm" style="font-size:11px" text-anchor="middle" x="456.0" y="86.0">허공 270</text><text class="b" style="font-size:13px" text-anchor="start" x="20.0" y="130.0">세 줄짜리 전략 — 조각마다 다른 행동</text><path class="s-risk nofill" d="M22.0,140 L22.0,146 L253.6,146 L253.6,140"></path><text style="font-size:12px" text-anchor="middle" x="137.8" y="162.0">크게 (맞은 손)</text><text class="mu" style="font-size:11px" text-anchor="middle" x="137.8" y="178.0">상대: 블러프 캐처 전부 폴드</text><path class="s-risk nofill" d="M257.6,140 L257.6,146 L290.1,146 L290.1,140"></path><text style="font-size:12px" text-anchor="middle" x="273.8" y="162.0">작게</text><text class="mu" style="font-size:11px" text-anchor="middle" x="273.8" y="178.0">상대: 레이즈</text><path class="s-risk nofill" d="M294.1,140 L294.1,146 L618.0,146 L618.0,140"></path><text style="font-size:12px" text-anchor="middle" x="456.0" y="162.0">체크 (허공)</text><text class="mu" style="font-size:11px" text-anchor="middle" x="456.0" y="178.0">상대: 아무 두 장으로 베팅</text><text class="b" style="font-size:13px" text-anchor="start" x="20.0" y="216.0">레인지로 베팅 — 한 크기 안에 여러 층</text><path class="s-pot nofill" d="M22,226 L22,232 L618,232 L618,226"></path><line class="s-pot" x1="28.5" x2="28.5" y1="232.0" y2="240.0"></line><line class="s-pot" x1="86.2" x2="86.2" y1="232.0" y2="240.0"></line><line class="s-pot" x1="168.2" x2="168.2" y1="232.0" y2="240.0"></line><line class="s-pot" x1="228.3" x2="228.3" y1="232.0" y2="240.0"></line><line class="s-pot" x1="273.8" x2="273.8" y1="232.0" y2="240.0"></line><line class="s-pot" x1="456.0" x2="456.0" y1="232.0" y2="240.0"></line><text style="font-size:12px" text-anchor="middle" x="320.0" y="258.0">같은 작은 크기로 각 층에서 조금씩 섞어 건다 → 크기가 손을 말하지 않는다</text><text class="mu" style="font-size:11px" text-anchor="middle" x="320.0" y="274.0">(층마다 섞는 비율은 솔버 설정마다 다르다)</text></svg></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 272" width="700" height="272" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#E8ECE6; --panel:#F2F5F0; --grid:#D3DBD0; --grid-2:#BDC9B9;
  --ink:#1B2024; --ink-2:#4A545B; --ink-3:#6B767C;
  --copy:#3A4C98; --prop:#0B7367; --code:#8E6208; --alarm:#A63B28;
  --copy-soft:rgba(58,76,152,.14); --prop-soft:rgba(11,115,103,.14);
  --code-soft:rgba(142,98,8,.14); --alarm-soft:rgba(166,59,40,.13);
  --shade:rgba(27,32,36,.07);
  --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2);
  --f-disp:"Orbit","Do Hyeon","Nanum Gothic",sans-serif;
  --f-body:"Source Serif 4","Nanum Myeongjo","Noto Serif CJK KR","Noto Serif KR",serif;
  --f-mono:"Martian Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
  --f-lab:"Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111514; --panel:#171C1B; --grid:#1F2725; --grid-2:#2B3532;
    --ink:#E1E6E0; --ink-2:#AAB4AE; --ink-3:#86918B;
    --copy:#93A5F2; --prop:#43BCA9; --code:#D9A43E; --alarm:#E4795F;
    --copy-soft:rgba(147,165,242,.16); --prop-soft:rgba(67,188,169,.16);
    --code-soft:rgba(217,164,62,.15); --alarm-soft:rgba(228,121,95,.15);
    --shade:rgba(225,230,224,.07);
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111514; --panel:#171C1B; --grid:#1F2725; --grid-2:#2B3532;
  --ink:#E1E6E0; --ink-2:#AAB4AE; --ink-3:#86918B;
  --copy:#93A5F2; --prop:#43BCA9; --code:#D9A43E; --alarm:#E4795F;
  --copy-soft:rgba(147,165,242,.16); --prop-soft:rgba(67,188,169,.16);
  --code-soft:rgba(217,164,62,.15); --alarm-soft:rgba(228,121,95,.15);
  --shade:rgba(225,230,224,.07);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero svg{ display:block; width:100%; height:auto }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:1rem 3rem }.lecture{ display:contents }figure.fig{ margin:.6rem 0 !important }.fig-frame{ overflow-x:auto; border:1px solid var(--grid-2); background-color:var(--panel);
  background-image:
    linear-gradient(90deg,var(--panel) 30%,rgba(0,0,0,0)),
    linear-gradient(90deg,rgba(0,0,0,0),var(--panel) 70%) 100% 0,
    radial-gradient(farthest-side at 0 50%,var(--shade),rgba(0,0,0,0)),
    radial-gradient(farthest-side at 100% 50%,var(--shade),rgba(0,0,0,0)) 100% 0,
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,repeat,repeat;
  background-size:40px 100%,40px 100%,14px 100%,14px 100%,12px 12px,12px 12px;
  background-attachment:local,local,scroll,scroll,local,local; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; color:var(--ink) }.fig-frame text, .hero text{ font-family:var(--f-lab); fill:var(--ink); font-size:12px }text.s{ font-size:11px }text.xs{ font-size:10px }text.l{ font-size:14px }text.xl{ font-size:18px }text.b{ font-weight:700 }text.mut{ fill:var(--ink-2) }text.halo{ paint-order:stroke fill; stroke:var(--panel) !important; stroke-width:6px; stroke-linejoin:round }text.he{ font-family:"Noto Serif Hebrew","Noto Sans Hebrew","Times New Roman",serif; font-size:30px }.t-prop{ fill:var(--prop) !important }.t-code{ fill:var(--code) !important }.s-ink{ stroke:var(--ink); fill:none }.f-prop-s{ fill:var(--prop-soft) }.m-ink{ fill:var(--ink) }.m-copy{ fill:var(--copy) }.m-prop{ fill:var(--prop) }.m-code{ fill:var(--code) }.m-alarm{ fill:var(--alarm) }.m-mut{ fill:var(--ink-3) }.w1{ stroke-width:1 }.w2{ stroke-width:2 }svg.pz-root{width:700px!important;height:272px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="80도 물 1리터와 20도 물 3리터를 섞으면 4리터, 35도. 부피는 더해지고 온도는 더해지지 않는다. 외연량과 강도량의 차이." class="pz-inner" height="100%" role="img" viewBox="0 0 700 272" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f06-a-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-ink" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f06-a-copy" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-copy" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f06-a-prop" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-prop" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f06-a-code" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-code" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f06-a-alarm" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-alarm" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f06-a-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-mut" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><rect class="f-prop-s" height="30.0" rx="0" width="80.0" x="60.0" y="150.0"></rect><path class="s-ink w2" d="M60,50 L60,180 L140,180 L140,50"></path><line class="s-ink w1" x1="130.0" x2="140.0" y1="150.0" y2="150.0"></line><line class="s-ink w1" x1="130.0" x2="140.0" y1="120.0" y2="120.0"></line><line class="s-ink w1" x1="130.0" x2="140.0" y1="90.0" y2="90.0"></line><line class="s-ink w1" x1="130.0" x2="140.0" y1="60.0" y2="60.0"></line><text class="s b" text-anchor="middle" x="100.0" y="202.0">1 L · 80°</text><text class="xl" text-anchor="middle" x="172.0" y="124.0">+</text><rect class="f-prop-s" height="90.0" rx="0" width="80.0" x="190.0" y="90.0"></rect><path class="s-ink w2" d="M190,50 L190,180 L270,180 L270,50"></path><line class="s-ink w1" x1="260.0" x2="270.0" y1="150.0" y2="150.0"></line><line class="s-ink w1" x1="260.0" x2="270.0" y1="120.0" y2="120.0"></line><line class="s-ink w1" x1="260.0" x2="270.0" y1="90.0" y2="90.0"></line><line class="s-ink w1" x1="260.0" x2="270.0" y1="60.0" y2="60.0"></line><text class="s b" text-anchor="middle" x="230.0" y="202.0">3 L · 20°</text><line class="s-ink w2" marker-end="url(#f06-a-ink)" x1="300.0" x2="430.0" y1="115.0" y2="115.0"></line><text class="s" text-anchor="middle" x="365.0" y="104.0">섞는다</text><rect class="f-prop-s" height="120.0" rx="0" width="80.0" x="450.0" y="60.0"></rect><path class="s-ink w2" d="M450,50 L450,180 L530,180 L530,50"></path><line class="s-ink w1" x1="520.0" x2="530.0" y1="150.0" y2="150.0"></line><line class="s-ink w1" x1="520.0" x2="530.0" y1="120.0" y2="120.0"></line><line class="s-ink w1" x1="520.0" x2="530.0" y1="90.0" y2="90.0"></line><line class="s-ink w1" x1="520.0" x2="530.0" y1="60.0" y2="60.0"></line><text class="s b" text-anchor="middle" x="490.0" y="202.0">4 L · 35°</text><text class="xs mut" text-anchor="start" x="560.0" y="76.0">눈금 한 칸 = 1 L</text><text class="s t-code" text-anchor="start" x="40.0" y="236.0">부피 (외연량)   1 + 3 = 4          더해진다</text><text class="s t-prop" text-anchor="start" x="40.0" y="258.0">온도 (강도량)   (1×80 + 3×20) ÷ 4 = 35   두 온도 사이로 간다</text></svg></g></g></g></g></svg>
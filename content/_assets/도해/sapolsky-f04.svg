<path class="ln-neuro w-thick" d="M140,412 L188,412 C218,412 238,378 290,376 C316,375 326,377 340,384 C366,396 392,398 430,398 L620,398"></path>
<path class="ln-alarm w-thick" d="M352,352 L352,384"></path>

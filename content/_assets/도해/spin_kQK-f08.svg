<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 740 300" width="740" height="300" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .ser-nv{ fill:none; stroke:var(--c-nv); stroke-width:2 }.dg .ser-mx{ fill:none; stroke:var(--c-mx); stroke-width:2 }.dg .t-nv{ fill:var(--c-nv) }.dg .t-mx{ fill:var(--c-mx) }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:740px!important;height:300px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="디코딩 한 단계에서 RoPE 뒤 캐싱은 하다마드 두 번으로 문맥 길이와 무관하지만, RoPE 전 캐싱은 캐시된 키 수만큼 역회전해야 한다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 740 300" width="100%"><line class="ln-hair" x1="80" x2="80" y1="40" y2="250"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="80" y="266">512</text><line class="ln-hair" x1="153.333" x2="153.333" y1="40" y2="250"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="153.333" y="266">1K</text><line class="ln-hair" x1="226.667" x2="226.667" y1="40" y2="250"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="226.667" y="266">2K</text><line class="ln-hair" x1="300" x2="300" y1="40" y2="250"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="300" y="266">4K</text><line class="ln-hair" x1="373.333" x2="373.333" y1="40" y2="250"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="373.333" y="266">8K</text><line class="ln-hair" x1="446.667" x2="446.667" y1="40" y2="250"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="446.667" y="266">16K</text><line class="ln-hair" x1="520" x2="520" y1="40" y2="250"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="520" y="266">32K</text><line class="ln-hair" x1="80" x2="520" y1="250" y2="250"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="254">1</text><line class="ln-hair" x1="80" x2="520" y1="222" y2="222"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="226">4</text><line class="ln-hair" x1="80" x2="520" y1="194" y2="194"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="198">16</text><line class="ln-hair" x1="80" x2="520" y1="166" y2="166"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="170">64</text><line class="ln-hair" x1="80" x2="520" y1="138" y2="138"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="142">256</text><line class="ln-hair" x1="80" x2="520" y1="110" y2="110"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="114">1024</text><line class="ln-hair" x1="80" x2="520" y1="82" y2="82"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="86">4096</text><line class="ln-hair" x1="80" x2="520" y1="54" y2="54"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="58">16384</text><polyline class="ser-mx" points="80.0,236.0 153.3,236.0 226.7,236.0 300.0,236.0 373.3,236.0 446.7,236.0 520.0,236.0"></polyline><polyline class="ser-nv" points="80.0,124.0 153.3,110.0 226.7,96.0 300.0,82.0 373.3,68.0 446.7,54.0 520.0,40.0"></polyline><text class="t-s t-b t-mx" text-anchor="start" x="528" y="240">RoPE 뒤 캐싱 + 온라인 H: 2번</text><text class="t-s t-b t-nv" text-anchor="start" x="528" y="44">RoPE 전 캐싱 + 병합:</text><text class="t-s t-b t-nv" text-anchor="start" x="528" y="60">캐시 길이만큼</text><text class="t-s t-mut" text-anchor="middle" x="300" y="286">캐시된 키의 수 (문맥 길이)</text><text class="t-s t-mut" text-anchor="start" x="30" y="24">디코딩 한 단계의 하다마드 횟수 (헤드당)</text></svg></g></g></g></g></svg>
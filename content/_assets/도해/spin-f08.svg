}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .t-grid{ fill:var(--grid) }.dg .t-pos{ fill:var(--pos) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-spike{ stroke:var(--spike) }.dg .dash{ stroke-dasharray:4 3 }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .f-ink{ fill:var(--ink) }.dg .f-spike{ fill:var(--spike) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-pos{ fill:var(--pos-soft); stroke:var(--pos) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.dg .ssub{ font-size:8px }svg.pz-root{width:830px!important;height:440px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="RoPE 앞에서 하다마드를 어디에 둘 것인가: 그대로 병합하면 다른 모델이 되고, 네 가지 우회로는 각각 다른 비용을 치른다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 830 440" width="100%"><defs><marker id="rp-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="rp-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-s t-mut" text-anchor="start" x="16" y="22">길</text><text class="t-s t-mut" text-anchor="start" x="180" y="22">쿼리(또는 키)가 거치는 순서 →</text><text class="t-s t-mut" text-anchor="start" x="672" y="22">결과 · 비용</text><line class="ln-hair" x1="10" x2="820" y1="100" y2="100"></line><text class="t-b" text-anchor="start" x="16" y="64">그대로 병합</text><text class="t-s t-mut" text-anchor="start" x="16" y="80">여러분 과제의 모양</text><rect class="bx bx-rot" height="30" rx="4" width="106" x="180" y="50"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="233" y="69">W<tspan class="ssub" dy="3">q</tspan><tspan dy="-3">​</tspan> · H</text><line class="ln" marker-end="url(#rp-ink)" x1="287" x2="298" y1="65" y2="65"></line><rect class="bx bx-pos" height="30" rx="4" width="106" x="300" y="50"></rect><text class="t-s t-b t-pos" text-anchor="middle" x="353" y="69">Θ<tspan class="ssub" dy="3">m</tspan><tspan dy="-3">​</tspan></text><line class="ln" marker-end="url(#rp-ink)" x1="407" x2="418" y1="65" y2="65"></line><rect class="bx bx-grid" height="30" rx="4" width="106" x="420" y="50"></rect><text class="t-s t-b t-grid" text-anchor="middle" x="473" y="69">양자화</text><line class="ln" marker-end="url(#rp-ink)" x1="527" x2="538" y1="65" y2="65"></line><rect class="bx" height="30" rx="4" width="106" x="540" y="50"></rect><text class="t-s t-b" text-anchor="middle" x="593" y="69">점수</text><text class="t-b t-spike" text-anchor="start" x="672" y="64">✕ 다른 모델</text><text class="t-s t-mut" text-anchor="start" x="672" y="80">q·H·Θ·Hᵀ·kᵀ ≠ q·Θ·kᵀ</text><line class="ln-hair" x1="10" x2="820" y1="176" y2="176"></line><text class="t-b" text-anchor="start" x="16" y="140">RoPE 뒤 온라인</text><text class="t-s t-mut" text-anchor="start" x="16" y="156">QuaRot · SpinQuant R3 · FA3</text><rect class="bx" height="30" rx="4" width="84" x="180" y="126"></rect><text class="t-s t-b" text-anchor="middle" x="222" y="145">W<tspan class="ssub" dy="3">q</tspan><tspan dy="-3">​</tspan></text><line class="ln" marker-end="url(#rp-ink)" x1="265" x2="276" y1="141" y2="141"></line><rect class="bx bx-pos" height="30" rx="4" width="84" x="278" y="126"></rect><text class="t-s t-b t-pos" text-anchor="middle" x="320" y="145">Θ<tspan class="ssub" dy="3">m</tspan><tspan dy="-3">​</tspan></text><line class="ln" marker-end="url(#rp-ink)" x1="363" x2="374" y1="141" y2="141"></line><rect class="bx bx-rot" height="30" rx="4" width="84" x="376" y="126"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="418" y="145">H</text><line class="ln" marker-end="url(#rp-ink)" x1="461" x2="472" y1="141" y2="141"></line><rect class="bx bx-grid" height="30" rx="4" width="84" x="474" y="126"></rect><text class="t-s t-b t-grid" text-anchor="middle" x="516" y="145">양자화</text><line class="ln" marker-end="url(#rp-ink)" x1="559" x2="570" y1="141" y2="141"></line><rect class="bx" height="30" rx="4" width="84" x="572" y="126"></rect><text class="t-s t-b" text-anchor="middle" x="614" y="145">점수</text><text class="t-b t-pos" text-anchor="start" x="672" y="140">✓ 정확</text><text class="t-s t-mut" text-anchor="start" x="672" y="156">토큰·헤드당 FWHT 1번</text><line class="ln-hair" x1="10" x2="820" y1="252" y2="252"></line><text class="t-b" text-anchor="start" x="16" y="216">RoPE 전 캐시</text><text class="t-s t-mut" text-anchor="start" x="16" y="232">KVQuant · RotateKV</text><rect class="bx bx-rot" height="30" rx="4" width="84" x="180" y="2
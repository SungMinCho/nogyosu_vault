  --brass:#AE8C1F; --brass-l:#5A4A17; --brass-d:#7D640F; --brass-top:#D2B04A; --violet:#9570D2; --violet-l:#2D2342; --violet-d:#C2A8EC;
  --verm:#D85E3D; --verm-l:#45241B; --verm-d:#F09A80; --on:#0F1513; --shadow:rgba(0,0,0,.55); --stripe:1.6%; color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#0F1513; --panel:#151D1A; --ink:#DCE3DC; --ink2:#A9B5AD; --ink3:#7F8B84; --rule:#2C3732; --hair:#222C28;
  --umber:#B5702E; --umber-l:#3B2A1B; --blue:#5A86D2; --blue-l:#1C2A42; --blue-d:#9DB8E8;
  --brass:#AE8C1F; --brass-l:#5A4A17; --brass-d:#7D640F; --brass-top:#D2B04A; --violet:#9570D2; --violet-l:#2D2342; --violet-d:#C2A8EC;
  --verm:#D85E3D; --verm-l:#45241B; --verm-d:#F09A80; --on:#0F1513; --shadow:rgba(0,0,0,.55); --stripe:1.6%; color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}a:focus-visible, .frame:focus-visible{ outline:2px solid var(--violet); outline-offset:3px }.cert .frame{ background:transparent }@media (max-width:40em){.cert .frame{ padding:.6rem .2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:.5rem 2rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .4rem }.frame{ overflow-x:auto; background:
  linear-gradient(to right, var(--panel) 30%, transparent), linear-gradient(to left, var(--panel) 30%, transparent) 100% 0,
  radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) 100% 0;
  background-repeat:no-repeat; background-size:40px 100%, 40px 100%, 14px 100%, 14px 100%; background-attachment:local, local, scroll, scroll;
  background-color:var(--panel); border:1px solid var(--rule); padding:.6rem .4rem }.frame svg{ display:block; width:100%; height:auto }svg text{ font-family:var(--f-sans); fill:var(--ink); font-size:13px }svg .tl{ font-size:13.5px }svg .ts{ font-size:12.5px }svg .tx{ font-size:11.5px }svg .tb{ font-weight:700 }svg .tn.tb{ font-weight:600 }svg .t2{ fill:var(--ink2) }svg .t-on{ fill:var(--on) }svg .t-violet-d{ fill:var(--violet-d) }.f-umber{fill:var(--umber)}.f-blue-l{fill:var(--blue-l)}.f-brass{fill:var(--brass)}.f-violet{fill:var(--violet)}.f-panel{fill:var(--panel)}.f-none{fill:none}.s-umber{stroke:var(--umber)}.s-blue{stroke:var(--blue)}.s-violet{stroke:var(--violet)}.s-ink{stroke:var(--ink)}svg line, svg path, svg polyline, svg rect, svg circle{ stroke-width:1 }.sw2{ stroke-width:2 !important }.dash{ stroke-dasharray:5 4 }.ring{ stroke:var(--panel); stroke-width:2 !important }.nostroke{ stroke:none }svg pattern line{ stroke-width:1.1 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="한 장의 지구. 시장의 지면 아래에 인적 자본, 그 위에 순자산 600~700조의 기반암(땅 2/3), 그 위에 짝지어 지워지는 청구권의 탑 약 1,200조, 옆에 짝 없는 금과 코인. 기대가 숨는 세 자리: 땅값, 주식의 q 초과분, 합의 프리미엄. 할인율 r이 모든 값의 분모." height="100%" id="mp" role="img" style="" viewBox="0 0 720 384" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern height="6" id="mp-hb" patternTransform="rotate(45)" patternUnits="userSpaceOnUse" width="6"><line class="s-blue" x1="0" x2="0" y1="0" y2="6"></line></pattern><pattern height="6" id="mp-hu" patternTransform="rotate(45)" patternUnits="userSpaceOnUse" width="6"><line class="s-umber" x1="0" x2="0" y1="0" y2="6"></line></pattern><marker id="mp-av" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-violet" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="f-blue-l" height="160.0" rx="3" width="330.0" x="200.0" y="70.0"></rect><rect class="nostroke" fill="url(#mp-hb)" height="160" rx="3" width="330" x="200" y="70"><title>청구권의 탑 약 1,200조 달러 — 짝지어 지워짐</title></rect><rect class="f-panel" height="64.0" rx="3" width="286.0" x="222.0" y="96.0"></rect><text class="tl tb" text-anchor="middle" x="365.0" y="118.0">청구권의 탑 ≈ 1,200조</text><text class="tx" text-anchor="middle" x="365.0" y="136.0">예금 · 채권 161 · 주식 152~158 · 대출</text><text class="tx t2" text-anchor="middle" x="365.0" y="152.0">+ − 짝 → 더하면 0 · 부채 365.5조 = GDP 310%</text><rect class="f-umber" height="80.0" rx="3" width="330.0" x="200.0" y="236.0"><title>시장 가격 순자산 600~700조 달러</title></rect><text class="tl tb t-on" text-anchor="start" x="214.0" y="262.0">기반암: 순자산 600~700조</text><text class="tx t-on" text-anchor="start" x="214.0" y="282.0">땅·건물 ≈ 2/3 · 기계·인프라·무형·광물 ≈ 1/5</text><text class="tx t-on" text-anchor="start" x="214.0" y="300.0">= 세계 GDP 118조의 5~6년치</text><rect class="f-brass" height="40.0" rx="3" width="46.0" x="548.0" y="276.0"><title>금 약 30조 + 암호자산 약 2.6조 — 짝 없음</title></rect><text class="tx" text-anchor="start" x="604.0" y="300.0">금 30 · 코인 2.6</text><text class="tx t2" text-anchor="start" x="604.0" y="314.0">≈ 순자산의 5%</text><line class="s-ink sw2" x1="30.0" x2="700.0" y1="320.0" y2="320.0"></line><text class="tx t2" text-anchor="start" x="30.0" y="312.0">시장의 지면</text><rect class="f-panel" height="46.0" rx="3" width="330.0" x="200.0" y="326.0"></rect><rect class="nostroke" fill="url(#mp-hu)" height="46" rx="3" width="330" x="200" y="326"><title>인적 자본 — 2018년 포괄적 부의 64%</title></rect><rect class="f-panel" height="24.0" rx="3" width="258.0" x="236.0" y="337.0"></rect><text class="tx" text-anchor="middle" x="365.0" y="354.0">사람 · 인적 자본 (시장 밖, 2018년 포괄적 부의 64%)</text><circle class="f-violet ring" cx="514.0" cy="250.0" r="10"></circle><text class="tx t-on" text-anchor="middle" x="514.0" y="254.5">①</text><circle class="f-violet ring" cx="512.0" cy="84.0" r="10"></circle><text class="tx t-on" text-anchor="middle" x="512.0" y="88.5">②</text><circle class="f-violet ring" cx="571.0" cy="262.0" r="10"></circle><text class="tx t-on" text-anchor="middle" x="571.0" y="266.5">③</text><text class="tx" text-anchor="start" x="548.0" y="92.0">② 주식의 q 초과분</text><text class="tx t2" text-anchor="start" x="548.0" y="108.0">미국 2.4 · 다른 나라 ≈1.0</text><text class="tx" text-anchor="start" x="604.0" y="266.0">③ 합의 프리미엄</text><text class="tx t2" text-anchor="start" x="604.0" y="280.0">실질 금값 12.5</text><text class="tx" text-anchor="start" x="30.0" y="240.0">① 땅값</text><text class="tx t2" text-anchor="start" x="30.0" y="256.0">할인율에 가장 민감</text><circle class="f-panel s-violet sw2" cx="86.0" cy="120.0" r="34"></circle><line class="s-violet" x1="61.8" x2="56.6" y1="106.0" y2="103.0"></line><line class="s-violet" x1="68.0" x2="64.1" y1="98.6" y2="94.0"></line><line class="s-violet" x1="76.4" x2="74.4" y1="93.7" y2="88.1"></line><line class="s-violet" x1="86.0" x2="86.0" y1="92.0" y2="86.0"></line><line class="s-violet" x1="95.6" x2="97.6" y1="93.7" y2="88.1"></line><line class="s-violet" x1="104.0" x2="107.9" y1="98.6" y2="94.0"></line><line class="s-violet" x1="110.2" x2="115.4" y1="106.0" y2="103.0"></line><line class="s-violet sw2" x1="86.0" x2="99.0" y1="120.0" y2="97.5"></line><circle class="f-violet" cx="86.0" cy="120.0" r="3"></circle><text class="tl tb" text-anchor="middle" x="86.0" y="142.0">r</text><text class="ts tb" text-anchor="middle" x="86.0" y="172.0">할인율 r</text><text class="tx t2" text-anchor="middle" x="86.0" y="188.0">40년 하강 → 2021 반전</text><text class="tx t2" text-anchor="middle" x="86.0" y="202.0">TIPS −1.19 → 2.9%</text><path class="s-violet f-none sw2 dash" d="M122,114 C150,100 170,100 196,110" marker-end="url(#mp-av)"></path><path class="s-violet f-none sw2 dash" d="M112,144 C170,150 178,250 196,262" marker-end="url(#mp-av)"></path><text class="tx t-violet-d" text-anchor="middle" x="150.0" y="64.0">모든 나무의 분모</text><text class="tx t2" text-anchor="start" x="30.0" y="28.0">분자 g: 성장 기대 · 가장자리의 간절함: 흐름은 회계로 0, 수요로 ×5</text></svg></svg>
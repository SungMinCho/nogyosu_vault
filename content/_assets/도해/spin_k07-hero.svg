<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 330 196" width="330" height="196" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.doc > .masthead, .doc > .toc, .doc > .colophon{ max-width:var(--shell) }.masthead{ display:grid; grid-template-columns:minmax(0,1fr); gap:1.4rem; padding-block:1.2rem .6rem; border-bottom:1px solid var(--line) }@media (min-width:52em){.masthead{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:end }}.mast-fig{ min-width:0 }.hero-svg{ max-width:26rem; margin-inline:auto }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }svg.pz-root{width:330px!important;height:196px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w masthead"><g class="pz-w mast-fig"><svg xmlns="http://www.w3.org/2000/svg" aria-label="회전이라는 줄기에서 일곱 가지 갈래가 뻗어 나가는 나무" class="dg hero-svg pz-inner" height="100%" role="img" viewBox="0 0 330 196" width="100%"><rect class="bx-rot" height="36" rx="5" width="70" x="8" y="82"></rect><text class="t-b t-rot" text-anchor="middle" x="43" y="104">회전</text><path class="ln ln-rot" d="M 80 100 C 120 100, 120 18, 160 18"></path><text class="t-s t-b" text-anchor="start" x="166" y="22">DuQuant</text><text class="t-s t-mut" text-anchor="start" x="250" y="22">설계</text><path class="ln ln-rot" d="M 80 100 C 120 100, 120 43, 160 43"></path><text class="t-s t-b" text-anchor="start" x="166" y="47">DFRot</text><text class="t-s t-mut" text-anchor="start" x="250" y="47">스파이크</text><path class="ln ln-rot" d="M 80 100 C 120 100, 120 68, 160 68"></path><text class="t-s t-b" text-anchor="start" x="166" y="72">FlatQuant</text><text class="t-s t-mut" text-anchor="start" x="250" y="72">아핀</text><path class="ln ln-rot" d="M 80 100 C 120 100, 120 93, 160 93"></path><text class="t-s t-b" text-anchor="start" x="166" y="97">OSTQuant</text><text class="t-s t-mut" text-anchor="start" x="250" y="97">축척</text><path class="ln ln-rot" d="M 80 100 C 120 100, 120 118, 160 118"></path><text class="t-s t-b" text-anchor="start" x="166" y="122">ResQ</text><text class="t-s t-mut" text-anchor="start" x="250" y="122">혼합 정밀도</text><path class="ln ln-rot" d="M 80 100 C 120 100, 120 143, 160 143"></path><text class="t-s t-b" text-anchor="start" x="166" y="147">PrefixQuant</text><text class="t-s t-mut" text-anchor="start" x="250" y="147">토큰</text><path class="ln ln-rot" d="M 80 100 C 120 100, 120 168, 160 168"></path><text class="t-s t-b" text-anchor="start" x="166" y="172">학습 논쟁</text><text class="t-s t-mut" text-anchor="start" x="250" y="172">…</text></svg></g></g></g></svg>
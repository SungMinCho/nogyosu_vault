<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 330" width="800" height="330" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .t-grid{ fill:var(--grid) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-spike{ stroke:var(--spike) }.dg .ln-stream{ stroke:var(--rot); stroke-width:3 }.dg .f-ink{ fill:var(--ink) }.dg .f-rot{ fill:var(--rot) }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-spike{ fill:var(--spike-soft); stroke:var(--spike) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.dg .ssub{ font-size:8px }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="디코더 층 하나의 연산들을 회전을 통과시키는 것, 흡수하면 통과하는 것, 막는 것으로 색칠한 그림. 막는 것은 모두 블록 안쪽에 있다" class="dg" height="100%" role="img" style="" viewBox="0 0 800 330" width="100%"><defs><marker id="g1-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="g1-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="ln-stream" x1="20" x2="780" y1="38" y2="38"></line><text class="t-s t-rot" text-anchor="start" x="24" y="30">잔차 흐름 h (본선)</text><text class="t-s t-b" text-anchor="end" x="780" y="30">① 어텐션 쪽</text><rect class="bx-rot" height="40" rx="4" width="92" x="30" y="60"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="76" y="77">÷ rms</text><text class="t-s t-mut" text-anchor="middle" x="76" y="92">길이 맞추기</text><line class="ln" marker-end="url(#g1-ink)" x1="123" x2="134" y1="80" y2="80"></line><rect class="bx-grid" height="40" rx="4" width="92" x="136" y="60"></rect><text class="t-s t-b t-grid" text-anchor="middle" x="182" y="77">⊙ γ</text><text class="t-s t-mut" text-anchor="middle" x="182" y="92">원소별 배율</text><line class="ln" marker-end="url(#g1-ink)" x1="229" x2="240" y1="80" y2="80"></line><rect class="bx-rot" height="40" rx="4" width="92" x="242" y="60"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="288" y="77">W<tspan class="ssub" dy="3">q</tspan><tspan dy="-3">​</tspan> W<tspan class="ssub" dy="3">k</tspan><tspan dy="-3">​</tspan> W<tspan class="ssub" dy="3">v</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="288" y="92">입구</text><line class="ln" marker-end="url(#g1-ink)" x1="335" x2="346" y1="80" y2="80"></line><rect class="bx-spike" height="40" rx="4" width="92" x="348" y="60"></rect><text class="t-s t-b t-spike" text-anchor="middle" x="394" y="77">RoPE</text><text class="t-s t-mut" text-anchor="middle" x="394" y="92">Q, K에만</text><line class="ln" marker-end="url(#g1-ink)" x1="441" x2="452" y1="80" y2="80"></line><rect class="bx-spike" height="40" rx="4" width="92" x="454" y="60"></rect><text class="t-s t-b t-spike" text-anchor="middle" x="500" y="77">softmax · V</text><text class="t-s t-mut" text-anchor="middle" x="500" y="92">토큰 섞기</text><line class="ln" marker-end="url(#g1-ink)" x1="547" x2="558" y1="80" y2="80"></line><rect class="bx-rot" height="40" rx="4" width="92" x="560" y="60"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="606" y="77">W<tspan class="ssub" dy="3">o</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="606" y="92">출구</text><line class="ln" marker-end="url(#g1-ink)" x1="653" x2="664" y1="80" y2="80"></line><rect class="bx-rot" height="40" rx="4" width="92" x="666" y="60"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="712" y="77">+</text><text class="t-s t-mut" text-anchor="middle" x="712" y="92">본선에</text><line class="ln ln-rot" marker-end="url(#g1-rot)" x1="76" x2="76" y1="38" y2="58"></line><line class="ln ln-rot" marker-end="url(#g1-rot)" x1="712" x2="712" y1="58" y2="40"></line><path class="ln ln-spike" d="M 336 112 L 336 118 L 558 118 L 558 112"></path><text class="t-s t-spike" text-anchor="middle" x="447" y="134">블록 안쪽 — 입구와 출구 사이</text><line class="ln-stream" x1="20" x2="780" y1="188" y2="188"></line><text class="t-s t-rot" text-anchor="start" x="24" y="180">잔차 흐름 h</text><text class="t-s t-b" text-anchor="end" x="780" y="180">② FFN 쪽</text><rect class="bx-rot" height="40" rx="4" width="92" x="30" y="210"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="76" y="227">÷ rms</text><text class="t-s t-mut" text-anchor="middle" x="76" y="242">길이 맞추기</text><line class="ln" marker-end="url(#g1-ink)" x1="123" x2="134" y1="230" y2="230"></line><rect class="bx-grid" height="40" rx="4" width="92" x="136" y="210"></rect><text class="t-s t-b t-grid" text-anchor="middle" x="182" y="227">⊙ γ</text><text class="t-s t-mut" text-anchor="middle" x="182" y="242">원소별 배율</text><line class="ln" marker-end="url(#g1-ink)" x1="229" x2="240" y1="230" y2="230"></line><rect class="bx-rot" height="40" rx="4" width="92" x="242" y="210"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="288" y="227">W<tspan class="ssub" dy="3">gate</tspan><tspan dy="-3">​</tspan> W<tspan class="ssub" dy="3">up</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="288" y="242">입구</text><line class="ln" marker-end="url(#g1-ink)" x1="335" x2="346" y1="230" y2="230"></line><rect class="bx-spike" height="40" rx="4" width="92" x="348" y="210"></rect><text class="t-s t-b t-spike" text-anchor="middle" x="394" y="227">SiLU ⊙</text><text class="t-s t-mut" text-anchor="middle" x="394" y="242">원소별 비선형</text><line class="ln" marker-end="url(#g1-ink)" x1="441" x2="452" y1="230" y2="230"></line><rect class="bx-rot" height="40" rx="4" width="92" x="454" y="210"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="500" y="227">W<tspan class="ssub" dy="3">down</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="500" y="242">출구</text><line class="ln" marker-end="url(#g1-ink)" x1="547" x2="558" y1="230" y2="230"></line><rect class="bx-rot" height="40" rx="4" width="92" x="560" y="210"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="606" y="227">+</text><text class="t-s t-mut" text-anchor="middle" x="606" y="242">본선에</text><line class="ln ln-rot" marker-end="url(#g1-rot)" x1="76" x2="76" y1="188" y2="208"></line><line class="ln ln-rot" marker-end="url(#g1-rot)" x1="606" x2="606" y1="208" y2="190"></line><path class="ln ln-spike" d="M 336 262 L 336 268 L 452 268 L 452 262"></path><text class="t-s t-spike" text-anchor="middle" x="394" y="284">블록 안쪽 — 입구와 출구 사이</text><rect class="bx-rot" height="12" rx="2" width="12" x="30" y="304"></rect><text class="t-s" text-anchor="start" x="48" y="314">회전을 통과 (행렬 곱 · 덧셈 · 길이 맞추기)</text><rect class="bx-grid" height="12" rx="2" width="12" x="320" y="304"></rect><text class="t-s" text-anchor="start" x="338" y="314">손쓰면 통과 (흡수)</text><rect class="bx-spike" height="12" rx="2" width="12" x="470" y="304"></rect><text class="t-s" text-anchor="start" x="488" y="314">통과 못 함 (비선형 · 위치)</text></svg></svg>
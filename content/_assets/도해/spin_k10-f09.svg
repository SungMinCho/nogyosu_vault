<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 300" width="800" height="300" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-doubt{ fill:var(--doubt) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .f-ink{ fill:var(--ink) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-pos{ fill:var(--pos-soft); stroke:var(--pos) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.dg .ln-ink{ stroke:var(--ink) }.lecture > .frame{ max-width:var(--wide) }.dg .bx-doubt{ fill:var(--doubt-soft); stroke:var(--doubt) }.dg .ln-doubt{ stroke:var(--doubt) }.dg .f-doubt{ fill:var(--doubt) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="훈련 선택 네 가지가 이상치를 줄였고, 이 강의에서 본 새 훈련 선택들도 이상치의 모양을 바꿀 수 있으니 처방의 순위를 내 모델에서 다시 재야 한다" class="dg" height="100%" role="img" style="" viewBox="0 0 800 300" width="100%"><defs><marker id="m7-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="m7-doubt" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-doubt" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-s t-b" text-anchor="start" x="20" y="28">2023 · 아마디안 등: 훈련 손잡이 넷</text><rect class="bx-grid" height="34" rx="5" width="110" x="20" y="40"></rect><text class="t-s t-b" text-anchor="middle" x="75" y="61">가중치 감쇠 ↑</text><rect class="bx-grid" height="34" rx="5" width="110" x="140" y="40"></rect><text class="t-s t-b" text-anchor="middle" x="195" y="61">드롭아웃 ↓</text><rect class="bx-grid" height="34" rx="5" width="110" x="260" y="40"></rect><text class="t-s t-b" text-anchor="middle" x="315" y="61">그래디언트 클리핑</text><rect class="bx-grid" height="34" rx="5" width="110" x="380" y="40"></rect><text class="t-s t-b" text-anchor="middle" x="435" y="61">fp16 → bf16</text><path class="ln ln-ink" d="M500,57 L548,57" marker-end="url(#m7-ink)"></path><rect class="bx-pos" height="44" rx="5" width="228" x="552" y="36"></rect><text class="t-s t-b" text-anchor="middle" x="666" y="54">이상치가 준다</text><text class="t-s t-mut" text-anchor="middle" x="666" y="70">52B · W8A8 손실 0.26%</text><text class="t-s t-b" text-anchor="start" x="20" y="128">이 강의에서 본 새 훈련·설계 선택</text><rect class="bx-rot" height="40" rx="5" width="110" x="20" y="140"></rect><text class="t-s t-b" text-anchor="middle" x="75" y="158">QK-norm</text><text class="t-s t-mut" text-anchor="middle" x="75" y="172">8강</text><rect class="bx-rot" height="40" rx="5" width="110" x="140" y="140"></rect><text class="t-s t-b" text-anchor="middle" x="195" y="158">NoPE 층 (Llama 4)</text><text class="t-s t-mut" text-anchor="middle" x="195" y="172">8강</text><rect class="bx-rot" height="40" rx="5" width="110" x="260" y="140"></rect><text class="t-s t-b" text-anchor="middle" x="315" y="158">FP8 · FP4 훈련</text><text class="t-s t-mut" text-anchor="middle" x="315" y="172">9강</text><rect class="bx-rot" height="40" rx="5" width="110" x="380" y="140"></rect><text class="t-s t-b" text-anchor="middle" x="435" y="158">역전파의 하다마드</text><text class="t-s t-mut" text-anchor="middle" x="435" y="172">9강</text><path class="ln ln-ink" d="M500,160 L548,160" marker-end="url(#m7-ink)"></path><rect class="bx-doubt" height="48" rx="5" width="228" x="552" y="136"></rect><text class="t-s t-b t-doubt" text-anchor="middle" x="666" y="156">이상치의 모양이 바뀔 수 있다</text><text class="t-s t-mut" text-anchor="middle" x="666" y="172">(조사자의 추론)</text><path class="ln ln-doubt" d="M666,186 L666,222" marker-end="url(#m7-doubt)"></path><rect class="bx" height="52" rx="5" width="304" x="476" y="226"></rect><text class="t-s" text-anchor="middle" x="628" y="247">LLaMA-2에서 잰 처방의 순위가</text><text class="t-s t-b" text-anchor="middle" x="628" y="264">내 모델에서도 같을까? → 적부터 잰다</text><text class="t-s t-mut" text-anchor="start" x="20" y="246">과녁이 움직이면, 과녁을 쏜 기록(표)도</text><text class="t-s t-mut" text-anchor="start" x="20" y="264">그 과녁에서의 기록일 뿐이다.</text></svg></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 430" width="600" height="430" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --flour:#EFF0EB; --flour-2:#E6E8E1; --ink:#1C2025; --ink-soft:#4E555D; --rule:#C7CAC1;
  --iron:#3D4652; --water:#1B7480; --spirit:#6448B0; --grain:#A8721A; --rust:#BF4128;
  --water-t:rgba(27,116,128,.12); --spirit-t:rgba(100,72,176,.11); --grain-t:rgba(168,114,26,.13); --rust-t:rgba(191,65,40,.10); --iron-t:rgba(61,70,82,.10);
  --shadow:rgba(28,32,37,.18);
  --display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --body:"Newsreader","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --label:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","Nanum Gothic Coding",ui-monospace,Menlo,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }}:root[data-theme="dark"]{
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents }.lec-no svg{ width:2.2rem; height:2.2rem; flex:none }.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; overflow-y:hidden; border-block:1px solid var(--rule); padding-block:.8rem; background:linear-gradient(to right, var(--flour) 30%, transparent), linear-gradient(to left, var(--flour) 30%, transparent) 100% 0, radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) 100% 0; background-repeat:no-repeat; background-size:2.2rem 100%, 2.2rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; margin-inline:auto; max-width:46rem }.t{ fill:var(--ink); font-family:var(--label); font-size:13px }.t-soft{ fill:var(--ink-soft) }.t-iron{ fill:var(--iron) }.t-water{ fill:var(--water) }.t-spirit{ fill:var(--spirit) }.t-rust{ fill:var(--rust) }.t-b{ font-weight:600 }.t-sm{ font-size:11.5px }.t-mono{ font-family:var(--mono) }.s-ink{ stroke:var(--ink); fill:none }.s-soft{ stroke:var(--ink-soft); fill:none }.s-rule{ stroke:var(--rule); fill:none }.s-iron{ stroke:var(--iron); fill:none }.s-water{ stroke:var(--water); fill:none }.s-spirit{ stroke:var(--spirit); fill:none }.s-rust{ stroke:var(--rust); fill:none }.f-bg{ fill:var(--flour) }.f-panel{ fill:var(--flour-2) }.f-ink{ fill:var(--ink) }.f-iron{ fill:var(--iron) }.f-water{ fill:var(--water) }.f-spirit{ fill:var(--spirit) }.f-water-t{ fill:var(--water-t) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.dash{ stroke-dasharray:5 4 }svg.pz-root{width:600px!important;height:430px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="기계 의식 가설의 검증 설계 — 교과과정 세 단계(서열 예측 → 영상 예측 → 로봇 상호작용) 동안 학습 효율 η의 연속 상승이 아닌 계단형 점화와 과제 간 전이를 찾는다. 크기는 생쥐 수준, 고양이 이하(곡선은 구성한 예)." class="pz-inner" data-min="540" height="100%" role="img" style="" viewBox="0 0 600 430" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="f25-ax" markerHeight="7" markerWidth="7" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f25-w" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-water" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<text class="t t-b" x="20" y="24">세포형 강화학습 단위들의 교과과정</text>
<text class="t t-sm t-rust" text-anchor="end" x="580" y="24">구성한 예 — 수치는 지어낸 것</text>
<!-- 교과과정 세 단계 띠 -->
<rect class="f-water-t" height="242" width="240" x="70" y="40"></rect>
<rect class="f-panel" height="242" width="168" x="310" y="40"></rect>
<rect class="f-water-t" height="242" width="102" x="478" y="40"></rect>
<text class="t t-b t-water" text-anchor="middle" x="190" y="60">① 서열 예측</text>
<text class="t t-b t-water" text-anchor="middle" x="394" y="60">② 영상 예측</text>
<text class="t t-b t-water" text-anchor="middle" x="529" y="60">③ 로봇</text>
<text class="t t-sm t-water" text-anchor="middle" x="529" y="78">상호작용</text>
<line class="s-water w15" marker-end="url(#f25-w)" x1="276" x2="300" y1="68" y2="68"></line>
<line class="s-water w15" marker-end="url(#f25-w)" x1="444" x2="468" y1="68" y2="68"></line>
<!-- 축 -->
<line class="s-ink w15" marker-end="url(#f25-ax)" x1="70" x2="584" y1="282" y2="282"></line>
<line class="s-ink w15" marker-end="url(#f25-ax)" x1="70" x2="70" y1="282" y2="84"></line>
<text class="t t-b" text-anchor="end" x="64" y="96">η</text>
<text class="t t-sm t-soft" text-anchor="end" x="64" y="114">(×10⁻⁶</text>
<text class="t t-sm t-soft" text-anchor="end" x="64" y="130">/표본)</text>
<line class="s-ink w1" x1="64" x2="70" y1="258" y2="258"></line>
<text class="t t-sm t-mono" text-anchor="end" x="58" y="262">1</text>
<text class="t t-sm t-mono" text-anchor="end" x="58" y="160">8</text>
<line class="s-ink w1" x1="64" x2="70" y1="156" y2="156"></line>
<text class="t t-sm t-soft" text-anchor="end" x="580" y="302">누적 자료 표본 →</text>
<text class="t t-sm t-mono" text-anchor="middle" x="70" y="302">0</text>
<line class="s-ink w1" x1="214" x2="214" y1="282" y2="288"></line>
<text class="t t-sm t-mono t-spirit" text-anchor="middle" x="214" y="302">1.2×10⁷</text>
<!-- 대조: 연속 상승 -->
<path class="s-soft w2 dash" d="M70,258 C200,252 330,214 572,190"></path>
<text class="t t-sm t-soft" text-anchor="end" x="572" y="228">연속 상승 — 점화 아님</text>
<!-- 과제 특화: 새 과제에서 다시 1 -->
<path class="s-rust w15 dash" d="M310,156 V258 H476"></path>
<text class="t t-sm t-rust" text-anchor="middle" x="394" y="250">η 다시 1 — 과제 특화</text>
<!-- 점화: 계단 -->
<path class="s-spirit w3" d="M70,258 H214 V156 H478"></path>
<path class="s-spirit w3 dash" d="M478,156 H572"></path>
<circle class="f-spirit" cx="214" cy="156" r="5"></circle>
<text class="t t-b t-spirit" x="220" y="146">점화 · 8배</text>
<text class="t t-sm t-spirit" text-anchor="middle" x="142" y="275">+1점 / 10⁶표본</text>
<text class="t t-sm t-spirit" text-anchor="middle" x="394" y="146">높은 η 유지 = 전이</text>
<text class="t t-sm t-spirit" text-anchor="middle" x="394" y="174">+8점 / 10⁶표본</text>
<text class="t t-sm t-soft" text-anchor="middle" x="142" y="238">꾸준하지만 밋밋</text>
<!-- 판정 -->
<text class="t t-sm" x="20" y="330">판정: 계단(불연속)과 과제 간 전이가 함께 보여야 점화 쪽에 무게</text>
<!-- 크기 상한 -->
<text class="t t-b" x="20" y="364">체계의 크기</text>
<line class="s-rule w3" x1="120" x2="580" y1="380" y2="380"></line>
<line class="s-iron w3" x1="120" x2="372" y1="380" y2="380"></line>
<circle class="f-iron" cx="250" cy="380" r="7"></circle>
<text class="t t-sm t-iron t-b" text-anchor="middle" x="250" y="406">생쥐 수준 — 목표</text>
<line class="s-rust w3" x1="372" x2="372" y1="366" y2="394"></line>
<text class="t t-sm t-rust t-b" text-anchor="middle" x="372" y="360">고양이 — 상한</text>
<text class="t t-sm t-soft" text-anchor="middle" x="372" y="422">넘지 않는다</text>
<circle class="f-bg s-soft w15" cx="530" cy="380" r="6"></circle>
<text class="t t-sm t-soft" text-anchor="middle" x="530" y="406">사람 수준</text>
<text class="t t-sm t-soft" text-anchor="middle" x="530" y="422">한참 아래에 둔다</text>
</svg></g></g></g></g></svg>
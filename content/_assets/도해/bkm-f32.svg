ransition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w wrap"><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="대출 100건, 각 부도확률 5퍼센트인 풀에서 부도 건수가 k건 이상일 확률. 시니어 트랑셰가 손실을 보는 17건 이상의 확률이 대출이 독립이면 0.0009퍼센트, 잠재 상관 0.05면 0.46퍼센트, 0.3이면 6.9퍼센트다. 평균 부도 건수는 셋 다 5건이다." class="dg pz-inner" height="100%" role="img" viewBox="0 0 640 380" width="100%">

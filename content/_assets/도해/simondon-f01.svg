<text class="t t-b t-liq" text-anchor="middle" x="151" y="322">전개체적 실재</text>
<text class="t-s t-mute" text-anchor="middle" x="151" y="338">통일성 이상</text>
<rect class="f-panel" height="48" width="150" x="286" y="238"></rect>
<path class="f-none s-ink w15 round" d="M300,238 L286,238 L286,286 L300,286"></path>
<path class="f-none s-ink w15 round" d="M422,238 L436,238 L436,286 L422,286"></path>
<text class="t t-b" text-anchor="middle" x="361" y="258">작용</text>
<text class="t" text-anchor="middle" x="361" y="276">= 위상 변이</text>
<line class="s-ink w15" marker-end="url(#f01-ar-ink)" x1="230" x2="283" y1="262" y2="262"></line>
<line class="s-ink w15" marker-end="url(#f01-ar-ink)" x1="438" x2="484" y1="262" y2="262"></line>

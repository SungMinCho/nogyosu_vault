in-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w dia"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="수평 샤머니즘에서는 죽은 이와 동물이 산 사람 바깥의 한 자리(타자)에 겹쳐 있다. 그 자리가 둘로 갈라지면 죽은 이는 위로 올라가 조상이 되고 동물은 사람 아래로 떠내려가 대상화되며, 그때 수직 샤먼이 선다. 그러나 아마존에서는 이 갈라짐이 끝내 완결되지 않는다." class="d pz-inner" height="100%" role="img" viewBox="0 0 720 654" width="100%">

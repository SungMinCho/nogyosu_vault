<text class="t-lab" x="190" y="190">내가 앎</text>
<text class="t-lab" x="380" y="156">『순수의 시대』</text>
<text class="t-small" x="380" y="173">아내도 알았다 — 계단을 못 오른다</text>
<text class="t-lab" x="380" y="198">『황금 잔』의 거짓말 그물</text>
<text class="t-small" x="380" y="215">넷이 함께 빨간 선 아래로 붙든다</text>

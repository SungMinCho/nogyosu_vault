><text class="tx" text-anchor="start" x="296.8" y="106.0">23%</text><text class="ts tb" text-anchor="start" x="430.2" y="90.0">기계·인프라·무형·광물</text><text class="tx" text-anchor="start" x="430.2" y="106.0">약 20%</text><line class="s-ink3" x1="568.1" x2="568.1" y1="116.0" y2="132.0"></line><text class="tx" text-anchor="middle" x="568.1" y="146.0">나머지 ≈11%</text><text class="tx" text-anchor="middle" x="478.2" y="146.0">그중 무형자산 4%</text><line class="s-ink3" x1="478.2" x2="478.2" y1="116.0" y2="132.0"></line><path class="s-ink2 f-none" d="M20,62 q0,-7 7,-7 L213.1,55 q7,0 7,-7 q0,7 7,7 L413.2,55 q7,0 7,7"></path><text class="tl tb" text-anchor="middle" x="220.1" y="48.0">부동산 ≈ 3분의 2</text><path class="s-ink2 f-none" d="M420.2,62 q0,-7 7,-7 L471.20000000000005,55 q7,0 7,-7 q0,7 7,7 L529.2,55 q7,0 7,7"></path><text class="tl" text-anchor="middle" x="478.2" y="48.0">≈ 5분의 1</text></svg></svg>
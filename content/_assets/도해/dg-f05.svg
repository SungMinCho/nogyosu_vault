<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 362" width="720" height="362" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2{ stroke:var(--ink-2); }.f-ink2-t{ fill:var(--ink-2); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-indigo-f{ fill:var(--indigo-soft); }.f-madder{ stroke:var(--madder); }.f-madder-t{ fill:var(--madder); }.f-madder-f{ fill:var(--madder-soft); }.f-ochre{ stroke:var(--ochre); }.f-ochre-t{ fill:var(--ochre); }.f-ochre-f{ fill:var(--ochre-soft); }.f-mend-t{ fill:var(--mend); }.f-none{ fill:none; }.f-dash{ stroke-dasharray:6 5; }.f-dot{ stroke-dasharray:2 4; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-b{ font-weight:700; }svg .halo{ paint-order:stroke; stroke:var(--panel); stroke-width:4px; stroke-linejoin:round; }svg.pz-root{width:720px!important;height:362px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="대지의 충만한 몸 위로 내려오는 세로줄이 흐름에서 채취된 출계의 재고(위치 에너지)이고, 그 사이를 건너는 가로줄이 리니지에서 리니지로 옮겨 가는 결연의 부채 블록(운동 에너지)이며 고리를 닫지 않고 열린 채 이어진다. 마디마다 혼인 하나, 아이 하나가 등록되고, 이탈이 흐름 쪽에 넘침과 모자람을 남기는 그 불균형이 코드의 잉여가치다." class="pz-inner" height="100%" role="img" viewBox="0 0 720 362" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f05-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f05-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f05-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f05-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f05-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f05-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f05-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="f-ochre f-none" stroke-width="2.6" x1="16" x2="44" y1="22" y2="22"></line><text class="f-ochre-t t-s" text-anchor="start" x="52" y="26">출계 — 채취된 재고, 위치 에너지</text><line class="f-madder f-none" stroke-width="1.8" x1="376" x2="404" y1="22" y2="22"></line><rect class="f-madder f-madder-f" height="12" rx="1" stroke-width="1.2" width="12" x="384" y="16"></rect><text class="f-madder-t t-s" text-anchor="start" x="412" y="26">결연 — 이동하는 부채 블록, 운동 에너지</text><rect class="f-ochre f-ochre-f" height="34" rx="3" stroke-width="1.6" width="704" x="8" y="318"></rect><text class="f-ochre-t t-b" text-anchor="middle" x="360" y="340">대지의 충만한 몸</text><line class="f-ochre f-none" marker-end="url(#f05-a-ochre)" stroke-width="2.2" x1="96" x2="96" y1="52" y2="278"></line><rect class="f-ochre f-ochre-f" height="10" rx="1" stroke-width="1.2" width="28" x="82" y="284"></rect><rect class="f-ochre f-ochre-f" height="10" rx="1" stroke-width="1.2" width="28" x="82" y="295"></rect><rect class="f-ochre f-ochre-f" height="10" rx="1" stroke-width="1.2" width="28" x="82" y="306"></rect><line class="f-ochre f-none" marker-end="url(#f05-a-ochre)" stroke-width="2.2" x1="216" x2="216" y1="52" y2="278"></line><rect class="f-ochre f-ochre-f" height="10" rx="1" stroke-width="1.2" width="28" x="202" y="284"></rect><rect class="f-ochre f-ochre-f" height="10" rx="1" stroke-width="1.2" width="28" x="202" y="295"></rect><rect class="f-ochre f-ochre-f" height="10" rx="1" stroke-width="1.2" width="28" x="202" y="306"></rect><line class="f-ochre f-none" marker-end="url(#f05-a-ochre)" stroke-width="2.2" x1="336" x2="336" y1="52" y2="278"></line><rect class="f-ochre f-ochre-f" height="10" rx="1" stroke-width="1.2" width="28" x="322" y="284"></rect><rect class="f-ochre f-ochre-f" height="10" rx="1" stroke-width="1.2" width="28" x="322" y="295"></rect><rect class="f-ochre f-ochre-f" height="10" rx="1" stroke-width="1.2" width="28" x="322" y="306"></rect><line class="f-ochre f-none" marker-end="url(#f05-a-ochre)" stroke-width="2.2" x1="456" x2="456" y1="52" y2="278"></line><rect class="f-ochre f-ochre-f" height="10" rx="1" stroke-width="1.2" width="28" x="442" y="284"></rect><rect class="f-ochre f-ochre-f" height="10" rx="1" stroke-width="1.2" width="28" x="442" y="295"></rect><rect class="f-ochre f-ochre-f" height
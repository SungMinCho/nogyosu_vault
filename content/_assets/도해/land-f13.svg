<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 740 296" width="740" height="296" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-xs{ font-size:10.5px }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-ledgersoft{ fill:var(--ledger-soft) }.fig .f-blood{ fill:var(--blood) }.fig .s-ink{ stroke:var(--ink) }.fig .s-mute{ stroke:var(--ink-2) }.fig .s-zero{ stroke:var(--zero) }.fig .s-ledger{ stroke:var(--ledger) }.fig .w1{ stroke-width:1 }.fig .w15{ stroke-width:1.5 }.fig .w2{ stroke-width:2 }.fig .w3{ stroke-width:3 }.fig .dash{ stroke-dasharray:5 4 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="아퀴나스에게 피조물은 존재를 매 순간 받고 있어서, 신이 주기를 그치면 저절로 무로 떨어진다. 랜드는 그 떨어짐이 피조물 자신의 경향이라는 데 주목한다." height="100%" role="img" style="--minw:681px" viewBox="0 0 740 296" width="100%"><defs><marker id="conservation-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="conservation-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="conservation-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="conservation-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="conservation-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="conservation-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><rect class="f-ledgersoft s-ledger" height="34" rx="5" width="140" x="300" y="14"></rect><text class="t-b" text-anchor="middle" x="370" y="35.5">신의 작용</text><line class="s-ledger" x1="370" x2="370" y1="48" y2="64"></line><line class="s-ledger" x1="150" x2="510" y1="64" y2="64"></line><line class="s-ledger w15" marker-end="url(#conservation-ledger)" x1="150" x2="150" y1="64" y2="122"></line><line class="s-ledger w15" marker-end="url(#conservation-ledger)" x1="210" x2="210" y1="64" y2="122"></line><line class="s-ledger w15" marker-end="url(#conservation-ledger)" x1="270" x2="270" y1="64" y2="122"></line><line class="s-ledger w15" marker-end="url(#conservation-ledger)" x1="330" x2="330" y1="64" y2="122"></line><line class="s-ledger w15" marker-end="url(#conservation-ledger)" x1="390" x2="390" y1="64" y2="122"></line><line class="s-ledger w15" marker-end="url(#conservation-ledger)" x1="450" x2="450" y1="64" y2="122"></line><line class="s-ledger w15" marker-end="url(#conservation-ledger)" x1="510" x2="510" y1="64" y2="122"></line><line class="s-mute dash w1" x1="510" x2="640" y1="64" y2="64"></line><line class="s-mute dash w1" x1="570" x2="570" y1="64" y2="116"></line><line class="s-mute dash w1" x1="630" x2="630" y1="64" y2="116"></line><text class="t-b f-ledger" x="20" y="88">보존</text><text class="t-s f-mute" x="20" y="106">매 순간 같은 작용</text><line class="s-ledger w2" marker-end="url(#conservation-ledger)" x1="100" x2="100" y1="248" y2="134"></line><text class="t-s t-b f-ledger" x="108" y="220">창조 — 무로부터</text><line class="s-ink w3" x1="100" x2="520" y1="130" y2="130"></line><text class="t-s t-b" x="104" y="152">존재</text><line class="s-zero dash w15" marker-end="url(#conservation-zero)" x1="190" x2="190" y1="138" y2="182"></line><line class="s-zero dash w15" marker-end="url(#conservation-zero)" x1="310" x2="310" y1="138" y2="182"></line><line class="s-zero dash w15" marker-end="url(#conservation-zero)" x1="430" x2="430" y1="138" y2="182"></line><text class="t-s f-zero" text-anchor="middle" x="310" y="202">피조물 자신의 경향 — 무로 돌아감 (랜드)</text><path class="s-ink dash w2" d="M520,130 L556,244" marker-end="url(#conservation-ink)"></path><text class="t-s t-b" x="572" y="140">작용을 그치면</text><text class="t-s f-mute" x="572" y="158">절멸 — 파괴가 아니라 그침</text><text class="t-xs f-mute" x="572" y="196">아퀴나스 104문 4항:</text><text class="t-xs f-mute" x="572" y="212">실제로 절멸되는 것은 없다</text><line class="s-zero w2" x1="40" x2="720" y1="250" y2="250"></line><text class="t-s t-b f-zero" x="40" y="274">무 (nihil)</text></svg></svg>
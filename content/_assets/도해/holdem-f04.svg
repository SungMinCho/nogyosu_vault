<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 620 250" width="620" height="250" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#F1F2EC; --paper:#FAFAF6; --soft:#E3E6DE; --tie:#B9BEB5; --stack:#C9CDC4; --grid:#DCE0D6; --rule:#CDD3CA;
  --ink:#1B2420; --ink-2:#44504A; --muted:#6E7871; --on:#FFFFFF;
  --pot:#23825A; --risk:#C0392B; --eq:#A0700F; --un:#2F5DA8; --warn:#8A4FB8;
  --eq-bg:#F3E7CC; --risk-bg:#F6DEDA;
  --f-body:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-disp:"Song Myung","Nanum Myeongjo","Noto Serif KR",serif;
  --f-num:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --f-dg:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --f-math:"Noto Sans Math","STIX Two Math","Cambria Math",math;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}}:root[data-theme="dark"]{
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:2.2rem 4rem}.lecture{display:contents}.fig{margin:.6rem 0 !important;display:grid;gap:.55rem}.fig .frame{overflow-x:auto;background:
  linear-gradient(90deg,var(--paper) 30%,transparent),linear-gradient(270deg,var(--paper) 30%,transparent),
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent),
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent) 100% 0;
  background-color:var(--paper);background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll;
  border:1px solid var(--rule);border-radius:3px;padding:.7rem}.dg{display:block;width:100%;height:auto;font-family:var(--f-dg)}.dg text{fill:var(--ink);font-size:12px}.dg text.mu{fill:var(--muted)}.dg text.b{font-weight:700}.dg .on{fill:var(--on)}.dg text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}.dg text.card{font-family:var(--f-num)}.dg .f-pot{fill:var(--pot)}.dg .f-risk{fill:var(--risk)}.dg .f-eq{fill:var(--eq)}.dg .f-un{fill:var(--un)}.dg circle:hover,.dg rect[class]:hover{filter:brightness(1.08)}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="팟 오즈를 막대로 본 것: 1/3 팟 베팅이면 내 콜 1.8bb가 최종 팟 9.1bb의 19.8%, 한 장 확률 19.1%로 거두는 몫 1.74bb와 거의 같다. 2/3 팟이면 내 콜 3.7bb가 최종 팟 12.9bb의 28.7%라 한 장 몫 2.46bb보다 한참 크다." class="dg" height="100%" role="img" style="" viewBox="0 0 620 250" width="100%" xmlns="http://www.w3.org/2000/svg"><text class="b" style="font-size:13px" text-anchor="start" x="20.0" y="30.0">1/3 팟 베팅</text><rect class="f-pot" height="26.0" rx="0" width="220.7" x="20.0" y="40.0"><title>베팅 전 팟 5.5bb</title></rect><text class="on" style="font-size:12px" text-anchor="middle" x="130.9" y="57.5">팟 5.5</text><rect class="f-un" height="26.0" rx="0" width="70.6" x="242.7" y="40.0"><title>상대 베팅 1.8bb</title></rect><text class="on" style="font-size:12px" text-anchor="middle" x="278.0" y="57.5">상대 1.8</text><rect class="f-risk" height="26.0" rx="0" width="71.6" x="315.3" y="40.0"><title>내 콜 1.8bb</title></rect><text class="on" style="font-size:12px" text-anchor="middle" x="350.5" y="57.5">내 콜 1.8</text><text class="num" style="font-size:12px" text-anchor="start" x="396.8" y="57.5">= 9.1bb</text><rect class="f-risk" height="8.0" rx="2" width="72.6" x="20.0" y="78.0"><title>내가 내는 값 1.8bb</title></rect><text style="font-size:12px" text-anchor="start" x="100.6" y="86.0">내가 내는 값 1.8bb  (필요 에퀴티 1.8/9.1 = 19.8%)</text><rect class="f-eq" height="8.0" rx="2" width="70.2" x="20.0" y="96.0"><title>한 장 확률 19.1%의 몫 1.74bb</title></rect><text class="mu" style="font-size:12px" text-anchor="start" x="100.6" y="104.0">한 장 확률 19.1%로 거두는 몫 1.74bb</text><text class="b" style="font-size:13px" text-anchor="start" x="20.0" y="140.0">2/3 팟 베팅</text><rect class="f-pot" height="26.0" rx="0" width="220.7" x="20.0" y="150.0"><title>베팅 전 팟 5.5bb</title></rect><text class="on" style="font-size:12px" text-anchor="middle" x="130.9" y="167.5">팟 5.5</text><rect class="f-un" height="26.0" rx="0" width="147.1" x="242.7" y="150.0"><title>상대 베팅 3.7bb</title></rect><text class="on" style="font-size:12px" text-anchor="middle" x="316.3" y="167.5">상대 3.7</text><rect class="f-risk" height="26.0" rx="0" width="148.1" x="391.9" y="150.0"><title>내 콜 3.7bb</title></rect><text class="on" style="font-size:12px" text-anchor="middle" x="465.4" y="167.5">내 콜 3.7</text><text class="num" style="font-size:12px" text-anchor="start" x="550.0" y="167.5">= 12.9bb</text><rect class="f-risk" height="8.0" rx="2" width="149.1" x="20.0" y="188.0"><title>내가 내는 값 3.7bb</title></rect><text style="font-size:12px" text-anchor="start" x="177.1" y="196.0">내가 내는 값 3.7bb  (필요 에퀴티 3.7/12.9 = 28.7%)</text><rect class="f-eq" height="8.0" rx="2" width="99.6" x="20.0" y="206.0"><title>한 장 확률 19.1%의 몫 2.47bb</title></rect><text class="mu" style="font-size:12px" text-anchor="start" x="177.1" y="214.0">한 장 확률 19.1%로 거두는 몫 2.47bb</text></svg></svg>
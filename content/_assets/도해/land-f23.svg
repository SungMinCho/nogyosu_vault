<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 282" width="720" height="282" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-xs{ font-size:10.5px }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-none{ fill:none }.fig .f-paper{ fill:var(--paper) }.fig .f-sun{ fill:var(--sun) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-blood{ fill:var(--blood) }.fig .s-mute{ stroke:var(--ink-2) }.fig .s-rule{ stroke:var(--rule) }.fig .s-zero{ stroke:var(--zero) }.fig .s-ledger{ stroke:var(--ledger) }.fig .w1{ stroke-width:1 }.fig .w2{ stroke-width:2 }.fig .w3{ stroke-width:3 }svg.pz-root{width:720px!important;height:282px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="같은 죽음이 눈금마다 다르게 일어난다. 여행은 한 층 안에서 옆으로 가고, 바타유의 미끄러짐은 층과 층 사이를 세로로 건너간다." class="pz-inner" height="100%" role="img" style="--minw:662px" viewBox="0 0 720 282" width="100%"><defs><marker id="slippage-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="slippage-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="slippage-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="slippage-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="slippage-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="slippage-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><rect class="f-paper s-rule" height="72" rx="4" width="680" x="20" y="20"></rect><text class="t-s t-b" x="36" y="50">사람의 눈금</text><text class="t-xs f-mute" x="36" y="70">한 번 죽는다</text><rect class="f-paper s-rule" height="72" rx="4" width="680" x="20" y="102"></rect><text class="t-s t-b" x="36" y="132">몸의 눈금</text><text class="t-xs f-mute" x="36" y="152">작은 죽음 — 자아가 잠깐 무너진다</text><rect class="f-paper s-rule" height="72" rx="4" width="680" x="20" y="184"></rect><text class="t-s t-b" x="36" y="214">세포의 눈금</text><text class="t-xs f-mute" x="36" y="234">하루 약 3,300억 개, 초당 약 380만 개가 죽는다</text><line class="s-ledger w2" marker-end="url(#slippage-ledger)" x1="330" x2="520" y1="64" y2="64"></line><text class="t-xs f-ledger" text-anchor="middle" x="425" y="52">여행 — 한 층 안에서 옆으로</text><circle class="f-none s-mute w1" cx="330" cy="232" r="3.6"></circle><circle class="f-none s-mute w1" cx="342" cy="232" r="3.6"></circle><circle class="f-none s-mute w1" cx="354" cy="232" r="3.6"></circle><circle class="f-none s-mute w1" cx="366" cy="232" r="3.6"></circle><circle class="f-none s-mute w1" cx="378" cy="232" r="3.6"></circle><circle class="f-none s-mute w1" cx="390" cy="232" r="3.6"></circle><circle class="f-zero" cx="402" cy="232" r="3.6"></circle><circle class="f-none s-mute w1" cx="414" cy="232" r="3.6"></circle><circle class="f-none s-mute w1" cx="426" cy="232" r="3.6"></circle><circle class="f-none s-mute w1" cx="438" cy="232" r="3.6"></circle><circle class="f-none s-mute w1" cx="450" cy="232" r="3.6"></circle><circle class="f-zero" cx="462" cy="232" r="3.6"></circle><circle class="f-none s-mute w1" cx="474" cy="232" r="3.6"></circle><circle class="f-zero" cx="486" cy="232" r="3.6"></circle><circle class="f-none s-mute w1" cx="498" cy="232" r="3.6"></circle><circle class="f-none s-mute w1" cx="510" cy="232" r="3.6"></circle><circle class="f-zero" cx="522" cy="232" r="3.6"></circle><circle class="f-zero" cx="534" cy="232" r="3.6"></circle><line class="s-zero w3" marker-end="url(#slippage-zero)" x1="626" x2="626" y1="34" y2="250"></line><text class="t-s t-b f-zero" text-anchor="end" x="610" y="130">미끄러짐 · glissement</text><text class="t-xs f-zero" text-anchor="end" x="610" y="148">층과 층 사이를 세로로</text></svg></g></g></g></g></svg>
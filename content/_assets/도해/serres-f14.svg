<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 430" width="860" height="430" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.fig-svg .tl, .chart .tl{ font-family:var(--f-latin); font-style:italic; }.fig-svg .halo, .chart .halo{ paint-order:stroke; stroke:var(--deep); stroke-width:4px; stroke-linejoin:round; }.c-cold{ fill:var(--cold) !important }.c-fire{ fill:var(--fire) !important }.c-pass{ fill:var(--pass) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-cold{ stroke:var(--cold) }.s-fire{ stroke:var(--fire) }.s-pass{ stroke:var(--pass) }.s-caution{ stroke:var(--caution) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-cold-t{ fill:var(--cold); fill-opacity:.16 }.f-fire-t{ fill:var(--fire); fill-opacity:.16 }.f-pass-t{ fill:var(--pass); fill-opacity:.16 }.f-caution-t{ fill:var(--caution); fill-opacity:.14 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.mk-ink2{ fill:var(--ink2) }.mk-fire{ fill:var(--fire) }.mk-caution{ fill:var(--caution) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="헤르메스 3권 네 부의 차례를 사다리로 그린 그림. 위의 과학은 어느 번역에도 같은 메시지로 남고, 철학, 회화, 대지로 내려갈수록 판본마다 달라진다. 사다리 양 끝에서 배반이 나간다. 맨 위에서는 권력이 다치지 않은 과학을 빼돌려 죽음을 생산하는 타나토크라시가, 맨 아래에서는 정치의 말이 종교의 케리그마로 장르를 바꾼다." class="fig-svg" height="100%" role="img" viewBox="0 0 860 430" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F16-ar-caution" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-caution" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F16-ar-fire" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-fire" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F16-ar-ink2" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink2" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="s-ink2 w3 f-none" x1="132" x2="132" y1="24" y2="392"></line><line class="s-ink2 w3 f-none" x1="448" x2="448" y1="24" y2="392"></line><rect class="s-ink f-deep w15" height="64" rx="3" width="300" x="140" y="40"></rect><text class="tb" text-anchor="start" x="158" y="67">과학</text><text class="ts" text-anchor="start" x="202" y="67">1부 · 글 3편</text><text class="ts" text-anchor="start" x="158" y="88">어느 말로 옮겨도 같다</text><polygon class="s-pass w15 f-pass-t" points="338,62 346.7,77 329.3,77"></polygon><line class="s-ink2 w1 f-none" marker-end="url(#F16-ar-ink2)" x1="351" x2="369" y1="72" y2="72"></line><polygon class="s-pass w15 f-pass-t" points="382,62 390.7,77 373.3,77"></polygon><line class="s-ink2 w1 f-none" marker-end="url(#F16-ar-ink2)" x1="395" x2="413" y1="72" y2="72"></line><polygon class="s-pass w15 f-pass-t" points="426,62 434.7,77 417.3,77"></polygon><rect class="s-ink f-deep w15" height="64" rx="3" width="300" x="140" y="130"></rect><text class="tb" text-anchor="start" x="158" y="157">철학</text><text class="ts" text-anchor="start" x="202" y="157">2부 · 글 3편</text><text class="ts" text-anchor="start" x="158" y="178">옮길 때마다 조금씩 변한다</text><polygon class="s-pass w15 f-pass-t" points="338,152 346.7,167 329.3,167"></polygon><line class="s-ink2 w1 f-none" marker-end="url(#F16-ar-ink2)" x1="351" x2="369" y1="162" y2="162"></line><polygon class="s-pass w15 f-pass-t" points="383.6,152.1 389.8,168.3 372.7,165.6"></polygon><line class="s-ink2 w1 f-none" marker-end="url(#F16-ar-ink2)" x1="395" x2="413" y1="162" y2="162"></line><polygon class="s-pass w15 f-pass-t" points="429.4,152.5 433.4,169.4 415.2,164.1"></polygon><rect class="s-ink f-deep w15" height="64" rx="3" width="300" x="140" y="220"></rect><text class="tb" text-anchor="start" x="158" y="247">회화</text><text class="ts" text-anchor="start" x="202" y="247">3부 · 글 3편</text><text class="ts" text-anchor="start" x="158" y="268">물질처럼 녹아내린다</text><polygon class="s-pass w15 f-pass-t" points="338,242 346.7,257 329.3,257"></polygon><line class="s-ink2 w1 f-none" marker-end="url(#F16-ar-ink2)" x1="351" x2="369" y1="252" y2="252"></line><polygon class="s-pass w15 f-pass-t" points="384,240 393.7,260 370.3,259"></polygon><line class="s-ink2 w1 f-none" marker-end="url(#F16-ar-ink2)" x1="395" x2="413" y1="252" y2="252"></line><polygon class="s-pass w15 f-pass-t" points="430,238.5 439.7,262.2 410.3,263.2"></polygon><rect class="s-ink f-deep w15" height="64" rx="3" width="300" x="140" y="310"></rect><text class="tb" text-anchor="start" x="158" y="337">대지</text><text class="ts" text-anchor="start" x="202" y="337">4부 · 글 1편</text><text class="ts" text-anchor="start" x="158" y="358">같은 성서가 다른 소설로</text><polygon class="s-pass w15 f-pass-t" points="338,332 346.7,347 329.3,347"></polygon><line class="s-ink2 w1 f-none" marker-end="url(#F16-ar-ink2)" x1="351" x2="369" y1="342" y2="342"></line><polygon class="s-pass w15 f-pass-t" points="394.4,338.3 381.4,357.4 370.2,334.3"></polygon><line class="s-ink2 w1 f-none" marker-end="url(#F16-ar-ink2)" x1="395" x2="413" y1="342" y2="342"></line><circle class="s-pass w15 f-pass-t" cx="426" cy="342" r="8"></circle><polygon class="s-cold f-cold-t w1" points="78,44 64,374 92,374"></polygon><text class="t c-pass" text-anchor="middle" x="78" y="32">최적 불변</text><text class="t c-cold" text-anchor="middle" x="78" y="394">변주</text><text class="ts" text-anchor="middle" x="78" y="410">판본마다 다르다</text><line class="s-fire w2 f-none" marker-end="url(#F16-ar-fire)" x1="452" x2="598" y1="72" y2="72"></line><text class="ts c-fire halo" text-anchor="middle" x="524" y="63">권력이 빼돌린다</text><text class="ts c-caution" text-anchor="middle" x="524" y="90">너무 안 변해서</text><rect class="s-fire f-fire-t w2" height="64" rx="3" width="230" x="600" y="40"></rect><text class="tb c-fire" text-anchor="middle" x="700" y="68">죽음을 생산</text><text class="t" text-anchor="middle" x="700" y="88">타나토크라시</text><polygon class="s-pass w15 f-pass-t" points="800,62 808.7,77 791.3,77"></polygon><text class="ts" text-anchor="middle" x="715" y="122">메시지는 그대로, 목적지만 바뀐다</text><line class="s-caution w2 f-none" marker-end="url(#F16-ar-caution)" x1="452" x2="598" y1="342" y2="342"></line><text class="ts c-caution halo" text-anchor="middle" x="524" y="333">정치의 말</text><text class="ts c-caution" text-anchor="middle" x="524" y="360">너무 변해서</text><rect class="s-caution f-caution-t w2" height="64" rx="3" width="230" x="600" y="310"></rect><text class="tb c-caution" text-anchor="middle" x="700" y="338">종교의 케리그마</text><text class="t" text-anchor="middle" x="700" y="358">선포 · 신앙고백</text><path class="s-caution w15 f-caution-t" d="M792,334.0 L808,334.0 L812,344.0 L800,352.0 L788,344.0 Z"></path><text class="ts" text-anchor="middle" x="715" y="392">메시지가 다른 장르가 된다</text><text class="tb c-caution" text-anchor="middle" x="715" y="208">배반은 사다리 양 끝에</text><text class="ts tl" text-anchor="middle" x="715" y="228">traduttore, traditore</text></svg></svg>
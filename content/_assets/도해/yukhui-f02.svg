<line class="rule" x1="8" x2="652" y1="236" y2="236"></line>
<text class="ttl" x="8" y="268">유형 3 — 자기목적 재귀</text>
<g class="bx"><rect height="32" rx="3" width="60" x="90" y="284"></rect><rect height="32" rx="3" width="60" x="260" y="284"></rect><rect height="32" rx="3" width="60" x="430" y="284"></rect></g>

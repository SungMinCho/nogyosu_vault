  --verm:#B2381F; --verm-l:#F0CBC1; --verm-d:#9A2E18; --on:#FFFFFF; --stripe:3%;
  --shadow:rgba(23,32,28,.22);
  --f-disp:"Nanum Myeongjo","Gowun Batang",serif; --f-lat:"Cinzel","Nanum Myeongjo",serif;
  --f-body:"Gowun Batang","Nanum Myeongjo",serif; --f-sans:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1513; --panel:#151D1A; --ink:#DCE3DC; --ink2:#A9B5AD; --ink3:#7F8B84; --rule:#2C3732; --hair:#222C28;
  --umber:#B5702E; --umber-l:#3B2A1B; --blue:#5A86D2; --blue-l:#1C2A42; --blue-d:#9DB8E8;
  --brass:#AE8C1F; --brass-l:#5A4A17; --brass-d:#7D640F; --brass-top:#D2B04A; --violet:#9570D2; --violet-l:#2D2342; --violet-d:#C2A8EC;
  --verm:#D85E3D; --verm-l:#45241B; --verm-d:#F09A80; --on:#0F1513; --shadow:rgba(0,0,0,.55); --stripe:1.6%; color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#0F1513; --panel:#151D1A; --ink:#DCE3DC; --ink2:#A9B5AD; --ink3:#7F8B84; --rule:#2C3732; --hair:#222C28;
  --umber:#B5702E; --umber-l:#3B2A1B; --blue:#5A86D2; --blue-l:#1C2A42; --blue-d:#9DB8E8;
  --brass:#AE8C1F; --brass-l:#5A4A17; --brass-d:#7D640F; --brass-top:#D2B04A; --violet:#9570D2; --violet-l:#2D2342; --violet-d:#C2A8EC;
  --verm:#D85E3D; --verm-l:#45241B; --verm-d:#F09A80; --on:#0F1513; --shadow:rgba(0,0,0,.55); --stripe:1.6%; color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}a:focus-visible, .frame:focus-visible{ outline:2px solid var(--violet); outline-offset:3px }.cert .frame{ background:transparent }@media (max-width:40em){.cert .frame{ padding:.6rem .2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:.5rem 2rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .4rem }.frame{ overflow-x:auto; background:
  linear-gradient(to right, var(--panel) 30%, transparent), linear-gradient(to left, var(--panel) 30%, transparent) 100% 0,
  radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) 100% 0;
  background-repeat:no-repeat; background-size:40px 100%, 40px 100%, 14px 100%, 14px 100%; background-attachment:local, local, scroll, scroll;
  background-color:var(--panel); border:1px solid var(--rule); padding:.6rem .4rem }.frame svg{ display:block; width:100%; height:auto }svg text{ font-family:var(--f-sans); fill:var(--ink); font-size:13px }svg .tl{ font-size:13.5px }svg .ts{ font-size:12.5px }svg .tx{ font-size:11.5px }svg .tb{ font-weight:700 }svg .tn.tb{ font-weight:600 }svg .t2{ fill:var(--ink2) }svg .t3{ fill:var(--ink3) }.f-blue{fill:var(--blue)}.f-blue-l{fill:var(--blue-l)}.f-brass-l{fill:var(--brass-l)}.f-ink3{fill:var(--ink3)}.f-panel{fill:var(--panel)}.s-blue{stroke:var(--blue)}.s-ink3{stroke:var(--ink3)}.s-hair{stroke:var(--hair)}.sb{stroke:var(--blue); stroke-width:1.2}.sbr{stroke:var(--brass); stroke-width:1.2}svg line, svg path, svg polyline, svg rect, svg circle{ stroke-width:1 }.sw2{ stroke-width:2 !important }.dash{ stroke-dasharray:5 4 }svg pattern line{ stroke-width:1.1 }svg.pz-root{width:680px!important;height:248px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="안쪽 자산은 모두 짝이 있다: 예금-은행 부채, 채권-발행자 부채, 주식-회사 장부의 마이너스, 스테이블코인-발행사 부채. 지폐는 갚을 수 없는 중앙은행 부채라 반쯤 바깥. 중앙은행의 금과 비트코인은 끊긴 화살표, 짝이 없다." class="pz-inner" height="100%" id="io" role="img" style="" viewBox="0 0 680 248" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="io-ab" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-blue" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="io-ag" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink3" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="tl tb" text-anchor="start" x="20.0" y="26.0">안쪽 — 짝이 있다 · 더하면 0</text><text class="tl tb" text-anchor="start" x="372.0" y="26.0">반쯤</text><text class="tl tb" text-anchor="start" x="520.0" y="26.0">바깥 — 짝이 없다</text><rect class="f-blue-l sb" height="26.0" rx="13" width="104.0" x="20.0" y="46.0"><title>+ 예금</title></rect><text class="ts" text-anchor="middle" x="72.0" y="63.0">+ 예금</text><line class="s-blue sw2" marker-end="url(#io-ab)" marker-start="url(#io-ab)" x1="130.0" x2="186.0" y1="59.0" y2="59.0"></line><rect class="f-panel sb" height="26.0" rx="13" width="150.0" x="192.0" y="46.0"><title>− 은행의 부채</title></rect><text class="ts" text-anchor="middle" x="267.0" y="63.0">− 은행의 부채</text><rect class="f-blue-l sb" height="26.0" rx="13" width="104.0" x="20.0" y="90.0"><title>+ 채권</title></rect><text class="ts" text-anchor="middle" x="72.0" y="107.0">+ 채권</text><line class="s-blue sw2" marker-end="url(#io-ab)" marker-start="url(#io-ab)" x1="130.0" x2="186.0" y1="103.0" y2="103.0"></line><rect class="f-panel sb" height="26.0" rx="13" width="150.0" x="192.0" y="90.0"><title>− 발행자의 부채</title></rect><text class="ts" text-anchor="middle" x="267.0" y="107.0">− 발행자의 부채</text><rect class="f-blue-l sb" height="26.0" rx="13" width="104.0" x="20.0" y="134.0"><title>+ 주식</title></rect><text class="ts" text-anchor="middle" x="72.0" y="151.0">+ 주식</text><line class="s-blue sw2" marker-end="url(#io-ab)" marker-start="url(#io-ab)" x1="130.0" x2="186.0" y1="147.0" y2="147.0"></line><rect class="f-panel sb" height="26.0" rx="13" width="150.0" x="192.0" y="134.0"><title>− 회사 장부의 마이너스</title></rect><text class="ts" text-anchor="middle" x="267.0" y="151.0">− 회사 장부의 마이너스</text><rect class="f-blue-l sb" height="26.0" rx="13" width="104.0" x="20.0" y="178.0"><title>+ 스테이블코인</title></rect><text class="ts" text-anchor="middle" x="72.0" y="195.0">+ 스테이블코인</text><line class="s-blue sw2" marker-end="url(#io-ab)" marker-start="url(#io-ab)" x1="130.0" x2="186.0" y1="191.0" y2="191.0"></line><rect class="f-panel sb" height="26.0" rx="13" width="150.0" x="192.0" y="178.0"><title>− 발행사의 부채</title></rect><text class="ts" text-anchor="middle" x="267.0" y="195.0">− 발행사의 부채</text><line class="s-hair" x1="356.0" x2="356.0" y1="40.0" y2="230.0"></line><line class="s-hair" x1="504.0" x2="504.0" y1="40.0" y2="230.0"></line><rect class="f-blue-l sb" height="26.0" rx="13" width="116.0" x="372.0" y="60.0"><title>지폐·지급준비금</title></rect><text class="ts" text-anchor="middle" x="430.0" y="77.0">지폐·지급준비금</text><line class="s-blue sw2 dash" marker-end="url(#io-ab)" x1="430.0" x2="430.0" y1="90.0" y2="120.0"></line><rect class="f-panel sb" height="26.0" rx="13" width="116.0" x="372.0" y="124.0"><title>중앙은행 '부채'</title></rect><text class="ts" text-anchor="middle" x="430.0" y="141.0">중앙은행 '부채'</text><text class="tx t2" text-anchor="middle" x="430.0" y="170.0">갚을 수 없음</text><text class="tx t2" text-anchor="middle" x="430.0" y="186.0">닻: 세금은 이 돈으로</text><rect class="f-brass-l sbr" height="26.0" rx="13" width="120.0" x="520.0" y="50.0"><title>중앙은행의 금</title></rect><text class="ts" text-anchor="middle" x="580.0" y="67.0">중앙은행의 금</text><line class="s-ink3 sw2" x1="580.0" x2="580.0" y1="80.0" y2="89.0"></line><line class="s-ink3 sw2" marker-end="url(#io-ag)" x1="580.0" x2="580.0" y1="97.0" y2="108.0"></line><text class="tl t3" text-anchor="start" x="592.0" y="102.0">?</text><text class="tx t2" text-anchor="start" x="520.0" y="126.0">대응 부채 없음 (SNA)</text><rect class="f-brass-l sbr" height="26.0" rx="13" width="120.0" x="520.0" y="142.0"><title>비트코인</title></rect><text class="ts" text-anchor="middle" x="580.0" y="159.0">비트코인</text><line class="s-ink3 sw2" x1="580.0" x2="580.0" y1="172.0" y2="181.0"></line><line class="s-ink3 sw2" marker-end="url(#io-ag)" x1="580.0" x2="580.0" y1="189.0" y2="200.0"></line><text class="tl t3" text-anchor="start" x="592.0" y="194.0">?</text><text class="tx t2" text-anchor="start" x="520.0" y="218.0">발행자 없음</text><text class="tx t2" text-anchor="start" x="20.0" y="236.0">스테이블코인은 블록체인 위에 있어도 안쪽이다 — 기준은 장부의 위치가 아니라 짝의 유무.</text></svg></g></g></g></g></svg>
  color-scheme:dark}.vg{color:var(--vg)}.vm{color:var(--vm)}svg.defs{position:absolute;width:0;height:0;overflow:hidden}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-inline:var(--pad);padding-block:0 4rem}.lecture{display:contents}.webwrap svg{display:block;width:100%;height:auto}.sw-dot.vg{background:var(--vg)}.sw-dot.vm{background:var(--vm)}figure.fig{border:1px solid var(--mark);background:var(--plate);padding:.75rem .75rem .6rem;margin-block:.6rem}.figscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  background:linear-gradient(to right,var(--plate) 30%,transparent),linear-gradient(to left,var(--plate) 30%,transparent) 100% 0,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) 100% 0;
  background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;background-attachment:local,local,scroll,scroll}figure.fig svg{display:block;width:100%;height:auto;min-width:27rem}@media (max-width:34rem){.doc>figure.fig,.lecture>figure.fig{width:calc(100% + var(--pad)*2);max-width:none;margin-inline:calc(var(--pad)*-1);border-inline:0;padding-inline:.6rem}}.terms li.vg{color:var(--vg);background:var(--vg-soft)}.terms li.vm{color:var(--vm);background:var(--vm-soft)}svg .ln,svg .ln-cu,svg .ln-vg,svg .ln-pb,svg .ln-vm{stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}svg .ln:not([fill]),svg .ln-cu:not([fill]),svg .ln-vg:not([fill]),svg .ln-pb:not([fill]),svg .ln-vm:not([fill]){fill:none}svg .ln{stroke:var(--ink)}svg .ln-vg{stroke:var(--vg)}svg .ln-vm{stroke:var(--vm)}svg g.ln-vg>rect:not([fill]),svg g.ln-cu>rect:not([fill]),svg g.ln-pb>rect:not([fill]),svg g.ln-vm>rect:not([fill]){fill:none}svg .thick,svg g.thick>*{stroke-width:2.6}svg .faint,svg g.faint>*,svg g>.faint{stroke:var(--mark)}svg text{fill:var(--ink);font-family:var(--f-body)}svg .ts{font-size:13px}svg .tm{font-family:var(--f-mono);font-size:11px}svg .c{text-anchor:middle}svg text.cu{fill:var(--cu)}svg text.vg{fill:var(--vg)}svg text.pb{fill:var(--pb)}svg text.vm{fill:var(--vm)}.m .sq>.rt path{fill:none;stroke:currentColor;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}.m .sq>.rt path.rh{stroke-width:1.6px}svg.pz-root{width:480px!important;height:300px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w figscroll"><svg aria-label="네 헌신의 충돌 — 헌신들이 충돌하면 논리는 무엇을 버릴지 정하지 않는다 — 고르고 책임지는 것이 판단이다" class="pz-inner" height="100%" role="img" viewBox="0 0 480 300" width="100%" xmlns="http://www.w3.org/2000/svg">
<g class="ln-vg">
<rect height="28" width="212" x="16" y="14"></rect><rect height="28" width="212" x="16" y="50"></rect>
<rect height="28" width="212" x="252" y="14"></rect><rect height="28" width="212" x="252" y="50"></rect>
</g>
<text class="ts" x="26" y="33">가 · 학습 손실이 수렴했다</text>
<text class="ts" x="26" y="69">나 · 수렴했으면 과적합 아님</text>
<text class="ts" x="262" y="33">다 · 검증 손실이 계속 오른다</text>
<text class="ts" x="262" y="69">라 · 계속 오르면 과적합</text>
<line class="ln" marker-end="url(#ah)" x1="122" x2="122" y1="78" y2="102"></line>
<line class="ln" marker-end="url(#ah)" x1="358" x2="358" y1="78" y2="102"></line>
<text class="ts c" x="122" y="124">∴ 과적합이 아니다</text>
<text class="ts c" x="358" y="124">∴ 과적합이다</text>
<line class="ln-vm" marker-end="url(#ah-vm)" x1="184" x2="234" y1="119" y2="119"></line>
<line class="ln-vm" marker-end="url(#ah-vm)" x1="306" x2="246" y1="119" y2="119"></line>
<line class="ln-vm thick" x1="240" x2="240" y1="108" y2="130"></line>
<text class="tm c vm" x="240" y="102">양립 불가</text>
<line class="ln-vm" marker-end="url(#ah-vm)" x1="240" x2="240" y1="134" y2="160"></line>
<text class="tm" x="250" y="152">넷 중 하나만 버려도 통일이 돌아온다</text>
<rect class="ln faint" height="44" width="110" x="14" y="166"></rect><text class="ts c" x="69" y="185">가를 버린다</text><text class="tm c" x="69" y="202">실은 수렴 안 했다</text><rect class="ln-vg thick" fill="url(#h-vg)" fill-opacity="0.4" height="44" width="110" x="128" y="166"></rect><text class="ts c" x="183" y="185">나를 버린다</text><text class="tm c" x="183" y="202">그 조건문이 틀렸다</text><rect class="ln faint" height="44" width="110" x="242" y="166"></rect><text class="ts c" x="297" y="185">다를 버린다</text><text class="tm c" x="297" y="202">측정이 잘못됐다</text><rect class="ln faint" height="44" width="110" x="356" y="166"></rect><text class="ts c" x="411" y="185">라를 버린다</text><text class="tm c" x="411" y="202">다른 원인일 수도</text>
<text class="ts c vg" x="183" y="230">↑ 판단이 고른다</text>
<text class="ts c" x="240" y="256">무엇을 버릴지 논리는 정하지 않는다</text>
<text class="tm c" x="240" y="276">귀결은 넓히고 · 양립 불가는 배제하고 · 고른 것에 책임진다</text>
<text class="tm c vg" x="240" y="293">= 합리적 통합 (통각의 통일은 지켜 내야 할 과제)</text>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 432" width="760" height="432" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tm, .chart .tm{ font-family:var(--f-mono); font-size:11px; }.c-cold{ fill:var(--cold) !important }.c-order{ fill:var(--order) !important }.s-ink{ stroke:var(--ink) }.s-rule{ stroke:var(--rule) }.s-cold{ stroke:var(--cold) }.s-order{ stroke:var(--order) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-land{ fill:var(--land) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.dash{ stroke-dasharray:5 4 }svg.pz-root{width:760px!important;height:432px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="같은 가로축 n = 0부터 10까지 위아래 두 그래프. 위: 옛 제논이 거리를 n번 반으로 자르면 남은 거리는 (½)ⁿ으로 1에서 1/1,024로 줄어 0으로 수렴한다. 아래: 새 제논이 차원 1.25인 해안을 자를 n번 반으로 줄여 재면 길이는 2의 0.25n제곱 배로 1에서 5.66으로 늘어 발산한다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 760 432" width="100%" xmlns="http://www.w3.org/2000/svg"><text class="t c-order" text-anchor="start" x="110" y="32">옛 제논 · 거리를 n번 반으로 — 남은 거리 (½)ⁿ</text><line class="s-ink w1 f-none" x1="110" x2="682" y1="170" y2="170"></line><line class="s-ink w1 f-none" x1="110" x2="110" y1="170" y2="54"></line><line class="s-ink w1 f-none" x1="106" x2="110" y1="170" y2="170"></line><text class="tm" text-anchor="end" x="102" y="174">0</text><line class="s-ink w1 f-none" x1="106" x2="110" y1="115" y2="115"></line><text class="tm" text-anchor="end" x="102" y="119">½</text><line class="s-ink w1 f-none" x1="106" x2="110" y1="60" y2="60"></line><text class="tm" text-anchor="end" x="102" y="64">1</text><line class="s-ink w1 f-none" x1="110" x2="110" y1="170" y2="174"></line><text class="tm" text-anchor="middle" x="110" y="187">0</text><line class="s-ink w1 f-none" x1="166" x2="166" y1="170" y2="174"></line><line class="s-ink w1 f-none" x1="222" x2="222" y1="170" y2="174"></line><text class="tm" text-anchor="middle" x="222" y="187">2</text><line class="s-ink w1 f-none" x1="278" x2="278" y1="170" y2="174"></line><line class="s-ink w1 f-none" x1="334" x2="334" y1="170" y2="174"></line><text class="tm" text-anchor="middle" x="334" y="187">4</text><line class="s-ink w1 f-none" x1="390" x2="390" y1="170" y2="174"></line><line class="s-ink w1 f-none" x1="446" x2="446" y1="170" y2="174"></line><text class="tm" text-anchor="middle" x="446" y="187">6</text><line class="s-ink w1 f-none" x1="502" x2="502" y1="170" y2="174"></line><line class="s-ink w1 f-none" x1="558" x2="558" y1="170" y2="174"></line><text class="tm" text-anchor="middle" x="558" y="187">8</text><line class="s-ink w1 f-none" x1="614" x2="614" y1="170" y2="174"></line><line class="s-ink w1 f-none" x1="670" x2="670" y1="170" y2="174"></line><text class="tm" text-anchor="middle" x="670" y="187">10</text><path class="s-order w2 f-none" d="M110.0,60.0 L166.0,115.0 L222.0,142.5 L278.0,156.2 L334.0,163.1 L390.0,166.6 L446.0,168.3 L502.0,169.1 L558.0,169.6 L614.0,169.8 L670.0,169.9"></path><circle class="s-order f-land w15" cx="110" cy="60" r="3.2"></circle><circle class="s-order f-land w15" cx="166" cy="115" r="3.2"></circle><circle class="s-order f-land w15" cx="222" cy="142.5" r="3.2"></circle><circle class="s-order f-land w15" cx="278" cy="156.25" r="3.2"></circle><circle class="s-order f-land w15" cx="334" cy="163.125" r="3.2"></circle><circle class="s-order f-land w15" cx="390" cy="166.562" r="3.2"></circle><circle class="s-order f-land w15" cx="446" cy="168.281" r="3.2"></circle><circle class="s-order f-land w15" cx="502" cy="169.141" r="3.2"></circle><circle class="s-order f-land w15" cx="558" cy="169.57" r="3.2"></circle><circle class="s-order f-land w15" cx="614" cy="169.785" r="3.2"></circle><circle class="s-order f-land w15" cx="670" cy="169.893" r="3.2"></circle><text class="ts c-order" text-anchor="end" x="670" y="148">1/1,024 ≈ 0.001 → 0 (수렴)</text><text class="ts" text-anchor="end" x="70" y="119">거리</text><text class="t c-cold" text-anchor="start" x="110" y="222">새 제논 · 자를 n번 반으로 — 해안 길이 × 2^(0.25n), D = 1.25</text><line class="s-ink w1 f-none" x1="110" x2="682" y1="390" y2="390"></line><line class="s-ink w1 f-none" x1="110" x2="110" y1="390" y2="234"></line><line class="s-ink w1 f-none" x1="106" x2="110" y1="390" y2="390"></line><text class="tm" text-anchor="end" x="102" y="394">0</text><line class="s-ink w1 f-none" x1="106" x2="110" y1="365" y2="365"></line><text class="tm" text-anchor="end" x="102" y="369">1</text><line class="s-ink w1 f-none" x1="106" x2="110" y1="340" y2="340"></line><text class="tm" text-anchor="end" x="102" y="344">2</text><line class="s-ink w1 f-none" x1="106" x2="110" y1="315" y2="315"></line><text class="tm" text-anchor="end" x="102" y="319">3</text><line class="s-ink w1 f-none" x1="106" x2="110" y1="290" y2="290"></line><text class="tm" text-anchor="end" x="102" y="294">4</text><line class="s-ink w1 f-none" x1="106" x2="110" y1="265" y2="265"></line><text class="tm" text-anchor="end" x="102" y="269">5</text><line class="s-ink w1 f-none" x1="106" x2="110" y1="240" y2="240"></line><text class="tm" text-anchor="end" x="102" y="244">6</text><line class="s-ink w1 f-none" x1="110" x2="110" y1="390" y2="394"></line><text class="tm" text-anchor="middle" x="110" y="407">0</text><line class="s-ink w1 f-none" x1="166" x2="166" y1="390" y2="394"></line><line class="s-ink w1 f-none" x1="222" x2="222" y1="390" y2="394"></line><text class="tm" text-anchor="middle" x="222" y="407">2</text><line class="s-ink w1 f-none" x1="278" x2="278" y1="390" y2="394"></line><line class="s-ink w1 f-none" x1="334" x2="334" y1="390" y2="394"></line><text class="tm" text-anchor="middle" x="334" y="407">4</text><line class="s-ink w1 f-none" x1="390" x2="390" y1="390" y2="394"></line><line class="s-ink w1 f-none" x1="446" x2="446" y1="390" y2="394"></line><text class="tm" text-anchor="middle" x="446" y="407">6</text><line class="s-ink w1 f-none" x1="502" x2="502" y1="390" y2="394"></line><line class="s-ink w1 f-none" x1="558" x2="558" y1="390" y2="394"></line><text class="tm" text-anchor="middle" x="558" y="407">8</text><line class="s-ink w1 f-none" x1="614" x2="614" y1="390" y2="394"></line><line class="s-ink w1 f-none" x1="670" x2="670" y1="390" y2="394"></line><text class="tm" text-anchor="middle" x="670" y="407">10</text><line class="s-rule w1 dash f-none" x1="110" x2="670" y1="365" y2="365"></line><text class="ts" text-anchor="start" x="676" y="369">처음 = 1</text><path class="s-cold w2 f-none" d="M110.0,365.0 L166.0,360.3 L222.0,354.6 L278.0,348.0 L334.0,340.0 L390.0,330.5 L446.0,319.3 L502.0,305.9 L558.0,290.0 L614.0,271.1 L670.0,248.6"></path><circle class="s-cold f-deep w15" cx="110" cy="365" r="3.2"></circle><circle class="s-cold f-deep w15" cx="166" cy="360.27" r="3.2"></circle><circle class="s-cold f-deep w15" cx="222" cy="354.645" r="3.2"></circle><circle class="s-cold f-deep w15" cx="278" cy="347.955" r="3.2"></circle><circle class="s-cold f-deep w15" cx="334" cy="340" r="3.2"></circle><circle class="s-cold f-deep w15" cx="390" cy="330.54" r="3.2"></circle><circle class="s-cold f-deep w15" cx="446" cy="319.289" r="3.2"></circle><circle class="s-cold f-deep w15" cx="502" cy="305.91" r="3.2"></circle><circle class="s-cold f-deep w15" cx="558" cy="290" r="3.2"></circle><circle class="s-cold f-deep w15" cx="614" cy="271.079" r="3.2"></circle><circle class="s-cold f-deep w15" cx="670" cy="248.579" r="3.2"></circle><text class="ts c-cold" text-anchor="end" x="660" y="246.575">5.66 → ∞ (발산)</text><text class="ts c-cold" text-anchor="start" x="124" y="262">40번이면 × 1,024</text><text class="ts" text-anchor="start" x="124" y="278">— 위에서 분모였던 1,024가 여기선 곱수</text><text class="ts" text-anchor="end" x="70" y="319">길이</text><text class="ts" text-anchor="middle" x="390" y="424">n = 반으로 자른 횟수</text></svg></g></g></g></g></svg>
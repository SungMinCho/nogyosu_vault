<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 290" width="760" height="290" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E7EAE8; --panel:#F3F5F4; --code-bg:#EEF1F0;
  --ink:#1B2224; --muted:#586365; --rule:#C1C9C8; --rule-soft:rgba(27,34,36,.07);
  --if:#2A5687; --if-soft:rgba(42,86,135,.12); --if-deep:#15375C;
  --ore:#8A6014; --ore-soft:rgba(138,96,20,.15);

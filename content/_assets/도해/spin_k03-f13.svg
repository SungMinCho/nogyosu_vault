n" marker-end="url(#k12-ink)" x1="568" x2="596" y1="146" y2="146"></line><text class="t-s t-mut" text-anchor="start" x="22" y="246">오차의 크기는 채널마다 비슷하지만, 출력에 들어갈 땐 입력 크기가 곱해진다. 채널 3 하나가 나머지 일곱을 합친 것보다 크다.</text></svg></g></g></g></g></svg>
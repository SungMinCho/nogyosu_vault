  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.fig-svg .tm, .chart .tm{ font-family:var(--f-mono); font-size:11px; }.c-cold{ fill:var(--cold) !important }.c-order{ fill:var(--order) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-rule{ stroke:var(--rule) }.s-cold{ stroke:var(--cold) }.s-order{ stroke:var(--order) }.f-none{ fill:none }.f-shoal{ fill:var(--shoal) }.f-land{ fill:var(--land) }.f-ink{ fill:var(--ink) }.f-cold-t{ fill:var(--cold); fill-opacity:.16 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }svg.pz-root{width:880px!important;height:400px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="왼쪽: 분자 네 개를 상자의 왼쪽 반과 오른쪽 반에 놓는 배치를 모두 쌓은 막대그래프. 왼쪽:오른쪽이 0:4, 1:3, 2:2, 3:1, 4:0인 상태의 배치 수는 1, 4, 6, 4, 1이고 합은 16이다. 2:2가 될 확률은 6/16, 넷이 한쪽에 몰릴 확률은 2/16이며, 2:2 상태의 엔트로피는 k ln 6이다. 오른쪽: 분자 100개의 분포는 50:50에서 높이 솟고, 모두 한쪽에 몰릴 확률 2의 −100제곱, 약 7.9×10⁻³¹은 바닥과 구별되지 않는다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 880 400" width="100%" xmlns="http://www.w3.org/2000/svg"><text class="tb" text-anchor="middle" x="272" y="30">분자 4개 · 칸 하나 = 배치 하나</text><line class="s-ink w1 f-none" x1="72" x2="72" y1="300" y2="131"></line><line class="s-ink w1 f-none" x1="72" x2="520" y1="300" y2="300"></line><line class="s-ink w1 f-none" x1="68" x2="72" y1="300" y2="300"></line><text class="tm" text-anchor="end" x="64" y="304">0</text><line class="s-ink w1 f-none" x1="68" x2="72" y1="274" y2="274"></line><text class="tm" text-anchor="end" x="64" y="278">1</text><line class="s-ink w1 f-none" x1="68" x2="72" y1="248" y2="248"></line><text class="tm" text-anchor="end" x="64" y="252">2</text><line class="s-ink w1 f-none" x1="68" x2="72" y1="222" y2="222"></line><text class="tm" text-anchor="end" x="64" y="226">3</text><line class="s-ink w1 f-none" x1="68" x2="72" y1="196" y2="196"></line><text class="tm" text-anchor="end" x="64" y="200">4</text><line class="s-ink w1 f-none" x1="68" x2="72" y1="170" y2="170"></line><text class="tm" text-anchor="end" x="64" y="174">5</text><line class="s-ink w1 f-none" x1="68" x2="72" y1="144" y2="144"></line><text class="tm" text-anchor="end" x="64" y="148">6</text><text class="ts" text-anchor="middle" x="72" y="121">W (배치 수)</text><rect class="s-order f-land w1" height="22" rx="2" width="62" x="101" y="276"></rect><line class="s-ink2 w1 dot f-none" x1="132" x2="132" y1="278" y2="296"></line><circle class="f-ink" cx="138" cy="284.5" r="2.4"></circle><circle class="f-ink" cx="144.5" cy="289.5" r="2.4"></circle><circle class="f-ink" cx="151" cy="284.5" r="2.4"></circle><circle class="f-ink" cx="157.5" cy="289.5" r="2.4"></circle><text cl
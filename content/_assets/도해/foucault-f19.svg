<rect class="f-bg" height="44" width="112" x="314" y="260"></rect>
<text class="t-d mid" x="370" y="280">이름</text>
<text class="t-s mid mute" x="370" y="297">명명법이자 분류법</text>
<!-- 꼭짓점 -->
<circle class="f-azu" cx="260" cy="170" r="6"></circle>
<circle class="f-azu" cx="480" cy="170" r="6"></circle>
<circle class="f-azu" cx="480" cy="390" r="6"></circle>
<circle class="f-azu" cx="260" cy="390" r="6"></circle>
<text class="t-d end c-azu" x="246" y="110">명제<tspan class="t-s c-azu"> (귀속)</tspan></text>
<text class="t-s end" x="246" y="128">동사</text>
<text class="t-s end" x="246" y="143">존재의 보임</text>
<text class="t-s b end" x="246" y="158">필요의 대상</text>
<text class="t-d c-azu" x="494" y="110">분절</text>
<text class="t-s" x="494" y="128">이름들</text>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 345" width="640" height="345" class="fig-frame fig wide lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#F3F2F6; --panel:#FAF9FC; --band:#ECEAF1;
  --ink:#1E1B26; --ink-2:#4F4A5C; --ink-3:#7E788B; --rule:#D8D4E0;
  --step:#5A3E9B; --sig:#8F6B00; --tooth:#B42A62; --fix:#0A7FA0;
  --step-soft:#E6E0F3; --sig-soft:#F2E8D0; --tooth-soft:#F6DFE8; --fix-soft:#D8EDF3; --fix-faint:rgba(10,127,160,.08);
  --f-display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --f-mono:"Sometype Mono","Nanum Gothic Coding",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-diag:"Nanum Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15131B; --panel:#1D1A25; --band:#1B1922;
  --ink:#ECE9F2; --ink-2:#B9B4C6; --ink-3:#8C8799; --rule:#34303F;
  --step:#8E78E0; --sig:#BC8A12; --tooth:#E0607A; --fix:#22A6B4;
  --step-soft:#2B2444; --sig-soft:#33290F; --tooth-soft:#3B1E2B; --fix-soft:#11303A; --fix-faint:rgba(34,166,180,.10);
  color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#15131B; --panel:#1D1A25; --band:#1B1922;
  --ink:#ECE9F2; --ink-2:#B9B4C6; --ink-3:#8C8799; --rule:#34303F;
  --step:#8E78E0; --sig:#BC8A12; --tooth:#E0607A; --fix:#22A6B4;
  --step-soft:#2B2444; --sig-soft:#33290F; --tooth-soft:#3B1E2B; --fix-soft:#11303A; --fix-faint:rgba(34,166,180,.10);
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 3rem }.lecture{ display:contents }.hero-fig svg{ width:100%; height:auto; display:block }.fig{ margin-block:.6rem !important }.fig-frame{ background:var(--panel); border:1px solid var(--rule); border-radius:4px; overflow-x:auto;
  background-image:linear-gradient(to right,var(--panel),var(--panel)),linear-gradient(to right,var(--panel),var(--panel)),
    linear-gradient(to right,rgba(0,0,0,.12),transparent),linear-gradient(to left,rgba(0,0,0,.12),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat;
  background-size:20px 100%,20px 100%,10px 100%,10px 100%; background-attachment:local,local,scroll,scroll }.fig-frame svg{ display:block; width:100%; min-width:540px; height:auto; padding:.4rem }.dg{ font-family:var(--f-diag); font-size:12px }.dg text{ fill:var(--ink) }.dg .t-ink{ fill:var(--ink) }.dg .t-ink2{ fill:var(--ink-2) }.dg .t-step{ fill:var(--step) }.dg .t-sig{ fill:var(--sig) }.dg .t-fix{ fill:var(--fix) }.dg line, .dg polyline, .dg path, .dg ellipse{ fill:none }.dg .s-ink2{ stroke:var(--ink-2) }.dg .s-ink3{ stroke:var(--ink-3) }.dg .s-step{ stroke:var(--step) }.dg .s-fix{ stroke:var(--fix) }.dg .f-sig{ fill:var(--sig) }.dg .f-fix{ fill:var(--fix) }.dg .f-ink2{ fill:var(--ink-2) }.dg .f-fix-faint{ fill:var(--fix-faint) }.dg .f-none{ fill:none }.dg .ring{ stroke:var(--panel); stroke-width:2px }.dg .mk-ink{ fill:var(--ink) }.dg .mk-ink2{ fill:var(--ink-2) }.dg .mk-step{ fill:var(--step) }.dg .mk-sig{ fill:var(--sig) }.dg .mk-tooth{ fill:var(--tooth) }.dg .mk-fix{ fill:var(--fix) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="w1을 0으로 못 박는 제약선 위에서 비용이 가장 작은 점은 타원이 제약선에 접하는 (0, 0.9)이고, 보상 없이 지운 OBD의 (0, 0.6)보다 25% 싸다." class="dg" height="100%" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 640 345" width="100%"><defs><marker id="obs-a-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="obs-a-step" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-step" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="obs-a-sig" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-sig" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="obs-a-tooth" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-tooth" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="obs-a-fix" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-fix" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="obs-a-ink2" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink2" d="M0,1 L10,5 L0,9 z"></path></marker></defs><line class="s-step" stroke-dasharray="6 4" stroke-width="2" x1="109" x2="109" y1="318.2" y2="52.2"></line><text class="t-step" style="font-size:12px;font-weight:600" text-anchor="end" x="101" y="59.8">w₁ = 0</text><text class="t-step" style="font-size:10.5px" text-anchor="end" x="101" y="74.8">(가지치기</text><text class="t-step" style="font-size:10.5px" text-anchor="end" x="101" y="88.8">제약)</text><ellipse class="s-ink3 f-none" cx="223" cy="189" rx="161.22" ry="93.08" stroke-dasharray="4 4" stroke-width="1.6" transform="rotate(45 223 189)"></ellipse><ellipse class="s-fix f-fix-faint" cx="223" cy="189" rx="139.62" ry="80.61" stroke-width="1.6" transform="rotate(45 223 189)"></ellipse><line class="s-ink2" marker-end="url(#obs-a-ink2)" stroke-dasharray="4 3" stroke-width="1.4" x1="223" x2="113" y1="189" y2="189"></line><line class="s-fix" marker-end="url(#obs-a-fix)" stroke-width="1.8" x1="223" x2="113" y1="189" y2="134"></line><circle class="f-ink2 ring" cx="109" cy="189" r="6"></circle><circle class="f-fix ring" cx="109" cy="132" r="6.5"></circle><circle class="f-sig ring" cx="223" cy="189" r="6"></circle><text class="t-sig" style="font-size:12px;font-weight:600" x="233" y="207">w = (0.6, 0.6)</text><text class="t-ink2" style="font-size:11.5px;font-weight:600" x="121" y="211">OBD (0, 0.6) · 0.18</text><text class="t-fix" style="font-size:11.5px;font-weight:600" x="121" y="120">OBS (0, 0.9) · 0.135</text><text class="t-ink" style="font-size:13px;font-weight:600" x="400" y="56">½ΔwᵀHΔw 로 잰 손실</text><text class="t-ink2" style="font-size:11.5px" x="400" y="78">OBD: 대각만 보고 지움, 보상 없음</text><text class="t-fix" style="font-size:11.5px" x="400" y="100">OBS: 제약선에 접하는 등고선을 찾음</text><text class="t-ink2" style="font-size:11.5px" x="400" y="144">보상 Δw₂ = w₁·β = 0.6 × 0.5</text><text class="t-ink2" style="font-size:11.5px" x="400" y="166">β = x₁을 x₂로 회귀한 계수</text><text class="t-ink2" style="font-size:11.5px" x="400" y="210">비용의 곡률 = 1/[H⁻¹]₁₁ = 0.75</text><text class="t-ink2" style="font-size:11.5px" x="400" y="232">= x₁ 중 x₂로 설명 못 하는 전력</text></svg></svg>
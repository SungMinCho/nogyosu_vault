  --och-w:rgba(215,166,76,.16); --azu-w:rgba(134,174,230,.15); --ver-w:rgba(239,122,87,.15); --lak-w:rgba(229,133,182,.15); --ink-w:rgba(231,224,210,.07);
  --weave:rgba(255,240,210,.025); --room:#0A0806; --linen:#81776A; --door:#C9A55A; --glass:#7E9DCB; --ray:rgba(240,214,150,.09); color-scheme:dark }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{ display:block; width:100%; height:auto }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.6rem 3rem }.lecture{ display:contents }figure.fig{ margin:.6rem 0 .4rem; display:grid; gap:.55rem }.fig .frame{ overflow-x:auto; overscroll-behavior-x:contain; background:var(--panel-2); border:1px solid var(--rule-2); padding:.9rem .8rem;
  background-image:linear-gradient(to right,var(--panel-2) 30%,transparent),linear-gradient(to left,var(--panel-2) 30%,transparent),linear-gradient(to right,var(--ink-w),transparent),linear-gradient(to left,var(--ink-w),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat; background-size:2.2rem 100%,2.2rem 100%,1rem 100%,1rem 100%; background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; height:auto; color:var(--ink) }.t-s{ font-family:var(--f-ui); font-size:11px; fill:currentColor }.t-l{ font-family:var(--f-ui); font-size:15px; fill:currentColor }.t-d{ font-family:var(--f-disp); font-weight:800; font-size:16px; fill:currentColor }.b{ font-weight:700 }.mid{ text-anchor:middle }.end{ text-anchor:end }.mute{ fill:var(--mute) }.s{ fill:none; stroke:currentColor; stroke-width:1.4 }.s-thin{ fill:none; stroke:currentColor; stroke-width:.8 }.s-bold{ fill:none; stroke:currentColor; stroke-width:2.4 }.dot{ stroke-dasharray:1.5 4; stroke-linecap:round }.k-mute{ stroke:var(--mute) }.k-rule{ stroke:var(--rule) }.f-ink{ fill:currentColor }.f-panel{ fill:var(--panel) }.f-none{ fill:none }svg.pz-root{width:740px!important;height:372px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><g class="pz-w fw"><svg xmlns="http://www.w3.org/2000/svg" aria-label="질서의 순수한 경험이라는 가운데 층은 아래 기본 코드에서 한 뼘 비켜선 자리이자 위 이론보다 먼저 있는 가장 근본적인 층이고, 이 층에서 질서가 띠는 꼴은 문화와 시대마다 다르다." class="pz-inner" height="100%" role="img" viewBox="0 0 740 372" width="100%">
<defs>
<marker id="d-three-regions-ar" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 위: 이론·해석 -->
<rect class="s-thin f-panel" height="58" width="460" x="150" y="24"></rect>
<text class="t-l b" x="170" y="48">이론 · 해석 <tspan class="t-s mute">— 반성의 층</tspan></text>
<text class="t-s mute" x="170" y="68">과학 이론 · 철학적 해석 — 왜 질서가 있나, 왜 하필 이 질서인가</text>
<line class="s" marker-end="url(#d-three-regions-ar)" x1="380" x2="380" y1="116" y2="86"></line>
<text class="t-s" x="390" y="105">뒤늦게 정식화</text>
<!-- 가운데: 질서의 순수한 경험 -->
<rect class="s-bold f-panel" height="152" width="460" x="150" y="118"></rect>
<text class="t-d" x="170" y="147">질서의 순수한 경험</text>
<text class="t-s b end" x="594" y="146">셋 가운데 가장 근본적</text>
<text class="t-s mute" x="170" y="167">코드에서 한 뼘 비켜서서 ‘질서가 있다’는 사실과 마주침</text>
<text class="t-s mute end" x="594" y="167">이론보다 단단·오래</text>
<!-- 질서의 네 가지 꼴 -->
<!-- 1 끊김 없는 눈금 -->
<line class="s-thin" x1="170" x2="260" y1="212" y2="212"></line>
<path class="s-thin" d="M170,200 V212 M178,206 V212 M186,206 V212 M194,206 V212 M202,200 V212 M210,206 V212 M218,206 V212 M226,206 V212 M234,200 V212 M242,206 V212 M250,206 V212 M258,200 V212"></path>

<line class="s-verd w15" marker-end="url(#L15-2-ar-verd)" marker-start="url(#L15-2-ar-verd)" x1="765" x2="765" y1="158" y2="199"></line>
<circle class="f-ink" cx="765" cy="178" r="7"></circle>
<text class="t-mid t-s f-verd" x="765" y="226">힉스 보손 = 고랑을 가로지르는 떨림</text>
<text class="t-mid t-s t-mono f-verd" x="765" y="242">125 GeV</text>
<text class="t-mid t-s t-muted" x="765" y="262">공은 한 방향을 고른다 —</text>
<text class="t-mid t-s t-muted" x="765" y="278">자발적 대칭 깨짐</text>

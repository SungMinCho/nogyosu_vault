<text class="t-s mid" x="22" y="24">제비꽃</text>
<text class="t-s mid" x="66" y="24">참나무</text>
</g>
<text class="t-s b" x="392" y="264">이 빠지고 뒤섞인 조각 — 사는 꼴로 이웃한다</text>
<text class="t-s mute" x="392" y="280">두 격변 사이에 찢겨 굳은 천 = 우리가 보는 표</text>
<!-- 그물의 생김새 -->
<line class="s-thin k-rule" x1="24" x2="716" y1="300" y2="300"></line>
<text class="t-s b mute" x="24" y="320">그물의 생김새 — 저마다 달리 그려도 모두 빈틈없는 연속</text>

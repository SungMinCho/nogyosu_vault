r="middle" x="90.0" y="328.0">−2</text><circle class="st" cx="150.0" cy="250.0" r="7"></circle><text class="t-s num" text-anchor="middle" x="150.0" y="328.0">−1</text><circle class="st" cx="210.0" cy="200.0" r="7"></circle><text class="t-s num" text-anchor="middle" x="210.0" y="328.0">0</text><circle class="st" cx="270.0" cy="150.0" r="7"></circle><text class="t-s num" text-anchor="middle" x="270.0" y="328.0">1</text><circle class="st" cx="330.0" cy="100.0" r="7"></circle><text class="t-s num" text-anchor="middle" x="330.0" y="328.0">2</text><circle class="st" cx="390.0" cy="50.0" r="7"></circle><text class="t-s num" text-anchor="middle" x="390.0" y="328.0">3</text><path class="ln ln-mute" d="M294.0,310.0 L294.0,85.0" style="stroke-width:1px"></path><text class="t-s num" text-anchor="start" x="300.0" y="302.0">x = 1.4</text><text class="t-fun" text-anchor="start" x="302.0" y="167.0">Lan = ⌊x⌋ = 1</text><text class="t-fun" text-anchor="end" x="282.0" y="82.0">Ran = ⌈x⌉ = 2</text><text class="t-alarm" text-anchor="start" x="96.0" y="190.0">보간 = 1.4</text></svg></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 420" width="860" height="420" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.fig-svg .tl, .chart .tl{ font-family:var(--f-latin); font-style:italic; }.c-pass{ fill:var(--pass) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-rule{ stroke:var(--rule) }.s-cold{ stroke:var(--cold) }.s-pass{ stroke:var(--pass) }.s-caution{ stroke:var(--caution) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-shoal{ fill:var(--shoal) }.f-pass-t{ fill:var(--pass); fill-opacity:.16 }.f-caution-t{ fill:var(--caution); fill-opacity:.14 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.dash{ stroke-dasharray:5 4 }.mk-ink{ fill:var(--ink) }.mk-ink2{ fill:var(--ink2) }.mk-cold{ fill:var(--cold) }svg.pz-root{width:860px!important;height:420px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="송신이 되느냐와 수신이 되느냐를 곱한 네 칸. 송신할 수 없게 된 수신자 아독 선장과 집시들, 아무거나 주고받는 파리-플래시 기자들, 보내지도 받지도 않는 뒤퐁과 뒤퐁, 듣지 않는 송신자 카스타피오레와 투르느솔이 네 칸을 다 채우고, 정상 소통이 앉을 칸은 가짜가 차지해 0칸이다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 860 420" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F13-ar-cold" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-cold" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F13-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F13-ar-ink2" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink2" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="s-ink w2 f-none" marker-end="url(#F13-ar-ink)" x1="110" x2="134" y1="22" y2="22"></line><circle class="s-ink f-deep w15" cx="142" cy="22" r="6"></circle><text class="ts" text-anchor="start" x="154" y="26">들어오는 화살 = 수신</text><circle class="s-ink f-deep w15" cx="290" cy="22" r="6"></circle><line class="s-ink w2 f-none" marker-end="url(#F13-ar-ink)" x1="298" x2="322" y1="22" y2="22"></line><text class="ts" text-anchor="start" x="330" y="26">나가는 화살 = 송신</text><line class="s-caution w15 dash f-none" x1="462" x2="492" y1="22" y2="22"></line><line class="s-caution w2 f-none" x1="473" x2="481" y1="18" y2="26"></line><line class="s-caution w2 f-none" x1="473" x2="481" y1="26" y2="18"></line><text class="ts" text-anchor="start" x="500" y="26">막힘</text><path class="s-cold w15 f-none" d="M548.0,22.0 Q550.0,19.0 552.0,22.0 Q554.0,25.0 556.0,22.0 Q558.0,19.0 560.0,22.0 Q562.0,25.0 564.0,22.0 Q566.0,19.0 568.0,22.0 Q570.0,25.0 572.0,22.0 Q574.0,19.0 576.0,22.0 Q578.0,25.0 580.0,22.0" marker-end="url(#F13-ar-cold)"></path><text class="ts" text-anchor="start" x="590" y="26">아무거나 (소음)</text><rect class="s-ink f-shoal w15" height="150" rx="0" width="255" x="110" y="46"></rect><circle class="s-ink f-deep w15" cx="237.5" cy="84" r="10"></circle><line class="s-ink w2 f-none" marker-end="url(#F13-ar-ink)" x1="165.5" x2="223.5" y1="84" y2="84"></line><line class="s-caution w15 dash f-none" x1="253.5" x2="309.5" y1="84" y2="84"></line><line class="s-caution w2 f-none" x1="276.5" x2="286.5" y1="79" y2="89"></line><line class="s-caution w2 f-none" x1="276.5" x2="286.5" y1="89" y2="79"></line><text class="tb" text-anchor="middle" x="237.5" y="128">송신할 수 없게 된 수신자</text><text class="t" text-anchor="middle" x="237.5" y="150">아독 선장 · 집시들</text><text class="ts" text-anchor="middle" x="237.5" y="170">다 받아 내지만 말이 통하지 않는다</text><rect class="s-caution f-caution-t w15 dash" height="150" rx="0" width="255" x="365" y="46"></rect><circle class="s-ink f-deep w15" cx="492.5" cy="84" r="10"></circle><path class="s-cold w15 f-none" d="M420.5,84.0 Q422.9,80.0 425.3,84.0 Q427.8,88.0 430.2,84.0 Q432.6,80.0 435.0,84.0 Q437.4,88.0 439.8,84.0 Q442.2,80.0 444.7,84.0 Q447.1,88.0 449.5,84.0 Q451.9,80.0 454.3,84.0 Q456.8,88.0 459.2,84.0 Q461.6,80.0 464.0,84.0 Q466.4,88.0 468.8,84.0 Q471.2,80.0 473.7,84.0 Q476.1,88.0 478.5,84.0" marker-end="url(#F13-ar-cold)"></path><path class="s-cold w15 f-none" d="M506.5,84.0 Q508.9,80.0 511.3,84.0 Q513.8,88.0 516.2,84.0 Q518.6,80.0 521.0,84.0 Q523.4,88.0 525.8,84.0 Q528.2,80.0 530.7,84.0 Q533.1,88.0 535.5,84.0 Q537.9,80.0 540.3,84.0 Q542.8,88.0 545.2,84.0 Q547.6,80.0 550.0,84.0 Q552.4,88.0 554.8,84.0 Q557.2,80.0 559.7,84.0 Q562.1,88.0 564.5,84.0" marker-end="url(#F13-ar-cold)"></path><text class="tb" text-anchor="middle" x="492.5" y="128">(아무거나) 주고받는다</text><text class="t" text-anchor="middle" x="492.5" y="150">『파리-플래시』 기자들</text><text class="ts c-caution" text-anchor="middle" x="492.5" y="174">정상 소통이 앉을 자리를 가짜가 차지</text><rect class="s-ink f-shoal w15" height="150" rx="0" width="255" x="110" y="196"></rect><circle class="s-ink f-deep w15" cx="237.5" cy="234" r="10"></circle><line class="s-caution w15 dash f-none" x1="165.5" x2="221.5" y1="234" y2="234"></line><line class="s-caution w2 f-none" x1="188.5" x2="198.5" y1="229" y2="239"></line><line class="s-caution w2 f-none" x1="188.5" x2="198.5" y1="239" y2="229"></line><line class="s-caution w15 dash f-none" x1="253.5" x2="309.5" y1="234" y2="234"></line><line class="s-caution w2 f-none" x1="276.5" x2="286.5" y1="229" y2="239"></line><line class="s-caution w2 f-none" x1="276.5" x2="286.5" y1="239" y2="229"></line><text class="tb" text-anchor="middle" x="237.5" y="278">보내지도 받지도 않는다</text><text class="t" text-anchor="middle" x="237.5" y="300">뒤퐁과 뒤퐁</text><text class="ts tl" text-anchor="middle" x="237.5" y="320">Dupond · Dupont</text><rect class="s-ink f-shoal w15" height="150" rx="0" width="255" x="365" y="196"></rect><circle class="s-ink f-deep w15" cx="492.5" cy="234" r="10"></circle><line class="s-caution w15 dash f-none" x1="420.5" x2="476.5" y1="234" y2="234"></line><line class="s-caution w2 f-none" x1="443.5" x2="453.5" y1="229" y2="239"></line><line class="s-caution w2 f-none" x1="443.5" x2="453.5" y1="239" y2="229"></line><line class="s-ink w2 f-none" marker-end="url(#F13-ar-ink)" x1="506.5" x2="564.5" y1="234" y2="234"></line><text class="tb" text-anchor="middle" x="492.5" y="278">듣지 않는 송신자</text><text class="t" text-anchor="middle" x="492.5" y="300">카스타피오레 · 투르느솔</text><text class="ts" text-anchor="middle" x="492.5" y="320">쉬지 않고 노래 · 귀먹어 엉뚱하게</text><text class="t" text-anchor="end" x="100" y="125">수신 된다</text><text class="t" text-anchor="end" x="100" y="275">수신 안 된다</text><text class="t" text-anchor="middle" x="237.5" y="368">송신 안 된다</text><text class="t" text-anchor="middle" x="492.5" y="368">송신 된다</text><line class="s-ink2 w1 f-none" marker-end="url(#F13-ar-ink2)" x1="110" x2="620" y1="386" y2="386"></line><text class="ts" text-anchor="middle" x="365" y="402">송신</text><line class="s-ink2 w1 f-none" marker-end="url(#F13-ar-ink2)" x1="24" x2="24" y1="346" y2="62"></line><text class="ts" text-anchor="middle" x="24" y="52">수신</text><text class="t" text-anchor="middle" x="750" y="62">표준 도식이라면</text><rect class="s-rule f-deep w1 dash" height="40" rx="0" width="50" x="700" y="72"></rect><text class="ts" text-anchor="middle" x="725" y="96">고장</text><rect class="s-pass f-pass-t w2" height="40" rx="0" width="50" x="750" y="72"></rect><text class="ts c-pass" text-anchor="middle" x="775" y="96">정상</text><rect class="s-rule f-deep w1 dash" height="40" rx="0" width="50" x="700" y="112"></rect><text class="ts" text-anchor="middle" x="725" y="136">고장</text><rect class="s-rule f-deep w1 dash" height="40" rx="0" width="50" x="750" y="112"></rect><text class="ts" text-anchor="middle" x="775" y="136">고장</text><text class="ts" text-anchor="middle" x="750" y="172">한 칸만 차고 셋은 빈다</text><text class="t" text-anchor="middle" x="750" y="212">물랭사르</text><rect class="s-ink f-shoal w15" height="40" rx="0" width="50" x="700" y="222"></rect><text class="ts" text-anchor="middle" x="725" y="246">북적</text><rect class="s-caution f-caution-t w15 dash" height="40" rx="0" width="50" x="750" y="222"></rect><text class="ts c-caution" text-anchor="middle" x="775" y="246">가짜</text><rect class="s-ink f-shoal w15" height="40" rx="0" width="50" x="700" y="262"></rect><text class="ts" text-anchor="middle" x="725" y="286">북적</text><rect class="s-ink f-shoal w15" height="40" rx="0" width="50" x="750" y="262"></rect><text class="ts" text-anchor="middle" x="775" y="286">북적</text><text class="ts" text-anchor="middle" x="750" y="322">고장 셋은 북적이고</text><text class="t c-caution" text-anchor="middle" x="750" y="344">정상 소통 = 0칸</text></svg></g></g></g></g></svg>
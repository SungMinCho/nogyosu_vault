<text class="ts tb tm c-jag" x="460" y="77">가능 세계</text>
<text class="ts tm" x="460" y="98">모퉁이 너머의</text>
<text class="ts tm" x="460" y="117">무서운 무엇</text>
<text class="tl tm" x="318" y="155">실존하는 얼굴</text>
<text class="tl tm" x="378" y="138">실제의 말</text>
<text class="tl" x="544" y="84">표현된 것은</text>
<text class="tl" x="544" y="101">표현 바깥에 없다</text>

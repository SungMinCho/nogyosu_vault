<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 250" width="800" height="250" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-spike{ fill:var(--spike) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-spike{ stroke:var(--spike) }.dg .dash{ stroke-dasharray:4 3 }.dg .f-ink{ fill:var(--ink) }.dg .f-spike{ fill:var(--spike) }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-pos{ fill:var(--pos-soft); stroke:var(--pos) }.dg .ln-ink{ stroke:var(--ink) }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:800px!important;height:250px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="논문 숫자가 원문 표에서 arXiv 판, 재현 논문, 요약 도구, 이 판서를 거쳐 여러분 글에 이르기까지 새는 곳 다섯" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 800 250" width="100%"><defs><marker id="m12-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="bx-rot" height="40" rx="5" width="110" x="14" y="50"></rect><text class="t-s t-b" text-anchor="middle" x="69" y="75">원문 표</text><path class="ln ln-ink" d="M126,70 L144,70" marker-end="url(#m12-ink)"></path><path class="ln ln-spike dash" d="M135,78 C129,100 141,110 135,128"></path><circle class="f-spike" cx="135" cy="133" r="4"></circle><text class="t-s t-b t-spike" text-anchor="middle" x="135" y="156">판마다 고쳐짐</text><text class="t-s t-mut" text-anchor="middle" x="135" y="174">SpinQuant 5.5 → 3.8</text><rect class="bx-rot" height="40" rx="5" width="110" x="146" y="50"></rect><text class="t-s t-b" text-anchor="middle" x="201" y="75">arXiv 판</text><path class="ln ln-ink" d="M258,70 L276,70" marker-end="url(#m12-ink)"></path><path class="ln ln-spike dash" d="M267,78 C261,100 273,110 267,128"></path><circle class="f-spike" cx="267" cy="133" r="4"></circle><text class="t-s t-b t-spike" text-anchor="middle" x="267" y="156">설정이 달라짐</text><text class="t-s t-mut" text-anchor="middle" x="267" y="174">3.8 대 6.2</text><rect class="bx-rot" height="40" rx="5" width="110" x="278" y="50"></rect><text class="t-s t-b" text-anchor="middle" x="333" y="75">재현 논문</text><path class="ln ln-ink" d="M390,70 L408,70" marker-end="url(#m12-ink)"></path><path class="ln ln-spike dash" d="M399,78 C393,100 405,110 399,128"></path><circle class="f-spike" cx="399" cy="133" r="4"></circle><text class="t-s t-b t-spike" text-anchor="middle" x="399" y="156">옮겨 읽기 어긋남</text><text class="t-s t-mut" text-anchor="middle" x="399" y="174">FPTQuant 표</text><rect class="bx-rot" height="40" rx="5" width="110" x="410" y="50"></rect><text class="t-s t-b" text-anchor="middle" x="465" y="75">요약 도구</text><path class="ln ln-ink" d="M522,70 L540,70" marker-end="url(#m12-ink)"></path><path class="ln ln-spike dash" d="M531,78 C525,100 537,110 531,128"></path><circle class="f-spike" cx="531" cy="133" r="4"></circle><text class="t-s t-b t-spike" text-anchor="middle" x="531" y="156">화살표 ≠ 인용</text><text class="t-s t-mut" text-anchor="middle" x="531" y="174">FJLT ⇢ QuIP#</text><rect class="bx-rot" height="40" rx="5" width="110" x="542" y="50"></rect><text class="t-s t-b" text-anchor="middle" x="597" y="75">이 판서</text><path class="ln ln-ink" d="M654,70 L672,70" marker-end="url(#m12-ink)"></path><path class="ln ln-spike dash" d="M663,78 C657,100 669,110 663,128"></path><circle class="f-spike" cx="663" cy="133" r="4"></circle><text class="t-s t-b t-spike" text-anchor="middle" x="663" y="156">확인 없이 옮김</text><text class="t-s t-mut" text-anchor="middle" x="663" y="174">다섯 질문으로</text><rect class="bx-pos" height="40" rx="5" width="110" x="674" y="50"></rect><text class="t-s t-b" text-anchor="middle" x="729" y="75">여러분의 글</text><text class="t-s t-mut" text-anchor="middle" x="400" y="220">숫자는 표에서 여러분 글까지 다섯 번 옮겨진다. 붉은 방울이 새는 곳.</text></svg></g></g></g></g></svg>
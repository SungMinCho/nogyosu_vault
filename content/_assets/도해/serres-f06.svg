<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 400" width="860" height="400" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.fig-svg .tm, .chart .tm{ font-family:var(--f-mono); font-size:11px; }.c-pass{ fill:var(--pass) !important }.c-order{ fill:var(--order) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-pass{ stroke:var(--pass) }.s-order{ stroke:var(--order) }.s-caution{ stroke:var(--caution) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-land{ fill:var(--land) }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.dash{ stroke-dasharray:5 4 }.mk-pass{ fill:var(--pass) }.mk-caution{ fill:var(--caution) }svg.pz-root{width:860px!important;height:400px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="요정 대모의 사전. 부엌의 호박 하나, 생쥐 여섯, 쥐 하나, 도마뱀 여섯이 무도회의 마차 하나, 말 여섯, 마부 하나, 시종 여섯으로 하나씩 옮겨져 열네 개의 대응을 이룬다. 자정에 모든 대응이 거꾸로 풀리지만, 대모가 무엇에서 바꾼 것이 아니라 그냥 준 유리 구두 한 짝은 원문 쪽 짝이 없어 자정을 넘어 남는다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 860 400" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F08-ar-caution" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-caution" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F08-ar-pass" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-pass" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="tb" text-anchor="middle" x="145" y="32">부엌</text><text class="ts" text-anchor="middle" x="145" y="50">흩어진 무더기</text><text class="tb" text-anchor="middle" x="555" y="32">무도회</text><text class="ts" text-anchor="middle" x="555" y="50">한 벌의 행렬</text><rect class="s-ink f-deep w15" height="34" rx="2" width="170" x="60" y="70"></rect><text class="t" text-anchor="start" x="78" y="92">호박</text><text class="tm" text-anchor="end" x="214" y="92">× 1</text><rect class="s-order f-land w15" height="34" rx="2" width="170" x="470" y="70"></rect><text class="t" text-anchor="start" x="488" y="92">마차</text><text class="tm" text-anchor="end" x="624" y="92">× 1</text><line class="s-pass w15 f-none" marker-end="url(#F08-ar-pass)" x1="234" x2="466" y1="81" y2="81"></line><line class="s-caution w15 dash f-none" marker-end="url(#F08-ar-caution)" x1="466" x2="234" y1="94" y2="94"></line><rect class="s-ink f-deep w15" height="34" rx="2" width="170" x="60" y="118"></rect><text class="t" text-anchor="start" x="78" y="140">생쥐</text><text class="tm" text-anchor="end" x="214" y="140">× 6</text><rect class="s-order f-land w15" height="34" rx="2" width="170" x="470" y="118"></rect><text class="t" text-anchor="start" x="488" y="140">말</text><text class="tm" text-anchor="end" x="624" y="140">× 6</text><line class="s-pass w15 f-none" marker-end="url(#F08-ar-pass)" x1="234" x2="466" y1="129" y2="129"></line><line class="s-caution w15 dash f-none" marker-end="url(#F08-ar-caution)" x1="466" x2="234" y1="142" y2="142"></line><rect class="s-ink f-deep w15" height="34" rx="2" width="170" x="60" y="166"></rect><text class="t" text-anchor="start" x="78" y="188">쥐</text><text class="tm" text-anchor="end" x="214" y="188">× 1</text><rect class="s-order f-land w15" height="34" rx="2" width="170" x="470" y="166"></rect><text class="t" text-anchor="start" x="488" y="188">마부</text><text class="tm" text-anchor="end" x="624" y="188">× 1</text><line class="s-pass w15 f-none" marker-end="url(#F08-ar-pass)" x1="234" x2="466" y1="177" y2="177"></line><line class="s-caution w15 dash f-none" marker-end="url(#F08-ar-caution)" x1="466" x2="234" y1="190" y2="190"></line><rect class="s-ink f-deep w15" height="34" rx="2" width="170" x="60" y="214"></rect><text class="t" text-anchor="start" x="78" y="236">도마뱀</text><text class="tm" text-anchor="end" x="214" y="236">× 6</text><rect class="s-order f-land w15" height="34" rx="2" width="170" x="470" y="214"></rect><text class="t" text-anchor="start" x="488" y="236">시종</text><text class="tm" text-anchor="end" x="624" y="236">× 6</text><line class="s-pass w15 f-none" marker-end="url(#F08-ar-pass)" x1="234" x2="466" y1="225" y2="225"></line><line class="s-caution w15 dash f-none" marker-end="url(#F08-ar-caution)" x1="466" x2="234" y1="238" y2="238"></line><text class="ts c-pass" text-anchor="middle" x="350" y="64">대모의 사전: 낱말 대 낱말</text><text class="ts c-caution" text-anchor="middle" x="350" y="268">자정: 대응이 거꾸로 풀림</text><path class="s-order w15 f-none" d="M650,72 L658,72 L658,248 L650,248"></path><text class="t c-order" text-anchor="start" x="668" y="134">원문에 없던 관계</text><text class="ts" text-anchor="start" x="668" y="156"><tspan dy="0" x="668">말이 마차를 끌고</tspan><tspan dy="16" x="668">마부가 말을 몰고</tspan><tspan dy="16" x="668">시종이 뒤에 선다</tspan></text><line class="s-caution w3 f-none" x1="24" x2="836" y1="304" y2="304"></line><text class="t c-caution" text-anchor="start" x="28" y="294">자정 — 14개가 한꺼번에 풀린다</text><rect class="s-pass f-deep w2" height="44" rx="2" width="170" x="470" y="282"></rect><text class="t" text-anchor="start" x="488" y="309">유리 구두</text><text class="tm" text-anchor="end" x="624" y="309">× 1</text><text class="ts c-pass" text-anchor="start" x="652" y="296">← 대모가 그냥 줌</text><text class="ts c-pass" text-anchor="start" x="652" y="322">← 자정 뒤에도 남음</text><text class="ts" text-anchor="middle" x="145" y="328">원문 쪽 짝 없음 → 돌아갈 곳 없음</text><line class="s-pass w15 f-none" marker-end="url(#F08-ar-pass)" x1="555" x2="555" y1="328" y2="356"></line><text class="t c-pass" text-anchor="middle" x="555" y="374">신원을 가리는 증거</text><text class="tm" text-anchor="start" x="60" y="374">1 + 6 + 1 + 6 = 14개의 일대일 대응</text></svg></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 330" width="900" height="330" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#ECEAF0; --panel:#F7F6F9; --ink:#1D1A26; --muted:#5B5668; --rule:#C9C5D2; --rule-2:#DCD9E2;
  --red:#B42318;   --red-fill:#F3D3CE;
  --flesh:#995532; --flesh-fill:#ECCFBC;
  --cob:#2B4A9B;   --cob-fill:#D3DBF1;
  --verd:#1F6F62;  --verd-fill:#CDE7E1;
  --void:#17141F;  --on-void:#F2EEF7;
  --display-ko:"Hahmlet","Noto Serif KR","Noto Serif CJK KR",serif;
  --body:"Noto Serif KR","Noto Serif CJK KR","Apple SD Gothic Neo",serif;
  --display-la:"GFS Didot","Didot","Bodoni 72","Noto Serif",serif;
  --sans:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Red Hat Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }svg.fig{display:block;width:100%;height:auto;font-family:var(--sans);overflow:visible}svg.fig text{font-family:var(--sans);font-size:14px;fill:var(--ink)}svg.fig .t-s{font-size:12px}svg.fig .t-b{font-weight:700}svg.fig .t-la{font-family:var(--display-la)}svg.fig .t-mid{text-anchor:middle}svg.fig .t-muted{fill:var(--muted)}svg.fig .f-ink{fill:var(--ink)}svg.fig .f-panel{fill:var(--panel)}svg.fig .f-rule2{fill:var(--rule-2)}svg.fig .f-red{fill:var(--red)}svg.fig .f-cob{fill:var(--cob)}svg.fig .f-cobf{fill:var(--cob-fill)}svg.fig .f-void{fill:var(--void)}svg.fig .f-none{fill:none}svg.fig .s-ink{stroke:var(--ink)}svg.fig .s-muted{stroke:var(--muted)}svg.fig .s-rule{stroke:var(--rule)}svg.fig .s-red{stroke:var(--red)}svg.fig .s-cob{stroke:var(--cob)}svg.fig .w1{stroke-width:1px}svg.fig .w15{stroke-width:1.5px}svg.fig .w2{stroke-width:2px}svg.fig .dash{stroke-dasharray:6 5}:root{ --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2); }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{max-width:560px;margin-inline:auto}.doc{padding-inline:var(--pad)}.lecture{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-block:2.5rem 3rem;
  content-visibility:auto;border-top:1px solid var(--rule)}.fig-wrap{margin:.8rem 0 !important}.fig-scroll{overflow-x:auto;background:
  linear-gradient(to right,var(--panel) 30%,transparent) left center/2.2rem 100% no-repeat local,
  linear-gradient(to left,var(--panel) 30%,transparent) right center/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) left center/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) right center/.8rem 100% no-repeat scroll,
  var(--panel);padding:1rem .9rem .6rem}.fig-inner{width:100%}svg.pz-root{width:900px!important;height:330px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig-wrap"><g class="pz-w fig-scroll"><g class="pz-w fig-inner"><svg xmlns="http://www.w3.org/2000/svg" aria-label="라캉의 처음 세 변주는 사유와 존재 두 원을 서로 밀어내거나 한쪽을 환상으로 깎아 틈을 드러내지만, 말년의 넷째 컷에서 두 원은 겹치되 겹친 자리가 비어 있다. 그 빈 교집합, 생각하지 않고 있지 않은 벌어짐이 코기토의 영점이다." class="fig pz-inner" height="100%" role="img" viewBox="0 0 900 330" width="100%">
<defs>
<marker id="L14-2-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 위 묶음 -->
<path class="f-none s-muted w15" d="M24,46 L24,36 L651,36 L651,46"></path>
<text class="t-mid t-s t-b t-muted" x="337" y="26">세 변주 — 사유와 존재를 가르는 틈</text>
<path class="f-none s-red w15" d="M699,46 L699,36 L876,36 L876,46"></path>
<text class="t-mid t-s t-b f-red" x="787" y="26">말년 — 부정적 겹침</text>
<!-- 컷 칸막이 -->
<line class="s-rule w1 dash" x1="225" x2="225" y1="58" y2="306"></line>
<line class="s-rule w1 dash" x1="450" x2="450" y1="58" y2="306"></line>
<line class="s-rule w1" x1="675" x2="675" y1="58" y2="306"></line>
<!-- ① 존재가 밀려남 -->
<text class="t-mid t-s t-muted" x="112" y="72">①</text>
<circle class="f-cobf s-cob w2" cx="72" cy="158" r="40"></circle>
<text class="t-mid t-b f-cob" x="72" y="163">사유</text>
<circle class="f-rule2 s-ink w2" cx="164" cy="158" r="40"></circle>
<text class="t-mid t-b" x="164" y="163">존재</text>
<path class="f-none s-ink w15" d="M86,114 Q118,90 150,114" marker-end="url(#L14-2-ar-ink)"></path>
<text class="t-mid t-s" x="118" y="92">밀려남</text>
<text class="t-mid" x="112" y="228">나는 내가 생각하는 곳에</text>
<text class="t-mid" x="112" y="250">있지 않다</text>
<text class="t-mid t-s t-muted" x="112" y="280">존재를 탈중심화</text>
<text class="t-mid t-s t-muted" x="112" y="296">존재의 핵은 자기의식 밖에</text>
<!-- ② 사유가 밀려남 -->
<text class="t-mid t-s t-muted" x="337" y="72">②</text>
<circle class="f-rule2 s-ink w2" cx="297" cy="158" r="40"></circle>
<text class="t-mid t-b" x="297" y="163">존재</text>
<circle class="f-none s-cob w2 dash" cx="389" cy="158" r="40"></circle>
<text class="t-mid t-b f-cob" x="389" y="163">사유</text>
<path class="f-none s-ink w15" d="M311,114 Q343,90 375,114" marker-end="url(#L14-2-ar-ink)"></path>
<text class="t-mid t-s" x="343" y="92">밀려남</text>
<text class="t-mid" x="337" y="228">나는 내가 있지 않은 곳에서</text>
<text class="t-mid" x="337" y="250">생각한다</text>
<text class="t-mid t-s t-muted" x="337" y="280">사유를 탈중심화</text>
<text class="t-mid t-s t-muted" x="337" y="296">무의식 — 실존 없이 고집하는 장소</text>
<!-- ③ 존재가 사유 속 환상으로 -->
<text class="t-mid t-s t-muted" x="562" y="72">③</text>
<circle class="f-cobf s-cob w2" cx="562" cy="158" r="56"></circle>
<text class="t-mid t-b f-cob" x="562" y="128">사유</text>
<circle class="f-panel s-ink w15 dash" cx="568" cy="170" r="24"></circle>
<text class="t-mid t-s" x="568" y="174">존재</text>
<text class="t-mid" x="562" y="228">나는 생각한다:</text>
<text class="t-mid" x="562" y="250">‘그러므로 나는 있다’</text>
<text class="t-mid t-s t-muted" x="562" y="280">구두점을 바꿈</text>
<text class="t-mid t-s t-muted" x="562" y="296">존재 = 사유가 지어낸 환상</text>
<!-- ④ 비어 있는 교집합 -->
<text class="t-mid t-s t-muted" x="787" y="72">④</text>
<circle class="f-cobf s-cob w2" cx="766" cy="158" r="44"></circle>
<circle class="f-rule2 s-ink w2" cx="808" cy="158" r="44"></circle>
<path class="f-void s-red w2" d="M787,119.5 A44,44 0 0,1 787,196.5 A44,44 0 0,1 787,119.5 z"></path>
<circle class="f-none s-cob w2" cx="766" cy="158" r="44"></circle>
<path class="f-none s-red w2" d="M787,119.5 A44,44 0 0,1 787,196.5 A44,44 0 0,1 787,119.5 z"></path>
<text class="t-mid t-s t-b f-cob" x="742" y="163">사유</text>
<text class="t-mid t-s t-b" x="832" y="163">존재</text>
<text class="t-mid t-b f-red" x="787" y="228">나는 생각하지 않고,</text>
<text class="t-mid t-b f-red" x="787" y="250">나는 있지 않다</text>
<text class="t-mid t-s f-red" x="787" y="280">부정적 교차 = 코기토의 영점</text>
<text class="t-mid t-s t-muted" x="787" y="296">벌어짐 <tspan class="t-la">béance</tspan> — 존재 속 공백</text>
</svg></g></g></g></g></g></svg>
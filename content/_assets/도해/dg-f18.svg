<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 330" width="720" height="330" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2-t{ fill:var(--ink-2); }.f-muted{ stroke:var(--muted); }.f-muted-t{ fill:var(--muted); }.f-indigo-t{ fill:var(--indigo); }.f-madder{ stroke:var(--madder); }.f-madder-t{ fill:var(--madder); }.f-ochre{ stroke:var(--ochre); }.f-ochre-t{ fill:var(--ochre); }.f-ochre-f{ fill:var(--ochre-soft); }.f-mend-t{ fill:var(--mend); }.f-panel-f{ fill:var(--panel); }.f-none{ fill:none; }.f-dash{ stroke-dasharray:6 5; }.f-dot{ stroke-dasharray:2 4; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-l{ font-size:15px; }svg.pz-root{width:720px!important;height:330px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="왼쪽: 한 몸은 종의 칸이 아니라 경도(입자들 사이의 빠름과 느림)와 위도(할 수 있는 변용태의 강도)의 자리로 찍힌다 — 진드기는 세 변용태의 낮고 좁은 띠, 짐말은 경주마보다 소에 가깝다. 오른쪽: 말벌과 난초는 서로 닮아 가지 않고, 둘 사이를 수직으로 지나는 되기의 선 하나가 크기도 방향도 다른 두 움직임을 한 블록으로 끌고 간다." class="pz-inner" height="100%" role="img" viewBox="0 0 720 330" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f18-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f18-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f18-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f18-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f18-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f18-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f18-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="f-ink f-none" marker-end="url(#f18-a-ink)" stroke-width="1.5" x1="70" x2="372" y1="284" y2="284"></line><line class="f-ink f-none" marker-end="url(#f18-a-ink)" stroke-width="1.5" x1="70" x2="70" y1="284" y2="48"></line><text class="f-ink-t" text-anchor="middle" x="221" y="312">경도: 빠름과 느림</text><text class="f-ochre-t" text-anchor="start" x="64" y="32">위도: 변용태의 강도</text><text class="f-muted-t t-s" text-anchor="start" x="80" y="276">느림</text><text class="f-muted-t t-s" text-anchor="end" x="366" y="276">빠름</text><rect class="f-ochre f-ochre-f" height="24" rx="10" stroke-width="1.5" width="92" x="96" y="236"></rect><text class="f-ochre-t t-s" text-anchor="middle" x="142" y="252.5">빛·냄새·체온</text><text class="f-ink-t" text-anchor="start" x="196" y="252.5">진드기</text><circle class="f-ink f-ochre-f" cx="204" cy="178" r="6" stroke-width="1.5"></circle><circle class="f-ink f-ochre-f" cx="178" cy="146" r="6" stroke-width="1.5"></circle><circle class="f-ink f-ochre-f" cx="334" cy="92" r="6" stroke-width="1.5"></circle><text class="f-ink-t" text-anchor="start" x="214" y="192">짐말</text><text class="f-ink-t" text-anchor="end" x="168" y="150">소</text><text class="f-ink-t" text-anchor="end" x="324" y="88">경주마</text><line class="f-ochre f-none" stroke-width="1.8" x1="200" x2="182" y1="173" y2="151"></line><text class="f-ochre-t t-s" text-anchor="end" x="184" y="182">가깝다</text><line class="f-muted f-none f-dot" stroke-width="1.2" x1="210" x2="328" y1="175" y2="95"></line><text class="f-muted-t t-s" text-anchor="start" x="274" y="152">멀다</text><line class="f-ink f-none" stroke-width="1" x1="402" x2="402" y1="16" y2="318"></line><rect class="f-madder f-dash f-none" height="270" rx="14" stroke-width="1.3" width="290" x="418" y="40"></rect><text class="f-madder-t t-s" text-anchor="start" x="430" y="60">되기 블록</text><line class="f-muted f-none f-dot" stroke-width="1.2" x1="506" x2="616" y1="208" y2="208"></line><text class="f-muted-t t-s" text-anchor="middle" x="532" y="226">닮음 아님</text><path class="f-ink f-panel-f" d="M470,205 Q456,184 476,186 Q480,196 470,205 Z" stroke-width="1.2"></path><path class="f-ink f-panel-f" d="M474,205 Q478,182 492,192 Q488,202 474,205 Z" stroke-width="1.2"></path><circle class="f-ink f-panel-f" cx="456" cy="208" r="5" stroke-width="1.4"></circle><ellipse class="f-ink f-panel-f" cx="470" cy="208" rx="8" ry="5.5" stroke-width="1.4"></ellipse><ellipse class="f-ink f-ochre-f" cx="493" cy="210" rx="15" ry="8" stroke-width="1.4"></ellipse><line class="f-ink f-none" stroke-width="1.6" x1="488" x2="488" y1="203" y2="217"></line><line class="f-ink f-none" stroke-width="1.6" x1="495" x2="495" y1="203" y2="217"></line><line class="f-ink f-none" stroke-width="1.6" x1="502" x2="502" y1="203" y2="217"></line><text class="f-ink-t t-l" text-anchor="middle" x="474" y="244">말벌</text><path class="f-ink f-panel-f" d="M652,200 Q661.0,189.0 652.0,180.0 Q643.0,189.0 652,200 Z" stroke-width="1.2"></path><path class="f-ink f-panel-f" d="M652,200 Q667.3,204.5 674.8,192.6 Q661.8,187.4 652,200 Z" stroke-width="1.2"></path><path class="f-ink f-panel-f" d="M652,200 Q652.5,216.0 666.1,219.4 Q667.0,205.4 652,200 Z" stroke-width="1.2"></path><path class="f-ink f-panel-f" d="M652,200 Q637.0,205.4 637.9,219.4 Q651.5,216.0 652,200 Z" stroke-width="1.2"></path><path class="f-ink f-panel-f" d="M652,200 Q642.2,187.4 629.2,192.6 Q636.7,204.5 652,200 Z" stroke-width="1.2"></path><circle class="f-ink f-ochre-f" cx="652" cy="200" r="4" stroke-width="1.2"></circle><text class="f-ink-t t-l" text-anchor="middle" x="652" y="244">난초</text><line class="f-madder f-none" marker-end="url(#f18-a-madder)" stroke-width="2.6" x1="563" x2="563" y1="296" y2="54"></line><text class="f-madder-t t-s" text-anchor="start" x="571" y="64">되기의 선</text><path class="f-madder f-none" d="M492,194 C502,150 533,140 560,124" marker-end="url(#f18-a-madder)" stroke-width="2.8"></path><text class="f-madder-t" text-anchor="middle" x="482" y="92">말벌의 난초-되기</text><text class="f-ink2-t t-s" text-anchor="middle" x="482" y="109">번식 기계의 부품</text><path class="f-madder f-none" d="M626,194 Q603,170 567,172" marker-end="url(#f18-a-madder)" stroke-width="1.3"></path><text class="f-madder-t" text-anchor="middle" x="646" y="134">난초의 말벌-되기</text><text class="f-ink2-t t-s" text-anchor="middle" x="646" y="151">욕망의 대상</text></svg></g></g></g></g></svg>
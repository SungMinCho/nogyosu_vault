width="28" x="552" y="201.165"></rect><text class="t-s t-mono" text-anchor="middle" x="566" y="195.165">1</text><rect class="bar-mx" height="153.743" rx="0" width="28" x="586" y="82.2565"></rect><text class="t-s t-mono" text-anchor="middle" x="600" y="76.2565">36</text><line class="ln" x1="548" x2="618" y1="236" y2="236"></line><text class="t-s t-b" text-anchor="middle" x="583" y="252">A 이상치</text><text class="t-s t-mut" text-anchor="middle" x="583" y="266">곱 36</text><rect class="bar-nv" height="34.8352" rx="0" width="28" x="664" y="201.165"></rect><text class="t-s t-mono" text-anchor="middle" x="678" y="195.165">1</text><rect class="bar-mx" height="11.8352" rx="0" width="28" x="698" y="224.165"></rect><text class="t-s t-mono" text-anchor="middle" x="712" y="218.165">0.5</text><line class="ln" x1="660" x2="730" y1="236" y2="236"></line><text class="t-s t-b" text-anchor="middle" x="695" y="252">B 평범</text><text class="t-s t-mut" text-anchor="middle" x="695" y="266">곱 0.5</text><text class="t-s t-b t-nv" text-anchor="start" x="542" y="294">활성 1 : 1</text><text class="t-s t-b t-mx" text-anchor="start" x="660" y="294">가중치 72 : 1</text><rect class="bar-nv" height="10" rx="0" width="10" x="560" y="309"></rect><text class="t-s" text-anchor="start" x="575" y="318">활성 최대 a</text><rect class="bar-mx" height="10" rx="0" width="10" x="660" y="309"></rect><text class="t-s" text-anchor="start" x="675" y="318">가중치 최대 b</text><text class="t-s t-mut" text-anchor="start" x="26" y="318">세로축은 로그 눈금. 세 경우 모두 (활성의 비) × (가중치의 비) = 72.</text></svg></svg>
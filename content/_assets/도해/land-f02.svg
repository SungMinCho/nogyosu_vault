y="129">물신숭배</text><text class="t-b" x="20" y="183">하이데거</text><rect class="f-zerosoft s-zero" height="36" rx="5" width="210" x="120" y="160"></rect><text text-anchor="middle" x="225" y="182.5">존재</text><line class="s-ink" marker-end="url(#conditions-ink)" x1="332" x2="405" y1="178" y2="178"></line><rect class="f-ledgersoft s-ledger" height="36" rx="5" width="170" x="410" y="160"></rect><text text-anchor="middle" x="495" y="182.5">존재자</text><text class="f-mute" x="600" y="183">존재신론</text><text class="t-b" x="20" y="237">데리다</text><rect class="f-zerosoft s-zero" height="36" rx="5" width="210" x="120" y="214"></rect><text text-anchor="middle" x="225" y="236.5">글쓰기</text><line class="s-ink" marker-end="url(#conditions-ink)" x1="332" x2="405" y1="232" y2="232"></line><rect class="f-ledgersoft s-ledger" height="36" rx="5" width="170" x="410" y="214"></rect><text text-anchor="middle" x="495" y="236.5">기호</text><text class="f-mute" x="600" y="237">로고스중심주의</text><rect class="f-sunsoft" height="50" rx="8" width="724" x="8" y="261"></rect><text class="t-b" x="20" y="291">바타유</text><rect class="f-zerosoft s-zero" height="36" rx="5" width="210" x="120" y="268"></rect><text class="t-b" text-anchor="middle" x="225" y="290.5">쓰임 — 그냥 써 버림</text><line class="s-ink" marker-end="url(#conditions-ink)" x1="332" x2="405" y1="286" y2="286"></line><rect class="f-ledgersoft s-ledger" height="36" rx="5" width="170" x="410" y="268"></rect><text class="t-b" text-anchor="middle" x="495" y="290.5">쓸모</text><text class="t-b f-sun" x="600" y="291">'이성'</text></svg></svg>
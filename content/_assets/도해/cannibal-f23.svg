<path class="s-ink w1" d="M170,221.0 L191,221.0" marker-end="url(#f18-a-ink)"></path>
<path class="s-ink w1" d="M422,221.0 L443,221.0" marker-end="url(#f18-a-ink)"></path>
<text class="tl tm" x="307.0" y="276">대조 · 살해자는 먹히지 않고 곧장 마이가 된다</text>

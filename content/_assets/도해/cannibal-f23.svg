<path class="s-mod w1" d="M194,112 Q194,119 201,119 L300.0,119 Q307.0,119 307.0,126 Q307.0,119 314.0,119 L413,119 Q420,119 420,112"></path>
<text class="ts tm c-mod" x="307.0" y="143">이중 중개</text>
<text class="tbig tb tm" x="34" y="91">4</text>
<text class="tl tm" x="34" y="108">자리</text>
<text class="ts tb" x="68" y="172">아마존 샤먼</text>

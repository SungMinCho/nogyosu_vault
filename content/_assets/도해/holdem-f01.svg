<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 620 236" width="620" height="236" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#F1F2EC; --paper:#FAFAF6; --soft:#E3E6DE; --tie:#B9BEB5; --stack:#C9CDC4; --grid:#DCE0D6; --rule:#CDD3CA;
  --ink:#1B2420; --ink-2:#44504A; --muted:#6E7871; --on:#FFFFFF;
  --pot:#23825A; --risk:#C0392B; --eq:#A0700F; --un:#2F5DA8; --warn:#8A4FB8;
  --eq-bg:#F3E7CC; --risk-bg:#F6DEDA;
  --f-body:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-disp:"Song Myung","Nanum Myeongjo","Noto Serif KR",serif;
  --f-num:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --f-dg:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --f-math:"Noto Sans Math","STIX Two Math","Cambria Math",math;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}}:root[data-theme="dark"]{
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:2.2rem 4rem}.lecture{display:contents}.fig{margin:.6rem 0 !important;display:grid;gap:.55rem}.fig .frame{overflow-x:auto;background:
  linear-gradient(90deg,var(--paper) 30%,transparent),linear-gradient(270deg,var(--paper) 30%,transparent),
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent),
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent) 100% 0;
  background-color:var(--paper);background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll;
  border:1px solid var(--rule);border-radius:3px;padding:.7rem}.dg{display:block;width:100%;height:auto;font-family:var(--f-dg)}.dg text{fill:var(--ink);font-size:12px}.dg text.mu{fill:var(--muted)}.dg text.b{font-weight:700}.dg .on{fill:var(--on)}.dg text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}.dg text.card{font-family:var(--f-num)}.dg .f-eq{fill:var(--eq)}.dg .f-un{fill:var(--un)}.dg .f-ink{fill:var(--ink)}.dg .f-paper{fill:var(--paper)}.dg .s-ink{stroke:var(--ink);stroke-width:1.2}.dg .nofill{fill:none}.dg circle:hover,.dg rect[class]:hover{filter:brightness(1.08)}svg.pz-root{width:620px!important;height:236px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="파스칼의 풀이: 2 대 1에서 한 판을 더 상상하면 A는 이기면 64, 지면 2 대 2가 되어 32. 반반이니 A의 몫은 48, B는 16." class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 620 236" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar-pas" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="f-paper s-ink" height="46.0" rx="4" width="120.0" x="14.0" y="92.0"></rect><text class="b" style="font-size:13px" text-anchor="middle" x="74.0" y="112.0">2 : 1에서 멈춤</text><text style="font-size:13px" text-anchor="middle" x="74.0" y="128.0">판돈 64</text><rect class="f-paper s-ink" height="40.0" rx="4" width="128.0" x="214.0" y="30.0"></rect><text style="font-size:13px" text-anchor="middle" x="278.0" y="47.0">A가 이긴다</text><text style="font-size:13px" text-anchor="middle" x="278.0" y="63.0">→ 3점</text><rect class="f-paper s-ink" height="40.0" rx="4" width="128.0" x="214.0" y="160.0"></rect><text style="font-size:13px" text-anchor="middle" x="278.0" y="177.0">B가 이긴다</text><text style="font-size:13px" text-anchor="middle" x="278.0" y="193.0">→ 2 : 2</text><path class="s-ink nofill" d="M134,108 C170,108 180,50 212,50" marker-end="url(#ar-pas)"></path><path class="s-ink nofill" d="M134,122 C170,122 180,180 212,180" marker-end="url(#ar-pas)"></path><text class="mu" style="font-size:13px" text-anchor="middle" x="160.0" y="66.0">½</text><text class="mu" style="font-size:13px" text-anchor="middle" x="160.0" y="176.0">½</text><path class="s-ink" d="M342,50 L392,50" marker-end="url(#ar-pas)"></path><path class="s-ink" d="M342,180 L392,180" marker-end="url(#ar-pas)"></path><text class="b num" style="font-size:14px" text-anchor="start" x="400.0" y="46.0">A 64</text><text class="mu num" style="font-size:12px" text-anchor="start" x="400.0" y="62.0">(B 0)</text><text class="b num" style="font-size:14px" text-anchor="start" x="400.0" y="176.0">A 32</text><text class="mu" style="font-size:12px" text-anchor="start" x="400.0" y="192.0">(B 32, 처지가 같으니 반반)</text><text class="mu" style="font-size:12px" text-anchor="start" x="400.0" y="94.0">A의 몫 = ½·64 + ½·32</text><rect class="f-eq" height="22.0" rx="0" width="149.0" x="400.0" y="102.0"><title>A 48피스톨</title></rect><rect class="f-un" height="22.0" rx="0" width="49.0" x="551.0" y="102.0"><title>B 16피스톨</title></rect><text class="on num" style="font-size:13px;font-weight:700" text-anchor="middle" x="475.0" y="117.5">48</text><text class="on num" style="font-size:13px;font-weight:700" text-anchor="middle" x="575.0" y="117.5">16</text></svg></g></g></g></g></svg>
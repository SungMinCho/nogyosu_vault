}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .f-ink{ fill:var(--ink) }.dg .f-rot{ fill:var(--rot) }.dg .ln-ink{ stroke:var(--ink) }.dg .halo{ paint-order:stroke; stroke:var(--paper); stroke-width:4px; stroke-linejoin:round }.lecture > .frame{ max-width:var(--wide) }.dg .f-mut-s{ fill:var(--paper); stroke:var(--muted); stroke-width:1 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="라우터 로짓 2.00, 1.95, 1.93, 0.40에서 top-2는 전문가 1과 2인데, 로짓이 0.01과 0.03만 흔들려 2.00, 1.94, 1.96이 되면 top-2가 전문가 1과 3으로 바뀐다" class="dg" height="100%" role="img" style="" viewBox="0 0 760 300" width="100%"><defs><marker id="m11-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-s t-b" text-anchor="middle" x="200" y="30">양자화 전</text><line class="ln-hair" x1="74" x2="330" y1="204.286" y2="204.286"></line><text class="t-s t-mono t-mut" text-anchor="end" x="70" y="208.286">1.90</text><line class="ln-hair" x1="74" x2="330" y1="140" y2="140"></line><text class="t-s t-mono t-mut" text-anchor="end" x="70" y="144">1.95</text><line class="ln-hair" x1="74" x2="330" y1="75.7143" y2="75.7143"></line><text class="t-s t-mono t-mut" text-anchor="end" x="70" y="79.7143">2.00</text><rect class="f-rot" height="154.286" rx="0" width="40" x="90" y="75.7143"></rect><text clas
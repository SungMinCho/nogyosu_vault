<text class="t t-b" text-anchor="end" x="510.0" y="414">양</text>
<line class="s-cry w2" marker-end="url(#f19-ar-cry)" x1="92" x2="282.4" y1="392" y2="257.6"></line>
<text class="t t-b t-cry" text-anchor="end" x="274.4" y="255.6">질</text>
<line class="s-inf w2" marker-end="url(#f19-ar-inf)" x1="92" x2="92" y1="392" y2="122"></line>
<text class="t t-b t-inf" x="100" y="132">강도</text>
<text class="t-s" x="16" y="24"><tspan class="t-b">→ 양</tspan>  보내는 데 드는 신호의 수</text>
<text class="t-s" x="16" y="41"><tspan class="t-b t-cry">↗ 질</tspan>  좋은 형태 — 단순하고 짧게 기술되는 정도</text>
<text class="t-s" x="16" y="58"><tspan class="t-b t-inf">↑ 강도</tspan>  그 신호가 받는 주체의 극성을 얼마나 세게 정하나</text>
<path class="f-none s-mute w1 dash" d="M451.0,380.0 L583.6,286.4"></path>
<text class="t-s t-mute halo" x="527.3" y="339.2">양은 같은 높이</text>
<path class="f-none s-mute w1 dot" d="M484.4,329.6 L379.0,355.0" marker-end="url(#f19-ar-ink)"></path>
<circle class="f-mute" cx="124.6" cy="382.4" r="2.6"></circle>

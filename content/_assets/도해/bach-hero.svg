<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 456" width="400" height="456" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --flour:#EFF0EB; --flour-2:#E6E8E1; --ink:#1C2025; --ink-soft:#4E555D; --rule:#C7CAC1;
  --iron:#3D4652; --water:#1B7480; --spirit:#6448B0; --grain:#A8721A; --rust:#BF4128;
  --water-t:rgba(27,116,128,.12); --spirit-t:rgba(100,72,176,.11); --grain-t:rgba(168,114,26,.13); --rust-t:rgba(191,65,40,.10); --iron-t:rgba(61,70,82,.10);
  --shadow:rgba(28,32,37,.18);
  --display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --body:"Newsreader","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --label:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","Nanum Gothic Coding",ui-monospace,Menlo,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }}:root[data-theme="dark"]{
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.shell{ max-width:var(--shell); margin-inline:auto; padding-inline:var(--pad); }.hero{ padding-block:2.2rem 1.4rem; }.hero-grid{ display:grid; grid-template-columns:minmax(0,1fr); gap:1.2rem; align-items:center; padding-block:1.4rem 0; }@media (min-width:52em){.hero-grid{ grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:2rem }}.wheel-wrap{ min-width:0 }.wheel{ display:block; width:100%; height:auto; max-width:34rem; margin-inline:auto }.wheel .paddle{ cursor:pointer }.wheel .paddle:hover .pd, .wheel .paddle:focus .pd{ fill:var(--spirit-t); stroke:var(--spirit) }.wheel .paddle:focus{ outline:none }.lec-no svg{ width:2.2rem; height:2.2rem; flex:none }.fig-frame svg{ display:block; width:100%; height:auto; margin-inline:auto; max-width:46rem }.t{ fill:var(--ink); font-family:var(--label); font-size:13px }.t-spirit{ fill:var(--spirit) }.t-b{ font-weight:600 }.t-sm{ font-size:11.5px }.t-mono{ font-family:var(--mono) }.s-iron{ stroke:var(--iron); fill:none }.s-water{ stroke:var(--water); fill:none }.s-spirit{ stroke:var(--spirit); fill:none }.s-grain{ stroke:var(--grain); fill:none }.s-rust{ stroke:var(--rust); fill:none }.f-iron{ fill:var(--iron) }.f-iron-t{ fill:var(--iron-t) }.f-water-t{ fill:var(--water-t) }.f-spirit-t{ fill:var(--spirit-t) }.f-grain-t{ fill:var(--grain-t) }.f-rust-t{ fill:var(--rust-t) }.w15{ stroke-width:1.5 }.dot{ stroke-dasharray:1.5 4; stroke-linecap:round }.halo-panel{ paint-order:stroke; stroke:var(--flour); stroke-width:5px; stroke-linejoin:round }svg.pz-root{width:400px!important;height:456px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g
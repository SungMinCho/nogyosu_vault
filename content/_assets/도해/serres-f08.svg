<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 380" width="860" height="380" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tl, .chart .tl{ font-family:var(--f-latin); font-style:italic; }.fig-svg .tm, .chart .tm{ font-family:var(--f-mono); font-size:11px; }.c-ink2{ fill:var(--ink2) !important }.c-pass{ fill:var(--pass) !important }.s-ink{ stroke:var(--ink) }.s-rule{ stroke:var(--rule) }.s-pass{ stroke:var(--pass) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-pass-t{ fill:var(--pass); fill-opacity:.16 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.mk-pass{ fill:var(--pass) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="『헤르메스 II』의 세 원. 과학들 사이의 이론적 간섭과 사물들의 객관적 간섭이라는 두 원이 겹쳐 있고, 주체들 사이의 모나드적 간섭이라는 세 번째 원이 둘을 품는다. 오른쪽에는 세 대체: 환원 대신 번역, 생산 대신 소통, 지시 대신 간섭." class="fig-svg" height="100%" role="img" viewBox="0 0 860 380" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F10-ar-pass" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-pass" d="M0,0 L10,5 L0,10 z"></path></marker></defs><circle class="s-pass f-pass-t w2" cx="215" cy="200" r="160"></circle><circle class="s-ink f-deep w15" cx="165" cy="205" r="70"></circle><circle class="s-ink f-deep w15" cx="265" cy="205" r="70"></circle><circle class="s-ink f-none w15" cx="165" cy="205" r="70"></circle><text class="t c-pass" text-anchor="middle" x="215" y="78">③ 주체 간 · 모나드적</text><text class="ts" text-anchor="middle" x="215" y="96">인간들 · "우리"</text><text class="t" text-anchor="middle" x="132" y="200">① 이론</text><text class="ts" text-anchor="middle" x="132" y="218">과학들 사이</text><text class="t" text-anchor="middle" x="298" y="200">② 사물</text><text class="ts" text-anchor="middle" x="298" y="218">객관적</text><text class="ts" text-anchor="middle" x="215" y="210">교차</text><text class="ts" text-anchor="middle" x="215" y="312">셋째 원이 앞의 둘을 품는다</text><text class="tm c-ink2" text-anchor="middle" x="215" y="330">« compris » = 포함 · 이해</text><text class="ts" text-anchor="middle" x="560" y="52">사라지는 문제</text><text class="ts" text-anchor="middle" x="770" y="52">남는 것</text><text class="t c-ink2" text-anchor="middle" x="462" y="112">①</text><text class="t tl c-ink2" text-anchor="middle" x="560" y="108">réduction</text><text class="ts" text-anchor="middle" x="560" y="126">환원</text><line class="s-pass w15 f-none" marker-end="url(#F10-ar-pass)" x1="625" x2="700" y1="104" y2="104"></line><text class="t tl c-pass" text-anchor="middle" x="770" y="108">tra-duction</text><text class="ts c-pass" text-anchor="middle" x="770" y="126">번역</text><text class="ts" text-anchor="middle" x="662" y="148">뒤로 → 건너편으로</text><text class="t c-ink2" text-anchor="middle" x="462" y="204">②</text><text class="t tl c-ink2" text-anchor="middle" x="560" y="200">production</text><text class="ts" text-anchor="middle" x="560" y="218">생산</text><line class="s-pass w15 f-none" marker-end="url(#F10-ar-pass)" x1="625" x2="700" y1="196" y2="196"></line><text class="t tl c-pass" text-anchor="middle" x="770" y="200">communication</text><text class="ts c-pass" text-anchor="middle" x="770" y="218">소통</text><text class="ts" text-anchor="middle" x="662" y="240">프로메테우스 → 헤르메스</text><text class="t c-ink2" text-anchor="middle" x="462" y="296">③</text><text class="t tl c-ink2" text-anchor="middle" x="560" y="292">référence</text><text class="ts" text-anchor="middle" x="560" y="310">지시</text><line class="s-pass w15 f-none" marker-end="url(#F10-ar-pass)" x1="625" x2="700" y1="288" y2="288"></line><text class="t tl c-pass" text-anchor="middle" x="770" y="292">interférence</text><text class="ts c-pass" text-anchor="middle" x="770" y="310">간섭</text><text class="ts" text-anchor="middle" x="662" y="332">되돌려 → 사이로</text><line class="s-rule w1 f-none" x1="430" x2="850" y1="74" y2="74"></line></svg></svg>
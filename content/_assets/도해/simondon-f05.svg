<text class="t t-b" text-anchor="middle" x="100" y="130">벽돌 틀</text>
<text class="t-s t-mute" text-anchor="middle" x="100" y="146">몇 초 고정 · 탈형 한 번</text>
<text class="t-s t-mute" text-anchor="middle" x="100" y="160">평형이 틀 밖에서도 보존</text>
<text class="t t-b" text-anchor="middle" x="300" y="130">빚기</text>
<text class="t-s t-mute" text-anchor="middle" x="300" y="146">손 빚기 · 구멍 틀 · 매끈한 압연기</text>
<text class="t-s t-mute" text-anchor="middle" x="300" y="160">단면 고정, 탈형은 연속</text>

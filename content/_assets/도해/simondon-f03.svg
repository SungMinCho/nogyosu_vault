  --shade:#050909; --on-shade:#C9D6D2; color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.hero-fig svg{ width:100%; height:auto; display:block }figure.fig{ margin:.4rem 0 .6rem }.fig-frame{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background:
  linear-gradient(to right,var(--paper),var(--paper)) left/1.2rem 100% no-repeat local,
  linear-gradient(to left,var(--paper),var(--paper)) right/1.2rem 100% no-repeat local,
  linear-gradient(to right,rgba(0,0,0,.18),rgba(0,0,0,0)) left/.7rem 100% no-repeat scroll,
  linear-gradient(to left,rgba(0,0,0,.18),rgba(0,0,0,0)) right/.7rem 100% no-repeat scroll;
  background-color:var(--paper) }.fig-frame svg{ display:block; width:100%; min-width:560px; height:auto }.fig svg text, .hero-fig text{ font-family:var(--f-body); fill:var(--ink) }.t{ font-size:13px }.t-s{ font-size:11px }.t-l{ font-size:15px; font-weight:700 }.t-b{ font-weight:700 }.t-mute{ fill:var(--ink-2) !important }.t-cry{ fill:var(--cry) !important }.t-inf{ fill:var(--inf) !important }.t-brk{ fill:var(--brk) !important }.f-none{ fill:none }.f-paper{ fill:var(--paper) }.f-panel{ fill:var(--panel) }.f-ink{ fill:var(--ink) }.f-cry-soft{ fill:var(--cry-soft) }.f-cry-deep{ fill:var(--cry-deep) }.f-inf{ fill:var(--inf) }.f-brk{ fill:var(--brk) }.s-ink{ stroke:var(--ink) }.s-mute{ stroke:var(--ink-2) }.s-rule{ stroke:var(--rule) }.s-cry{ stroke:var(--cry) }.s-inf{ stroke:var(--inf) }.s-brk{ stroke:var(--brk) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.dash{ stroke-dasharray:5 4 }.dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }.round{ stroke-linecap:round; stroke-linejoin:round }.op5{ opacity:.5 }.op7{ opacity:.72 }.hero-fig .band:hover polygon, .hero-fig .band:focus polygon{ fill:var(--inf-soft) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="세 칸. 연역에서는 영역 바깥 위에서 원리 하나가 떨어져 영역을 같은 꼴로 채운다. 귀납에서는 모양이 다른 다섯 항 가운데 모두가 겹치는 작은 공통부분만 남고 나머지 독특함은 버려져 정보가 손실된다. 변환에서는 영역 안 한 점 씨앗에서 층이 겹겹이 번지고, 처음 다섯 항이 지워지지 않고 층 속에 다 들어 있어 정보가 보존된다. 아래 띠는 왼눈과 오른눈의 평면 그림이 포개지지 않고 어긋나다가, 깊이라는 새 축이 솟아 그 어긋남을 해답의 재료로 삼는 모습이다." height="100%" role="img" viewBox="0 0 720 440" width="100%">

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 290" width="640" height="290" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#F1F3F1; --sheet:#FAFBF9; --ink:#1B2124; --ink-2:#3A4549; --mute:#5E6B71;
  --grid:#C9D4D1; --grid-2:#E1E8E5; --rule:#B6C2C0;
  --neuro:#3546A8; --soma:#8F5508; --life:#256B41; --deep:#8A4429; --alarm:#B01E4C;
  --neuro-w:color-mix(in srgb, var(--neuro) 13%, var(--sheet));
  --soma-w:color-mix(in srgb, var(--soma) 14%, var(--sheet));
  --life-w:color-mix(in srgb, var(--life) 13%, var(--sheet));
  --deep-w:color-mix(in srgb, var(--deep) 13%, var(--sheet));
  --alarm-w:color-mix(in srgb, var(--alarm) 11%, var(--sheet));
  --ink-w:color-mix(in srgb, var(--ink) 8%, var(--sheet));
  --shadow:color-mix(in srgb, var(--ink) 16%, transparent);
  --f-display:"Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body:"Literata", "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --f-label:"Sofia Sans Condensed", "Gothic A1", "Arial Narrow", sans-serif;
  --f-mono:"DM Mono", "Nanum Gothic Coding", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-fig:"Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111517; --sheet:#181D20; --ink:#E2E8E7; --ink-2:#C2CBCB; --mute:#93A0A4;
  --grid:#2E3A3D; --grid-2:#1D2629; --rule:#3A4746;
  --neuro:#9AA8FF; --soma:#E5A64A; --life:#6CC895; --deep:#E39A74; --alarm:#FF7AA0;
  --shadow:rgba(0,0,0,.5); color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#111517; --sheet:#181D20; --ink:#E2E8E7; --ink-2:#C2CBCB; --mute:#93A0A4;
  --grid:#2E3A3D; --grid-2:#1D2629; --rule:#3A4746;
  --neuro:#9AA8FF; --soma:#E5A64A; --life:#6CC895; --deep:#E39A74; --alarm:#FF7AA0;
  --shadow:rgba(0,0,0,.5); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); }.hero svg{ display:block; width:100%; height:auto }figure.fig{ margin:1rem 0; }.fig-frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background-color:var(--sheet);
  background-image:linear-gradient(to right, var(--sheet) 30%, transparent), linear-gradient(to left, var(--sheet) 30%, transparent),
    radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2rem 100%, 2rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; min-width:var(--figmin, 34rem); height:auto; }svg text{ font-family:var(--f-fig); font-size:12px; fill:var(--ink) }svg .t-2{ fill:var(--ink-2) }svg .t-m{ fill:var(--mute) }svg .t-s{ font-size:10.5px }svg .t-l{ font-size:14px }svg .t-b{ font-weight:700 }svg .t-en{ font-family:var(--f-label); letter-spacing:.04em }svg .t-neuro{ fill:var(--neuro) }svg .t-soma{ fill:var(--soma) }svg .t-deep{ fill:var(--deep) }svg .t-alarm{ fill:var(--alarm) }svg .halo{ paint-order:stroke; stroke:var(--sheet); stroke-width:3.5px; stroke-linejoin:round }svg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }svg .ln-m{ stroke:var(--mute); stroke-width:1; fill:none }svg .ln-g{ stroke:var(--grid); stroke-width:1; fill:none }svg .ln-neuro{ stroke:var(--neuro); stroke-width:1.8; fill:none }svg .ln-soma{ stroke:var(--soma); stroke-width:1.8; fill:none }svg .ln-deep{ stroke:var(--deep); stroke-width:1.8; fill:none }svg .ln-alarm{ stroke:var(--alarm); stroke-width:1.8; fill:none }svg .w-thick{ stroke-width:2.8 }svg .w-heavy{ stroke-width:4 }svg .dash{ stroke-dasharray:5 4 }svg .f-paper{ fill:var(--sheet) }svg .f-ink{ fill:var(--ink) }svg .f-inkw{ fill:var(--ink-w) }svg .f-soma{ fill:var(--soma) }svg .f-alarm{ fill:var(--alarm) }svg .f-neuro-w{ fill:var(--neuro-w) }svg .f-soma-w{ fill:var(--soma-w) }svg .f-deep-w{ fill:var(--deep-w) }svg .f-alarm-w{ fill:var(--alarm-w) }section.lecture-wrap{ content-visibility:auto; contain-intrinsic-size:auto 60000px }svg.pz-root{width:640px!important;height:290px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc lecture-wrap"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="섬엽의 이중 배선: 혀·위장에서 오는 상한 음식 신호와 규범 위반의 표상이 같은 섬엽으로 들어가 구역질·심박 저하·몸에서 떼어 내기라는 하나의 출력으로 나간다. 두 입력 사이의 칸막이는 덕트 테이프로만 붙어 있고, '바퀴벌레' 선전이 그것을 비틀어 열어 이웃이라는 입력을 해충의 입력선에 옮겨 꽂는다." class="pz-inner" height="100%" role="img" viewBox="0 0 640 290" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="insula-ah" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="insula-ahs" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path class="f-soma" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="insula-aha" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path class="f-alarm" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 선전: 쇠지렛대의 출처 -->
<rect class="f-deep-w ln-deep" height="42" rx="3" width="140" x="160" y="8"></rect>
<text class="t-b t-deep" text-anchor="middle" x="230" y="27">‘바퀴벌레’</text>
<text class="t-s t-deep" text-anchor="middle" x="230" y="43">선전 · 라디오</text>
<!-- 입력 1: 규범 위반 -->
<rect class="f-paper ln" height="46" rx="3" width="120" x="16" y="70"></rect>
<text class="t-b" text-anchor="middle" x="76" y="90">규범 위반</text>
<text class="t-s t-m" text-anchor="middle" x="76" y="106">표상 · 사람만</text>
<path class="ln w-thick" d="M136,93 L300,93 C340,93 350,150 370,150" marker-end="url(#insula-ah)"></path>
<!-- 입력 2: 혀·위장 -->
<rect class="f-soma-w ln-soma" height="46" rx="3" width="120" x="16" y="214"></rect>
<text class="t-b t-soma" text-anchor="middle" x="76" y="234">혀 · 위장</text>
<text class="t-s t-soma" text-anchor="middle" x="76" y="250">상한 음식 · 독</text>
<text class="t-s t-m" text-anchor="middle" x="76" y="278">모든 포유류</text>
<path class="ln-soma w-thick" d="M136,237 L300,237 C340,237 350,180 370,180" marker-end="url(#insula-ahs)"></path>
<!-- 칸막이와 덕트 테이프 -->
<path class="ln w-heavy" d="M20,165 L172,165 M210,165 L330,165"></path>
<path class="ln w-heavy" d="M210,165 L182,145"></path>
<rect class="f-inkw ln-m" height="24" transform="rotate(25 128 165)" width="10" x="123" y="153"></rect>
<rect class="f-inkw ln-m" height="24" transform="rotate(25 268 165)" width="10" x="263" y="153"></rect>
<text class="t-s t-m" text-anchor="middle" x="268" y="196">덕트 테이프</text>
<text class="t-s t-m" x="24" y="156">그냥 비유</text>
<text class="t-s t-m" x="24" y="183">진짜 썩은 고기</text>
<!-- 쇠지렛대 -->
<path class="ln-alarm w-heavy" d="M234,52 L199,148 Q195,158 185,157"></path>
<text class="t-s t-b t-alarm halo" x="228" y="128">비틀어 엶</text>
<!-- 옮겨 꽂히는 이웃 -->
<circle class="f-paper ln" cx="150" cy="135" r="15"></circle>
<text class="t-s t-b" text-anchor="middle" x="150" y="139">이웃</text>
<path class="ln-alarm dash" d="M162,145 C182,160 196,192 228,226" marker-end="url(#insula-aha)"></path>
<circle class="f-alarm-w ln-alarm" cx="242" cy="237" r="15"></circle>
<text class="t-s t-b t-alarm" text-anchor="middle" x="242" y="241">이웃</text>
<text class="t-s t-b t-alarm" text-anchor="middle" x="242" y="268">해충 자리에</text>
<!-- 섬엽 -->
<ellipse class="f-neuro-w ln-neuro w-thick" cx="420" cy="165" rx="52" ry="34"></ellipse>
<text class="t-l t-b t-neuro" text-anchor="middle" x="420" y="166">섬엽</text>
<text class="t-s t-en t-neuro" text-anchor="middle" x="420" y="182">INSULA</text>
<!-- 출력 단자 하나 -->
<path class="ln w-thick" d="M472,165 L502,165" marker-end="url(#insula-ah)"></path>
<text class="t-s t-m" text-anchor="middle" x="565" y="100">출력 단자 하나</text>
<rect class="f-paper ln" height="110" rx="3" width="122" x="504" y="110"></rect>
<text text-anchor="middle" x="565" y="134">구역질 · 뱉기</text>
<text text-anchor="middle" x="565" y="154">심박 저하</text>
<text text-anchor="middle" x="565" y="174">몸에서 떼어 내기</text>
<line class="ln-g" x1="516" x2="614" y1="186" y2="186"></line>
<text class="t-s t-2" text-anchor="middle" x="565" y="206">+ 비난의 강도</text>
<path class="ln-alarm" d="M565,220 L565,236" marker-end="url(#insula-aha)"></path>
<text class="t-s t-alarm" text-anchor="middle" x="565" y="254">이웃의 얼굴에도</text>
<text class="t-s t-b t-alarm" text-anchor="middle" x="565" y="270">짓밟아라 · 떼어 내라</text>
</svg></g></g></g></svg>
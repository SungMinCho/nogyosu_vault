<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 780 320" width="780" height="320" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .zone-b2{ fill:var(--spike-soft); stroke:var(--spike); stroke-width:1; stroke-dasharray:4 3 }.dg .zone-g2{ fill:var(--rot-soft); stroke:var(--rot); stroke-width:1 }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:780px!important;height:320px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="음수 쪽과 양수 쪽에 치우친 두 채널을 각자의 중점만큼 옮기면 둘 다 0을 중심으로 폭 40 남짓이 되어 대칭 자의 범위가 ±97에서 ±19.5로 준다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 780 320" width="100%"><text class="t-b" text-anchor="start" x="50" y="22">이동 전 — 채널마다 한쪽으로 치우침</text><rect class="f-spike" height="13" rx="2" width="132.6" x="60.2" y="34"></rect><text class="t-s" text-anchor="start" x="200.8" y="45">채널 1: −97 … −58 · 중점 −77.5</text><rect class="f-spike" height="13" rx="2" width="126.82" x="409.38" y="56"></rect><text class="t-s" text-anchor="start" x="544.2" y="67">채널 2: 5.7 … 43 · 중점 24.35</text><rect class="zone-b2" height="10" rx="1" width="659.6" x="60.2" y="78"></rect><line class="ln" x1="50" x2="730" y1="112" y2="112"></line><line class="ln" x1="50" x2="50" y1="109" y2="115"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="50" y="128">−100</text><line class="ln" x1="135" x2="135" y1="109" y2="115"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="135" y="128">−75</text><line class="ln" x1="220" x2="220" y1="109" y2="115"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="220" y="128">−50</text><line class="ln" x1="305" x2="305" y1="109" y2="115"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="305" y="128">−25</text><line class="ln" x1="390" x2="390" y1="109" y2="115"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="390" y="128">0</text><line class="ln" x1="475" x2="475" y1="109" y2="115"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="475" y="128">25</text><line class="ln" x1="560" x2="560" y1="109" y2="115"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="560" y="128">50</text><line class="ln" x1="645" x2="645" y1="109" y2="115"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="645" y="128">75</text><line class="ln" x1="730" x2="730" y1="109" y2="115"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="730" y="128">100</text><text class="t-s t-spike" text-anchor="start" x="60.2" y="74">대칭 자가 덮을 범위 ±97 — 대부분 비어 있음</text><text class="t-b t-rot" text-anchor="start" x="50" y="168">가운데(z)를 빼면</text><rect class="f-rot" height="13" rx="2" width="132.6" x="323.7" y="180"></rect><text class="t-s" text-anchor="start" x="464.3" y="191">채널 1 − z₁ : ±19.5</text><rect class="f-rot" height="13" rx="2" width="126.82" x="326.59" y="202"></rect><text class="t-s" text-anchor="start" x="461.41" y="213">채널 2 − z₂ : ±18.65</text><rect class="zone-g2" height="10" rx="1" width="132.6" x="323.7" y="224"></rect><text class="t-s t-rot" text-anchor="start" x="464.3" y="233">대칭 자 ±19.5</text><line class="ln" x1="50" x2="730" y1="252" y2="252"></line><line class="ln" x1="50" x2="50" y1="249" y2="255"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="50" y="268">−100</text><line class="ln" x1="135" x2="135" y1="249" y2="255"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="135" y="268">−75</text><line class="ln" x1="220" x2="220" y1="249" y2="255"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="220" y="268">−50</text><line class="ln" x1="305" x2="305" y1="249" y2="255"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="305" y="268">−25</text><line class="ln" x1="390" x2="390" y1="249" y2="255"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="390" y="268">0</text><line class="ln" x1="475" x2="475" y1="249" y2="255"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="475" y="268">25</text><line class="ln" x1="560" x2="560" y1="249" y2="255"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="560" y="268">50</text><line class="ln" x1="645" x2="645" y1="249" y2="255"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="645" y="268">75</text><line class="ln" x1="730" x2="730" y1="249" y2="255"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="730" y="268">100</text><text class="t-s t-mut" text-anchor="start" x="50" y="296">INT8 눈금 97/127 ≈ 0.764 → 19.5/127 ≈ 0.154 (약 5배 촘촘). 빼 준 z는 다음 층 바이어스로: b′ = b + z·W.</text></svg></g></g></g></g></svg>
<text class="ts" x="578" y="235">문턱: 남을 희생시키면</text>
<text class="ts" x="578" y="253">→ 사제의 그림자</text>
<text class="tbig tb tm" x="34" y="226.0">3</text>
<text class="tl tm" x="34" y="243.0">자리</text>
<text class="ts tb" x="68" y="306">투피남바 식인</text>
<text class="tl" x="160" y="306">주98 · 도식이 두 벌로 갈라진다</text>
<rect class="f-panel s-ink w2" height="46" width="226" x="194" y="326"></rect>
<text class="ts tb tm" x="307.0" y="346">희생물 = 집행자</text>

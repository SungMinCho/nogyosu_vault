<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 312" width="720" height="312" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2{ stroke:var(--ink-2); }.f-ink2-t{ fill:var(--ink-2); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-indigo-f{ fill:var(--indigo-soft); }.f-madder{ stroke:var(--madder); }.f-madder-t{ fill:var(--madder); }.f-madder-f{ fill:var(--madder-soft); }.f-ochre-t{ fill:var(--ochre); }.f-mend-t{ fill:var(--mend); }.f-panel-f{ fill:var(--panel); }.f-none{ fill:none; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-b{ font-weight:700; }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="사회적 투자의 두 극 사이를 한 사람, 한 집단이 두 띠로 가로지른다. 이해관계의 전의식적 투자는 혁명 쪽을 가리키면서 욕망의 무의식적 투자는 파시즘 쪽을 가리킬 수 있고, 두 띠는 같은 방식으로 작동하지 않아 위를 바꿔도 아래가 따라오지 않는다." height="100%" role="img" viewBox="0 0 720 312" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f08-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f08-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f08-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f08-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f08-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f08-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f08-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="f-indigo f-indigo-f" height="236" rx="3" stroke-width="1.8" width="162" x="8" y="40"></rect><text class="f-indigo-t t-b" text-anchor="middle" x="89.0" y="150">편집증-파시즘 극</text><text class="f-indigo-t t-s" text-anchor="middle" x="89.0" y="170">몰적 · 분리차별적</text><text class="f-indigo-t t-s" text-anchor="middle" x="89.0" y="188">예속 집단</text><rect class="f-madder f-madder-f" height="236" rx="3" stroke-width="1.8" width="154" x="558" y="40"></rect><text class="f-madder-t t-b" text-anchor="middle" x="635.0" y="150">분열-혁명 극</text><text class="f-madder-t t-s" text-anchor="middle" x="635.0" y="170">분자적 · 유목적</text><text class="f-madder-t t-s" text-anchor="middle" x="635.0" y="188">주체 집단</text><rect class="f-ink2 f-panel-f" height="60" rx="0" stroke-width="1.3" width="388" x="170" y="84"></rect><rect class="f-ink2 f-panel-f" height="60" rx="0" stroke-width="1.3" width="388" x="170" y="190"></rect><text class="f-ink-t t-b" text-anchor="start" x="184" y="110">이해관계의</text><text class="f-ink-t t-b" text-anchor="start" x="184" y="128">전의식적 투자</text><line class="f-madder f-none" marker-end="url(#f08-a-madder)" stroke-width="2.4" x1="366" x2="554" y1="118" y2="118"></line><text class="f-madder-t t-s" text-anchor="middle" x="459.0" y="106">계급 이해 → 혁명 쪽</text><text class="f-ink-t t-b" text-anchor="end" x="548" y="216">욕망의</text><text class="f-ink-t t-b" text-anchor="end" x="548" y="234">무의식적 투자</text><line class="f-indigo f-none" marker-end="url(#f08-a-indigo)" stroke-width="2.4" x1="354" x2="174" y1="224" y2="224"></line><text class="f-indigo-t t-s" text-anchor="middle" x="265.0" y="212">리비도 → 위계·초자아</text><text class="f-ink-t t-b" text-anchor="middle" x="360" y="24">한 사람 · 한 집단</text><line class="f-ink f-none" stroke-width="3" x1="360" x2="360" y1="32" y2="266"></line><circle class="f-ink f-ink-t" cx="360" cy="118" r="5" stroke-width="1"></circle><circle class="f-ink f-ink-t" cx="360" cy="224" r="5" stroke-width="1"></circle><text class="f-ink2-t t-s" text-anchor="start" x="372" y="171.0">위를 바꿔도 아래는 안 따라온다</text><text class="f-ink2-t t-s" text-anchor="middle" x="360" y="296">두 띠의 화살표는 같은 쪽을 가리킬 필요가 없다</text></svg></svg>
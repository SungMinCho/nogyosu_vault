<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 790 370" width="790" height="370" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-mut{ stroke:var(--muted) }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-spike{ stroke:var(--spike) }.dg .dash{ stroke-dasharray:4 3 }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .f-ink{ fill:var(--ink) }.dg .f-mut{ fill:var(--muted) }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .dot-q{ fill:var(--paper); stroke:var(--ink); stroke-width:1.4 }.dg .plot-bg{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .dot-sp{ fill:var(--spike); stroke:var(--paper); stroke-width:1.5 }.dg .thick{ stroke-width:2.4 }.dg .ln-ink{ stroke:var(--ink) }.dg .halo{ paint-order:stroke; stroke:var(--paper); stroke-width:4px; stroke-linejoin:round }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:790px!important;height:370px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="로그 눈금에서 각 채널은 곱이 일정한 기울기 마이너스 1의 선 위에서만 움직이며, 대각 변환으로는 두 선 사이의 간격을 좁힐 수 없다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 790 370" width="100%"><defs><marker id="k14-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="k14-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="k14-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="k14-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mut" d="M0,0 L10,5 L0,10 z"></path></marker></defs><defs><clipPath id="k14-clip"><rect height="280.0" width="280.0" x="80" y="40.0"></rect></clipPath></defs><rect class="plot-bg" height="280" rx="0" width="280" x="80" y="40"></rect><line class="ln-hair" x1="80" x2="80" y1="40" y2="320"></line><line class="ln-hair" x1="80" x2="360" y1="320" y2="320"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="80" y="336">¼</text><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="324">¼</text><line class="ln-hair" x1="150" x2="150" y1="40" y2="320"></line><line class="ln-hair" x1="80" x2="360" y1="250" y2="250"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="150" y="336">1</text><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="254">1</text><line class="ln-hair" x1="220" x2="220" y1="40" y2="320"></line><line class="ln-hair" x1="80" x2="360" y1="180" y2="180"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="220" y="336">4</text><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="184">4</text><line class="ln-hair" x1="290" x2="290" y1="40" y2="320"></line><line class="ln-hair" x1="80" x2="360" y1="110" y2="110"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="290" y="336">16</text><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="114">16</text><line class="ln-hair" x1="360" x2="360" y1="40" y2="320"></line><line class="ln-hair" x1="80" x2="360" y1="40" y2="40"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="360" y="336">64</text><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="44">64</text><text class="t-s t-mut" text-anchor="middle" x="220" y="354">활성 최대 a  (로그 눈금)</text><text class="t-s t-mut" text-anchor="start" x="36" y="28">가중치 최대 b</text><g clip-path="url(#k14-clip)"><line class="ln ln-mut dash" x1="80" x2="360" y1="320" y2="40"></line><line class="ln ln-spike thick" x1="120.947" x2="360" y1="40" y2="279.053"></line><line class="ln ln-ink thick" x1="-95" x2="360" y1="40" y2="495"></line><line class="ln ln-rot dash" x1="12.9737" x2="360" y1="40" y2="387.026"></line></g><circle class="dot-sp" cx="330.9" cy="250.0" r="5"></circle><text class="t-s t-spike" text-anchor="start" x="338.947" y="244">α=0</text><circle class="dot-sp" cx="240.5" cy="159.5" r="5"></circle><text class="t-s t-spike" text-anchor="start" x="248.474" y="153.526">α=0.5</text><circle class="dot-sp" cx="150.0" cy="69.1" r="5"></circle><text class="t-s t-spike" text-anchor="start" x="158" y="63.0526">α=1</text><circle class="dot-q" cx="115.0" cy="250.0" r="4.5"></circle><circle class="dot-q" cx="132.5" cy="267.5" r="4.5"></circle><circle class="dot-q" cx="150.0" cy="285.0" r="4.5"></circle><text class="t-s t-b" text-anchor="start" x="84" y="207">B: a·b = 0.5</text><text class="t-s t-b t-spike" text-anchor="end" x="320.947" y="268">A: a·b = 36</text><line class="ln ln-mut" marker-end="url(#k14-mut)" x1="137.454" x2="236.08" y1="262.546" y2="163.92"></line><text class="t-s t-b t-mut" text-anchor="start" x="199.813" y="224.187">곱의 비 72</text><text class="t-s t-b t-rot halo" text-anchor="start" x="118" y="128">회전 후 (개념)</text><text class="t-b" text-anchor="start" x="410" y="50">대각 변환이 할 수 있는 일</text><text class="t-s" text-anchor="start" x="410" y="72">채널마다 a·b가 보존된다 → 점은 자기 선 위에서만</text><text class="t-s" text-anchor="start" x="410" y="88">미끄러진다 (로그 눈금에서 기울기 −1).</text><text class="t-s t-mut" text-anchor="start" x="410" y="112">α는 선 위의 위치를 고르는 손잡이일 뿐.</text><text class="t-b t-spike" text-anchor="start" x="410" y="148">할 수 없는 일</text><text class="t-s" text-anchor="start" x="410" y="170">두 선 사이의 간격(곱의 비 72)을 좁히는 것.</text><text class="t-s t-mono t-spike" text-anchor="start" x="410" y="186">(활성의 비) × (가중치의 비) ≥ 72</text><text class="t-b t-rot" text-anchor="start" x="410" y="222">회전이 하는 일</text><text class="t-s" text-anchor="start" x="410" y="244">채널을 섞어 이상치를 모든 채널로 흩는다.</text><text class="t-s" text-anchor="start" x="410" y="260">곱 자체가 바뀌어 선들이 한데 모인다.</text><text class="t-s t-mut" text-anchor="start" x="410" y="284">파란 점선은 두 곱의 기하평균 √18 ≈ 4.2.</text></svg></g></g></g></g></svg>
<circle class="t-jen s-jen w1" cx="500" cy="400" r="9"></circle>
<text class="ts tm c-jen" x="500" y="404.5">나</text>
<text class="ts tb c-jag" x="566" y="384">적주의</text>
<text class="tl" x="566" y="402">모든 존재가 잠재적으로</text>
<text class="tl" x="566" y="420">나를 정의하는 적</text>

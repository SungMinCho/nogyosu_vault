<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 540" width="860" height="540" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#ECEAF0; --panel:#F7F6F9; --ink:#1D1A26; --muted:#5B5668; --rule:#C9C5D2; --rule-2:#DCD9E2;
  --red:#B42318;   --red-fill:#F3D3CE;
  --flesh:#995532; --flesh-fill:#ECCFBC;
  --cob:#2B4A9B;   --cob-fill:#D3DBF1;
  --verd:#1F6F62;  --verd-fill:#CDE7E1;
  --void:#17141F;  --on-void:#F2EEF7;
  --display-ko:"Hahmlet","Noto Serif KR","Noto Serif CJK KR",serif;
  --body:"Noto Serif KR","Noto Serif CJK KR","Apple SD Gothic Neo",serif;
  --display-la:"GFS Didot","Didot","Bodoni 72","Noto Serif",serif;
  --sans:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Red Hat Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }svg.fig{display:block;width:100%;height:auto;font-family:var(--sans);overflow:visible}svg.fig text{font-family:var(--sans);font-size:14px;fill:var(--ink)}svg.fig .t-s{font-size:12px}svg.fig .t-l{font-size:17px}svg.fig .t-xl{font-size:22px}svg.fig .t-b{font-weight:700}svg.fig .t-mono{font-family:var(--mono)}svg.fig .t-mid{text-anchor:middle}svg.fig .t-end{text-anchor:end}svg.fig .t-muted{fill:var(--muted)}svg.fig .halo{paint-order:stroke fill;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}svg.fig .f-ink{fill:var(--ink)}svg.fig .f-muted{fill:var(--muted)}svg.fig .f-panel{fill:var(--panel)}svg.fig .f-rule2{fill:var(--rule-2)}svg.fig .f-red{fill:var(--red)}svg.fig .f-redf{fill:var(--red-fill)}svg.fig .f-flesh{fill:var(--flesh)}svg.fig .f-void{fill:var(--void)}svg.fig .f-onvoid{fill:var(--on-void)}svg.fig .f-none{fill:none}svg.fig .s-ink{stroke:var(--ink)}svg.fig .s-muted{stroke:var(--muted)}svg.fig .s-rule{stroke:var(--rule)}svg.fig .s-red{stroke:var(--red)}svg.fig .w1{stroke-width:1px}svg.fig .w15{stroke-width:1.5px}svg.fig .w2{stroke-width:2px}svg.fig .w3{stroke-width:3px}svg.fig .w4{stroke-width:4px}svg.fig .dash{stroke-dasharray:6 5}svg.fig .round{stroke-linecap:round;stroke-linejoin:round}:root{ --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2); }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{max-width:560px;margin-inline:auto}.doc{padding-inline:var(--pad)}.lecture{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-block:2.5rem 3rem;
  content-visibility:auto;border-top:1px solid var(--rule)}.fig-wrap{margin:.8rem 0 !important}.fig-scroll{overflow-x:auto;background:
  linear-gradient(to right,var(--panel) 30%,transparent) left center/2.2rem 100% no-repeat local,
  linear-gradient(to left,var(--panel) 30%,transparent) right center/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) left center/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) right center/.8rem 100% no-repeat scroll,
  var(--panel);padding:1rem .9rem .6rem}.fig-inner{width:100%}svg.pz-root{width:860px!important;height:540px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig-wrap"><g class="pz-w fig-scroll"><g class="pz-w fig-inner"><svg xmlns="http://www.w3.org/2000/svg" aria-label="헨리히와 지젝은 똑같이 '자아 = 모든 실재'라는 전제를 문제 삼지만, 헨리히는 전제를 지킨 채 '아님'을 '음의 힘'으로 바꿔친 야바위를 고발하고, 지젝은 전제를 뒤집어 자아를 구멍으로, 안슈토스를 그 테두리로 읽는다." class="fig pz-inner" height="100%" role="img" viewBox="0 0 860 540" width="100%">
<defs>
<marker id="L04-2-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="L04-2-ar-muted" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="L04-2-ar-red" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-red" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<text class="t-b" x="40" y="34">실재적 대립</text>
<line class="s-muted w4 round" x1="70" x2="390" y1="86" y2="86"></line>
<line class="s-ink w3" marker-end="url(#L04-2-ar-ink)" x1="230" x2="90" y1="86" y2="86"></line>
<line class="s-ink w3" marker-end="url(#L04-2-ar-ink)" x1="230" x2="310" y1="86" y2="86"></line>
<circle class="f-ink" cx="230" cy="86" r="5"></circle>
<text class="t-mid t-l t-b" x="160" y="72">7</text>
<text class="t-mid t-l t-b" x="270" y="72">4</text>
<text class="t-mid t-mono" x="230" y="118">7 − 4 = +3</text>
<text class="t-mid t-s t-muted" x="230" y="138">오른쪽의 −3은 왼쪽 힘이 낳은 양</text>
<line class="s-rule w1 dash" x1="430" x2="430" y1="22" y2="142"></line>
<text class="t-b" x="470" y="34">논리적 부정</text>
<text class="t-mid t-mono t-xl" x="570" y="94">P</text>
<text class="t-mid t-mono t-xl" x="730" y="94">¬P</text>
<line class="s-muted w1 dash" x1="592" x2="700" y1="86" y2="86"></line>
<text class="t-mid t-s t-muted" x="646" y="76">크기 없음</text>
<text class="t-mid t-s" x="650" y="118">'아님'은 양이 아니다</text>
<text class="t-mid t-s t-muted" x="650" y="138">¬P는 P를 3만큼 깎지 못한다</text>
<rect class="f-redf s-red w15" height="40" rx="4" width="280" x="290" y="170"></rect>
<text class="t-mid t-b" x="430" y="196">전제: 자아 = 모든 실재</text>
<text class="t-end t-s t-muted" x="278" y="196">같은 진단</text>
<path class="f-none s-ink w15" d="M350,212 C320,232 260,236 225,256" marker-end="url(#L04-2-ar-ink)"></path>
<path class="f-none s-red w2" d="M510,212 C540,232 600,236 635,256" marker-end="url(#L04-2-ar-red)"></path>
<text class="t-end t-s" x="262" y="236">전제를 지킨 채</text>
<text class="t-s f-red" x="598" y="236">전제를 뒤집어</text>
<rect class="f-rule2" height="262" rx="6" width="390" x="30" y="262"></rect>
<text class="t-mid t-b" x="225" y="288">헨리히 — 야바위</text>
<path class="f-panel s-ink w2" d="M76,370 L86,326 Q110,320 134,326 L144,370 z"></path>
<path class="f-panel s-ink w2" d="M191,400 L201,356 Q225,350 249,356 L259,400 z"></path>
<path class="f-panel s-ink w2" d="M306,370 L316,326 Q340,320 364,326 L374,370 z"></path>
<circle class="f-none s-muted w15 dash" cx="110" cy="388" r="11"></circle>
<circle class="f-ink" cx="340" cy="388" r="11"></circle>
<line class="s-muted w1" x1="60" x2="390" y1="400" y2="400"></line>
<path class="f-none s-ink w2" d="M120,314 C170,296 280,296 328,314" marker-end="url(#L04-2-ar-ink)"></path>
<text class="t-mid t-s halo" x="225" y="334">바꿔치기</text>
<text class="t-mid t-s" x="110" y="424">'아님'</text>
<text class="t-mid t-s t-muted" x="110" y="441">빈 컵</text>
<text class="t-mid t-s" x="340" y="424">'음의 힘'</text>
<text class="t-mid t-s t-muted" x="340" y="441">찬 컵</text>
<text class="t-mid t-s" x="225" y="476">비아: 절대적 무 → 음의 양</text>
<text class="t-mid t-b" x="225" y="502">→ 속임수다</text>
<rect class="f-rule2" height="262" rx="6" width="390" x="440" y="262"></rect>
<text class="t-mid t-b" x="635" y="288">지젝 — 구멍과 테두리</text>
<circle class="f-flesh" cx="540" cy="370" r="46"></circle>
<circle class="f-void" cx="540" cy="370" r="26"></circle>
<text class="t-mid t-l t-b f-onvoid" x="540" y="377">$</text>
<line class="s-muted w4 round" x1="588" x2="772" y1="370" y2="370"></line>
<text class="t-mid t-mono t-l" x="790" y="377">X</text>
<text class="t-mid t-s" x="680" y="356">논리적 관계</text>
<text class="t-mid t-s t-muted" x="680" y="396">힘의 화살 없음</text>
<text class="t-mid t-s f-red" x="540" y="440">구멍 = 주체</text>
<text class="t-mid t-s f-flesh" x="540" y="458">테두리 = 안슈토스(a)</text>
<text class="t-mid t-b" x="635" y="502">→ 유한성의 필연이다</text>
</svg></g></g></g></g></g></svg>
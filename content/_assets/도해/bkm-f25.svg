yle><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w wrap"><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="사건 연구에서 효율적 시장의 누적 비정상수익률은 발표일에 한 번 뛰고 평평하다. 발표 뒤 계속 오르거나 되돌아가면 가격이 정보를 늦게 또는 지나치게 먹은 것이다." class="dg pz-inner" height="100%" role="img" viewBox="0 0 600 356" width="100%">

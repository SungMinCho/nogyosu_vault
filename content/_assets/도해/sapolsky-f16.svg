<text class="t-s t-num t-b" x="273" y="61.5">2.5%</text>
<text class="t-s t-num t-b" x="300" y="85.5">10%</text>
<text class="t-s t-num t-b" x="318" y="109.5">15%</text>
<text class="t-s t-num t-b" x="345" y="133.5">22.5%</text>
<text class="t-s t-num t-b" x="372" y="157.5">30%</text>
<text class="t-s t-num t-b t-paper" text-anchor="end" x="396" y="181.5">40%</text>
<text class="t-s t-num t-b" x="435" y="205.5">47.5%</text>
<text class="t-s t-num t-b" x="489" y="229.5">62.5%</text>
<text class="t-s t-num t-b t-alarm" x="498" y="253.5">65%</text>
<text class="t-s t-num t-b" x="597" y="277.5">92.5%</text>
<text class="t-s t-b" x="420.96" y="46">평균 43.6% · 21개 조건 740명</text>

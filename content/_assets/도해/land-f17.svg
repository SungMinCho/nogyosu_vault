<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 322" width="720" height="322" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-xs{ font-size:10.5px }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-paper{ fill:var(--paper) }.fig .f-sun{ fill:var(--sun) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-blood{ fill:var(--blood) }.fig .f-bloodsoft{ fill:var(--blood-soft) }.fig .s-mute{ stroke:var(--ink-2) }.fig .s-rule{ stroke:var(--rule) }.fig .s-ledger{ stroke:var(--ledger) }.fig .s-blood{ stroke:var(--blood) }.fig .w15{ stroke-width:1.5 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="랜드의 골학. 시체에서 남는 뼈와 사라지는 살의 구별이 형상과 질료, 영혼과 몸 같은 서구 형이상학의 위계로 옮겨졌다." height="100%" role="img" style="--minw:662px" viewBox="0 0 720 322" width="100%"><defs><marker id="bone-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="bone-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="bone-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="bone-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="bone-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="bone-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><ellipse class="f-bloodsoft s-blood" cx="360" cy="70" rx="176" ry="48"></ellipse><circle class="f-paper s-ledger w15" cx="236" cy="59" r="11"></circle><circle class="f-paper s-ledger w15" cx="236" cy="81" r="11"></circle><circle class="f-paper s-ledger w15" cx="484" cy="59" r="11"></circle><circle class="f-paper s-ledger w15" cx="484" cy="81" r="11"></circle><rect class="f-paper" height="20" rx="9" width="248" x="236" y="60"></rect><line class="s-ledger w15" x1="238" x2="482" y1="60" y2="60"></line><line class="s-ledger w15" x1="238" x2="482" y1="80" y2="80"></line><text class="t-s t-b f-ledger" text-anchor="middle" x="360" y="75">뼈</text><text class="t-s t-b f-blood" text-anchor="middle" x="360" y="44">무른 살</text><line class="s-mute" marker-end="url(#bone-mute)" x1="360" x2="360" y1="120" y2="140"></line><text class="t-s f-mute" x="372" y="134">골학 — 몸의 구별을 세계의 구별로</text><text class="t-b f-ledger" text-anchor="middle" x="200" y="166">뼈 쪽 · 남는 것</text><text class="t-b f-blood" text-anchor="middle" x="520" y="166">살 쪽 · 사라지는 것</text><line class="s-rule" x1="360" x2="360" y1="150" y2="312"></line><text class="t-xs f-mute" text-anchor="middle" x="200" y="190">단단 · 영속 · 마름 · 깨끗함 · 형식</text><text class="t-xs f-mute" text-anchor="middle" x="520" y="190">무름 · 휘발 · 젖음 · 더러움 · 무형</text><text class="t-s" text-anchor="middle" x="200" y="218">형상</text><text class="t-s" text-anchor="middle" x="520" y="218">질료</text><text class="t-s" text-anchor="middle" x="200" y="240">영혼</text><text class="t-s" text-anchor="middle" x="520" y="240">몸</text><text class="t-s" text-anchor="middle" x="200" y="262">본질</text><text class="t-s" text-anchor="middle" x="520" y="262">우연</text><text class="t-s" text-anchor="middle" x="200" y="284">천상의 순수</text><text class="t-s" text-anchor="middle" x="520" y="284">지상의 오물</text><text class="t-s" text-anchor="middle" x="200" y="306">신의 건축</text><text class="t-s" text-anchor="middle" x="520" y="306">저급한 흐름</text></svg></svg>
dth="193.6" x="500" y="104"></rect><text class="t-sm" text-anchor="start" x="698.6" y="116">24.2</text><text class="t-sm t-b" text-anchor="start" x="410" y="162">코소보</text><text class="t-sm t-mute" text-anchor="end" x="494" y="182">인구</text><rect class="f-rule" height="15" width="67.8" x="500" y="170"></rect><text class="t-sm" text-anchor="start" x="572.76" y="182">8.47</text><text class="t-sm t-mute" text-anchor="end" x="494" y="204">생산</text><rect class="f-mute" height="15" width="15.2" x="500" y="192"></rect><text class="t-sm" text-anchor="start" x="520.2" y="204">1.9</text><text class="t-sm t-mute" text-anchor="end" x="494" y="226">수출</text><rect class="f-ink" height="15" width="8.7" x="500" y="214"></rect><text class="t-sm" text-anchor="start" x="513.72" y="226">1.09</text><line class="s-rule" stroke-width="1" x1="500" x2="500" y1="36" y2="250"></line><text class="t-sm t-mute" text-anchor="middle" x="500" y="266">0%</text><line class="s-rule" stroke-width="1" x1="580" x2="580" y1="36" y2="250"></line><text class="t-sm t-mute" text-anchor="middle" x="580" y="266">10%</text><line class="s-rule" stroke-width="1" x1="660" x2="660" y1="36" y2="250"></line><text class="t-sm t-mute" text-anchor="middle" x="660" y="266">20%</text><text class="t-sm t-mute" text-anchor="end" x="740" y="290">같은 표에서 두 신화가 나온다</text></svg></g></g></g></g></svg>
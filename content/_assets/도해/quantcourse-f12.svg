<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 380" width="640" height="380" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#F3F2F6; --panel:#FAF9FC; --band:#ECEAF1;
  --ink:#1E1B26; --ink-2:#4F4A5C; --ink-3:#7E788B; --rule:#D8D4E0;
  --step:#5A3E9B; --sig:#8F6B00; --tooth:#B42A62; --fix:#0A7FA0;
  --step-soft:#E6E0F3; --sig-soft:#F2E8D0; --tooth-soft:#F6DFE8; --fix-soft:#D8EDF3; --fix-faint:rgba(10,127,160,.08);
  --f-display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --f-mono:"Sometype Mono","Nanum Gothic Coding",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-diag:"Nanum Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15131B; --panel:#1D1A25; --band:#1B1922;
  --ink:#ECE9F2; --ink-2:#B9B4C6; --ink-3:#8C8799; --rule:#34303F;
  --step:#8E78E0; --sig:#BC8A12; --tooth:#E0607A; --fix:#22A6B4;
  --step-soft:#2B2444; --sig-soft:#33290F; --tooth-soft:#3B1E2B; --fix-soft:#11303A; --fix-faint:rgba(34,166,180,.10);
  color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#15131B; --panel:#1D1A25; --band:#1B1922;
  --ink:#ECE9F2; --ink-2:#B9B4C6; --ink-3:#8C8799; --rule:#34303F;
  --step:#8E78E0; --sig:#BC8A12; --tooth:#E0607A; --fix:#22A6B4;
  --step-soft:#2B2444; --sig-soft:#33290F; --tooth-soft:#3B1E2B; --fix-soft:#11303A; --fix-faint:rgba(34,166,180,.10);
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 3rem }.lecture{ display:contents }.hero-fig svg{ width:100%; height:auto; display:block }.fig{ margin-block:.6rem !important }.fig-frame{ background:var(--panel); border:1px solid var(--rule); border-radius:4px; overflow-x:auto;
  background-image:linear-gradient(to right,var(--panel),var(--panel)),linear-gradient(to right,var(--panel),var(--panel)),
    linear-gradient(to right,rgba(0,0,0,.12),transparent),linear-gradient(to left,rgba(0,0,0,.12),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat;
  background-size:20px 100%,20px 100%,10px 100%,10px 100%; background-attachment:local,local,scroll,scroll }.fig-frame svg{ display:block; width:100%; min-width:540px; height:auto; padding:.4rem }.dg{ font-family:var(--f-diag); font-size:12px }.dg text{ fill:var(--ink) }.dg .t-ink{ fill:var(--ink) }.dg .t-ink2{ fill:var(--ink-2) }.dg .t-ink3{ fill:var(--ink-3) }.dg .t-step{ fill:var(--step) }.dg .t-sig{ fill:var(--sig) }.dg .t-fix{ fill:var(--fix) }.dg line, .dg polyline, .dg path, .dg ellipse{ fill:none }.dg .grid{ stroke:var(--rule) }.dg .s-ink2{ stroke:var(--ink-2) }.dg .s-ink3{ stroke:var(--ink-3) }.dg .s-fix{ stroke:var(--fix) }.dg .f-step{ fill:var(--step) }.dg .f-sig{ fill:var(--sig) }.dg .f-fix-faint{ fill:var(--fix-faint) }.dg .f-none{ fill:none }.dg .ring{ stroke:var(--panel); stroke-width:2px }.dg .mk-ink{ fill:var(--ink) }.dg .mk-ink2{ fill:var(--ink-2) }.dg .mk-step{ fill:var(--step) }.dg .mk-sig{ fill:var(--sig) }.dg .mk-tooth{ fill:var(--tooth) }.dg .mk-fix{ fill:var(--fix) }svg.pz-root{width:640px!important;height:380px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig wide"><g class="pz-w fig-frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="헤시안 H의 등고선은 (1,−1) 방향으로 길쭉해서, 한 가중치는 올리고 다른 가중치는 내리는 반올림 (1,0)이 최근접 (1,1)보다 오차가 작다." class="dg pz-inner" height="100%" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 640 380" width="100%"><defs><marker id="ada-a-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="ada-a-step" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-step" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="ada-a-sig" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-sig" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="ada-a-tooth" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-tooth" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="ada-a-fix" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-fix" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="ada-a-ink2" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink2" d="M0,1 L10,5 L0,9 z"></path></marker></defs><line class="grid" stroke-width="1" x1="136.5" x2="136.5" y1="342.5" y2="38.5"></line><line class="grid" stroke-width="1" x1="79.5" x2="383.5" y1="285.5" y2="285.5"></line><line class="grid" stroke-width="1" x1="326.5" x2="326.5" y1="342.5" y2="38.5"></line><line class="grid" stroke-width="1" x1="79.5" x2="383.5" y1="95.5" y2="95.5"></line><text class="t-ink2" style="font-size:12px" text-anchor="end" x="387.3" y="301.5">w₁</text><text class="t-ink2" style="font-size:12px" text-anchor="end" x="128.5" y="38.5">w₂</text><ellipse class="s-ink3 f-none" cx="250.5" cy="171.5" rx="186.16" ry="107.48" stroke-dasharray="4 4" stroke-width="1.6" transform="rotate(45 250.5 171.5)"></ellipse><ellipse class="s-fix f-fix-faint" cx="250.5" cy="171.5" rx="142.18" ry="82.09" stroke-width="1.6" transform="rotate(45 250.5 171.5)"></ellipse><line class="s-ink2" marker-end="url(#ada-a-ink2)" stroke-dasharray="4 3" stroke-width="1.4" x1="250.5" x2="326.5" y1="171.5" y2="95.5"></line><line class="s-fix" marker-end="url(#ada-a-fix)" stroke-width="1.8" x1="250.5" x2="326.5" y1="171.5" y2="285.5"></line><circle class="f-step ring" cx="136.5" cy="285.5" r="6.5"></circle><text class="t-step" style="font-size:12px;font-weight:600" text-anchor="end" x="126.5" y="303.5">(0,0)  1.08</text><circle class="f-step ring" cx="326.5" cy="285.5" r="6.5"></circle><text class="t-fix" style="font-size:12px;font-weight:600" x="336.5" y="303.5">(1,0)  0.28</text><circle class="f-step ring" cx="136.5" cy="95.5" r="6.5"></circle><text class="t-fix" style="font-size:12px;font-weight:600" text-anchor="end" x="126.5" y="87.5">(0,1)  0.28</text><circle class="f-step ring" cx="326.5" cy="95.5" r="6.5"></circle><text class="t-step" style="font-size:12px;font-weight:600" x="336.5" y="87.5">(1,1)  0.48</text><circle class="f-sig ring" cx="250.5" cy="171.5" r="6"></circle><text class="t-sig" style="font-size:12px;font-weight:600" text-anchor="end" x="238.5" y="175.5">w = (0.6, 0.6)</text><text class="t-ink2" style="font-size:10.5px" x="336.5" y="105.5">← 최근접</text><text class="t-ink" style="font-size:13px;font-weight:600" x="420" y="60">오차의 비용</text><text class="t-ink2" style="font-size:12px" x="420" y="82">ΔwᵀHΔw = Δw₁² + Δw₂² + Δw₁Δw₂</text><text class="t-ink2" style="font-size:12px" x="420" y="104">H = [[1, 0.5], [0.5, 1]]</text><text class="t-fix" style="font-size:12px;font-weight:600" x="420" y="148">실선 등고선 = 0.28</text><text class="t-ink3" style="font-size:12px" x="420" y="170">점선 등고선 = 0.48</text><text class="t-ink2" style="font-size:11.5px" x="420" y="214">등고선이 (1, −1) 방향으로 길다</text><text class="t-ink2" style="font-size:11.5px" x="420" y="236">= 부호가 반대인 두 오차가 싸다</text><text class="t-ink2" style="font-size:11.5px" x="420" y="258">= 입력 x₁, x₂가 함께 움직인다</text></svg></g></g></g></g></svg>
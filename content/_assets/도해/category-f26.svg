path><text class="t-alarm mono" text-anchor="start" x="255.5" y="118.0">(int)</text><text class="t-s" text-anchor="middle" x="280.0" y="226.0">실선 = 내림(오른쪽 수반)   점선 = 올림(왼쪽 수반)</text></svg></svg>
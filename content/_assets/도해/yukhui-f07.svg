<g class="chaff-s"><line marker-end="url(#arC)" x1="352" x2="396" y1="126" y2="96"></line><line marker-end="url(#arC)" x1="352" x2="396" y1="126" y2="116"></line><line marker-end="url(#arC)" x1="352" x2="396" y1="126" y2="136"></line><line marker-end="url(#arC)" x1="352" x2="396" y1="126" y2="156"></line></g>
<g class="sm chaff-t"><text x="402" y="100">① 윤활</text><text x="402" y="120">② 절연 → 권선을 조밀하게 → 소형화</text><text x="402" y="140">③ 열을 용기 벽으로</text><text x="402" y="160">④ 가압 → 밀봉 (새도 밖으로 샌다)</text></g>
<text class="sm sea-t" x="30" y="228">물이 하는 두 가지 — ⓐ 터빈을 돌린다 ⓑ 용기 벽으로 열을 가져간다</text>
<line class="rule" x1="8" x2="652" y1="246" y2="246"></line>
<text class="ttl" x="8" y="272">유량 2배일 때</text>
<rect class="fire-s" fill="none" height="20" rx="2" width="240" x="180" y="284"></rect>
<text class="sm fire-t" text-anchor="middle" x="300" y="299">발열 ×2</text>
<rect class="sea-s" fill="none" height="20" rx="2" width="209" x="180" y="310"></rect>
<text class="sm sea-t" text-anchor="middle" x="284" y="325">방열 ×1.741 (2^0.8)</text>
<line class="fire-s dash" x1="389" x2="389" y1="310" y2="330"></line>

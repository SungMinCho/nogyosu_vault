}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:1rem 3rem}.lecture{display:contents}.fig{margin:.6rem 0}.panels{display:flex;flex-wrap:wrap;gap:1rem 1.2rem;justify-content:center;align-items:flex-start}.pn{display:block;flex:1 1 17.5rem;max-width:21rem;height:auto;background:var(--sheet);border:1px solid var(--rule)}.pn.sm{flex:1 1 12.5rem;max-width:15rem}.pn.tall{max-width:23rem}svg text{font-family:var(--f-mono)}.t-lab{font-family:var(--f-body);fill:var(--ink)}.t-head{font-family:var(--f-disp);fill:var(--ink)}.t-num{font-family:var(--f-mono);fill:var(--ink)}svg .b{font-weight:600}.c-in{color:var(--c-in);fill:var(--c-in)}.c-out{color:var(--c-out);fill:var(--c-out)}.c-mut{color:var(--ink-2);fill:var(--ink-2)}.s-ink{stroke:var(--ink)}.s-mut{stroke:var(--ink-2)}.s-grid{stroke:var(--grid)}.s-none{stroke:none}.f-in{fill:var(--c-in)}.f-out{fill:var(--c-out)}.f-inv{fill:var(--c-inv)}.f-orth{fill:var(--c-orth)}.f-warn{fill:var(--c-warn)}.f-null{fill:var(--c-null)}.f-ink{fill:var(--ink)}.f-mut{fill:var(--ink-2)}.f-wwarn{fill:var(--w-warn)}line,polyline,path{fill:none}.katex svg path{fill:currentColor}polygon.s-in,polygon.s-out{stroke-linejoin:round}svg.pz-root{width:360px!important;height:440px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture main"><g class="pz-w fig"><g class="pz-w panels"><svg aria-label="이 과목의 이름 붙은 결과들은 대부분 이름의 주인보다 앞선 사람이 먼저 했다." class="pn tall pz-inner" height="100%" role="img" viewBox="0 0 360 440" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="nm-in" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-in" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="nm-out" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-out" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="nm-inv" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-inv" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="nm-orth" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-orth" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="nm-warn" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-warn" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="nm-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="nm-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mut" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="nm-null" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-null" d="M0,1 L10,5 L0,9 z"></path></marker></defs><text class="t-head" font-size="13" text-an
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 840 476" width="840" height="476" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#ECEAF0; --panel:#F7F6F9; --ink:#1D1A26; --muted:#5B5668; --rule:#C9C5D2; --rule-2:#DCD9E2;
  --red:#B42318;   --red-fill:#F3D3CE;
  --flesh:#995532; --flesh-fill:#ECCFBC;
  --cob:#2B4A9B;   --cob-fill:#D3DBF1;
  --verd:#1F6F62;  --verd-fill:#CDE7E1;
  --void:#17141F;  --on-void:#F2EEF7;
  --display-ko:"Hahmlet","Noto Serif KR","Noto Serif CJK KR",serif;
  --body:"Noto Serif KR","Noto Serif CJK KR","Apple SD Gothic Neo",serif;
  --display-la:"GFS Didot","Didot","Bodoni 72","Noto Serif",serif;
  --sans:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Red Hat Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }svg.fig{display:block;width:100%;height:auto;font-family:var(--sans);overflow:visible}svg.fig text{font-family:var(--sans);font-size:14px;fill:var(--ink)}svg.fig .t-s{font-size:12px}svg.fig .t-l{font-size:17px}svg.fig .t-b{font-weight:700}svg.fig .t-mid{text-anchor:middle}svg.fig .t-end{text-anchor:end}svg.fig .t-muted{fill:var(--muted)}svg.fig .f-ink{fill:var(--ink)}svg.fig .f-red{fill:var(--red)}svg.fig .f-redf{fill:var(--red-fill)}svg.fig .f-cob{fill:var(--cob)}svg.fig .f-cobf{fill:var(--cob-fill)}svg.fig .f-none{fill:none}svg.fig .s-ink{stroke:var(--ink)}svg.fig .s-rule{stroke:var(--rule)}svg.fig .s-red{stroke:var(--red)}svg.fig .w1{stroke-width:1px}svg.fig .w15{stroke-width:1.5px}svg.fig .w2{stroke-width:2px}svg.fig .round{stroke-linecap:round;stroke-linejoin:round}:root{ --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2); }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{max-width:560px;margin-inline:auto}.doc{padding-inline:var(--pad)}.lecture{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-block:2.5rem 3rem;
  content-visibility:auto;border-top:1px solid var(--rule)}.fig-wrap{margin:.8rem 0 !important}.fig-scroll{overflow-x:auto;background:
  linear-gradient(to right,var(--panel) 30%,transparent) left center/2.2rem 100% no-repeat local,
  linear-gradient(to left,var(--panel) 30%,transparent) right center/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) left center/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) right center/.8rem 100% no-repeat scroll,
  var(--panel);padding:1rem .9rem .6rem}.fig-inner{width:100%}svg.pz-root{width:840px!important;height:476px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig-wrap"><g class="pz-w fig-scroll"><g class="pz-w fig-inner"><svg xmlns="http://www.w3.org/2000/svg" aria-label="서론은 결여·균열·간극을 주체와 앎 쪽에서 대타자·사물·존재 쪽으로 옮기는 같은 한 수를 다섯 번 되풀이한다" class="fig pz-inner" height="100%" role="img" viewBox="0 0 840 476" width="100%">
<defs>
<marker id="L01-3-ar-red" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-red" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="L01-3-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 맨 위 -->
<text class="t-mid t-l t-b" x="655" y="30">실재는 무보다 적다</text>
<line class="s-ink w15" marker-end="url(#L01-3-ar-ink)" x1="655" x2="655" y1="78" y2="42"></line>
<text class="t-end t-s t-muted" x="645" y="64">이 수를 존재론 전체로</text>
<!-- 열 머리 -->
<text class="t-mid t-b f-red" x="225" y="96">주체 · 앎 · 우리 이성 쪽</text>
<text class="t-mid t-b f-cob" x="655" y="96">대타자 · 사물 · 존재 쪽</text>
<!-- 칸 바탕 -->
<g class="f-redf">
<rect height="50" rx="4" width="290" x="80" y="115"></rect>
<rect height="50" rx="4" width="290" x="80" y="179"></rect>
<rect height="50" rx="4" width="290" x="80" y="243"></rect>

"><svg xmlns="http://www.w3.org/2000/svg" aria-label="곰·스라소니·독수리·거북 넷으로 된 같은 4×4 표에서, 자연의 종은 대각선 네 칸(곰은 곰과)을 차지하고, 토템 씨족은 대각선을 금하고 여자를 바깥 열두 칸으로 보내며, 카스트는 여자를 대각선에 두고 직능을 바깥 열두 칸으로 보낸다. 토템 도식의 대칭은 이 비대칭 위에 서 있고, 카스트는 여자와 직능의 자리를 맞바꾼다." class="d pz-inner" height="100%" role="img" viewBox="0 0 720 470" width="100%">

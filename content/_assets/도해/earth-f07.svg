ass="s-hair" x1="60.0" x2="580.0" y1="116.0" y2="116.0"></line><rect class="f-umber" height="10.0" rx="5" width="34.7" x="181.3" y="111.0"><title>570~590조</title></rect><circle class="f-umber ring" cx="216.0" cy="116.0" r="5.5"><title>≈590 590조</title></circle><text class="tx" text-anchor="middle" x="216.0" y="136.0">≈590</text><text class="ts" text-anchor="start" x="60.0" y="152.0">③ β 6.25 × 세계 순생산 ≈ 100</text><line class="s-hair" x1="60.0" x2="580.0" y1="166.0" y2="166.0"></line><circle class="f-umber ring" cx="285.3" cy="166.0" r="5.5"><title>≈630 630조</title></circle><text class="tx" text-anchor="middle" x="285.3" y="186.0">≈630</text></svg></g></g></g></g></svg>
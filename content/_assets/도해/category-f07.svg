le class="dot dot-alarm" cx="508.8" cy="143.9" r="4.5"></circle><text class="t-s num" text-anchor="start" x="522.0" y="110.0">0.01</text><text class="t-s num" text-anchor="start" x="522.0" y="162.0">0.99</text><path class="ln ln-arrow" d="M234.0,130.0 L342.0,130.0" marker-end="url(#tear-m-arrow)" style="stroke-width:3px"></path><text class="t-arrow i" text-anchor="middle" x="288.0" y="120.0">p</text><path class="ln ln-alarm dash" d="M508.8,112.1 C570,10 120,-30 54,120" marker-end="url(#tear-m-alarm)" style="stroke-width:2px"></path><path class="ln ln-alarm dash" d="M508.8,147.9 C560,250 260,250 206,140" marker-end="url(#tear-m-alarm)" style="stroke-width:2px"></path><text class="t-alarm i" text-anchor="middle" x="132.0" y="70.0">p⁻¹</text></svg></svg>
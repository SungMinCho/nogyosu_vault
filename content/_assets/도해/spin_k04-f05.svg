 y="288">완전히 평평</text><line class="ln ln-rot dash" x1="70" x2="720" y1="192.18" y2="192.18"></line><line class="ln ln-rot dash" x1="350" x2="380" y1="309" y2="309"></line><text class="t-s t-rot" text-anchor="start" x="386" y="313">n = 4096 가우시안 수준 ≈ 3.8</text><rect class="bar-nv" height="10" rx="0" width="10" x="70" y="304"></rect><text class="t-s" text-anchor="start" x="85" y="313">원래</text><rect class="bar-mx" height="10" rx="0" width="10" x="140" y="304"></rect><text class="t-s" text-anchor="start" x="155" y="313">무작위 하다마드 변환 뒤</text></svg></svg>
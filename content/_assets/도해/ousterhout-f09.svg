<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 280" width="720" height="280" class="frame fig lecture doc page"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E7EAE8; --panel:#F3F5F4; --code-bg:#EEF1F0;
  --ink:#1B2224; --muted:#586365; --rule:#C1C9C8; --rule-soft:rgba(27,34,36,.07);
  --if:#2A5687; --if-soft:rgba(42,86,135,.12); --if-deep:#15375C;
  --ore:#8A6014; --ore-soft:rgba(138,96,20,.15);
  --cx:#7A3B72; --cx-soft:rgba(122,59,114,.12);
  --flag:#B3381B; --flag-soft:rgba(179,56,27,.10);
  --canary:#E9B30C;
  --f-body:"Source Serif 4","Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-disp:"Do Hyeon","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --f-label:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1416; --panel:#161D20; --code-bg:#131A1D;
    --ink:#E1E7E6; --muted:#95A1A3; --rule:#2F3A3D; --rule-soft:rgba(225,231,230,.06);
    --if:#7EA7DA; --if-soft:rgba(126,167,218,.16); --if-deep:#3B6AA5;
    --ore:#D6A553; --ore-soft:rgba(214,165,83,.17);
    --cx:#CB8EC2; --cx-soft:rgba(203,142,194,.17);
    --flag:#EF7B57; --flag-soft:rgba(239,123,87,.14);
    --canary:#F4C63A;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1416; --panel:#161D20; --code-bg:#131A1D;
  --ink:#E1E7E6; --muted:#95A1A3; --rule:#2F3A3D; --rule-soft:rgba(225,231,230,.06);
  --if:#7EA7DA; --if-soft:rgba(126,167,218,.16); --if-deep:#3B6AA5;
  --ore:#D6A553; --ore-soft:rgba(214,165,83,.17);
  --cx:#CB8EC2; --cx-soft:rgba(203,142,194,.17);
  --flag:#EF7B57; --flag-soft:rgba(239,123,87,.14);
  --canary:#F4C63A;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1rem 3rem }.lecture{ display:contents }.fig{ margin:.6rem 0 }.frame{ overflow-x:auto; overflow-y:hidden; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding-block:.8rem;
  background-image:linear-gradient(to right,var(--bg),var(--bg)),linear-gradient(to right,var(--bg),var(--bg)),
    linear-gradient(to right,var(--rule),transparent),linear-gradient(to left,var(--rule),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat;
  background-size:1.5rem 100%,1.5rem 100%,.6rem 100%,.6rem 100%; background-attachment:local,local,scroll,scroll }.dg{ display:block; width:100%; height:auto }.dg .t, .hero-svg .t{ font-family:var(--f-label); font-size:13px; fill:var(--ink) }.dg .t-s{ font-size:12px }.dg .t-xs{ font-size:11px }.dg .t-b, .hero-svg .t-b{ font-weight:700 }.dg .t-m{ font-family:var(--f-mono) }.dg .t-mut, .hero-svg .t-mut{ fill:var(--muted) }.dg .t-if, .hero-svg .t-if{ fill:var(--if) }.dg .t-ore, .hero-svg .t-ore{ fill:var(--ore) }.dg .t-flag{ fill:var(--flag) }.dg line, .dg polyline, .dg path, .hero-svg line, .hero-svg polyline, .hero-svg path{ fill:none }.f-ink{ fill:var(--ink)!important }.f-bg{ fill:var(--bg)!important }.f-panel{ fill:var(--panel)!important }.f-if-soft{ fill:var(--if-soft)!important }.f-ore-soft{ fill:var(--ore-soft)!important }.f-flag-soft{ fill:var(--flag-soft)!important }.ln{ stroke:var(--ink); stroke-width:1.4 }.s-ink-thin{ stroke:var(--ink); stroke-width:1 }.s-if{ stroke:var(--if); stroke-width:1.4 }.s-ore{ stroke:var(--ore); stroke-width:1.2 }.s-flag{ stroke:var(--flag); stroke-width:1.4 }.w15{ stroke-width:1.5 }.dash{ stroke-dasharray:4 3 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="주석의 높이: 코드와 같은 높이의 주석은 코드를 되풀이할 뿐이고, 쓸모 있는 주석은 한 단계 위로 올라가 무엇과 왜를 말하거나 한 단계 아래로 내려가 단위·경계·null·소유·불변 조건을 적는다." class="dg" height="100%" role="img" style="" viewBox="0 0 720 280" width="100%"><defs><marker id="a-ink-levels" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="ln" marker-end="url(#a-ink-levels)" x1="34.0" x2="34.0" y1="250.0" y2="30.0"></line><line class="ln" marker-end="url(#a-ink-levels)" x1="34.0" x2="34.0" y1="30.0" y2="250.0"></line><text class="t t-xs t-mut" text-anchor="start" transform="rotate(-90 20 60)" x="20.0" y="60.0">더 추상적</text><rect class="f-if-soft s-if" height="58.0" rx="4" width="640.0" x="60.0" y="34.0"></rect><text class="t t-s t-b t-if" text-anchor="start" x="76.0" y="56.0">높은 수준 주석 — 무엇을, 왜</text><text class="t t-xs t-m" text-anchor="start" x="76.0" y="78.0">// 이 키 해시를 알맞은 서버로 갈, 아직 안 보낸 RPC에 넣는다</text><rect class="f-panel s-ink-thin" height="58.0" rx="4" width="330.0" x="60.0" y="112.0"></rect><text class="t t-s t-b" text-anchor="start" x="76.0" y="134.0">코드</text><text class="t t-xs t-m" text-anchor="start" x="76.0" y="156.0">if (rpc.state == LOADING &amp;&amp; rpc.hash == h)</text><rect class="f-flag-soft s-flag dash" height="58.0" rx="4" width="296.0" x="404.0" y="112.0"></rect><text class="t t-s t-b t-flag" text-anchor="start" x="420.0" y="134.0">같은 높이의 주석 = 되풀이</text><text class="t t-xs t-m" text-anchor="start" x="420.0" y="156.0">// state가 LOADING이고 hash가 같으면</text><line class="s-flag w15" x1="412.0" x2="688.0" y1="152.0" y2="152.0"></line><rect class="f-ore-soft s-ore" height="64.0" rx="4" width="640.0" x="60.0" y="190.0"></rect><text class="t t-s t-b t-ore" text-anchor="start" x="76.0" y="212.0">낮은 수준 주석 — 정밀하게</text><rect class="f-bg s-ore" height="22.0" rx="11" width="73.6" x="76.0" y="222.0"></rect><text class="t t-xs" text-anchor="middle" x="112.8" y="237.0">단위: 픽셀</text><rect class="f-bg s-ore" height="22.0" rx="11" width="144.0" x="157.6" y="222.0"></rect><text class="t t-xs" text-anchor="middle" x="229.6" y="237.0">[offset, offset+len)</text><rect class="f-bg s-ore" height="22.0" rx="11" width="112.0" x="309.6" y="222.0"></rect><text class="t t-xs" text-anchor="middle" x="365.6" y="237.0">null = 아직 없음</text><rect class="f-bg s-ore" height="22.0" rx="11" width="102.4" x="429.6" y="222.0"></rect><text class="t t-xs" text-anchor="middle" x="480.8" y="237.0">닫는 쪽: 호출자</text><rect class="f-bg s-ore" height="22.0" rx="11" width="104.0" x="540.0" y="222.0"></rect><text class="t t-xs" text-anchor="middle" x="592.0" y="237.0">불변: 항목 ≥ 1</text><text class="t t-xs t-mut" text-anchor="start" transform="rotate(-90 20 240)" x="20.0" y="240.0">더 정밀</text></svg></svg>
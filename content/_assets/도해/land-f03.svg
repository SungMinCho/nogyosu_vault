<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 372" width="700" height="372" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-frame{ fill:var(--paper-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-zero{ fill:var(--zero) }.fig .f-zerosoft{ fill:var(--zero-soft) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-ledgersoft{ fill:var(--ledger-soft) }.fig .f-blood{ fill:var(--blood) }.fig .s-ink{ stroke:var(--ink) }.fig .s-mute{ stroke:var(--ink-2) }.fig .s-zero{ stroke:var(--zero) }.fig .s-ledger{ stroke:var(--ledger) }.fig .w1{ stroke-width:1 }.fig .dash{ stroke-dasharray:5 4 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="칸트 뒤에서 길이 갈린다. 누메논을 에너지로 읽는 계보(쇼펜하우어–니체–프로이트–바타유)와 현전을 더듬는 현상학(후설–하이데거–데리다) 사이에 골이 있다." height="100%" role="img" style="--minw:644px" viewBox="0 0 700 372" width="100%"><defs><marker id="lineage-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="lineage-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="lineage-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="lineage-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="lineage-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="lineage-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><rect class="f-frame s-ink" height="38" rx="5" width="140" x="280" y="22"></rect><text class="t-b" text-anchor="middle" x="350" y="45.5">칸트 · 누메논</text><line class="s-ink" marker-end="url(#lineage-ink)" x1="320" x2="205" y1="60" y2="84"></line><line class="s-ink" marker-end="url(#lineage-ink)" x1="380" x2="495" y1="60" y2="84"></line><text class="t-b f-zero" text-anchor="middle" x="175" y="102">에너지적 무의식</text><text class="t-s f-mute" text-anchor="middle" x="175" y="120">누메논 = 의지 · 충동 · 에너지</text><text class="t-b f-ledger" text-anchor="middle" x="525" y="102">현전의 현상학</text><text class="t-s f-mute" text-anchor="middle" x="525" y="120">현전하기 = 의식에 주어지는 사건</text><rect class="f-zerosoft s-zero" height="34" rx="5" width="210" x="70" y="134"></rect><text class="t-s" text-anchor="middle" x="175" y="155.5">쇼펜하우어 — 삶에의 의지</text><rect class="f-zerosoft s-zero" height="34" rx="5" width="210" x="70" y="190"></rect><text class="t-s" text-anchor="middle" x="175" y="211.5">니체 — 권력에의 의지</text><line class="s-zero" marker-end="url(#lineage-zero)" x1="175" x2="175" y1="168" y2="188"></line><rect class="f-zerosoft s-zero" height="34" rx="5" width="210" x="70" y="246"></rect><text class="t-s" text-anchor="middle" x="175" y="267.5">프로이트 — 충동 · 죽음충동</text><line class="s-zero" marker-end="url(#lineage-zero)" x1="175" x2="175" y1="224" y2="244"></line><rect class="f-zerosoft s-zero" height="34" rx="5" width="210" x="70" y="302"></rect><text class="t-s t-b" text-anchor="middle" x="175" y="323.5">바타유 — 일반경제 · 데뻥스</text><line class="s-zero" marker-end="url(#lineage-zero)" x1="175" x2="175" y1="280" y2="300"></line><rect class="f-ledgersoft s-ledger" height="34" rx="5" width="210" x="420" y="134"></rect><text class="t-s" text-anchor="middle" x="525" y="155.5">후설 — 현상학</text><rect class="f-ledgersoft s-ledger" height="34" rx="5" width="210" x="420" y="190"></rect><text class="t-s" text-anchor="middle" x="525" y="211.5">하이데거 — 존재와 현전</text><line class="s-ledger" marker-end="url(#lineage-ledger)" x1="525" x2="525" y1="168" y2="188"></line><rect class="f-ledgersoft s-ledger" height="34" rx="5" width="210" x="420" y="246"></rect><text class="t-s" text-anchor="middle" x="525" y="267.5">데리다 — 디페랑스 · 흔적</text><line class="s-ledger" marker-end="url(#lineage-ledger)" x1="525" x2="525" y1="224" y2="244"></line><polyline class="s-mute w1" points="344.0,96.0 356.0,109.5 344.0,123.0 356.0,136.5 344.0,150.0 356.0,163.5 344.0,177.0 356.0,190.5 344.0,204.0 356.0,217.5 344.0,231.0 356.0,244.5 344.0,258.0 356.0,271.5 344.0,285.0 356.0,298.5 344.0,312.0 356.0,325.5"></polyline><text class="t-b f-mute" text-anchor="middle" x="350" y="352">거대한 골</text><path class="s-ink dash" d="M420,262 C380,262 330,302 284,304" marker-end="url(#lineage-ink)"></path><text class="t-s f-mute" x="420" y="306">1967년 글로 바타유 수용을 장악</text></svg></svg>
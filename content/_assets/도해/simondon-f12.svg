><text class="t-s" text-anchor="middle" x="413.9" y="176">보스 5 mm · 레베데프 6 mm (1894–96)</text><circle class="f-ink" cx="221.3" cy="206" r="3.5"></circle><text class="t-s" text-anchor="middle" x="221.3" y="192">니콜스·티어 1923 · 0.22 mm</text><circle class="f-ink" cx="162.1" cy="206" r="3.5"></circle><text class="t-s" text-anchor="end" x="154.1" y="204">글라골레바-아르카디예바</text><text class="t-s" text-anchor="end" x="154.1" y="218">1924 · 82 µm</text><text class="t-s t-b" x="36" y="176">헤르츠파 쪽 (전기적) ←</text><line class="s-ink w15" marker-end="url(#f12-ar-ink)" x1="36" x2="258.0" y1="246" y2="246"></line><circle class="f-ink" cx="244.5" cy="246" r="3.5"></circle><circle class="f-ink" cx="260.0" cy="246" r="3.5"></circle><text class="t-s" text-anchor="end" x="240.5" y="262">루벤스·폰 바이어 1911 · 약 0.3 mm</text><text class="t-s" x="268.0" y="262">니콜스·티어 1923 · 적외 0.42 mm</text><text class="t-s t-b" x="36" y="238">→ 적외선 쪽 (광학적)</text><text class="t-s t-b" x="268.0" y="230.0">← 겹친 구간 82 µm–0.42 mm</text><line class="s-brk w2" x1="186.9" x2="247.9" y1="282" y2="282"></line><line class="s-brk w15" x1="186.9" x2="186.9" y1="278" y2="286"></line><line class="s-brk w15" x1="247.9" x2="247.9" y1="278" y2="286"></line><text class="t-s t-brk" x="255.9" y="286">〔정정〕 시몽동이 적은 겹침 0.124–0.343 mm — 실제는 더 넓다</text><line class="s-mute w1" x1="36" x2="726" y1="300" y2="300"></line><line class="s-mute w1" x1="36.0" x2="36.0" y1="300" y2="305"></line><text class="t-s t-mute t-num" text-anchor="start" x="36.0" y="317">10 µm</text><line class="s-mute w1" x1="174.0" x2="174.0" y1="300" y2="305"></line><text class="t-s t-mute t-num" text-anchor="middle" x="174.0" y="317">100 µm</text><line class="s-mute w1" x1="312.0" x2="312.0" y1="300" y2="305"></line><text class="t-s t-mute t-num" text-anchor="middle" x="312.0" y="317">1 mm</text><line class="s-mute w1" x1="450.0" x2="450.0" y1="300" y2="305"></line><text class="t-s t-mute t-num" text-anchor="middle" x="450.0" y="317">1 cm</text><line class="s-mute w1" x1="588.0" x2="588.0" y1="300" y2="305"></line><text class="t-s t-mute t-num" text-anchor="middle" x="588.0" y="317">10 cm</text><line class="s-mute w1" x1="726.0" x2="726.0" y1="300" y2="305"></line><text class="t-s t-mute t-num" text-anchor="end" x="726.0" y="317">1 m</text>
<text class="t-s t-b" x="36" y="342">반사 — 요철이 파장의 수십분의 일 아래면 거울 <tspan class="t-mute">(맨 위 자와 같은 축척)</tspan></text><line class="s-inf w2" marker-end="url(#f12-ar-inf)" x1="238.3" x2="296.7" y1="362" y2="362"></line><circle class="f-inf" cx="238.3" cy="362" r="2.5"></circle><text class="t-s" text-anchor="middle" x="267.5" y="378">은 거울 · 보랏빛</text><line class="s-inf w2" marker-end="url(#f12-ar-inf)" x1="470.3" x2="528.6" y1="362" y2="362"></line><circle class="f-inf" cx="470.3" cy="362" r="2.5"></circle><text class="t-s" text-anchor="middle" x="499.4" y="378">금속 그물 · 데시미터파</text><line class="s-inf w2" marker-end="url(#f12-ar-inf)" x1="588.7" x2="647.0" y1="362" y2="362"></line><circle class="f-inf" cx="588.7" cy="362" r="2.5"></circle><text class="t-s" text-anchor="middle" x="617.9" y="378">철탑 줄 · 수백 m파</text><text class="t-s t-inf" x="36.0" y="366">요철 → 파장:</text><text class="t-s t-inf" x="36.0" y="380">화살 길이 같음 = 비가 같음</text><text class="t-s t-b" x="36" y="398">회절 — 그물코가 파장과 비슷할 때</text><line class="s-inf w2" x1="154.4" x2="154.4" y1="412" y2="424"></line><circle class="f-inf" cx="154.4" cy="418" r="3.5"></circle><text class="t-s" text-anchor="middle" x="154.4" y="438">결정 그물 · X선</text><line class="s-inf w2" x1="300.5" x2="300.5" y1="412" y2="424"></line><circle class="f-inf" cx="300.5" cy="418" r="3.5"></circle><text class="t-s" text-anchor="middle" x="300.5" y="438">새긴 격자 · 가시광</text><line class="s-inf w2" x1="568.1" x2="568.1" y1="412" y2="424"></line><circle class="f-inf" cx="568.1" cy="418" r="3.5"></circle><text class="t-s" text-anchor="middle" x="568.1" y="438">산봉우리 · TV 미터파</text><text class="t-s t-mute" text-anchor="end" x="726" y="462">항은 일곱 자릿수씩 다르고 비는 같다 — 연관들의 동일성</text>
</svg></g></g></g></g></svg>
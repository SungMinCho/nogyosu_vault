x="266.0" y="165.0">q</text><path class="ln ln-arrow" d="M143.8,52.2 Q200.0,70.0 241.0,70.0" marker-end="url(#cop-b-m-arrow)" style="stroke-width:2px"></path><path class="ln ln-arrow" d="M143.8,89.7 Q200.0,70.0 241.0,70.0" marker-end="url(#cop-b-m-arrow)" style="stroke-width:2px"></path><path class="ln ln-arrow" d="M143.8,140.3 Q200.0,160.0 241.0,160.0" marker-end="url(#cop-b-m-arrow)" style="stroke-width:2px"></path><path class="ln ln-arrow" d="M143.8,177.8 Q200.0,160.0 241.0,160.0" marker-end="url(#cop-b-m-arrow)" style="stroke-width:2px"></path></svg></svg>
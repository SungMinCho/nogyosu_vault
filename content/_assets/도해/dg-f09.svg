<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 400" width="720" height="400" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2-t{ fill:var(--ink-2); }.f-muted{ stroke:var(--muted); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-indigo-f{ fill:var(--indigo-soft); }.f-madder{ stroke:var(--madder); }.f-madder-t{ fill:var(--madder); }.f-madder-f{ fill:var(--madder-soft); }.f-ochre-t{ fill:var(--ochre); }.f-mend-t{ fill:var(--mend); }.f-panel-f{ fill:var(--panel); }.f-none{ fill:none; }.f-dash{ stroke-dasharray:6 5; }.f-dot{ stroke-dasharray:2 4; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-l{ font-size:15px; }svg .t-b{ font-weight:700; }svg .halo{ paint-order:stroke; stroke:var(--panel); stroke-width:4px; stroke-linejoin:round; }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="나무에서는 두 잎 사이의 길이 하나뿐이라 반드시 꼭대기 S를 거쳐 올라갔다 내려와야 하고, 리좀에는 꼭대기가 없어 선 하나를 끊어도 다른 길로 돌아 이어진다. 아래의 풍차 그래프는 '두 사람마다 공통 친구가 꼭 하나'라는 평등해 보이는 조건이 결국 모두의 친구 하나를 가운데 세운다는 우정 정리의 모양이다." height="100%" role="img" viewBox="0 0 720 400" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f09-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f09-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f09-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f09-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f09-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f09-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f09-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="f-indigo-t t-l t-b" text-anchor="start" x="16" y="24">나무</text><line class="f-indigo f-none" stroke-width="4.5" x1="160" x2="95" y1="52" y2="122"></line><line class="f-indigo f-none" stroke-width="4.5" x1="160" x2="225" y1="52" y2="122"></line><line class="f-indigo f-none" stroke-width="1.5" x1="95" x2="55" y1="122" y2="196"></line><line class="f-indigo f-none" stroke-width="4.5" x1="95" x2="130" y1="122" y2="196"></line><line class="f-indigo f-none" stroke-width="4.5" x1="225" x2="190" y1="122" y2="196"></line><line class="f-indigo f-none" stroke-width="1.5" x1="225" x2="265" y1="122" y2="196"></line><circle class="f-indigo f-indigo-f" cx="160" cy="52" r="15" stroke-width="2"></circle><text class="f-indigo-t t-l t-b" text-anchor="middle" x="160" y="57">S</text><circle class="f-indigo f-panel-f" cx="95" cy="122" r="7" stroke-width="2"></circle><circle class="f-indigo f-panel-f" cx="225" cy="122" r="7" stroke-width="2"></circle><circle class="f-indigo f-panel-f" cx="55" cy="196" r="7" stroke-width="1.6"></circle><circle class="f-indigo f-indigo-f" cx="130" cy="196" r="7" stroke-width="2.4"></circle><circle class="f-indigo f-indigo-f" cx="190" cy="196" r="7" stroke-width="2.4"></circle><circle class="f-indigo f-panel-f" cx="265" cy="196" r="7" stroke-width="1.6"></circle><text class="f-indigo-t t-s" text-anchor="start" x="184" y="48">꼭대기를 거쳐야</text><text class="f-indigo-t t-s" text-anchor="middle" x="160" y="228">잎 → 잎: 길은 하나뿐</text><text class="f-ink2-t t-s" text-anchor="middle" x="160" y="246">점 7 · 변 6 (= n − 1)</text><line class="f-muted f-none f-dot" stroke-width="1" x1="330" x2="330" y1="16" y2="250"></line><text class="f-madder-t t-l t-b" text-anchor="start" x="350" y="24">리좀</text><line class="f-madder f-none" stroke-width="1.4" x1="392" x2="478" y1="72" y2="52"></line><line class="f-madder f-none" stroke-width="1.4" x1="478" x2="588" y1="52" y2="78"></line><line class="f-madder f-none" stroke-width="1.4" x1="588" x2="684" y1="78" y2="56"></line><line class="f-madder f-none" stroke-width="1.4" x1="392" x2="420" y1="72" y2="150"></line><line class="f-madder f-none" stroke-width="1.4" x1="478" x2="528" y1="52" y2="134"></line><line class="f-madder f-none" stroke-width="1.4" x1="420" x2="528" y1="150" y2="134"></line><line class="f-madder f-none" stroke-width="1.4" x1="684" x2="648" y1="56" y2="158"></line><line class="f-madder f-none" stroke-width="1.4" x1="420" x2="494" y1="150" y2="214"></line><line class="f-madder f-none" stroke-width="1.4" x1="372" x2="420" y1="226" y2="150"></line><line class="f-madder f-none" stroke-width="1.4" x1="372" x2="494" y1="226" y2="214"></line><line class="f-madder f-none" stroke-width="1.4" x1="494" x2="528" y1="214" y2="134"></line><line class="f-madder f-none" stroke-width="1.4" x1="494" x2="604" y1="214" y2="232"></line><line class="f-madder f-none" stroke-width="1.4" x1="604" x2="648" y1="232" y2="158"></line><line class="f-madder f-none" stroke-width="1.4" x1="648" x2="694" y1="158" y2="214"></line><line class="f-madder f-none" stroke-width="1.4" x1="604" x2="694" y1="232" y2="214"></line><line class="f-madder f-none" stroke-width="1.4" x1="478" x2="420" y1="52" y2="150"></line><line class="f-madder f-none" stroke-width="1.4" x1="528" x2="604" y1="134" y2="232"></line><line class="f-madder f-none f-dash" stroke-width="1.4" x1="528" x2="648" y1="134" y2="158"></line><line class="f-ink f-none" stroke-width="2.4" x1="581.0" x2="595.0" y1="139.0" y2="153.0"></line><line class="f-ink f-none" stroke-width="2.4" x1="581.0" x2="595.0" y1="153.0" y2="139.0"></line><text class="f-ink-t t-s halo" text-anchor="middle" x="590.0" y="172.0">끊음</text><line class="f-madder f-none" stroke-width="4" x1="528" x2="588" y1="134" y2="78"></line><line class="f-madder f-none" stroke-width="4" x1="588" x2="648" y1="78" y2="158"></line><text class="f-madder-t t-s halo" text-anchor="start" x="620" y="104">다른 길로</text><circle class="f-madder f-panel-f" cx="392" cy="72" r="7" stroke-width="1.6"></circle><circle class="f-madder f-panel-f" cx="478" cy="52" r="7" stroke-width="1.6"></circle><circle class="f-madder f-madder-f" cx="588" cy="78" r="7" stroke-width="2"></circle><circle class="f-madder f-panel-f" cx="684" cy="56" r="7" stroke-width="1.6"></circle><circle class="f-madder f-panel-f" cx="420" cy="150" r="7" stroke-width="1.6"></circle><circle class="f-madder f-madder-f" cx="528" cy="134" r="7" stroke-width="2"></circle><circle class="f-madder f-madder-f" cx="648" cy="158" r="7" stroke-width="2"></circle><circle class="f-madder f-panel-f" cx="372" cy="226" r="7" stroke-width="1.6"></circle><circle class="f-madder f-panel-f" cx="494" cy="214" r="7" stroke-width="1.6"></circle><circle class="f-madder f-panel-f" cx="604" cy="232" r="7" stroke-width="1.6"></circle><circle class="f-madder f-panel-f" cx="694" cy="214" r="7" stroke-width="1.6"></circle><text class="f-madder-t t-s" text-anchor="middle" x="533" y="262">꼭대기 없음 · 아무 점과 옆으로</text><line class="f-muted f-none f-dot" stroke-width="1" x1="16" x2="704" y1="286" y2="286"></line><text class="f-ink-t" text-anchor="start" x="16" y="312">우정 정리 — 풍차 그래프</text><text class="f-ink2-t t-s" text-anchor="start" x="16" y="332">두 사람마다 공통 친구 하나</text><text class="f-ink2-t t-s" text-anchor="start" x="16" y="350">점 7 · 변 9
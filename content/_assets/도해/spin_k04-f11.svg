<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 250" width="800" height="250" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-spike{ fill:var(--spike) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-spike{ stroke:var(--spike) }.dg .dash{ stroke-dasharray:4 3 }.dg .f-ink{ fill:var(--ink) }.dg .f-spike{ fill:var(--spike) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.dg .ssub{ font-size:8px }.dg .tag-n{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:800px!important;height:250px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="QuIP#의 추론에서는 층마다 입력에 무작위 하다마드를 곱하고 압축된 가중치와 곱한 뒤 출력을 되돌린다. 층 사이에서 되돌리고 다시 돌리는 두 연산이 이어진다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 800 250" width="100%"><defs><marker id="f10-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f10-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="bx" height="44" rx="4" width="50" x="20" y="70"></rect><text class="t-s t-b" text-anchor="middle" x="45" y="89">x</text><text class="t-s t-mut" text-anchor="middle" x="45" y="105">FP16</text><rect class="bx-grid" height="44" rx="4" width="112" x="86" y="70"></rect><text class="t-s t-b" text-anchor="middle" x="142" y="89">Had(S<tspan class="ssub" dy="3">V</tspan><tspan dy="-3">​</tspan> ⊙ ·)</text><text class="t-s t-mut" text-anchor="middle" x="142" y="105">온라인</text><rect class="bx-rot" height="44" rx="4" width="96" x="210" y="70"></rect><text class="t-s t-b" text-anchor="middle" x="258" y="89">W̃ 곱하기</text><text class="t-s t-mut" text-anchor="middle" x="258" y="105">2비트 저장</text><rect class="bx-grid" height="44" rx="4" width="112" x="318" y="70"></rect><text class="t-s t-b" text-anchor="middle" x="374" y="89">Had(S<tspan class="ssub" dy="3">U</tspan><tspan dy="-3">​</tspan> ⊙ ·)</text><text class="t-s t-mut" text-anchor="middle" x="374" y="105">온라인</text><rect class="bx-grid" height="44" rx="4" width="112" x="470" y="70"></rect><text class="t-s t-b" text-anchor="middle" x="526" y="89">Had(S<tspan class="ssub" dy="3">V</tspan><tspan dy="-3">​</tspan>′ ⊙ ·)</text><text class="t-s t-mut" text-anchor="middle" x="526" y="105">온라인</text><rect class="bx-rot" height="44" rx="4" width="96" x="594" y="70"></rect><text class="t-s t-b" text-anchor="middle" x="642" y="97">W̃′ 곱하기</text><rect class="bx" height="44" rx="4" width="40" x="704" y="70"></rect><text class="t-s t-b" text-anchor="middle" x="724" y="97">…</text><line class="ln" marker-end="url(#f10-ink)" x1="72" x2="83" y1="92" y2="92"></line><line class="ln" marker-end="url(#f10-ink)" x1="200" x2="207" y1="92" y2="92"></line><line class="ln" marker-end="url(#f10-ink)" x1="308" x2="315" y1="92" y2="92"></line><line class="ln" marker-end="url(#f10-ink)" x1="432" x2="467" y1="92" y2="92"></line><line class="ln" marker-end="url(#f10-ink)" x1="584" x2="591" y1="92" y2="92"></line><line class="ln" marker-end="url(#f10-ink)" x1="692" x2="701" y1="92" y2="92"></line><rect class="tag-n" height="22" rx="3" width="346" x="80" y="36"></rect><text class="t-s t-b" text-anchor="middle" x="253" y="51">층 ℓ</text><rect class="tag-n" height="22" rx="3" width="236" x="464" y="36"></rect><text class="t-s t-b" text-anchor="middle" x="582" y="51">층 ℓ+1</text><path class="ln ln-spike dash" d="M 374 120 C 380 170, 520 170, 526 120" marker-end="url(#f10-spike)"></path><text class="t-s t-b t-spike" text-anchor="middle" x="450" y="184">되돌리자마자 다시 돌린다 — 둘을 서로 지울 수는 없나?</text><text class="t-s t-mut" text-anchor="middle" x="450" y="206">가로막는 것: 층 사이의 RMSNorm, FFN 안의 비선형 함수 → 5강</text></svg></g></g></g></g></svg>
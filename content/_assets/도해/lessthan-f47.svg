  --sans:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Red Hat Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }svg.fig{display:block;width:100%;height:auto;font-family:var(--sans);overflow:visible}svg.fig text{font-family:var(--sans);font-size:14px;fill:var(--ink)}svg.fig .t-s{font-size:12px}svg.fig .t-l{font-size:17px}svg.fig .t-b{font-weight:700}svg.fig .t-mid{text-anchor:middle}svg.fig .t-end{text-anchor:end}svg.fig .t-muted{fill:var(--muted)}svg.fig .f-ink{fill:var(--ink)}svg.fig .f-panel{fill:var(--panel)}svg.fig .f-rule2{fill:var(--rule-2)}svg.fig .f-cob{fill:var(--cob)}svg.fig .f-cobf{fill:var(--cob-fill)}svg.fig .f-void{fill:var(--void)}svg.fig .f-onvoid{fill:var(--on-void)}svg.fig .f-none{fill:none}svg.fig .s-ink{stroke:var(--ink)}svg.fig .s-muted{stroke:var(--muted)}svg.fig .s-cob{stroke:var(--cob)}svg.fig .w1{stroke-width:1px}svg.fig .w15{stroke-width:1.5px}svg.fig .w3{stroke-width:3px}svg.fig .dash{stroke-dasharray:6 5}:root{ --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2); }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{max-width:560px;margin-inline:auto}.doc{padding-inline:var(--pad)}.lecture{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-block:2.5rem 3rem;
  content-visibility:auto;border-top:1px solid var(--rule)}.fig-wrap{margin:.8rem 0 !important}.fig-scroll{overflow-x:auto;background:
  linear-gradient(to right,var(--panel) 30%,transparent) left center/2.2rem 100% no-repeat local,
  linear-gradient(to left,var(--panel) 30%,transparent) right center/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) left center/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) right center/.8rem 100% no-repeat scroll,
  var(--panel);padding:1rem .9rem .6rem}.fig-inner{width:100%}svg.pz-root{width:860px!important;height:426px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig-wrap"><g class="pz-w fig-scroll"><g class="pz-w fig-inner"><svg xmlns="http://www.w3.org/2000/svg" aria-label="인민은 선거로 제동을 거는 수동적 배경이고, 운동은 머릿수가 아닌 동원으로 인민을 대표하며, 행동의 순간에는 지식의 형식인 당이 필요하다. 그러나 인민과 당 사이의 틈은 서로 가까워지는 것으로 메워지지 않고, 넷째 꼭짓점인 지도자를 돌아서만 닫힌다. 지도자는 지식 S₂가 아니라 마침표를 찍는 S₁의 자리에 서야 하며, 스탈린은 S₂에 남았다." class="fig pz-inner" height="400" role="img" style="x:0px!important;y:44px!important;width:860px!important;height:400px!important;overflow:visible!important" viewBox="0 44 860 400" width="860" x="0" y="44">
<defs>
<marker id="L16-2-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="L16-2-ar-cob" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-cob" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 틈: 당과 인민 사이 대각선 -->
<line class="s-muted w15 dash" x1="580" x2="460" y1="140" y2="212"></line>
<line class="s-muted w15 dash" x1="400" x2="280" y1="248" y2="320"></line>
<rect class="f-void s-muted w1" height="28" rx="14" width="60" x="400" y="216"></rect>
<text class="t-mid t-s t-b f-onvoid" x="430" y="235">틈</text>
<text class="t-s t-muted" x="470" y="262">가까워지는 것으로는</text>
<text class="t-s t-muted" x="470" y="278">메워지지 않는다</text>
<!-- 변 -->
<line class="s-ink w15" marker-end="url(#L16-2-ar-ink)" x1="160" x2="160" y1="318" y2="146"></line>
<text class="t-s" x="172" y="222">동원으로 대표</text>
<text class="t-s t-muted" x="172" y="238">머릿수가 아니다</text>
<line class="s-ink w15" marker-end="url(#L16-2-ar-ink)" x1="282" x2="574" y1="100" y2="100"></line>
<text class="t-mid t-s" x="428" y="90">행동의 순간 — 당이 필요하다</text>
<path class="f-none s-cob w3" d="M700,142 L700,318" marker-end="url(#L16-2-ar-cob)"></path>
<path class="f-none s-cob w3" d="M578,360 L286,360" marker-end="url(#L16-2-ar-cob)"></path>
<text class="t-s t-b f-cob" x="712" y="222">더함</text>
<text class="t-s f-cob" x="712" y="238">틈을 돌아 닫는</text>
<text class="t-s f-cob" x="712" y="254">넷째 꼭짓점</text>
<text class="t-mid t-s f-cob" x="432" y="380">당과 인민의 통일</text>
<!-- 네 꼭짓점 -->
<rect class="f-panel s-ink w15" height="80" rx="6" width="240" x="40" y="60"></rect>
<text class="t-l t-b" x="56" y="88">운동</text>
<text class="t-end t-s t-muted" x="264" y="88">단원</text>
<text class="t-s" x="56" y="110">질적 민주주의</text>
<text class="t-s t-muted" x="56" y="128">타흐리르 광장의 소수</text>
<rect class="f-cobf s-cob w15" height="80" rx="6" width="240" x="580" y="60"></rect>
<text class="t-l t-b f-cob" x="596" y="88">당</text>
<text class="t-end t-s t-muted" x="804" y="88">악보</text>
<text class="t-s" x="596" y="110">지식의 형식 — 아는 주체 아님</text>
<text class="t-s t-muted" x="596" y="128">‘가능한 모든 실수’의 장</text>
<rect class="f-rule2 s-ink w15" height="80" rx="6" width="240" x="40" y="320"></rect>
<text class="t-l t-b" x="56" y="348">인민</text>
<text class="t-end t-s t-muted" x="264" y="348">청중</text>
<text class="t-s" x="56" y="370">수동적 배경</text>
<text class="t-s t-muted" x="56" y="388">선거 · 국민투표 = 제동</text>
<rect class="f-panel s-cob w3" height="80" rx="6" width="240" x="580" y="320"></rect>
<text class="t-l t-b f-cob" x="596" y="348">지도자</text>
<text class="t-end t-s t-muted" x="804" y="348">지휘자</text>
<text class="t-s" x="596" y="370">헤겔의 군주처럼 점만 찍는다</text>
<text class="t-s t-b f-cob" x="596" y="388">S₁이어야지 S₂가 아니다</text>
<text class="t-mid t-s t-muted" x="700" y="426">스탈린은 S₂ — 당의 지식 속에 남은, 충분히 주인이 아닌 자</text>
</svg></g></g></g></g></g></svg>
xs" text-anchor="middle" x="380.0" y="258.0">20</text><line class="s-ink w1" x1="455.0" x2="455.0" y1="240.0" y2="245.0"></line><text class="xs" text-anchor="middle" x="455.0" y="258.0">25</text><line class="s-ink w1" x1="530.0" x2="530.0" y1="240.0" y2="245.0"></line><text class="xs" text-anchor="middle" x="530.0" y="258.0">30</text><line class="s-ink w1" x1="605.0" x2="605.0" y1="240.0" y2="245.0"></line><text class="xs" text-anchor="middle" x="605.0" y="258.0">35</text><text class="s mut" text-anchor="middle" x="342.5" y="276.0">거슬러 올라간 세대 n</text><line class="s-ink w15 dash" x1="80.0" x2="605.0" y1="83.6" y2="83.6"></line><text class="s" text-anchor="start" x="86.0" y="75.6">13세기 세계 인구 ≈ 4억</text><polyline class="s-copy w2" points="80.0,240.0 87.5,237.3 95.0,234.5 102.5,231.8 110.0,229.1 117.5,226.3 125.0,223.6 132.5,220.8 140.0,218.1 147.5,215.4 155.0,212.6 162.5,209.9 170.0,207.2 177.5,204.4 185.0,201.7 192.5,199.0 200.0,196.2 207.5,193.5 215.0,190.7 222.5,188.0 230.0,185.3 237.5,182.5 245.0,179.8 252.5,177.1 260.0,174.3 267.5,171.6 275.0,168.8 282.5,166.1 290.0,163.4 297.5,160.6 305.0,157.9 312.5,155.2 320.0,152.4 327.5,149.7 335.0,147.0 342.5,144.2 350.0,141.5 357.5,138.7 365.0,136.0 372.5,133.3 380.0,130.5 387.5,127.8 395.0,125.1 402.5,122.3 410.0,119.6 417.5,116.9 425.0,114.1 432.5,111.4 440.0,108.6 447.5,105.9 455.0,103.2 462.5,100.4 470.0,97.7 477.5,95.0 485.0,92.2 492.5,89.5 500.0,86.7 507.5,84.0 515.0,81.3 522.5,78.5 530.0,75.8 537.5,73.1 545.0,70.3 552.5,67.6 560.0,64.9 567.5,62.1 575.0,59.4 582.5,56.6 590.0,53.9 597.5,51.2 605.0,48.4"></polyline><text class="s t-copy" text-anchor="end" x="320.0" y="140.4">조상 자리 2ⁿ</text><circle class="f-copy" cx="530.0" cy="75.8" r="4.0"></circle><text class="s b" text-anchor="end" x="601.0" y="107.8">30대: 10억 7천만 자리</text><text class="s b t-alarm" text-anchor="end" x="601.0" y="200.0">자리 &gt; 사람 수</text><text class="s t-alarm" text-anchor="end" x="601.0" y="218.0">족보가 접힌다</text><text class="s mut" text-anchor="start
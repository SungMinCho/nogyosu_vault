<line class="s-sun" marker-end="url(#ah-802s)" x1="500" x2="500" y1="174" y2="140"></line>
<text class="t-lab a-end" x="490" y="148">가면을 벗는다</text>
<text class="t-small a-end" x="490" y="164">감춘 무능 → 드러낸 무능</text>

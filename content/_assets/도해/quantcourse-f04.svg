<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 290" width="640" height="290" class="fig-frame fig wide lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#F3F2F6; --panel:#FAF9FC; --band:#ECEAF1;
  --ink:#1E1B26; --ink-2:#4F4A5C; --ink-3:#7E788B; --rule:#D8D4E0;
  --step:#5A3E9B; --sig:#8F6B00; --tooth:#B42A62; --fix:#0A7FA0;
  --step-soft:#E6E0F3; --sig-soft:#F2E8D0; --tooth-soft:#F6DFE8; --fix-soft:#D8EDF3; --fix-faint:rgba(10,127,160,.08);
  --f-display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --f-mono:"Sometype Mono","Nanum Gothic Coding",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-diag:"Nanum Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15131B; --panel:#1D1A25; --band:#1B1922;
  --ink:#ECE9F2; --ink-2:#B9B4C6; --ink-3:#8C8799; --rule:#34303F;
  --step:#8E78E0; --sig:#BC8A12; --tooth:#E0607A; --fix:#22A6B4;
  --step-soft:#2B2444; --sig-soft:#33290F; --tooth-soft:#3B1E2B; --fix-soft:#11303A; --fix-faint:rgba(34,166,180,.10);
  color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#15131B; --panel:#1D1A25; --band:#1B1922;
  --ink:#ECE9F2; --ink-2:#B9B4C6; --ink-3:#8C8799; --rule:#34303F;
  --step:#8E78E0; --sig:#BC8A12; --tooth:#E0607A; --fix:#22A6B4;
  --step-soft:#2B2444; --sig-soft:#33290F; --tooth-soft:#3B1E2B; --fix-soft:#11303A; --fix-faint:rgba(34,166,180,.10);
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 3rem }.lecture{ display:contents }.hero-fig svg{ width:100%; height:auto; display:block }.fig{ margin-block:.6rem !important }.fig-frame{ background:var(--panel); border:1px solid var(--rule); border-radius:4px; overflow-x:auto;
  background-image:linear-gradient(to right,var(--panel),var(--panel)),linear-gradient(to right,var(--panel),var(--panel)),
    linear-gradient(to right,rgba(0,0,0,.12),transparent),linear-gradient(to left,rgba(0,0,0,.12),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat;
  background-size:20px 100%,20px 100%,10px 100%,10px 100%; background-attachment:local,local,scroll,scroll }.fig-frame svg{ display:block; width:100%; min-width:540px; height:auto; padding:.4rem }.dg{ font-family:var(--f-diag); font-size:12px }.dg text{ fill:var(--ink) }.dg .t-ink{ fill:var(--ink) }.dg .t-ink2{ fill:var(--ink-2) }.dg .t-ink3{ fill:var(--ink-3) }.dg .t-step{ fill:var(--step) }.dg .t-tooth{ fill:var(--tooth) }.dg .t-fix{ fill:var(--fix) }.dg line, .dg polyline, .dg path, .dg ellipse{ fill:none }.dg .s-step{ stroke:var(--step) }.dg .s-tooth{ stroke:var(--tooth) }.dg .s-fix{ stroke:var(--fix) }.dg .f-step-soft{ fill:var(--step-soft) }.dg .f-tooth-soft{ fill:var(--tooth-soft) }.dg .f-paper{ fill:var(--panel) }.dg .f-none{ fill:none }.dg .mk-ink{ fill:var(--ink) }.dg .mk-ink2{ fill:var(--ink-2) }.dg .mk-step{ fill:var(--step) }.dg .mk-sig{ fill:var(--sig) }.dg .mk-tooth{ fill:var(--tooth) }.dg .mk-fix{ fill:var(--fix) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="SQNR 식의 세 항과 식 바깥의 두 손잡이, 그리고 각 손잡이를 다루는 강." class="dg" height="100%" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 640 290" width="100%"><defs><marker id="levers-a-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="levers-a-step" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-step" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="levers-a-sig" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-sig" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="levers-a-tooth" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-tooth" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="levers-a-fix" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-fix" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="levers-a-ink2" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink2" d="M0,1 L10,5 L0,9 z"></path></marker></defs><text class="t-ink" style="font-size:17px;font-weight:600" text-anchor="middle" x="70" y="64">SQNR</text><text class="t-ink2" style="font-size:17px" text-anchor="middle" x="120" y="64">≈</text><rect class="f-step-soft s-step" height="34" rx="4" stroke-width="1.4" width="92" x="140" y="42"></rect><text class="t-step" style="font-size:15px;font-weight:600" text-anchor="middle" x="186" y="64">6.02·b</text><rect class="f-step-soft s-step" height="34" rx="4" stroke-width="1.4" width="90" x="262" y="42"></rect><text class="t-step" style="font-size:15px;font-weight:600" text-anchor="middle" x="307" y="64">+ 4.77</text><rect class="f-tooth-soft s-tooth" height="34" rx="4" stroke-width="1.4" width="138" x="382" y="42"></rect><text class="t-tooth" style="font-size:15px;font-weight:600" text-anchor="middle" x="451" y="64">− 20·log<tspan dy="4" font-size="10">10</tspan><tspan dy="-4"> κ</tspan></text><rect class="s-fix f-none" height="34" rx="4" stroke-dasharray="4 3" stroke-width="1.4" width="88" x="540" y="42"></rect><text class="t-fix" style="font-size:11.5px;font-weight:600" text-anchor="middle" x="584" y="57">식 바깥</text><text class="t-fix" style="font-size:10.5px" text-anchor="middle" x="584" y="71">ε의 성격·과녁</text><text class="t-ink2" style="font-size:10.5px" text-anchor="middle" x="307" y="94">(Δ²/12의 3)</text><rect class="s-step f-paper" height="100" rx="4" stroke-width="1.4" width="116" x="12" y="150"></rect><text class="t-step" style="font-size:15px;font-weight:600" x="22" y="172">①</text><text class="t-ink" style="font-size:12.5px;font-weight:600" x="42" y="172">비트 b</text><text class="t-ink2" style="font-size:11px" x="22" y="198">1비트 = 6.02 dB</text><text class="t-ink2" style="font-size:11px" x="22" y="216">가장 비싼 길</text><path class="s-step" d="M70,150 C70,110 186,120 186,80" marker-end="url(#levers-a-step)" stroke-width="1.4"></path><rect class="s-tooth f-paper" height="100" rx="4" stroke-width="1.4" width="116" x="138" y="150"></rect><text class="t-tooth" style="font-size:15px;font-weight:600" x="148" y="172">②</text><text class="t-ink" style="font-size:12.5px;font-weight:600" x="168" y="172">첨두비 κ</text><text class="t-ink2" style="font-size:11px" x="148" y="198">7 세밀도 · 8 클리핑</text><text class="t-ink2" style="font-size:11px" x="148" y="216">10 스무딩 · 14 회전</text><path class="s-tooth" d="M196,150 C196,110 451,120 451,80" marker-end="url(#levers-a-tooth)" stroke-width="1.4"></path><rect class="s-step f-paper" height="100" rx="4" stroke-width="1.4" width="116" x="264" y="150"></rect><text class="t-step" style="font-size:15px;font-weight:600" x="274" y="172">③</text><text class="t-ink" style="font-size:12.5px;font-weight:600" x="294" y="172">눈금의 모양</text><text class="t-ink2" style="font-size:11px" x="274" y="198">3 로이드–맥스</text><text class="t-ink2" style="font-size:11px" x="274" y="216">5 부동소수점</text><path class="s-step" d="M322,150 C322,110 307,120 307,80" marker-end="url(#levers-a-step)" stroke-width="1.4"></path><rect class="s-fix f-paper" height="100" rx="4" stroke-width="1.4" width="116" x="390" y="150"></rect><text class="t-fix" style="font-size:15px;font-weight:600" x="400" y="172">④</text><text class="t-ink" style="font-size:12.5px;font-weight:600" x="420" y="172">오차가 가는 곳</text><text class="t-ink2" style="font-size:11px" x="400" y="198">4 디더링</text><text class="t-ink2" style="font-size:11px" x="400" y="216">13 오차 되먹임</text><path class="s-fix" d="M448,150 C448,110 584,120 584,80" marker-end="url(#levers-a-fix)" stroke-width="1.4"></path><rect class="s-fix f-paper" height="100" rx="4" stroke-width="1.4" width="116" x="516" y="150"></rect><text class="t-fix" style="font-size:15px;font-weight:600" x="526" y="172">⑤</text><text class="t-ink" style="font-size:12.5px;font-weight:600" x="546" y="172">어떤 오차를 세나</text><text class="t-ink2" style="font-size:11px" x="526" y="198">11 출력 오차와 H</text><text class="t-ink2" style="font-size:11px" x="526" y="216">12·13 OBS·GPTQ</text><path class="s-fix" d="M574,150 C574,110 584,120 584,80" marker-end="url(#levers-a-fix)" stroke-width="1.4"></path><text class="t-ink3" style="font-size:10.5px" text-anchor="middle" x="320" y="278">숫자는 그 손잡이를 다루는 강 번호</text></svg></svg>
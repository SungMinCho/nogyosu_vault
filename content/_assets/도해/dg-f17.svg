  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2{ stroke:var(--ink-2); }.f-ink2-t{ fill:var(--ink-2); }.f-muted{ stroke:var(--muted); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-indigo-f{ fill:var(--indigo-soft); }.f-madder{ stroke:var(--madder); }.f-madder-t{ fill:var(--madder); }.f-madder-f{ fill:var(--madder-soft); }.f-ochre-t{ fill:var(--ochre); }.f-mend-t{ fill:var(--mend); }.f-shade-f{ fill:var(--shade); }.f-panel-f{ fill:var(--panel); }.f-none{ fill:none; }.f-dash{ stroke-dasharray:6 5; }.f-dot{ stroke-dasharray:2 4; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-l{ font-size:15px; }svg .t-b{ font-weight:700; }svg.pz-root{width:720px!important;height:372px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="왼쪽: 이항·원·선의 세 절편성은 유연한 판(원시)에서는 셋 이상이 도는 바퀴, 중심이 제각각인 원들, 줄만 맞춘 마디로 나타나고, 경직된 판(국가)에서는 스스로 서서 연이어 둘로 가르는 기계, 한 중심에 공명하는 동심원, 같은 단위로 번역되는 직선 마디가 된다. 오른쪽: 분자적 흐름 A가 양자 a를 떨구면 경계의 권력 중심 B가 그것을 몰적 선 b의 절편으로 옮겨 적으려 하지만 몇 개는 옆으로 새고, 선이 말라붙은 자리에서 다시 흐름이 시작된다." class="pz-inner" height="100%" role="img" viewBox="0 0 720 372" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f17-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f17-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f17-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f17-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f17-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f17-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f17-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="f-ink2-t t-s" text-anchor="start" x="16" y="22">절편성의 세 모양</text><text class="f-ink-t" text-anchor="middle" x="140" y="46">유연 · 원시</text><text class="f-indigo-t" text-anchor="middle" x="318" y="46">경직 · 국가</text><line class="f-muted f-none f-dot" stroke-width="1" x1="229" x2="229" y1="34" y2="356"></line><line class="f-muted f-none f-dot" stroke-width="1" x1="16" x2="400" y1="164" y2="164"></line><line class="f-muted f-none f-dot" stroke-width="1" x1="16" x2="400" y1="278" y2="278"></line><text class="f-ink-t t-l" text-anchor="start" x="16" y="110">이항</text><text class="f-ink-t t-l" text-anchor="start" x="16" y="224">원</text><text class="f-ink-t t-l" text-anchor="start" x="16" y="322">선</text><circle class="f-ink f-panel-f" cx="140" cy="74" r="11" stroke-width="1.5"></circle><circle class="f-ink f-panel-f" cx="110" cy="124" r="11" stroke-width="1.5"></circle><circle class="f-ink f-panel-f" cx="170" cy="124" r="11" stroke-width="1.5"></circle><path class="f-ink f-none" d="M128,80 Q106,90 107,110" marker-end="url(#f17-a-ink)" stroke-width="1.3"></path><path class="f-ink f-none" d="M123,132 Q140,142 156,132" marker-end="url(#f17-a-ink)" stroke-width="1.3"></path><path class="f-ink f-none" d="M173,110 Q174,90 153,80" marker-end="url(#f17-a-ink)" stroke-width="1.3"></path><text class="f-ink2-t t-s" text-anchor="end" x="98" y="88">신부</text><text class="f-ink2-t t-s" text-anchor="middle" x="140" y="156">셋 이상이 도는 바퀴</text><rect class="f-indigo f-panel-f" height="70" rx="0" stroke-width="1.6" width="80" x="278" y="66"></rect><rect class="f-indigo f-indigo-f" height="35.0" rx="0" stroke-width="1.2" width="40.0" x="318.0" y="66"></rect><rect class="f-indigo f-indigo-f" height="35.0" rx="0" stroke-width="1.2" width="20.0" x="318.0" y="101.0"></rect><line class="f-indigo f-none" stroke-width="2.2" x1="318.0" x2="318.0" y1="66" y2="136"></line><text class="f-indigo-t t-s" text-anchor="middle" x="298.0" y="106.0">둘</text><text class="f-indigo-t t-s" text-anchor="middle" x="318" y="156">스스로 서서, 연이어 둘로</text><circle class="f-ink f-none" cx="112" cy="214" r="28" stroke-width="1.4"></circle><circle class="f-ink f-shade-f" cx="112" cy="214" r="4" stroke-width="1"></circle><circle class="f-ink f-none" cx="162" cy="206" r="24" stroke-width="1.4"></circle><circle class="f-ink f-sh
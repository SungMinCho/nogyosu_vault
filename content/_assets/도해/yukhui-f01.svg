<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 286" width="640" height="286" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  --bg:#EDE7DA; --panel:#F6F2E8; --ink:#241E17; --dim:#6B6152; --rule:#CCC2AC;
  --sea:#1B5064; --chaff:#96660C; --fire:#A2432A; --ground:#476844;
  --disp:"Kirang Haerang","Song Myung","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --body:"Cardo","Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif;
  --mono:"Anonymous Pro",ui-monospace,"DejaVu Sans Mono",monospace;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15120F; --panel:#1E1A15; --ink:#EAE3D3; --dim:#9C927F; --rule:#3B352C;
  --sea:#63B2C6; --chaff:#D5A03E; --fire:#DE7A57; --ground:#86AC82;
}}:root[data-theme="dark"]{
  --bg:#15120F; --panel:#1E1A15; --ink:#EAE3D3; --dim:#9C927F; --rule:#3B352C;
  --sea:#63B2C6; --chaff:#D5A03E; --fire:#DE7A57; --ground:#86AC82;
}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.3rem;
  padding-inline:var(--pad);padding-block:0 4rem}.lecture{display:contents}.hero-svg .sea-g path{fill:none;stroke:var(--sea);stroke-width:1.6;opacity:.75}.hero-svg .chaff-g circle{fill:var(--chaff);opacity:.85}.hero-svg .oar path{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.hero-svg .oar circle{fill:var(--ink)}.hero-svg .sea-t{fill:var(--sea)}figure.dia{margin:1.6rem 0}.frame{overflow-x:auto;border:1px solid var(--rule);background:var(--panel);padding:.9rem .7rem;
  background-image:linear-gradient(90deg,var(--panel),transparent 12px),
    linear-gradient(-90deg,var(--panel),transparent 12px),
    linear-gradient(90deg,rgba(0,0,0,.14),transparent 12px),
    linear-gradient(-90deg,rgba(0,0,0,.14),transparent 12px);
  background-repeat:no-repeat;background-size:24px 100%,24px 100%,12px 100%,12px 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll}.frame svg{display:block;width:100%;min-width:480px;height:auto;color:var(--ink)}svg .bx{fill:none;stroke:currentColor;stroke-width:1.5}svg .bx.dash,svg .dash{stroke-dasharray:5 4}svg .ln{fill:none;stroke:currentColor;stroke-width:1.5}svg .ln[marker-end],svg path.ln{fill:none}svg .tx{font-family:var(--body);font-size:13px;fill:currentColor}svg .sm{font-family:var(--mono);font-size:11px;fill:var(--dim)}svg .ttl{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;fill:currentColor}svg .fire-s{fill:none;stroke:var(--fire);stroke-width:1.8}svg .fire-s circle{fill:var(--fire)}svg .sea-t{fill:var(--sea)}svg .fire-t{fill:var(--fire)}svg marker#ar path{fill:currentColor;stroke:none}svg marker#arC path{fill:var(--chaff);stroke:none}svg marker#arF path{fill:var(--fire);stroke:none}svg marker#arS path{fill:var(--sea);stroke:none}svg text{dominant-baseline:auto}svg.pz-root{width:640px!important;height:286px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w dia"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="시계는 부분이 부분을 만들지 못하고 나무는 부분이 서로를 산출한다" class="pz-inner" height="100%" role="img" viewBox="0 0 640 286" width="100%"><defs>
<marker id="ar" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z"></path></marker>
<marker id="arC" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z"></path></marker>
<marker id="arF" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z"></path></marker>
<marker id="arS" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z"></path></marker>
</defs>
<text class="ttl" x="8" y="24">시계 — 움직이는 힘(bewegende Kraft)</text>
<rect class="bx" height="150" rx="4" width="230" x="40" y="44"></rect>
<g class="bx"><circle cx="96" cy="100" r="22"></circle><circle cx="156" cy="100" r="22"></circle><circle cx="216" cy="100" r="22"></circle></g>
<g class="ln"><line x1="118" x2="134" y1="100" y2="100"></line><line x1="178" x2="194" y1="100" y2="100"></line></g>
<text class="sm" text-anchor="middle" x="155" y="160">부분이 부분을 만들지 않는다</text>
<rect class="bx" height="30" rx="3" width="138" x="86" y="212"></rect>
<text class="tx" text-anchor="middle" x="155" y="232">시계공</text>
<path class="fire-s" d="M155 210 L155 196" marker-end="url(#arF)"></path>
<text class="sm fire-t" text-anchor="middle" x="155" y="266">원인이 바깥에 있다</text>
<text class="ttl" x="368" y="24">나무 — 형성하는 힘(bildende Kraft)</text>
<path class="bx dash" d="M370 44 h230 v150 h-230 z"></path>
<text class="sm" text-anchor="middle" x="485" y="60">전체</text>
<g class="bx"><circle cx="425" cy="112" r="20"></circle><circle cx="545" cy="112" r="20"></circle><circle cx="485" cy="168" r="20"></circle></g>
<g class="ln"><path d="M441 103 L529 103" marker-end="url(#ar)"></path><path d="M529 121 L441 121" marker-end="url(#ar)"></path>
<path d="M436 129 L474 155" marker-end="url(#ar)"></path><path d="M496 155 L534 129" marker-end="url(#ar)"></path>
<path d="M474 155 L436 129" marker-end="url(#ar)"></path><path d="M534 129 L496 155" marker-end="url(#ar)"></path></g>
<text class="sm sea-t" text-anchor="middle" x="485" y="212">모든 것이 목적이며 상호적으로 또한 수단</text>
<text class="sm sea-t" text-anchor="middle" x="485" y="232">자기 자신의 원인이자 결과 (KU §64)</text>
<text class="sm sea-t" text-anchor="middle" x="485" y="266">원인이 고리 전체다</text>
</svg></g></g></g></g></svg>
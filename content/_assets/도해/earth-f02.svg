<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 320" width="720" height="320" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#E4E9E2; --panel:#EDF1EB; --ink:#17201C; --ink2:#46524C; --ink3:#6F7B74; --rule:#C1CAC0; --hair:#D2D9D0;
  --umber:#8C4D12; --umber-l:#E4CFBA; --blue:#22508F; --blue-l:#CCD8EA; --blue-d:#1A3E70;
  --brass:#9A7410; --brass-l:#E2CF8E; --brass-d:#73560A; --brass-top:#E2CF8E; --violet:#6B3FA0; --violet-l:#DDD0EE; --violet-d:#55308A;
  --verm:#B2381F; --verm-l:#F0CBC1; --verm-d:#9A2E18; --on:#FFFFFF; --stripe:3%;
  --shadow:rgba(23,32,28,.22);
  --f-disp:"Nanum Myeongjo","Gowun Batang",serif; --f-lat:"Cinzel","Nanum Myeongjo",serif;
  --f-body:"Gowun Batang","Nanum Myeongjo",serif; --f-sans:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1513; --panel:#151D1A; --ink:#DCE3DC; --ink2:#A9B5AD; --ink3:#7F8B84; --rule:#2C3732; --hair:#222C28;
  --umber:#B5702E; --umber-l:#3B2A1B; --blue:#5A86D2; --blue-l:#1C2A42; --blue-d:#9DB8E8;
  --brass:#AE8C1F; --brass-l:#5A4A17; --brass-d:#7D640F; --brass-top:#D2B04A; --violet:#9570D2; --violet-l:#2D2342; --violet-d:#C2A8EC;
  --verm:#D85E3D; --verm-l:#45241B; --verm-d:#F09A80; --on:#0F1513; --shadow:rgba(0,0,0,.55); --stripe:1.6%; color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#0F1513; --panel:#151D1A; --ink:#DCE3DC; --ink2:#A9B5AD; --ink3:#7F8B84; --rule:#2C3732; --hair:#222C28;
  --umber:#B5702E; --umber-l:#3B2A1B; --blue:#5A86D2; --blue-l:#1C2A42; --blue-d:#9DB8E8;
  --brass:#AE8C1F; --brass-l:#5A4A17; --brass-d:#7D640F; --brass-top:#D2B04A; --violet:#9570D2; --violet-l:#2D2342; --violet-d:#C2A8EC;
  --verm:#D85E3D; --verm-l:#45241B; --verm-d:#F09A80; --on:#0F1513; --shadow:rgba(0,0,0,.55); --stripe:1.6%; color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}a:focus-visible, .frame:focus-visible{ outline:2px solid var(--violet); outline-offset:3px }.cert .frame{ background:transparent }@media (max-width:40em){.cert .frame{ padding:.6rem .2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:.5rem 2rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .4rem }.frame{ overflow-x:auto; background:
  linear-gradient(to right, var(--panel) 30%, transparent), linear-gradient(to left, var(--panel) 30%, transparent) 100% 0,
  radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) 100% 0;
  background-repeat:no-repeat; background-size:40px 100%, 40px 100%, 14px 100%, 14px 100%; background-attachment:local, local, scroll, scroll;
  background-color:var(--panel); border:1px solid var(--rule); padding:.6rem .4rem }.frame svg{ display:block; width:100%; height:auto }svg text{ font-family:var(--f-sans); fill:var(--ink); font-size:13px }svg .tl{ font-size:13.5px }svg .ts{ font-size:12.5px }svg .tx{ font-size:11.5px }svg .tn{ font-family:var(--f-mono); font-size:12px }svg .tb{ font-weight:700 }svg .tn.tb{ font-weight:600 }svg .t3{ fill:var(--ink3) }svg .t-on{ fill:var(--on) }.f-umber{fill:var(--umber)}.f-blue{fill:var(--blue)}.f-blue-l{fill:var(--blue-l)}.f-none{fill:none}.s-blue{stroke:var(--blue)}.s-ink2{stroke:var(--ink2)}.sb{stroke:var(--blue); stroke-width:1.2}svg line, svg path, svg polyline, svg rect, svg circle{ stroke-width:1 }.sw2{ stroke-width:2 !important }.dash{ stroke-dasharray:5 4 }svg pattern line{ stroke-width:1.1 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="섬나라 세 장부. 갑의 대출 80과 은행의 대출채권 80, 은행의 예금 80과 을의 예금 80이 같은 것의 양면. 자산을 그냥 더하면 260, 순자산을 더하면 집 한 채 100." height="100%" id="isl" role="img" style="" viewBox="0 0 720 320" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="isl-ar" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-blue" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="tl tb" text-anchor="middle" x="120.0" y="30.0">갑 — 집주인</text><line class="s-ink2 sw2" x1="20.0" x2="220.0" y1="42.0" y2="42.0"></line><line class="s-ink2 sw2" x1="120.0" x2="120.0" y1="42.0" y2="158.0"></line><text class="tx t3" text-anchor="start" x="26.0" y="58.0">자산</text><text class="tx t3" text-anchor="end" x="214.0" y="58.0">부채</text><rect class="f-umber" height="34.0" rx="3" width="84.0" x="28.0" y="68.0"><title>집 100</title></rect><text class="tl t-on" text-anchor="middle" x="70.0" y="90.0">집 100</text><rect class="f-blue-l sb" height="34.0" rx="3" width="84.0" x="128.0" y="68.0"><title>대출 80</title></rect><text class="tl" text-anchor="middle" x="170.0" y="90.0">대출 80</text><text class="tn tb" text-anchor="middle" x="170.0" y="148.0">순자산 20</text><text class="tl tb" text-anchor="middle" x="360.0" y="30.0">은행</text><line class="s-ink2 sw2" x1="260.0" x2="460.0" y1="42.0" y2="42.0"></line><line class="s-ink2 sw2" x1="360.0" x2="360.0" y1="42.0" y2="158.0"></line><text class="tx t3" text-anchor="start" x="266.0" y="58.0">자산</text><text class="tx t3" text-anchor="end" x="454.0" y="58.0">부채</text><rect class="f-blue-l sb" height="34.0" rx="3" width="84.0" x="268.0" y="68.0"><title>대출채권 80</title></rect><text class="tl" text-anchor="middle" x="310.0" y="90.0">대출채권 80</text><rect class="f-blue-l sb" height="34.0" rx="3" width="84.0" x="368.0" y="68.0"><title>예금 80</title></rect><text class="tl" text-anchor="middle" x="410.0" y="90.0">예금 80</text><text class="tn tb" text-anchor="middle" x="410.0" y="148.0">순자산 0</text><text class="tl tb" text-anchor="middle" x="600.0" y="30.0">을 — 저축가</text><line class="s-ink2 sw2" x1="500.0" x2="700.0" y1="42.0" y2="42.0"></line><line class="s-ink2 sw2" x1="600.0" x2="600.0" y1="42.0" y2="158.0"></line><text class="tx t3" text-anchor="start" x="506.0" y="58.0">자산</text><text class="tx t3" text-anchor="end" x="694.0" y="58.0">부채</text><rect class="f-blue-l sb" height="34.0" rx="3" width="84.0" x="508.0" y="68.0"><title>예금 80</title></rect><text class="tl" text-anchor="middle" x="550.0" y="90.0">예금 80</text><text class="tn tb" text-anchor="middle" x="650.0" y="148.0">순자산 80</text><path class="s-blue f-none sw2 dash" d="M200,85 C228,85 240,85 268,85" marker-end="url(#isl-ar)" marker-start="url(#isl-ar)"></path><text class="tx" text-anchor="middle" x="234.0" y="76.0">같은 80</text><path class="s-blue f-none sw2 dash" d="M440,85 C468,85 480,85 508,85" marker-end="url(#isl-ar)" marker-start="url(#isl-ar)"></path><text class="tx" text-anchor="middle" x="474.0" y="76.0">같은 80</text><text class="tl tb" text-anchor="start" x="20.0" y="212.0">자산을 그냥 더하면</text><rect class="f-umber" height="26.0" rx="2" width="153.0" x="20.0" y="220.0"><title>집 100</title></rect><text class="ts t-on" text-anchor="middle" x="96.5" y="238.0">집 100</text><rect class="f-blue-l sb" height="26.0" rx="2" width="122.0" x="175.0" y="220.0"><title>대출채권 80</title></rect><text class="ts" text-anchor="middle" x="236.0" y="238.0">대출채권 80</text><rect class="f-blue-l sb" height="26.0" rx="2" width="122.0" x="299.0" y="220.0"><title>예금 80</title></rect><text class="ts" text-anchor="middle" x="360.0" y="238.0">예금 80</text><text class="tn tb" text-anchor="start" x="433.0" y="238.0">= 260  (집의 2.6배)</text><text class="tl tb" text-anchor="start" x="20.0" y="274.0">순자산을 더하면  20 + 0 + 80</text><rect class="f-umber" height="26.0" rx="2" width="153.0" x="20.0" y="282.0"><title>순자산 합계 100 = 집 한 채</title></rect><text class="ts t-on" text-anchor="middle" x="97.5" y="300.0">100</text><text class="tn tb" text-anchor="start" x="185.0" y="300.0">= 100  (집 한 채)</text></svg></svg>
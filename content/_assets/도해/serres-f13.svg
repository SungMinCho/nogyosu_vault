<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 400" width="860" height="400" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.fig-svg .tl, .chart .tl{ font-family:var(--f-latin); font-style:italic; }.fig-svg .tm, .chart .tm{ font-family:var(--f-mono); font-size:11px; }.c-pass{ fill:var(--pass) !important }.c-order{ fill:var(--order) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-pass{ stroke:var(--pass) }.s-order{ stroke:var(--order) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-shoal{ fill:var(--shoal) }.f-land{ fill:var(--land) }.f-pass-t{ fill:var(--pass); fill-opacity:.16 }.f-order-t{ fill:var(--order); fill-opacity:.18 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.mk-pass{ fill:var(--pass) }svg.pz-root{width:860px!important;height:400px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="프랑스어 caractère의 두 뜻. 보이는 형질과 읽히는 문자가 서로를 거꾸로 번역한다. 옆에는 형질 안에 유전자, 유전자 안에 분자, 그 안에 문자가 든 상자 속 상자가 있고, 더 깊은 상자가 더 참된 실재는 아니다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 860 400" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F15-ar-pass" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-pass" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="s-order f-land w2" height="112" rx="3" width="210" x="24" y="46"></rect><text class="ts tl" text-anchor="middle" x="129" y="66">caractère ①</text><text class="tb" text-anchor="middle" x="129" y="87">형질 — 보이는 것</text><path class="s-order f-deep w15" d="M66,116 C80,100 178,100 192,116 C178,132 80,132 66,116 Z"></path><circle class="s-order f-land w15" cx="92" cy="116" r="8"></circle><circle class="s-order f-order-t w15" cx="116" cy="116" r="8"></circle><circle class="s-order f-land w15" cx="140" cy="116" r="8"></circle><circle class="s-order f-order-t w15" cx="164" cy="116" r="8"></circle><text class="ts" text-anchor="middle" x="129" y="148">완두 색 · 눈동자 색</text><rect class="s-pass f-pass-t w2" height="112" rx="3" width="210" x="240" y="226"></rect><text class="ts tl" text-anchor="middle" x="345" y="246">caractère ②</text><text class="tb" text-anchor="middle" x="345" y="267">문자 — 읽히는 것</text><text class="tm" text-anchor="middle" x="345" y="292">ATG GCC TTA CGA</text><text class="tm" text-anchor="middle" x="345" y="307">TCA GGT ACC GTA</text><text class="ts" text-anchor="middle" x="345" y="329">염기 서열</text><path class="s-pass w2 f-none" d="M236,92 C340,92 395,150 395,222" marker-end="url(#F15-ar-pass)"></path><text class="t c-pass" text-anchor="start" x="410" y="142">역번역</text><text class="ts" text-anchor="start" x="410" y="158">거꾸로 읽기</text><path class="s-pass w2 f-none" d="M238,290 C130,290 90,230 90,162" marker-end="url(#F15-ar-pass)"></path><text class="t c-pass" text-anchor="start" x="118" y="200">번역</text><text class="ts" text-anchor="start" x="118" y="216">글자가 꼴로 표현된다</text><text class="t tl" text-anchor="middle" x="322" y="186">caractère</text><text class="ts" text-anchor="middle" x="322" y="202">한 낱말, 두 얼굴</text><text class="ts tl" text-anchor="middle" x="345" y="362">« le réel est du côté de Gutenberg »</text><text class="ts" text-anchor="middle" x="345" y="378">실재는 구텐베르크 쪽에 있다</text><text class="t" text-anchor="middle" x="680" y="30">상자를 열면 상자 안에 상자</text><rect class="s-order f-land w2" height="236" rx="3" width="300" x="530" y="46"></rect><text class="t c-order" text-anchor="start" x="544" y="68">형질 (caractère ①)</text><rect class="s-ink f-deep w15" height="178" rx="3" width="248" x="556" y="84"></rect><text class="t" text-anchor="start" x="570" y="104">유전자</text><rect class="s-ink f-shoal w15" height="122" rx="3" width="196" x="582" y="120"></rect><text class="t" text-anchor="start" x="596" y="140">분자</text><rect class="s-pass f-pass-t w2" height="66" rx="3" width="152" x="604" y="158"></rect><text class="t c-pass" text-anchor="middle" x="680" y="180">문자 (caractère ②)</text><text class="tm" text-anchor="middle" x="680" y="206">ATGGCCTTACGA…</text><ellipse class="s-ink2 f-none w15" cx="556" cy="363.25" rx="15" ry="18.75"></ellipse><circle class="s-ink2 f-none w15" cx="556" cy="335.75" r="10"></circle><ellipse class="s-ink2 f-none w15" cx="594" cy="367" rx="12" ry="15"></ellipse><circle class="s-ink2 f-none w15" cx="594" cy="345" r="8"></circle><ellipse class="s-ink2 f-none w15" cx="624" cy="370.3" rx="9.36" ry="11.7"></ellipse><circle class="s-ink2 f-none w15" cx="624" cy="353.14" r="6.24"></circle><ellipse class="s-ink2 f-none w15" cx="646" cy="373" rx="7.2" ry="9"></ellipse><circle class="s-ink2 f-none w15" cx="646" cy="359.8" r="4.8"></circle><text class="ts" text-anchor="start" x="672" y="312">러시아 인형 · 끼워넣기</text><text class="ts tl" text-anchor="start" x="672" y="327">poupées russes · emboîtement</text><text class="t c-caution" text-anchor="start" x="672" y="356">더 깊다 ≠ 더 참되다</text><text class="ts" text-anchor="start" x="672" y="373">물자체가 아니라 또 하나의 판본</text></svg></g></g></g></g></svg>
<path class="f-none s-red w2 dot" d="M105,281 L105,318 L540,318 L540,162"></path>
<circle class="f-panel s-red w2" cx="540" cy="318" r="13"></circle>
<text class="t-mid t-b f-red" x="540" y="324">?</text>
<text class="t-mid t-s t-b f-red" x="322" y="340">공포 ≈ 불안 ? — 재구성</text>

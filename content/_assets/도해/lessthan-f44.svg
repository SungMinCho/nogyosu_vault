<ellipse class="f-none s-flesh w2" cx="498" cy="410" rx="22" ry="9"></ellipse>
<path class="f-none s-flesh w2" d="M480,404 A22,9 0 0,1 512,402" marker-end="url(#L15-2-ar-ink)"></path>
<circle class="f-ink" cx="518" cy="415" r="4.5"></circle>
<text class="t-b f-flesh" x="534" y="390">고랑을 도는 공 — 지젝의 ‘참 진공’</text>
<text class="t-s" x="534" y="412">충동의 순환 — 대상을 거듭 놓친다</text>
<text class="t-s" x="534" y="430">아무것도 안 하기 — 부분들의 활동이 떠받친 평화</text>
<text class="t-s" x="534" y="448">잉여향락 — 원을 도는 편이 ‘더 싸다’</text>

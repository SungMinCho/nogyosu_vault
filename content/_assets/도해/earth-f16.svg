  background-color:var(--panel); border:1px solid var(--rule); padding:.6rem .4rem }.frame svg{ display:block; width:100%; height:auto }svg text{ font-family:var(--f-sans); fill:var(--ink); font-size:13px }svg .ts{ font-size:12.5px }svg .tx{ font-size:11.5px }svg .tn{ font-family:var(--f-mono); font-size:12px }svg .tb{ font-weight:700 }svg .tn.tb{ font-weight:600 }svg .t2{ fill:var(--ink2) }svg .tnum{ font-variant-numeric:tabular-nums }.f-umber{fill:var(--umber)}.f-blue{fill:var(--blue)}.f-verm{fill:var(--verm)}.f-ink{fill:var(--ink)}.s-ink2{stroke:var(--ink2)}.s-ink3{stroke:var(--ink3)}.s-hair{stroke:var(--hair)}svg line, svg path, svg polyline, svg rect, svg circle{ stroke-width:1 }.ring{ stroke:var(--panel); stroke-width:2 !important }svg pattern line{ stroke-width:1.1 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="앞으로 10년 연 실질 수익률 어림. 현금 환원 2.4%와 이익 성장 2%에 밸류에이션 변화를 더하면 CAPE 유지 시 약 4.4%, 28로 하락 시 약 0.6%, 평균 17.4로 회귀 시 약 −3.8%." height="100%" id="dc" role="img" style="" viewBox="0 0 600 276" width="100%" xmlns="http://www.w3.org/2000/svg"><defs></defs><line class="s-hair" x1="70.0" x2="70.0" y1="44.0" y2="214.0"></line><text class="tx t2 tnum" text-anchor="middle" x="70.0" y="232.0">−9%</text><line class="s-hair" x1="160.0" x2="160.0" y1="44.0" y2="214.0"></line><text class="tx t2 tnum" text-anchor="middle" x="160.0" y="232.0">−6%</text><line class="s-hair" x1="250.0" x2="250.0" y1="44.0" y2="214.0"></line><text class="tx t2 tnum" text-anchor="middle" x="250.0" y="232.0">−3%</text><line class="s-ink3" x1="340.0" x2="340.0" y1="44.0" y2="214.0"></line><text class="tx t2 tnum" text-anchor="middle" x="340.0" y="232.0">0%</text><line class="s-hair" x1="430.0" x2="430.0" y1="44.0" y2="214.0"></line><text class="tx t2 tnum" text-anchor="middle" x="430.0" y="232.0">+3%</text><line class="s-hair" x1="520.0" x2="520.0" y1="44.0" y2="214.0"></line><text class="tx t2 tnum" text-anchor="middle" x="520.0" y="232.0">+6%</text><line class="s-ink2" x1="535.0" x2="535.0" y1="40.0" y2="214.0"></line><text class="tx t2" text-anchor="end" x="531.0" y="36.0">역사 평균 ≈6.5%</text><text class="ts tb" text-anchor="start" x="70.0" y="62.0">CAPE 41 그대로</text><rect class="f-blue" height="18.0" rx="2" width="70.1" x="340.0" y="69.0"><title>현금 환원 2.37%</title></rect><rect class="f-umber" height="18.0" rx="2" width="59.0" x="411.1" y="69.0"><title>실질 이익 성장 2% (가정)</title></rect><polygon class="f-ink ring" points="471.1,65.0 477.1,78.0 471.1,91.0 465.1,78.0"><title>연 수익률 ≈ 4.4%</title></polygon><text class="tn tb" text-anchor="start" x="483.1" y="83.0">≈ 4.4%</text><text class="ts tb" text-anchor="start" x="70.0" y="118.0">CAPE 41 → 28</text><rect class="f-blue" height="18.0" rx="2" width="70.1" x="340.0" y="125.0"><title>현금 환원 2.37%</title></rect><rect class="f-umber" height="18.0" rx="2" width="59.0" x="411.1" y="125.0"><title>실질 이익 성장 2% (가정)</title></rect><rect class="f-verm" height="18.0" rx="2" width="111.8" x="227.2" y="125.0"><title>밸류에이션 변화 -3.76%/년</title></rect><polygon class="f-ink ring" points="358.3,121.0 364.3,134.0 358.3,147.0 352.3,134.0"><title>연 수익률 ≈ 0.6%</title></polygon><text class="tn tb" text-anchor="start" x="483.1" y="139.0">≈ 0.6%</text><text class="ts tb" text-anchor="start" x="70.0" y="174.0">CAPE 41 → 17.4 (평균)</text><rect class="f-blue" height="18.0" rx="2" width="70.1" x="340.0" y="181.0"><title>현금 환원 2.37%</title></rect><rect class="f-umber" height="18.0" rx="2" width="59.0" x="411.1" y="181.0"><title>실질 이익 성장 2% (가정)</title></rect><rect class="f-verm" height="18.0" rx="2" width="245.3" x="93.7" y="181.0"><title>밸류에이션 변화 -8.21%/년</title></rect><polygon class="f-ink ring" points="224.8,177.0 230.8,190.0 224.8,203.0 218.8,190.0"><title>연 수익률 ≈ -3.8%</title></polygon><text class="tn tb" text-anchor="start" x="483.1" y="195.0">≈ −3.8%</text><rect class="f-blue" height="12.0" rx="2" width="12.0" x="60.0" y="252.0"></rect><text class="tx" text-anchor="start" x="78.0" y="262.
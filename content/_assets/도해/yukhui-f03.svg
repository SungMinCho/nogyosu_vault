<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 660 260" width="660" height="260" class="frame dia lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  --bg:#EDE7DA; --panel:#F6F2E8; --ink:#241E17; --dim:#6B6152; --rule:#CCC2AC;
  --sea:#1B5064; --chaff:#96660C; --fire:#A2432A; --ground:#476844;
  --disp:"Kirang Haerang","Song Myung","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --body:"Cardo","Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif;
  --mono:"Anonymous Pro",ui-monospace,"DejaVu Sans Mono",monospace;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15120F; --panel:#1E1A15; --ink:#EAE3D3; --dim:#9C927F; --rule:#3B352C;
  --sea:#63B2C6; --chaff:#D5A03E; --fire:#DE7A57; --ground:#86AC82;
}}:root[data-theme="dark"]{
  --bg:#15120F; --panel:#1E1A15; --ink:#EAE3D3; --dim:#9C927F; --rule:#3B352C;
  --sea:#63B2C6; --chaff:#D5A03E; --fire:#DE7A57; --ground:#86AC82;
}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.3rem;
  padding-inline:var(--pad);padding-block:0 4rem}.lecture{display:contents}.hero-svg .sea-g path{fill:none;stroke:var(--sea);stroke-width:1.6;opacity:.75}.hero-svg .chaff-g circle{fill:var(--chaff);opacity:.85}.hero-svg .oar path{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.hero-svg .oar circle{fill:var(--ink)}.hero-svg .sea-t{fill:var(--sea)}.hero-svg .chaff-t{fill:var(--chaff)}figure.dia{margin:1.6rem 0}.frame{overflow-x:auto;border:1px solid var(--rule);background:var(--panel);padding:.9rem .7rem;
  background-image:linear-gradient(90deg,var(--panel),transparent 12px),
    linear-gradient(-90deg,var(--panel),transparent 12px),
    linear-gradient(90deg,rgba(0,0,0,.14),transparent 12px),
    linear-gradient(-90deg,rgba(0,0,0,.14),transparent 12px);
  background-repeat:no-repeat;background-size:24px 100%,24px 100%,12px 100%,12px 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll}.frame svg{display:block;width:100%;min-width:480px;height:auto;color:var(--ink)}svg .bx{fill:none;stroke:currentColor;stroke-width:1.5}svg .bx.dash,svg .dash{stroke-dasharray:5 4}svg .ln{fill:none;stroke:currentColor;stroke-width:1.5}svg .ln[marker-end],svg path.ln{fill:none}svg .tx{font-family:var(--body);font-size:13px;fill:currentColor}svg .sm{font-family:var(--mono);font-size:11px;fill:var(--dim)}svg .ttl{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;fill:currentColor}svg .sea-s{fill:none;stroke:var(--sea);stroke-width:1.8}svg .fire-s circle{fill:var(--fire)}svg .sea-t{fill:var(--sea)}svg .chaff-t{fill:var(--chaff)}svg marker#ar path{fill:currentColor;stroke:none}svg marker#arC path{fill:var(--chaff);stroke:none}svg marker#arF path{fill:var(--fire);stroke:none}svg marker#arS path{fill:var(--sea);stroke:none}svg text{dominant-baseline:auto}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="헤겔의 세 반성이 고정점으로 수렴한다" height="100%" role="img" viewBox="0 0 660 260" width="100%"><defs>
<marker id="ar" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z"></path></marker>
<marker id="arC" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z"></path></marker>
<marker id="arF" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z"></path></marker>
<marker id="arS" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z"></path></marker>
</defs>
<text class="ttl" x="8" y="22">① 정립하는 반성</text>
<circle class="ln" cx="96" cy="108" fill="none" r="46"></circle>
<path class="ln" d="M142 108 a46 46 0 0 1 -12 30" marker-end="url(#ar)"></path>
<text class="sm" text-anchor="middle" x="96" y="104">무 → 무</text>
<text class="sm" text-anchor="middle" x="96" y="122">→ 자기</text>
<text class="sm" text-anchor="middle" x="96" y="184">씨앗값이 없다</text>
<text class="sm" text-anchor="middle" x="96" y="202">근거 없는 닫힌 고리</text>
<text class="ttl" x="228" y="22">② 외적 반성</text>
<rect class="bx" height="30" rx="3" width="74" x="228" y="60"></rect>
<text class="tx" text-anchor="middle" x="265" y="80">직접자</text>
<text class="sm" text-anchor="middle" x="265" y="106">밖에서 발견됨</text>
<circle class="ln" cx="372" cy="118" fill="none" r="40"></circle>
<path class="ln" d="M296 88 L336 108" marker-end="url(#ar)"></path>
<text class="sm" text-anchor="middle" x="372" y="122">반성</text>
<text class="sm" text-anchor="middle" x="330" y="184">주어진 것을 전제한다</text>
<text class="sm" text-anchor="middle" x="330" y="202">칸트적 포섭</text>
<text class="ttl" x="470" y="22">③ 규정하는 반성</text>
<circle class="sea-s" cx="536" cy="108" fill="none" r="44"></circle>
<path class="sea-s" d="M580 108 a44 44 0 0 1 -12 29" marker-end="url(#arS)"></path>
<text class="sm sea-t" text-anchor="middle" x="536" y="104">x = f(x)</text>
<text class="sm sea-t" text-anchor="middle" x="536" y="122">①+②</text>
<g class="ln"><line marker-end="url(#ar)" x1="536" x2="536" y1="152" y2="172"></line></g>
<text class="sm sea-t" text-anchor="middle" x="536" y="190">반성규정</text>
<text class="sm" text-anchor="middle" x="536" y="208">동일성 · 차이 · 모순 · 근거</text>
<text class="sm chaff-t" text-anchor="middle" x="330" y="244">같은 고정점이 클레이니의 재귀 정리와 폰 푀르스터의 아이겐형태에서 다시 나온다</text>
</svg></svg>
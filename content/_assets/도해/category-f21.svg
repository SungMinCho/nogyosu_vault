<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 150" width="200" height="150" class="mini minis fig wide lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.katex svg{fill:currentColor;stroke:currentColor;display:block;height:inherit;position:absolute;width:100%}.katex svg path{stroke:none}.katex svg{fill-rule:nonzero;fill-opacity:1;stroke-width:1;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:4;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1}:root{
  --paper:#F2F3F1; --paper-2:#E6E9E8; --ink:#15181C; --ink-2:#4A535B; --rule:#C3C9CD;
  --c-arrow:#1D5BB5;   
  --c-fun:#C3432A;     
  --c-nat:#15774A;     
  --c-univ:#9A690A;    
  --c-alarm:#8A3A91;   
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-body:"Hahmlet","Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-sign:"Jost","Do Hyeon","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --paper:#101316; --paper-2:#181D21; --ink:#E3E6E8; --ink-2:#9EA7AF; --rule:#2F363C;
    --c-arrow:#6FA3F0; --c-fun:#EE7A5D; --c-nat:#4DC388; --c-univ:#E0AA44; --c-alarm:#C98ED4;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --paper:#101316; --paper-2:#181D21; --ink:#E3E6E8; --ink-2:#9EA7AF; --rule:#2F363C;
  --c-arrow:#6FA3F0; --c-fun:#EE7A5D; --c-nat:#4DC388; --c-univ:#E0AA44; --c-alarm:#C98ED4;
  color-scheme:dark;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:2.2rem 4rem }.lecture{ display:contents }.legend svg{ width:3.2rem; height:1.2rem; overflow:visible }.fig{ margin:0; display:grid; gap:.6rem; padding-block:.4rem }.frame > svg{ display:block; width:100%; min-width:var(--minw,0px); height:auto; margin-inline:auto; max-width:48rem }.panel svg{ display:block; width:100%; height:auto }.fig svg text{ font-family:var(--f-sign); fill:var(--ink) }.fig svg .t{ font-size:15px }.fig svg tspan.t-univ{ fill:var(--c-univ) }.fig svg .i, .fig svg tspan.i{ font-family:KaTeX_Math,"Times New Roman",serif; font-style:italic }.fig svg tspan.sub{ font-size:70% }.ln{ fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-width:3px }.ln-univ, .ln-univ-solid{ stroke:var(--c-univ) }.dash{ stroke-dasharray:7 6 }.mk-arrow{ fill:var(--c-arrow) }.mk-fun{ fill:var(--c-fun) }.mk-nat{ fill:var(--c-nat) }.mk-univ{ fill:var(--c-univ) }.mk-alarm{ fill:var(--c-alarm) }.mk-ink{ fill:var(--ink) }.mk-mute{ fill:var(--ink-2) }.st{ fill:var(--paper); stroke:var(--ink); stroke-width:3.5px }.st-univ{ stroke:var(--c-univ); stroke-width:4px }.minis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr)); gap:.8rem }.mini{ border:1.5px solid var(--rule); padding:.5rem .5rem .6rem; display:grid; gap:.1rem; align-content:start; background:var(--paper) }.mini svg{ width:100%; height:auto; display:block }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="두 대상 위의 극한은 곱" height="100%" role="img" viewBox="0 0 200 150" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="lim-2-m-arrow" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-arrow" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="lim-2-m-fun" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-fun" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="lim-2-m-nat" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-nat" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="lim-2-m-univ" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-univ" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="lim-2-m-alarm" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-alarm" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="lim-2-m-ink" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-ink" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="lim-2-m-mute" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-mute" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><path class="ln ln-univ dash" d="M93.7,37.4 L56.8,103.8" marker-end="url(#lim-2-m-univ)" style="stroke-width:2px"></path><path class="ln ln-univ dash" d="M106.3,37.4 L143.2,103.8" marker-end="url(#lim-2-m-univ)" style="stroke-width:2px"></path><circle class="st" cx="50.0" cy="116.0" r="13"></circle><text class="t i" text-anchor="middle" x="50.0" y="121.0">A</text><circle class="st" cx="150.0" cy="116.0" r="13"></circle><text class="t i" text-anchor="middle" x="150.0" y="121.0">B</text><circle class="st st-univ" cx="100.0" cy="26.0" r="13"></circle><text class="t i" text-anchor="middle" x="100.0" y="31.0">L</text></svg></svg>
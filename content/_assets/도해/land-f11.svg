<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 270" width="720" height="270" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-xs{ font-size:10.5px }.fig .t-s{ font-size:11.5px }.fig .t-xl{ font-size:22px; font-variant-numeric:tabular-nums }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-none{ fill:none }.fig .f-sun{ fill:var(--sun) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-blood{ fill:var(--blood) }.fig .s-ink{ stroke:var(--ink) }.fig .s-rule{ stroke:var(--rule) }.fig .s-zero{ stroke:var(--zero) }.fig .w15{ stroke-width:1.5 }svg.pz-root{width:720px!important;height:270px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="영은 아무 값도 더하지 않지만 자릿값을 만든다. 같은 1 두 개가 사이에 낀 영에 따라 11, 101, 1001이 된다." class="pz-inner" height="100%" role="img" style="--minw:662px" viewBox="0 0 720 270" width="100%"><defs><marker id="zero-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="zero-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="zero-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="zero-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="zero-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="zero-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><text class="t-b f-mute" x="20" y="30">로마 숫자</text><text class="t-xl" x="20" y="76">MMXXVI</text><text class="t-xl" x="20" y="108">+ CCCXCIV</text><text class="t-s f-mute" x="20" y="142">자리가 없어 세로셈이 안 된다</text><text class="t-s f-mute" x="20" y="160">→ 계산은 주판으로, 결과만 숫자로</text><line class="s-rule" x1="310" x2="310" y1="20" y2="176"></line><text class="t-b" x="340" y="30">인도 · 아라비아 숫자</text><text class="t-s t-b f-sun" text-anchor="middle" x="492" y="56">1</text><text class="t-s t-b f-sun" text-anchor="middle" x="524" y="56">1</text><text class="t-xs f-sun" x="400" y="56">받아올림</text><text class="t-xl" text-anchor="middle" x="460" y="88">2</text><text class="t-xl f-zero t-b" text-anchor="middle" x="492" y="88">0</text><text class="t-xl" text-anchor="middle" x="524" y="88">2</text><text class="t-xl" text-anchor="middle" x="556" y="88">6</text><text class="t-xl" text-anchor="middle" x="430" y="120">+</text><text class="t-xl f-mute" text-anchor="middle" x="460" y="120">0</text><text class="t-xl" text-anchor="middle" x="492" y="120">3</text><text class="t-xl" text-anchor="middle" x="524" y="120">9</text><text class="t-xl" text-anchor="middle" x="556" y="120">4</text><line class="s-ink w15" x1="424" x2="574" y1="132" y2="132"></line><text class="t-xl t-b" text-anchor="middle" x="460" y="164">2</text><text class="t-xl t-b" text-anchor="middle" x="492" y="164">4</text><text class="t-xl t-b" text-anchor="middle" x="524" y="164">2</text><text class="t-xl t-b" text-anchor="middle" x="556" y="164">0</text><circle class="f-none s-zero w15" cx="492" cy="81" r="15"></circle><text class="t-s f-zero" text-anchor="end" x="446" y="80">이 0이 없으면</text><text class="t-s f-zero" text-anchor="end" x="446" y="96">226과 구별 불가</text><line class="s-rule" x1="20" x2="700" y1="190" y2="190"></line><text class="t-s t-b f-mute" x="20" y="214">같은 1 두 개, 사이에 낀 영</text><text class="t-xl" text-anchor="middle" x="300" y="236"><tspan class="">1</tspan><tspan class="">1</tspan></text><text class="t-s f-mute" text-anchor="middle" x="300" y="258">열하나</text><text class="t-xl" text-anchor="middle" x="440" y="236"><tspan class="">1</tspan><tspan class="f-zero t-b">0</tspan><tspan class="">1</tspan></text><text class="t-s f-mute" text-anchor="middle" x="440" y="258">백하나</text><text class="t-xl" text-anchor="middle" x="580" y="236"><tspan class="">1</tspan><tspan class="f-zero t-b">0</tspan><tspan class="f-zero t-b">0</tspan><tspan class="">1</tspan></text><text class="t-s f-mute" text-anchor="middle" x="580" y="258">천하나</text></svg></g></g></g></g></svg>
  background-color:var(--panel); border:1px solid var(--rule); padding:.6rem .4rem }.frame svg{ display:block; width:100%; height:auto }svg text{ font-family:var(--f-sans); fill:var(--ink); font-size:13px }svg .tx{ font-size:11.5px }svg .tn{ font-family:var(--f-mono); font-size:12px }svg .tb{ font-weight:700 }svg .tn.tb{ font-weight:600 }svg .t2{ fill:var(--ink2) }svg .tnum{ font-variant-numeric:tabular-nums }.f-verm{fill:var(--verm)}.f-none{fill:none}.s-verm{stroke:var(--verm)}.s-ink3{stroke:var(--ink3)}.s-hair{stroke:var(--hair)}svg line, svg path, svg polyline, svg rect, svg circle{ stroke-width:1 }.sw2{ stroke-width:2 !important }.lj{ stroke-linejoin:round; stroke-linecap:round }.ring{ stroke:var(--panel); stroke-width:2 !important }svg pattern line{ stroke-width:1.1 }svg.pz-root{width:480px!important;height:256px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="그린우드·슐라이퍼·유(2019): 미국 산업이 2년 동안 시장보다 50% 오르면 2년 안 폭락 확률 20%, 100%면 53%, 150%면 80%." class="pz-inner" height="100%" id="gs" role="img" style="" viewBox="0 0 480 256" width="100%" xml
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 330" width="640" height="330" class="pz-root"><style>:root{
  --bg:#E6E9EC; --bg2:#DCE0E4; --bg3:#F1F3F4;
  --fg:#15181D; --mute:#5B626B; --rule:#B6BDC4; --faint:#CDD2D7;
  --star:#33409C; --sun:#A2560F; --moon:#24695D; --gap:#C42A1B; --fix:#8C2C80;
  --f-display:"Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR",serif;
  --f-body:"Literata","Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR",Georgia,serif;
  --f-label:"IBM Plex Sans KR","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --f-mono:"Spline Sans Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F13; --bg2:#151920; --bg3:#1B2029;
  --fg:#E3E6EA; --mute:#9AA2AC; --rule:#343B45; --faint:#262C35;
  --star:#A3ACFF; --sun:#F0A24C; --moon:#6CC6B1; --gap:#FF6B5B; --fix:#E68BD8;
  color-scheme:dark }}:root[data-theme="dark"]{
  --bg:#0D0F13; --bg2:#151920; --bg3:#1B2029;
  --fg:#E3E6EA; --mute:#9AA2AC; --rule:#343B45; --faint:#262C35;
  --star:#A3ACFF; --sun:#F0A24C; --moon:#6CC6B1; --gap:#FF6B5B; --fix:#E68BD8;
  color-scheme:dark }:root{ --pad:max(16px, env(safe-area-inset-left, 0px)); --padR:max(16px, env(safe-area-inset-right, 0px));
  --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + 4rem); }@media (min-width:34em){:root{ --pad:max(1.6rem, env(safe-area-inset-left, 0px)); --padR:max(1.6rem, env(safe-area-inset-right, 0px)) }}@media (min-width:52em){:root{ --pad:max(2rem, env(safe-area-inset-left, 0px)); --padR:max(2rem, env(safe-area-inset-right, 0px)) }}.plate svg{display:block;width:100%;height:auto}.plate .lstar circle.core{stroke:none}.plate .lstar text{font-family:var(--f-mono);font-size:12px;font-weight:500}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.3rem;padding:0 var(--padR) 0 var(--pad);margin:3rem 0 0}.lecture{display:contents}.lhead,.fig{scroll-margin-top:1rem}figure.fig{margin:.6rem 0 !important;padding:0}.fig .frame{border:1px solid var(--rule);background:var(--bg3);padding:1rem;overflow-x:auto;
  background-image:linear-gradient(to right,var(--bg3) 30%,transparent),linear-gradient(to left,var(--bg3) 30%,transparent),
  linear-gradient(to right,rgba(0,0,0,.12),transparent),linear-gradient(to left,rgba(0,0,0,.12),transparent);
  background-position:left center,right center,left center,right center;background-repeat:no-repeat;
  background-size:2rem 100%,2rem 100%,.8rem 100%,.8rem 100%;background-attachment:local,local,scroll,scroll}.fig .frame.wide svg{min-width:34rem}.fig svg{display:block;width:100%;height:auto;overflow:visible}.s-ink{stroke:var(--fg)}.s-mute{stroke:var(--mute)}.s-star{stroke:var(--star)}.s-moon{stroke:var(--moon)}.s-gap{stroke:var(--gap)}.fig svg .w-thin{stroke-width:.8}.fig svg .w-bold{stroke-width:2.4}.fig svg .dash{stroke-dasharray:5 4}.fig svg .dot{stroke-dasharray:1.5 3.5}.f-ink{fill:var(--fg)}.f-bg2{fill:var(--bg2)}.f-star-soft{fill:var(--star);fill-opacity:.14}.f-moon-soft{fill:var(--moon);fill-opacity:.14}.fig svg text{fill:var(--fg);font-family:var(--f-label);font-size:13px;stroke:none}.fig svg .t-small{font-size:11px;fill:var(--mute)}.fig svg .c-gap{fill:var(--gap)}.fig svg .a-mid{text-anchor:middle}.fig svg .a-end{text-anchor:end}svg.pz-root{width:640px!important;height:330px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="초자아-시차에서 바틀비-시차로: 무언가와 무언가 사이의 간극(공적 법과 외설적 보충)이 무언가와 무 사이의 최소 차이로 줄어들고, 그 꼴이 존재자와 존재 사이의 존재론적 차이와 겹친다" class="pz-inner" height="100%" role="img" viewBox="0 0 640 330" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah-1602" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0 0L10 5L0 10Z"></path></marker></defs>
<text class="t-lab a-mid" x="150" y="26">초자아-시차</text>
<text class="t-small a-mid" x="150" y="44">무언가와 무언가 사이</text>
<rect class="s-moon f-moon-soft" height="40" width="220" x="40" y="70"></rect>
<text class="t-lab a-mid" x="150" y="95">공적 법 — 명시된 선율</text>
<rect class="s-moon dash" height="40" width="220" x="40" y="150"></rect>
<text class="t-lab a-mid" x="150" y="175">외설적 보충 — 숨은 선율</text>
<line class="s-mute" marker-end="url(#ah-1602)" marker-start="url(#ah-1602)" x1="150" x2="150" y1="114" y2="146"></line>
<text class="t-small" x="160" y="134">겹치지 않으나 서로 기댄다</text>
<text class="t-small a-mid" x="150" y="218">저항도 이 짝 안에서 돈다(14강)</text>
<line class="s-ink w-bold" marker-end="url(#ah-1602)" x1="290" x2="346" y1="130" y2="130"></line>
<text class="t-small a-mid" x="318" y="118">15강</text>
<text class="t-lab a-mid" x="490" y="26">바틀비-시차</text>
<text class="t-small a-mid" x="490" y="44">무언가와 무 사이</text>
<rect class="s-ink w-bold f-bg2" height="80" width="104" x="380" y="90"></rect>
<text class="t-lab a-mid" x="432" y="135">체제</text>
<rect class="s-ink dash" height="80" width="104" x="496" y="90"></rect>
<text class="t-lab a-mid" x="548" y="126">무</text>
<text class="t-small a-mid" x="548" y="146">안 하는 편을 택함</text>
<line class="s-gap w-bold" x1="490" x2="490" y1="80" y2="180"></line>
<text class="t-small a-mid c-gap" x="490" y="200">최소 차이 — 맞설 내용이 없다</text>
<line class="s-mute w-thin dot" x1="16" x2="624" y1="236" y2="236"></line>
<rect class="s-star f-star-soft" height="44" width="104" x="380" y="256"></rect>
<text class="t-lab a-mid" x="432" y="283">존재자</text>
<rect class="s-star dash" height="44" width="104" x="496" y="256"></rect>
<text class="t-lab a-mid" x="548" y="283">존재</text>
<line class="s-star" x1="490" x2="490" y1="250" y2="306"></line>
<text class="t-small a-end" x="360" y="283">같은 꼴 — 1부의 존재론적 차이</text>
<text class="t-small" x="16" y="322">위: 6장의 결론. 아래: 지젝이 책의 마지막 대목에서 같은 꼴이라 선언하는 것</text>
</svg></g></g></g></g></svg>
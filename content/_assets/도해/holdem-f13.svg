<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 620 210" width="620" height="210" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#F1F2EC; --paper:#FAFAF6; --soft:#E3E6DE; --tie:#B9BEB5; --stack:#C9CDC4; --grid:#DCE0D6; --rule:#CDD3CA;
  --ink:#1B2420; --ink-2:#44504A; --muted:#6E7871; --on:#FFFFFF;
  --pot:#23825A; --risk:#C0392B; --eq:#A0700F; --un:#2F5DA8; --warn:#8A4FB8;
  --eq-bg:#F3E7CC; --risk-bg:#F6DEDA;
  --f-body:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-disp:"Song Myung","Nanum Myeongjo","Noto Serif KR",serif;
  --f-num:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --f-dg:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --f-math:"Noto Sans Math","STIX Two Math","Cambria Math",math;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}}:root[data-theme="dark"]{
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:2.2rem 4rem}.lecture{display:contents}.fig{margin:.6rem 0 !important;display:grid;gap:.55rem}.fig .frame{overflow-x:auto;background:
  linear-gradient(90deg,var(--paper) 30%,transparent),linear-gradient(270deg,var(--paper) 30%,transparent),
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent),
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent) 100% 0;
  background-color:var(--paper);background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll;
  border:1px solid var(--rule);border-radius:3px;padding:.7rem}.dg{display:block;width:100%;height:auto;font-family:var(--f-dg)}.dg text{fill:var(--ink);font-size:12px}.dg text.mu{fill:var(--muted)}.dg text.b{font-weight:700}.dg .on{fill:var(--on)}.dg text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}.dg text.card{font-family:var(--f-num)}.dg .f-eq{fill:var(--eq)}.dg .f-un{fill:var(--un)}.dg .f-soft{fill:var(--soft)}.dg .s-ink{stroke:var(--ink);stroke-width:1.2}.dg .s-warn{stroke:var(--warn);stroke-width:1.6}.dg circle:hover,.dg rect[class]:hover{filter:brightness(1.08)}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="모턴의 정리 예: 팟이 7.5빅벳보다 작으면 찰스는 접는 게 옳고, 5.25보다 크면 아널드는 찰스가 접기를 바란다. 5.25와 7.5 사이에서는 상대의 옳은 폴드가 아널드에게도 이득이다." class="dg" height="100%" role="img" style="" viewBox="0 0 620 210" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern height="6" id="hh-mor" patternTransform="rotate(45)" patternUnits="userSpaceOnUse" width="6"><line class="s-warn" style="stroke-width:2" x1="0" x2="0" y1="0" y2="6"></line></pattern></defs><rect class="f-hatch" fill="url(#hh-mor)" height="124.0" rx="0" width="243.0" x="175.0" y="26.0"></rect><text class="b" style="font-size:12px" text-anchor="middle" x="296.5" y="20.0">둘 다 찰스의 폴드를 원하는 구간</text><text class="mu" style="font-size:12px" text-anchor="start" x="40.0" y="44.0">찰스에게 옳은 선택</text><rect class="f-soft" height="24.0" rx="0" width="377.0" x="40.0" y="50.0"></rect><text style="font-size:12.5px" text-anchor="middle" x="229.0" y="66.0">폴드</text><rect class="f-un" height="24.0" rx="0" width="161.0" x="419.0" y="50.0"></rect><text class="on" style="font-size:12.5px;font-weight:700" text-anchor="middle" x="499.0" y="66.0">콜</text><text class="mu" style="font-size:12px" text-anchor="start" x="40.0" y="106.0">아널드가 바라는 것</text><rect class="f-soft" height="24.0" rx="0" width="134.0" x="40.0" y="112.0"></rect><text style="font-size:12px" text-anchor="middle" x="107.5" y="128.0">찰스 콜</text><rect class="f-eq" height="24.0" rx="0" width="404.0" x="176.0" y="112.0"></rect><text class="on" style="font-size:12.5px;font-weight:700" text-anchor="middle" x="377.5" y="128.0">찰스 폴드</text><line class="s-ink" x1="40.0" x2="580.0" y1="166.0" y2="166.0"></line><line class="s-ink" x1="40.0" x2="40.0" y1="162.0" y2="170.0"></line><text class="num mu" style="font-size:11.5px" text-anchor="middle" x="40.0" y="186.0">4</text><line class="s-ink" x1="148.0" x2="148.0" y1="162.0" y2="170.0"></line><text class="num mu" style="font-size:11.5px" text-anchor="middle" x="148.0" y="186.0">5</text><line class="s-ink" x1="175.0" x2="175.0" y1="162.0" y2="170.0"></line><text class="num b" style="font-size:11.5px" text-anchor="middle" x="175.0" y="186.0">5.25</text><line class="s-ink" x1="256.0" x2="256.0" y1="162.0" y2="170.0"></line><text class="num mu" style="font-size:11.5px" text-anchor="middle" x="256.0" y="186.0">6</text><line class="s-ink" x1="364.0" x2="364.0" y1="162.0" y2="170.0"></line><text class="num mu" style="font-size:11.5px" text-anchor="middle" x="364.0" y="186.0">7</text><line class="s-ink" x1="418.0" x2="418.0" y1="162.0" y2="170.0"></line><text class="num b" style="font-size:11.5px" text-anchor="middle" x="418.0" y="186.0">7.5</text><line class="s-ink" x1="472.0" x2="472.0" y1="162.0" y2="170.0"></line><text class="num mu" style="font-size:11.5px" text-anchor="middle" x="472.0" y="186.0">8</text><line class="s-ink" x1="580.0" x2="580.0" y1="162.0" y2="170.0"></line><text class="num mu" style="font-size:11.5px" text-anchor="middle" x="580.0" y="186.0">9</text><text class="mu" style="font-size:12px" text-anchor="middle" x="310.0" y="204.0">턴의 팟 P (빅벳)</text></svg></svg>
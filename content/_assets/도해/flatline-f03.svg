<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 222" width="700" height="222" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#E8ECE6; --panel:#F2F5F0; --grid:#D3DBD0; --grid-2:#BDC9B9;
  --ink:#1B2024; --ink-2:#4A545B; --ink-3:#6B767C;
  --copy:#3A4C98; --prop:#0B7367; --code:#8E6208; --alarm:#A63B28;
  --copy-soft:rgba(58,76,152,.14); --prop-soft:rgba(11,115,103,.14);
  --code-soft:rgba(142,98,8,.14); --alarm-soft:rgba(166,59,40,.13);
  --shade:rgba(27,32,36,.07);
  --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2);
  --f-disp:"Orbit","Do Hyeon","Nanum Gothic",sans-serif;
  --f-body:"Source Serif 4","Nanum Myeongjo","Noto Serif CJK KR","Noto Serif KR",serif;
  --f-mono:"Martian Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
  --f-lab:"Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111514; --panel:#171C1B; --grid:#1F2725; --grid-2:#2B3532;
    --ink:#E1E6E0; --ink-2:#AAB4AE; --ink-3:#86918B;
    --copy:#93A5F2; --prop:#43BCA9; --code:#D9A43E; --alarm:#E4795F;
    --copy-soft:rgba(147,165,242,.16); --prop-soft:rgba(67,188,169,.16);
    --code-soft:rgba(217,164,62,.15); --alarm-soft:rgba(228,121,95,.15);
    --shade:rgba(225,230,224,.07);
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111514; --panel:#171C1B; --grid:#1F2725; --grid-2:#2B3532;
  --ink:#E1E6E0; --ink-2:#AAB4AE; --ink-3:#86918B;
  --copy:#93A5F2; --prop:#43BCA9; --code:#D9A43E; --alarm:#E4795F;
  --copy-soft:rgba(147,165,242,.16); --prop-soft:rgba(67,188,169,.16);
  --code-soft:rgba(217,164,62,.15); --alarm-soft:rgba(228,121,95,.15);
  --shade:rgba(225,230,224,.07);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero svg{ display:block; width:100%; height:auto }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:1rem 3rem }.lecture{ display:contents }figure.fig{ margin:.6rem 0 !important }.fig-frame{ overflow-x:auto; border:1px solid var(--grid-2); background-color:var(--panel);
  background-image:
    linear-gradient(90deg,var(--panel) 30%,rgba(0,0,0,0)),
    linear-gradient(90deg,rgba(0,0,0,0),var(--panel) 70%) 100% 0,
    radial-gradient(farthest-side at 0 50%,var(--shade),rgba(0,0,0,0)),
    radial-gradient(farthest-side at 100% 50%,var(--shade),rgba(0,0,0,0)) 100% 0,
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,repeat,repeat;
  background-size:40px 100%,40px 100%,14px 100%,14px 100%,12px 12px,12px 12px;
  background-attachment:local,local,scroll,scroll,local,local; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; color:var(--ink) }.fig-frame text, .hero text{ font-family:var(--f-lab); fill:var(--ink); font-size:12px }text.s{ font-size:11px }text.xs{ font-size:10px }text.l{ font-size:14px }text.xl{ font-size:18px }text.b{ font-weight:700 }text.mut{ fill:var(--ink-2) }text.halo{ paint-order:stroke fill; stroke:var(--panel) !important; stroke-width:6px; stroke-linejoin:round }text.he{ font-family:"Noto Serif Hebrew","Noto Sans Hebrew","Times New Roman",serif; font-size:30px }.t-copy{ fill:var(--copy) !important }.t-alarm{ fill:var(--alarm) !important }.s-ink{ stroke:var(--ink); fill:none }.s-copy{ stroke:var(--copy); fill:none }.s-code{ stroke:var(--code); fill:none }.f-copy-s{ fill:var(--copy-soft) }.f-code-s{ fill:var(--code-soft) }.f-alarm-s{ fill:var(--alarm-soft) }.m-ink{ fill:var(--ink) }.m-copy{ fill:var(--copy) }.m-prop{ fill:var(--prop) }.m-code{ fill:var(--code) }.m-alarm{ fill:var(--alarm) }.m-mut{ fill:var(--ink-3) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="보드리야르의 세 질서와 위너의 세 시대를 한 시간축에 놓은 도식. 첫 질서가 위너의 시계 시대보다 150년쯤 먼저 시작하고, 둘째 쌍은 강조가 다르다." height="100%" role="img" viewBox="0 0 700 222" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f03-a-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-ink" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f03-a-copy" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-copy" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f03-a-prop" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-prop" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f03-a-code" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-code" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f03-a-alarm" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-alarm" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f03-a-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-mut" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><rect class="f-alarm-s" height="118.0" rx="0" width="150.0" x="130.0" y="58.0"></rect><rect class="f-copy-s s-copy w15" height="28.0" rx="0" width="330.0" x="130.0" y="66.0"></rect><text class="s" text-anchor="middle" x="295.0" y="85.0">1차 · 위조</text><rect class="f-copy-s s-copy w15" height="28.0" rx="0" width="150.0" x="460.0" y="66.0"></rect><text class="s" text-anchor="middle" x="535.0" y="85.0">2차 · 생산</text><rect class="f-copy-s s-copy w15" height="28.0" rx="0" width="50.0" x="630.0" y="66.0"></rect><text class="s" text-anchor="middle" x="655.0" y="85.0">3차</text><rect class="f-code-s s-code w15" height="28.0" rx="0" width="140.0" x="280.0" y="136.0"></rect><text class="s" text-anchor="middle" x="350.0" y="155.0">시계</text><rect class="f-code-s s-code w15" height="28.0" rx="0" width="160.0" x="420.0" y="136.0"></rect><text class="s" text-anchor="middle" x="500.0" y="155.0">증기기관</text><rect class="f-code-s s-code w15" height="28.0" rx="0" width="60.0" x="620.0" y="136.0"></rect><text class="s" text-anchor="middle" x="650.0" y="155.0">통신·제어</text><text class="s b" text-anchor="end" x="72.0" y="85.0">보드리야르</text><text class="s b" text-anchor="end" x="72.0" y="155.0">위너</text><line class="s-ink w1" x1="80.0" x2="680.0" y1="188.0" y2="188.0"></line><line class="s-ink w1" x1="80.0" x2="80.0" y1="188.0" y2="194.0"></line><text class="xs" text-anchor="middle" x="80.0" y="208.0">1400</text><line class="s-ink w1" x1="180.0" x2="180.0" y1="188.0" y2="194.0"></line><text class="xs" text-anchor="middle" x="180.0" y="208.0">1500</text><line class="s-ink w1" x1="280.0" x2="280.0" y1="188.0" y2="194.0"></line><text class="xs" text-anchor="middle" x="280.0" y="208.0">1600</text><line class="s-ink w1" x1="380.0" x2="380.0" y1="188.0" y2="194.0"></line><text class="xs" text-anchor="middle" x="380.0" y="208.0">1700</text><line class="s-ink w1" x1="480.0" x2="480.0" y1="188.0" y2="194.0"></line><text class="xs" text-anchor="middle" x="480.0" y="208.0">1800</text><line class="s-ink w1" x1="580.0" x2="580.0" y1="188.0" y2="194.0"></line><text class="xs" text-anchor="middle" x="580.0" y="208.0">1900</text><line class="s-ink w1" x1="680.0" x2="680.0" y1="188.0" y2="194.0"></line><text class="xs" text-anchor="middle" x="680.0" y="208.0">2000</text><text class="xs t-alarm" text-anchor="middle" x="205.0" y="50.0">위너의 시대에 없는 150년</text><text class="xs t-copy" text-anchor="middle" x="655.0" y="59.0">시뮬레이션</text><text class="xs t-alarm" text-anchor="middle" x="520.0" y="124.0">강조가 다름: 계열 생산 ↔ 열역학</text></svg></svg>
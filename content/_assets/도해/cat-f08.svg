<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 660 274" width="660" height="274" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEF0EF; --plate:#F8F9F8; --ink:#1B2226; --mute:#5A6569; --rule:#C2C9C9; --grid:#DAE0DF;
  --brass:#8C6210; --steel:#34509F; --verd:#0F8C7E; --verm:#B23A26;
  --brass-soft:rgba(140,98,16,.15); --steel-soft:rgba(52,80,159,.12); --verd-soft:rgba(15,140,126,.22); --verm-soft:rgba(178,58,38,.16);
  --shadow:rgba(27,34,38,.18);
  --f-display:"Orbit","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-label:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"Azeret Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13181B; --plate:#1A2125; --ink:#E2E7E5; --mute:#98A3A6; --rule:#3A4549; --grid:#263034;
  --brass:#BB8B2C; --steel:#7C8CE0; --verd:#2FA597; --verm:#E06A55;
  --brass-soft:rgba(187,139,44,.2); --steel-soft:rgba(124,140,224,.16); --verd-soft:rgba(47,165,151,.26); --verm-soft:rgba(224,106,85,.2);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#13181B; --plate:#1A2125; --ink:#E2E7E5; --mute:#98A3A6; --rule:#3A4549; --grid:#263034;
  --brass:#BB8B2C; --steel:#7C8CE0; --verd:#2FA597; --verm:#E06A55;
  --brass-soft:rgba(187,139,44,.2); --steel-soft:rgba(124,140,224,.16); --verd-soft:rgba(47,165,151,.26); --verm-soft:rgba(224,106,85,.2);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.mast .fig{ margin-top:.6rem }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:.5rem 3rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin:0 }.frame{ overflow-x:auto; overflow-y:hidden; padding-block:.4rem; border-block:1px solid var(--rule);
  background-color:var(--paper);
  background-image:linear-gradient(to right,var(--paper) 30%,transparent),linear-gradient(to left,var(--paper) 30%,transparent),
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent),radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent);
  background-position:left center,right center,left center,right center;
  background-size:40px 100%,40px 100%,14px 100%,14px 100%;
  background-repeat:no-repeat; background-attachment:local,local,scroll,scroll; }.frame svg{ display:block; width:100%; min-width:var(--svgmin,520px); height:auto }.dg{ font-family:var(--f-label); font-size:13px }.dg text{ fill:var(--ink) }.dg .t-s{ font-size:12px }.dg .t-b{ font-weight:700 }.dg .t-mute{ fill:var(--mute) }.dg .t-verd{ fill:var(--verd) }.dg .s-grid{ stroke:var(--grid) }.dg .s-brass{ stroke:var(--brass) }.dg .s-steel{ stroke:var(--steel) }.dg .f-none{ fill:none }.dg .f-brass-soft{ fill:var(--brass-soft) }.card-big.t-verd{ color:var(--verd) }.hero-dg .t-s{ font-size:13.5px }svg.pz-root{width:660px!important;height:274px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="세 패널의 타원. 그대로와 백색화는 정렬 0.5, 반씩 나누면 두 타원이 같은 모양으로 겹치고 정렬 0.625." class="dg pz-inner" height="100%" role="img" viewBox="0 0 660 274" width="100%">
<text class="t-b" text-anchor="middle" x="110" y="24">그대로</text><line class="s-grid" stroke-width="1" x1="18" x2="202" y1="130" y2="130"></line><line class="s-grid" stroke-width="1" x1="110" x2="110" y1="44" y2="216"></line><ellipse class="f-brass-soft s-brass" cx="110" cy="130" rx="77.8" ry="25.9" stroke-width="2" transform="rotate(-45 110 130)"></ellipse><ellipse class="f-none s-steel" cx="110" cy="130" rx="58.0" ry="58.0" stroke-dasharray="none" stroke-width="2" transform="rotate(-45 110 130)"></ellipse><text class="t-mute t-s" text-anchor="middle" x="110" y="238">가중치가 둥글면 1/d</text><text class="t-b" text-anchor="middle" x="110" y="262">A = 0.500</text><text class="t-b" text-anchor="middle" x="330" y="24">백색화 (맞바꾸기)</text><line class="s-grid" stroke-width="1" x1="238" x2="422" y1="130" y2="130"></line><line class="s-grid" stroke-width="1" x1="330" x2="330" y1="44" y2="216"></line><ellipse class="f-brass-soft s-brass" cx="330" cy="130" rx="58.0" ry="58.0" stroke-width="2" transform="rotate(-45 330 130)"></ellipse><ellipse class="f-none s-steel" cx="330" cy="130" rx="77.8" ry="25.9" stroke-dasharray="none" stroke-width="2" transform="rotate(-45 330 130)"></ellipse><text class="t-mute t-s" text-anchor="middle" x="330" y="238">비대칭이 가중치로 넘어감</text><text class="t-b" text-anchor="middle" x="330" y="262">A = 0.500</text><text class="t-b t-verd" text-anchor="middle" x="550" y="24">반씩: Σx^(−1/4)</text><line class="s-grid" stroke-width="1" x1="458" x2="642" y1="130" y2="130"></line><line class="s-grid" stroke-width="1" x1="550" x2="550" y1="44" y2="216"></line><ellipse class="f-brass-soft s-brass" cx="550" cy="130" rx="67.2" ry="38.8" stroke-width="2" transform="rotate(-45 550 130)"></ellipse><ellipse class="f-none s-steel" cx="550" cy="130" rx="67.2" ry="38.8" stroke-dasharray="6 4" stroke-width="2" transform="rotate(-45 550 130)"></ellipse><text class="t-mute t-s" text-anchor="middle" x="550" y="238">두 장부가 같은 모양</text><text class="t-b t-verd" text-anchor="middle" x="550" y="262">A = 0.625</text>
</svg></g></g></g></g></svg>
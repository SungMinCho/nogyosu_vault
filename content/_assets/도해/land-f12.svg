<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 740 300" width="740" height="300" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-xs{ font-size:10.5px }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-ledgersoft{ fill:var(--ledger-soft) }.fig .f-blood{ fill:var(--blood) }.fig .s-mute{ stroke:var(--ink-2) }.fig .s-zero{ stroke:var(--zero) }.fig .s-ledger{ stroke:var(--ledger) }.fig .w1{ stroke-width:1 }.fig .w15{ stroke-width:1.5 }.fig .w2{ stroke-width:2 }.fig .w25{ stroke-width:2.5 }.fig .dash{ stroke-dasharray:5 4 }svg.pz-root{width:740px!important;height:300px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="문명은 파열하는 물질적 시간을 둑으로 막아 잴 수 있는 노동의 시간으로 동기화한다. 죽음은 그 시간표를 찢고 들어오는 비동시성이다." class="pz-inner" height="100%" role="img" style="--minw:681px" viewBox="0 0 740 300" width="100%"><defs><marker id="aeon-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="aeon-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="aeon-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="aeon-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="aeon-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="aeon-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><rect class="f-ledgersoft s-ledger" height="40" rx="6" width="440" x="150" y="22"></rect><rect class="f-ledgersoft s-ledger" height="48" rx="4" width="14" x="140" y="18"></rect><rect class="f-ledgersoft s-ledger" height="48" rx="4" width="14" x="586" y="18"></rect><text class="t-s t-b" text-anchor="middle" x="370" y="47">아이온 — 사건의 최종 장부, 깨끗한 두루마리</text><text class="t-s f-mute" text-anchor="middle" x="370" y="82">신 = 우주의 장부 담당자</text><line class="s-ledger dash w15" marker-end="url(#aeon-ledger)" x1="295" x2="295" y1="66" y2="126"></line><text class="t-b f-zero" x="20" y="122">물질적 시간</text><text class="t-s f-mute" x="20" y="140">파열 · 무자비한 재창조</text><polyline class="s-zero w2" points="20.0,196.0 40.0,196.0 48.0,172.0 56.0,214.0 66.0,190.0 88.0,196.0 98.0,160.0 108.0,226.0 118.0,196.0 150.0,196.0 160.0,178.0 168.0,210.0 178.0,196.0 206.0,196.0 214.0,150.0 224.0,232.0 234.0,196.0 254.0,196.0"></polyline><text class="t-xs f-zero" text-anchor="middle" x="98" y="248">사고</text><text class="t-xs f-zero" text-anchor="middle" x="160" y="248">사랑</text><text class="t-xs f-zero" text-anchor="middle" x="214" y="248">발작</text><line class="s-mute" marker-end="url(#aeon-mute)" x1="256" x2="276" y1="196" y2="196"></line><rect class="f-ledgersoft s-ledger w2" height="120" rx="3" width="30" x="280" y="136"></rect><text class="t-s t-b f-ledger" text-anchor="middle" x="295" y="276">동기화 = 둑</text><text class="t-xs f-mute" text-anchor="middle" x="295" y="293">시간의 석화</text><line class="s-mute" marker-end="url(#aeon-mute)" x1="312" x2="332" y1="196" y2="196"></line><text class="t-b f-ledger" x="340" y="122">크로노스 — 잴 수 있는 시간</text><text class="t-s f-mute" x="340" y="140">노동의 시간: 표준시 · 교대 · 시급</text><line class="s-ledger w2" x1="336" x2="720" y1="196" y2="196"></line><line class="s-ledger w1" x1="346" x2="346" y1="186" y2="206"></line><line class="s-ledger w1" x1="372" x2="372" y1="186" y2="206"></line><line class="s-ledger w1" x1="398" x2="398" y1="186" y2="206"></line><line class="s-ledger w1" x1="424" x2="424" y1="186" y2="206"></line><line class="s-ledger w1" x1="450" x2="450" y1="186" y2="206"></line><line class="s-ledger w1" x1="476" x2="476" y1="186" y2="206"></line><line class="s-ledger w1" x1="502" x2="502" y1="186" y2="206"></line><line class="s-ledger w1" x1="528" x2="528" y1="186" y2="206"></line><line class="s-ledger w1" x1="554" x2="554" y1="186" y2="206"></line><line class="s-ledger w1" x1="580" x2="580" y1="186" y2="206"></line><line class="s-ledger w1" x1="606" x2="606" y1="186" y2="206"></line><line class="s-ledger w1" x1="632" x2="632" y1="186" y2="206"></line><line class="s-ledger w1" x1="658" x2="658" y1="186" y2="206"></line><line class="s-ledger w1" x1="684" x2="684" y1="186" y2="206"></line><line class="s-ledger w1" x1="710" x2="710" y1="186" y2="206"></line><polyline class="s-zero w25" points="552.0,236.0 562.0,176.0 570.0,214.0 580.0,152.0 590.0,230.0"></polyline><text class="t-s t-b f-zero" x="600" y="240">죽음 — 비동시성</text><text class="t-xs f-mute" x="600" y="258">어떤 시간표에도</text><text class="t-xs f-mute" x="600" y="273">맞춰 오지 않는다</text></svg></g></g></g></g></svg>
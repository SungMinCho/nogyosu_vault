<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 412" width="640" height="412" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --flour:#EFF0EB; --flour-2:#E6E8E1; --ink:#1C2025; --ink-soft:#4E555D; --rule:#C7CAC1;
  --iron:#3D4652; --water:#1B7480; --spirit:#6448B0; --grain:#A8721A; --rust:#BF4128;
  --water-t:rgba(27,116,128,.12); --spirit-t:rgba(100,72,176,.11); --grain-t:rgba(168,114,26,.13); --rust-t:rgba(191,65,40,.10); --iron-t:rgba(61,70,82,.10);
  --shadow:rgba(28,32,37,.18);
  --display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --body:"Newsreader","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --label:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","Nanum Gothic Coding",ui-monospace,Menlo,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }}:root[data-theme="dark"]{
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents }.lec-no svg{ width:2.2rem; height:2.2rem; flex:none }.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; overflow-y:hidden; border-block:1px solid var(--rule); padding-block:.8rem; background:linear-gradient(to right, var(--flour) 30%, transparent), linear-gradient(to left, var(--flour) 30%, transparent) 100% 0, radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) 100% 0; background-repeat:no-repeat; background-size:2.2rem 100%, 2.2rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; margin-inline:auto; max-width:46rem }.t{ fill:var(--ink); font-family:var(--label); font-size:13px }.t-soft{ fill:var(--ink-soft) }.t-iron{ fill:var(--iron) }.t-water{ fill:var(--water) }.t-spirit{ fill:var(--spirit) }.t-grain{ fill:var(--grain) }.t-rust{ fill:var(--rust) }.t-b{ font-weight:600 }.t-sm{ font-size:11.5px }.t-mono{ font-family:var(--mono) }.halo{ paint-order:stroke; stroke:var(--flour); stroke-width:4px; stroke-linejoin:round }.s-ink{ stroke:var(--ink); fill:none }.s-water{ stroke:var(--water); fill:none }.s-spirit{ stroke:var(--spirit); fill:none }.s-grain{ stroke:var(--grain); fill:none }.s-rust{ stroke:var(--rust); fill:none }.f-bg{ fill:var(--flour) }.f-panel{ fill:var(--flour-2) }.f-ink{ fill:var(--ink) }.f-water{ fill:var(--water) }.f-spirit{ fill:var(--spirit) }.f-grain{ fill:var(--grain) }.f-rust{ fill:var(--rust) }.f-iron-t{ fill:var(--iron-t) }.f-spirit-t{ fill:var(--spirit-t) }.f-rust-t{ fill:var(--rust-t) }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.dash{ stroke-dasharray:5 4 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="하이퍼셉트의 순환: 상향 단서가 가설들을 켜고, 가설이 하향으로 부품을 검증하며, 하나 남으면 인식, 여럿이면 더 탐색, 모두 반박되면 새 도식을 짓는 학습으로 간다." data-min="560" height="100%" role="img" style="" viewBox="0 0 640 412" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="f09-w" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-water" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f09-s" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spirit" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f09-k" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f09-r" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rust" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f09-g" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-grain" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 층 표시 -->
<rect class="f-spirit-t" height="108" rx="4" width="342" x="16" y="14"></rect>
<text class="t t-sm t-spirit t-b" x="28" y="34">모델 · 가설</text>
<rect class="f-iron-t" height="110" rx="4" width="342" x="16" y="252"></rect>
<text class="t t-sm t-iron t-b" x="28" y="350">감각기 · 환경</text>
<!-- ② 가설 활성 (위 왼쪽) -->
<rect class="f-bg s-spirit w15" height="56" rx="6" width="124" x="44" y="50"></rect>
<text class="t t-spirit t-b" text-anchor="middle" x="106" y="73">가설들이 켜짐</text>
<text class="t t-sm" text-anchor="middle" x="106" y="93">얼굴? 콘센트?</text>
<!-- ③ 하향 검증 (위 오른쪽) -->
<rect class="f-bg s-spirit w15" height="56" rx="6" width="124" x="214" y="50"></rect>
<text class="t t-spirit t-b" text-anchor="middle" x="276" y="73">하향 검증</text>
<text class="t t-sm" text-anchor="middle" x="276" y="93">부품 하나씩 묻기</text>
<!-- ① 상향 단서 (아래 왼쪽) -->
<rect class="f-bg s-water w15" height="56" rx="6" width="124" x="44" y="270"></rect>
<text class="t t-water t-b" text-anchor="middle" x="106" y="293">상향 단서</text>
<text class="t t-sm" text-anchor="middle" x="106" y="313">짙은 조각 셋</text>
<!-- ④ 감각의 대답 (아래 오른쪽) -->
<rect class="f-bg s-water w15" height="56" rx="6" width="124" x="214" y="270"></rect>
<text class="t t-water t-b" text-anchor="middle" x="276" y="293">확인 / 반박</text>
<text class="t t-sm" text-anchor="middle" x="276" y="313">감각기가 대답</text>
<!-- 순환 화살표 -->
<line class="s-water w2" marker-end="url(#f09-w)" x1="106" x2="106" y1="268" y2="110"></line>
<text class="t t-sm t-water halo" x="114" y="184">아래→위</text>
<text class="t t-sm t-water halo" x="114" y="200">켠다</text>
<line class="s-spirit w2" marker-end="url(#f09-s)" x1="170" x2="210" y1="78" y2="78"></line>
<line class="s-spirit w2" marker-end="url(#f09-s)" x1="276" x2="276" y1="108" y2="266"></line>
<text class="t t-sm t-spirit halo" text-anchor="end" x="268" y="184">위→아래</text>
<text class="t t-sm t-spirit halo" text-anchor="end" x="268" y="200">묻는다</text>
<!-- 판정 마름모 -->
<path class="s-ink w2" d="M340 298 L378 298" marker-end="url(#f09-k)"></path>
<path class="f-panel s-ink w15" d="M424 254 L470 298 L424 342 L378 298 Z"></path>
<text class="t t-sm t-b" text-anchor="middle" x="424" y="294">남은 가설</text>
<text class="t t-sm t-b" text-anchor="middle" x="424" y="311">몇 개?</text>
<!-- 결과 셋 -->
<!-- 하나 → 인식 -->
<path class="s-ink w15" d="M470 298 L504 298" marker-end="url(#f09-k)"></path>
<text class="t t-sm t-mono" text-anchor="middle" x="486" y="290">1</text>
<rect class="f-spirit-t s-spirit w15" height="52" rx="6" width="98" x="508" y="272"></rect>
<text class="t t-spirit t-b" text-anchor="middle" x="557" y="294">인식</text>
<text class="t t-sm" text-anchor="middle" x="557" y="313">동화</text>
<!-- 여럿 → 더 탐색, 다시 하향 검증으로 -->
<path class="s-ink w15" d="M424 254 L424 78 L342 78" marker-end="url(#f09-k)"></path>
<text class="t t-sm t-mono" x="432" y="236">여럿</text>
<text class="t t-sm" x="432" y="140">더 탐색</text>
<text class="t t-sm t-soft" x="432" y="156">다음 부품</text>
<!-- 없음 → 학습 -->
<path class="s-rust w15" d="M424 342 L424 376 L504 376" marker-end="url(#f09-r)"></path>
<text class="t t-sm t-mono t-rust" x="432" y="366">0</text>
<text class="t t-sm t-rust" x="432" y="396">모두 반박</text>
<rect class="f-rust-t s-rust w15" height="52" rx="6" width="98" x="508" y="350"></rect>
<text class="t t-rust t-b" text-anchor="middle" x="557" y="372">학습</text>
<text class="t t-sm" text-anchor="middle" x="557" y="391">새 도식 · 조절</text>
<!-- 새 도식이 가설 목록으로 돌아감 -->
<path class="s-rust w15 dash" d="M606 376 L626 376 L626 8 L106 8 L106 44" marker-end="url(#f09-r)"></path>
<text class="t t-sm t-rust halo" text-anchor="end" x="618" y="24">새 도식 = 다음번의 가설</text>
<!-- 미리 데우기 -->
<text class="t t-sm t-grain" x="20" y="152">맥락·동기가</text>
<text class="t t-sm t-grain" x="20" y="168">미리 데움</text>
<line class="s-grain w15" marker-end="url(#f09-g)" x1="50" x2="58" y1="138" y2="112"></line>
</svg></svg>
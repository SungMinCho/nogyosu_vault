ext class="xs t-prop" text-anchor="middle" x="623.5" y="168.7">20.3</text><text class="s" text-anchor="middle" x="587.5" y="258.0">4장</text><line class="s-ink w1" x1="80.0" x2="660.0" y1="240.0" y2="240.0"></line><rect class="f-ink" height="12.0" rx="0" width="12.0" x="380.0" y="14.0"></rect><text class="xs" text-anchor="start" x="397.0" y="24.0">'Gothic'</text><rect class="f-copy" height="12.0" rx="0" width="12.0" x="476.0" y="14.0"></rect><text class="xs" text-anchor="start" x="493.0" y="24.0">'Baudrillard'</text><rect class="f-prop" height="12.0" rx="0" width="12.0" x="572.0" y="14.0"></rect><text class="xs" text-anchor="start" x="589.0" y="24.0">'Deleuze'</text><text class="s mut" text-anchor="start" x="80.0" y="24.0">1만 단어당 횟수</text></svg></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 418" width="880" height="418" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.fig-svg .tm, .chart .tm{ font-family:var(--f-mono); font-size:11px; }.c-ink2{ fill:var(--ink2) !important }.c-pass{ fill:var(--pass) !important }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-rule{ stroke:var(--rule) }.s-pass{ stroke:var(--pass) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.dash{ stroke-dasharray:5 4 }.dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }.ldash{ stroke-dasharray:10 5 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="점 다섯 개로 만든 세 그래프. 사슬과 나무에서는 A와 B 사이 단순 경로가 하나뿐이고 순환수 μ = E − V + 1이 0이다. 완전그래프 K₅에서는 간선이 10개, 순환수가 6이고, A와 B 사이 단순 경로가 16개다." class="fig-svg" height="100%" role="img" viewBox="0 0 880 418" width="100%" xmlns="http://www.w3.org/2000/svg"><text class="tb" text-anchor="middle" x="150" y="30">사슬</text><text class="tm c-ink2" text-anchor="middle" x="150" y="48">V = 5 · E = 4</text><text class="tb" text-anchor="middle" x="440" y="30">나무</text><text class="tm c-ink2" text-anchor="middle" x="440" y="48">V = 5 · E = 4</text><text class="tb" text-anchor="middle" x="730" y="30">망 · 완전그래프 K₅</text><text class="tm c-ink2" text-anchor="middle" x="730" y="48">V = 5 · E = 10</text><line class="s-rule w1 dot f-none" x1="295" x2="295" y1="18" y2="366"></line><line class="s-rule w1 dot f-none" x1="585" x2="585" y1="18" y2="366"></line><line class="s-pass w3 f-none" x1="45" x2="97.5" y1="150" y2="150"></line><line class="s-pass w3 f-none" x1="97.5" x2="150" y1="150" y2="150"></line><line class="s-pass w3 f-none" x1="150" x2="202.5" y1="150" y2="150"></line><line class="s-pass w3 f-none" x1="202.5" x2="255" y1="150" y2="150"></line><circle class="s-ink f-deep w15" cx="97.5" cy="150" r="6"></circle><circle class="s-ink f-deep w15" cx="150" cy="150" r="6"></circle><circle class="s-ink f-deep w15" cx="202.5" cy="150" r="6"></circle><circle class="s-pass f-deep w2" cx="45" cy="150" r="11"></circle><text class="t c-pass" text-anchor="middle" x="45" y="154.5">A</text><circle class="s-pass f-deep w2" cx="255" cy="150" r="11"></circle><text class="t c-pass" text-anchor="middle" x="255" y="154.5">B</text><line class="s-ink2 w15 f-none" x1="385" x2="425" y1="150" y2="212"></line><line class="s-pass w3 f-none" x1="345" x2="385" y1="212" y2="150"></line><line class="s-pass w3 f-none" x1="385" x2="440" y1="150" y2="88"></line><line class="s-pass w3 f-none" x1="440" x2="505" y1="88" y2="150"></line><circle class="s-ink f-deep w15" cx="440" cy="88" r="6"></circle><circle class="s-ink f-deep w15" cx="385" cy="150" r="6"></circle><circle class="s-ink f-deep w15" cx="425" cy="212" r="6"></circle><circle class="s-pass f-deep w2" cx="345" cy="212" r="11"></circle><text class="t c-pass" text-anchor="middle" x="345" y="216.5">A</text><circle class="s-pass f-deep w2" cx="505" cy="150" r="11"></circle><text class="t c-pass" text-anchor="middle" x="505" y="154.5">B</text><line class="s-ink2 w1 f-none" x1="730" x2="772.321" y1="78" y2="208.249"></line><line class="s-ink2 w1 f-none" x1="730" x2="687.679" y1="78" y2="208.249"></line><line class="s-ink2 w1 f-none" x1="798.476" x2="687.679" y1="127.751" y2="208.249"></line><line class="s-ink2 w1 f-none" x1="772.321" x2="661.524" y1="208.249" y2="127.751"></line><line class="s-pass w3 f-none" x1="661.524" x2="798.476" y1="127.751" y2="127.751"></line><polyline class="s-pass w2 dash f-none" points="661.524,127.751 730,78 798.476,127.751"></polyline><polyline class="s-pass w2 ldash f-none" points="661.524,127.751 687.679,208.249 772.321,208.249 798.476,127.751"></polyline><circle class="s-ink f-deep w15" cx="730" cy="78" r="6"></circle><circle class="s-ink f-deep w15" cx="772.321" cy="208.249" r="6"></circle><circle class="s-ink f-deep w15" cx="687.679" cy="208.249" r="6"></circle><circle class="s-pass f-deep w2" cx="661.524" cy="127.751" r="11"></circle><text class="t c-pass" text-anchor="middle" x="661.524" y="132.251">A</text><circle class="s-pass f-deep w2" cx="798.476" cy="127.751" r="11"></circle><text class="t c-pass" text-anchor="middle" x="798.476" y="132.251">B</text><text class="ts c-pass" text-anchor="middle" x="730" y="244">16가닥 가운데 셋</text><text class="t" text-anchor="middle" x="150" y="274">A–B 단순 경로 1</text><line class="s-pass w2 f-none" x1="150" x2="150" y1="284" y2="300"></line><text class="tm" text-anchor="middle" x="150" y="340">μ = 4 − 5 + 1 = 0</text><text class="ts" text-anchor="middle" x="150" y="362">고리 없음</text><text class="t" text-anchor="middle" x="440" y="274">A–B 단순 경로 1</text><line class="s-pass w2 f-none" x1="440" x2="440" y1="284" y2="300"></line><text class="tm" text-anchor="middle" x="440" y="340">μ = 4 − 5 + 1 = 0</text><text class="ts" text-anchor="middle" x="440" y="362">고리 없음</text><text class="t" text-anchor="middle" x="730" y="274">A–B 단순 경로 16</text><line class="s-pass w2 f-none" x1="685" x2="685" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="691" x2="691" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="697" x2="697" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="703" x2="703" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="709" x2="709" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="715" x2="715" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="721" x2="721" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="727" x2="727" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="733" x2="733" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="739" x2="739" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="745" x2="745" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="751" x2="751" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="757" x2="757" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="763" x2="763" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="769" x2="769" y1="284" y2="300"></line><line class="s-pass w2 f-none" x1="775" x2="775" y1="284" y2="300"></line><text class="tm" text-anchor="middle" x="730" y="340">μ = 10 − 5 + 1 = 6</text><circle class="s-ink w15 f-none" cx="690" cy="357" r="5.5"></circle><circle class="s-ink w15 f-none" cx="706" cy="357" r="5.5"></circle><circle class="s-ink w15 f-none" cx="722" cy="357" r="5.5"></circle><circle class="s-ink w15 f-none" cx="738" cy="357" r="5.5"></circle><circle class="s-ink w15 f-none" cx="754" cy="357" r="5.5"></circle><circle class="s-ink w15 f-none" cx="770" cy="357" r="5.5"></circle><text class="tm c-ink2" text-anchor="middle" x="730" y="317">= 1 + 3 + 6 + 6</text><path class="s-ink2 w1 f-none" d="M30,376 L30,384 L560,384 L560,376"></path><text class="ts" text-anchor="middle" x="295" y="404">고리가 없으면 길은 하나 — 지나간 길이 곧 "필연"</text><path class="s-pass w1 f-none" d="M600,376 L600,384 L860,384 L860,376"></path><text class="ts c-pass" text-anchor="middle" x="730" y="404">고리가 생기면 길은 여럿 — 고름</text></svg></svg>
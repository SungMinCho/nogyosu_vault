t t-s t-b t-if" text-anchor="middle" x="166.0" y="148.0">물리 8812</text><rect class="f-bg s-ink" height="32.0" rx="16" width="190.0" x="300.0" y="40.0"></rect><text class="t t-s t-m" text-anchor="middle" x="395.0" y="61.0">block = 3  (논리 번호)</text><rect class="f-bg s-ink-thin" height="34.0" rx="0" width="44.0" x="250.0" y="214.0"></rect><text class="t t-xs t-m" text-anchor="middle" x="272.0" y="236.0">0</text><rect class="f-bg s-ink-thin" height="34.0" rx="0" width="44.0" x="298.0" y="214.0"></rect><text class="t t-xs t-m" text-anchor="middle" x="320.0" y="236.0">1</text><rect class="f-bg s-ink-thin" height="34.0" rx="0" width="44.0" x="346.0" y="214.0"></rect><text class="t t-xs t-m" text-anchor="middle" x="368.0" y="236.0">2</text><rect class="f-flag-soft s-flag" height="34.0" rx="0" width="44.0" x="394.0" y="214.0"></rect><text class="t t-xs t-m" text-anchor="middle" x="416.0" y="236.0">3</text><text class="t t-b t-mut" text-anchor="middle" x="458.0" y="236.0">…</text><rect class="f-bg s-ink-thin" height="34.0" rx="0" width="64.0" x="476.0" y="214.0"></rect><text class="t t-xs t-m" text-anchor="middle" x="508.0" y="236.0">8811</text><rect class="f-if-soft s-if" height="34.0" rx="0" width="64.0" x="544.0" y="214.0"></rect><text class="t t-xs t-m" text-anchor="middle" x="576.0" y="236.0">8812</text><rect class="f-bg s-ink-thin" height="34.0" rx="0" width="64.0" x="612.0" y="214.0"></rect><text class="t t-xs t-m" text-anchor="middle" x="644.0" y="236.0">8813</text><text class="t t-xs t-mut" text-anchor="start" x="250.0" y="292.0">디스크 블록 (물리 번호, 디스크 전체에서 하나뿐)</text><text class="t t-xs t-flag" text-anchor="middle" x="416.0" y="266.0">파일 B 소유</text><text class="t t-xs t-if" text-anchor="middle" x="576.0" y="266.0">파일 A 논리 3</text><path class="s-if w15" d="M300,58 C260,58 240,148 222,148" marker-end="url(#a-if-sprite)"></path><text class="t t-xs t-if" text-anchor="start" x="262.0" y="114.0">번역</text><path class="s-if w15" d="M200,176 C230,190 496.0,170 576.0,211" marker-end="url(#a-if-sprite)"></path><text class="t t-s t-if" text-anchor="middle" x="470.0" y="164.0">의도: 물리 8812를 0으로</text><path class="s-flag w2" d="M360,74 C360,130 416.0,150 416.0,211" marker-end="url(#a-flag-sprite)"></path><text class="t t-s t-flag" text-anchor="start" x="420.0" y="118.0">버그: ‘물리겠지’ 하고 그대로 씀</text></svg></g></g></g></g></g></svg>
}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:1rem 3rem}.lecture{display:contents}.fig{margin:.6rem 0}.panels{display:flex;flex-wrap:wrap;gap:1rem 1.2rem;justify-content:center;align-items:flex-start}.pn{display:block;flex:1 1 17.5rem;max-width:21rem;height:auto;background:var(--sheet);border:1px solid var(--rule)}.pn.sm{flex:1 1 12.5rem;max-width:15rem}.pn.tall{max-width:23rem}svg text{font-family:var(--f-mono)}.t-lab{font-family:var(--f-body);fill:var(--ink)}.t-head{font-family:var(--f-disp);fill:var(--ink)}.t-num{font-family:var(--f-mono);fill:var(--ink)}.t-math{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;fill:var(--ink)}svg .b{font-weight:600}.c-in{color:var(--c-in);fill:var(--c-in)}.c-out{color:var(--c-out);fill:var(--c-out)}.c-null{color:var(--c-null);fill:var(--c-null)}.s-in{stroke:var(--c-in)}.s-out{stroke:var(--c-out)}.s-orth{stroke:var(--c-orth)}.s-null{stroke:var(--c-null)}.f-in{fill:var(--c-in)}.f-out{fill:var(--c-out)}.f-inv{fill:var(--c-inv)}.f-orth{fill:var(--c-orth)}.f-warn{fill:var(--c-warn)}.f-null{fill:var(--c-null)}.f-ink{fill:var(--ink)}.f-mut{fill:var(--ink-2)}.f-none{fill:none}.f-win{fill:var(--w-in)}.f-wout{fill:var(--w-out)}.f-wmut{fill:var(--w-mut)}line,polyline,path{fill:none}.katex svg path{fill:currentColor}polygon.s-in,polygon.s-out{stroke-linejoin:round}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="특이값 분해가 네 부분공간 모두에 직각 기저를 깐다: v1..vr은 행공간, 나머지 v는 영공간, u1..ur은 열공간, 나머지 u는 왼쪽 영공간." class="pn tall" height="100%" role="img" viewBox="0 0 340 520" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="fs-in" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-in" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="fs-out" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" v
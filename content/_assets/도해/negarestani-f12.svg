<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 300" width="480" height="300" class="figscroll fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EDEFEA; --plate:#E3E6E0; --ink:#26221E; --ink-2:#5B5750; --rule:#C6CBC3; --mark:#B9BEB5;
  --cu:#9A5B2E; --vg:#2F7D6D; --pb:#2B4C7E; --vm:#C2412B;
  --cu-soft:rgba(154,91,46,.10); --vg-soft:rgba(47,125,109,.10); --pb-soft:rgba(43,76,126,.10); --vm-soft:rgba(194,65,43,.08);
  --f-display:"Hahmlet","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-latin:"EB Garamond","Noto Serif KR",Georgia,serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem;
}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}}:root[data-theme="dark"]{
  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}.vg{color:var(--vg)}.pb{color:var(--pb)}.vm{color:var(--vm)}svg.defs{position:absolute;width:0;height:0;overflow:hidden}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-inline:var(--pad);padding-block:0 4rem}.lecture{display:contents}.webwrap svg{display:block;width:100%;height:auto}.sw-dot.vg{background:var(--vg)}.sw-dot.pb{background:var(--pb)}.sw-dot.vm{background:var(--vm)}figure.fig{border:1px solid var(--mark);background:var(--plate);padding:.75rem .75rem .6rem;margin-block:.6rem}.figscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  background:linear-gradient(to right,var(--plate) 30%,transparent),linear-gradient(to left,var(--plate) 30%,transparent) 100% 0,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) 100% 0;
  background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;background-attachment:local,local,scroll,scroll}figure.fig svg{display:block;width:100%;height:auto;min-width:27rem}@media (max-width:34rem){.doc>figure.fig,.lecture>figure.fig{width:calc(100% + var(--pad)*2);max-width:none;margin-inline:calc(var(--pad)*-1);border-inline:0;padding-inline:.6rem}}.terms li.vg{color:var(--vg);background:var(--vg-soft)}.terms li.pb{color:var(--pb);background:var(--pb-soft)}.terms li.vm{color:var(--vm);background:var(--vm-soft)}svg .ln,svg .ln-cu,svg .ln-vg,svg .ln-pb,svg .ln-vm{stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}svg .ln:not([fill]),svg .ln-cu:not([fill]),svg .ln-vg:not([fill]),svg .ln-pb:not([fill]),svg .ln-vm:not([fill]){fill:none}svg .ln{stroke:var(--ink)}svg .ln-cu{stroke:var(--cu)}svg .ln-pb{stroke:var(--pb)}svg .ln-vm{stroke:var(--vm)}svg g.ln-vg>rect:not([fill]),svg g.ln-cu>rect:not([fill]),svg g.ln-pb>rect:not([fill]),svg g.ln-vm>rect:not([fill]){fill:none}svg .thick,svg g.thick>*{stroke-width:2.6}svg .faint,svg g.faint>*,svg g>.faint{stroke:var(--mark)}svg .dash,svg g.dash>*{stroke-dasharray:4 4}svg text{fill:var(--ink);font-family:var(--f-body)}svg .ts{font-size:13px}svg .tm{font-family:var(--f-mono);font-size:11px}svg .it{font-family:var(--f-latin);font-style:italic;font-size:20px}svg .c{text-anchor:middle}svg .r{text-anchor:end}svg text.cu{fill:var(--cu)}svg text.vg{fill:var(--vg)}svg text.pb{fill:var(--pb)}svg text.vm{fill:var(--vm)}.m .sq>.rt path{fill:none;stroke:currentColor;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}.m .sq>.rt path.rh{stroke-width:1.6px}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="x가 x를 찔렀다 — ‘x가 x를 찔렀다’는 단순 술어를 조합해 얻을 수 없다 — 같은 변수의 묶음이 재귀 개념의 문이다" height="100%" role="img" viewBox="0 0 480 300" width="100%" xmlns="http://www.w3.org/2000/svg"><rect class="ln-cu" height="26" width="80" x="42" y="16"></rect><text class="ts c" x="82" y="34">브루투스</text><text class="ts" x="127" y="34">가</text><rect class="ln-cu" height="26" width="80" x="144" y="16"></rect><text class="ts c" x="184" y="34">브루투스</text><text class="ts" x="230" y="34">를 찔렀다</text><rect class="ln-pb" height="26" width="80" x="42" y="66"></rect><text class="it c pb" x="82" y="86">x</text><text class="ts" x="127" y="84">가</text><rect class="ln-cu" height="26" width="80" x="144" y="66"></rect><text class="ts c" x="184" y="84">브루투스</text><text class="ts" x="230" y="84">를 찔렀다</text><rect class="ln-cu" height="26" width="80" x="42" y="108"></rect><text class="ts c" x="82" y="126">브루투스</text><text class="ts" x="127" y="126">가</text><rect class="ln-pb" height="26" width="80" x="144" y="108"></rect><text class="it c pb" x="184" y="128">x</text><text class="ts" x="230" y="126">를 찔렀다</text><rect class="ln-pb" height="26" width="80" x="42" y="176"></rect><text class="it c pb" x="82" y="196">x</text><text class="ts" x="127" y="194">가</text><rect class="ln-pb" height="26" width="80" x="144" y="176"></rect><text class="it c pb" x="184" y="196">x</text><text class="ts" x="230" y="194">를 찔렀다</text>
<text class="tm" x="312" y="34">이름 자리가 둘인 문장</text><line class="ln faint" x1="302" x2="302" y1="64" y2="204"></line>
<text class="ts c" x="22" y="84">①</text><text class="ts c" x="22" y="126">②</text><text class="ts c" x="22" y="194">③</text>
<text class="ts" x="312" y="84">브루투스를 찌른 자</text><text class="tm r" x="468" y="84">단순</text>
<text class="ts" x="312" y="126">브루투스가 찌른 자</text><text class="tm r" x="468" y="126">단순</text>
<text class="ts vg" x="312" y="194">자살했다</text><text class="tm r vg" x="468" y="194">복합</text>
<line class="ln-vm dash" marker-end="url(#ah-vm)" x1="364" x2="364" y1="138" y2="174"></line>
<text class="tm vm" x="376" y="161">✗</text>
<path class="ln-pb thick" d="M82,202 C82,228 184,228 184,202"></path>
<text class="tm pb" x="232" y="224">같은 변수가 두 자리를 묶는다</text>
<text class="ts c vm" x="240" y="254">①과 ②를 어떻게 조합해도 ③은 나오지 않는다</text>
<text class="tm c" x="240" y="274">빈칸 내기: 2² − 1 = 3가지 · 자리가 셋이면 2³ − 1 = 7가지</text>
<text class="tm c vg" x="240" y="292">같은 변수의 묶음 = ‘자기에게 한다’는 재귀 개념이 들어오는 문</text>
</svg></svg>
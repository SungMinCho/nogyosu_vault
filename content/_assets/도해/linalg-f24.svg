}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:1rem 3rem}.lecture{display:contents}.fig{margin:.6rem 0}.panels{display:flex;flex-wrap:wrap;gap:1rem 1.2rem;justify-content:center;align-items:flex-start}.pn{display:block;flex:1 1 17.5rem;max-width:21rem;height:auto;background:var(--sheet);border:1px solid var(--rule)}.pn.sm{flex:1 1 12.5rem;max-width:15rem}.pn.tall{max-width:23rem}svg text{font-family:var(--f-mono)}.t-lab{font-family:var(--f-body);fill:var(--ink)}.t-math{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;fill:var(--ink)}.c-in{color:var(--c-in);fill:var(--c-in)}.c-out{color:var(--c-out);fill:var(--c-out)}.c-mut{color:var(--ink-2);fill:var(--ink-2)}.s-out{stroke:var(--c-out)}.s-ink{stroke:var(--ink)}.f-in{fill:var(--c-in)}.f-out{fill:var(--c-out)}.f-inv{fill:var(--c-inv)}.f-orth{fill:var(--c-orth)}.f-warn{fill:var(--c-warn)}.f-null{fill:var(--c-null)}.f-ink{fill:var(--ink)}.f-mut{fill:var(--ink-2)}line,polyline,path{fill:none}.katex svg path{fill:currentColor}polygon.s-in,polygon.s-out{stroke-linejoin:round}svg.pz-root{width:340px!important;height:230px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="
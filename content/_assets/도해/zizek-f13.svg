  padding:.6rem .4rem; }.fig svg{ display:block; width:100%; height:auto; min-width:640px; }svg text{ fill:var(--ink); font-family:var(--f-label); }.t-sm{ font-size:12px; }.t-md{ font-size:13.5px; }.t-lg{ font-size:18px; }.t-b{ font-weight:700; }.t-mute{ fill:var(--mute); }.t-sub{ fill:var(--sub); }.t-jou{ fill:var(--jou); }.f-ink{ fill:var(--ink); }.f-mute{ fill:var(--mute); }.f-rule{ fill:var(--rule); }.f-ground{ fill:var(--ground); }.f-panel{ fill:var(--panel); }.f-none{ fill:none; }.f-jou{ fill:var(--jou); }.s-ink{ stroke:var(--ink); }.s-rule{ stroke:var(--rule); }.s-sub{ stroke:var(--sub); }.s-jou{ stroke:var(--jou); }.fig-scroll .f-panel{ fill:var(--ground); }svg.pz-root{width:760px!important;height:298px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-scroll"><svg xmlns="http://www.w3.org/2000/svg" aria-label="왼쪽: 슬로베니아는 세르비아가 게으름과 부패로, 세르비아는 슬로베니아가 부자연스러운 근면과 계산으로 자기 향락을 훔친다고 말하고, 두 화살표 사이 가운데의 훔쳤다는 향락은 비어 있다. 오른쪽: 슬로베니아는 인구 8.05%로 생산 19.6%, 수출 24.2%, 코소보는 인구 8.47%로 생산 1.9%, 수출 1.09%." class="pz-inner" data-fig="f12" height="100%" role="img" style="--fw:76
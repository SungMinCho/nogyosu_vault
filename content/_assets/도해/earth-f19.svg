  background-color:var(--panel); border:1px solid var(--rule); padding:.6rem .4rem }.frame svg{ display:block; width:100%; height:auto }svg text{ font-family:var(--f-sans); fill:var(--ink); font-size:13px }svg .tl{ font-size:13.5px }svg .ts{ font-size:12.5px }svg .tx{ font-size:11.5px }svg .tn{ font-family:var(--f-mono); font-size:12px }svg .tbig{ font-size:15px; font-weight:500 }svg .tb{ font-weight:700 }svg .tn.tb{ font-weight:600 }svg .t2{ fill:var(--ink2) }svg .t-violet-d{ fill:var(--violet-d) }.f-blue-l{fill:var(--blue-l)}.f-ink2{fill:var(--ink2)}.f-hair{fill:var(--hair)}.f-panel{fill:var(--panel)}.f-none{fill:none}.s-ink2{stroke:var(--ink2)}.s-rule{stroke:var(--rule)}.sb{stroke:var(--blue); stroke-width:1.2}svg line, svg path, svg polyline, svg rect, svg circle{ stroke-width:1 }.sw2{ stroke-width:2 !important }svg pattern line{ stroke-width:1.1 }svg.pz-root{width:640px!important;height:210px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="거래 하나의 해부. 갑의 주식 1주와 을의 현금 100이 자리를 바꾼다. 현금 총량은 100 그대로, 시가총액은 90,000에서 100,000으로." class="pz-inner" height="100%" id="td" ro
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 368" width="720" height="368" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2{ stroke:var(--ink-2); }.f-ink2-t{ fill:var(--ink-2); }.f-muted{ stroke:var(--muted); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-madder{ stroke:var(--madder); }.f-madder-t{ fill:var(--madder); }.f-ochre{ stroke:var(--ochre); }.f-ochre-t{ fill:var(--ochre); }.f-mend-t{ fill:var(--mend); }.f-none{ fill:none; }.f-dash{ stroke-dasharray:6 5; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-l{ font-size:15px; }svg .t-b{ font-weight:700; }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="자본주의 기계는 왼쪽에서 코드를 풀어 흐름을 내보내고 오른쪽에서 공리를 덧붙여 그 흐름을 다시 고리로 묶는다. 돌 때마다 상대적 한계를 더 큰 원으로 밀어낼 뿐 점선의 절대적 한계에는 닿지 않으며, '가속하라'가 고리를 더 빨리 돌리라는 뜻(①)인지 고리를 찢고 새어 나가라는 뜻(②)인지가 반론과 방어의 쟁점이다." height="100%" role="img" viewBox="0 0 720 368" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f24-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f24-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f24-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f24-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f24-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f24-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f24-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><circle class="f-muted f-none" cx="300" cy="190" r="58" stroke-dasharray="3 4" stroke-width="1.2"></circle><circle class="f-muted f-none" cx="300" cy="190" r="86" stroke-dasharray="3 4" stroke-width="1.2"></circle><circle class="f-ink f-none" cx="300" cy="190" r="114" stroke-width="2.2"></circle><path class="f-ink f-none" d="M257.3,84.3 A114,114 0 0 1 342.7,84.3" marker-end="url(#f24-a-ink)" stroke-width="2.2"></path><text class="f-ink-t t-b" text-anchor="middle" x="300" y="186">자본주의</text><text class="f-ink-t t-b" text-anchor="middle" x="300" y="204">기계</text><line class="f-ink2 f-none" marker-end="url(#f24-a-ink2)" stroke-width="1.2" x1="254.0" x2="236.4" y1="151.4" y2="136.6"></line><line class="f-ink2 f-none" marker-end="url(#f24-a-ink2)" stroke-width="1.2" x1="232.6" x2="215.0" y1="133.4" y2="118.7"></line><text class="f-ink2-t t-s" text-anchor="middle" x="300" y="58">상대적 한계 — 밀려날 뿐 사라지지 않는다</text><line class="f-madder f-none" marker-end="url(#f24-a-madder)" stroke-width="2" x1="190.1" x2="147.8" y1="230.0" y2="245.4"></line><line class="f-madder f-none" marker-end="url(#f24-a-madder)" stroke-width="2" x1="183.0" x2="138.0" y1="190.0" y2="190.0"></line><line class="f-madder f-none" marker-end="url(#f24-a-madder)" stroke-width="2" x1="190.1" x2="147.8" y1="150.0" y2="134.6"></line><text class="f-madder-t t-l" text-anchor="middle" x="78" y="186">탈코드화</text><text class="f-madder-t t-s" text-anchor="middle" x="78" y="205">흐름이 풀려나옴</text><line class="f-indigo f-none" marker-end="url(#f24-a-indigo)" stroke-width="2" x1="461.6" x2="411.8" y1="131.2" y2="149.3"></line><line class="f-indigo f-none" marker-end="url(#f24-a-indigo)" stroke-width="2" x1="472.0" x2="419.0" y1="190.0" y2="190.0"></line><line class="f-indigo f-none" marker-end="url(#f24-a-indigo)" stroke-width="2" x1="461.6" x2="411.8" y1="248.8" y2="230.7"></line><text class="f-indigo-t t-l" text-anchor="start" x="488" y="186">공리화</text><text class="f-indigo-t t-s" text-anchor="start" x="488" y="205">다시 묶어 고리로</text><path class="f-ochre f-none f-dash" d="M599.1,50.5 A330,330 0 0 1 599.1,329.5" stroke-width="2"></path><text class="f-ochre-t t-s" text-anchor="middle" x="604" y="36">절대적 한계</text><text class="f-ochre-t t-s" text-anchor="middle" x="672" y="186">분열증</text><text class="f-ochre-t t-s" text-anchor="middle" x="672" y="203">닿지 않음</text><path class="f-ink2 f-none" d="M363.8,310.1 A136,136 0 0 1 236.2,310.1" marker-end="url(#f24-a-ink2)" stroke-width="1.8"></path><text class="f-ink2-t t-s" text-anchor="middle" x="300" y="352">① 고리를 더 빨리 — 자본을 가속?</text><line class="f-madder f-none" stroke-width="2.4" x1="379.7" x2="391.7" y1="259.3" y2="271.3"></line><path class="f-madder f-none" d="M384.7,266.3 C440,300 530,312 605.1,300" marker-end="url(#f24-a-madder)" stroke-width="2.2"></path><text class="f-madder-t t-s" text-anchor="middle" x="484" y="338">② 고리를 찢고 샌다 — 과정을 가속</text></svg></svg>
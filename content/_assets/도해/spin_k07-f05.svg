<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 780 240" width="780" height="240" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-grid{ fill:var(--grid) }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .qbox{ fill:none; stroke:var(--grid); stroke-width:1.6 }.dg .cloud{ fill:var(--rot-soft); stroke:var(--rot); stroke-width:1.4 }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="같은 타원형 데이터를 한 가지 눈금의 정사각형 격자로 덮을 때, 기울어진 채로는 0.63, PCA로 축을 맞추면 0.39, 축척까지 하면 0.79의 공간을 쓴다" class="dg" height="100%" role="img" style="" viewBox="0 0 780 240" width="100%"><text class="t-b" text-anchor="middle" x="130" y="22">그대로 (45° 기울어짐)</text><rect class="qbox" height="94.86" rx="0" width="94.86" x="82.57" y="64.57"></rect><line class="ln-hair" x1="76.57" x2="183.43" y1="112" y2="112"></line><line class="ln-hair" x1="130" x2="130" y1="58.57" y2="165.43"></line><ellipse class="cloud" cx="130" cy="112" rx="60.0" ry="30.0" transform="rotate(-45 130 112)"></ellipse><text class="t-b t-grid" text-anchor="middle" x="130" y="212">활용률 0.63</text><text class="t-b" text-anchor="middle" x="390" y="22">PCA로 축 맞춤 (직교)</text><rect class="qbox" height="120" rx="0" width="120" x="330" y="52"></rect><line class="ln-hair" x1="324" x2="456" y1="112" y2="112"></line><line class="ln-hair" x1="390" x2="390" y1="46" y2="178"></line><ellipse class="cloud" cx="390" cy="112" rx="60.0" ry="30.0" transform="rotate(0 390 112)"></ellipse><text class="t-b t-grid" text-anchor="middle" x="390" y="212">활용률 0.39</text><text class="t-b" text-anchor="middle" x="650" y="22">축척 + 직교 (백색화)</text><rect class="qbox" height="84.84" rx="0" width="84.84" x="607.58" y="69.58"></rect><line class="ln-hair" x1="601.58" x2="698.42" y1="112" y2="112"></line><line class="ln-hair" x1="650" x2="650" y1="63.58" y2="160.42"></line><ellipse class="cloud" cx="650" cy="112" rx="42.4" ry="42.4" transform="rotate(0 650 112)"></ellipse><text class="t-b t-grid" text-anchor="middle" x="650" y="212">활용률 0.79</text><text class="t-s t-mut" text-anchor="middle" x="130" y="230">각 좌표 범위 √2.5 ≈ 1.58로 같음</text><text class="t-s t-mut" text-anchor="middle" x="390" y="230">한 좌표에 몰려 네모가 커짐</text><text class="t-s t-mut" text-anchor="middle" x="650" y="230">직교만으로는 못 가는 선</text></svg></svg>
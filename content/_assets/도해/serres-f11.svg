<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 500" width="760" height="500" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.fig-svg .tl, .chart .tl{ font-family:var(--f-latin); font-style:italic; }.fig-svg .tm, .chart .tm{ font-family:var(--f-mono); font-size:11px; }.fig-svg .halo, .chart .halo{ paint-order:stroke; stroke:var(--deep); stroke-width:4px; stroke-linejoin:round; }.c-ink2{ fill:var(--ink2) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-rule{ stroke:var(--rule) }.s-caution{ stroke:var(--caution) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-shoal{ fill:var(--shoal) }.f-caution-t{ fill:var(--caution); fill-opacity:.14 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.dash{ stroke-dasharray:5 4 }.mk-ink{ fill:var(--ink) }svg.pz-root{width:760px!important;height:500px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="일곱 대죄와 바슐라르 『과학 정신의 형성』의 장들을 잇는 그림. 탐욕은 7장 실재론자의 정신분석, 식탐은 8장과 9장 소화의 신화, 음욕은 10장 리비도로 이어지고, 나태와 교만은 책 전체를 감싼다. 시기와 분노에서는 아무 줄도 나가지 않고 반동하는 연구자의 대미덕으로 남는다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 760 500" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F14-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t" text-anchor="middle" x="575" y="30">바슐라르 『과학 정신의 형성』(1938)</text><rect class="s-ink2 w15 dash f-none" height="332" rx="4" width="298" x="426" y="44"></rect><rect class="s-rule f-deep w1" height="22" rx="2" width="270" x="440" y="52"></rect><text class="tm c-ink2" text-anchor="start" x="450" y="67">1장</text><text class="ts" text-anchor="start" x="486" y="67.5">장애물 개념</text><rect class="s-rule f-deep w1" height="22" rx="2" width="270" x="440" y="79"></rect><text class="tm c-ink2" text-anchor="start" x="450" y="94">2장</text><text class="ts" text-anchor="start" x="486" y="94.5">첫 경험</text><rect class="s-rule f-deep w1" height="22" rx="2" width="270" x="440" y="106"></rect><text class="tm c-ink2" text-anchor="start" x="450" y="121">3장</text><text class="ts" text-anchor="start" x="486" y="121.5">일반적 인식</text><rect class="s-rule f-deep w1" height="22" rx="2" width="270" x="440" y="133"></rect><text class="tm c-ink2" text-anchor="start" x="450" y="148">4장</text><text class="ts" text-anchor="start" x="486" y="148.5">'해면'이라는 말</text><rect class="s-rule f-deep w1" height="22" rx="2" width="270" x="440" y="160"></rect><text class="tm c-ink2" text-anchor="start" x="450" y="175">5장</text><text class="ts" text-anchor="start" x="486" y="175.5">단일적·실용적 인식</text><rect class="s-rule f-deep w1" height="22" rx="2" width="270" x="440" y="187"></rect><text class="tm c-ink2" text-anchor="start" x="450" y="202">6장</text><text class="ts" text-anchor="start" x="486" y="202.5">실체론적 장애</text><rect class="s-ink f-shoal w15" height="22" rx="2" width="270" x="440" y="214"></rect><text class="tm c-ink2" text-anchor="start" x="450" y="229">7장</text><text class="t" text-anchor="start" x="486" y="229.5">실재론자의 정신분석</text><rect class="s-ink f-shoal w15" height="22" rx="2" width="270" x="440" y="241"></rect><text class="tm c-ink2" text-anchor="start" x="450" y="256">8장</text><text class="t" text-anchor="start" x="486" y="256.5">애니미즘의 장애</text><rect class="s-ink f-shoal w15" height="22" rx="2" width="270" x="440" y="268"></rect><text class="tm c-ink2" text-anchor="start" x="450" y="283">9장</text><text class="t" text-anchor="start" x="486" y="283.5">소화의 신화</text><rect class="s-ink f-shoal w15" height="22" rx="2" width="270" x="440" y="295"></rect><text class="tm c-ink2" text-anchor="start" x="450" y="310">10장</text><text class="t" text-anchor="start" x="486" y="310.5">리비도와 객관적 인식</text><rect class="s-rule f-deep w1" height="22" rx="2" width="270" x="440" y="322"></rect><text class="tm c-ink2" text-anchor="start" x="450" y="337">11장</text><text class="ts" text-anchor="start" x="486" y="337.5">양적 인식의 장애</text><rect class="s-rule f-deep w1" height="22" rx="2" width="270" x="440" y="349"></rect><text class="tm c-ink2" text-anchor="start" x="450" y="364">12장</text><text class="ts" text-anchor="start" x="486" y="364.5">과학적 객관성과 정신분석</text><text class="t" text-anchor="middle" x="148" y="30">일곱 대죄</text><rect class="s-ink f-deep w15" height="34" rx="2" width="96" x="100" y="73"></rect><text class="tb" text-anchor="middle" x="148" y="87">나태</text><text class="ts tl" text-anchor="middle" x="148" y="103">paresse</text><rect class="s-ink f-deep w15" height="34" rx="2" width="96" x="100" y="127"></rect><text class="tb" text-anchor="middle" x="148" y="141">교만</text><text class="ts tl" text-anchor="middle" x="148" y="157">orgueil</text><rect class="s-ink f-deep w15" height="34" rx="2" width="96" x="100" y="208"></rect><text class="tb" text-anchor="middle" x="148" y="222">탐욕</text><text class="ts tl" text-anchor="middle" x="148" y="238">avarice</text><rect class="s-ink f-deep w15" height="34" rx="2" width="96" x="100" y="249"></rect><text class="tb" text-anchor="middle" x="148" y="263">식탐</text><text class="ts tl" text-anchor="middle" x="148" y="279">gourmandise</text><rect class="s-ink f-deep w15" height="34" rx="2" width="96" x="100" y="289"></rect><text class="tb" text-anchor="middle" x="148" y="303">음욕</text><text class="ts tl" text-anchor="middle" x="148" y="319">luxure</text><rect class="s-caution f-caution-t w2" height="34" rx="2" width="96" x="100" y="403"></rect><text class="tb c-caution" text-anchor="middle" x="148" y="417">시기</text><text class="ts tl" text-anchor="middle" x="148" y="433">envie</text><rect class="s-caution f-caution-t w2" height="34" rx="2" width="96" x="100" y="445"></rect><text class="tb c-caution" text-anchor="middle" x="148" y="459">분노</text><text class="ts tl" text-anchor="middle" x="148" y="475">colère</text><line class="s-ink w15 dash f-none" marker-end="url(#F14-ar-ink)" x1="196" x2="424" y1="90" y2="90"></line><text class="ts halo" text-anchor="middle" x="311" y="84">'꾸준한 노력' 찬양</text><line class="s-ink w15 dash f-none" marker-end="url(#F14-ar-ink)" x1="196" x2="424" y1="144" y2="144"></line><text class="ts halo" text-anchor="middle" x="311" y="138">서두름 · 통일의 욕망</text><line class="s-ink w3 f-none" marker-end="url(#F14-ar-ink)" x1="196" x2="438" y1="225" y2="225"></line><text class="ts halo" text-anchor="middle" x="318" y="218">구두쇠 · 순환 거부</text><line class="s-ink w3 f-none" x1="196" x2="384" y1="266" y2="266"></line><line class="s-ink w3 f-none" marker-end="url(#F14-ar-ink)" x1="384" x2="438" y1="266" y2="252"></line><line class="s-ink w3 f-none" marker-end="url(#F14-ar-ink)" x1="384" x2="438" y1="266" y2="279"></line><text class="ts halo" text-anchor="middle" x="290" y="259">맛 · 요리 · 소화</text><line class="s-ink w3 f-none" marker-end="url(#F14-ar-ink)" x1="196" x2="438" y1="306" y2="306"></line><text class="ts halo" text-anchor="middle" x="318" y="299">리비도 · 연금술</text><path class="s-ink2 w1 f-none" d="M92,70 L86,70 L86,164 L92,164"></path><text class="ts" text-anchor="end" x="80" y="114"><tspan dy="0" x="80">책 전체에</tspan><tspan dy="14" x="80">번진 둘</tspan></text><path class="s-ink2 w1 f-none" d="M92,205 L86,205 L86,326 L92,326"></path><text class="ts" text-anchor="end" x="80" y="262.5"><tspan dy="0" x="80">장마다</tspan><tspan dy="14" x="80">묶인 셋</tspan></text><path class="s-ink2 w1 f-none" d="M92,400 L86,400 L86,482 L92,482"></path><text class="ts c-caution" text-anchor="end" x="80" y="438"><tspan dy="0" x="80">미덕으로</tspan><tspan dy="14" x="80">남은 둘</tspan></text><path class="s-caution w1 f-none" d="M204,400 L210,400 L210,482 L204,482"></path><text class="t c-caution" text-anchor="start" x="222" y="432">어느 장으로도 줄이 나가지 않는다</text><text class="ts" text-anchor="start" x="222" y="452">« 반동하는 연구자의 대(大)미덕 »</text><text class="ts tl" text-anchor="start" x="222" y="468">Envy, wrath, the capital virtues of the reactive researcher</text></svg></g></g></g></g></svg>
nt;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w wrap"><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="M제곱의 기하. P와 Q를 각자의 자본배분선을 따라 시장과 같은 표준편차 20%까지 늘이거나 줄이면 P*는 11.00%, Q*는 11.72%가 되어 시장 10%보다 각각 1.00%p, 1.72%p 높다." class="dg pz-inner" height="100%" role="img" viewBox="0 0 600 390" width="100%">

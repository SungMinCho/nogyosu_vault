<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 280" width="720" height="280" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#E8ECE6; --panel:#F2F5F0; --grid:#D3DBD0; --grid-2:#BDC9B9;
  --ink:#1B2024; --ink-2:#4A545B; --ink-3:#6B767C;
  --copy:#3A4C98; --prop:#0B7367; --code:#8E6208; --alarm:#A63B28;
  --copy-soft:rgba(58,76,152,.14); --prop-soft:rgba(11,115,103,.14);
  --code-soft:rgba(142,98,8,.14); --alarm-soft:rgba(166,59,40,.13);
  --shade:rgba(27,32,36,.07);
  --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2);
  --f-disp:"Orbit","Do Hyeon","Nanum Gothic",sans-serif;
  --f-body:"Source Serif 4","Nanum Myeongjo","Noto Serif CJK KR","Noto Serif KR",serif;
  --f-mono:"Martian Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
  --f-lab:"Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111514; --panel:#171C1B; --grid:#1F2725; --grid-2:#2B3532;
    --ink:#E1E6E0; --ink-2:#AAB4AE; --ink-3:#86918B;
    --copy:#93A5F2; --prop:#43BCA9; --code:#D9A43E; --alarm:#E4795F;
    --copy-soft:rgba(147,165,242,.16); --prop-soft:rgba(67,188,169,.16);
    --code-soft:rgba(217,164,62,.15); --alarm-soft:rgba(228,121,95,.15);
    --shade:rgba(225,230,224,.07);
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111514; --panel:#171C1B; --grid:#1F2725; --grid-2:#2B3532;
  --ink:#E1E6E0; --ink-2:#AAB4AE; --ink-3:#86918B;
  --copy:#93A5F2; --prop:#43BCA9; --code:#D9A43E; --alarm:#E4795F;
  --copy-soft:rgba(147,165,242,.16); --prop-soft:rgba(67,188,169,.16);
  --code-soft:rgba(217,164,62,.15); --alarm-soft:rgba(228,121,95,.15);
  --shade:rgba(225,230,224,.07);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero svg{ display:block; width:100%; height:auto }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:1rem 3rem }.lecture{ display:contents }figure.fig{ margin:.6rem 0 !important }.fig-frame{ overflow-x:auto; border:1px solid var(--grid-2); background-color:var(--panel);
  background-image:
    linear-gradient(90deg,var(--panel) 30%,rgba(0,0,0,0)),
    linear-gradient(90deg,rgba(0,0,0,0),var(--panel) 70%) 100% 0,
    radial-gradient(farthest-side at 0 50%,var(--shade),rgba(0,0,0,0)),
    radial-gradient(farthest-side at 100% 50%,var(--shade),rgba(0,0,0,0)) 100% 0,
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,repeat,repeat;
  background-size:40px 100%,40px 100%,14px 100%,14px 100%,12px 12px,12px 12px;
  background-attachment:local,local,scroll,scroll,local,local; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; color:var(--ink) }.fig-frame text, .hero text{ font-family:var(--f-lab); fill:var(--ink); font-size:12px }text.s{ font-size:11px }text.xs{ font-size:10px }text.l{ font-size:14px }text.xl{ font-size:18px }text.b{ font-weight:700 }text.mut{ fill:var(--ink-2) }text.halo{ paint-order:stroke fill; stroke:var(--panel) !important; stroke-width:6px; stroke-linejoin:round }text.he{ font-family:"Noto Serif Hebrew","Noto Sans Hebrew","Times New Roman",serif; font-size:30px }.t-copy{ fill:var(--copy) !important }.t-prop{ fill:var(--prop) !important }.s-mut{ stroke:var(--ink-3); fill:none }.s-copy{ stroke:var(--copy); fill:none }.s-prop{ stroke:var(--prop); fill:none }.f-copy-s{ fill:var(--copy-soft) }.f-prop-s{ fill:var(--prop-soft) }.m-ink{ fill:var(--ink) }.m-copy{ fill:var(--copy) }.m-prop{ fill:var(--prop) }.m-code{ fill:var(--code) }.m-alarm{ fill:var(--alarm) }.m-mut{ fill:var(--ink-3) }.dash{ stroke-dasharray:5 4 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }svg.pz-root{width:720px!important;height:280px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="왼쪽은 같은 모양의 부모가 같은 모양의 자식을 낳는 족보, 오른쪽은 토끼풀·뒝벌·배·사람이라는 이질적 부품이 이룬 번식 회로. 뉴질랜드의 토끼풀은 1885년 배로 실려 온 뒝벌로 비로소 씨를 맺었다." class="pz-inner" height="100%" role="img" viewBox="0 0 720 280" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f08-a-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-ink" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f08-a-copy" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-copy" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f08-a-prop" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-prop" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f08-a-code" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-code" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f08-a-alarm" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-alarm" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f08-a-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-mut" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><text class="l b t-copy" text-anchor="middle" x="180.0" y="26.0">reproduction — 족보</text><line class="s-copy w15" marker-end="url(#f08-a-copy)" x1="148.0" x2="173.0" y1="84.0" y2="130.0"></line><line class="s-copy w15" marker-end="url(#f08-a-copy)" x1="212.0" x2="187.0" y1="84.0" y2="130.0"></line><line class="s-copy w15" marker-end="url(#f08-a-copy)" x1="172.8" x2="124.3" y1="156.0" y2="198.0"></line><line class="s-copy w15" marker-end="url(#f08-a-copy)" x1="180.0" x2="180.0" y1="156.0" y2="198.0"></line><line class="s-copy w15" marker-end="url(#f08-a-copy)" x1="187.2" x2="235.7" y1="156.0" y2="198.0"></line><circle class="f-copy-s s-copy w15" cx="140.0" cy="72.0" r="13.0"></circle><circle class="f-copy-s s-copy w15" cx="220.0" cy="72.0" r="13.0"></circle><circle class="f-copy-s s-copy w15" cx="180.0" cy="142.0" r="13.0"></circle><circle class="f-copy-s s-copy w15" cx="120.0" cy="212.0" r="13.0"></circle><circle class="f-copy-s s-copy w15" cx="180.0" cy="212.0" r="13.0"></circle><circle class="f-copy-s s-copy w15" cx="240.0" cy="212.0" r="13.0"></circle><text class="s" text-anchor="middle" x="180.0" y="250.0">같은 종이 같은 종을 낳는다</text><text class="s mut" text-anchor="middle" x="180.0" y="268.0">성공은 닮음으로 잰다</text><line class="s-mut w1 dash" x1="360.0" x2="360.0" y1="40.0" y2="262.0"></line><text class="l b t-prop" text-anchor="middle" x="545.0" y="26.0">propagation — 번짐</text><circle class="f-prop-s s-prop w15" cx="440.0" cy="96.0" r="15.0"></circle><path class="f-prop-s s-prop w15" d="M628,82 L640,89 L640,103 L628,110 L616,103 L616,89 z"></path><rect class="f-prop-s s-prop w15" height="24.0" rx="3" width="36.0" x="610.0" y="188.0"></rect><rect class="f-prop-s s-prop w15" height="28.0" rx="13" width="26.0" x="427.0" y="186.0"></rect><text class="s" text-anchor="middle" x="440.0" y="72.0">붉은 토끼풀</text><text class="s" text-anchor="middle" x="628.0" y="72.0">뒝벌</text><text class="s" text-anchor="middle" x="628.0" y="232.0">배</text><text class="s" text-anchor="middle" x="440.0" y="232.0">사람</text><line class="s-prop w15" marker-end="url(#f08-a-prop)" x1="612.0" x2="460.0" y1="96.0" y2="96.0"></line><text class="xs" text-anchor="middle" x="536.0" y="88.0">수분</text><line class="s-prop w15" marker-end="url(#f08-a-prop)" x1="628.0" x2="628.0" y1="186.0" y2="114.0"></line><text class="xs" text-anchor="start" x="636.0" y="154.0">실어 나름</text><line class="s-prop w15" marker-end="url(#f08-a-prop)" x1="456.0" x2="606.0" y1="200.0" y2="200.0"></line><text class="xs" text-anchor="middle" x="530.0" y="192.0">만들고 부림</text><line class="s-prop w15" marker-end="url(#f08-a-prop)" x1="440.0" x2="440.0" y1="184.0" y2="116.0"></line><text class="xs" text-anchor="end" x="432.0" y="154.0">목초로 심음</text><text class="s" text-anchor="middle" x="545.0" y="250.0">서로 다른 부품들이 한 번식 회로를 이룬다</text><text class="s mut" text-anchor="middle" x="545.0" y="268.0">성공은 연결과 확산으로 잰다</text></svg></g></g></g></g></svg>
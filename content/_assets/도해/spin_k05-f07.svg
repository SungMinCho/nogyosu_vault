<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 780 270" width="780" height="270" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .f-mut{ fill:var(--muted) }.dg .f-rot{ fill:var(--rot) }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:780px!important;height:270px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="Llama 3.2 1B 양자화판에서 SpinQuant는 디코딩을 초당 19.2에서 50.2토큰으로 높이고 크기를 2358에서 1083 메가바이트로 줄이며 MMLU는 49.3에서 47.3이 된다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 780 270" width="100%"><text class="t-b" text-anchor="start" x="20" y="28">디코딩 속도 (토큰/초)</text><text class="t-s" text-anchor="start" x="20" y="62">BF16</text><rect class="f-mut" height="18" rx="0" width="48" x="96" y="50"></rect><text class="t-s t-mono t-b" text-anchor="start" x="148" y="64">19.2</text><text class="t-s t-b t-rot" text-anchor="start" x="20" y="102">SpinQuant</text><rect class="f-rot" height="18" rx="0" width="125.5" x="96" y="90"></rect><text class="t-s t-mono t-b" text-anchor="start" x="225.5" y="104">50.2</text><text class="t-s" text-anchor="start" x="20" y="142">QAT+LoRA</text><rect class="f-mut" height="18" rx="0" width="114.5" x="96" y="130"></rect><text class="t-s t-mono t-b" text-anchor="start" x="214.5" y="144">45.8</text><text class="t-b" text-anchor="start" x="278" y="28">모델 크기 (MB)</text><text class="t-s" text-anchor="start" x="278" y="62">BF16</text><rect class="f-mut" height="18" rx="0" width="136.038" x="354" y="50"></rect><text class="t-s t-mono t-b" text-anchor="start" x="494.038" y="64">2358</text><text class="t-s t-b t-rot" text-anchor="start" x="278" y="102">SpinQuant</text><rect class="f-rot" height="18" rx="0" width="62.4808" x="354" y="90"></rect><text class="t-s t-mono t-b" text-anchor="start" x="420.481" y="104">1083</text><text class="t-s" text-anchor="start" x="278" y="142">QAT+LoRA</text><rect class="f-mut" height="18" rx="0" width="65.0192" x="354" y="130"></rect><text class="t-s t-mono t-b" text-anchor="start" x="423.019" y="144">1127</text><text class="t-b" text-anchor="start" x="536" y="28">MMLU 5-shot</text><text class="t-s" text-anchor="start" x="536" y="62">BF16</text><rect class="f-mut" height="18" rx="0" width="134.455" x="612" y="50"></rect><text class="t-s t-mono t-b" text-anchor="start" x="750.455" y="64">49.3</text><text class="t-s t-b t-rot" text-anchor="start" x="536" y="102">SpinQuant</text><rect class="f-rot" height="18" rx="0" width="129" x="612" y="90"></rect><text class="t-s t-mono t-b" text-anchor="start" x="745" y="104">47.3</text><text class="t-s" text-anchor="start" x="536" y="142">QAT+LoRA</text><rect class="f-mut" height="18" rx="0" width="133.636" x="612" y="130"></rect><text class="t-s t-mono t-b" text-anchor="start" x="749.636" y="144">49.0</text><text class="t-s" text-anchor="start" x="536" y="182">단순 PTQ</text><rect class="f-mut" height="18" rx="0" width="118.091" x="612" y="170"></rect><text class="t-s t-mono t-b" text-anchor="start" x="734.091" y="184">43.3</text><text class="t-s t-mut" text-anchor="start" x="20" y="250">Llama 3.2 1B, 휴대폰 OnePlus 12. 양자화판은 W4A8 — 온라인 하다마드 없음.</text></svg></g></g></g></g></svg>
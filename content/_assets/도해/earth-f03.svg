  background-color:var(--panel); border:1px solid var(--rule); padding:.6rem .4rem }.frame svg{ display:block; width:100%; height:auto }svg text{ font-family:var(--f-sans); fill:var(--ink); font-size:13px }svg .tl{ font-size:13.5px }svg .ts{ font-size:12.5px }svg .tn{ font-family:var(--f-mono); font-size:12px }svg .tb{ font-weight:700 }svg .tn.tb{ font-weight:600 }svg .t-on{ fill:var(--on) }.f-umber{fill:var(--umber)}.f-blue-l{fill:var(--blue-l)}.f-panel{fill:var(--panel)}.s-blue{stroke:var(--blue)}svg line, svg path, svg polyline, svg rect, svg circle{ stroke-width:1 }.nostroke{ stroke:none }svg pattern line{ stroke-width:1.1 }svg.pz-root{width:600px!important;height:290px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="세 기둥을 같은 높이로 맞춘 비교. 섬 100·80·80, 열 나라 2020년 520·510·510, 23개국 2025년 620·약 630·550. 세 층의 두께가 거의 같다." class="pz-inner" height="100%" id="lay" role="img" style="" viewBox="0 0 600 290" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern height="6" id="lay-hb" patternTransform="rotate(45)" patternUnits="userSpaceOnUse" width="6"><line class="s-
<circle class="f-inf" cx="484.4" cy="287.1" r="5"></circle>
<circle class="f-mute" cx="371.0" cy="356.0" r="2.6"></circle>
<line class="s-inf w15" x1="371.0" x2="371.0" y1="356.0" y2="219.1"></line>
<circle class="f-inf" cx="371.0" cy="219.1" r="5"></circle>
<path class="f-none s-inf w15" d="M478.4,283.1 C434.4,247.1 441.0,193.1 380.0,216.1" marker-end="url(#f19-ar-inf)"></path>
<text class="t-s t-inf" text-anchor="middle" x="443.7" y="187.1">대비를 높이고 초점을 흐리면</text>
<text class="t-s t-inf" text-anchor="middle" x="443.7" y="201.1">양·질은 깎이고 강도는 오름</text>
<text class="t-s t-b" text-anchor="start" x="133.6" y="197.6">냄새</text>
<text class="t-s t-mute" text-anchor="start" x="133.6" y="211.6">양도 질도 바닥</text>
<text class="t-s t-b" text-anchor="start" x="249.1" y="162.2">아이가 처음 본 사자</text>
<text class="t-s t-b" text-anchor="start" x="308.8" y="274.0">정사각형</text>
<text class="t-s t-b" text-anchor="end" x="442.0" y="365.1">모래 더미</text>
<text class="t-s t-b" text-anchor="start" x="592.6" y="266.8">파르테논</text>
<text class="t-s t-b" text-anchor="start" x="493.4" y="291.1">정밀 사진</text>
<text class="t-s t-b" text-anchor="end" x="362.0" y="223.1">고대비 사진</text>
<text class="t-s t-b" x="470" y="30">비트로 재면 (강의의 셈)</text>
<text class="t-s t-num" x="470" y="48">10×10 흑백 격자, 아무 무늬: 2¹⁰⁰가지 → 100비트</text>
<text class="t-s t-num" x="470" y="64"><tspan class="t-cry">정사각형만</tspan> 올 때: 385가지 → 약 8.6비트</text>
<text class="t-s t-num" x="470" y="84">10⁶ 화소 256계조 8×10⁶ 비트 → 흑백 1×10⁶ 비트</text>
<text class="t-s t-num" x="470" y="100"><tspan class="t-inf">고대비</tspan>: 비트는 8분의 1인데 윤곽은 더 또렷</text>
<text class="t-s t-mute" x="470" y="122">질은 값을 12배 깎고, 강도는 비트를 줄여도 오를 수 있다</text>
<text class="t t-b" x="16" y="436">셋째 축은 앞의 두 축의 조합으로 만들어지지 않는다</text>
<text class="t-s t-mute" text-anchor="end" x="744" y="436">눈금 없는 정성적 배치</text>
</svg></svg>
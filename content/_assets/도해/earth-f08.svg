5.0">100</text><text class="tx" text-anchor="middle" x="522.0" y="134.0">= 공장 한 채</text><text class="tl tb" text-anchor="middle" x="142.0" y="290.0">병 (가계)</text><text class="tl tb" text-anchor="middle" x="342.0" y="290.0">회사</text><text class="tl tb" text-anchor="middle" x="522.0" y="290.0">섬 전체</text><path class="s-violet f-none sw2 dash" d="M188,107.6 C240,107.6 250,232.4 294,232.4" marker-end="url(#qg-ar)"></path><text class="ts" text-anchor="middle" x="242.0" y="106.0">짝지어 지워진다</text><text class="ts t2" text-anchor="middle" x="142.0" y="24.0">가계의 부에서는 보인다</text><text class="ts t2" text-anchor="middle" x="522.0" y="24.0">국가 순자산에서는 사라진다</text><text class="tl t2 tb" text-anchor="middle" x="242.0" y="290.0">+</text><text class="tl t2 tb" text-anchor="middle" x="431.0" y="290.0">=</text></svg></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 420" width="600" height="420" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --flour:#EFF0EB; --flour-2:#E6E8E1; --ink:#1C2025; --ink-soft:#4E555D; --rule:#C7CAC1;
  --iron:#3D4652; --water:#1B7480; --spirit:#6448B0; --grain:#A8721A; --rust:#BF4128;
  --water-t:rgba(27,116,128,.12); --spirit-t:rgba(100,72,176,.11); --grain-t:rgba(168,114,26,.13); --rust-t:rgba(191,65,40,.10); --iron-t:rgba(61,70,82,.10);
  --shadow:rgba(28,32,37,.18);
  --display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --body:"Newsreader","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --label:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","Nanum Gothic Coding",ui-monospace,Menlo,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }}:root[data-theme="dark"]{
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents }.lec-no svg{ width:2.2rem; height:2.2rem; flex:none }.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; overflow-y:hidden; border-block:1px solid var(--rule); padding-block:.8rem; background:linear-gradient(to right, var(--flour) 30%, transparent), linear-gradient(to left, var(--flour) 30%, transparent) 100% 0, radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) 100% 0; background-repeat:no-repeat; background-size:2.2rem 100%, 2.2rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; margin-inline:auto; max-width:46rem }.t{ fill:var(--ink); font-family:var(--label); font-size:13px }.t-soft{ fill:var(--ink-soft) }.t-iron{ fill:var(--iron) }.t-water{ fill:var(--water) }.t-spirit{ fill:var(--spirit) }.t-grain{ fill:var(--grain) }.t-b{ font-weight:600 }.t-sm{ font-size:11.5px }.t-lg{ font-size:15px }.halo{ paint-order:stroke; stroke:var(--flour); stroke-width:4px; stroke-linejoin:round }.s-iron{ stroke:var(--iron); fill:none }.s-water{ stroke:var(--water); fill:none }.s-spirit{ stroke:var(--spirit); fill:none }.s-grain{ stroke:var(--grain); fill:none }.f-bg{ fill:var(--flour) }.f-water{ fill:var(--water) }.f-spirit{ fill:var(--spirit) }.f-grain{ fill:var(--grain) }.f-iron-t{ fill:var(--iron-t) }.f-spirit-t{ fill:var(--spirit-t) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.dot{ stroke-dasharray:1.5 4; stroke-linecap:round }svg.pz-root{width:600px!important;height:420px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="개인 자아들은 각자의 뇌 위에서 돌지만, 그 위에 공유된 목적의 층이 생겨 여러 뇌에 걸쳐 구현되고, 그 층이 문명의 크기에서 '신'으로 표상된다. 사랑은 서로 안에서 같은 층을 알아보는 일이다." class="pz-inner" data-min="520" height="100%" role="img" style="" viewBox="0 0 600 420" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="f20-s" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spirit" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f20-g" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-grain" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f20-w" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-water" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 척도 띠: 공유된 목적의 층 -->
<rect class="f-spirit-t s-spirit w15" height="96" rx="6" width="560" x="20" y="16"></rect>
<text class="t t-b t-spirit" text-anchor="middle" x="300" y="40">공유된 목적의 층 — 여러 뇌에 걸친 자아</text>
<text class="t t-sm t-soft" text-anchor="middle" x="300" y="58">최대화하는 자가 '나'에서 '우리'로 올라간다</text>
<!-- 크기에 따른 이름 -->
<g>
<text class="t t-sm t-spirit" text-anchor="middle" x="88" y="92">두 사람 — 사랑</text>
<text class="t t-sm t-spirit" text-anchor="middle" x="230" y="92">가족·팀 — 배</text>
<text class="t t-sm t-spirit" text-anchor="middle" x="370" y="92">나라 — 집단 행위자</text>
</g>
<rect class="f-bg s-spirit w2" height="28" rx="14" width="118" x="452" y="74"></rect>
<text class="t t-b t-lg t-spirit" text-anchor="middle" x="511" y="93">문명 — '신'</text>
<line class="s-spirit w1" marker-end="url(#f20-s)" x1="150" x2="174" y1="88" y2="88"></line>
<line class="s-spirit w1" marker-end="url(#f20-s)" x1="286" x2="304" y1="88" y2="88"></line>
<line class="s-spirit w1" marker-end="url(#f20-s)" x1="436" x2="448" y1="88" y2="88"></line>
<!-- 각 뇌에서 위로: 층의 구현 -->
<g class="s-water w15">
<line marker-end="url(#f20-w)" x1="110" x2="110" y1="196" y2="116"></line>
<line marker-end="url(#f20-w)" x1="300" x2="300" y1="196" y2="116"></line>
<line marker-end="url(#f20-w)" x1="490" x2="490" y1="196" y2="116"></line>
</g>
<text class="t t-sm t-water halo" x="497" y="160">같은 명세를 돌림</text>
<!-- 사랑: 서로 안에서 같은 층을 알아봄 -->
<line class="s-grain w15" marker-end="url(#f20-g)" x1="146" x2="200" y1="204" y2="120"></line>
<line class="s-grain w15" marker-end="url(#f20-g)" x1="264" x2="210" y1="204" y2="120"></line>
<circle class="f-grain" cx="205" cy="112" r="5"></circle>
<text class="t t-sm t-grain t-b" text-anchor="middle" x="205" y="172">사랑</text>
<text class="t t-sm t-grain" text-anchor="middle" x="205" y="196">같은 층을 알아봄</text>
<!-- 개인 자아 (영) -->
<g class="f-bg s-spirit w15">
<ellipse cx="110" cy="220" rx="56" ry="20"></ellipse>
<ellipse cx="300" cy="220" rx="56" ry="20"></ellipse>
<ellipse cx="490" cy="220" rx="56" ry="20"></ellipse>
</g>
<text class="t t-spirit" text-anchor="middle" x="110" y="225">자아 A</text>
<text class="t t-spirit" text-anchor="middle" x="300" y="225">자아 B</text>
<text class="t t-spirit" text-anchor="middle" x="490" y="225">자아 C</text>
<!-- 각 자아는 자기 뇌 위에서 돈다 -->
<g class="s-water w15 dot">
<line x1="110" x2="110" y1="240" y2="262"></line>
<line x1="300" x2="300" y1="240" y2="262"></line>
<line x1="490" x2="490" y1="240" y2="262"></line>
</g>
<text class="t t-sm t-soft" x="118" y="258">각자 자기 뇌 위에서 돈다</text>
<!-- 뇌 (쇠) -->
<rect class="f-iron-t" height="104" rx="6" width="560" x="20" y="268"></rect>
<g class="s-iron w2 f-bg">
<path class="f-bg s-iron w2" d="M66,300 C66,280 92,274 110,282 C128,274 154,280 154,300 C162,312 154,334 136,336 C126,346 94,346 84,336 C66,334 58,312 66,300 z"></path>
<path class="f-bg s-iron w2" d="M256,300 C256,280 282,274 300,282 C318,274 344,280 344,300 C352,312 344,334 326,336 C316,346 284,346 274,336 C256,334 248,312 256,300 z"></path>
<path class="f-bg s-iron w2" d="M446,300 C446,280 472,274 490,282 C508,274 534,280 534,300 C542,312 534,334 516,336 C506,346 474,346 464,336 C446,334 438,312 446,300 z"></path>
</g>
<g class="s-iron w1">
<path d="M110,284 L110,340"></path><path d="M86,300 q12,8 24,0"></path><path d="M110,318 q14,8 26,-2"></path>
<path d="M300,284 L300,340"></path><path d="M276,300 q12,8 24,0"></path><path d="M300,318 q14,8 26,-2"></path>
<path d="M490,284 L490,340"></path><path d="M466,300 q12,8 24,0"></path><path d="M490,318 q14,8 26,-2"></path>
</g>
<text class="t t-sm t-iron" text-anchor="middle" x="110" y="364">뇌 1</text>
<text class="t t-sm t-iron" text-anchor="middle" x="300" y="364">뇌 2</text>
<text class="t t-sm t-iron" text-anchor="middle" x="490" y="364">뇌 3</text>
<!-- 뇌 사이 틈 -->
<text class="t t-sm t-soft" text-anchor="middle" x="205" y="316">서로 다른 기층</text>
<text class="t t-sm t-soft" text-anchor="middle" x="395" y="316">이어진 선 없음</text>
<!-- 범례 줄 -->
<text class="t t-sm t-iron" x="20" y="400">쇠 — 각자의 뇌</text>
<text class="t t-sm t-spirit" x="150" y="400">보라 — 자아와 그 위의 층</text>
<text class="t t-sm t-water" x="330" y="400">물 — 구현</text>
<text class="t t-sm t-grain" x="430" y="400">밀 — 알아봄(사랑)</text>
</svg></g></g></g></g></svg>
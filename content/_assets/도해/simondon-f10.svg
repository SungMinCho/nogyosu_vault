<text class="t-s t-mute t-num" text-anchor="end" x="439" y="80">0</text>
<text class="t-s t-mute t-num" text-anchor="end" x="439" y="175.0">−50</text>
<text class="t-s t-mute t-num" text-anchor="end" x="439" y="270.0">−100</text>
<text class="t-s t-mute" text-anchor="middle" x="446" y="325.4">ΔG, J/mol</text>
<rect class="f-liq-soft" height="10.6" width="90" x="510" y="288.8"></rect>
<line class="s-liq w4" x1="452" x2="510" y1="76" y2="76"></line>
<line class="s-mute w1 dash" x1="510" x2="510" y1="76" y2="288.8"></line>

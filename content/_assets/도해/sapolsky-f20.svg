<text class="t-s" text-anchor="middle" x="73" y="228">머리 평범</text>
<text class="t-s" text-anchor="middle" x="73" y="248">얼굴 평범</text>
<path class="f-grid ln" d="M148,96 L308,96 L308,320 L148,320 Z M158,106 L158,310 L298,310 L298,106 Z" fill-rule="evenodd"></path>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 790 300" width="790" height="300" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .f-ink{ fill:var(--ink) }.dg .f-mut{ fill:var(--muted) }.dg .f-spike{ fill:var(--spike) }.dg .tag-n{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:790px!important;height:300px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="큰 채널 둘이 한 블록에 몰려 있으면 블록 안 회전 뒤에도 그 블록 값이 크지만, 지그재그로 나눠 주면 두 블록이 비슷해져 최댓값이 내려간다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 790 300" width="100%"><defs><marker id="i2-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-b t-spike" text-anchor="start" x="20" y="30">원래 순서 — 큰 둘이 한 블록에</text><rect class="tag-n" height="160" rx="6" width="136" x="14" y="46"></rect><text class="t-s t-b" text-anchor="middle" x="82" y="64">블록 1</text><rect class="f-spike" height="128" rx="0" width="22" x="20" y="72"></rect><text class="t-s t-mono" text-anchor="middle" x="31" y="68">40</text><rect class="f-spike" height="96" rx="0" width="22" x="50" y="104"></rect><text class="t-s t-mono" text-anchor="middle" x="61" y="100">30</text><rect class="f-mut" height="3.2" rx="0" width="22" x="80" y="196.8"></rect><text class="t-s t-mono" text-anchor="middle" x="91" y="190">1</text><rect class="f-mut" height="6.4" rx="0" width="22" x="110" y="193.6"></rect><text class="t-s t-mono" text-anchor="middle" x="121" y="190">2</text><text class="t-s t-mono" text-anchor="middle" x="82" y="222">돌린 뒤 원소 ≈ 25</text><rect class="tag-n" height="160" rx="6" width="136" x="164" y="46"></rect><text class="t-s t-b" text-anchor="middle" x="232" y="64">블록 2</text><rect class="f-mut" height="4.8" rx="0" width="22" x="170" y="195.2"></rect><text class="t-s t-mono" text-anchor="middle" x="181" y="190">1.5</text><rect class="f-mut" height="9.6" rx="0" width="22" x="200" y="190.4"></rect><text class="t-s t-mono" text-anchor="middle" x="211" y="186.4">3</text><rect class="f-mut" height="3.2" rx="0" width="22" x="230" y="196.8"></rect><text class="t-s t-mono" text-anchor="middle" x="241" y="190">1</text><rect class="f-mut" height="8" rx="0" width="22" x="260" y="192"></rect><text class="t-s t-mono" text-anchor="middle" x="271" y="190">2.5</text><text class="t-s t-mono" text-anchor="middle" x="232" y="222">돌린 뒤 원소 ≈ 2.2</text><text class="t-b t-rot" text-anchor="start" x="420" y="30">지그재그 — 블록마다 큰 것 하나씩</text><rect class="tag-n" height="160" rx="6" width="136" x="414" y="46"></rect><text class="t-s t-b" text-anchor="middle" x="482" y="64">블록 1</text><rect class="f-spike" height="128" rx="0" width="22" x="420" y="72"></rect><text class="t-s t-mono" text-anchor="middle" x="431" y="68">40</text><rect class="f-mut" height="8" rx="0" width="22" x="450" y="192"></rect><text class="t-s t-mono" text-anchor="middle" x="461" y="190">2.5</text><rect class="f-mut" height="6.4" rx="0" width="22" x="480" y="193.6"></rect><text class="t-s t-mono" text-anchor="middle" x="491" y="190">2</text><rect class="f-mut" height="3.2" rx="0" width="22" x="510" y="196.8"></rect><text class="t-s t-mono" text-anchor="middle" x="521" y="190">1</text><text class="t-s t-mono" text-anchor="middle" x="482" y="222">돌린 뒤 원소 ≈ 20</text><rect class="tag-n" height="160" rx="6" width="136" x="564" y="46"></rect><text class="t-s t-b" text-anchor="middle" x="632" y="64">블록 2</text><rect class="f-spike" height="96" rx="0" width="22" x="570" y="104"></rect><text class="t-s t-mono" text-anchor="middle" x="581" y="100">30</text><rect class="f-mut" height="9.6" rx="0" width="22" x="600" y="190.4"></rect><text class="t-s t-mono" text-anchor="middle" x="611" y="186.4">3</text><rect class="f-mut" height="4.8" rx="0" width="22" x="630" y="195.2"></rect><text class="t-s t-mono" text-anchor="middle" x="641" y="190">1.5</text><rect class="f-mut" height="3.2" rx="0" width="22" x="660" y="196.8"></rect><text class="t-s t-mono" text-anchor="middle" x="671" y="190">1</text><text class="t-s t-mono" text-anchor="middle" x="632" y="222">돌린 뒤 원소 ≈ 15</text><text class="t-s t-mut" text-anchor="start" x="20" y="268">블록 안 회전은 이상치를 그 블록 안에서만 편다. 토큰의 최댓값(눈금을 정하는 값) 25 → 20.</text><text class="t-s t-mut" text-anchor="start" x="20" y="288">지그재그 순서: 크기 순으로 블록 1, 2, 2, 1, 1, 2, 2, 1 … 왕복하며 나눠 준다.</text></svg></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 304" width="760" height="304" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E7EAE8; --panel:#F3F5F4; --code-bg:#EEF1F0;
  --ink:#1B2224; --muted:#586365; --rule:#C1C9C8; --rule-soft:rgba(27,34,36,.07);
  --if:#2A5687; --if-soft:rgba(42,86,135,.12); --if-deep:#15375C;
  --ore:#8A6014; --ore-soft:rgba(138,96,20,.15);
  --cx:#7A3B72; --cx-soft:rgba(122,59,114,.12);
  --flag:#B3381B; --flag-soft:rgba(179,56,27,.10);
  --canary:#E9B30C;
  --f-body:"Source Serif 4","Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-disp:"Do Hyeon","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --f-label:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1416; --panel:#161D20; --code-bg:#131A1D;
    --ink:#E1E7E6; --muted:#95A1A3; --rule:#2F3A3D; --rule-soft:rgba(225,231,230,.06);
    --if:#7EA7DA; --if-soft:rgba(126,167,218,.16); --if-deep:#3B6AA5;
    --ore:#D6A553; --ore-soft:rgba(214,165,83,.17);
    --cx:#CB8EC2; --cx-soft:rgba(203,142,194,.17);
    --flag:#EF7B57; --flag-soft:rgba(239,123,87,.14);
    --canary:#F4C63A;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1416; --panel:#161D20; --code-bg:#131A1D;
  --ink:#E1E7E6; --muted:#95A1A3; --rule:#2F3A3D; --rule-soft:rgba(225,231,230,.06);
  --if:#7EA7DA; --if-soft:rgba(126,167,218,.16); --if-deep:#3B6AA5;
  --ore:#D6A553; --ore-soft:rgba(214,165,83,.17);
  --cx:#CB8EC2; --cx-soft:rgba(203,142,194,.17);
  --flag:#EF7B57; --flag-soft:rgba(239,123,87,.14);
  --canary:#F4C63A;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1rem 3rem }.lecture{ display:contents }.fig{ margin:.6rem 0 }.frame{ overflow-x:auto; overflow-y:hidden; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding-block:.8rem;
  background-image:linear-gradient(to right,var(--bg),var(--bg)),linear-gradient(to right,var(--bg),var(--bg)),
    linear-gradient(to right,var(--rule),transparent),linear-gradient(to left,var(--rule),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat;
  background-size:1.5rem 100%,1.5rem 100%,.6rem 100%,.6rem 100%; background-attachment:local,local,scroll,scroll }.dg{ display:block; width:100%; height:auto }.dg .t, .hero-svg .t{ font-family:var(--f-label); font-size:13px; fill:var(--ink) }.dg .t-s{ font-size:12px }.dg .t-xs{ font-size:11px }.dg .t-b, .hero-svg .t-b{ font-weight:700 }.dg .t-m{ font-family:var(--f-mono) }.dg .t-mut, .hero-svg .t-mut{ fill:var(--muted) }.dg .t-if, .hero-svg .t-if{ fill:var(--if) }.dg .t-flag{ fill:var(--flag) }.dg line, .dg polyline, .dg path, .hero-svg line, .hero-svg polyline, .hero-svg path{ fill:none }.f-ink{ fill:var(--ink)!important }.f-bg{ fill:var(--bg)!important }.f-panel{ fill:var(--panel)!important }.f-if{ fill:var(--if)!important }.f-if-soft{ fill:var(--if-soft)!important }.f-flag{ fill:var(--flag)!important }.f-flag-soft{ fill:var(--flag-soft)!important }.s-ink{ stroke:var(--ink); stroke-width:1.4 }.s-ink-thin{ stroke:var(--ink); stroke-width:1 }.s-if{ stroke:var(--if); stroke-width:1.4 }.s-flag{ stroke:var(--flag); stroke-width:1.4 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }svg.pz-root{width:760px!important;height:304px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g c
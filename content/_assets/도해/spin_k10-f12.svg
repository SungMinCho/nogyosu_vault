<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 320" width="760" height="320" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-grid{ fill:var(--grid) }.dg .t-pos{ fill:var(--pos) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .ln-grid-hair{ stroke:var(--grid); stroke-width:.8; stroke-dasharray:2 3; opacity:.75 }.dg .ln-mut-hair{ stroke:var(--muted); stroke-width:1 }.dg .f-spike{ fill:var(--spike) }.dg .ser-mx{ fill:none; stroke:var(--c-mx); stroke-width:2 }.dg .ser-ink{ fill:none; stroke:var(--ink); stroke-width:2 }.dg .halo{ paint-order:stroke; stroke:var(--paper); stroke-width:4px; stroke-linejoin:round }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:760px!important;height:320px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="루프라인 도식. 산술 강도가 작은 디코딩은 메모리 묶임, 큰 프리필은 연산 묶임이고, 정밀도를 낮추면 계산 천장이 올라가 능선이 오른쪽으로 간다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 760 320" width="100%"><line class="ln-hair" x1="80" x2="80" y1="40" y2="260"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="80" y="278">1</text><line class="ln-hair" x1="200" x2="200" y1="40" y2="260"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="200" y="278">10</text><line class="ln-hair" x1="320" x2="320" y1="40" y2="260"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="320" y="278">100</text><line class="ln-hair" x1="440" x2="440" y1="40" y2="260"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="440" y="278">1,000</text><line class="ln-hair" x1="560" x2="560" y1="40" y2="260"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="560" y="278">10,000</text><line class="ln" x1="80" x2="560" y1="260" y2="260"></line><line class="ln" x1="80" x2="80" y1="40" y2="260"></line><text class="t-s t-mut" text-anchor="middle" x="320" y="300">산술 강도 I (FLOP/바이트, 로그)</text><text class="t-s t-mut" text-anchor="start" x="70" y="26">낼 수 있는 속도 (로그, 도식)</text><polyline class="ser-ink" points="80.0,260.0 377.3,89.7 560.0,89.7"></polyline><text class="t-s t-b" text-anchor="start" x="568" y="93.6979">16비트 연산</text><line class="ln-grid-hair" x1="377.255" x2="377.255" y1="89.6979" y2="260"></line><polyline class="ser-mx" points="80.0,260.0 449.5,48.3 560.0,48.3"></polyline><text class="t-s t-b t-rot" text-anchor="start" x="568" y="52.3063">4비트 연산</text><line class="ln-grid-hair" x1="449.502" x2="449.502" y1="48.3063" y2="260"></line><text class="t-s t-grid" text-anchor="end" x="373.255" y="252">능선</text><text class="t-s t-grid" text-anchor="start" x="453.502" y="252">능선 →</text><circle class="f-spike" cx="152.2" cy="218.6" r="5"></circle><text class="t-s t-b halo" text-anchor="start" x="162.247" y="236.608">디코딩 b = 1 (I ≈ 4)</text><circle class="f-spike" cx="296.7" cy="135.8" r="5"></circle><text class="t-s t-b halo" text-anchor="start" x="306.742" y="153.825">b = 16 (I ≈ 64)</text><circle class="f-spike" cx="513.5" cy="48.3" r="5"></circle><line class="ln-mut-hair" x1="513.483" x2="513.483" y1="54.3063" y2="115.698"></line><text class="t-s t-b halo" text-anchor="middle" x="513.483" y="129.698">프리필 b = 1024</text><text class="t-s halo" text-anchor="middle" x="513.483" y="145.698">(I ≈ 4,096)</text><text class="t-s t-b t-pos" text-anchor="start" x="121.091" y="110.394">메모리 묶임</text><text class="t-s t-mut" text-anchor="start" x="121.091" y="126.394">바이트를 줄이면 빨라진다</text><text class="t-s t-b t-pos" text-anchor="middle" x="461.131" y="18.3063">연산 묶임</text><text class="t-s t-mut" text-anchor="middle" x="461.131" y="34.3063">4비트 연산 명령이 있어야 빨라진다</text></svg></g></g></g></g></svg>
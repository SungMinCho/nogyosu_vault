"pz-w fig"><g class="pz-w fig-frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="두 줄이 같은 시간축을 쓴다. 윗줄 결정은 씨앗 하나에 정보를 처음 한 번만 받고 똑같은 층을 빠르게 되풀이하다 안정한 평형으로 굳는다. 아랫줄 생명은 같은 씨앗에서 출발하지만 굳기 직전에 멈춰, 굳지 않은 채 가지를 치며 넓어지고 바깥 정보를 시간을 두고 여러 번 받는다. 왼쪽 아래 거대분자 수준이 갈림길이고 그 밑은 전물리적·전생명적이다. 네오테니는 식물이 번식의 한순간에만 쓰는 정보 수용의 시기를 동물이 길게 붙드는 것이다." class="pz-inner" height="100%" role="img" viewBox="0 0 760 422" width="100%">

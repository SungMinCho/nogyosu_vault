6"></rect><line class="ln" x1="383" x2="383" y1="56" y2="136"></line><line class="ln" x1="318" x2="448" y1="96" y2="96"></line><text class="ts c" x="350.5" y="49">그루</text><text class="ts c" x="415.5" y="49">블린</text><text class="ts r" x="311" y="81">O</text><text class="ts r" x="311" y="121">¬O</text><text class="ts c bgtext" x="350.5" y="76">초록</text><text class="ts c" x="415.5" y="81">파랑</text><text class="ts c" x="350.5" y="121">파랑</text><text class="ts c bgtext" x="415.5" y="121">초록</text><g class="dot-cu"><circle cx="330" cy="87" r="2.6"></circle><circle cx="340" cy="87" r="2.6"></circle><circle cx="350" cy="87" r="2.6"></circle><circle cx="360" cy="87" r="2.6"></circle><circle cx="370" cy="87" r="2.6"></circle></g>
<text class="tm c" x="127" y="22">초록·파랑이 원초일 때</text>
<text class="tm c" x="383" y="22">그루·블린이 원초일 때</text>

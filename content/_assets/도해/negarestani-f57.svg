  --cu-soft:rgba(154,91,46,.10); --vg-soft:rgba(47,125,109,.10); --pb-soft:rgba(43,76,126,.10); --vm-soft:rgba(194,65,43,.08);
  --f-display:"Hahmlet","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-latin:"EB Garamond","Noto Serif KR",Georgia,serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem;
}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}}:root[data-theme="dark"]{
  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}.vg{color:var(--vg)}.vm{color:var(--vm)}svg.defs{position:absolute;width:0;height:0;overflow:hidden}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-inline:var(--pad);padding-block:0 4rem}.lecture{display:contents}.webwrap svg{display:block;width:100%;height:auto}.sw-dot.vg{background:var(--vg)}.sw-dot.vm{background:var(--vm)}figure.fig{border:1px solid var(--mark);background:var(--plate);padding:.75rem .75rem .6rem;margin-block:.6rem}.figscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  background:linear-gradient(to right,var(--plate) 30%,transparent),linear-gradient(to left,var(--plate) 30%,transparent) 100% 0,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) 100% 0;
  background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;background-attachment:local,local,scroll,scroll}figure.fig svg{display:block;width:100%;height:auto;min-width:27rem}@media (max-width:34rem){.doc>figure.fig,.lecture>figure.fig{width:calc(100% + var(--pad)*2);max-width:none;margin-inline:calc(var(--pad)*-1);border-inline:0;padding-inline:.6rem}}.terms li.vg{color:var(--vg);background:var(--vg-soft)}.terms li.vm{color:var(--vm);background:var(--vm-soft)}svg .ln,svg .ln-cu,svg .ln-vg,svg .ln-pb,svg .ln-vm{stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}svg .ln:not([fill]),svg .ln-cu:not([fill]),svg .ln-vg:not([fill]),svg .ln-pb:not([fill]),svg .ln-vm:not([fill]){fill:none}svg .ln{stroke:var(--ink)}svg .ln-cu{stroke:var(--cu)}svg .ln-vm{stroke:var(--vm)}svg g.ln-vg>rect:not([fill]),svg g.ln-cu>rect:not([fill]),svg g.ln-pb>rect:not([fill]),svg g.ln-vm>rect:not([fill]){fill:none}svg .faint,svg g.faint>*,svg g>.faint{stroke:var(--mark)}svg .dash,svg g.dash>*{stroke-dasharray:4 4}svg text{fill:var(--ink);font-family:var(--f-body)}svg .ts{font-size:13px}svg .tm{font-family:var(--f-mono);font-size:11px}svg .c{text-anchor:middle}svg .r{text-anchor:end}svg text.cu{fill:var(--cu)}svg text.vg{fill:var(--vg)}svg text.pb{fill:var(--pb)}svg text.vm{fill:var(--vm)}.m .sq>.rt path{fill:none;stroke:currentColor;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}.m .sq>.rt path.rh{stroke-width:1.6px}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="대각선 악마와 라플라스 학습자 — 라플라스 규칙은 순서를 보지 않아서 교대 패턴의 악마 앞에서 영영 0.5를 넘지 못한다" height="100%" role="img" viewBox="0 0 480 250" width="100%" xmlns="http://www.w3.org/2000/svg">
<line class="ln faint" x1="50" x2="460" y1="200" y2="200"></line>
<line class="ln-vm dash" x1="50" x2="460" y1="80" y2="80"></line>
<text class="tm r vm" x="456" y="72">0.5 — 넘지 못하는 선</text>
<rect class="ln-cu" fill="url(#h-cu)" height="120.0" width="20" x="60" y="80.0"></rect><text class="tm c" x="70" y="222">1</text><rect class="ln-cu" fill="url(#h-cu)" height="80.0" width="20" x="92" y="120.0"></rect><text class="tm c" x="102" y="222">0</text><rect class="ln-cu" fill="url(#h-cu)" height="120.0" width="20" x="124" y="80.0"></rect><text class="tm c" x="134" y="222">1</text><rect class="ln-cu" fill="url(#h-cu)" height="96.0" width="20" x="156" y="104.0"></rect><text class="tm c" x="166" y="222">0</text><rect class="ln-cu" fill="url(#h-cu)" height="120.0" width="20" x="188" y="80.0"></rect><text class="tm c" x="198" y="222">1</text><rect class="ln-cu" fill="url(#h-cu)" height="102.9" width="20" x="220" y="97.1"></rect><text class="tm c" x="230" y="222">0</text><rect class="ln-cu" fill="url(#h-cu)" height="120.0" width="20" x="252" y="80.0"></rect><text class="tm c" x="262" y="222">1</text><rect class="ln-cu" fill="url(#h-cu)" height="106.7" width="20" x="284" y="93.3"></rect><text class="tm c" x="294" y="222">0</text><rect class="ln-cu" fill="url(#h-cu)" height="120.0" width="20" x="316" y="80.0"></rect><text class="tm c" x="326" y="222">1</text><rect class="ln-cu" fill="url(#h-cu)" height="109.1" width="20" x="348" y="90.9"></rect><text class="tm c" x="358" y="222">0</text><rect class="ln-cu" fill="url(#h-cu)" height="120.0" width="20" x="380" y="80.0"></rect><text class="tm c" x="390" y="222">1</text><rect class="ln-cu" fill="url(#h-cu)" height="110.8" width="20" x="412" y="89.2"></rect><text class="tm c" x="422" y="222">0</text>
<text class="tm" x="50" y="242">세계의 비트 1, 0, 1, 0, … — 악마는 학습자가 1에 0.5 넘게 걸면 0을 낸다</text>
<text class="ts" x="56" y="30">실제 결과에 준 확률: ½, ⅓, ½, ⅖, ½, ³⁄₇, …</text>
<text class="tm vg" x="56" y="48">(s+1)/(n+2)는 순서를 보지 않는다 → 교대 패턴을 영영 못 배운다</text>
</svg></svg>
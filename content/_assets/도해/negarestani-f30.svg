<line class="ln-pb" x1="64" x2="440" y1="234" y2="234"></line>
<g class="dot-cu"><circle cx="64" cy="234" r="1.8"></circle><circle cx="82" cy="234" r="2.2"></circle><circle cx="102" cy="234" r="2.6"></circle><circle cx="124" cy="234" r="3"></circle><circle cx="148" cy="234" r="3.4"></circle><circle cx="174" cy="234" r="3.8"></circle></g>
<circle class="dot-cu" cx="440" cy="234" r="6"></circle><circle class="dot-cu" cx="380" cy="234" r="4"></circle><circle class="dot-cu" cx="320" cy="234" r="4"></circle><circle class="dot-cu" cx="260" cy="234" r="4"></circle><circle class="dot-cu" cx="200" cy="234" r="4"></circle>
<text class="tm c" x="240" y="276">자연수를 끝없이 세는 사람 ↔ 집합 ℕ을 한 대상으로 쥐는 수학자</text>
<text class="ts c vm" x="240" y="297">이율배반은 절대자를 과거 상태의 계열로 센 지성의 거짓 문제</text>
</svg></g></g></g></g></svg>
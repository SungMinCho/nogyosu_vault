s b t-alarm" text-anchor="middle" x="545.0" y="24.0">「매드니스」 — 고리가 문에서 멈춘다</text><rect class="f-copy-s s-ink w15" height="120.0" rx="0" width="140.0" x="390.0" y="60.0"></rect><text class="s b" text-anchor="middle" x="460.0" y="84.0">스크린</text><ellipse class="s-copy w15" cx="460" cy="130" rx="42" ry="22"></ellipse><path class="s-copy w15" d="M498,121 L500,126" marker-end="url(#f18-a-copy)"></path><text class="xs" text-anchor="middle" x="460.0" y="134.0">케인 ⇄ 옛것들</text><text class="xs t-copy" text-anchor="middle" x="460.0" y="168.0">이상한 고리</text><line class="s-ink w3" x1="560.0" x2="560.0" y1="46.0" y2="206.0"></line><text class="xs" text-anchor="middle" x="560.0" y="222.0">극장 문</text><line class="s-alarm w2" x1="532.0" x2="553.0" y1="96.0" y2="96.0"></line><line class="s-alarm w3" x1="554.0" x2="554.0" y1="86.0" y2="106.0"></line><text class="xs t-alarm" text-anchor="middle" x="575.0" y="40.0">침범할 수 없는 층</text><rect class="f-paper s-ink w15" height="120.0" rx="0" width="110.0" x="590.0" y="60.0"></rect><text class="s b" text-anchor="middle" x="645.0" y="116.0">거리·서점</text><text class="xs mut" text-anchor="middle" x="645.0" y="134.0">케인 소설은 없다</text></svg></svg>
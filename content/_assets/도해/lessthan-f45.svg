<rect class="f-void s-muted w1" height="48" width="120" x="170" y="96"></rect>
<text class="t-mid t-b f-onvoid" x="230" y="125">무 · 공백</text>
<line class="s-ink w3" marker-end="url(#L15-3-ar-ink)" x1="230" x2="230" y1="262" y2="146"></line>
<circle class="f-ink" cx="230" cy="264" r="5"></circle>
<text class="t-s t-b" x="244" y="168">닿아서 정지 — 멸종</text>
<text class="t-mid t-s t-muted" x="230" y="286">유기체 · 물질</text>
<!-- 라캉 -->
<path class="f-none s-flesh w3" d="M510,212 A120,48 0 0,1 750,212" marker-end="url(#L15-3-ar-flesh)"></path>
<path class="f-none s-flesh w3" d="M750,212 A120,48 0 0,1 510,212" marker-end="url(#L15-3-ar-flesh)"></path>
<circle class="f-void s-muted w1" cx="630" cy="212" r="22"></circle>
<text class="t-mid t-s f-onvoid" x="630" y="216">공백</text>
<line class="s-flesh w15 dot" x1="690" x2="690" y1="124" y2="164"></line>
<text class="t-s t-b f-flesh" x="700" y="150">0에 닿지 못한다</text>
<!-- 아래 라벨 -->
<text class="t-mid t-b" x="230" y="330">브라시에의 프로이트</text>
<text class="t-mid t-s" x="230" y="350">멸종의 오르가논 · 무에의 의지</text>
<text class="t-mid t-s t-muted" x="230" y="368">열반 원리와 뒤섞음 — 거짓 진공을 바람</text>
<text class="t-mid t-b f-flesh" x="630" y="330">라캉의 프로이트</text>
<text class="t-mid t-s" x="630" y="350">언데드 반복강박 · 모든 공백을 교란</text>
<text class="t-mid t-s t-muted" x="630" y="368">멈추지 못한다 — <tspan class="t-la t-it">eppur si muove</tspan></text>
<line class="s-rule w1" x1="30" x2="830" y1="384" y2="384"></line>
<text class="t-mid t-l t-b" x="430" y="410">무(멸종) <tspan class="t-muted">대</tspan> <tspan class="f-flesh">무보다 적은 것(그래도 그것은 움직인다)</tspan></text>
</svg></g></g></g></g></g></svg>
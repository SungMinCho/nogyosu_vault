<text class="t-s" x="100" y="123">혼돈의 흐름</text>
<!-- 오른쪽 쌓기 -->
<rect class="f-panel s-ink w15" height="40" rx="4" width="190" x="306" y="52"></rect>
<text class="t-s t-muted" x="316" y="77">위층</text>
<path class="f-none s-ink w15" d="M350,72 q3,-7 6,0 t6,0 t6,0 t6,0"></path>
<text class="t-s" x="382" y="77">흐름 — 상위 층위</text>
<rect class="f-rule2 s-ink w15" height="40" rx="4" width="190" x="306" y="98"></rect>
<line class="s-ink w3" x1="306" x2="496" y1="138" y2="138"></line>
<text class="t-s t-muted" x="316" y="123">바탕</text>
<rect class="f-rule s-ink w1" height="9" width="9" x="352" y="109"></rect>
<rect class="f-rule s-ink w1" height="9" width="9" x="363" y="109"></rect>
<rect class="f-rule s-ink w1" height="9" width="9" x="352" y="120"></rect>
<rect class="f-rule s-ink w1" height="9" width="9" x="363" y="120"></rect>
<text class="t-s" x="382" y="123">이산적 양자</text>
<!-- 교차 -->
<line class="s-ink w2" marker-end="url(#L15-1-ar-ink)" x1="218" x2="300" y1="118" y2="74"></line>
<line class="s-ink w15 dash" marker-end="url(#L15-1-ar-ink)" x1="218" x2="300" y1="72" y2="116"></line>
<text class="t-mid t-s t-b" x="260" y="158">흐름이 위로</text>
<text class="t-mid t-s t-muted" x="119" y="158">형태가 흐름에 찍힌다</text>
<text class="t-mid t-s t-muted" x="401" y="158">가까이 보니 레고 블록</text>
<!-- ===== 둘째 뒤집기 ===== -->
<text class="t-mid t-s t-b" x="119" y="200">상식</text>
<text class="t-mid t-s t-b" x="401" y="200">양자물리학</text>
<rect class="f-panel s-ink w15" height="40" rx="4" width="190" x="24" y="212"></rect>
<text class="t-s t-muted" x="34" y="237">위층</text>
<path class="f-none s-ink w15" d="M68,232 q3,-7 6,0 t6,0 t6,0 t6,0"></path>
<text class="t-s" x="100" y="237">파동 — 효과</text>
<rect class="f-rule2 s-ink w15" height="40" rx="4" width="190" x="24" y="258"></rect>
<line class="s-ink w3" x1="24" x2="214" y1="298" y2="298"></line>
<text class="t-s t-muted" x="34" y="283">바탕</text>
<circle class="f-ink" cx="71" cy="282" r="2.5"></circle>
<circle class="f-ink" cx="78" cy="276" r="2.5"></circle>
<circle class="f-ink" cx="85" cy="282" r="2.5"></circle>
<circle class="f-ink" cx="92" cy="277" r="2.5"></circle>
<text class="t-s" x="100" y="283">입자 — 모래알</text>
<rect class="f-panel s-ink w15" height="40" rx="4" width="190" x="306" y="212"></rect>
<text class="t-s t-muted" x="316" y="237">위층</text>
<path class="f-none s-ink w15" d="M350,226 Q362,242 374,226 M350,238 Q362,222 374,238"></path>
<circle class="f-ink" cx="362" cy="232" r="3"></circle>
<text class="t-s" x="382" y="237">입자 — 결절점</text>
<rect class="f-rule2 s-ink w15" height="40" rx="4" width="190" x="306" y="258"></rect>
<line class="s-ink w3" x1="306" x2="496" y1="298" y2="298"></line>
<text class="t-s t-muted" x="316" y="283">바탕</text>
<path class="f-none s-ink w15" d="M350,278 q3,-7 6,0 t6,0 t6,0 t6,0"></path>
<text class="t-s" x="382" y="283">파동</text>
<line class="s-ink w2" marker-end="url(#L15-1-ar-ink)" x1="218" x2="300" y1="232" y2="276"></line>
<line class="s-ink w15 dash" marker-end="url(#L15-1-ar-ink)" x1="218" x2="300" y1="278" y2="234"></line>
<text class="t-mid t-s t-b" x="260" y="318">파동이 아래로</text>
<text class="t-mid t-s t-muted" x="119" y="318">모래 언덕 = 알갱이의 합</text>
<text class="t-mid t-s t-muted" x="401" y="318">입자 = 파동들의 결절점</text>
<!-- 범례 -->
<line class="s-ink w2" x1="40" x2="72" y1="352" y2="352"></line>
<text class="t-s t-muted" x="80" y="356">흐름 · 파동 쪽</text>
<line class="s-ink w15 dash" x1="200" x2="232" y1="352" y2="352"></line>
<text class="t-s t-muted" x="240" y="356">이산 · 입자 쪽 — 두 뒤집기는 방향이 반대</text>
<!-- ===== 남는 것 ===== -->
<line class="s-rule w1 dash" x1="522" x2="522" y1="24" y2="376"></line>
<text class="t-mid t-b" x="710" y="40">남는 것: 어느 쪽도 바탕이 아니다</text>
<text class="t-s t-b" x="550" y="72">첫째 시간</text>
<text class="t-end t-s t-muted" x="870" y="72">≈ 여성 공식 · 수학적 이율배반</text>
<rect class="f-void s-muted w1" height="50" width="130" x="550" y="84"></rect>
<text class="t-mid t-b f-onvoid" x="615" y="114">공백</text>
<polygon class="f-rule2 s-ink w15" points="758,84 870,84 870,134 740,134 740,102"></polygon>
<line class="s-red w3 round" x1="740" x2="758" y1="102" y2="84"></line>
<text class="t-mid" x="808" y="114">잘린 무언가</text>
<text class="t-mid t-s t-b f-red" x="710" y="106">간극</text>
<line class="s-red w15" marker-end="url(#L15-1-ar-red)" marker-start="url(#L15-1-ar-red)" x1="686" x2="734" y1="120" y2="120"></line>
<line class="s-ink w15" marker-end="url(#L15-1-ar-ink)" x1="615" x2="615" y1="140" y2="192"></line>
<text class="t-s" x="628" y="170">둘째 무언가가 공백을 채운다</text>
<text class="t-s t-b" x="550" y="214">둘째 시간</text>
<text class="t-end t-s t-muted" x="870" y="214">≈ 남성 공식 · 역학적 이율배반</text>
<rect class="f-rule2 s-ink w15" height="50" width="130" x="550" y="226"></rect>
<text class="t-mid" x="615" y="248">무언가</text>
<text class="t-mid t-s t-muted" x="615" y="266">공백 자리를 메움</text>
<polygon class="f-rule2 s-ink w15" points="758,226 870,226 870,276 740,276 740,244"></polygon>
<line class="s-red w3 round" x1="740" x2="758" y1="244" y2="226"></line>
<text class="t-mid" x="808" y="256">무언가</text>
<text class="t-mid t-s t-b" x="710" y="244">시차</text>
<line class="s-ink w15" marker-end="url(#L15-1-ar-ink)" marker-start="url(#L15-1-ar-ink)" x1="686" x2="734" y1="256" y2="256"></line>
<text class="t-mid t-b" x="710" y="302">파동 / 입자 — 대칭이 아니다</text>
<line class="s-verd w2" x1="542" x2="542" y1="322" y2="372"></line>
<text class="t-s t-b f-verd" x="552" y="334">물리학의 칸 — 양자장론</text>
<text class="t-s f-verd" x="552" y="352">장(연속)이 바탕이라 파동이 앞서고</text>
<text class="t-s f-verd" x="552" y="370">들뜸이 덩어리로만 와서 이산이 앞선다</text>
</svg></g></g></g></g></g></svg>
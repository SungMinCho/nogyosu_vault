<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 372" width="720" height="372" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2{ stroke:var(--ink-2); }.f-ink2-t{ fill:var(--ink-2); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-indigo-f{ fill:var(--indigo-soft); }.f-madder-t{ fill:var(--madder); }.f-ochre{ stroke:var(--ochre); }.f-ochre-t{ fill:var(--ochre); }.f-ochre-f{ fill:var(--ochre-soft); }.f-mend-t{ fill:var(--mend); }.f-panel-f{ fill:var(--panel); }.f-none{ fill:none; }.f-dash{ stroke-dasharray:6 5; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-l{ font-size:15px; }svg .t-b{ font-weight:700; }svg .halo{ paint-order:stroke; stroke:var(--panel); stroke-width:4px; stroke-linejoin:round; }svg.pz-root{width:720px!important;height:372px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="비축이라는 몸통에서 세 머리가 솟는다 — 대지에서 지대로, 일에서 이윤으로, 화폐에서 세금으로. 머리마다 아래에 직접 비교의 칸, 위에 그것이 전제하는 독점적 전유의 칸이 있고, 꼭대기의 지주·기업가·은행가는 고대 제국에서 덧코드화하는 한 얼굴, 전제군주로 수렴한다." class="pz-inner" height="100%" role="img" viewBox="0 0 720 372" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f21-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f21-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f21-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f21-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f21-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f21-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f21-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="f-ink-t" text-anchor="start" x="16" y="117">머리</text><text class="f-ink-t" text-anchor="start" x="16" y="182.5">독점적 전유</text><text class="f-ink-t" text-anchor="start" x="16" y="249.5">직접 비교</text><text class="f-ochre-t t-l" text-anchor="start" x="16" y="334">비축</text><line class="f-ink2 f-none" marker-end="url(#f21-a-ink2)" stroke-width="1.3" x1="44" x2="44" y1="236" y2="196"></line><text class="f-ink2-t t-s" text-anchor="start" x="52" y="220">전제</text><rect class="f-indigo f-indigo-f" height="34" rx="4" stroke-width="1.6" width="540" x="150" y="12"></rect><text class="f-indigo-t t-b" text-anchor="middle" x="420" y="34">전제군주 — 세 자리가 한 얼굴로 덧코드화</text><rect class="f-ochre f-ochre-f" height="52" rx="22" stroke-width="1.8" width="540" x="150" y="304"></rect><line class="f-ink2 f-none" stroke-width="1.4" x1="236" x2="236" y1="304" y2="132"></line><line class="f-indigo f-none" stroke-width="1.4" x1="236" x2="236" y1="64" y2="46"></line><rect class="f-indigo f-panel-f" height="24" rx="3" stroke-width="1.4" width="72" x="200" y="62"></rect><text class="f-indigo-t t-s" text-anchor="middle" x="236" y="78.5">지주</text><line class="f-ink2 f-none" stroke-width="1.4" x1="236" x2="236" y1="86" y2="92"></line><circle class="f-ink f-panel-f" cx="236" cy="112" r="21" stroke-width="1.8"></circle><text class="f-ink-t t-l t-b" text-anchor="middle" x="236" y="117">지대</text><rect class="f-ink f-panel-f" height="32" rx="2" stroke-width="1.5" width="150" x="161.0" y="162"></rect><text class="f-ink-t" text-anchor="middle" x="236" y="182.5">절대지대</text><rect class="f-ink f-dash f-panel-f" height="30" rx="2" stroke-width="1.2" width="150" x="161.0" y="230"></rect><text class="f-ink2-t" text-anchor="middle" x="236" y="249.5">차액지대</text><text class="f-ink2-t t-s halo" text-anchor="middle" x="236" y="285">영토에 맞선 대지</text><text class="f-ochre-t" text-anchor="middle" x="236" y="335">땅·씨앗</text><line class="f-ink2 f-none" stroke-width="1.4" x1="420" x2="420" y1="304" y2="132"></line><line class="f-indigo f-none" stroke-width="1.4" x1="420" x2="420" y1="64" y2="46"></line><rect class="f-indigo f-panel-f" height="24" rx="3" stroke-width="1.4" width="72" x="384" y="62"></rect><text class="f-indigo-t t-s" text-anchor="middle" x="420" y="78.5">기업가</text><line class="f-ink2 f-none" stroke-width="1.4" x1="420" x2="420" y1="86" y2="92"></line><circle class="f-ink f-panel-f" cx="420" cy="112" r="21" stroke-width="1.8"></circle><text class="f-ink-t t-l t-b" text-anchor="middle" x="420" y="117">이윤</text><rect class="f-ink f-panel-f" height="32" rx="2" stroke-width="1.5" width="150" x="345.0" y="162"></rect><text class="f-ink-t" text-anchor="middle" x="420" y="182.5">잉여 노동</text><rect class="f-ink f-dash f-panel-f" height="30" rx="2" stroke-width="1.2" width="150" x="345.0" y="230"></rect><text class="f-ink2-t" text-anchor="middle" x="420" y="249.5">노동</text><text class="f-ink2-t t-s halo" text-anchor="middle" x="420" y="285">활동에 맞선 일</text><text class="f-ochre-t" text-anchor="middle" x="420" y="335">도구</text><line class="f-ink2 f-none" stroke-width="1.4" x1="604" x2="604" y1="304" y2="132"></line><line class="f-indigo f-none" stroke-width="1.4" x1="604" x2="604" y1="64" y2="46"></line><rect class="f-indigo f-panel-f" height="24" rx="3" stroke-width="1.4" width="72" x="568" y="62"></rect><text class="f-indigo-t t-s" text-anchor="middle" x="604" y="78.5">은행가</text><line class="f-ink2 f-none" stroke-width="1.4" x1="604" x2="604" y1="86" y2="92"></line><circle class="f-ink f-panel-f" cx="604" cy="112" r="21" stroke-width="1.8"></circle><text class="f-ink-t t-l t-b" text-anchor="middle" x="604" y="117">세금</text><rect class="f-ink f-panel-f" height="32" rx="2" stroke-width="1.5" width="150" x="529.0" y="162"></rect><text class="f-ink-t" text-anchor="middle" x="604" y="182.5">화폐 발행</text><rect class="f-ink f-dash f-panel-f" height="30" rx="2" stroke-width="1.2" width="150" x="529.0" y="230"></rect><text class="f-ink2-t" text-anchor="middle" x="604" y="249.5">상품</text><text class="f-ink2-t t-s halo" text-anchor="middle" x="604" y="285">교환에 맞선 화폐</text><text class="f-ochre-t" text-anchor="middle" x="604" y="335">화폐</text></svg></g></g></g></g></svg>
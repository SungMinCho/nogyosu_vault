<path class="s-jag w2" d="M422,469.0 C476.0,469.0 496.0,469.0 496.0,438.0" marker-end="url(#f18-a-j2)"></path>
<text class="ts c-jag" x="506.0" y="347.0">내놓는다</text>
<text class="ts c-jag te" x="108.0" y="347.0">먹는다</text>
<text class="ts c-jag te" x="108.0" y="483.0">내놓는다</text>
<text class="ts c-jag" x="506.0" y="483.0">먹는다 · 복수</text>
<text class="ts tb" x="604" y="347.0">공동 봉헌자</text>
<text class="tl" x="604" y="363.0">‘내놓는’ 쪽</text>
<text class="ts tb" x="604" y="483.0">미래의 수령자</text>
<text class="tl" x="604" y="499.0">복수의 권리</text>
<text class="ts tb tm c-jag" x="307.0" y="407.0">끝없는 복수</text>
<text class="tl tm" x="307.0" y="424.0">= 영원한 불균형 → 집단의 시간</text>
<text class="tbig tb tm" x="34" y="411.0">2</text>
<text class="tl tm" x="34" y="428.0">자리</text>
<text class="tl tm c-jag" x="34" y="444.0">두 벌</text>

}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:1rem 3rem}.lecture{display:contents}.fig{margin:.6rem 0}.panels{display:flex;flex-wrap:wrap;gap:1rem 1.2rem;justify-content:center;align-items:flex-start}.pn{display:block;flex:1 1 17.5rem;max-width:21rem;height:auto;background:var(--sheet);border:1px solid var(--rule)}.pn.sm{flex:1 1 12.5rem;max-width:15rem}.pn.tall{max-width:23rem}svg text{font-family:var(--f-mono)}.t-lab{font-family:var(--f-body);fill:var(--ink)}.t-math{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;fill:var(--ink)}.c-out{color:var(--c-out);fill:var(--c-out)}.c-orth{color:var(--c-orth);fill:var(--c-orth)}.c-mut{color:var(--ink-2);fill:var(--ink-2)}.s-out{stroke:var(--c-out)}.s-orth{stroke:var(--c-orth)}.s-ink{stroke:var(--ink)}.s-mut{stroke:var(--ink-2)}.f-in{fill:var(--c-in)}.f-out{fill:var(--c-out)}.f-inv{fill:var(--c-inv)}.f-orth{fill:var(--c-orth)}.f-warn{fill:var(--c-warn)}.f-null{fill:var(--c-null)}.f-ink{fill:var(--ink)}.f-mut{fill:var(--ink-2)}.f-none{fill:none}line,polyline,path{fill:none}.katex svg path{fill:currentColor}polygon.s-in,polygon.s-out{stroke-linejoin:round}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="b를 열공간에 수직으로 떨어뜨린 발 p가 열공간에서 b에 가장 가까운 점이고 오차 e는 열공간과 직각이다." class="pn" height="100%" role="img" viewBox="0 0 320 240" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="pj-in" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-in" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="pj-out" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-out" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="pj-inv" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-inv" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="pj-orth" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-orth" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="pj-warn" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-warn" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="pj-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="pj-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mut" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="pj-null" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-null" d="M0,1 L10,5 L0,9 z"></path></marker></defs><line class="s-out" fill="none" stroke-width="3" x1="21" x2="306.3" y1="206.2" y2="113.5"></line><text class="t-math c-out" font-size="13" text-anchor="end" x="296.8" y="136.6">C(A)</text><line class="s-ink" fill="none" marker-end="url(#pj-ink)" stroke-width="2.2" x1="40" x2="190" y1="200" y2="60"></line><line class="s-out" fill="none" marker-end="url(#pj-out)" stroke-width="2.4" x1="40" x2="216.8" y1="200" y2="142.5"></line><line class="s-orth" fill="none" marker-end="url(#pj-orth)" stroke-width="2.2" x1="216.8" x2="190" y1="142.5" y2="60"></line><line class="s-mut" fill="none" stroke-dasharray="5 4" stroke-width="1.3" x1="116.1" x2="190" y1="175.3" y2="60"></line><circle class="f-mut" cx="116.1" cy="175.3" r="3.5"></circle><polyline class="s-orth f-none" points="206.4,145.9 203,135.5 213.4,132.1" stroke-width="1.3"></polyline><text class="t-math" font-size="15" text-anchor="start" x="196" y="64">b</text><text class="t-math c-out" font-size="13" text-anchor="start" x=
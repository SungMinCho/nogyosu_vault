  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}}:root[data-theme="dark"]{
  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}.cu{color:var(--cu)}.vg{color:var(--vg)}.pb{color:var(--pb)}svg.defs{position:absolute;width:0;height:0;overflow:hidden}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-inline:var(--pad);padding-block:0 4rem}.lecture{display:contents}.webwrap svg{display:block;width:100%;height:auto}.sw-dot.cu{background:var(--cu)}.sw-dot.vg{background:var(--vg)}.sw-dot.pb{background:var(--pb)}figure.fig{border:1px solid var(--mark);background:var(--plate);padding:.75rem .75rem .6rem;margin-block:.6rem}.figscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  background:linear-gradient(to right,var(--plate) 30%,transparent),linear-gradient(to left,var(--plate) 30%,transparent) 100% 0,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) 100% 0;
  background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;background-attachment:local,local,scroll,scroll}figure.fig svg{display:block;width:100%;height:auto;min-width:27rem}@media (max-width:34rem){.doc>figure.fig,.lecture>figure.fig{width:calc(100% + var(--pad)*2);max-width:none;margin-inline:calc(var(--pad)*-1);border-inline:0;padding-inline:.6rem}}.terms li.cu{color:var(--cu);background:var(--cu-soft)}.terms li.vg{color:var(--vg);background:var(--vg-soft)}.terms li.pb{color:var(--pb);background:var(--pb-soft)}svg .ln,svg .ln-cu,svg .ln-vg,svg .ln-pb,svg .ln-vm{stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}svg .ln:not([fill]),svg .ln-cu:not([fill]),svg .ln-vg:not([fill]),svg .ln-pb:not([fill]),svg .ln-vm:not([fill]){fill:none}svg .ln{stroke:var(--ink)}svg .ln-pb{stroke:var(--pb)}svg g.ln-vg>rect:not([fill]),svg g.ln-cu>rect:not([fill]),svg g.ln-pb>rect:not([fill]),svg g.ln-vm>rect:not([fill]){fill:none}svg .faint,svg g.faint>*,svg g>.faint{stroke:var(--mark)}svg .dash,svg g.dash>*{stroke-dasharray:4 4}svg text{fill:var(--ink);font-family:var(--f-body)}svg .tk{font-family:var(--f-display);font-size:17px;font-weight:600}svg .ts{font-size:13px}svg .tm{font-family:var(--f-mono);font-size:11px}svg .c{text-anchor:middle}svg text.cu{fill:var(--cu)}svg text.vg{fill:var(--vg)}svg text.pb{fill:var(--pb)}svg text.vm{fill:var(--vm)}svg .bgtext{paint-order:stroke;stroke:var(--plate);stroke-width:5px;stroke-linejoin:round}.m .sq>.rt path{fill:none;stroke:currentColor;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}.m .sq>.rt path.rh{stroke-width:1.6px}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="N ⊸ N의 네 수 — N⊸N은 네 수가 두 판을 지그재그로 오가고, 마지막 한 수가 계승과 카피캣을 가른다" height="100%" role="img" viewBox="0 0 480 296" width="100%" xmlns="http://www.w3.org/2000/svg">
<text class="tm cu" x="20" y="26">O 환경</text><text class="tm" x="69" y="26">·</text><text class="tm pb" x="80" y="26">P 체계</text>
<text class="tk c" x="240" y="26">N ⊸ N</text>
<text class="ts c" x="150" y="58">입력 N</text>
<text class="ts c" x="330" y="58">출력 N</text>
<text class="tm c pb" x="150" y="74">역할 뒤집힘: P가 묻는다</text>
<line class="ln faint" x1="150" x2="150" y1="84" y2="232"></line>
<line class="ln faint" x1="330" x2="330" y1="84" y2="232"></line>
<text class="ts c cu bgtext" x="330" y="108">① O: 출력은?</text>
<text class="ts c pb bgtext" x="150" y="148">② P: 입력은?</text>
<text class="ts c cu bgtext" x="150" y="188">③ O: 5</text>
<text class="ts c pb bgtext" x="330" y="228">④ P: 6 = n+1</text>
<line class="ln-pb dash" marker-end="url(#ah-pb)" x1="198" x2="282" y1="140" y2="108"></line>
<path class="ln-pb dash" d="M116,182 C94,176 94,156 108,148" marker-end="url(#ah-pb)"></path>
<path class="ln-pb dash" d="M384,222 C428,196 428,136 384,108" marker-end="url(#ah-pb)"></path>
<text class="tm pb" x="20" y="232">점선 = 포인터</text>
<text class="tm pb" x="20" y="246">(어느 수에 답하나)</text>
<text class="tm c vg" x="330" y="250">또는 5를 그대로 → 카피캣</text>
<text class="ts c" x="240" y="272">계승 함수와 카피캣(항등)은 마지막 한 수 차이</text>
<text class="tm c" x="240" y="290">진리 = 영 수 게임 · 함수 = 두 수 게임 · 그 너머 = 대화</text>
</svg></svg>
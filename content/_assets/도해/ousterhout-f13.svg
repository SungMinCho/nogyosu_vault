}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1rem 3rem }.lecture{ display:contents }.fig{ margin:.6rem 0 }.frame{ overflow-x:auto; overflow-y:hidden; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding-block:.8rem;
  background-image:linear-gradient(to right,var(--bg),var(--bg)),linear-gradient(to right,var(--bg),var(--bg)),
    linear-gradient(to right,var(--rule),transparent),linear-gradient(to left,var(--rule),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat;
  background-size:1.5rem 100%,1.5rem 100%,.6rem 100%,.6rem 100%; background-attachment:local,local,scroll,scroll }.dg{ display:block; width:100%; height:auto }.dg .t, .hero-svg .t{ font-family:var(--f-label); font-size:13px; fill:var(--ink) }.dg .t-s{ font-size:12px }.dg .t-xs{ font-size:11px }.dg .t-b, .hero-svg .t-b{ font-weight:700 }.dg .t-m{ font-family:var(--f-mono) }.dg .t-mut, .hero-svg .t-mut{ fill:var(--muted) }.dg .t-if, .hero-svg .t-if{ fill:var(--if) }.dg .t-cx{ fill:var(--cx) }.dg .t-flag{ fill:var(--flag) }.dg line, .dg polyline, .dg path, .hero-svg line, .hero-svg polyline, .hero-svg path{ fill:none }.f-ink{ fill:var(--ink)!important }.f-bg{ fill:var(--bg)!important }.f-panel{ fill:var(--panel)!important }.f-if{ fill:var(--if)!important }.f-if-soft{ fill:var(--if-soft)!important }.f-flag-soft{ fill:var(--flag-soft)!important }.ln{ stroke:var(--ink); stroke-width:1.4 }.ln-thin{ stroke:var(--ink); stroke-width:1 }.ln-mut{ stroke:var(--rule); stroke-width:1.2 }.s-ink-thin{ stroke:var(--ink); stroke-width:1 }.s-rule{ stroke:var(--rule); stroke-width:1 }.s-if{ stroke:var(--if); stroke-width:1.4 }.s-flag{ stroke:var(--flag); stroke-width:1.4 }.w15{ stroke-width:1.5 }.dash{ stroke-dasharray:4 3 }svg.pz-root{width:760px!important;height:300px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w page"><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="RAMCloud 버퍼 할당의 핵심 경로: 옛 코드는 통과 메서드 셋을 거치며 검사를 여섯 번 했고 그 가운데 둘은 같은 질문이었다. 새 코드는 세 특수한 경우를 appendRoom = 0으로 흡수해 검사 하나로 흔한 경우를 처리한다." class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 760 300" width="100%"><defs><marker id="a-ink-buf" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="a-if-buf" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-if" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t t-b" text-anchor="middle" x="180.0" y="24.0">옛 경로</text><text class="t t-b" text-anchor="middle" x="560.0" y="24.0">새 경로</text><line class="ln-mut" x1="372.0" x2="372.0" y1="36.0" y2="290.0"></line><rect class="f-panel s-ink-thin" height="30.0" rx="3" width="230.0" x="40.0" y="40.0"></rect><text class="t t-xs t-m" text-anchor="middle" x="155.0" y="60.0">Buffer::alloc</text><line class="ln" marker-end="url(#a-ink-buf)" x1="155.0" x2="155.0" y1="71.0" y2="88.0"></line><rect class="f-panel s-ink-thin" height="30.0" rx="3" width="230.0" x="40.0" y="90.0"></rect><text class="t t-xs t-m" text-anchor="middle" x="155.0" y="110.0">Buffer::allocateAppend</text><line class="ln" marker-end="url(#a-ink-buf)" x1="155.0" x2="155.0" y1="121.0" y2="138.0"></line><rect class="f-panel s-ink-thin" height="30.0" rx="3" width="230.0" x="40.0" y="140.0"></rect><text class="t t-xs t-m" text-anchor="middle" x="155.0" y="160.0">Allocation::allocateAppend</text><text class="t t-xs t-mut" text-anchor="start" x="280.0" y="110.0">거의 같은 시그니처</text><text class="t t-xs t-mut" text-anchor="start" x="280.0" y="124.0">= 통과 메서드</text><path class="f-bg s-ink-thin" d="M56,188 L78,206 L56,224 L34,206 z"></path><text class="t t-xs" text-anchor="middle" x="56.0" y="210.0">1</text><line class="ln-thin" x1="79.0" x2="85.0" y1="206.0" y2="206.0"></line><path class="f-flag-soft s-flag" d="M108,188 L130,206 L108,224 L86,206 z"></path><text class="t t-xs t-flag t-b" text-anchor="middle" x="108.0" y="210.0">2</text><line class="ln-thin" x1="131.0" x2="137.0" y1="206.0" y2="206.0"></line><path class="f-bg s-ink-thin" d="M160,188 L182,206 L160,224 L138,206 z"></path><text class="t t-xs" text-anchor="middle" x="160.0" y="210.0">3</text><line class="ln-thin" x1="183.0" x2="189.0" y1="206.0" y2="206.0"></line><path class="f-bg s-ink-thin" d="M212,188 L234,206 L212,224 L190,206 z"></path><text class="t t-xs" text-anchor="middle" x="212.0" y="210.0">4</text><line class="ln-thin" x1="235.0" x2="241.0" y1="206.0" y2="206.0"></line><path class="f-flag-soft s-flag" d="M264,188 L286,206 L264,224 L242,206 z"></path><text class="t t-xs t-flag t-b" text-anchor="middle" x="264.0" y="210.0">5</text><line class="ln-thin" x1="287.0" x2="293.0" y1="206.0" y2="206.0"></line><path class="f-bg s-ink-thin" d="M316,188 L338,206 L316,224 L294,206 z"></path><text class="t t-xs" text-anchor="middle" x="316.0" y="210.0">6</text><line class="ln-thin" x1="155.0" x2="155.0" y1="181.0" y2="186.0"></line><text class="t t-xs t-flag" text-anchor="middle" x="190.0" y="246.0">핵심 경로 위의 검사 6번 — 2와 5는 같은 질문 ‘자리 충분?’</text><text class="t t-s t-b t-cx" text-anchor="middle" x="190.0" y="268.0">8.8ns · 1,886줄</text><text class="t t-xs t-mut" text-anchor="middle" x="560.0" y="54.0">빈 자리 없음 · 마지막이 외부 조각 · 조각 없음</text><text class="t t-xs t-m t-mut" text-anchor="middle" x="560.0" y="70.0">→ 셋 다 appendRoom = 0</text><line class="ln-thin" marker-end="url(#a-ink-buf)" x1="560.0" x2="560.0" y1="76.0" y2="90.0"></line><path class="f-if-soft s-if" d="M560,94 L642,124 L560,154 L478,124 z"></path><text class="t t-xs t-m t-b t-if" text-anchor="middle" x="560.0" y="128.0">appendRoom ≥ n ?</text><line class="s-if w15" marker-end="url(#a-if-buf)" x1="560.0" x2="560.0" y1="155.0" y2="176.0"></line><text class="t t-xs t-if" text-anchor="start" x="568.0" y="170.0">예 (흔함)</text><rect class="f-if-soft s-if" height="58.0" rx="3" width="260.0" x="430.0" y="180.0"></rect><text class="t t-xs" text-anchor="middle" x="560.0" y="202.0">끝 주소 반환</text><text class="t t-xs t-m" text-anchor="middle" x="560.0" y="222.0">길이 += n · 남은 자리 −= n · 전체 += n</text><line class="ln-thin" marker-end="url(#a-ink-buf)" x1="643.0" x2="702.0" y1="124.0" y2="124.0"></line><text class="t t-xs t-mut" text-anchor="middle" x="672.0" y="116.0">아니오</text><rect class="f-bg s-rule dash" height="28.0" rx="3" width="50.0" x="700.0" y="110.0"></rect><text class="t t-xs t-m t-mut" text-anchor="middle" x="725.0" y="128.0">slow</text><text class="t t-s t-b t-if" text-anchor="middle" x="560.0" y="268.0">4.75ns · 1,476줄</text></svg></g></g></g></g></g></svg>
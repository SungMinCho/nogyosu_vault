<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 236" width="640" height="236" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#F1F2EC; --paper:#FAFAF6; --soft:#E3E6DE; --tie:#B9BEB5; --stack:#C9CDC4; --grid:#DCE0D6; --rule:#CDD3CA;
  --ink:#1B2420; --ink-2:#44504A; --muted:#6E7871; --on:#FFFFFF;
  --pot:#23825A; --risk:#C0392B; --eq:#A0700F; --un:#2F5DA8; --warn:#8A4FB8;
  --eq-bg:#F3E7CC; --risk-bg:#F6DEDA;
  --f-body:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-disp:"Song Myung","Nanum Myeongjo","Noto Serif KR",serif;
  --f-num:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --f-dg:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --f-math:"Noto Sans Math","STIX Two Math","Cambria Math",math;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}}:root[data-theme="dark"]{
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:2.2rem 4rem}.lecture{display:contents}.fig{margin:.6rem 0 !important;display:grid;gap:.55rem}.fig .frame{overflow-x:auto;background:
  linear-gradient(90deg,var(--paper) 30%,transparent),linear-gradient(270deg,var(--paper) 30%,transparent),
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent),
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent) 100% 0;
  background-color:var(--paper);background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll;
  border:1px solid var(--rule);border-radius:3px;padding:.7rem}.dg{display:block;width:100%;height:auto;font-family:var(--f-dg)}.dg text{fill:var(--ink);font-size:12px}.dg text.mu{fill:var(--muted)}.dg text.b{font-weight:700}.dg text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}.dg text.card{font-family:var(--f-num)}.dg .f-pot{fill:var(--pot)}.dg .f-risk{fill:var(--risk)}.dg .f-eq{fill:var(--eq)}.dg .f-un{fill:var(--un)}.dg .f-ink{fill:var(--ink)}.dg .f-paper{fill:var(--paper)}.dg .f-soft{fill:var(--soft)}.dg .s-ink{stroke:var(--ink);stroke-width:1.2}.dg circle:hover,.dg rect[class]:hover{filter:brightness(1.08)}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="열두 강의 개념이 콜의 EV와 베팅의 EV 식에서 각각 어느 항을 맡는지 보여 주는 좌석표." class="dg" height="100%" role="img" style="" viewBox="0 0 640 236" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar-map" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="mu" style="font-size:12px" text-anchor="start" x="20.0" y="22.0">콜의 EV — 각 항이 앉는 자리</text><rect class="f-paper s-ink" height="40.0" rx="4" width="90.0" x="20.0" y="34.0"></rect><rect class="f-eq" height="40.0" rx="0" width="6.0" x="20.0" y="34.0"></rect><text class="b num" style="font-size:15px" text-anchor="middle" x="68.0" y="60.0">e</text><text style="font-size:12px" text-anchor="middle" x="68.0" y="92.0">에퀴티</text><text class="mu" style="font-size:11px" text-anchor="middle" x="68.0" y="108.0">2·3강</text><rect class="f-paper s-ink" height="40.0" rx="4" width="110.0" x="120.0" y="34.0"></rect><rect class="f-un" height="40.0" rx="0" width="6.0" x="120.0" y="34.0"></rect><text class="b num" style="font-size:15px" text-anchor="middle" x="178.0" y="60.0">×  R</text><text style="font-size:12px" text-anchor="middle" x="178.0" y="92.0">실현율</text><text class="mu" style="font-size:11px" text-anchor="middle" x="178.0" y="108.0">8강</text><rect class="f-paper s-ink" height="40.0" rx="4" width="220.0" x="240.0" y="34.0"></rect><rect class="f-pot" height="40.0" rx="0" width="6.0" x="240.0" y="34.0"></rect><text class="b num" style="font-size:15px" text-anchor="middle" x="353.0" y="60.0">× (P + C + M)</text><text style="font-size:12px" text-anchor="middle" x="353.0" y="92.0">팟·콜·앞으로 받을 돈</text><text class="mu" style="font-size:11px" text-anchor="middle" x="353.0" y="108.0">4·5·6강</text><rect class="f-paper s-ink" height="40.0" rx="4" width="150.0" x="470.0" y="34.0"></rect><rect class="f-risk" height="40.0" rx="0" width="6.0" x="470.0" y="34.0"></rect><text class="b num" style="font-size:15px" text-anchor="middle" x="548.0" y="60.0">−  C</text><text style="font-size:12px" text-anchor="middle" x="548.0" y="92.0">내가 내는 값</text><text class="mu" style="font-size:11px" text-anchor="middle" x="548.0" y="108.0">4강</text><text class="mu" style="font-size:12px" text-anchor="start" x="20.0" y="146.0">베팅의 EV</text><rect class="f-paper s-ink" height="40.0" rx="4" width="160.0" x="20.0" y="158.0"></rect><rect class="f-pot" height="40.0" rx="0" width="6.0" x="20.0" y="158.0"></rect><text class="b num" style="font-size:14px" text-anchor="middle" x="103.0" y="184.0">F · P</text><text class="mu" style="font-size:11px" text-anchor="middle" x="103.0" y="216.0">상대가 접어 주는 값 · 7강</text><rect class="f-paper s-ink" height="40.0" rx="4" width="230.0" x="200.0" y="158.0"></rect><rect class="f-eq" height="40.0" rx="0" width="6.0" x="200.0" y="158.0"></rect><text class="b num" style="font-size:14px" text-anchor="middle" x="318.0" y="184.0">+ (1 − F)[콜당했을 때]</text><text class="mu" style="font-size:11px" text-anchor="middle" x="318.0" y="216.0">에퀴티·실현율 · 2·8강</text><rect class="f-soft" height="72.0" rx="4" width="176.0" x="452.0" y="150.0"></rect><text style="font-size:11.5px" text-anchor="middle" x="540.0" y="172.0">누가 F와 콜 빈도를 고르나</text><text class="b" style="font-size:12px" text-anchor="middle" x="540.0" y="190.0">상대가, 내 레인지를 보고</text><text class="mu" style="font-size:11px" text-anchor="middle" x="540.0" y="208.0">→ 균형 9·10·11강 · 기계 12강</text><path class="s-ink" d="M432,178 L448,178" marker-end="url(#ar-map)"></path></svg></svg>
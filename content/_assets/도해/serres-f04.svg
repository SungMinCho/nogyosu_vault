<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 370" width="860" height="370" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.c-cold{ fill:var(--cold) !important }.c-pass{ fill:var(--pass) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-rule{ stroke:var(--rule) }.s-cold{ stroke:var(--cold) }.s-pass{ stroke:var(--pass) }.s-caution{ stroke:var(--caution) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-cold-t{ fill:var(--cold); fill-opacity:.16 }.f-pass-t{ fill:var(--pass); fill-opacity:.16 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.dash{ stroke-dasharray:5 4 }.dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }.mk-ink{ fill:var(--ink) }.mk-pass{ fill:var(--pass) }.mk-caution{ fill:var(--caution) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="왼쪽 변증법의 대화에서는 두 대화자 A와 B가 서로 맞서고 싸움의 선이 둘 사이에 놓인다. 오른쪽 세르의 대화에서는 A와 B가 한편으로 나란히 서서 제3자, 곧 소음의 악마를 마주하고 그를 삼각형 바깥으로 밀어낸다. 성공한 소통은 배제된 제3자다." class="fig-svg" height="100%" role="img" viewBox="0 0 860 370" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F05-ar-caution" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-caution" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F05-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F05-ar-pass" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-pass" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="tb" text-anchor="middle" x="200" y="30">변증법</text><text class="ts" text-anchor="middle" x="200" y="50">싸움의 선: A ↔ B</text><text class="tb" text-anchor="middle" x="645" y="30">세르</text><text class="ts" text-anchor="middle" x="645" y="50">싸움의 선: A·B ↔ 제3자</text><line class="s-rule w1 dot f-none" x1="420" x2="420" y1="18" y2="350"></line><circle class="s-ink f-deep w2" cx="90" cy="160" r="26"></circle><text class="tb" text-anchor="middle" x="90" y="165">A</text><text class="ts" text-anchor="middle" x="90" y="208">정 · 묻는 자</text><circle class="s-ink f-deep w2" cx="310" cy="160" r="26"></circle><text class="tb" text-anchor="middle" x="310" y="165">B</text><text class="ts" text-anchor="middle" x="310" y="208">반 · 반박하는 자</text><line class="s-caution w3 f-none" marker-end="url(#F05-ar-caution)" x1="119" x2="197" y1="160" y2="160"></line><line class="s-caution w3 f-none" marker-end="url(#F05-ar-caution)" x1="281" x2="203" y1="160" y2="160"></line><text class="t c-caution" text-anchor="middle" x="200" y="143">대립</text><text class="ts" text-anchor="middle" x="200" y="262">둘만 있는 방 — 상대는 서로</text><line class="s-ink2 w15 dash f-none" x1="578.134" x2="629.456" y1="126.334" y2="186.713"></line><line class="s-ink2 w15 dash f-none" x1="711.866" x2="660.544" y1="126.334" y2="186.713"></line><line class="s-pass w3 f-none" marker-end="url(#F05-ar-pass)" marker-start="url(#F05-ar-pass)" x1="588" x2="702" y1="105" y2="105"></line><circle class="s-pass f-pass-t w2" cx="560" cy="105" r="26"></circle><text class="tb" text-anchor="middle" x="560" y="110">A</text><circle class="s-pass f-pass-t w2" cx="730" cy="105" r="26"></circle><text class="tb" text-anchor="middle" x="730" y="110">B</text><text class="ts c-pass" text-anchor="middle" x="645" y="95">한편</text><text class="ts c-pass" text-anchor="middle" x="645" y="126">말을 주고받음</text><text class="ts" text-anchor="end" x="588" y="165">배제의 선</text><circle class="s-cold w15 dot f-none" cx="645" cy="205" r="22"></circle><text class="ts c-cold" text-anchor="start" x="675" y="209">상정된 자리</text><line class="s-ink w2 dash f-none" marker-end="url(#F05-ar-ink)" x1="645" x2="645" y1="230" y2="262"></line><text class="ts" text-anchor="end" x="636" y="251">밀어냄</text><circle class="s-cold f-cold-t w2" cx="645" cy="292" r="26"></circle><text class="t" text-anchor="middle" x="645" y="297">제3자</text><text class="ts c-cold" text-anchor="start" x="680" y="297">소음 · 악마</text><text class="tb" text-anchor="middle" x="645" y="352">성공한 소통 = 배제된 제3자</text></svg></svg>
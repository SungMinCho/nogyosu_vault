<text class="tbig tb" x="16" y="32">친구 — 그리스</text>
<text class="tl" x="16" y="52">아리스토텔레스 『니코마코스 윤리학』 9권</text>
<path class="s-jen w2 round" d="M78,131.9 C60,90 140,90 122,131.9" marker-end="url(#f23-a-jen)"></path>
<text class="ts c-jen tb" x="140" y="104">자기관계</text>
<text class="tl" x="140" y="121">= 기원 · 모델</text>
<circle class="t-jen s-jen w2" cx="100" cy="170" r="44"></circle>
<text class="tbig tb tm c-jen" x="100" y="172">나</text>
<text class="tl tm" x="100" y="190">(에고)</text>
<line class="s-jen w3" marker-end="url(#f23-a-jen)" x1="146" x2="271" y1="170" y2="170"></line>
<text class="ts tb tm c-jen" x="209" y="157">뻗는다</text>
<text class="ts tm" x="209" y="192">또 하나의 자기</text>
<text class="tl tm" x="209" y="208">allos autos</text>
<circle class="t-jen s-jen w2" cx="300" cy="170" r="26"></circle>
<text class="ts tb tm" x="300" y="175">친구</text>
<text class="tl" x="16" y="244">필리아(우애) = 앎의 요소</text>
<text class="tl" x="16" y="262">친구-경쟁자: 지혜를 함께 요구하는 자</text>
<text class="tb" x="16" y="294">타자 = 자기의 한 계기</text>
<text class="ts" x="16" y="314">사회적 유대 ← 자기관계에서 파생</text>
<text class="tbig tb" x="376" y="32">적 — 아메리카 원주민</text>
<text class="tl" x="376" y="52">아라웨테 · 『적의 관점에서』</text>
<circle class="s-jag w2 dot" cx="460" cy="170" r="36"></circle>
<circle class="t-jen s-jen w2" cx="460" cy="170" r="26"></circle>
<text class="tbig tb tm c-jen" x="460" y="177">나</text>
<line class="s-jag w3" marker-end="url(#f23-a-jag)" x1="614" x2="499" y1="170" y2="170"></line>
<text class="ts tb tm c-jag" x="556" y="157">돌아온다</text>
<text class="ts tm" x="556" y="192">적의 자리에서</text>
<text class="ts tm" x="556" y="208">본 나 = 나</text>
<circle class="t-jag s-jag w2" cx="660" cy="170" r="44"></circle>
<text class="tbig tb tm c-jag" x="660" y="172">적</text>
<text class="tl tm" x="660" y="190">(의 관점)</text>
<text class="tl" x="376" y="244">점선 고리: 아라웨테 살해자가 부르는 적의 노래</text>
<text class="ts c-jag" x="376" y="262">노래 속에서 말하는 “나”는 적</text>
<text class="tb" x="376" y="294">자기 = 타자의 한 계기</text>
<text class="ts" x="376" y="314">자기 ← 적이라는 초월론적 조건에서 성립</text>
<line class="s-rule" x1="16" x2="704" y1="338" y2="338"></line>
<text class="ts tb" x="16" y="392">애니미즘</text>
<text class="tl" x="16" y="410">모든 존재에 관점</text>

<rect class="f-grid" height="16" width="120" x="220" y="202"></rect>
<text class="t-s t-2" text-anchor="middle" x="280" y="214">차폐 무늬</text>
<path class="ln-neuro w-thick" d="M140,292 L188,292 C218,292 238,258 290,256 L620,256"></path>
<text class="t-s t-neuro t-b" text-anchor="end" x="620" y="248">편도체 반응 그대로</text>
<text class="t-s t-alarm" x="330" y="282">브레이크가 들어올 틈 없음</text>
<!-- B. 긴 노출 -->
<text class="t-b" x="16" y="334">긴 노출</text>
<text class="t-s t-m" x="16" y="350">의식할 만큼 길게</text>
<rect class="f-ink2" height="16" width="472" x="140" y="322"></rect>
<path class="f-ink2" d="M612,322 L626,330 L612,338 z"></path>
<text class="t-s t-paper t-b" text-anchor="middle" x="180" y="334">얼굴</text>

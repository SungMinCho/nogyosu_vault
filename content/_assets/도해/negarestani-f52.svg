<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 320" width="480" height="320" class="figscroll fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EDEFEA; --plate:#E3E6E0; --ink:#26221E; --ink-2:#5B5750; --rule:#C6CBC3; --mark:#B9BEB5;
  --cu:#9A5B2E; --vg:#2F7D6D; --pb:#2B4C7E; --vm:#C2412B;
  --cu-soft:rgba(154,91,46,.10); --vg-soft:rgba(47,125,109,.10); --pb-soft:rgba(43,76,126,.10); --vm-soft:rgba(194,65,43,.08);
  --f-display:"Hahmlet","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-latin:"EB Garamond","Noto Serif KR",Georgia,serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem;
}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}}:root[data-theme="dark"]{
  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}.vg{color:var(--vg)}.pb{color:var(--pb)}.vm{color:var(--vm)}svg.defs{position:absolute;width:0;height:0;overflow:hidden}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-inline:var(--pad);padding-block:0 4rem}.lecture{display:contents}.webwrap svg{display:block;width:100%;height:auto}.sw-dot.vg{background:var(--vg)}.sw-dot.pb{background:var(--pb)}.sw-dot.vm{background:var(--vm)}figure.fig{border:1px solid var(--mark);background:var(--plate);padding:.75rem .75rem .6rem;margin-block:.6rem}.figscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  background:linear-gradient(to right,var(--plate) 30%,transparent),linear-gradient(to left,var(--plate) 30%,transparent) 100% 0,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) 100% 0;
  background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;background-attachment:local,local,scroll,scroll}figure.fig svg{display:block;width:100%;height:auto;min-width:27rem}@media (max-width:34rem){.doc>figure.fig,.lecture>figure.fig{width:calc(100% + var(--pad)*2);max-width:none;margin-inline:calc(var(--pad)*-1);border-inline:0;padding-inline:.6rem}}.terms li.vg{color:var(--vg);background:var(--vg-soft)}.terms li.pb{color:var(--pb);background:var(--pb-soft)}.terms li.vm{color:var(--vm);background:var(--vm-soft)}svg .ln,svg .ln-cu,svg .ln-vg,svg .ln-pb,svg .ln-vm{stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}svg .ln:not([fill]),svg .ln-cu:not([fill]),svg .ln-vg:not([fill]),svg .ln-pb:not([fill]),svg .ln-vm:not([fill]){fill:none}svg .ln{stroke:var(--ink)}svg .ln-cu{stroke:var(--cu)}svg .ln-vg{stroke:var(--vg)}svg .ln-pb{stroke:var(--pb)}svg g.ln-vg>rect:not([fill]),svg g.ln-cu>rect:not([fill]),svg g.ln-pb>rect:not([fill]),svg g.ln-vm>rect:not([fill]){fill:none}svg .thick,svg g.thick>*{stroke-width:2.6}svg .dash,svg g.dash>*{stroke-dasharray:4 4}svg text{fill:var(--ink);font-family:var(--f-body)}svg .ts{font-size:13px}svg .tm{font-family:var(--f-mono);font-size:11px}svg .c{text-anchor:middle}svg .r{text-anchor:end}svg text.cu{fill:var(--cu)}svg text.vg{fill:var(--vg)}svg text.pb{fill:var(--pb)}svg text.vm{fill:var(--vm)}svg .bgtext{paint-order:stroke;stroke:var(--plate);stroke-width:5px;stroke-linejoin:round}.m .sq>.rt path{fill:none;stroke:currentColor;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}.m .sq>.rt path.rh{stroke-width:1.6px}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="위에서 내려 긋는 선분 — 선분은 A에서 오르는 사다리가 아니라 D에서 내려와 아래 칸을 정립하고 거슬러 인정하는 도약이다" height="100%" role="img" viewBox="0 0 480 320" width="100%" xmlns="http://www.w3.org/2000/svg">
<text class="ts vg" x="20" y="22">좋음 = 선 전체</text>
<text class="tm" x="20" y="38">어느 칸도 전체가 아니다</text>
<rect class="ln-vg dash" fill="url(#h-vg)" fill-opacity="0.7" height="22" width="56" x="172" y="30"></rect>
<text class="tm vg" x="236" y="45">초월론적 잉여</text>
<rect class="ln-pb" fill="url(#h-pb)" height="100" width="56" x="172" y="52"></rect>
<rect class="ln-pb" fill="url(#h-pb)" height="50" width="56" x="172" y="152"></rect>
<rect class="ln-cu" fill="url(#h-cu)" height="50" width="56" x="172" y="202"></rect>
<rect class="ln-cu" fill="url(#h-cu)" height="25" width="56" x="172" y="252"></rect>
<g class="ln"><line x1="166" x2="234" y1="52" y2="52"></line><line x1="166" x2="234" y1="152" y2="152"></line><line x1="166" x2="234" y1="202" y2="202"></line><line x1="166" x2="234" y1="252" y2="252"></line><line x1="166" x2="234" y1="277" y2="277"></line></g>
<text class="tm c bgtext" x="200" y="106">D 형상</text>
<text class="tm c bgtext" x="200" y="181">C 수학</text>
<text class="tm c bgtext" x="200" y="231">B 사물</text>
<text class="tm c bgtext" x="200" y="268">A 그림자</text>
<text class="tm pb" x="236" y="72">지능의 자리 = D</text>
<path class="ln-pb" d="M230,94 C268,102 268,172 233,177" marker-end="url(#ah-pb)"></path>
<path class="ln-pb" d="M230,90 C304,98 304,222 233,227" marker-end="url(#ah-pb)"></path>
<path class="ln-pb thick" d="M230,86 C342,94 342,259 242,263"></path><line class="ln-pb" marker-end="url(#ah-pb)" x1="243" x2="233" y1="263" y2="264"></line>
<text class="tm" x="328" y="181">③ 다수 속 보편의 통일</text>
<text class="tm" x="328" y="231">② 겉모습 뒤 대상의 통일</text>
<text class="tm" x="328" y="268">① 감각적 흐름의 조직</text>
<text class="tm vm" x="328" y="116">도약이 길수록 위험이 크다</text>
<path class="ln-vg" d="M170,272 C58,284 58,62 168,58" marker-end="url(#ah-vg)"></path>
<text class="ts r vg" x="84" y="166">소급적 인정</text>
<text class="tm r vg" x="84" y="182">A → D</text>
<text class="tm vm" x="20" y="298">✕ 흔한 읽기: A → B → C → D, 시간의 사다리</text>
<text class="tm" x="20" y="314">더 큰 D를 더 작은 A로 환원 · 주어진 것의 신화</text>
</svg></svg>
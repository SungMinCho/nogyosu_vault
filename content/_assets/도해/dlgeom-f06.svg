 }.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:1rem 3rem}.lecture{display:contents}.fig{margin:.6rem 0}.panels{display:flex;flex-wrap:wrap;gap:1rem 1.2rem;justify-content:center;align-items:flex-start}.pn{display:block;flex:1 1 17.5rem;max-width:21rem;height:auto;background:var(--sheet);border:1px solid var(--rule)}.pn.sm{flex:1 1 12.5rem;max-width:15rem}.pn.tall{max-width:23rem}svg text{font-family:var(--f-mono)}.t-lab{font-family:var(--f-body);fill:var(--ink)}.t-head{font-family:var(--f-disp);fill:var(--ink)}.s-in{stroke:var(--c-in)}.s-out{stroke:var(--c-out)}.s-rule{stroke:var(--rule)}.s-none{stroke:none}.f-in{fill:var(--c-in)}.f-out{fill:var(--c-out)}.f-inv{fill:var(--c-inv)}.f-orth{fill:var(--c-orth)}.f-warn{fill:var(--c-warn)}.f-null{fill:var(--c-null)}.f-ink{fill:var(--ink)}.f-mut{fill:var(--ink-2)}.f-none{fill:none}.f-win{fill:var(--w-in)}.f-winv{fill:var(--w-inv)}.f-worth{fill:var(--w-orth)}.f-wmut{fill:var(--w-mut)}line,polyline,path{fill:none}.katex svg path{fill:currentColor}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="입력 평면에서 첫 층의 곧은 경계와 둘째 층의 꺾인 경계" class="pn" height="100%" role="img" viewBox="0 0 320 270" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="folda-in" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-in" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="folda-out" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-out" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="folda-inv" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-inv" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="folda-orth" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" re
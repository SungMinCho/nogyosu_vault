<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 680 252" width="680" height="252" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#E8ECE6; --panel:#F2F5F0; --grid:#D3DBD0; --grid-2:#BDC9B9;
  --ink:#1B2024; --ink-2:#4A545B; --ink-3:#6B767C;
  --copy:#3A4C98; --prop:#0B7367; --code:#8E6208; --alarm:#A63B28;
  --copy-soft:rgba(58,76,152,.14); --prop-soft:rgba(11,115,103,.14);
  --code-soft:rgba(142,98,8,.14); --alarm-soft:rgba(166,59,40,.13);
  --shade:rgba(27,32,36,.07);
  --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2);
  --f-disp:"Orbit","Do Hyeon","Nanum Gothic",sans-serif;
  --f-body:"Source Serif 4","Nanum Myeongjo","Noto Serif CJK KR","Noto Serif KR",serif;
  --f-mono:"Martian Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
  --f-lab:"Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111514; --panel:#171C1B; --grid:#1F2725; --grid-2:#2B3532;
    --ink:#E1E6E0; --ink-2:#AAB4AE; --ink-3:#86918B;
    --copy:#93A5F2; --prop:#43BCA9; --code:#D9A43E; --alarm:#E4795F;
    --copy-soft:rgba(147,165,242,.16); --prop-soft:rgba(67,188,169,.16);
    --code-soft:rgba(217,164,62,.15); --alarm-soft:rgba(228,121,95,.15);
    --shade:rgba(225,230,224,.07);
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111514; --panel:#171C1B; --grid:#1F2725; --grid-2:#2B3532;
  --ink:#E1E6E0; --ink-2:#AAB4AE; --ink-3:#86918B;
  --copy:#93A5F2; --prop:#43BCA9; --code:#D9A43E; --alarm:#E4795F;
  --copy-soft:rgba(147,165,242,.16); --prop-soft:rgba(67,188,169,.16);
  --code-soft:rgba(217,164,62,.15); --alarm-soft:rgba(228,121,95,.15);
  --shade:rgba(225,230,224,.07);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero svg{ display:block; width:100%; height:auto }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:1rem 3rem }.lecture{ display:contents }figure.fig{ margin:.6rem 0 !important }.fig-frame{ overflow-x:auto; border:1px solid var(--grid-2); background-color:var(--panel);
  background-image:
    linear-gradient(90deg,var(--panel) 30%,rgba(0,0,0,0)),
    linear-gradient(90deg,rgba(0,0,0,0),var(--panel) 70%) 100% 0,
    radial-gradient(farthest-side at 0 50%,var(--shade),rgba(0,0,0,0)),
    radial-gradient(farthest-side at 100% 50%,var(--shade),rgba(0,0,0,0)) 100% 0,
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,repeat,repeat;
  background-size:40px 100%,40px 100%,14px 100%,14px 100%,12px 12px,12px 12px;
  background-attachment:local,local,scroll,scroll,local,local; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; color:var(--ink) }.fig-frame text, .hero text{ font-family:var(--f-lab); fill:var(--ink); font-size:12px }text.s{ font-size:11px }text.xs{ font-size:10px }text.l{ font-size:14px }text.xl{ font-size:18px }text.b{ font-weight:700 }text.mut{ fill:var(--ink-2) }text.halo{ paint-order:stroke fill; stroke:var(--panel) !important; stroke-width:6px; stroke-linejoin:round }text.he{ font-family:"Noto Serif Hebrew","Noto Sans Hebrew","Times New Roman",serif; font-size:30px }.t-prop{ fill:var(--prop) !important }.t-alarm{ fill:var(--alarm) !important }.s-ink{ stroke:var(--ink); fill:none }.s-prop{ stroke:var(--prop); fill:none }.s-alarm{ stroke:var(--alarm); fill:none }.f-paper{ fill:var(--panel) }.m-ink{ fill:var(--ink) }.m-copy{ fill:var(--copy) }.m-prop{ fill:var(--prop) }.m-code{ fill:var(--code) }.m-alarm{ fill:var(--alarm) }.m-mut{ fill:var(--ink-3) }.dash{ stroke-dasharray:5 4 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }svg.pz-root{width:680px!important;height:252px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="에메트와 메트. 알레프(1), 멤(40), 타우(400)를 더하면 441, 알레프를 지우면 440. 물질은 그대로이고 새겨진 기호 하나가 생사를 가른다." class="pz-inner" height="100%" role="img" viewBox="0 0 680 252" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f01-a-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-ink" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f01-a-copy" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-copy" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f01-a-prop" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-prop" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f01-a-code" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-code" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f01-a-alarm" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-alarm" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f01-a-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-mut" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><text class="xs mut" text-anchor="middle" x="172.0" y="44.0">← 읽는 방향</text><rect class="f-paper s-ink w15" height="64.0" rx="0" width="56.0" x="88.0" y="58.0"></rect><text class="he" text-anchor="middle" x="116.0" y="101.0">ת</text><text class="l" text-anchor="middle" x="116.0" y="144.0">400</text><rect class="f-paper s-ink w15" height="64.0" rx="0" width="56.0" x="152.0" y="58.0"></rect><text class="he" text-anchor="middle" x="180.0" y="101.0">מ</text><text class="l" text-anchor="middle" x="180.0" y="144.0">40</text><rect class="f-paper s-prop w2" height="64.0" rx="0" width="56.0" x="216.0" y="58.0"></rect><text class="he" text-anchor="middle" x="244.0" y="101.0">א</text><text class="l" text-anchor="middle" x="244.0" y="144.0">1</text><text class="l b" text-anchor="middle" x="172.0" y="178.0">1 + 40 + 400 = 441</text><text class="s t-prop" text-anchor="middle" x="172.0" y="202.0">에메트 אמת · 진리 → 산다</text><line class="s-alarm w2" marker-end="url(#f01-a-alarm)" x1="300.0" x2="392.0" y1="90.0" y2="90.0"></line><text class="s t-alarm" text-anchor="middle" x="346.0" y="78.0">알레프를 지운다</text><text class="xs mut" text-anchor="middle" x="528.0" y="44.0">← 읽는 방향</text><rect class="f-paper s-ink w15" height="64.0" rx="0" width="56.0" x="424.0" y="58.0"></rect><text class="he" text-anchor="middle" x="452.0" y="101.0">ת</text><text class="l" text-anchor="middle" x="452.0" y="144.0">400</text><rect class="f-paper s-ink w15" height="64.0" rx="0" width="56.0" x="488.0" y="58.0"></rect><text class="he" text-anchor="middle" x="516.0" y="101.0">מ</text><text class="l" text-anchor="middle" x="516.0" y="144.0">40</text><rect class="s-alarm w15 dash" height="64.0" rx="0" width="56.0" x="552.0" y="58.0"></rect><text class="he t-alarm" text-anchor="middle" x="580.0" y="101.0">א</text><line class="s-alarm w2" x1="558.0" x2="602.0" y1="112.0" y2="68.0"></line><text class="l t-alarm" text-anchor="middle" x="580.0" y="144.0">−1</text><text class="l b" text-anchor="middle" x="500.0" y="178.0">40 + 400 = 440</text><text class="s t-alarm" text-anchor="middle" x="500.0" y="202.0">메트 מת · 죽음 → 흙으로</text><text class="s mut" text-anchor="middle" x="340.0" y="238.0">진흙은 한 톨도 안 바뀐다 · 바뀐 것은 새겨진 기호 하나</text></svg></g></g></g></g></svg>
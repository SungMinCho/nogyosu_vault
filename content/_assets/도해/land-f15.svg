<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 780 304" width="780" height="304" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-zero{ fill:var(--zero) }.fig .f-zerosoft{ fill:var(--zero-soft) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-ledgersoft{ fill:var(--ledger-soft) }.fig .f-blood{ fill:var(--blood) }.fig .s-ink{ stroke:var(--ink) }.fig .s-zero{ stroke:var(--zero) }.fig .s-ledger{ stroke:var(--ledger) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="칸트는 무를 범주에 맞춰 넷으로 나누고 누메논을 첫째 칸에 넣는다. 바타유의 희생은 같은 네 칸을 통일 이전, 사치, 일방, 불가능으로 다시 읽는다." height="100%" role="img" style="--minw:718px" viewBox="0 0 780 304" width="100%"><defs><marker id="nothings-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="nothings-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="nothings-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="nothings-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="nothings-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="nothings-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><text class="t-s t-b f-mute" x="20" y="30">범주</text><text class="t-s t-b f-ledger" text-anchor="middle" x="205" y="30">칸트의 무</text><text class="t-s t-b f-mute" x="350" y="30">칸트의 예</text><text class="t-s t-b f-ledger" x="482" y="30">칸트가 찍은 특징</text><text class="t-s t-b f-zero" text-anchor="middle" x="705" y="30">바타유의 영</text><text class="t-b" x="20" y="74">양</text><rect class="f-ledgersoft s-ledger" height="50" rx="5" width="250" x="80" y="44"></rect><text class="t-s t-b" text-anchor="middle" x="205" y="64.5">엔스 라티오니스</text><text class="t-s f-mute" text-anchor="middle" x="205" y="82.5">대상 없는 빈 개념</text><text class="t-s f-mute" x="350" y="64.5">새 근본 힘,</text><text class="t-s t-b f-zero" x="350" y="81.5">누메논</text><text class="t-b f-ledger" x="482" y="74">빼기</text><line class="s-ink" marker-end="url(#nothings-ink)" x1="574" x2="628" y1="69" y2="69"></line><rect class="f-zerosoft s-zero" height="38" rx="5" width="142" x="634" y="50"></rect><text class="t-b" text-anchor="middle" x="705" y="73.5">통일 이전</text><text class="t-b" x="20" y="138">질</text><rect class="f-ledgersoft s-ledger" height="50" rx="5" width="250" x="80" y="108"></rect><text class="t-s t-b" text-anchor="middle" x="205" y="128.5">니힐 프리바티붐</text><text class="t-s f-mute" text-anchor="middle" x="205" y="146.5">개념의 빈 대상</text><text class="t-s f-mute" x="350" y="137">그림자, 추위</text><text class="t-b f-ledger" x="482" y="138">결여</text><line class="s-ink" marker-end="url(#nothings-ink)" x1="574" x2="628" y1="133" y2="133"></line><rect class="f-zerosoft s-zero" height="38" rx="5" width="142" x="634" y="114"></rect><text class="t-b" text-anchor="middle" x="705" y="137.5">사치 · 넘침</text><text class="t-b" x="20" y="202">관계</text><rect class="f-ledgersoft s-ledger" height="50" rx="5" width="250" x="80" y="172"></rect><text class="t-s t-b" text-anchor="middle" x="205" y="192.5">엔스 이마기나리움</text><text class="t-s f-mute" text-anchor="middle" x="205" y="210.5">대상 없는 빈 직관</text><text class="t-s f-mute" x="350" y="192.5">순수 공간,</text><text class="t-s f-mute" x="350" y="209.5">순수 시간</text><text class="t-b f-ledger" x="482" y="202">무능</text><line class="s-ink" marker-end="url(#nothings-ink)" x1="574" x2="628" y1="197" y2="197"></line><rect class="f-zerosoft s-zero" height="38" rx="5" width="142" x="634" y="178"></rect><text class="t-b" text-anchor="middle" x="705" y="201.5">일방적</text><text class="t-b" x="20" y="266">양상</text><rect class="f-ledgersoft s-ledger" height="50" rx="5" width="250" x="80" y="236"></rect><text class="t-s t-b" text-anchor="middle" x="205" y="256.5">니힐 네가티붐</text><text class="t-s f-mute" text-anchor="middle" x="205" y="274.5">개념 없는 빈 대상</text><text class="t-s f-mute" x="350" y="256.5">두 변으로 된</text><text class="t-s f-mute" x="350" y="273.5">직선 도형</text><text class="t-b f-ledger" x="482" y="266">변증 · 모순</text><line class="s-ink" marker-end="url(#nothings-ink)" x1="574" x2="628" y1="261" y2="261"></line><rect class="f-zerosoft s-zero" height="38" rx="5" width="142" x="634" y="242"></rect><text class="t-b" text-anchor="middle" x="705" y="265.5">불가능</text></svg></svg>
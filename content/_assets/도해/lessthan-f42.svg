<path class="f-none s-cob w15" d="M112,172 Q124,150 150,138" marker-end="url(#L14-3-ar-cob)"></path>
<text class="t-end t-s f-cob" x="102" y="150">빛 아래 꿇린다</text>
<rect class="f-cobf s-cob w2" height="40" rx="6" width="232" x="44" y="292"></rect>
<text class="t-mid t-b f-cob" x="160" y="317">선 — 사랑의 동일성</text>
<text class="t-mid t-s t-muted" x="160" y="356">절대적 동일성이 악보다 앞선다</text>
<!-- 데이비스의 하이데거 -->
<text class="t-mid t-l t-b" x="441" y="36">데이비스의 하이데거</text>
<text class="t-mid t-s t-muted" x="441" y="58">투쟁이 먼저, 끝이 열림</text>
<rect class="f-none s-muted w15 dash" height="36" rx="6" width="140" x="371" y="98"></rect>
<text class="t-mid t-muted" x="441" y="121">화해 — 없음</text>
<path class="f-none s-cob w3 round" d="M330,312 C343.5,298 356.5,298 370,312 S396.5,326 410,312 S436.5,298 450,312 S476.5,326 490,312 S516.5,298 530,312" marker-end="url(#L14-3-ar-cob)"></path>
<path class="f-none s-red w3 round" d="M330,312 C343.5,326 356.5,326 370,312 S396.5,298 410,312 S436.5,326 450,312 S476.5,298 490,312 S516.5,326 530,312" marker-end="url(#L14-3-ar-red)"></path>
<text class="t-end t-s t-b f-cob" x="322" y="300">선</text>
<text class="t-end t-s t-b f-red" x="322" y="334">악</text>
<text class="t-mid t-b t-muted" x="556" y="317">…</text>
<text class="t-mid t-s t-muted" x="441" y="356">원초적·구성적 투쟁, 결과 보장 없음</text>
<!-- 지젝의 헤겔 -->
<text class="t-mid t-l t-b" x="730" y="36">지젝의 헤겔</text>
<text class="t-mid t-s t-muted" x="730" y="58">악이 먼저, 선은 위태로운 자기 지양들</text>
<text class="t-mid t-s f-cob" x="730" y="84">선 = 자기 지양된, 보편화된 악</text>
<rect class="f-cobf s-cob w15 dash" height="30" rx="14" width="64" x="622" y="196"></rect>
<text class="t-mid t-b f-cob" x="654" y="216">선</text>
<rect class="f-cobf s-cob w15 dash" height="30" rx="14" width="64" x="700" y="112"></rect>
<text class="t-mid t-b f-cob" x="732" y="132">선</text>
<rect class="f-cobf s-cob w15 dash" height="30" rx="14" width="64" x="790" y="176"></rect>
<text class="t-mid t-b f-cob" x="822" y="196">선</text>
<line class="s-cob w15" marker-end="url(#L14-3-ar-cob)" x1="654" x2="654" y1="284" y2="230"></line>
<line class="s-cob w15" marker-end="url(#L14-3-ar-cob)" x1="732" x2="732" y1="282" y2="146"></line>
<line class="s-cob w15" marker-end="url(#L14-3-ar-cob)" x1="822" x2="822" y1="284" y2="210"></line>
<text class="t-s f-cob" x="742" y="240">자기 지양</text>
<path class="f-redf s-red w2 round" d="M606,334 L606,294 L620,284 L632,296 L646,282 L660,296 L674,280 L688,294 L702,282 L716,296 L730,280 L744,294 L758,282 L772,296 L786,280 L800,294 L814,282 L828,296 L842,284 L856,294 L856,334 z"></path>
<text class="t-mid t-b f-red" x="731" y="320">악 — 원초적 불협화 · 과잉</text>
<text class="t-mid t-s t-muted" x="731" y="356">꼼짝 못함 · 투쟁이 곧 악</text>
<!-- 아래 판정 -->
<line class="s-rule w1" x1="40" x2="860" y1="374" y2="374"></line>
<text class="t-mid t-s t-b" x="160" y="398">짜고 친 판 — 결과 보장</text>
<text class="t-mid t-s t-muted" x="160" y="416">데이비스: 헤겔도 여기</text>
<text class="t-mid t-s t-b" x="441" y="398">열린 판 — 화해 없음</text>
<text class="t-mid t-s t-b" x="730" y="398">보장할 결과도, 판 짜는 주인도 없음</text>
<text class="t-mid t-s t-muted" x="730" y="416">지젝: 열린 투쟁보다 더 급진적</text>
</svg></g></g></g></g></g></svg>
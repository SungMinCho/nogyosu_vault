<text text-anchor="middle" x="420" y="127">방추상 얼굴 영역</text>
<path class="ln-2" d="M132,70 Q132,122 227,122" marker-end="url(#faces-ahm)"></path>
<text class="t-s t-m" text-anchor="end" x="124" y="104">큰길 · 느림</text>
<path class="ln-2" d="M318,122 L355,122" marker-end="url(#faces-ahm)"></path>
<rect class="f-paper ln-neuro" height="44" rx="3" width="144" x="520" y="30"></rect>
<text class="t-b t-neuro" text-anchor="middle" x="592" y="49">전두피질</text>

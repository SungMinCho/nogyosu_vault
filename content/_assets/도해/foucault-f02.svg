<circle class="f-ink" cx="494" cy="200" r="2.5"></circle><circle class="f-ink" cx="504" cy="200" r="2.5"></circle><circle class="f-ink" cx="499" cy="212" r="2.5"></circle>
<line class="s-thin" marker-end="url(#d-three-regions-ar)" x1="511" x2="531" y1="206" y2="206"></line>
<circle class="f-ink" cx="539" cy="212" r="2.5"></circle><circle class="f-ink" cx="549" cy="212" r="2.5"></circle><circle class="f-ink" cx="544" cy="200" r="2.5"></circle>
<line class="s-thin" marker-end="url(#d-three-regions-ar)" x1="556" x2="576" y1="206" y2="206"></line>
<circle class="f-ink" cx="584" cy="200" r="2.5"></circle><circle class="f-ink" cx="596" cy="206" r="2.5"></circle><circle class="f-ink" cx="584" cy="212" r="2.5"></circle>
<text class="t-s mid" x="215" y="240">끊김 없는 눈금</text>
<text class="t-s mid" x="325" y="240">낱낱의 조각</text>
<text class="t-s mid" x="435" y="240">공간에 매임</text>
<text class="t-s mid" x="545" y="240">시간 따라 새로 짜임</text>
<line class="s-thin k-rule" x1="170" x2="278" y1="256" y2="256"></line>
<line class="s-thin k-rule" x1="482" x2="590" y1="256" y2="256"></line>
<text class="t-s b mid" x="380" y="260">질서의 꼴은 문화와 시대마다 다르다</text>
<!-- 이 책의 자리 -->
<line class="s-thin" marker-end="url(#d-three-regions-ar)" x1="706" x2="614" y1="198" y2="198"></line>
<text class="t-s b mid" x="662" y="188">이 책이 파는 층</text>
<!-- 아래로: 코드에 드러남 -->
<line class="s" marker-end="url(#d-three-regions-ar)" x1="380" x2="380" y1="272" y2="302"></line>
<text class="t-s" x="390" y="292">말·지각·몸짓으로 드러남 (잘·서툴게)</text>
<!-- 한 뼘 비켜섬 -->
<line class="s-thin k-mute dot" x1="110" x2="110" y1="304" y2="276"></line>
<line class="s-thin k-mute dot" x1="150" x2="150" y1="271" y2="296"></line>
<line class="s-thin" marker-end="url(#d-three-regions-ar)" x1="112" x2="148" y1="284" y2="284"></line>
<text class="t-s end" x="104" y="288">한 뼘 비켜섬</text>
<!-- 아래: 기본 코드 -->
<rect class="s-thin f-panel" height="56" width="460" x="110" y="304"></rect>
<text class="t-l b" x="130" y="328">기본 코드</text>
<text class="t-s mute" x="130" y="348">말 · 보는 버릇 · 교환 · 기술 · 가치 — 태어나면서 제집처럼 산다 (투명)</text>
</svg></g></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 400" width="800" height="400" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .t-pos{ fill:var(--pos) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .f-ink{ fill:var(--ink) }.dg .f-pos{ fill:var(--pos) }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-spike{ fill:var(--spike-soft); stroke:var(--spike) }.dg .bx-pos{ fill:var(--pos-soft); stroke:var(--pos) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.dg .bx-ink{ fill:var(--paper); stroke:var(--ink-2) }.dg .ssub{ font-size:8px }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="과제의 결정 흐름: RoPE가 없는 층이면 병합이 정확하고, 있으면 목표 비트에 따라 8비트는 쌍별 회전 병합, 4비트는 숨기기, RoPE 전 캐시, 또는 병합 후 변화를 감수하는 길로 나뉜다" class="dg" height="100%" role="img" style="" viewBox="0 0 800 400" width="100%"><defs><marker id="j11-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="j11-pos" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-pos" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="bx-ink" height="44" rx="6" width="200" x="300" y="20"></rect><text class="t-s t-b" text-anchor="middle" x="400" y="46">이 층에 RoPE가 있나?</text><line class="ln" marker-end="url(#j11-ink)" x1="320" x2="140" y1="64" y2="98"></line><text class="t-s t-b t-pos" text-anchor="middle" x="210" y="78">없다 (NoPE)</text><rect class="bx-pos" height="50" rx="6" width="220" x="30" y="100"></rect><text class="t-s t-b t-pos" text-anchor="middle" x="140" y="123">W<tspan class="ssub" dy="3">q</tspan><tspan dy="-3">​</tspan>·W<tspan class="ssub" dy="3">k</tspan><tspan dy="-3">​</tspan>에 하다마드 병합</text><text class="t-s t-mut" text-anchor="middle" x="140" y="139">정확 · 비용 0 · 학습도 가능</text><line class="ln" marker-end="url(#j11-ink)" x1="400" x2="400" y1="64" y2="98"></line><text class="t-s t-b" text-anchor="start" x="408" y="86">있다</text><rect class="bx-ink" height="44" rx="6" width="200" x="300" y="100"></rect><text class="t-s t-b" text-anchor="middle" x="400" y="126">Q·K 목표 비트는?</text><line class="ln" marker-end="url(#j11-ink)" x1="480" x2="640" y1="144" y2="178"></line><text class="t-s t-b" text-anchor="start" x="580" y="152">8비트</text><rect class="bx-rot" height="50" rx="6" width="220" x="560" y="180"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="670" y="203">쌍별 회전 · 배율만 병합</text><text class="t-s t-mut" text-anchor="middle" x="670" y="219">FPTQuant — 대등할 가능성</text><line class="ln" marker-end="url(#j11-ink)" x1="400" x2="400" y1="144" y2="178"></line><text class="t-s t-b" text-anchor="start" x="408" y="166">4비트</text><rect class="bx-spike" height="44" rx="6" width="220" x="290" y="180"></rect><text class="t-s t-b t-spike" text-anchor="middle" x="400" y="200">헤드 전체를 섞어야 한다</text><text class="t-s t-mut" text-anchor="middle" x="400" y="216">병합하면 기능이 바뀐다</text><line class="ln" marker-end="url(#j11-ink)" x1="400" x2="140" y1="224" y2="268"></line><rect class="bx-grid" height="50" rx="6" width="220" x="30" y="270"></rect><text class="t-s t-b" text-anchor="middle" x="140" y="293">RoPE 커널에 숨기기</text><text class="t-s t-mut" text-anchor="middle" x="140" y="309">FA3 — 온라인, 거의 공짜</text><line class="ln" marker-end="url(#j11-ink)" x1="400" x2="390" y1="224" y2="268"></line><rect class="bx-grid" height="50" rx="6" width="220" x="280" y="270"></rect><text class="t-s t-b" text-anchor="middle" x="390" y="293">RoPE 전 키 캐시</text><text class="t-s t-mut" text-anchor="middle" x="390" y="309">RotateKV — 읽을 때 되돌리기</text><line class="ln" marker-end="url(#j11-ink)" x1="400" x2="640" y1="224" y2="268"></line><rect class="bx-pos" height="50" rx="6" width="220" x="530" y="270"></rect><text class="t-s t-b" text-anchor="middle" x="640" y="293">병합 + 변화 감수</text><text class="t-s t-mut" text-anchor="middle" x="640" y="309">FP 대조 → 미세조정?</text><text class="t-s t-mut" text-anchor="start" x="30" y="350">함께 확인: 키를 채널별로 양자화하면 하다마드가 해로울 수 있다(KVLinC). 공통 오프셋은 평균 빼기가 먼저(SageAttention).</text><text class="t-s t-b t-pos" text-anchor="start" x="30" y="372">어느 길이든: 양자화를 끈 FP 대조로 "같은 모델인가"를 먼저, 그다음 양자화 오차를 따로 잰다.</text></svg></svg>
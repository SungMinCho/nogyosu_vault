<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 350" width="880" height="350" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.c-fire{ fill:var(--fire) !important }.c-pass{ fill:var(--pass) !important }.c-order{ fill:var(--order) !important }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-rule{ stroke:var(--rule) }.s-fire{ stroke:var(--fire) }.s-pass{ stroke:var(--pass) }.s-order{ stroke:var(--order) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-land{ fill:var(--land) }.f-fire-t{ fill:var(--fire); fill-opacity:.16 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.dash{ stroke-dasharray:5 4 }.dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }.mk-ink{ fill:var(--ink) }.mk-ink2{ fill:var(--ink2) }.mk-fire{ fill:var(--fire) }.mk-pass{ fill:var(--pass) }svg.pz-root{width:880px!important;height:350px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="인식의 세 단계. 주관–주관에서는 데카르트의 밀랍도 코기토도 고정된 정보를 쥐지 않는다. 주관–객관에서는 바슐라르의 무장한 주체가 정해지지 않은 대상에 엄밀함을 강제한다. 객관–객관에서는 두 사물이 모두 새겨진 정보를 지니고 서로 보내고 받으며, 나는 가끔 그 대화를 가로챌 뿐이다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 880 350" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F11-ar-fire" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-fire" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F11-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F11-ar-ink2" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink2" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F11-ar-pass" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-pass" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="tb" text-anchor="middle" x="150" y="30">① 주관–주관</text><text class="ts" text-anchor="middle" x="150" y="48">데카르트의 밀랍</text><text class="tb" text-anchor="middle" x="440" y="30">② 주관–객관</text><text class="ts" text-anchor="middle" x="440" y="48">바슐라르</text><text class="tb" text-anchor="middle" x="730" y="30">③ 객관–객관</text><text class="ts" text-anchor="middle" x="730" y="48">사물이 사물에 쓰는 언어</text><line class="s-rule w1 dot f-none" x1="295" x2="295" y1="18" y2="330"></line><line class="s-rule w1 dot f-none" x1="585" x2="585" y1="18" y2="330"></line><rect class="s-ink2 w15 dot f-none" height="56" rx="4" width="56" x="47" y="122"></rect><circle class="s-ink2 w15 dot f-none" cx="222" cy="150" r="28"></circle><line class="s-ink2 w15 dash f-none" marker-end="url(#F11-ar-ink2)" x1="107" x2="190" y1="150" y2="150"></line><path class="s-ink w15 f-none" d="M206,126 C186,72 258,72 238,126" marker-end="url(#F11-ar-ink)"></path><text class="ts" text-anchor="middle" x="222" y="74">정신의 통찰</text><text class="t" text-anchor="middle" x="75" y="198">밀랍</text><text class="ts" text-anchor="middle" x="75" y="215">불 곁에서 성질을 다 잃음</text><text class="t" text-anchor="middle" x="222" y="198">코기토</text><text class="ts" text-anchor="middle" x="222" y="215">감각 아닌 정신</text><circle class="s-ink f-deep w2" cx="365" cy="150" r="28"></circle><text class="t" text-anchor="middle" x="365" y="155">주체</text><rect class="s-fire f-fire-t w15" height="28" rx="2" width="22" x="392" y="136"></rect><rect class="s-ink2 w15 dot f-none" height="56" rx="4" width="56" x="487" y="122"></rect><line class="s-fire w1 f-none" x1="501" x2="501" y1="128" y2="172"></line><line class="s-fire w1 f-none" x1="493" x2="537" y1="136" y2="136"></line><line class="s-fire w1 f-none" x1="515" x2="515" y1="128" y2="172"></line><line class="s-fire w1 f-none" x1="493" x2="537" y1="150" y2="150"></line><line class="s-fire w1 f-none" x1="529" x2="529" y1="128" y2="172"></line><line class="s-fire w1 f-none" x1="493" x2="537" y1="164" y2="164"></line><line class="s-fire w3 f-none" marker-end="url(#F11-ar-fire)" x1="418" x2="482" y1="150" y2="150"></line><text class="t c-fire" text-anchor="middle" x="450" y="124">강제</text><text class="ts" text-anchor="middle" x="365" y="198">개념·장치로 무장</text><text class="ts" text-anchor="middle" x="515" y="198">정해지지 않은 대상</text><text class="ts c-fire" text-anchor="middle" x="515" y="215">주체가 그은 격자</text><rect class="s-order f-land w15" height="56" rx="4" width="56" x="627" y="122"></rect><line class="s-order w15 f-none" x1="638" x2="672" y1="140" y2="140"></line><line class="s-order w15 f-none" x1="638" x2="664" y1="150" y2="150"></line><line class="s-order w15 f-none" x1="638" x2="668" y1="160" y2="160"></line><rect class="s-order f-land w15" height="56" rx="4" width="56" x="777" y="122"></rect><line class="s-order w15 f-none" x1="788" x2="822" y1="140" y2="140"></line><line class="s-order w15 f-none" x1="788" x2="814" y1="150" y2="150"></line><line class="s-order w15 f-none" x1="788" x2="818" y1="160" y2="160"></line><line class="s-pass w15 f-none" marker-end="url(#F11-ar-pass)" x1="687" x2="773" y1="140" y2="140"></line><line class="s-pass w15 f-none" marker-end="url(#F11-ar-pass)" x1="773" x2="687" y1="160" y2="160"></line><text class="ts c-pass" text-anchor="middle" x="730" y="132">보내고 받는다</text><text class="t" text-anchor="middle" x="655" y="198">사물</text><text class="t" text-anchor="middle" x="805" y="198">사물</text><circle class="s-ink f-deep w15" cx="730" cy="240" r="12"></circle><text class="ts" text-anchor="middle" x="730" y="244">나</text><line class="s-ink2 w1 dot f-none" x1="730" x2="730" y1="226" y2="166"></line><text class="ts" text-anchor="start" x="746" y="244">가끔 가로챔</text><line class="s-rule w1 f-none" x1="20" x2="860" y1="276" y2="276"></line><text class="t" text-anchor="middle" x="150" y="302">정보를 쥔 쪽: 어느 쪽도 아님</text><text class="t" text-anchor="middle" x="440" y="302">정보를 쥔 쪽: 주체만</text><text class="t" text-anchor="middle" x="730" y="302">정보를 쥔 쪽: 양쪽 다</text><text class="ts c-order" text-anchor="middle" x="730" y="322">사물에 새겨진 정보</text><text class="ts" text-anchor="middle" x="440" y="322">대상은 장치 안에서 제작된다</text><text class="ts" text-anchor="middle" x="150" y="322">앎 = 주체가 주체 안에서 확인</text></svg></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 300" width="640" height="300" class="pz-root"><style>:root{
  --bg:#E6E9EC; --bg2:#DCE0E4; --bg3:#F1F3F4;
  --fg:#15181D; --mute:#5B626B; --rule:#B6BDC4; --faint:#CDD2D7;
  --star:#33409C; --sun:#A2560F; --moon:#24695D; --gap:#C42A1B; --fix:#8C2C80;
  --f-display:"Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR",serif;
  --f-body:"Literata","Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR",Georgia,serif;
  --f-label:"IBM Plex Sans KR","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --f-mono:"Spline Sans Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F13; --bg2:#151920; --bg3:#1B2029;
  --fg:#E3E6EA; --mute:#9AA2AC; --rule:#343B45; --faint:#262C35;
  --star:#A3ACFF; --sun:#F0A24C; --moon:#6CC6B1; --gap:#FF6B5B; --fix:#E68BD8;
  color-scheme:dark }}:root[data-theme="dark"]{
  --bg:#0D0F13; --bg2:#151920; --bg3:#1B2029;
  --fg:#E3E6EA; --mute:#9AA2AC; --rule:#343B45; --faint:#262C35;
  --star:#A3ACFF; --sun:#F0A24C; --moon:#6CC6B1; --gap:#FF6B5B; --fix:#E68BD8;
  color-scheme:dark }:root{ --pad:max(16px, env(safe-area-inset-left, 0px)); --padR:max(16px, env(safe-area-inset-right, 0px));
  --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + 4rem); }@media (min-width:34em){:root{ --pad:max(1.6rem, env(safe-area-inset-left, 0px)); --padR:max(1.6rem, env(safe-area-inset-right, 0px)) }}@media (min-width:52em){:root{ --pad:max(2rem, env(safe-area-inset-left, 0px)); --padR:max(2rem, env(safe-area-inset-right, 0px)) }}.plate svg{display:block;width:100%;height:auto}.plate .lstar circle.core{stroke:none}.plate .lstar text{font-family:var(--f-mono);font-size:12px;font-weight:500}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.3rem;padding:0 var(--padR) 0 var(--pad);margin:3rem 0 0}.lecture{display:contents}.lhead,.fig{scroll-margin-top:1rem}figure.fig{margin:.6rem 0 !important;padding:0}.fig .frame{border:1px solid var(--rule);background:var(--bg3);padding:1rem;overflow-x:auto;
  background-image:linear-gradient(to right,var(--bg3) 30%,transparent),linear-gradient(to left,var(--bg3) 30%,transparent),
  linear-gradient(to right,rgba(0,0,0,.12),transparent),linear-gradient(to left,rgba(0,0,0,.12),transparent);
  background-position:left center,right center,left center,right center;background-repeat:no-repeat;
  background-size:2rem 100%,2rem 100%,.8rem 100%,.8rem 100%;background-attachment:local,local,scroll,scroll}.fig .frame.wide svg{min-width:34rem}.fig svg{display:block;width:100%;height:auto;overflow:visible}.s-ink{stroke:var(--fg)}.s-mute{stroke:var(--mute)}.s-gap{stroke:var(--gap)}.fig svg .dot{stroke-dasharray:1.5 3.5}.f-ink{fill:var(--fg)}.f-gap{fill:var(--gap)}.f-bg2{fill:var(--bg2)}.f-moon-soft{fill:var(--moon);fill-opacity:.14}.fig svg text{fill:var(--fg);font-family:var(--f-label);font-size:13px;stroke:none}.fig svg .t-small{font-size:11px;fill:var(--mute)}.fig svg .c-gap{fill:var(--gap)}.fig svg .a-mid{text-anchor:middle}.fig svg .halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}svg.pz-root{width:640px!important;height:300px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="포함에서 시차로: 스탈린은 사회를 우주 일반 법칙의 한 적용 사례로 넣었고, 지젝은 같은 인류를 두 관점에서 본다 — 집단적 실천과 그것을 넘치는 비인간적 핵" class="pz-inner" height="100%" role="img" viewBox="0 0 640 300" width="100%" xmlns="http://www.w3.org/2000/svg">
<text class="t-lab a-mid" x="150" y="26">스탈린 1938 — 포함</text>
<rect class="s-mute f-bg2" height="200" width="252" x="24" y="44"></rect>
<text class="t-lab" x="38" y="68">변증법적 유물론</text>
<text class="t-small" x="38" y="88">우주 전체의 일반 법칙</text>
<text class="t-small" x="38" y="104">(일반 형이상학 자리)</text>
<rect class="s-ink f-moon-soft" height="84" width="180" x="70" y="138"></rect>
<text class="t-lab a-mid" x="160" y="170">역사적 유물론</text>
<text class="t-small a-mid" x="160" y="190">사회에 '적용'한 것</text>
<text class="t-small a-mid" x="160" y="206">(특수 형이상학 자리)</text>
<text class="t-small a-mid" x="150" y="272">보편 ⊃ 특수 — 위층에 우주론, 아래층에 사회</text>
<line class="s-mute dot" x1="318" x2="318" y1="40" y2="270"></line>
<text class="t-lab a-mid" x="480" y="26">지젝 — 시차</text>
<circle class="s-ink f-moon-soft" cx="480" cy="150" r="56"></circle>
<circle class="f-gap" cx="480" cy="150" r="13"></circle>
<text class="t-lab a-mid halo" x="480" y="122">인류</text>
<circle class="f-ink" cx="356" cy="236" r="6"></circle>
<circle class="f-ink" cx="572" cy="236" r="6"></circle>
<line class="s-ink" x1="362" x2="436" y1="230" y2="186"></line>
<line class="s-gap" x1="567" x2="488" y1="230" y2="160"></line>
<text class="t-small a-mid" x="356" y="262">역사적 유물론</text>
<text class="t-small a-mid" x="356" y="278">집단적 실천에 닿음</text>
<text class="t-small a-mid c-gap" x="566" y="262">변증법적 유물론</text>
<text class="t-small a-mid c-gap" x="566" y="278">비인간적 핵에 닿음</text>
<text class="t-small a-mid" x="480" y="56">실체는 같고 관점만 다르다</text>
<text class="t-small a-mid c-gap" x="480" y="74">빨강 = 죽음충동, 인류 안의 과잉</text>
</svg></g></g></g></g></svg>
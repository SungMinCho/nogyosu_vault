nt;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="탐만의 두 봉우리. 가로축은 온도이고 오른쪽 끝이 베톨의 녹는점 약 95 °C, 왼쪽으로 갈수록 과냉각이 깊다. 씨앗 수 곡선은 0.4 °C에서 봉우리(6분에 148개)이고 −10 °C에서 14개, −18 °C에서 0–1개로 떨어진다. 성장 속도 곡선은 녹는점 가까이에 봉우리가 있다. 녹는점 바로 아래 영역 I은 성장은 빠르나 씨앗이 거의 없고, 가운데 영역 II는 둘 다 0이 아니며, 왼쪽 끝 영역 III은 둘 다 0에 가깝다. 빠른 냉각 화살표가 II를 짧게 지나 III에 닿으면 액체는 유리, 곧 얼어붙은 준안정이 된다." class="pz-inner" height="100%" role="img" viewBox="0 0 720 372" width="100%">

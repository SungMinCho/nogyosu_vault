<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 352" width="640" height="352" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EDF0E7; --paper-2:#E0E5D8; --ink:#1B2420; --ink-2:#48534D; --mute:#838B83; --rule:#C5CCBD;
  --ret:#2C6A4C; --risk:#2E4D80; --time:#87631A; --alarm:#B03F28;
  --f-body:"Noto Serif KR","Noto Serif CJK KR","AppleMyungjo","Nanum Myeongjo",serif;
  --f-disp:"Hahmlet","Noto Serif KR","AppleMyungjo",serif;
  --f-latin:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --f-mono:"Fragment Mono","SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;
  --f-dg:"Sunflower","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1613; --paper-2:#18221D; --ink:#E4E1D5; --ink-2:#B3B0A3; --mute:#7D847A; --rule:#2D3933;
  --ret:#5DAE86; --risk:#86A4DA; --time:#D2A64C; --alarm:#E5765C; color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#0F1613; --paper-2:#18221D; --ink:#E4E1D5; --ink-2:#B3B0A3; --mute:#7D847A; --rule:#2D3933;
  --ret:#5DAE86; --risk:#86A4DA; --time:#D2A64C; --alarm:#E5765C; color-scheme:dark }.wrap{padding-inline:var(--pad); padding-block:1.4rem 5rem}.doc{display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.15rem}.lecture{display:contents}.fig{margin:0}.fig .frame{overflow-x:auto; -webkit-overflow-scrolling:touch; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:.6rem 0;
  background:
    linear-gradient(to right, var(--paper) 30%, transparent) left center/2.2rem 100% no-repeat local,
    linear-gradient(to left, var(--paper) 30%, transparent) right center/2.2rem 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.16), transparent) left center/.9rem 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.16), transparent) right center/.9rem 100% no-repeat scroll;}.dg{display:block; width:100%; height:auto; min-width:var(--dg-min,500px); max-width:720px; margin-inline:auto; overflow:visible}.fig.narrow .dg{min-width:0; max-width:440px; margin-inline:auto}.dg text{font-family:var(--f-dg); font-size:15px; fill:var(--ink); font-weight:500}.dg .t-s{font-size:13.5px}.dg .t-xs{font-size:12.5px}.dg .t-l{font-size:17px; font-weight:700}.dg .b{font-weight:700}.dg .t-num{font-family:var(--f-mono); font-size:13.5px; font-weight:400}.dg .t-ink2{fill:var(--ink-2)}.dg .mid{text-anchor:middle}.dg .end{text-anchor:end}.dg .ln{stroke:var(--ink); stroke-width:1.5; fill:none}.dg .ln2{stroke:var(--ink-2); stroke-width:1.2; fill:none}.dg .ln-mute{stroke:var(--mute); stroke-width:1.1; fill:none}.dg .dash{stroke-dasharray:6 4}.dg .grid{stroke:var(--rule); stroke-width:.8; fill:none}.dg .f-paper2{fill:var(--paper-2)}.dg .f-ink-a{fill:var(--ink); fill-opacity:.08}.dg .no-fill{fill:none}.dg .mk2{fill:var(--ink-2)}svg.pz-root{width:640px!important;height:352px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w wrap"><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="공장 하나뿐인 경제의 두 대차대조표. 기업의 부채·자본 100은 가계의 자산 100과 짝을 이루어, 나라 전체를 합치면 금융자산은 지워지고 공장 100만 남는다." class="dg pz-inner" height="100%" role="img" viewBox="0 0 640 352" width="100%">
<defs>
<marker id="ar-f01a" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk2" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 기업 -->
<text class="t-l mid" x="150" y="26">기업 — 공장 하나</text>
<rect class="f-paper2" height="168" width="220" x="40" y="40"></rect>
<line class="ln" x1="150" x2="150" y1="40" y2="208"></line>
<line class="ln" x1="40" x2="260" y1="40" y2="40"></line>
<text class="t-s mid t-ink2" x="95" y="60">자산</text>
<text class="t-s mid t-ink2" x="205" y="60">부채 · 자본</text>
<rect class="f-ink-a" height="124" width="86" x="52" y="72"></rect>
<text class="b mid" x="95" y="128">공장</text>
<text class="t-num mid" x="95" y="148">100</text>
<text class="t-xs mid t-ink2" x="95" y="168">실물자산</text>
<rect class="no-fill ln2 dash" height="72" width="86" x="162" y="72"></rect>
<text class="mid" x="205" y="104">채권</text>
<text class="t-num mid" x="205" y="124">60</text>
<rect class="no-fill ln2 dash" height="48" width="86" x="162" y="148"></rect>
<text class="mid" x="205" y="170">주식</text>
<text class="t-num mid" x="205" y="188">40</text>
<!-- 가계 -->
<text class="t-l mid" x="490" y="26">가계</text>
<rect class="f-paper2" height="168" width="220" x="380" y="40"></rect>
<line class="ln" x1="490" x2="490" y1="40" y2="208"></line>
<line class="ln" x1="380" x2="600" y1="40" y2="40"></line>
<text class="t-s mid t-ink2" x="435" y="60">자산</text>
<text class="t-s mid t-ink2" x="545" y="60">순자산</text>
<rect class="no-fill ln2 dash" height="72" width="86" x="392" y="72"></rect>
<text class="mid" x="435" y="104">채권</text>
<text class="t-num mid" x="435" y="124">60</text>
<rect class="no-fill ln2 dash" height="48" width="86" x="392" y="148"></rect>
<text class="mid" x="435" y="170">주식</text>
<text class="t-num mid" x="435" y="188">40</text>
<text class="b mid" x="545" y="128">부</text>
<text class="t-num mid" x="545" y="148">100</text>
<!-- 청구권 화살표: 기업의 부채 = 가계의 자산 -->
<path class="ln2" d="M250,108 C300,96 340,96 390,108" marker-end="url(#ar-f01a)"></path>
<path class="ln2" d="M250,172 C300,160 340,160 390,172" marker-end="url(#ar-f01a)"></path>
<text class="t-s mid t-ink2" x="320" y="88">같은 종이의</text>
<text class="t-s mid t-ink2" x="320" y="152">앞면과 뒷면</text>
<!-- 합산 -->
<line class="grid" x1="40" x2="600" y1="236" y2="236"></line>
<text class="b" x="40" y="264">나라 전체로 합치면</text>
<text class="t-num" x="40" y="292">금융자산 100  −  금융부채 100  =  0</text>
<line class="ln-mute" x1="40" x2="300" y1="287" y2="287"></line>
<text class="t-num" x="40" y="324">순자산  =  공장 100</text>
<text class="t-s end t-ink2" x="600" y="292">종이는 서로 지워진다</text>
<text class="t-s end t-ink2" x="600" y="324">남는 것은 실물뿐</text>
</svg></g></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 400" width="860" height="400" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#ECEAF0; --panel:#F7F6F9; --ink:#1D1A26; --muted:#5B5668; --rule:#C9C5D2; --rule-2:#DCD9E2;
  --red:#B42318;   --red-fill:#F3D3CE;
  --flesh:#995532; --flesh-fill:#ECCFBC;
  --cob:#2B4A9B;   --cob-fill:#D3DBF1;
  --verd:#1F6F62;  --verd-fill:#CDE7E1;
  --void:#17141F;  --on-void:#F2EEF7;
  --display-ko:"Hahmlet","Noto Serif KR","Noto Serif CJK KR",serif;
  --body:"Noto Serif KR","Noto Serif CJK KR","Apple SD Gothic Neo",serif;
  --display-la:"GFS Didot","Didot","Bodoni 72","Noto Serif",serif;
  --sans:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Red Hat Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }svg.fig{display:block;width:100%;height:auto;font-family:var(--sans);overflow:visible}svg.fig text{font-family:var(--sans);font-size:14px;fill:var(--ink)}svg.fig .t-s{font-size:12px}svg.fig .t-xl{font-size:22px}svg.fig .t-b{font-weight:700}svg.fig .t-mid{text-anchor:middle}svg.fig .t-end{text-anchor:end}svg.fig .t-muted{fill:var(--muted)}svg.fig .f-ink{fill:var(--ink)}svg.fig .f-muted{fill:var(--muted)}svg.fig .f-panel{fill:var(--panel)}svg.fig .f-red{fill:var(--red)}svg.fig .f-cob{fill:var(--cob)}svg.fig .f-cobf{fill:var(--cob-fill)}svg.fig .f-none{fill:none}svg.fig .s-ink{stroke:var(--ink)}svg.fig .s-muted{stroke:var(--muted)}svg.fig .s-red{stroke:var(--red)}svg.fig .s-cob{stroke:var(--cob)}svg.fig .w1{stroke-width:1px}svg.fig .w15{stroke-width:1.5px}svg.fig .w2{stroke-width:2px}svg.fig .round{stroke-linecap:round;stroke-linejoin:round}:root{ --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2); }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{max-width:560px;margin-inline:auto}.doc{padding-inline:var(--pad)}.lecture{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-block:2.5rem 3rem;
  content-visibility:auto;border-top:1px solid var(--rule)}.fig-wrap{margin:.8rem 0 !important}.fig-scroll{overflow-x:auto;background:
  linear-gradient(to right,var(--panel) 30%,transparent) left center/2.2rem 100% no-repeat local,
  linear-gradient(to left,var(--panel) 30%,transparent) right center/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) left center/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) right center/.8rem 100% no-repeat scroll,
  var(--panel);padding:1rem .9rem .6rem}.fig-inner{width:100%}svg.pz-root{width:860px!important;height:400px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig-wrap"><g class="pz-w fig-scroll"><g class="pz-w fig-inner"><svg xmlns="http://www.w3.org/2000/svg" aria-label="하나의 대타자에 아는 얼굴과 모르는 얼굴이 있고, 고백은 첫째 얼굴이 이미 아는 비밀을 둘째 얼굴에 등록시키는 행위다" class="fig pz-inner" height="100%" role="img" viewBox="0 0 860 400" width="100%">
<defs>
<marker id="L03-1-ar-red" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-red" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 두 얼굴의 이름 -->
<text class="t-b f-cob" x="40" y="40">아는 것으로 가정된 주체</text>
<text class="t-s" x="40" y="58">다 보고 뒤에서 줄을 당기는 주인</text>
<text class="t-s t-muted" x="40" y="76">세무 당국 · 고백 전의 신</text>
<text class="t-end t-b f-cob" x="820" y="40">모르는 것으로 가정된 주체</text>
<text class="t-end t-s" x="820" y="58">그를 위해 외양을 지켜야 하는 자</text>
<text class="t-end t-s t-muted" x="820" y="76">부모가 숨기는 아이 · 포템킨 마을의 시찰자</text>
<text class="t-end t-s t-muted" x="820" y="94">〈밀회〉의 남편</text>
<!-- 야누스 두상: 하나의 대타자 -->
<path class="f-cobf s-cob w2 round" d="M392,300 L380,262 Q352,250 346,238 L344,226 Q350,220 344,214 L340,206 Q348,200 346,192 L330,184 Q328,178 336,170 L348,150 C350,98 392,72 430,72 C468,72 510,98 512,150 L524,170 Q532,178 530,184 L514,192 Q512,200 520,206 L516,214 Q510,220 516,226 L514,238 Q508,250 480,262 L468,300 Z"></path>
<text class="t-mid t-xl t-b f-cob" x="430" y="238">A</text>
<text class="t-mid t-s f-cob" x="430" y="258">하나의 대타자</text>
<!-- 왼쪽 얼굴: 뜬 눈 -->
<path class="f-panel s-ink w15" d="M352,152 Q364,142 376,152 Q364,162 352,152 Z"></path>
<circle class="f-ink" cx="362" cy="152" r="3.5"></circle>
<!-- 오른쪽 얼굴: 눈가리개 -->
<rect class="f-muted" height="17" rx="3" width="84" x="436" y="143"></rect>
<!-- 줄 당기는 손 -->
<path class="f-none s-ink w2 round" d="M246,112 L304,112 M275,100 L275,124"></path>
<path class="f-none s-muted w1" d="M248,112 L267,174 M275,124 L275,160 M302,112 L283,174"></path>
<circle class="f-none s-ink w15" cx="275" cy="165" r="5"></circle>
<path class="f-none s-ink w15 round" d="M275,170 L275,188 M267,176 L283,176 M275,188 L269,200 M275,188 L281,200"></path>
<!-- 비밀 쪽지: 왼쪽에 이미 있다 -->
<text class="t-mid t-s" x="180" y="230">첫째 얼굴은 이미 안다</text>
<path class="f-panel s-ink w15" d="M152,240 L198,240 L208,250 L208,280 L152,280 Z"></path>
<path class="f-none s-ink w1" d="M198,240 L198,250 L208,250"></path>
<text class="t-mid t-s t-b" x="180" y="265">비밀</text>
<!-- 고백 뒤: 오른쪽에 등록 -->
<text class="t-mid t-s" x="680" y="230">둘째 얼굴에 기입된다</text>
<path class="f-panel s-cob w2" d="M652,240 L698,240 L708,250 L708,280 L652,280 Z"></path>
<path class="f-none s-cob w1" d="M698,240 L698,250 L708,250"></path>
<text class="t-mid t-s t-b" x="680" y="265">비밀</text>
<!-- 고백 -->
<path class="f-none s-red w2" d="M180,286 C240,370 620,370 678,288" marker-end="url(#L03-1-ar-red)"></path>
<text class="t-mid t-b f-red" x="430" y="368">고백 — 공개적으로 말하는 순간</text>
<text class="t-mid t-s t-muted" x="430" y="388">내용은 그대로, 더는 모르는 척할 수 없다</text>
</svg></g></g></g></g></g></svg>
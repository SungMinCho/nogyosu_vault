ize="13" text-anchor="middle" x="180" y="102">2</text><rect class="s-ink f-wmut" height="26" stroke-width="1.2" width="44" x="283" y="45"></rect><text class="t-num" font-size="13" text-anchor="middle" x="305" y="63">2.5</text><text class="t-math" font-size="13" text-anchor="middle" x="50" y="104">x</text><text class="t-math" font-size="13" text-anchor="middle" x="180" y="122">y = Wx</text><text class="t-math" font-size="13" text-anchor="middle" x="305" y="88">L</text><line class="s-ink" fill="none" marker-end="url(#bp-ink)" stroke-width="1.8" x1="72" x2="158" y1="66" y2="66"></line><text class="t-math" font-size="14" text-anchor="middle" x="115" y="58">W</text><line class="s-ink" fill="none" marker-end="url(#bp-ink)" stroke-width="1.8" x1="202" x2="279" y1="58" y2="58"></line><text class="t-math" font-size="11.5" text-anchor="middle" x="244.5" y="50">½‖y − t‖²</text><text class="t-head c-orth" font-size="13" text-anchor="start" x="12" y="150">역전파: 자(尺)가 뒤로</text><rect class="s-orth f-worth" height="26" stroke-width="1.2" width="34" x="163" y="160"></rect><text class="t-num" font-size="13" text-anchor="middle" x="180" y="178">1</text><rect class="s-orth f-worth" height="26" stroke-width="1.2" width="34" x="163" y="186"></rect><text class="t-num" font-size="13" text-anchor="middle" x="180" y="204">0</text><rect class="s-orth f-worth" height="26" stroke-width="1.2" width="34" x="163" y="212"></rect><text class="t-num" font-size="13" text-anchor="middle" x="180" y="230">2</text><rect class="s-orth f-worth" height="26" stroke-width="1.2" width="34" x="33" y="168"></rect><text class="t-num" font-size="13" text-anchor="middle" x="50" y="186">7</text><rect class="s-orth f-worth" height="26" stroke-width="1.2" width="34" x="33" y="194"></rect><text class="t-num" font-size="13" text-anchor="middle" x="50" y="212">0</text><text class="t-math c-orth" font-size="12" text-anchor="middle" x="204" y="244">g = y − t</text><text class="t-math c-orth" font-size="12" text-anchor="middle" x="50" y="236">Wᵀg</text><line class="s-orth" fill="none" marker-end="url(#bp-orth)" stroke-width="2" x1="158" x2="72" y1="194" y2="194"></line><text class="t-math c-orth" font-size="14" text-anchor="middle" x="115" y="186">Wᵀ</text><line class="s-orth" fill="none" marker-end="url(#bp-orth)" stroke-dasharray="4 3" stroke-width="1.6" x1="305" x2="204" y1="72" y2="172"></line><text class="t-math c-orth" font-size="12" text-anchor="start" x="299" y="150">∂L/∂y</text></svg></svg>
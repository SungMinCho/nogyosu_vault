<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 270" width="800" height="270" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .f-ink{ fill:var(--ink) }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-spike{ fill:var(--spike-soft); stroke:var(--spike) }.dg .bx-ink{ fill:var(--paper); stroke:var(--ink-2) }.dg .ssub{ font-size:8px }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:800px!important;height:270px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="DeepSeek의 멀티헤드 잠재 어텐션은 헤드를 위치 없는 512차원 잠재 부분과 위치를 싣는 64차원 부분으로 나눠, 앞쪽만 흡수하고 양자화한다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 800 270" width="100%"><defs><marker id="j5-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="j5-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="j5-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-b" text-anchor="start" x="30" y="28">DeepSeek의 분리 RoPE: 헤드를 두 집으로</text><rect class="bx-rot" height="60" rx="6" width="380" x="30" y="50"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="220" y="74">위치 없는 집 — 잠재 c (512차원)</text><text class="t-s t-rot" text-anchor="middle" x="220" y="92">W<tspan class="ssub" dy="3">UK</tspan><tspan dy="-3">​</tspan>를 W<tspan class="ssub" dy="3">Q</tspan><tspan dy="-3">​</tspan>에 흡수 ✓ · FP8 캐시</text><rect class="bx-spike" height="60" rx="6" width="160" x="420" y="50"></rect><text class="t-s t-b t-spike" text-anchor="middle" x="500" y="74">위치 싣는 집 (64차원)</text><text class="t-s t-spike" text-anchor="middle" x="500" y="92">흡수 포기 · BF16 유지</text><text class="t-s t-mono" text-anchor="start" x="30" y="140">점수 = q · (c · W<tspan class="ssub" dy="3">UK</tspan><tspan dy="-3">​</tspan>)ᵀ = (q · W<tspan class="ssub" dy="3">UK</tspan><tspan dy="-3">​</tspan>ᵀ) · cᵀ — 키를 복원하지 않고 잠재 벡터와 바로 내적</text><text class="t-s t-mono t-spike" text-anchor="start" x="30" y="166">그런데 RoPE가 끼면: q · Θ<tspan class="ssub" dy="3">m</tspan><tspan dy="-3">​</tspan> · (c · W<tspan class="ssub" dy="3">UK</tspan><tspan dy="-3">​</tspan> · Θ<tspan class="ssub" dy="3">n</tspan><tspan dy="-3">​</tspan>)ᵀ — W<tspan class="ssub" dy="3">UK</tspan><tspan dy="-3">​</tspan>와 Θ<tspan class="ssub" dy="3">n</tspan><tspan dy="-3">​</tspan>의 자리를 바꿀 수 없다.</text><rect class="bx-ink" height="56" rx="6" width="550" x="30" y="190"></rect><text class="t-s t-b" text-anchor="start" x="44" y="212">과제와 같은 대수: "행렬을 RoPE 너머로 옮겨 다른 가중치에 합치기".</text><text class="t-s" text-anchor="start" x="44" y="232">DeepSeek은 벽을 넘지 않고, 벽이 필요 없는 부분과 필요한 부분을 나눴다.</text><text class="t-s t-b" text-anchor="start" x="600" y="70">KV 캐시 93.3% 감소</text><text class="t-s t-b" text-anchor="start" x="600" y="90">처리량 최대 5.76배</text></svg></g></g></g></g></svg>
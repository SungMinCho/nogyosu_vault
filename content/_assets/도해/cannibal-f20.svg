rtant}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w dia"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="다리비의 혼인 교환은 두 물건의 맞바꿈이 아니라 한 흐름에 대한 두 시각의 맞물림이다. 여자를 주는 부계 씨족에게 자기 남성적 실체가 흘러 나가는 흐름인 여자가 받는 씨족에게는 여성적 실체이고, 혼인 재물과 아이를 두고 치르는 지불이 반대 길로 흐를 때 관점도 뒤집힌다. 관점주의가 교환을 규정하지, 그 반대가 아니다." class="d pz-inner" height="100%" role="img" viewBox="0 0 680 448" width="100%">

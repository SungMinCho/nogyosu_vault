<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 262" width="480" height="262" class="figscroll fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EDEFEA; --plate:#E3E6E0; --ink:#26221E; --ink-2:#5B5750; --rule:#C6CBC3; --mark:#B9BEB5;
  --cu:#9A5B2E; --vg:#2F7D6D; --pb:#2B4C7E; --vm:#C2412B;
  --cu-soft:rgba(154,91,46,.10); --vg-soft:rgba(47,125,109,.10); --pb-soft:rgba(43,76,126,.10); --vm-soft:rgba(194,65,43,.08);
  --f-display:"Hahmlet","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-latin:"EB Garamond","Noto Serif KR",Georgia,serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem;
}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}}:root[data-theme="dark"]{
  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}.vg{color:var(--vg)}.vm{color:var(--vm)}svg.defs{position:absolute;width:0;height:0;overflow:hidden}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-inline:var(--pad);padding-block:0 4rem}.lecture{display:contents}.webwrap svg{display:block;width:100%;height:auto}.sw-dot.vg{background:var(--vg)}.sw-dot.vm{background:var(--vm)}figure.fig{border:1px solid var(--mark);background:var(--plate);padding:.75rem .75rem .6rem;margin-block:.6rem}.figscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  background:linear-gradient(to right,var(--plate) 30%,transparent),linear-gradient(to left,var(--plate) 30%,transparent) 100% 0,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) 100% 0;
  background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;background-attachment:local,local,scroll,scroll}figure.fig svg{display:block;width:100%;height:auto;min-width:27rem}@media (max-width:34rem){.doc>figure.fig,.lecture>figure.fig{width:calc(100% + var(--pad)*2);max-width:none;margin-inline:calc(var(--pad)*-1);border-inline:0;padding-inline:.6rem}}.terms li.vg{color:var(--vg);background:var(--vg-soft)}.terms li.vm{color:var(--vm);background:var(--vm-soft)}svg .ln,svg .ln-cu,svg .ln-vg,svg .ln-pb,svg .ln-vm{stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}svg .ln:not([fill]),svg .ln-cu:not([fill]),svg .ln-vg:not([fill]),svg .ln-pb:not([fill]),svg .ln-vm:not([fill]){fill:none}svg .ln{stroke:var(--ink)}svg .ln-vg{stroke:var(--vg)}svg .ln-vm{stroke:var(--vm)}svg g.ln-vg>rect:not([fill]),svg g.ln-cu>rect:not([fill]),svg g.ln-pb>rect:not([fill]),svg g.ln-vm>rect:not([fill]){fill:none}svg .thick,svg g.thick>*{stroke-width:2.6}svg text{fill:var(--ink);font-family:var(--f-body)}svg .tk{font-family:var(--f-display);font-size:17px;font-weight:600}svg .ts{font-size:13px}svg .tm{font-family:var(--f-mono);font-size:11px}svg .c{text-anchor:middle}svg .r{text-anchor:end}svg text.cu{fill:var(--cu)}svg text.vg{fill:var(--vg)}svg text.pb{fill:var(--pb)}svg text.vm{fill:var(--vm)}svg .bgtext{paint-order:stroke;stroke:var(--plate);stroke-width:5px;stroke-linejoin:round}.m .sq>.rt path{fill:none;stroke:currentColor;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}.m .sq>.rt path.rh{stroke-width:1.6px}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="푼텔의 결합 규칙 — 중첩 아홉 가지에서 P(T)·P(AE)가 빠진다 — 공자가 파르메니데스를 감싸는 y(x)가 거기 걸린다" height="100%" role="img" viewBox="0 0 480 262" width="100%" xmlns="http://www.w3.org/2000/svg">
<text class="tm" x="16" y="24">읽는 법: 바깥(안쪽(·)) · 열이 안쪽</text>
<text class="tm r" x="88" y="48">바깥 ↓</text>
<text class="tm c" x="132" y="48">T · 이론</text><text class="tm r" x="88" y="82">T · 이론</text><text class="tm c" x="204" y="48">P · 실천</text><text class="tm r" x="88" y="126">P · 실천</text><text class="tm c" x="276" y="48">AE · 미적</text><text class="tm r" x="88" y="170">AE · 미적</text><text class="tm c bgtext" x="132" y="83">T(T(·))</text><text class="tm c bgtext" x="204" y="77">T(P(·))</text><text class="tm c bgtext" x="276" y="83">T(AE(·))</text><rect class="ln-vm" fill="url(#h-vm)" height="44" width="72" x="96" y="100"></rect><text class="tm c bgtext" x="132" y="121">P(T(·))</text><text class="tm c bgtext" x="204" y="127">P(P(·))</text><rect class="ln-vm" fill="url(#h-vm)" height="44" width="72" x="240" y="100"></rect><text class="tm c bgtext" x="276" y="121">P(AE(·))</text><text class="tm c bgtext" x="132" y="171">AE(T(·))</text><text class="tm c bgtext" x="204" y="171">AE(P(·))</text><text class="tm c bgtext" x="276" y="171">AE(AE(·))</text><g class="ln"><rect height="132" width="216" x="96" y="56"></rect><line x1="168" x2="168" y1="56" y2="188"></line><line x1="240" x2="240" y1="56" y2="188"></line><line x1="96" x2="312" y1="100" y2="100"></line><line x1="96" x2="312" y1="144" y2="144"></line></g>
<rect class="ln-vg thick" height="40" width="68" x="170" y="58"></rect>
<text class="tm c vg" x="204" y="93">x(y)</text>
<rect class="ln-vm thick" height="40" width="68" x="98" y="102"></rect>
<text class="tm c vm bgtext" x="132" y="137">y(x)</text>
<text class="tm c vm bgtext" x="276" y="137">무의미</text>
<text class="tk" x="330" y="74">9 − 2 = 7</text>
<text class="ts" x="330" y="100">파르메니데스 F₁ : T</text>
<text class="ts" x="330" y="118">공자 F₂ : P</text>
<text class="tm vg" x="330" y="142">x(y) = T(P(·)) 유의미</text>
<text class="tm vm" x="330" y="160">y(x) = P(T(·)) 무의미</text>
<text class="tm vm" x="330" y="182">‘적어도 둘 다’는</text>
<text class="tm vm" x="330" y="197">각주 323과 부딪친다</text>
<text class="ts c" x="240" y="228">‘…라는 것이 사실이어야 한다’는 말이 안 된다</text>
<text class="tm c" x="240" y="248">사실은 어떤 요구에도 기대지 않는다 · 흄의 이다/해야를 연산자로</text>
</svg></svg>
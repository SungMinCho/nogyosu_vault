<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 740 436" width="740" height="436" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#DDD8CC; --bg-2:#D3CDBF; --panel:#E9E5DB; --panel-2:#F2EFE8;
  --ink:#1D1913; --ink-2:#3B352B; --mute:#625A4D; --rule:#B4AB9A; --rule-2:#C9C1B1;
  --och:#8A6110; --azu:#1F4E8C; --ver:#AE3519; --lak:#9C2B66;
  --och-w:rgba(138,97,16,.15); --azu-w:rgba(31,78,140,.13); --ver-w:rgba(174,53,25,.13); --lak-w:rgba(156,43,102,.13); --ink-w:rgba(29,25,19,.07);
  --weave:rgba(60,48,30,.045);
  --room:#2E2821; --linen:#CBC2AE; --door:#E3C37C; --glass:#A9C0E0; --ray:rgba(240,214,150,.16);
  --f-disp:"Nanum Myeongjo","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-lat:"Cormorant Garamond","Noto Serif KR",Georgia,serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-ui:"Gothic A1","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"Inconsolata","Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15120E; --bg-2:#1B1712; --panel:#1F1B15; --panel-2:#26211A;
  --ink:#E7E0D2; --ink-2:#CFC6B5; --mute:#A39A89; --rule:#4C4538; --rule-2:#3A342A;
  --och:#D7A64C; --azu:#86AEE6; --ver:#EF7A57; --lak:#E585B6;
  --och-w:rgba(215,166,76,.16); --azu-w:rgba(134,174,230,.15); --ver-w:rgba(239,122,87,.15); --lak-w:rgba(229,133,182,.15); --ink-w:rgba(231,224,210,.07);
  --weave:rgba(255,240,210,.025); --room:#0A0806; --linen:#81776A; --door:#C9A55A; --glass:#7E9DCB; --ray:rgba(240,214,150,.09); color-scheme:dark }}:root[data-theme="dark"]{
  --bg:#15120E; --bg-2:#1B1712; --panel:#1F1B15; --panel-2:#26211A;
  --ink:#E7E0D2; --ink-2:#CFC6B5; --mute:#A39A89; --rule:#4C4538; --rule-2:#3A342A;
  --och:#D7A64C; --azu:#86AEE6; --ver:#EF7A57; --lak:#E585B6;
  --och-w:rgba(215,166,76,.16); --azu-w:rgba(134,174,230,.15); --ver-w:rgba(239,122,87,.15); --lak-w:rgba(229,133,182,.15); --ink-w:rgba(231,224,210,.07);
  --weave:rgba(255,240,210,.025); --room:#0A0806; --linen:#81776A; --door:#C9A55A; --glass:#7E9DCB; --ray:rgba(240,214,150,.09); color-scheme:dark }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{ display:block; width:100%; height:auto }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.6rem 3rem }.lecture{ display:contents }figure.fig{ margin:.6rem 0 .4rem; display:grid; gap:.55rem }.fig .frame{ overflow-x:auto; overscroll-behavior-x:contain; background:var(--panel-2); border:1px solid var(--rule-2); padding:.9rem .8rem;
  background-image:linear-gradient(to right,var(--panel-2) 30%,transparent),linear-gradient(to left,var(--panel-2) 30%,transparent),linear-gradient(to right,var(--ink-w),transparent),linear-gradient(to left,var(--ink-w),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat; background-size:2.2rem 100%,2.2rem 100%,1rem 100%,1rem 100%; background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; height:auto; color:var(--ink) }.t{ font-family:var(--f-ui); font-size:13px; fill:currentColor }.t-s{ font-family:var(--f-ui); font-size:11px; fill:currentColor }.b{ font-weight:700 }.mid{ text-anchor:middle }.end{ text-anchor:end }.mute{ fill:var(--mute) }.halo{ paint-order:stroke; stroke:var(--panel-2); stroke-width:4px; stroke-linejoin:round }.s{ fill:none; stroke:currentColor; stroke-width:1.4 }.s-thin{ fill:none; stroke:currentColor; stroke-width:.8 }.s-bold{ fill:none; stroke:currentColor; stroke-width:2.4 }.dash{ stroke-dasharray:5 4 }.k-mute{ stroke:var(--mute) }.k-azu{ stroke:var(--azu) }.k-ver{ stroke:var(--ver) }.k-lak{ stroke:var(--lak) }.f-ver{ fill:var(--ver) }.f-ink{ fill:currentColor }.f-mute{ fill:var(--mute) }.f-bg{ fill:var(--panel-2) }.w-ver{ fill:var(--ver-w) }.c-azu{ fill:var(--azu) }.c-ver{ fill:var(--ver) }.c-lak{ fill:var(--lak) }svg.pz-root{width:740px!important;height:436px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><g class="pz-w fw"><svg xmlns="http://www.w3.org/2000/svg" aria-label="언어가 앎의 맨 윗자리에서 여러 대상 가운데 하나로 강등되자, 형식화와 해석과 문학이라는 세 보상이 흩어져 나온다." class="pz-inner" height="100%" role="img" viewBox="0 0 740 436" width="100%">
<defs>
<marker id="d-three-compensations-ar" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="d-three-compensations-arv" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ver" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="d-three-compensations-arm" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<text class="t-s b c-azu" x="24" y="30">고전주의 — 앎의 맨 윗자리</text>
<line class="s-bold k-azu" x1="20" x2="238" y1="96" y2="96"></line>
<text class="t-s" x="24" y="70">아는 것 = 잘 말하기</text>
<text class="t-s mute" x="24" y="88">표상에 첫 질서</text>
<rect class="s k-lak dash" height="44" width="76" x="152" y="48"></rect>
<text class="t-s mid c-lak" x="190" y="75">빈자리</text>
<line class="s-bold" marker-end="url(#d-three-compensations-ar)" x1="190" x2="190" y1="98" y2="184"></line>
<text class="t b halo" x="198" y="146">강등</text>
<rect class="s-thin" height="34" width="56" x="32" y="188"></rect>
<text class="t mid" x="60" y="210">부</text>
<rect class="s-thin" height="34" width="56" x="96" y="188"></rect>
<text class="t mid" x="124" y="210">생물</text>
<rect class="w-ver" height="34" width="56" x="162" y="188"></rect>
<rect class="s k-ver" height="34" width="56" x="162" y="188"></rect>
<text class="t mid b c-ver" x="190" y="210">언어</text>
<line class="s-thin k-mute" x1="22" x2="228" y1="230" y2="230"></line>
<text class="t-s mid mute" x="125" y="246">같은 높이 — 여러 대상 가운데 하나</text>
<text class="t-s mid" x="125" y="272">문헌학: 언어의 참모습 = 소리</text>
<circle class="f-ver" cx="220" cy="205" r="3"></circle>
<line class="s k-ver" marker-end="url(#d-three-compensations-arv)" x1="220" x2="296" y1="205" y2="90"></line>
<line class="s k-ver" marker-end="url(#d-three-compensations-arv)" x1="220" x2="296" y1="205" y2="216"></line>
<line class="s k-ver" marker-end="url(#d-three-compensations-arv)" x1="220" x2="296" y1="205" y2="342"></line>
<text class="t-s mid b c-ver" x="264" y="237">세 보상</text>
<rect class="f-bg" height="100" width="262" x="300" y="42"></rect>
<rect class="s-thin" height="100" width="262" x="300" y="42"></rect>
<text class="t b c-ver" x="312" y="64">① 형식화</text>
<text class="t-s end mute" x="550" y="64">위에서 법칙을 씌운다</text>
<text class="t-s" x="312" y="86">실증주의의 꿈: 군더더기 없는 투명한 유리</text>
<text class="t-s" x="312" y="103">과학 = 자연의 사본, 표(타블로)는 그림</text>
<text class="t-s" x="312" y="120">불의 기호논리학: 모든 언어 바깥의 사유 형식</text>
<rect class="f-bg" height="100" width="262" x="300" y="166"></rect>
<rect class="s-thin" height="100" width="262" x="300" y="166"></rect>
<text class="t b c-ver" x="312" y="188">② 해석</text>
<text class="t-s end mute" x="550" y="188">아래에서 말하게 한다</text>
<text class="t-s" x="312" y="210">마르크스 — 『자본』, '가치'라는 한 낱말</text>
<text class="t-s" x="312" y="227">니체 — 몇 안 되는 그리스 낱말</text>
<text class="t-s" x="312" y="244">프로이트 — 꿈·몸 밑의 말해지지 않은 문장</text>
<rect class="f-bg" height="100" width="262" x="300" y="292"></rect>
<rect class="s-thin" height="100" width="262" x="300" y="292"></rect>
<text class="t b c-ver" x="312" y="314">③ 문학</text>
<text class="t-s end mute" x="550" y="314">문헌학의 쌍둥이이자 적수</text>
<text class="t-s" x="312" y="336">낭만주의의 반기 → 말라르메</text>
<text class="t-s" x="312" y="353">자동사성 · 맛·참의 잣대 뒤집기 · 장르 깨짐</text>
<text class="t-s" x="312" y="370">소리도 듣는 이도 없는 흰 종이 위 글자</text>
<line class="s" marker-end="url(#d-three-compensations-ar)" x1="562" x2="598" y1="92" y2="92"></line>
<text class="t b" x="606" y="97">러셀</text>
<text class="t-s mute" x="606" y="113">형식주의</text>
<line class="s" marker-end="url(#d-three-compensations-ar)" x1="562" x2="598" y1="216" y2="216"></line>
<text class="t b" x="606" y="221">프로이트</text>
<text class="t-s mute" x="606" y="237">무의식</text>
<line class="s-thin dash" marker-end="url(#d-three-compensations-ar)" marker-start="url(#d-three-compensations-ar)" x1="598" x2="598" y1="124" y2="198"></line>
<text class="t-s b" x="608" y="148">서로 전제한다</text>
<text class="t-s" x="608" y="164">같은 땅에서</text>
<text class="t-s" x="608" y="180">구조주의·현상학</text>
<line class="s-thin k-ver" x1="562" x2="612" y1="318" y2="342"></line>
<line class="s-thin k-ver" x1="562" x2="612" y1="330" y2="342"></line>
<line class="s-thin k-ver" x1="562" x2="612" y1="342" y2="342"></line>
<line class="s-thin k-ver" x1="562" x2="612" y1="354" y2="342"></line>
<line class="s-thin k-ver" x1="562" x2="612" y1="366" y2="342"></line>
<circle class="f-ver" cx="612" cy="342" r="5"></circle>
<text class="t b" x="624" y="339">'쓴다'</text>
<text class="t-s" x="624" y="356">한 점의 맨 행위</text>
<path class="s dash k-mute" d="M300,372 C232,372 160,340 136,282" marker-end="url(#d-three-compensations-arm)"></path>
<text class="t-s" x="196" y="394">쌍둥이가 대든다</text>
</svg></g></g></g></g></g></svg>
"pz-w lecture"><g class="pz-w dia"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="레비스트로스의 구조주의는 시기의 앞뒤(통시)로도, 한 몸 안의 두 목소리(공시)로도 갈린다. 매개와 닫힌 대수의 첫째 목소리는 『친족의 기본 구조』에서 굵고, 분리와 열린 다양체의 둘째 목소리는 1949·1955·1956년에 가는 점선으로 있다가 『신화학』 1권과 2권 사이에서 굵기를 맞바꾼다. 통시의 앞뒤는 처음부터 함께 있던 두 목소리의 무게가 옮겨 간 것이다." class="d pz-inner" height="100%" role="img" viewBox="0 0 680 468" width="100%">

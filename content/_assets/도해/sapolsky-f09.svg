<path class="ln-life w-thick" d="M450,392 L585,392"></path>
<circle class="f-life" cx="590" cy="392" r="4.5"></circle>
<text class="t-s" text-anchor="end" x="444" y="396">페타녜크 2011 · 20대 내내</text>
<text class="t-s" x="598" y="396">약 30 안정</text>

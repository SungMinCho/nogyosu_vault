<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 620 266" width="620" height="266" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#F1F2EC; --paper:#FAFAF6; --soft:#E3E6DE; --tie:#B9BEB5; --stack:#C9CDC4; --grid:#DCE0D6; --rule:#CDD3CA;
  --ink:#1B2420; --ink-2:#44504A; --muted:#6E7871; --on:#FFFFFF;
  --pot:#23825A; --risk:#C0392B; --eq:#A0700F; --un:#2F5DA8; --warn:#8A4FB8;
  --eq-bg:#F3E7CC; --risk-bg:#F6DEDA;
  --f-body:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-disp:"Song Myung","Nanum Myeongjo","Noto Serif KR",serif;
  --f-num:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --f-dg:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --f-math:"Noto Sans Math","STIX Two Math","Cambria Math",math;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}}:root[data-theme="dark"]{
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:2.2rem 4rem}.lecture{display:contents}.fig{margin:.6rem 0 !important;display:grid;gap:.55rem}.fig .frame{overflow-x:auto;background:
  linear-gradient(90deg,var(--paper) 30%,transparent),linear-gradient(270deg,var(--paper) 30%,transparent),
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent),
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent) 100% 0;
  background-color:var(--paper);background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll;
  border:1px solid var(--rule);border-radius:3px;padding:.7rem}.dg{display:block;width:100%;height:auto;font-family:var(--f-dg)}.dg text{fill:var(--ink);font-size:12px}.dg text.mu{fill:var(--muted)}.dg text.b{font-weight:700}.dg .on{fill:var(--on)}.dg text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}.dg text.card{font-family:var(--f-num)}.dg .f-eq{fill:var(--eq)}.dg .f-un{fill:var(--un)}.dg .f-soft{fill:var(--soft)}.dg .f-riskbg{fill:var(--risk-bg)}.dg .s-risk{stroke:var(--risk);stroke-width:1.6}.dg circle:hover,.dg rect[class]:hover{filter:brightness(1.08)}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="쿤 포커의 균형 전략표: P1은 J로 β만큼 블러프하고 K로 3β만큼 밸류 베팅하며 Q로는 체크한 뒤 β+1/3로 콜한다. P2는 Q로 1/3 콜하고 체크를 받으면 J로 1/3 블러프한다. 값은 P1 기준 −1/18." class="dg" height="100%" role="img" style="" viewBox="0 0 620 266" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern height="6" id="hh-kuhn" patternTransform="rotate(45)" patternUnits="userSpaceOnUse" width="6"><rect class="f-riskbg" height="6" width="6"></rect><line class="s-risk" style="stroke-width:2" x1="0" x2="0" y1="0" y2="6"></line></pattern></defs><text class="card" style="font-size:18px;font-weight:700" text-anchor="middle" x="290.0" y="24.0">J</text><text class="card" style="font-size:18px;font-weight:700" text-anchor="middle" x="410.0" y="24.0">Q</text><text class="card" style="font-size:18px;font-weight:700" text-anchor="middle" x="530.0" y="24.0">K</text><text style="font-size:12.5px" text-anchor="start" x="12.0" y="64.0">P1 · 처음에 베팅</text><rect class="f-hatch" fill="url(#hh-kuhn)" height="38.0" rx="3" width="116.0" x="232.0" y="40.0"></rect><text class="num b" style="font-size:14px" text-anchor="middle" x="290.0" y="58.0">β</text><text class="sm" style="font-size:10.5px" text-anchor="middle" x="290.0" y="72.0">블러프</text><rect class="f-soft" height="38.0" rx="3" width="116.0" x="352.0" y="40.0"></rect><text class="num b" style="font-size:14px" text-anchor="middle" x="410.0" y="58.0">0</text><text class="sm" style="font-size:10.5px" text-anchor="middle" x="410.0" y="72.0">항상 체크</text><rect class="f-eq" height="38.0" rx="3" width="116.0" x="472.0" y="40.0"></rect><text class="on num b" style="font-size:14px" text-anchor="middle" x="530.0" y="58.0">3β</text><text class="on sm" style="font-size:10.5px" text-anchor="middle" x="530.0" y="72.0">밸류</text><text style="font-size:12.5px" text-anchor="start" x="12.0" y="110.0">P1 · 체크 뒤 베팅을 맞고 콜</text><rect class="f-soft" height="38.0" rx="3" width="116.0" x="232.0" y="86.0"></rect><text class="num b" style="font-size:14px" text-anchor="middle" x="290.0" y="104.0">0</text><text class="sm" style="font-size:10.5px" text-anchor="middle" x="290.0" y="118.0">항상 폴드</text><rect class="f-un" height="38.0" rx="3" width="116.0" x="352.0" y="86.0"></rect><text class="on num b" style="font-size:14px" text-anchor="middle" x="410.0" y="104.0">β + 1/3</text><text class="on sm" style="font-size:10.5px" text-anchor="middle" x="410.0" y="118.0">블러프 캐치</text><rect class="f-eq" height="38.0" rx="3" width="116.0" x="472.0" y="86.0"></rect><text class="on num b" style="font-size:14px" text-anchor="middle" x="530.0" y="110.0">1</text><text style="font-size:12.5px" text-anchor="start" x="12.0" y="156.0">P2 · 베팅을 맞고 콜</text><rect class="f-soft" height="38.0" rx="3" width="116.0" x="232.0" y="132.0"></rect><text class="num b" style="font-size:14px" text-anchor="middle" x="290.0" y="150.0">0</text><text class="sm" style="font-size:10.5px" text-anchor="middle" x="290.0" y="164.0">항상 폴드</text><rect class="f-un" height="38.0" rx="3" width="116.0" x="352.0" y="132.0"></rect><text class="on num b" style="font-size:14px" text-anchor="middle" x="410.0" y="150.0">1/3</text><text class="on sm" style="font-size:10.5px" text-anchor="middle" x="410.0" y="164.0">블러프 캐치</text><rect class="f-eq" height="38.0" rx="3" width="116.0" x="472.0" y="132.0"></rect><text class="on num b" style="font-size:14px" text-anchor="middle" x="530.0" y="156.0">1</text><text style="font-size:12.5px" text-anchor="start" x="12.0" y="202.0">P2 · 체크를 받고 베팅</text><rect class="f-hatch" fill="url(#hh-kuhn)" height="38.0" rx="3" width="116.0" x="232.0" y="178.0"></rect><text class="num b" style="font-size:14px" text-anchor="middle" x="290.0" y="196.0">1/3</text><text class="sm" style="font-size:10.5px" text-anchor="middle" x="290.0" y="210.0">블러프</text><rect class="f-soft" height="38.0" rx="3" width="116.0" x="352.0" y="178.0"></rect><text class="num b" style="font-size:14px" text-anchor="middle" x="410.0" y="196.0">0</text><text class="sm" style="font-size:10.5px" text-anchor="middle" x="410.0" y="210.0">체크</text><rect class="f-eq" height="38.0" rx="3" width="116.0" x="472.0" y="178.0"></rect><text class="on num b" style="font-size:14px" text-anchor="middle" x="530.0" y="196.0">1</text><text class="on sm" style="font-size:10.5px" text-anchor="middle" x="530.0" y="210.0">밸류</text><text class="b" style="font-size:13px" text-anchor="start" x="12.0" y="250.0">게임의 값: P1이 판당 −1/18  (0 ≤ β ≤ 1/3 어디서나 같다)</text></svg></svg>
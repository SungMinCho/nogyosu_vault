<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 376" width="880" height="376" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tm, .chart .tm{ font-family:var(--f-mono); font-size:11px; }.fig-svg .halo, .chart .halo{ paint-order:stroke; stroke:var(--deep); stroke-width:4px; stroke-linejoin:round; }.c-ink2{ fill:var(--ink2) !important }.c-pass{ fill:var(--pass) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-rule{ stroke:var(--rule) }.s-fire{ stroke:var(--fire) }.s-pass{ stroke:var(--pass) }.f-none{ fill:none }.f-fire-t{ fill:var(--fire); fill-opacity:.16 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }.mk-pass{ fill:var(--pass) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="가장자리가 한 번 떨리는 데 걸리는 시간을 로그 눈금 위에 놓은 그림. 벽난로 불꽃은 10분의 1초 언저리, 태양 가장자리는 분에서 시간, 몸은 한평생, 브르타뉴 해안선은 수천에서 수백만 년, 돌은 수백만 년 이상이다. 수백만 년을 5분으로 돌리는 필름은 해안선을 태양 가장자리의 시간 척도로 옮긴다. 위치는 대략이다." class="fig-svg" height="100%" role="img" viewBox="0 0 880 376" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F24-ar-pass" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-pass" d="M0,0 L10,5 L0,10 z"></path></marker></defs><path class="s-fire w15 f-none" d="M22,101 c3,-6 5,-2 7,-9 c2,5 4,2 6,6 c2,-7 5,-4 7,-10 c2,6 4,3 6,7 c1,-4 3,-2 4,-5"></path><text class="t" text-anchor="start" x="62" y="101">벽난로 불꽃</text><rect class="s-fire f-fire-t w1" height="14" rx="7" width="36" x="225.2" y="89"></rect><text class="ts" text-anchor="start" x="269.2" y="100">≈ 0.1초</text><path class="s-fire w15 f-none" d="M22,145 c3,-6 5,-2 7,-9 c2,5 4,2 6,6 c2,-7 5,-4 7,-10 c2,6 4,3 6,7 c1,-4 3,-2 4,-5"></path><text class="t" text-anchor="start" x="62" y="145">태양 가장자리</text><rect class="s-fire f-fire-t w1" height="14" rx="7" width="79.2" x="336.8" y="133"></rect><text class="ts" text-anchor="start" x="424" y="144">분 ~ 시간</text><path class="s-fire w15 f-none" d="M22,189 c3,-6 5,-2 7,-9 c2,5 4,2 6,6 c2,-7 5,-4 7,-10 c2,6 4,3 6,7 c1,-4 3,-2 4,-5"></path><text class="t" text-anchor="start" x="62" y="189">몸</text><rect class="s-fire f-fire-t w1" height="14" rx="7" width="68.4" x="542" y="177"></rect><text class="ts" text-anchor="start" x="618.4" y="188">한평생</text><path class="s-fire w15 f-none" d="M22,233 c3,-6 5,-2 7,-9 c2,5 4,2 6,6 c2,-7 5,-4 7,-10 c2,6 4,3 6,7 c1,-4 3,-2 4,-5"></path><text class="t" text-anchor="start" x="62" y="233">브르타뉴 해안선</text><rect class="s-fire f-fire-t w1" height="14" rx="7" width="126" x="668" y="221"></rect><text class="ts" text-anchor="end" x="660" y="232">수천 ~ 수백만 년</text><path class="s-fire w15 f-none" d="M22,277 c3,-6 5,-2 7,-9 c2,5 4,2 6,6 c2,-7 5,-4 7,-10 c2,6 4,3 6,7 c1,-4 3,-2 4,-5"></path><text class="t" text-anchor="start" x="62" y="277">돌</text><rect class="s-fire f-fire-t w1" height="14" rx="7" width="90" x="758" y="265"></rect><text class="ts" text-anchor="end" x="750" y="276">지질의 시간</text><text class="ts c-caution" text-anchor="start" x="336.8" y="164">세르의 사다리에선 맨 위('훨씬 더 들뜬') — 시계로는 분 단위</text><line class="s-ink w15 f-none" x1="200" x2="848" y1="304" y2="304"></line><line class="s-ink w1 f-none" x1="200" x2="200" y1="304" y2="308"></line><text class="tm c-ink2" text-anchor="middle" x="200" y="340">10⁻²</text><line class="s-ink w1 f-none" x1="236" x2="236" y1="304" y2="308"></line><line class="s-ink w1 f-none" x1="272" x2="272" y1="304" y2="308"></line><text class="tm c-ink2" text-anchor="middle" x="272" y="340">10⁰</text><line class="s-ink w1 f-none" x1="308" x2="308" y1="304" y2="308"></line><line class="s-ink w1 f-none" x1="344" x2="344" y1="304" y2="308"></line><text class="tm c-ink2" text-anchor="middle" x="344" y="340">10²</text><line class="s-ink w1 f-none" x1="380" x2="380" y1="304" y2="308"></line><line class="s-ink w1 f-none" x1="416" x2="416" y1="304" y2="308"></line><text class="tm c-ink2" text-anchor="middle" x="416" y="340">10⁴</text><line class="s-ink w1 f-none" x1="452" x2="452" y1="304" y2="308"></line><line class="s-ink w1 f-none" x1="488" x2="488" y1="304" y2="308"></line><text class="tm c-ink2" text-anchor="middle" x="488" y="340">10⁶</text><line class="s-ink w1 f-none" x1="524" x2="524" y1="304" y2="308"></line><line class="s-ink w1 f-none" x1="560" x2="560" y1="304" y2="308"></line><text class="tm c-ink2" text-anchor="middle" x="560" y="340">10⁸</text><line class="s-ink w1 f-none" x1="596" x2="596" y1="304" y2="308"></line><line class="s-ink w1 f-none" x1="632" x2="632" y1="304" y2="308"></line><text class="tm c-ink2" text-anchor="middle" x="632" y="340">10¹⁰</text><line class="s-ink w1 f-none" x1="668" x2="668" y1="304" y2="308"></line><line class="s-ink w1 f-none" x1="704" x2="704" y1="304" y2="308"></line><text class="tm c-ink2" text-anchor="middle" x="704" y="340">10¹²</text><line class="s-ink w1 f-none" x1="740" x2="740" y1="304" y2="308"></line><line class="s-ink w1 f-none" x1="776" x2="776" y1="304" y2="308"></line><text class="tm c-ink2" text-anchor="middle" x="776" y="340">10¹⁴</text><line class="s-ink w1 f-none" x1="812" x2="812" y1="304" y2="308"></line><line class="s-ink w1 f-none" x1="848" x2="848" y1="304" y2="308"></line><text class="tm c-ink2" text-anchor="middle" x="848" y="340">10¹⁶</text><line class="s-ink w15 f-none" x1="236" x2="236" y1="299" y2="313"></line><text class="ts" text-anchor="middle" x="236" y="325">0.1초</text><line class="s-ink w15 f-none" x1="272" x2="272" y1="299" y2="313"></line><text class="ts" text-anchor="middle" x="272" y="325">1초</text><line class="s-ink w15 f-none" x1="336.013" x2="336.013" y1="299" y2="313"></line><text class="ts" text-anchor="middle" x="336.013" y="325">1분</text><line class="s-ink w15 f-none" x1="400.027" x2="400.027" y1="299" y2="313"></line><text class="ts" text-anchor="middle" x="400.027" y="325">1시간</text><line class="s-ink w15 f-none" x1="449.714" x2="449.714" y1="299" y2="313"></line><text class="ts" text-anchor="middle" x="449.714" y="325">1일</text><line class="s-ink w15 f-none" x1="541.969" x2="541.969" y1="299" y2="313"></line><text class="ts" text-anchor="middle" x="541.969" y="325">1년</text><line class="s-ink w15 f-none" x1="613.969" x2="613.969" y1="299" y2="313"></line><text class="ts" text-anchor="middle" x="613.969" y="325">100년</text><line class="s-ink w15 f-none" x1="685.969" x2="685.969" y1="299" y2="313"></line><text class="ts" text-anchor="middle" x="685.969" y="325">1만 년</text><line class="s-ink w15 f-none" x1="757.969" x2="757.969" y1="299" y2="313"></line><text class="ts" text-anchor="middle" x="757.969" y="325">100만 년</text><line class="s-ink w15 f-none" x1="829.969" x2="829.969" y1="299" y2="313"></line><text class="ts" text-anchor="middle" x="829.969" y="325">1억 년</text><line class="s-rule w1 dot f-none" x1="200" x2="848" y1="96" y2="96"></line><line class="s-rule w1 dot f-none" x1="200" x2="848" y1="140" y2="140"></line><line class="s-rule w1 dot f-none" x1="200" x2="848" y1="184" y2="184"></line><line class="s-rule w1 dot f-none" x1="200" x2="848" y1="228" y2="228"></line><line class="s-rule w1 dot f-none" x1="200" x2="848" y1="272" y2="272"></line><text class="ts" text-anchor="middle" x="524" y="368">가장자리가 한 번 떨리는 데 걸리는 시간 (초, 로그 눈금 · 위치는 대략)</text><path class="s-pass w2 f-none" d="M758.0,219 C758.0,22 361.2,22 361.2,130" marker-end="url(#F24-ar-pass)"></path><text class="ts c-pass halo" text-anchor="middle" x="559.573" y="50">필름: 100만 년 → 5분 · 약 10¹¹배 빨리</text><text class="ts c-pass" text-anchor="end" x="353.176" y="124">5분</text></svg></svg>
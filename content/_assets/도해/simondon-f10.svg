<path class="f-cry-soft s-none" d="M164,122 L164,246 A38,38 0 0 0 240,246 L240,122 L215,122 L215,246 A13,13 0 0 1 189,246 L189,122 Z"></path><path class="f-none s-ink w15" d="M164,116 L164,246 A38,38 0 0 0 240,246 L240,116"></path><path class="f-none s-ink w15" d="M189,116 L189,246 A13,13 0 0 0 215,246 L215,116"></path><line class="s-inf w2" x1="202" x2="202" y1="259" y2="284"></line><polygon class="f-inf" points="176.5,126 181.5,132 176.5,138 171.5,132"></polygon><polygon class="f-inf" points="225.0,124 230.0,124 231.5,127 231.5,137 230.0,140 225.0,140 223.5,137 223.5,127"></polygon><text class="t-s t-inf" text-anchor="middle" x="176.5" y="110">팔면체</text><text class="t-s t-inf" text-anchor="middle" x="227.5" y="110">프리즘</text>
<path class="f-cry-soft s-none" d="M288,122 L288,246 A38,38 0 0 0 364,246 L364,122 L339,122 L339,246 A13,13 0 0 1 313,246 L313,122 Z"></path><path class="f-cry-deep" d="M326,284 A38,38 0 0 1 288,246 L288,176 L313,176 L313,246 A13,13 0 0 0 326,259 Z"></path><line class="s-inf w2" x1="288" x2="313" y1="176" y2="176"></line><line class="s-ink w15" marker-end="url(#f10-ar-ink)" x1="279" x2="279" y1="262" y2="182"></line><path class="f-none s-ink w15" d="M288,116 L288,246 A38,38 0 0 0 364,246 L364,116"></path><path class="f-none s-ink w15" d="M313,116 L313,246 A13,13 0 0 0 339,246 L339,116"></path><line class="s-ink w1" x1="326" x2="326" y1="259" y2="284"></line><polygon class="f-inf" points="300.5,126 305.5,132 300.5,138 295.5,132"></polygon><polygon class="f-inf" points="349.0,124 354.0,124 355.5,127 355.5,137 354.0,140 349.0,140 347.5,137 347.5,127"></polygon><text class="t-s t-inf" text-anchor="middle" x="300.5" y="110">팔면체</text><text class="t-s t-inf" text-anchor="middle" x="351.5" y="110">프리즘</text>
<text class="t-s" text-anchor="middle" x="78" y="312">프리즘 가지가</text>
<text class="t-s" text-anchor="middle" x="78" y="327">접촉선부터 흐려짐</text>
<text class="t-s t-inf" text-anchor="middle" x="202" y="312">접촉선의 전선 멈춤</text>
<text class="t-s t-b" text-anchor="middle" x="202" y="327">속도 0</text>
<text class="t-s" text-anchor="middle" x="326" y="312">팔면체 가지가</text>
<text class="t-s" text-anchor="middle" x="326" y="327">접촉선부터 흐려짐</text>
<text class="t-s t-brk" x="26" y="352">〔정정〕 영역 첫 문장은 이 칸을 거꾸로 적음(팔면체 가지가 흐려진다고)</text>
<rect class="f-cry-soft" height="10" width="14" x="26" y="368"></rect>
<text class="t-s t-mute" x="46" y="377">맑은 결정</text>
<rect class="f-cry-deep" height="10" width="14" x="112" y="368"></rect>
<text class="t-s t-mute" x="132" y="377">흐림 = 다른 형태로 바뀐 부분</text>
<line class="s-inf w2" x1="300" x2="312" y1="373" y2="373"></line>
<text class="t-s t-mute" x="318" y="377">전선</text>
<line class="s-rule w1 dot" x1="402" x2="402" y1="14" y2="390"></line>
<text class="t t-b" x="418" y="24">90 °C 과냉 황의 계단</text>
<text class="t-s t-mute" x="418" y="40">높이를 ΔG에 비례해 그림: 112 대 5.6 = 20 대 1</text>
<line class="s-mute w1" x1="446" x2="446" y1="76" y2="305.4"></line>
<line class="s-mute w1" x1="442" x2="446" y1="76" y2="76"></line>
<line class="s-mute w1" x1="442" x2="446" y1="171.0" y2="171.0"></line>

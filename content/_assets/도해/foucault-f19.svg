<text class="t-s b end" x="246" y="462">유통과 교역</text>
<!-- 위 실선 변을 닫는 것: 가치 = 구조 -->
<line class="s k-azu" marker-end="url(#d-general-table-az)" x1="266" x2="316" y1="163" y2="99"></line>
<line class="s k-azu" marker-end="url(#d-general-table-az)" x1="474" x2="424" y1="163" y2="99"></line>
<text class="t-s mid mute" x="370" y="113">닫는다</text>
<rect class="s k-azu w-azu" height="52" width="216" x="262" y="42"></rect>
<text class="t b mid c-azu" x="370" y="63">가치 = 구조</text>
<text class="t-s mid" x="370" y="83">결합술 · 존재의 구조 · 사물의 가치</text>
<!-- 아래 실선 변을 닫는 것: 화폐·가격 = 형질 -->
<line class="s k-azu" marker-end="url(#d-general-table-az)" x1="266" x2="316" y1="397" y2="461"></line>
<line class="s k-azu" marker-end="url(#d-general-table-az)" x1="474" x2="424" y1="397" y2="461"></line>
<text class="t-s mid mute" x="370" y="455">닫는다</text>
<rect class="s k-azu w-azu" height="52" width="216" x="262" y="466"></rect>

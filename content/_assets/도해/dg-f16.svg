<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 288" width="720" height="288" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2-t{ fill:var(--ink-2); }.f-muted{ stroke:var(--muted); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-indigo-f{ fill:var(--indigo-soft); }.f-madder{ stroke:var(--madder); }.f-madder-t{ fill:var(--madder); }.f-ochre-t{ fill:var(--ochre); }.f-mend-t{ fill:var(--mend); }.f-ground-f{ fill:var(--ground); }.f-none{ fill:none; }.f-dot{ stroke-dasharray:2 4; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-b{ font-weight:700; }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="한 사람을 동시에 지나가는 세 선의 다발이다: 큰 이름표가 붙은 마디로 끊기는 몰적 절편선, 그 마디와 자리가 어긋난 가는 금이 가는 분자적 유연한 선, 그리고 마디도 금도 없이 위의 두 선을 뚫고 빠져나가는 도주선. 단절, 균열, 파열이 이 세 선의 이름이다." height="100%" role="img" viewBox="0 0 720 288" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f16-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f16-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f16-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f16-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f16-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f16-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f16-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="f-muted f-ground-f" height="222" rx="3" stroke-dasharray="4 4" stroke-width="1.2" width="42" x="196" y="34"></rect><text class="f-ink-t t-s" text-anchor="middle" x="217" y="276">한 사람 = 세 선의 다발</text><line class="f-indigo f-none" stroke-width="4" x1="168" x2="295" y1="84" y2="84"></line><line class="f-indigo f-none" stroke-width="4" x1="305" x2="415" y1="84" y2="84"></line><line class="f-indigo f-none" stroke-width="4" x1="425" x2="525" y1="84" y2="84"></line><line class="f-indigo f-none" stroke-width="4" x1="535" x2="629" y1="84" y2="84"></line><line class="f-indigo f-none" stroke-width="4" x1="647" x2="704" y1="84" y2="84"></line><rect class="f-indigo f-indigo-f" height="22" rx="1" stroke-width="2" width="8" x="296" y="73"></rect><rect class="f-indigo f-indigo-f" height="22" rx="1" stroke-width="2" width="8" x="416" y="73"></rect><rect class="f-indigo f-indigo-f" height="22" rx="1" stroke-width="2" width="8" x="526" y="73"></rect><text class="f-indigo-t t-s" text-anchor="middle" x="300" y="66">부자 / 가난뱅이</text><text class="f-indigo-t t-s" text-anchor="middle" x="420" y="66">결혼 / 이혼</text><text class="f-indigo-t t-b" text-anchor="start" x="16" y="82">몰적 절편선</text><text class="f-ink2-t t-s" text-anchor="start" x="16" y="100">경직 — 단절</text><line class="f-ink f-none" stroke-width="1.4" x1="168" x2="591" y1="154" y2="154"></line><line class="f-ink f-none" stroke-width="1.4" x1="609" x2="704" y1="154" y2="154"></line><line class="f-ink f-none" stroke-width="1.1" x1="348" x2="357" y1="162" y2="145"></line><line class="f-ink f-none" stroke-width="1.1" x1="362" x2="371" y1="162" y2="145"></line><line class="f-ink f-none" stroke-width="1.1" x1="466" x2="475" y1="162" y2="145"></line><line class="f-ink f-none" stroke-width="1.1" x1="478" x2="487" y1="162" y2="145"></line><line class="f-ink f-none" stroke-width="1.1" x1="552" x2="561" y1="162" y2="145"></line><line class="f-muted f-none f-dot" stroke-width="1" x1="300" x2="300" y1="98" y2="148"></line><line class="f-muted f-none f-dot" stroke-width="1" x1="420" x2="420" y1="98" y2="148"></line><line class="f-muted f-none f-dot" stroke-width="1" x1="530" x2="530" y1="98" y2="148"></line><text class="f-ink2-t t-s" text-anchor="middle" x="476" y="180">마디와 어긋난 금</text><text class="f-ink-t t-b" text-anchor="start" x="16" y="152">분자적 유연한 선</text><text class="f-ink2-t t-s" text-anchor="start" x="16" y="170">유연 — 균열</text><path class="f-madder f-none" d="M168,228 L470,228 C548,228 584,196 600,154 C612,120 624,96 638,84 C652,70 664,48 690,22" marker-end="url(#f16-a-madder)" stroke-width="3"></path><line class="f-madder f-none" stroke-width="1.2" x1="593.95" x2="589" y1="149.05" y2="145"></line><line class="f-madder f-none" stroke-width="1.2" x1="606.6" x2="612" y1="150.15" y2="147"></line><line class="f-madder f-none" stroke-width="1.2" x1="594.5" x2="590" y1="159.5" y2="164"></line><line class="f-madder f-none" stroke-width="1.2" x1="606.05" x2="611" y1="158.95" y2="163"></line><line class="f-madder f-none" stroke-width="1.2" x1="631.95" x2="627" y1="79.05" y2="75"></line><line class="f-madder f-none" stroke-width="1.2" x1="644.6" x2="650" y1="80.15" y2="77"></line><line class="f-madder f-none" stroke-width="1.2" x1="632.5" x2="628" y1="89.5" y2="94"></line><line class="f-madder f-none" stroke-width="1.2" x1="644.05" x2="649" y1="88.95" y2="93"></line><text class="f-madder-t t-s" text-anchor="start" x="650" y="136">뚫고 나감</text><text class="f-madder-t t-b" text-anchor="start" x="16" y="226">도주선</text><text class="f-ink2-t t-s" text-anchor="start" x="16" y="244">절편 없음 — 파열</text></svg></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 340" width="640" height="340" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#F1F3F1; --sheet:#FAFBF9; --ink:#1B2124; --ink-2:#3A4549; --mute:#5E6B71;
  --grid:#C9D4D1; --grid-2:#E1E8E5; --rule:#B6C2C0;
  --neuro:#3546A8; --soma:#8F5508; --life:#256B41; --deep:#8A4429; --alarm:#B01E4C;
  --neuro-w:color-mix(in srgb, var(--neuro) 13%, var(--sheet));
  --soma-w:color-mix(in srgb, var(--soma) 14%, var(--sheet));
  --life-w:color-mix(in srgb, var(--life) 13%, var(--sheet));
  --deep-w:color-mix(in srgb, var(--deep) 13%, var(--sheet));
  --alarm-w:color-mix(in srgb, var(--alarm) 11%, var(--sheet));
  --ink-w:color-mix(in srgb, var(--ink) 8%, var(--sheet));
  --shadow:color-mix(in srgb, var(--ink) 16%, transparent);
  --f-display:"Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body:"Literata", "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --f-label:"Sofia Sans Condensed", "Gothic A1", "Arial Narrow", sans-serif;
  --f-mono:"DM Mono", "Nanum Gothic Coding", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-fig:"Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111517; --sheet:#181D20; --ink:#E2E8E7; --ink-2:#C2CBCB; --mute:#93A0A4;
  --grid:#2E3A3D; --grid-2:#1D2629; --rule:#3A4746;
  --neuro:#9AA8FF; --soma:#E5A64A; --life:#6CC895; --deep:#E39A74; --alarm:#FF7AA0;
  --shadow:rgba(0,0,0,.5); color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#111517; --sheet:#181D20; --ink:#E2E8E7; --ink-2:#C2CBCB; --mute:#93A0A4;
  --grid:#2E3A3D; --grid-2:#1D2629; --rule:#3A4746;
  --neuro:#9AA8FF; --soma:#E5A64A; --life:#6CC895; --deep:#E39A74; --alarm:#FF7AA0;
  --shadow:rgba(0,0,0,.5); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); }.hero svg{ display:block; width:100%; height:auto }figure.fig{ margin:1rem 0; }.fig-frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background-color:var(--sheet);
  background-image:linear-gradient(to right, var(--sheet) 30%, transparent), linear-gradient(to left, var(--sheet) 30%, transparent),
    radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2rem 100%, 2rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; min-width:var(--figmin, 34rem); height:auto; }svg text{ font-family:var(--f-fig); font-size:12px; fill:var(--ink) }svg .t-m{ fill:var(--mute) }svg .t-s{ font-size:10.5px }svg .t-b{ font-weight:700 }svg .t-num{ font-family:var(--f-mono); font-variant-numeric:tabular-nums }svg .t-deep{ fill:var(--deep) }svg .t-alarm{ fill:var(--alarm) }svg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }svg .ln-2{ stroke:var(--ink-2); stroke-width:1.2; fill:none }svg .ln-g{ stroke:var(--grid); stroke-width:1; fill:none }svg .ln-deep{ stroke:var(--deep); stroke-width:1.8; fill:none }svg .ln-alarm{ stroke:var(--alarm); stroke-width:1.8; fill:none }svg .w-thick{ stroke-width:2.8 }svg .w-heavy{ stroke-width:4 }svg .dash{ stroke-dasharray:5 4 }svg .f-paper{ fill:var(--sheet) }svg .f-inkw{ fill:var(--ink-w) }svg .f-deep{ fill:var(--deep) }svg .f-deep-w{ fill:var(--deep-w) }svg .f-alarm-w{ fill:var(--alarm-w) }svg .f-none{ fill:none }section.lecture-wrap{ content-visibility:auto; contain-intrinsic-size:auto 60000px }svg.pz-root{width:640px!important;height:340px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc lecture-wrap"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="포레스트 부대의 시간선: 1983~86년 결핵으로 쓰레기장에 원정 다니던 공격적 수컷이 모두 죽고, 6년 뒤 1993~96년에는 암수비 2:1의 친화적 문화가 관찰된다. 남은 원래 수컷은 줄어 0마리가 되지만, 평범한 무리에서 전입한 수컷들이 암컷의 이른 털 고르기 속에 약 6개월 만에 동화되어 문화가 유지된다. 시작은 선택, 유지는 전달." class="pz-inner" height="100%" role="img" viewBox="0 0 640 340" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="forest-ahd" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-deep" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 시기 기둥 -->
<rect class="f-inkw" height="222" width="80" x="150" y="32"></rect>
<rect class="f-alarm-w" height="222" width="80" x="230" y="32"></rect>
<rect class="f-inkw" height="222" width="80" x="430" y="32"></rect>
<rect class="f-none ln-g dash" height="222" width="104" x="520" y="32"></rect>
<text class="t-s t-b" text-anchor="middle" x="190" y="24">관찰 ①</text>
<text class="t-s t-b t-alarm" text-anchor="middle" x="270" y="24">결핵</text>
<text class="t-s t-alarm" text-anchor="middle" x="270" y="45">롯지 쓰레기</text>
<text class="t-s t-m" text-anchor="middle" x="370" y="24">6년 공백</text>
<text class="t-s t-b" text-anchor="middle" x="470" y="24">관찰 ②</text>
<text class="t-s t-m" text-anchor="middle" x="572" y="24">이후</text>
<!-- A: 공격적 원정 수컷 -->
<text class="t-s t-b" x="16" y="62">공격적 수컷</text>
<text class="t-s t-m" x="16" y="76">쓰레기장 원정</text>
<path class="ln w-heavy" d="M150,66 L290,66"></path>
<path class="ln-alarm w-thick" d="M293,59 L305,73 M305,59 L293,73"></path>
<text class="t-s t-b t-alarm" text-anchor="middle" x="270" y="88">모두 죽음</text>
<!-- B: 남은 원래 수컷 -->
<text class="t-s t-b" x="16" y="110">남은 원래 수컷</text>
<path class="ln w-heavy" d="M150,106 L310,106"></path>
<path class="ln w-thick" d="M310,106 L430,106"></path>
<path class="ln dash" d="M430,106 L520,106"></path>
<text class="t-s t-m" text-anchor="middle" x="470" y="98">대부분 사라짐</text>
<text class="t-s t-b" x="528" y="110">원래 수컷 0마리</text>
<!-- C: 전입 수컷 -->
<text class="t-s t-b" x="16" y="142">전입 수컷</text>
<text class="t-s t-m" x="16" y="156">평범한 무리 출신</text>
<path class="ln w-heavy" d="M318,146 L620,146"></path>
<text class="t-s" x="330" y="136">5마리 관찰 · 약 6개월에 동화</text>
<!-- D: 암컷 -->
<text class="t-s t-b" x="16" y="186">암컷</text>
<text class="t-s t-m" x="16" y="200">태어난 무리에 남음</text>
<path class="ln w-heavy" d="M150,190 L620,190"></path>
<path class="ln-deep" d="M352,185 L352,153" marker-end="url(#forest-ahd)"></path>
<path class="ln-deep" d="M572,185 L572,153" marker-end="url(#forest-ahd)"></path>
<text class="t-s t-deep" x="360" y="173">첫 털 고르기 며칠~몇 주</text>
<text class="t-s" text-anchor="middle" x="470" y="207">암수비 2:1</text>
<!-- E: 무리의 문화 -->
<text class="t-s t-b" x="16" y="240">무리의 문화</text>
<rect class="f-paper ln-2" height="22" rx="2" width="80" x="150" y="224"></rect>
<text class="t-s" text-anchor="middle" x="190" y="239">공격·화풀이</text>
<rect class="f-deep-w ln-deep" height="22" rx="2" width="210" x="310" y="224"></rect>
<text class="t-s t-b t-deep" text-anchor="middle" x="415" y="239">친화 — 털 고르기↑ · 화풀이↓</text>
<rect class="f-deep-w ln-deep dash" height="22" rx="2" width="100" x="520" y="224"></rect>
<text class="t-s t-b t-deep" text-anchor="middle" x="570" y="239">그대로 유지</text>
<!-- 시간 축 -->
<path class="ln" d="M150,262 L624,262"></path>
<path class="ln" d="M150,258 L150,266 M230,258 L230,266 M310,258 L310,266 M430,258 L430,266 M510,258 L510,266"></path>
<text class="t-s t-num" text-anchor="middle" x="190" y="278">1979~82</text>
<text class="t-s t-num t-alarm" text-anchor="middle" x="270" y="278">1983~86</text>
<text class="t-s t-num t-m" text-anchor="middle" x="370" y="278">1987~92</text>
<text class="t-s t-num" text-anchor="middle" x="470" y="278">1993~96</text>
<text class="t-s t-m" text-anchor="middle" x="572" y="278">21세기 초? (강연)</text>
<!-- 이음매: 선택에서 전달로 -->
<path class="ln-alarm" d="M232,290 L232,296 L308,296 L308,290"></path>
<text class="t-s t-b t-alarm" text-anchor="middle" x="270" y="312">시작 = 선택</text>
<text class="t-s t-alarm" text-anchor="middle" x="270" y="327">누가 남았나</text>
<path class="ln-deep" d="M312,290 L312,296 L620,296 L620,290"></path>
<text class="t-s t-b t-deep" text-anchor="middle" x="466" y="312">유지 = 전달</text>
<text class="t-s t-deep" text-anchor="middle" x="466" y="327">어떻게 대하나 · 유전자를 거치지 않고</text>
</svg></g></g></g></svg>
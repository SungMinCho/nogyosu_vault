<circle class="f-jag" cx="446" cy="298" r="2.6"></circle>
<circle class="f-jag" cx="486" cy="318" r="2.6"></circle>
<circle class="f-jag" cx="538" cy="312" r="2.6"></circle>
<circle class="f-jag" cx="590" cy="302" r="2.6"></circle>
<circle class="f-jag" cx="628" cy="270" r="2.6"></circle>
<circle class="f-jag" cx="470" cy="214" r="2.6"></circle>
<circle class="f-jag" cx="548" cy="204" r="2.6"></circle>
<circle class="f-jag" cx="468" cy="268" r="2.6"></circle>
<circle class="f-jag" cx="497" cy="239" r="2.6"></circle>
<circle class="f-jag" cx="603" cy="239" r="2.6"></circle>
<circle class="f-jag" cx="497" cy="278" r="2.6"></circle>
<circle class="f-jag" cx="603" cy="278" r="2.6"></circle>
<text class="ts tm c-jag" x="510" y="358">함축 = 포함적 분리</text>
<text class="tl tm" x="510" y="378">이것이든 저것이든</text>
<line class="s-rule" x1="24" x2="656" y1="396" y2="396"></line>
<text class="tl tm" x="340" y="416">쿨백-라이블러 쪽지 — 같은 두 세계, 어느 끝에서 재느냐</text>
<text class="ts tm" x="170" y="438">굳은 쪽에서 본 값 <tspan class="tb c-uru">∞</tspan> (배제)</text>
<text class="ts tm" x="510" y="438">무른 쪽에서 본 값 <tspan class="tb c-jag">1비트</tspan> (품음)</text>
</svg></g></g></g></g></svg>
없는 자리에만 실행 중 하다마드를 곱한다." class="dg pz-inner" height="100%" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 640 380" width="100%"><defs><marker id="inv-a-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="inv-a-step" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-step" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="inv-a-sig" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-sig" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="inv-a-tooth" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-tooth" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="inv-a-fix" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-fix" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="inv-a-ink2" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink2" d="M0,1 L10,5 L0,9 z"></path></marker></defs><line class="s-fix" stroke-width="4" x1="8" x2="634" y1="46" y2="46"></line><text class="t-fix" style="font-size:12px;font-weight:600" x="20" y="34">잔차 흐름 xQ — 처음부터 끝까지 돌아간 채로 흐름</text><text class="t-ink" style="font-size:12px;font-weight:600" x="24" y="84">어텐션</text><line class="s-ink2" marker-end="url(#inv-a-ink2)" stroke-width="1.2" x1="84" x2="84" y1="46" y2="96"></line><rect class="f-paper s-ink3" height="40" rx="4" stroke-width="1.4" width="120" x="24" y="98"></rect><text class="t-ink" style="font-size:11px;font-weight:600" text-anchor="middle" x="84" y="115">RMSNor
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 372" width="720" height="372" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink-t{ fill:var(--ink); }.f-ink2{ stroke:var(--ink-2); }.f-ink2-t{ fill:var(--ink-2); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-indigo-f{ fill:var(--indigo-soft); }.f-madder{ stroke:var(--madder); }.f-madder-t{ fill:var(--madder); }.f-madder-f{ fill:var(--madder-soft); }.f-ochre-t{ fill:var(--ochre); }.f-mend-t{ fill:var(--mend); }.f-panel-f{ fill:var(--panel); }.f-none{ fill:none; }.f-dot{ stroke-dasharray:2 4; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-l{ font-size:15px; }svg .t-mono{ font-family:var(--f-mono); }svg .t-b{ font-weight:700; }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="세 종합에는 각각 합법적·내재적 사용과 비합법적·초월적 사용이 있고, 판 위로 들린 비합법적 사용이 외삽·이중 구속·적용이라는 세 오류추리를 낳는다. 오른쪽 칸들을 위에서 아래로 읽으면 정신분석이 '치료에 가장 유리한 조건'이라 부른 목록과 같다." height="100%" role="img" viewBox="0 0 720 372" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f03-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f03-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f03-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f03-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f03-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f03-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f03-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="f-ink2-t t-s" text-anchor="start" x="14" y="30">세 종합</text><text class="f-madder-t t-b" text-anchor="middle" x="262.0" y="30">합법적·내재적 사용</text><text class="f-indigo-t t-b" text-anchor="middle" x="464.0" y="30">비합법적·초월적 사용</text><text class="f-ink-t t-b" text-anchor="middle" x="629.0" y="30">오류추리</text><line class="f-ink2 f-none" stroke-width="1" x1="8" x2="712" y1="44" y2="44"></line><rect class="f-ink2 f-panel-f" height="88" rx="2" stroke-width="1.2" width="150" x="8" y="50"></rect><text class="f-ink-t t-l t-b" text-anchor="start" x="18" y="76">연결 종합</text><text class="f-ink2-t t-s" text-anchor="start" x="18" y="96">생산</text><text class="f-ink2-t t-s" text-anchor="start" x="18" y="122">“그리고… 그다음에…”</text><rect class="f-madder f-madder-f" height="88" rx="2" stroke-width="1.4" width="196" x="164" y="50"></rect><text class="f-madder-t" text-anchor="middle" x="262.0" y="74">부분적·비특정적</text><rect class="f-indigo f-indigo-f" height="88" rx="2" stroke-width="1.4" width="196" x="366" y="50"></rect><text class="f-indigo-t" text-anchor="middle" x="464.0" y="74">전역적·특정적</text><rect class="f-indigo f-panel-f" height="88" rx="2" stroke-width="1.2" width="122" x="568" y="50"></rect><text class="f-indigo-t t-b" text-anchor="middle" x="629.0" y="99.0">① 외삽</text><line class="f-indigo f-none" stroke-width="1.2" x1="560" x2="570" y1="94.0" y2="94.0"></line><rect class="f-ink2 f-panel-f" height="88" rx="2" stroke-width="1.2" width="150" x="8" y="144"></rect><text class="f-ink-t t-l t-b" text-anchor="start" x="18" y="170">분리 종합</text><text class="f-ink2-t t-s" text-anchor="start" x="18" y="190">등록</text><text class="f-ink2-t t-s" text-anchor="start" x="18" y="216">“…이든 …이든 …이든”</text><rect class="f-madder f-madder-f" height="88" rx="2" stroke-width="1.4" width="196" x="164" y="144"></rect><text class="f-madder-t" text-anchor="middle" x="262.0" y="168">포함적·비제한적</text><rect class="f-indigo f-indigo-f" height="88" rx="2" stroke-width="1.4" width="196" x="366" y="144"></rect><text class="f-indigo-t" text-anchor="middle" x="464.0" y="168">배타적·제한적</text><rect class="f-indigo f-panel-f" height="88" rx="2" stroke-width="1.2" width="122" x="568" y="144"></rect><text class="f-indigo-t t-b" text-anchor="middle" x="629.0" y="193.0">② 이중 구속</text><line class="f-indigo f-none" stroke-width="1.2" x1="560" x2="570" y1="188.0" y2="188.0"></line><rect class="f-ink2 f-panel-f" height="88" rx="2" stroke-width="1.2" width="150" x="8" y="238"></rect><text class="f-ink-t t-l t-b" text-anchor="start" x="18" y="264">결합 종합</text><text class="f-ink2-t t-s" text-anchor="start" x="18" y="284">소비-완수</text><text class="f-ink2-t t-s" text-anchor="start" x="18" y="310">“그러니까 그거였구나!”</text><rect class="f-madder f-madder-f" height="88" rx="2" stroke-width="1.4" width="196" x="164" y="238"></rect><text class="f-madder-t" text-anchor="middle" x="262.0" y="262">유목적·다성적</text><rect class="f-indigo f-indigo-f" height="88" rx="2" stroke-width="1.4" width="196" x="366" y="238"></rect><text class="f-indigo-t" text-anchor="middle" x="464.0" y="262">분리차별적·일대일 대응적</text><rect class="f-indigo f-panel-f" height="88" rx="2" stroke-width="1.2" width="122" x="568" y="238"></rect><text class="f-indigo-t t-b" text-anchor="middle" x="629.0" y="287.0">③ 적용</text><line class="f-indigo f-none" stroke-width="1.2" x1="560" x2="570" y1="282.0" y2="282.0"></line><line class="f-madder f-none f-dot" stroke-width="1" x1="178" x2="260" y1="118" y2="118"></line><circle class="f-madder f-panel-f" cx="184" cy="108" r="3.4" stroke-width="1.4"></circle><circle class="f-madder f-panel-f" cx="200" cy="108" r="3.4" stroke-width="1.4"></circle><circle class="f-madder f-panel-f" cx="216" cy="108" r="3.4" stroke-width="1.4"></circle><circle class="f-madder f-panel-f" cx="232" cy="108" r="3.4" stroke-width="1.4"></circle><line class="f-madder f-none f-dot" stroke-width="1.2" x1="248" x2="266" y1="108" y2="108"></line><text class="f-madder-t t-mono t-b" text-anchor="start" x="278" y="113">4 + n</text><text class="f-madder-t t-s" text-anchor="start" x="324" y="113">열린</text><path class="f-indigo f-none" d="M390,121 L430,121 L410,105 Z" stroke-width="1.4"></path><circle class="f-indigo f-panel-f" cx="390" cy="121" r="3.2" stroke-width="1.3"></circle><circle class="f-indigo f-panel-f" cx="430" cy="121" r="3.2" stroke-width="1.3"></circle><circle class="f-indigo f-panel-f" cx="410" cy="105" r="3.2" stroke-width="1.3"></circle><line class="f-indigo f-none f-dot" stroke-width="1" x1="410" x2="410" y1="92" y2="101"></line><circle class="f-indigo f-indigo-t" cx="410" cy="88" r="3.8" stroke-width="1.3"></circle><text class="f-indigo-t t-mono t-b" text-anchor="start" x="480" y="113">3 + 1</text><text class="f-indigo-t t-s" text-anchor="start" x="526" y="113">닫힌</text><line class="f-madder f-none" stroke-width="1.6" x1="182" x2="262" y1="202" y2="202"></line><line class="f-madder f-none" stroke-width="1.6" x1="182" x2="182" y1="195" y2="209"></line><line class="f-madder f-none" stroke-width="1.6" x1="262" x2="262" y1="195" y2="209"></line><circle class="f-madder f-madder-t" cx="228" cy="202" r="4" stroke-width="1.2"></circle><path class="f-madder f-none" d="M214,192 L242,192" marker-end="url(#f03-a-madder)" stroke-width="1.1"></path><path class="f-madder f-none" d="M242,192 L214,192" marker-end="url(#f03-a-madder)" stroke-width="1.1"></path><text class="f-madder-t t-s" text-anchor="start" x="278" y="200">두 끝 사이를</text><text 
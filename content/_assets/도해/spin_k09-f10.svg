<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 270" width="800" height="270" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .f-ink{ fill:var(--ink) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:800px!important;height:270px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="NVIDIA의 NVFP4 사전학습 처방: 순전파와 활성 기울기에는 회전이 없고 가중치 기울기 계산에만 16 곱하기 16 무작위 하다마드를 쓰며 기울기에만 확률적 반올림을 쓴다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 800 270" width="100%"><defs><marker id="l6-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="bx" height="120" rx="6" width="220" x="30" y="40"></rect><text class="t-b" text-anchor="middle" x="140" y="64">Fprop</text><text class="t-s t-mono" text-anchor="middle" x="140" y="86">Y = X · W</text><text class="t-s t-b t-mut" text-anchor="middle" x="140" y="116">회전 없음</text><text class="t-s t-mut" text-anchor="middle" x="140" y="138">RTN</text><rect class="bx" height="120" rx="6" width="220" x="280" y="40"></rect><text class="t-b" text-anchor="middle" x="390" y="64">Dgrad</text><text class="t-s t-mono" text-anchor="middle" x="390" y="86">dX = dY · Wᵀ</text><text class="t-s t-b t-mut" text-anchor="middle" x="390" y="116">회전 없음</text><text class="t-s t-mut" text-anchor="middle" x="390" y="138">기울기에 SR</text><rect class="bx-rot" height="120" rx="6" width="220" x="530" y="40"></rect><text class="t-b t-rot" text-anchor="middle" x="640" y="64">Wgrad</text><text class="t-s t-mono" text-anchor="middle" x="640" y="86">dW = Xᵀ · dY</text><text class="t-s t-b t-rot" text-anchor="middle" x="640" y="116">16 × 16 RHT</text><text class="t-s t-mut" text-anchor="middle" x="640" y="138">기울기에 SR</text><text class="t-s" text-anchor="start" x="30" y="196">가중치는 2차원 16 × 16 블록 — Fprop(W)과 Dgrad(Wᵀ)에서 같은 블록이 되어 연쇄 법칙이 맞는다.</text><text class="t-s t-mut" text-anchor="start" x="30" y="218">민감한 층 16%(앞 2블록, 뒤 8블록)는 BF16 · MXFP8. 무작위 부호 벡터 하나를 모든 층·훈련 전체에 공유.</text><text class="t-s t-b t-spike" text-anchor="start" x="30" y="240">"Fprop이나 Dgrad 입력을 변환하면 모델 품질이 나빠진다" — NVIDIA 부록</text></svg></g></g></g></g></svg>
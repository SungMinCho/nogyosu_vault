 style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="왼쪽: 자극이 들어온 한 점을 중심으로, 같은 행위 시간 1초 안에 신호가 갔다 돌아오는 고리가 닫히는 반지름 셋을 로그 눈금으로 그린 동심원. 확산 약 30 µm, 대류 약 1.5 cm, 신경 약 2.5 m로 자릿수가 10의 5제곱 가까이 벌어진다. 원마다 구심, 중추, 원심의 고리가 있고 원 밖은 남의 일이다. 오른쪽: 물지렁이 사슬의 세 장면. a 머리 셋에 신경삭 하나로 한 개체. b 맨 뒤 개충이 제 리듬을 갖고 부모 신호를 억제하는 순간에 개체화 날짜의 깃발. c 엇박 수축으로 조직이 녹아 떨어지는 독립." class="pz-inner" height="100%" role="img" viewBox="0 0 760 430" width="100%">

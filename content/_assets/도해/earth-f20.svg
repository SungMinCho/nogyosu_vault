  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1513; --panel:#151D1A; --ink:#DCE3DC; --ink2:#A9B5AD; --ink3:#7F8B84; --rule:#2C3732; --hair:#222C28;

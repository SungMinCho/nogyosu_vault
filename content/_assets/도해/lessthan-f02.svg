<text class="t-end t-b" x="186" y="160">비역사</text>
<text class="t-end t-b" x="156" y="250">역사</text>
<line class="s-muted w15" marker-end="url(#L01-2-ar-mut)" marker-start="url(#L01-2-ar-mut)" x1="132" x2="114" y1="172" y2="226"></line>
<!-- 네 칸 -->
<text class="t-mid t-b" x="342" y="140">과학적 자연주의</text>
<text class="t-mid t-s t-muted" x="342" y="158">뇌과학 · 다윈주의</text>
<text class="t-mid t-s" x="342" y="176">초월론 차원을 지운다</text>
<text class="t-mid t-b" x="622" y="140">서구 불교</text>
<text class="t-mid t-s t-muted" x="622" y="158">뉴에이지</text>
<text class="t-mid t-s" x="622" y="176">간극을 공(空)에 녹인다</text>
<text class="t-mid t-b" x="300" y="230">담론적 역사주의</text>
<text class="t-mid t-s t-muted" x="300" y="248">푸코 · 해체</text>
<text class="t-mid t-s" x="300" y="266">주어진 지평에서 멈춘다</text>
<text class="t-mid t-b" x="580" y="230">초월론적 유한성</text>
<text class="t-mid t-s t-muted" x="580" y="248">하이데거</text>
<text class="t-mid t-s" x="580" y="266">주어진 지평에서 멈춘다</text>
<!-- 바닥 밑의 단층 -->
<path class="f-none s-red w3 round" d="M120,380 L170,371 L210,386 L255,369 L298,384 L345,370 L388,387 L435,369 L478,384 L525,370 L568,386 L615,369 L658,383 L702,372 L745,381"></path>
<line class="s-red w15 dash" marker-end="url(#L01-2-ar-red)" x1="255" x2="255" y1="366" y2="316"></line>
<line class="s-red w15 dash" marker-end="url(#L01-2-ar-red)" x1="435" x2="435" y1="366" y2="316"></line>
<line class="s-red w15 dash" marker-end="url(#L01-2-ar-red)" x1="615" x2="615" y1="366" y2="316"></line>
<text class="t-mid t-s f-red" x="525" y="346">지평이 솟아나오는 자리</text>
<text class="t-mid t-b f-red" x="432" y="418">전초월론적 간극 = 충동</text>
<text class="t-mid t-s" x="432" y="438">네 칸이 모두 놓치는 차원 — 근대 주체성의 핵심</text>
<text class="t-end t-s t-muted" x="845" y="462">칸 배치와 '놓치는 방식'은 강의의 재구성</text>
</svg></g></g></g></g></g></svg>
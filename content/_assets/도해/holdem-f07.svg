<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 620 170" width="620" height="170" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#F1F2EC; --paper:#FAFAF6; --soft:#E3E6DE; --tie:#B9BEB5; --stack:#C9CDC4; --grid:#DCE0D6; --rule:#CDD3CA;
  --ink:#1B2420; --ink-2:#44504A; --muted:#6E7871; --on:#FFFFFF;
  --pot:#23825A; --risk:#C0392B; --eq:#A0700F; --un:#2F5DA8; --warn:#8A4FB8;
  --eq-bg:#F3E7CC; --risk-bg:#F6DEDA;
  --f-body:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-disp:"Song Myung","Nanum Myeongjo","Noto Serif KR",serif;
  --f-num:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --f-dg:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --f-math:"Noto Sans Math","STIX Two Math","Cambria Math",math;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}}:root[data-theme="dark"]{
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:2.2rem 4rem}.lecture{display:contents}.fig{margin:.6rem 0 !important;display:grid;gap:.55rem}.fig .frame{overflow-x:auto;background:
  linear-gradient(90deg,var(--paper) 30%,transparent),linear-gradient(270deg,var(--paper) 30%,transparent),
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent),
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent) 100% 0;
  background-color:var(--paper);background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll;
  border:1px solid var(--rule);border-radius:3px;padding:.7rem}.dg{display:block;width:100%;height:auto;font-family:var(--f-dg)}.dg text{fill:var(--ink);font-size:12px}.dg text.mu{fill:var(--muted)}.dg text.b{font-weight:700}.dg .on{fill:var(--on)}.dg text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}.dg text.card{font-family:var(--f-num)}.dg .f-risk{fill:var(--risk)}.dg .f-eqbg{fill:var(--eq-bg)}.dg .s-grid{stroke:var(--grid);stroke-width:1}.dg .s-eq{stroke:var(--eq);stroke-width:1.6}.dg circle:hover,.dg rect[class]:hover{filter:brightness(1.08)}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="같은 90bb 올인이라도 순수 블러프는 상대가 81.4% 접어야 본전이지만, 콜당해도 39.8% 에퀴티가 있는 플러시 드로우는 33.2%만 접으면 본전이다." class="dg" height="100%" role="img" style="" viewBox="0 0 620 170" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern height="6" id="hh-fe" patternTransform="rotate(45)" patternUnits="userSpaceOnUse" width="6"><rect class="f-eqbg" height="6" width="6"></rect><line class="s-eq" style="stroke-width:2" x1="0" x2="0" y1="0" y2="6"></line></pattern></defs><line class="s-grid" x1="170.0" x2="170.0" y1="30.0" y2="128.0"></line><text class="mu num" style="font-size:11px" text-anchor="middle" x="170.0" y="146.0">0%</text><line class="s-grid" x1="270.0" x2="270.0" y1="30.0" y2="128.0"></line><text class="mu num" style="font-size:11px" text-anchor="middle" x="270.0" y="146.0">25%</text><line class="s-grid" x1="370.0" x2="370.0" y1="30.0" y2="128.0"></line><text class="mu num" style="font-size:11px" text-anchor="middle" x="370.0" y="146.0">50%</text><line class="s-grid" x1="470.0" x2="470.0" y1="30.0" y2="128.0"></line><text class="mu num" style="font-size:11px" text-anchor="middle" x="470.0" y="146.0">75%</text><line class="s-grid" x1="570.0" x2="570.0" y1="30.0" y2="128.0"></line><text class="mu num" style="font-size:11px" text-anchor="middle" x="570.0" y="146.0">100%</text><text style="font-size:13px" text-anchor="start" x="12.0" y="54.0">순수 블러프라면</text><text class="mu" style="font-size:11px" text-anchor="start" x="12.0" y="69.0">(에퀴티 0)</text><rect class="f-risk" height="24.0" rx="0" width="325.6" x="170.0" y="42.0"><title>필요 폴드율 81.4%</title></rect><text class="num b" style="font-size:13px" text-anchor="start" x="503.6" y="59.0">81.4%</text><text style="font-size:13px" text-anchor="start" x="12.0" y="104.0">세미블러프</text><text class="mu" style="font-size:11px" text-anchor="start" x="12.0" y="119.0">(콜당해도 39.8%)</text><rect class="f-risk" height="24.0" rx="0" width="132.8" x="170.0" y="92.0"><title>필요 폴드율 33.2%</title></rect><rect class="f-hatch" fill="url(#hh-fe)" height="24.0" rx="0" width="190.8" x="304.8" y="92.0"></rect><text class="on num" style="font-size:13px;font-weight:700" text-anchor="end" x="296.8" y="109.0">33.2%</text><text class="b" style="font-size:12px" text-anchor="middle" x="399.2" y="109.0">드로우 에퀴티가 깎은 48%p</text><text class="mu" style="font-size:12px" text-anchor="start" x="170.0" y="20.0">필요한 폴드율 — SPR 4.4 팟, 90bb 올인 into 20.5bb</text></svg></svg>
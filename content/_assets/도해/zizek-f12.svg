<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 256" width="760" height="256" class="fig-scroll fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#E5E6E1; --panel:#F0F1EC; --ink:#1B1D21; --mute:#5B5F63; --rule:#C3C6C0;

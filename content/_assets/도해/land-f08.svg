<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 740 300" width="740" height="300" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-xs{ font-size:10.5px }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-frame{ fill:var(--paper-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-sunsoft{ fill:var(--sun-soft) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-ledgersoft{ fill:var(--ledger-soft) }.fig .f-blood{ fill:var(--blood) }.fig .s-mute{ stroke:var(--ink-2) }.fig .s-rule{ stroke:var(--rule) }.fig .s-sun{ stroke:var(--sun) }.fig .s-ledger{ stroke:var(--ledger) }.fig .w1{ stroke-width:1 }svg.pz-root{width:740px!important;height:300px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="하루 8시간 중 임금은 4시간어치라 잉여가치율은 100%. 같은 잉여 50이라도 기계가 100에서 400으로 늘면 이윤율은 33%에서 11%로 떨어진다." class="pz-inner" height="100%" role="img" style="--minw:681px" viewBox="0 0 740 300" width="100%"><defs><marker id="workday-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="workday-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="workday-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="workday-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="workday-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="workday-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><text class="t-b" x="20" y="26">노동일 8시간</text><rect class="f-ledgersoft s-ledger" height="36" rx="5" width="280" x="60" y="38"></rect><text class="t-s t-b" text-anchor="middle" x="200" y="60.5">필요노동 4시간 = 임금</text><rect class="f-sunsoft s-sun" height="36" rx="4" width="280" x="340" y="38"></rect><text class="t-s t-b" text-anchor="middle" x="480" y="60.5">잉여노동 4시간 = 잉여가치</text><line class="s-mute w1" x1="60" x2="60" y1="74" y2="81"></line><text class="t-xs f-mute" text-anchor="middle" x="60" y="95">0</text><line class="s-mute w1" x1="130" x2="130" y1="74" y2="81"></line><text class="t-xs f-mute" text-anchor="middle" x="130" y="95">1</text><line class="s-mute w1" x1="200" x2="200" y1="74" y2="81"></line><text class="t-xs f-mute" text-anchor="middle" x="200" y="95">2</text><line class="s-mute w1" x1="270" x2="270" y1="74" y2="81"></line><text class="t-xs f-mute" text-anchor="middle" x="270" y="95">3</text><line class="s-mute w1" x1="340" x2="340" y1="74" y2="81"></line><text class="t-xs f-mute" text-anchor="middle" x="340" y="95">4</text><line class="s-mute w1" x1="410" x2="410" y1="74" y2="81"></line><text class="t-xs f-mute" text-anchor="middle" x="410" y="95">5</text><line class="s-mute w1" x1="480" x2="480" y1="74" y2="81"></line><text class="t-xs f-mute" text-anchor="middle" x="480" y="95">6</text><line class="s-mute w1" x1="550" x2="550" y1="74" y2="81"></line><text class="t-xs f-mute" text-anchor="middle" x="550" y="95">7</text><line class="s-mute w1" x1="620" x2="620" y1="74" y2="81"></line><text class="t-xs f-mute" text-anchor="middle" x="620" y="95">8</text><text class="t-b f-sun" text-anchor="end" x="720" y="118">잉여가치율 4 ÷ 4 = 100%</text><line class="s-rule" x1="20" x2="720" y1="134" y2="134"></line><text class="t-b" x="20" y="160">이윤율 = 잉여 s ÷ (기계 c + 임금 v)</text><text class="t-s" x="20" y="196">처음</text><rect class="f-frame s-mute" height="30" rx="5" width="110" x="130" y="176"></rect><text class="t-s" text-anchor="middle" x="185" y="195.5">c 100</text><rect class="f-ledgersoft s-ledger" height="30" rx="5" width="55" x="240" y="176"></rect><text class="t-s" text-anchor="middle" x="267.5" y="195.5">v 50</text><rect class="f-sunsoft s-sun" height="30" rx="5" width="55" x="315" y="176"></rect><text class="t-s" text-anchor="middle" x="342.5" y="195.5">s 50</text><text class="t-b" x="395" y="196">50 ÷ 150 ≈ 33%</text><text class="t-s" x="20" y="250">기계 늘린 뒤</text><rect class="f-frame s-mute" height="30" rx="5" width="440" x="130" y="230"></rect><text class="t-s" text-anchor="middle" x="350" y="249.5">c 400</text><rect class="f-ledgersoft s-ledger" height="30" rx="5" width="55" x="570" y="230"></rect><text class="t-s" text-anchor="middle" x="597.5" y="249.5">v 50</text><rect class="f-sunsoft s-sun" height="30" rx="5" width="55" x="645" y="230"></rect><text class="t-s" text-anchor="middle" x="672.5" y="249.5">s 50</text><text class="t-b" text-anchor="end" x="707" y="288">50 ÷ 450 ≈ 11%</text></svg></g></g></g></g></svg>
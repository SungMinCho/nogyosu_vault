<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 300" width="420" height="300" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.katex svg{fill:currentColor;stroke:currentColor;display:block;height:inherit;position:absolute;width:100%}.katex svg path{stroke:none}.katex svg{fill-rule:nonzero;fill-opacity:1;stroke-width:1;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:4;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1}:root{
  --paper:#F2F3F1; --paper-2:#E6E9E8; --ink:#15181C; --ink-2:#4A535B; --rule:#C3C9CD;
  --c-arrow:#1D5BB5;   
  --c-fun:#C3432A;     
  --c-nat:#15774A;     
  --c-univ:#9A690A;    
  --c-alarm:#8A3A91;   
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-body:"Hahmlet","Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-sign:"Jost","Do Hyeon","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --paper:#101316; --paper-2:#181D21; --ink:#E3E6E8; --ink-2:#9EA7AF; --rule:#2F363C;
    --c-arrow:#6FA3F0; --c-fun:#EE7A5D; --c-nat:#4DC388; --c-univ:#E0AA44; --c-alarm:#C98ED4;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --paper:#101316; --paper-2:#181D21; --ink:#E3E6E8; --ink-2:#9EA7AF; --rule:#2F363C;
  --c-arrow:#6FA3F0; --c-fun:#EE7A5D; --c-nat:#4DC388; --c-univ:#E0AA44; --c-alarm:#C98ED4;
  color-scheme:dark;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:2.2rem 4rem }.lecture{ display:contents }.legend svg{ width:3.2rem; height:1.2rem; overflow:visible }.fig{ margin:0; display:grid; gap:.6rem; padding-block:.4rem }.frame{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  background:
    linear-gradient(to right, var(--paper) 30%, transparent) left center / 2rem 100% no-repeat local,
    linear-gradient(to left, var(--paper) 30%, transparent) right center / 2rem 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.22), transparent) left center / .8rem 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.22), transparent) right center / .8rem 100% no-repeat scroll;
  background-attachment:local,local,scroll,scroll }.frame > svg{ display:block; width:100%; min-width:var(--minw,0px); height:auto; margin-inline:auto; max-width:48rem }.panels{ display:flex; flex-wrap:wrap; justify-content:center; gap:1.1rem 1.8rem; overflow:visible; background:none }.panel{ flex:1 1 calc(var(--pw) * .72px); max-width:calc(var(--pw) * 1.25px); min-width:0; display:grid; gap:.3rem; align-content:start }.panel svg{ display:block; width:100%; height:auto }.fig svg text{ font-family:var(--f-sign); fill:var(--ink) }.fig svg .t{ font-size:15px }.fig svg .t-s{ font-size:13px; fill:var(--ink-2) }.fig svg .t-arrow, .fig svg .t-fun, .fig svg .t-nat, .fig svg .t-univ, .fig svg .t-alarm{ font-size:15px }.fig svg .t-arrow{ fill:var(--c-arrow) }.fig svg .t-fun{ fill:var(--c-fun) }.fig svg .t-alarm{ fill:var(--c-alarm) }.fig svg tspan.t-univ{ fill:var(--c-univ) }.fig svg .i, .fig svg tspan.i{ font-family:KaTeX_Math,"Times New Roman",serif; font-style:italic }.fig svg .num{ font-weight:600; font-variant-numeric:tabular-nums }.fig svg tspan.sub{ font-size:70% }.ln{ fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-width:3px }.ln-arrow{ stroke:var(--c-arrow) }.ln-fun{ stroke:var(--c-fun) }.ln-alarm{ stroke:var(--c-alarm) }.dash{ stroke-dasharray:7 6 }.mk-arrow{ fill:var(--c-arrow) }.mk-fun{ fill:var(--c-fun) }.mk-nat{ fill:var(--c-nat) }.mk-univ{ fill:var(--c-univ) }.mk-alarm{ fill:var(--c-alarm) }.mk-ink{ fill:var(--ink) }.mk-mute{ fill:var(--ink-2) }.st{ fill:var(--paper); stroke:var(--ink); stroke-width:3.5px }.mini svg{ width:100%; height:auto; display:block }svg.pz-root{width:420px!important;height:300px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame panels"><g class="pz-w panel"><svg aria-label="위: 원을 원판에 넣었다 수축 r로 되돌리면 항등. 아래: 함자 π₁로 옮기면 정수에서 자명군을 지나 정수로 오는데 1이 0이 되어 항등이 될 수 없다" class="pz-inner" height="100%" role="img" viewBox="0 0 420 300" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="brouwer-b-m-arrow" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-arrow" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="brouwer-b-m-fun" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-fun" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="brouwer-b-m-nat" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-nat" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="brouwer-b-m-univ" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-univ" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="brouwer-b-m-alarm" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-alarm" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="brouwer-b-m-ink" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-ink" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="brouwer-b-m-mute" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-mute" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><path class="ln ln-arrow" d="M67.0,76.0 L193.0,76.0" marker-end="url(#brouwer-b-m-arrow)" style="stroke-width:4px"></path><text class="t-arrow i" text-anchor="middle" x="130.0" y="66.0">i</text><path class="ln ln-arrow" d="M227.0,76.0 L353.0,76.0" marker-end="url(#brouwer-b-m-arrow)" style="stroke-width:4px"></path><text class="t-arrow i" text-anchor="middle" x="290.0" y="66.0">r</text><path class="ln ln-arrow" d="M65.1,68.2 Q210.0,-6.0 354.9,68.2" marker-end="url(#brouwer-b-m-arrow)" style="stroke-width:2px"></path><text class="t-s" text-anchor="middle" x="210.0" y="20.0">1 (항등)</text><circle class="st" cx="50.0" cy="76.0" r="14"></circle><text class="t i" text-anchor="middle" x="50.0" y="112.0">S¹</text><circle class="st" cx="210.0" cy="76.0" r="14"></circle><text class="t i" text-anchor="middle" x="210.0" y="112.0">D²</text><circle class="st" cx="370.0" cy="76.0" r="14"></circle><text class="t i" text-anchor="middle" x="370.0" y="112.0">S¹</text><path class="ln ln-fun" d="M210.0,124.0 L210.0,182.0" marker-end="url(#brouwer-b-m-fun)" style="stroke-width:4px"></path><text class="t-fun i" text-anchor="start" x="222.0" y="152.0">π₁</text><path class="ln ln-arrow" d="M67.0,216.0 L193.0,216.0" marker-end="url(#brouwer-b-m-arrow)" style="stroke-width:4px"></path><text class="t-arrow i" text-anchor="middle" x="130.0" y="206.0">π₁(i)</text><path class="ln ln-arrow" d="M227.0,216.0 L353.0,216.0" marker-end="url(#brouwer-b-m-arrow)" style="stroke-width:4px"></path><text class="t-arrow i" text-anchor="middle" x="290.0" y="206.0">π₁(r)</text><circle class="st" cx="50.0" cy="216.0" r="14"></circle><text class="t num" text-anchor="middle" x="50.0" y="221.0">ℤ</text><circle class="st" cx="210.0" cy="216.0" r="14"></circle><text class="t num" text-anchor="middle" x="210.0" y="221.0">0</text><circle class="st" cx="370.0" cy="216.0" r="14"></circle><text class="t num" text-anchor="middle" x="370.0" y="221.0">ℤ</text><path class="ln ln-alarm dash" d="M58,232 Q120,276 196,272" style="stroke-width:2px"></path><path class="ln ln-alarm dash" d="M224,272 Q300,276 362,232" style="stroke-width:2px"></path><text class="t-alarm" text-anchor="middle" x="210.0" y="278.0">✕</text><text class="t-alarm num" text-anchor="middle" x="210.0" y="296.0">1 ↦ 0 ↦ 0 ≠ 1</text></svg></g></g></g></g></g></svg>
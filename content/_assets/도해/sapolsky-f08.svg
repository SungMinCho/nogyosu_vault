<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 324" width="760" height="324" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#F1F3F1; --sheet:#FAFBF9; --ink:#1B2124; --ink-2:#3A4549; --mute:#5E6B71;
  --grid:#C9D4D1; --grid-2:#E1E8E5; --rule:#B6C2C0;
  --neuro:#3546A8; --soma:#8F5508; --life:#256B41; --deep:#8A4429; --alarm:#B01E4C;
  --neuro-w:color-mix(in srgb, var(--neuro) 13%, var(--sheet));
  --soma-w:color-mix(in srgb, var(--soma) 14%, var(--sheet));
  --life-w:color-mix(in srgb, var(--life) 13%, var(--sheet));
  --deep-w:color-mix(in srgb, var(--deep) 13%, var(--sheet));
  --alarm-w:color-mix(in srgb, var(--alarm) 11%, var(--sheet));
  --ink-w:color-mix(in srgb, var(--ink) 8%, var(--sheet));
  --shadow:color-mix(in srgb, var(--ink) 16%, transparent);
  --f-display:"Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body:"Literata", "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --f-label:"Sofia Sans Condensed", "Gothic A1", "Arial Narrow", sans-serif;
  --f-mono:"DM Mono", "Nanum Gothic Coding", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-fig:"Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111517; --sheet:#181D20; --ink:#E2E8E7; --ink-2:#C2CBCB; --mute:#93A0A4;
  --grid:#2E3A3D; --grid-2:#1D2629; --rule:#3A4746;
  --neuro:#9AA8FF; --soma:#E5A64A; --life:#6CC895; --deep:#E39A74; --alarm:#FF7AA0;
  --shadow:rgba(0,0,0,.5); color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#111517; --sheet:#181D20; --ink:#E2E8E7; --ink-2:#C2CBCB; --mute:#93A0A4;
  --grid:#2E3A3D; --grid-2:#1D2629; --rule:#3A4746;
  --neuro:#9AA8FF; --soma:#E5A64A; --life:#6CC895; --deep:#E39A74; --alarm:#FF7AA0;
  --shadow:rgba(0,0,0,.5); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); }.hero svg{ display:block; width:100%; height:auto }figure.fig{ margin:1rem 0; }.fig-frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background-color:var(--sheet);
  background-image:linear-gradient(to right, var(--sheet) 30%, transparent), linear-gradient(to left, var(--sheet) 30%, transparent),
    radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2rem 100%, 2rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; min-width:var(--figmin, 34rem); height:auto; }svg text{ font-family:var(--f-fig); font-size:12px; fill:var(--ink) }svg .t-2{ fill:var(--ink-2) }svg .t-m{ fill:var(--mute) }svg .t-s{ font-size:10.5px }svg .t-b{ font-weight:700 }svg .t-num{ font-family:var(--f-mono); font-variant-numeric:tabular-nums }svg .t-neuro{ fill:var(--neuro) }svg .t-alarm{ fill:var(--alarm) }svg .halo{ paint-order:stroke; stroke:var(--sheet); stroke-width:3.5px; stroke-linejoin:round }svg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }svg .ln-m{ stroke:var(--mute); stroke-width:1; fill:none }svg .ln-neuro{ stroke:var(--neuro); stroke-width:1.8; fill:none }svg .ln-alarm{ stroke:var(--alarm); stroke-width:1.8; fill:none }svg .w-thin{ stroke-width:1 }svg .w-thick{ stroke-width:2.8 }svg .dash{ stroke-dasharray:5 4 }svg .dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }svg .f-paper{ fill:var(--sheet) }svg .f-neuro{ fill:var(--neuro) }svg .f-alarm{ fill:var(--alarm) }section.lecture-wrap{ content-visibility:auto; contain-intrinsic-size:auto 60000px }svg.pz-root{width:760px!important;height:324px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc lecture-wrap"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="성인 신경발생 논쟁 1962~2025 — 위의 '있다' 줄에는 1962년 올트먼 첫 보고, 1965년 올트먼·다스, 1970년대 말 캐플런, 1983년 노테봄 카나리아, 1990년대 굴드·게이지의 쥐, 1998년 에릭손·게이지의 사람 사후 뇌, 1999년 원숭이, 2013년 스폴딩의 하루 700개가, 아래 '없다' 줄에는 라키치의 '뉴헤이븐에서는 아니오', 2001년 원숭이 피질 반박, 2006년 사람 신피질 없음이 놓인다. 2017년 책이 '모두 증명되었다'고 쓴 자리에 세로선이 있고, 그 바로 뒤 2018년 소렐스가 아래 줄에, 볼드리니가 위 줄에 찍히며 2019년 모레노-히메네스와 2025년 두미트루가 이어진다" class="pz-inner" height="100%" role="img" viewBox="0 0 760 324" width="100%" xmlns="http://www.w3.org/2000/svg">
<!-- 2017 세로선 -->
<path class="ln w-thick dash" d="M498.9,48 L498.9,300"></path>
<text class="t-s t-b" text-anchor="middle" x="498.9" y="28">2017 책 출간</text>
<text class="t-s t-2" text-anchor="middle" x="498.9" y="42">'모두 증명되었다'</text>
<!-- 줄 이름 -->
<text class="t-b t-neuro" x="16" y="134">있다</text>
<text class="t-b t-alarm" x="16" y="234">없다</text>
<path class="ln-neuro w-thin" d="M60,130 L568,130"></path>
<path class="ln-alarm w-thin" d="M60,230 L568,230"></path>
<!-- '있다' 줄 -->
<rect class="f-neuro" height="6" width="69" x="291" y="127"></rect>
<text class="t-s t-neuro" x="304" y="112">1990년대 굴드·게이지 쥐</text>
<circle class="f-neuro" cx="75.4" cy="130" r="4"></circle>
<path class="ln-neuro w-thin" d="M75.4,126 L75.4,116"></path>
<text class="t-s t-neuro t-b" x="75.4" y="112">1962 올트먼 첫 보고</text>
<circle class="f-neuro" cx="98.5" cy="130" r="4"></circle>
<path class="ln-neuro w-thin" d="M98.5,134 L98.5,140"></path>
<text class="t-s t-neuro" x="98.5" y="151">1965 올트먼·다스</text>
<circle class="f-neuro" cx="198.6" cy="130" r="4"></circle>
<path class="ln-neuro w-thin" d="M198.6,126 L198.6,116"></path>
<text class="t-s t-neuro" x="198.6" y="112">1970년대 말 캐플런</text>
<circle class="f-neuro" cx="237.1" cy="130" r="4"></circle>
<path class="ln-neuro w-thin" d="M237.1,134 L237.1,140"></path>
<text class="t-s t-neuro" x="237.1" y="151">1983 노테봄 카나리아</text>
<circle class="f-neuro" cx="352.6" cy="130" r="4"></circle>
<path class="ln-neuro w-thin" d="M352.6,134 L352.6,158"></path>
<text class="t-s t-neuro" x="352.6" y="169">1998 에릭손·게이지, 사람</text>
<circle class="f-neuro" cx="360.3" cy="130" r="4"></circle>
<path class="ln-neuro w-thin" d="M360.3,134 L360.3,140"></path>
<text class="t-s t-neuro halo" x="364" y="151">1999 원숭이 · 라키치 연구실</text>
<circle class="f-neuro" cx="468.1" cy="130" r="4"></circle>
<path class="ln-neuro w-thin" d="M468.1,126 L468.1,90 L464,90"></path>
<text class="t-s t-neuro" text-anchor="end" x="460" y="94">2013 스폴딩 · 하루 700개</text>
<circle class="f-neuro" cx="506.6" cy="130" r="4"></circle>
<path class="ln-neuro w-thin" d="M506.6,126 L506.6,62 L580,62"></path>
<text class="t-s t-neuro t-b" x="584" y="66">2018 볼드리니</text>
<text class="t-s t-m" x="584" y="80">14~79세 미성숙 뉴런</text>
<circle class="f-neuro" cx="514.3" cy="130" r="4"></circle>
<path class="ln-neuro w-thin" d="M514.3,126 L514.3,98 L580,98"></path>
<text class="t-s t-neuro t-b" x="584" y="102">2019 모레노-히메네스</text>
<text class="t-s t-m" x="584" y="116">80대까지 · 처리법 논쟁</text>
<circle class="f-neuro" cx="560.5" cy="130" r="4"></circle>
<text class="t-s t-neuro t-b" x="584" y="134">2025 두미트루</text>
<text class="t-s t-m" x="584" y="148">증식 중인 전구세포</text>
<!-- '없다' 줄 -->
<path class="ln-alarm w-thin dot" d="M198.6,136 L198.6,224"></path>
<circle class="f-paper ln-alarm" cx="198.6" cy="230" r="4"></circle>
<path class="ln-alarm w-thin" d="M198.6,234 L198.6,240"></path>
<text class="t-s t-alarm" x="198.6" y="251">라키치 '뉴헤이븐에서는 아니오'</text>
<circle class="f-alarm" cx="375.7" cy="230" r="4"></circle>
<path class="ln-alarm w-thin" d="M375.7,234 L375.7,258"></path>
<text class="t-s t-alarm" x="375.7" y="269">2001 원숭이 피질 반박</text>
<circle class="f-alarm" cx="414.2" cy="230" r="4"></circle>
<path class="ln-alarm w-thin" d="M414.2,234 L414.2,240"></path>
<text class="t-s t-alarm halo" x="414.2" y="251">2006 사람 신피질 없음</text>
<circle class="f-alarm" cx="506.6" cy="230" r="4"></circle>
<text class="t-s t-alarm t-b" x="584" y="234">2018 소렐스</text>
<text class="t-s t-m" x="584" y="248">성인 조직에서 검출 안 됨</text>
<!-- 시간축 -->
<path class="ln-m" d="M60,300 L568,300"></path>
<path class="ln-m" d="M60,300 L60,305 M137,300 L137,305 M214,300 L214,305 M291,300 L291,305 M368,300 L368,305 M445,300 L445,305 M522,300 L522,305"></path>
<text class="t-s t-m t-num" text-anchor="middle" x="60" y="318">1960</text>
<text class="t-s t-m t-num" text-anchor="middle" x="137" y="318">1970</text>
<text class="t-s t-m t-num" text-anchor="middle" x="214" y="318">1980</text>
<text class="t-s t-m t-num" text-anchor="middle" x="291" y="318">1990</text>
<text class="t-s t-m t-num" text-anchor="middle" x="368" y="318">2000</text>
<text class="t-s t-m t-num" text-anchor="middle" x="445" y="318">2010</text>
<text class="t-s t-m t-num" text-anchor="middle" x="522" y="318">2020</text>
</svg></g></g></g></svg>
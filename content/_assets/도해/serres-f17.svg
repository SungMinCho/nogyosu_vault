2" x2="112" y1="92" y2="352"></line><line class="s-ink2 w1 f-none" x1="106" x2="118" y1="92" y2="92"></line><line class="s-ink2 w1 f-none" x1="106" x2="118" y1="352" y2="352"></line><text class="t" text-anchor="end" x="104" y="214">스무 걸음</text><text class="ts" text-anchor="end" x="104" y="231">≈ 13–16 m</text><line class="s-cold w2 f-none" marker-end="url(#F19-ar-cold)" x1="142" x2="142" y1="108" y2="340"></line><line class="s-caution w15 dash f-none" marker-end="url(#F19-ar-caution)" x1="160" x2="160" y1="340" y2="110"></line><line class="s-caution w2 f-none" x1="153" x2="167" y1="218" y2="232"></line><line class="s-caution w2 f-none" x1="167" x2="153" y1="218" y2="232"></line><text class="ts c-cold" text-anchor="start" x="184" y="160">물살 ≈ 0.5 m/s</text><text class="ts c-cold" text-anchor="start" x="184" y="176">흐린 물 → 약 30초 뒤 도착</text><text class="ts c-caution" text-anchor="start" x="184" y="264">거슬러 오름 = 0</text><text class="ts c-caution" text-anchor="start" x="184" y="280">영원히 닿지 않는다</text><line class="s-rule w1 dot f-none" x1="338" x2="338" y1="20" y2="392"></line><text class="tb c-fire" text-anchor="middle" x="625" y="28">늑대의 판 — 질 때마다 집합을 키운다</text><text class="ts" text-anchor="middle" x="625" y="46">① 7–9행 · ② 18–19행 · ③ 22행 · ④ 23–26행 (늑대의 발화)</text><ellipse class="s-fire f-deep w15" cx="625" cy="222" rx="262" ry="154"></ellipse><ellipse class="s-fire f-deep w15" cx="625" cy="222" rx="214" ry="124"></ellipse><ellipse class="s-fire f-deep w15" cx="625" cy="222" rx="166" ry="94"></ellipse><ellipse class="s-fire f-deep w15" cx="625" cy="222" rx="118" ry="64"></ellipse><ellipse class="s-fire f-deep w15" cx="625" cy="222" rx="70" ry="34"></ellipse><ellipse class="s-fire f-fire-t w15" cx="625" cy="222" rx="70" ry="34"></ellipse><text class="t c-fire" text-anchor="middle" x="625" y="217">① 너 · 지금 여기</text><text class="ts c-caution" text-anchor="middle" x="625" y="239">↩ 흐름의 순서</text><text class="t c-fire" text-anchor="middle" x="625" y="178">② 너 · 작년</text><text class="ts c-caution" text-anchor="middle" x="625" y="275">↩ 출생의 순서</text><text class="t c-fire" text-anchor="middle" x="625" y="148">③ 네 형</text><text class="ts c-caution" text-anchor="middle" x="625" y="305">↩ 혈통의 순서</text><text class="t c-fire" text-anchor="middle" x="625" y="118">④ 네 족속</text><text class="ts c-caution" text-anchor="middle" x="625" y="335">— 반박이 없다</text><text class="t c-fire" text-anchor="middle" x="625" y="88">④ 너희 · 목동 · 개</text><text class="ts c-cold" text-anchor="middle" x="625" y="365">근거: '남들이 그러더라'</text><line class="s-fire w2 f-none" marker-end="url(#F19-ar-fire)" x1="699" x2="883" y1="222" y2="222"></line><text class="ts c-fire halo" text-anchor="middle" x="791" y="215">판을 넓힌다</text><line class="s-fire w15 f-none" marker-end="url(#F19-ar-fire)" x1="625" x2="625" y1="378" y2="392"></line><text class="t c-fire" text-anchor="middle" x="625" y="410">27–29행 · 숲속으로 끌고 가 먹는다</text><text class="t tl" text-anchor="middle" x="625" y="430">« Sans autre forme de procès »</text><text class="ts c-caution" text-anchor="start" x="20" y="414">어린양의 말: 8행 → 2행 → 4단어 → 없음</text><text class="ts" text-anchor="start" x="20" y="431">반박마다 순서 하나 — 흐름 · 출생 · 혈통</text></svg></g></g></g></g></svg>
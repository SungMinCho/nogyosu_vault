<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 680 466" width="680" height="466" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#F1F3F1; --sheet:#FAFBF9; --ink:#1B2124; --ink-2:#3A4549; --mute:#5E6B71;
  --grid:#C9D4D1; --grid-2:#E1E8E5; --rule:#B6C2C0;
  --neuro:#3546A8; --soma:#8F5508; --life:#256B41; --deep:#8A4429; --alarm:#B01E4C;
  --neuro-w:color-mix(in srgb, var(--neuro) 13%, var(--sheet));
  --soma-w:color-mix(in srgb, var(--soma) 14%, var(--sheet));
  --life-w:color-mix(in srgb, var(--life) 13%, var(--sheet));
  --deep-w:color-mix(in srgb, var(--deep) 13%, var(--sheet));
  --alarm-w:color-mix(in srgb, var(--alarm) 11%, var(--sheet));
  --ink-w:color-mix(in srgb, var(--ink) 8%, var(--sheet));
  --shadow:color-mix(in srgb, var(--ink) 16%, transparent);
  --f-display:"Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body:"Literata", "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --f-label:"Sofia Sans Condensed", "Gothic A1", "Arial Narrow", sans-serif;
  --f-mono:"DM Mono", "Nanum Gothic Coding", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-fig:"Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111517; --sheet:#181D20; --ink:#E2E8E7; --ink-2:#C2CBCB; --mute:#93A0A4;
  --grid:#2E3A3D; --grid-2:#1D2629; --rule:#3A4746;
  --neuro:#9AA8FF; --soma:#E5A64A; --life:#6CC895; --deep:#E39A74; --alarm:#FF7AA0;
  --shadow:rgba(0,0,0,.5); color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#111517; --sheet:#181D20; --ink:#E2E8E7; --ink-2:#C2CBCB; --mute:#93A0A4;
  --grid:#2E3A3D; --grid-2:#1D2629; --rule:#3A4746;
  --neuro:#9AA8FF; --soma:#E5A64A; --life:#6CC895; --deep:#E39A74; --alarm:#FF7AA0;
  --shadow:rgba(0,0,0,.5); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); }.hero svg{ display:block; width:100%; height:auto }figure.fig{ margin:1rem 0; }.fig-frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background-color:var(--sheet);
  background-image:linear-gradient(to right, var(--sheet) 30%, transparent), linear-gradient(to left, var(--sheet) 30%, transparent),
    radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2rem 100%, 2rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; min-width:var(--figmin, 34rem); height:auto; }svg text{ font-family:var(--f-fig); font-size:12px; fill:var(--ink) }svg .t-2{ fill:var(--ink-2) }svg .t-m{ fill:var(--mute) }svg .t-s{ font-size:10.5px }svg .t-l{ font-size:14px }svg .t-b{ font-weight:700 }svg .t-deep{ fill:var(--deep) }svg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }svg .ln-m{ stroke:var(--mute); stroke-width:1; fill:none }svg .ln-deep{ stroke:var(--deep); stroke-width:1.8; fill:none }svg .w-thick{ stroke-width:2.8 }svg .dash{ stroke-dasharray:5 4 }svg .f-ink{ fill:var(--ink) }svg .f-deep{ fill:var(--deep) }section.lecture-wrap{ content-visibility:auto; contain-intrinsic-size:auto 60000px }svg.pz-root{width:680px!important;height:466px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc lecture-wrap"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="쌍결합 종과 토너먼트 종을 가르는 여덟 특징 — 수컷 부모 행동, 까다로움, 번식 성공 분산, 고환, 수컷 간 공격성, 이형성, 암컷의 선택, 오쟁이율 — 이 수컷 번식 성공의 쏠림 하나에서 갈리고, 인간은 그 사이 약간 토너먼트 쪽에 떠 있다." class="pz-inner" height="100%" role="img" viewBox="0 0 680 466" width="100%" xmlns="http://www.w3.org/2000/svg">

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 290" width="760" height="290" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-spike{ fill:var(--spike) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-spike{ stroke:var(--spike) }.dg .dash{ stroke-dasharray:4 3 }.dg .f-ink{ fill:var(--ink) }.dg .f-rot-s{ fill:var(--rot-soft); stroke:var(--rot); stroke-width:1 }.dg .ln-ink{ stroke:var(--ink) }.lecture > .frame{ max-width:var(--wide) }.dg .f-grid-s{ fill:var(--grid-soft); stroke:var(--grid); stroke-width:1 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="정답 확률 0.5, 0.25, 0.5, 0.125를 음의 로그로 바꾼 놀람 0.693, 1.386, 0.693, 2.079의 평균 1.213을 지수로 올리면 perplexity 3.36" class="dg" height="100%" role="img" style="" viewBox="0 0 760 290" width="100%"><defs><marker id="m4-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-s t-b" text-anchor="start" x="40" y="34">정답 토큰에 준 확률 p</text><line class="ln" x1="40" x2="290" y1="220" y2="220"></line><rect class="f-rot-s" height="150" rx="0" width="34" x="60" y="70"></rect><text class="t-s t-mono" text-anchor="middle" x="77" y="64">0.5</text><text class="t-s t-mut" text-anchor="middle" x="77" y="236">토큰 1</text><rect class="f-rot-s" height="75" rx="0" width="34" x="118" y="145"></rect><text class="t-s t-mono" text-anchor="middle" x="135" y="139">0.25</text><text class="t-s t-mut" text-anchor="middle" x="135" y="236">토큰 2</text><rect class="f-rot-s" height="150" rx="0" width="34" x="176" y="70"></rect><text class="t-s t-mono" text-anchor="middle" x="193" y="64">0.5</text><text class="t-s t-mut" text-anchor="middle" x="193" y="236">토큰 3</text><rect class="f-rot-s" height="37.5" rx="0" width="34" x="234" y="182.5"></rect><text class="t-s t-mono" text-anchor="middle" x="251" y="176.5">0.125</text><text class="t-s t-mut" text-anchor="middle" x="251" y="236">토큰 4</text><path class="ln ln-ink" d="M300,160 L350,160" marker-end="url(#m4-ink)"></path><text class="t-s t-b t-mono" text-anchor="middle" x="325" y="150">−ln p</text><text class="t-s t-b" text-anchor="start" x="370" y="34">놀람 −ln p</text><line class="ln" x1="370" x2="620" y1="220" y2="220"></line><rect class="f-grid-s" height="51.986" rx="0" width="34" x="390" y="168.014"></rect><text class="t-s t-mono" text-anchor="middle" x="407" y="162.014">0.693</text><text class="t-s t-mut" text-anchor="middle" x="407" y="236">토큰 1</text><rect class="f-grid-s" height="103.972" rx="0" width="34" x="448" y="116.028"></rect><text class="t-s t-mono" text-anchor="middle" x="465" y="110.028">1.386</text><text class="t-s t-mut" text-anchor="middle" x="465" y="236">토큰 2</text><rect class="f-grid-s" height="51.986" rx="0" width="34" x="506" y="168.014"></rect><text class="t-s t-mono" text-anchor="middle" x="523" y="162.014">0.693</text><text class="t-s t-mut" text-anchor="middle" x="523" y="236">토큰 3</text><rect class="f-grid-s" height="155.958" rx="0" width="34" x="564" y="64.0419"></rect><text class="t-s t-mono" text-anchor="middle" x="581" y="58.0419">2.079</text><text class="t-s t-mut" text-anchor="middle" x="581" y="236">토큰 4</text><line class="ln ln-spike dash" x1="370" x2="620" y1="129.024" y2="129.024"></line><text class="t-s t-b t-spike" text-anchor="start" x="624" y="133.024">평균 1.213</text><text class="t-s t-mono" text-anchor="start" x="624" y="153.024">exp(1.213)</text><text class="t-s t-b t-spike" text-anchor="start" x="624" y="171.024">≈ 3.36 = PPL</text><text class="t-s t-mut" text-anchor="middle" x="380" y="270">확률이 모두 × 0.9가 되면 놀람마다 +0.105, PPL은 × 1.11 → 3.74</text></svg></svg>
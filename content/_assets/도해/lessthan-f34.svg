<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 510" width="880" height="510" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#ECEAF0; --panel:#F7F6F9; --ink:#1D1A26; --muted:#5B5668; --rule:#C9C5D2; --rule-2:#DCD9E2;
  --red:#B42318;   --red-fill:#F3D3CE;
  --flesh:#995532; --flesh-fill:#ECCFBC;
  --cob:#2B4A9B;   --cob-fill:#D3DBF1;
  --verd:#1F6F62;  --verd-fill:#CDE7E1;
  --void:#17141F;  --on-void:#F2EEF7;
  --display-ko:"Hahmlet","Noto Serif KR","Noto Serif CJK KR",serif;
  --body:"Noto Serif KR","Noto Serif CJK KR","Apple SD Gothic Neo",serif;
  --display-la:"GFS Didot","Didot","Bodoni 72","Noto Serif",serif;
  --sans:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Red Hat Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }svg.fig{display:block;width:100%;height:auto;font-family:var(--sans);overflow:visible}svg.fig text{font-family:var(--sans);font-size:14px;fill:var(--ink)}svg.fig .t-s{font-size:12px}svg.fig .t-l{font-size:17px}svg.fig .t-b{font-weight:700}svg.fig .t-mid{text-anchor:middle}svg.fig .t-end{text-anchor:end}svg.fig .t-muted{fill:var(--muted)}svg.fig .f-ink{fill:var(--ink)}svg.fig .f-rule2{fill:var(--rule-2)}svg.fig .f-red{fill:var(--red)}svg.fig .f-cob{fill:var(--cob)}svg.fig .f-cobf{fill:var(--cob-fill)}svg.fig .f-none{fill:none}svg.fig .s-ink{stroke:var(--ink)}svg.fig .s-rule{stroke:var(--rule)}svg.fig .s-red{stroke:var(--red)}svg.fig .s-cob{stroke:var(--cob)}svg.fig .w1{stroke-width:1px}svg.fig .w15{stroke-width:1.5px}svg.fig .w2{stroke-width:2px}svg.fig .w3{stroke-width:3px}svg.fig .dash{stroke-dasharray:6 5}svg.fig .round{stroke-linecap:round;stroke-linejoin:round}:root{ --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2); }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{max-width:560px;margin-inline:auto}.doc{padding-inline:var(--pad)}.lecture{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-block:2.5rem 3rem;
  content-visibility:auto;border-top:1px solid var(--rule)}.fig-wrap{margin:.8rem 0 !important}.fig-scroll{overflow-x:auto;background:
  linear-gradient(to right,var(--panel) 30%,transparent) left center/2.2rem 100% no-repeat local,
  linear-gradient(to left,var(--panel) 30%,transparent) right center/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) left center/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) right center/.8rem 100% no-repeat scroll,
  var(--panel);padding:1rem .9rem .6rem}.fig-inner{width:100%}svg.pz-root{width:880px!important;height:510px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig-wrap"><g class="pz-w fig-scroll"><g class="pz-w fig-inner"><svg xmlns="http://www.w3.org/2000/svg" aria-label="같은 긍정문 '물질적 실재가 존재하는 전부다'를 술어 부정으로 부정하면 바깥에 더 높은 실재라는 예외가 서서 전체를 닫고, 비술어 긍정으로 부정하면 예외 없이 안쪽에 금이 남는다 — 같은 갈림이 부정판단과 무한판단의 짝들로 되풀이된다." class="fig pz-inner" height="100%" role="img" viewBox="0 0 880 510" width="100%">
<defs>
<marker id="L12-1-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="L12-1-ar-cob" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-cob" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 뿌리 -->
<rect class="f-rule2 s-ink w15" height="40" rx="4" width="340" x="270" y="18"></rect>
<text class="t-mid t-l t-b" x="440" y="44">물질적 실재가 존재하는 전부다</text>
<line class="s-ink w2" marker-end="url(#L12-1-ar-ink)" x1="380" x2="244" y1="58" y2="126"></line>
<line class="s-ink w2" marker-end="url(#L12-1-ar-ink)" x1="500" x2="636" y1="58" y2="126"></line>
<text class="t-end t-s t-b" x="258" y="112">술어를 부정</text>
<text class="t-s t-b" x="622" y="112">비술어를 긍정</text>
<!-- 가지 1: 전부가 아니다 -->
<text class="t-mid t-b" x="230" y="152">물질적 실재는 전부가 아니다</text>
<circle class="f-cobf s-cob w2" cx="230" cy="186" r="9"></circle>
<text class="t-s t-b f-cob" x="248" y="191">예외 — 더 높은 정신적 실재</text>
<line class="s-cob w2" marker-end="url(#L12-1-ar-cob)" x1="230" x2="230" y1="197" y2="234"></line>
<text class="t-s f-cob" x="242" y="222">전체를 닫는다</text>
<circle class="f-rule2 s-ink w2" cx="230" cy="282" r="44"></circle>
<text class="t-mid t-s" x="230" y="287">물질 = 전부</text>
<path class="f-none s-cob w15 dash" d="M219,186 C40,184 40,38 266,38" marker-end="url(#L12-1-ar-cob)"></path>
<text class="t-mid t-s f-cob" x="44" y="90">구성적 예외</text>
<text class="t-mid t-s f-cob" x="44" y="106">긍정 안에</text>
<text class="t-mid t-s f-cob" x="44" y="122">이미 있다</text>
<text class="t-mid t-s t-muted" x="230" y="350">예외가 전체를 닫는다 — 남성 쪽</text>
<!-- 가지 2: 비전체다 -->
<text class="t-mid t-b" x="650" y="152">물질적 실재는 비전체다</text>
<text class="t-mid t-s t-muted" x="650" y="191">바깥에 아무것도 없다</text>
<circle class="f-rule2 s-ink w2" cx="650" cy="282" r="44"></circle>
<text class="t-mid t-s" x="624" y="287">물질</text>
<polyline class="f-none s-red w3 round" points="664,250 656,266 670,280 658,296 666,312"></polyline>
<text class="t-s t-b f-red" x="706" y="287">예외 없이 안쪽에 금</text>
<text class="t-mid t-s t-muted" x="650" y="350">예외 없이 닫히지 않는다 — 여성 쪽</text>
<!-- 아래층: 부정판단 / 무한판단 -->
<line class="s-rule w1" x1="40" x2="840" y1="372" y2="372"></line>
<text class="t-mid t-b" x="230" y="400">부정판단 — 술어를 부정</text>
<text class="t-mid t-b" x="650" y="400">무한판단 — 비술어를 긍정</text>
<text class="t-mid" x="230" y="432">여자는 남자가 아니다</text>
<text class="t-mid t-muted" x="440" y="432">≠</text>
<text class="t-mid" x="650" y="432">여자는 비-남자다</text>
<text class="t-mid" x="230" y="462">그는 죽지 않았다</text>
<text class="t-mid t-muted" x="440" y="462">≠</text>
<text class="t-mid" x="650" y="462">그는 언데드다</text>
<text class="t-mid" x="230" y="492">관계가 없다</text>
<text class="t-mid t-muted" x="440" y="492">≠</text>
<text class="t-mid" x="650" y="492">비-관계가 있다</text>
</svg></g></g></g></g></g></svg>
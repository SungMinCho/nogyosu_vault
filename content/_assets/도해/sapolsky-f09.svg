<path class="ln-alarm dash" d="M469,344 L515,344"></path>
<circle class="f-paper ln-alarm" cx="520" cy="344" r="4.5"></circle>
<text class="t-s t-alarm t-b" x="530" y="348">25 = 연장선</text>
<text class="t-s" x="16" y="372">백질 부피 정점</text>
<circle class="f-life" cx="576" cy="368" r="4.5"></circle>
<text class="t-s" text-anchor="end" x="568" y="372">베들레헴 2022 · 약 29</text>

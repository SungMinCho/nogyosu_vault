<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 740 330" width="740" height="330" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-frame{ fill:var(--paper-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-sunsoft{ fill:var(--sun-soft) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-ledgersoft{ fill:var(--ledger-soft) }.fig .f-blood{ fill:var(--blood) }.fig .s-mute{ stroke:var(--ink-2) }.fig .s-rule{ stroke:var(--rule) }.fig .s-sun{ stroke:var(--sun) }.fig .s-ledger{ stroke:var(--ledger) }.fig .s-blood{ stroke:var(--blood) }.fig .w15{ stroke-width:1.5 }.fig .w2{ stroke-width:2 }.fig .w3{ stroke-width:3 }.fig .dash{ stroke-dasharray:5 4 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="보통은 법이 먼저고 위반이 나중이다. 바타유에게는 넘침이 먼저고, 금지는 그 넘침에 대한 둑, 위반은 둑을 넘어 정해진 길로 빠지는 흐름이다." height="100%" role="img" style="--minw:681px" viewBox="0 0 740 330" width="100%"><defs><marker id="dam-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="dam-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="dam-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="dam-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="dam-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="dam-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><text class="t-b f-mute" x="20" y="26">통념의 순서</text><rect class="f-frame s-mute" height="34" rx="5" width="120" x="20" y="38"></rect><text class="t-s" text-anchor="middle" x="80" y="59.5">법</text><rect class="f-frame s-mute" height="34" rx="5" width="120" x="180" y="38"></rect><text class="t-s" text-anchor="middle" x="240" y="59.5">위반 · 범죄</text><line class="s-mute" marker-end="url(#dam-mute)" x1="142" x2="176" y1="55" y2="55"></line><rect class="f-frame s-mute" height="34" rx="5" width="120" x="340" y="38"></rect><text class="t-s" text-anchor="middle" x="400" y="59.5">처벌</text><line class="s-mute" marker-end="url(#dam-mute)" x1="302" x2="336" y1="55" y2="55"></line><text class="t-s f-mute" x="500" y="60">법이 먼저, 위반은 나중</text><line class="s-rule" x1="20" x2="720" y1="94" y2="94"></line><text class="t-b" x="20" y="122">바타유 · 랜드의 순서</text><line class="s-mute" x1="20" x2="720" y1="300" y2="300"></line><rect class="f-sunsoft" height="130" rx="0" width="310" x="20" y="170"></rect><line class="s-sun w2" x1="20" x2="330" y1="170" y2="170"></line><text class="t-s t-b f-sun" x="36" y="202">① 넘침 — 반드시 써 버려질 잉여</text><text class="t-s f-mute" x="36" y="221">1강의 그 잉여</text><rect class="f-ledgersoft s-ledger w2" height="150" rx="2" width="24" x="330" y="150"></rect><text class="t-s t-b f-ledger" text-anchor="middle" x="342" y="320">② 금지 = 둑 · 넘침에 대한 응답</text><path class="s-blood w3" d="M300,168 C326,126 372,126 392,176 L428,292" marker-end="url(#dam-blood)"></path><text class="t-s t-b f-blood" x="440" y="176">③ 위반 — 둑을 넘는 흐름</text><text class="t-s f-mute" x="440" y="194">규칙에 따른 위반</text><text class="t-s f-mute" x="440" y="211">축제 · 제사 · 에로티시즘</text><path class="s-ledger dash w15" d="M446,296 C760,300 700,96 364,146" marker-end="url(#dam-ledger)"></path><text class="t-s f-ledger" text-anchor="middle" x="560" y="106">④ 위반 뒤 금기는 더 신성해진다</text></svg></svg>
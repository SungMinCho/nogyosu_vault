}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .f-ink{ fill:var(--ink) }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .k-a{ fill:var(--rot) }.dg .k-b{ fill:var(--grid) }.dg .k-c{ fill:var(--pos) }.dg .k-d{ fill:var(--spike) }.dg .k-mix{ fill:var(--doubt); opacity:.8 }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:790px!important;height:250px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="벡터를 정사각 행렬로 접어 왼쪽과 오른쪽에서 작은 행렬을 곱한 뒤 다시 펴면 크로네커 곱 행렬을 곱한 것과 같다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 790 250" width="100%"><defs><marker id="f7-ink" markerHeight="9" markerUnits="userSpaceOn
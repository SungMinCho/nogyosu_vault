<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 346" width="760" height="346" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-grid{ fill:var(--grid) }.dg .t-pos{ fill:var(--pos) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-pos{ stroke:var(--pos) }.dg .dash{ stroke-dasharray:4 3 }.dg .f-pos{ fill:var(--pos) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.dg .tag-pos{ fill:var(--pos-soft); stroke:var(--pos); stroke-width:1 }.dg .ssub{ font-size:8px }.dg .thick{ stroke-width:2.4 }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:760px!important;height:346px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="회전 네 자리를 학습 여부와 병합 여부의 2 곱하기 2 칸에 놓은 그림. R1과 R2는 병합되고 학습되며, R3와 R4는 온라인이고 고정 하다마드다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 760 346" width="100%"><defs><marker id="h2-pos" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-pos" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-s t-b" text-anchor="middle" x="295" y="44">학습한다 (조밀 행렬)</text><text class="t-s t-b" text-anchor="middle" x="545" y="44">고정 하다마드 (나비로 계산)</text><text class="t-s t-b" text-anchor="end" x="158" y="111">가중치에 병합</text><text class="t-s t-mut" text-anchor="end" x="158" y="127">추론 비용 0</text><text class="t-s t-b" text-anchor="end" x="158" y="221">추론 중 온라인</text><text class="t-s t-mut" text-anchor="end" x="158" y="237">원소당 비용</text><rect class="bx-rot" height="102" rx="6" width="242" x="174" y="64"></rect><text class="t-b t-rot" text-anchor="middle" x="295" y="111">R1 · R2</text><text class="t-s t-mut" text-anchor="middle" x="295" y="131">SpinQuant가 학습하는 칸</text><rect class="bx" height="102" rx="6" width="242" x="424" y="64"></rect><text class="t-b t-mut" text-anchor="middle" x="545" y="111">QuaRot의 R1</text><text class="t-s t-mut" text-anchor="middle" x="545" y="131">병합이지만 학습하지 않음</text><rect class="bx" height="102" rx="6" width="242" x="174" y="174"></rect><text class="t-b t-mut" text-anchor="middle" x="295" y="221">(아무도 안 씀)</text><text class="t-s t-mut" text-anchor="middle" x="295" y="241">조밀 행렬을 온라인으로 — 원소당 4096번</text><rect class="bx-grid" height="102" rx="6" width="242" x="424" y="174"></rect><text class="t-b t-grid" text-anchor="middle" x="545" y="221">R3 · R4</text><text class="t-s t-mut" text-anchor="middle" x="545" y="241">빠른 하다마드 — 원소당 12번</text><path class="ln ln-pos dash thick" d="M 505.0 195.0 C 445.0 125.0, 390 180, 380 156" marker-end="url(#h2-pos)"></path><rect class="tag-pos" height="26" rx="4" width="300" x="174" y="290"></rect><text class="t-s t-b t-pos" text-anchor="middle" x="324" y="308">과제: R3를 병합 칸으로 → 비용 0, 그리고 학습 가능</text><text class="t-s t-mut" text-anchor="start" x="170" y="330">R3가 아래 칸에 있는 이유: RoPE 때문에 W<tspan class="ssub" dy="3">q</tspan><tspan dy="-3">​</tspan>·W<tspan class="ssub" dy="3">k</tspan><tspan dy="-3">​</tspan>에 흡수될 수 없어서 (SpinQuant v1).</text></svg></g></g></g></g></svg>
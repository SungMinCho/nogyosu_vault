}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.doc > .masthead, .doc > .toc, .doc > .colophon{ max-width:var(--shell) }.masthead{ display:grid; grid-template-columns:minmax(0,1fr); gap:1.4rem; padding-block:1.2rem .6rem; border-bottom:1px solid var(--line) }@media (min-width:52em){.masthead{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:end }}.mast-fig{ min-width:0 }.hero-svg{ max-width:26rem; margin-inline:auto }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-rot{ fill:var(--rot) }.dg .t-pos{ fill:var(--pos) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .h-warm{ fill:var(--spike-soft); stroke:var(--spike); stroke-width:.8 }.dg .ssub{ font-size:8px }svg.pz-root{width:346px!important;height:136px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w masthead"><g class="pz-w mast-fig">
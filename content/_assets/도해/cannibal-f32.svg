mportant;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w dia"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="카리에라의 네 칸 바나카, 부룽, 카리메라, 팔예리는 아버지에서 자식으로 가는 순열 f와 어머니에서 자식으로 가는 순열 g에 닫혀 있고, 혼인 ω = g⁻¹f까지 셋과 항등 e가 클라인 4원군을 이룬다. 남자 바나카에서 셈하면 외삼촌 딸과 고모 딸은 아내의 칸 부룽에 떨어지고, 친사촌과 이종사촌은 제 칸 바나카로 돌아온다." class="d pz-inner" height="100%" role="img" viewBox="0 0 680 600" width="100%">

dy="-3">​</tspan></text><line class="ln" marker-end="url(#rp-ink)" x1="407" x2="418" y1="293" y2="293"></line><rect class="bx bx-grid" height="30" rx="4" width="106" x="420" y="278"></rect><text class="t-s t-b t-grid" text-anchor="middle" x="473" y="297">양자화</text><line class="ln" marker-end="url(#rp-ink)" x1="527" x2="538" y1="293" y2="293"></line><rect class="bx" height="30" rx="4" width="106" x="540" y="278"></rect><text class="t-s t-b" text-anchor="middle" x="593" y="297">점수</text><text class="t-b t-pos" text-anchor="start" x="672" y="292">✓ 정확</text><text class="t-s t-mut" text-anchor="start" x="672" y="308">지지 2칸 — 4비트에 약함</text><line class="ln-hair" x1="10" x2="820" y1="404" y2="404"></line><text class="t-b" text-anchor="start" x="16" y="368">벽 없는 층</text><text class="t-s t-mut" text-anchor="start" x="16" y="384">Llama 4 넷째 층 · MLA NoPE</text><rect class="bx bx-rot" height="30" rx="4" width="106" x="180" y="354"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="233" y="373">W<tspan class="ssub" dy="3">q</tspan><tspan dy="-3">​</tspan> · H</text><line class="ln" marker-end="url(#rp-ink)" x1="287" x2="298" y1="369" y2="369"></line><rect class="bx" height="30" rx="4" width="106" x="300" y="354"></rect><text class="t-s t-b" text-anchor="middle" x="353" y="373">Θ 없음</text><line class="ln" marker-end="url(#rp-ink)" x1="407" x2="418" y1="369" y2="369"></line><rect class="bx bx-grid" height="30" rx="4" width="106" x="420" y="354"></rect><text class="t-s t-b t-grid" text-anchor="middle" x="473" y="373">양자화</text><line class="ln" marker-end="url(#rp-ink)" x1="527" x2="538" y1="369" y2="369"></line><rect class="bx" height="30" rx="4" width="106" x="540" y="354"></rect><text class="t-s t-b" text-anchor="middle" x="593" y="373">점수</text><text class="t-b t-pos" text-anchor="start" x="672" y="368">✓ 공짜</text><text class="t-s t-mut" text-anchor="start" x="672" y="384">병합이 정확</text><path class="ln ln-spike dash" d="M 240 48 Q 320 26 398 48" marker-end="url(#rp-spike)"></path><text class="t-b t-spike" text-anchor="middle" x="320" y="36">✕</text><text class="t-s t-spike" text-anchor="start" x="412" y="42">H를 Θ 너머로 못 옮김 (HΘ ≠ ΘH)</text></svg></g></g></g></g></svg>
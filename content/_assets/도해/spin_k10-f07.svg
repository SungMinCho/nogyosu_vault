<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 320" width="800" height="320" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-grid{ fill:var(--grid) }.dg .t-pos{ fill:var(--pos) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-pos{ stroke:var(--pos) }.dg .ln-grid{ stroke:var(--grid) }.dg .dash{ stroke-dasharray:4 3 }.dg .f-rot{ fill:var(--rot) }.dg .f-pos{ fill:var(--pos) }.dg .f-grid{ fill:var(--grid) }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-pos{ fill:var(--pos-soft); stroke:var(--pos) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.dg .big{ font-size:20px }.lecture > .frame{ max-width:var(--wide) }.dg .f-grid-s{ fill:var(--grid-soft); stroke:var(--grid); stroke-width:1 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="보정과 회전 학습과 평가가 모두 WikiText2 한 우물에서 나오고, 다른 분포의 평가로 이득이 옮겨 가는지는 따로 물어야 한다" class="dg" height="100%" role="img" style="" viewBox="0 0 800 320" width="100%"><defs><marker id="m6-grid" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-grid" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="m6-pos" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-pos" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="m6-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker></defs><ellipse class="f-grid-s" cx="100" cy="110" rx="70" ry="14"></ellipse><rect class="bx-grid" height="90" rx="0" width="140" x="30" y="110"></rect><ellipse class="f-grid-s" cx="100" cy="200" rx="70" ry="14"></ellipse><text class="t-b t-grid" text-anchor="middle" x="100" y="150">WikiText2</text><text class="t-s t-mut" text-anchor="middle" x="100" y="168">위키백과 우물</text><rect class="bx-grid" height="46" rx="5" width="220" x="230" y="40"></rect><text class="t-s t-b" text-anchor="middle" x="340" y="59">SpinQuant · 회전 학습</text><text class="t-s t-mut" text-anchor="middle" x="340" y="75">표본 800개 · R1, R2 약 865만 수</text><path class="ln ln-grid" d="M172,130 C200,130 200,63 226,63" marker-end="url(#m6-grid)"></path><rect class="bx-grid" height="46" rx="5" width="220" x="230" y="102"></rect><text class="t-s t-b" text-anchor="middle" x="340" y="121">QuaRot · GPTQ 보정</text><text class="t-s t-mut" text-anchor="middle" x="340" y="137">표본 128개</text><path class="ln ln-grid" d="M172,144 C200,144 200,125 226,125" marker-end="url(#m6-grid)"></path><rect class="bx-grid" height="46" rx="5" width="220" x="230" y="164"></rect><text class="t-s t-b" text-anchor="middle" x="340" y="183">DFRot · 보정</text><text class="t-s t-mut" text-anchor="middle" x="340" y="199">2048토큰 문장 하나</text><path class="ln ln-grid" d="M172,158 C200,158 200,187 226,187" marker-end="url(#m6-grid)"></path><rect class="bx-rot" height="46" rx="5" width="220" x="230" y="240"></rect><text class="t-s t-b" text-anchor="middle" x="340" y="259">평가: WikiText2 perplexity</text><text class="t-s t-mut" text-anchor="middle" x="340" y="275">테스트 분할 · 같은 분포</text><path class="ln ln-rot" d="M172,190 C200,190 200,263 226,263" marker-end="url(#m6-rot)"></path><text class="t-s t-b t-pos" text-anchor="middle" x="640" y="34">다른 우물에서도 같은가?</text><rect class="bx-pos dash" height="40" rx="5" width="160" x="560" y="50"></rect><text class="t-s t-b" text-anchor="middle" x="640" y="75">C4 웹 문서</text><path class="ln ln-pos dash" d="M472,163 C510,163 515,70 556,70" marker-end="url(#m6-pos)"></path><rect class="bx-pos dash" height="40" rx="5" width="160" x="560" y="108"></rect><text class="t-s t-b" text-anchor="middle" x="640" y="133">제로샷 과제</text><path class="ln ln-pos dash" d="M472,163 C510,163 515,128 556,128" marker-end="url(#m6-pos)"></path><rect class="bx-pos dash" height="40" rx="5" width="160" x="560" y="166"></rect><text class="t-s t-b" text-anchor="middle" x="640" y="191">긴 문맥</text><path class="ln ln-pos dash" d="M472,163 C510,163 515,186 556,186" marker-end="url(#m6-pos)"></path><rect class="bx-pos dash" height="40" rx="5" width="160" x="560" y="224"></rect><text class="t-s t-b" text-anchor="middle" x="640" y="249">코드 · 다른 언어</text><path class="ln ln-pos dash" d="M472,163 C510,163 515,244 556,244" marker-end="url(#m6-pos)"></path><path class="ln ln-pos" d="M456,40 L466,40 L466,286 L456,286"></path><line class="ln ln-pos" x1="466" x2="472" y1="163" y2="163"></line><text class="t-b t-pos big" text-anchor="middle" x="500" y="128">?</text></svg></svg>
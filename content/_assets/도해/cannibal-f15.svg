a"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="구리 막대 1 m의 두 상태. 양 끝을 100°C와 0°C에 붙잡아 둔 막대는 끊긴 데 없이 이어지면서도 1 cm마다 1°C씩 달라, 그 차이를 따라 4 W의 열이 흐르고 엔트로피가 쉬지 않고 생긴다. 떼어 놓고 기다린 막대는 어디나 50°C라 아무것도 흐르지 않는다. 둘 다 연속이지만 앞의 것은 미분적 연속, 뒤의 것만 미분화된 연속이고, 뒤의 것으로 세계를 보면 차이는 언어가 칼금을 그어야만 생긴다." class="d pz-inner" height="100%" role="img" viewBox="0 0 720 416" width="100%">

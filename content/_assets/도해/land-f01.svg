<text class="t-m" x="516" y="85">1.3×10¹⁴ ÷ 2.8×10²³</text><text class="t-b f-sun" x="516" y="108">≈ 4.5×10⁻¹⁰ · 22억분의 1</text><line class="s-rule" x1="516" x2="748" y1="128" y2="128"></line><text class="t-s f-mute" x="516" y="152">지구가 받는 출력</text><text class="t-m" x="516" y="175">3.8×10²⁶ × 4.5×10⁻¹⁰</text><text class="t-b f-sun" x="516" y="198">≈ 1.7×10¹⁷ W · 17만 TW</text><line class="s-rule" x1="516" x2="748" y1="218" y2="218"></line><text class="t-s f-mute" x="516" y="242">인류 문명 전체 ≈ 2×10¹³ W (20 TW)</text><text class="t-b f-sun" x="516" y="265">1.7×10¹⁷ ÷ 2×10¹³ ≈ 8,500배</text></svg></g></g></g></g></svg>
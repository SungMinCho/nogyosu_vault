<text class="ts r" x="116" y="128">반정립: 끝이 없다</text>
<text class="tm r vm" x="116" y="144">지금까지 어떻게?</text>
<text class="tm r vm" x="464" y="140">둘 다 귀류법으로 ‘증명’된다 → 이율배반</text>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 336" width="640" height="336" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --flour:#EFF0EB; --flour-2:#E6E8E1; --ink:#1C2025; --ink-soft:#4E555D; --rule:#C7CAC1;
  --iron:#3D4652; --water:#1B7480; --spirit:#6448B0; --grain:#A8721A; --rust:#BF4128;
  --water-t:rgba(27,116,128,.12); --spirit-t:rgba(100,72,176,.11); --grain-t:rgba(168,114,26,.13); --rust-t:rgba(191,65,40,.10); --iron-t:rgba(61,70,82,.10);
  --shadow:rgba(28,32,37,.18);
  --display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --body:"Newsreader","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --label:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","Nanum Gothic Coding",ui-monospace,Menlo,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }}:root[data-theme="dark"]{
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents }.lec-no svg{ width:2.2rem; height:2.2rem; flex:none }.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; overflow-y:hidden; border-block:1px solid var(--rule); padding-block:.8rem; background:linear-gradient(to right, var(--flour) 30%, transparent), linear-gradient(to left, var(--flour) 30%, transparent) 100% 0, radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) 100% 0; background-repeat:no-repeat; background-size:2.2rem 100%, 2.2rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; margin-inline:auto; max-width:46rem }.t{ fill:var(--ink); font-family:var(--label); font-size:13px }.t-soft{ fill:var(--ink-soft) }.t-water{ fill:var(--water) }.t-spirit{ fill:var(--spirit) }.t-rust{ fill:var(--rust) }.t-b{ font-weight:600 }.t-sm{ font-size:11.5px }.t-lg{ font-size:15px }.t-xl{ font-size:18px }.s-rule{ stroke:var(--rule); fill:none }.s-water{ stroke:var(--water); fill:none }.s-spirit{ stroke:var(--spirit); fill:none }.f-panel{ fill:var(--flour-2) }.f-spirit{ fill:var(--spirit) }.f-water-t{ fill:var(--water-t) }.f-spirit-t{ fill:var(--spirit-t) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.dash{ stroke-dasharray:5 4 }.dot{ stroke-dasharray:1.5 4; stroke-linecap:round }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="시각 깔때기: 망막 약 10¹⁰ 비트/초에서 시신경 약 10⁶, 피질의 압축된 표상 약 10³~10⁴로 자릿수가 계단처럼 떨어지며, 평생 남는 것은 약 2 TB(바이트로 읽을 때)뿐이다." data-min="560" height="100%" role="img" style="" viewBox="0 0 640 336" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="f08-a" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spirit" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 높이 = 자릿수 (한 자리 = 20px, 가운데 선 y=150 기준 위아래 대칭) -->
<line class="s-rule w1 dot" x1="40" x2="410" y1="150" y2="150"></line>
<!-- 단계 이름 -->
<g class="t t-b" text-anchor="middle">
<text x="113" y="34">망막</text>
<text x="243" y="34">시신경</text>
<text x="357" y="34">피질(V1) 표상</text>
</g>
<!-- 깔때기: 망막 → 시신경 -->
<path class="f-water-t" d="M56 50 H170 L196 90 H290 L312 120 V180 L290 210 H196 L170 250 H56 Z"></path>
<path class="s-water w15" d="M56 250 V50 H170 L196 90 H290 L312 120 M312 180 L290 210 H196 L170 250 H56"></path>
<line class="s-water w1 dot" x1="170" x2="170" y1="50" y2="250"></line>
<line class="s-water w1 dot" x1="290" x2="290" y1="90" y2="210"></line>
<!-- 피질: 10³(비트) ~ 10⁴(바이트로 읽으면 8×10³) -->
<rect class="f-spirit-t s-spirit w15 dash" height="80" width="90" x="312" y="110"></rect>
<rect class="f-spirit-t s-spirit w15" height="60" width="90" x="312" y="120"></rect>
<!-- 자릿수 -->
<text class="t t-xl t-water t-b" text-anchor="middle" x="113" y="148">10¹⁰</text>
<text class="t t-sm t-water" text-anchor="middle" x="113" y="168">비트/초</text>
<text class="t t-xl t-water t-b" text-anchor="middle" x="243" y="148">10⁶</text>
<text class="t t-sm t-water" text-anchor="middle" x="243" y="168">비트/초</text>
<text class="t t-lg t-spirit t-b" text-anchor="middle" x="357" y="155">10³~10⁴</text>
<!-- 계단마다 떨어지는 양 -->
<text class="t t-sm t-water t-b" text-anchor="middle" x="246" y="72">÷10⁴ 만 배</text>
<text class="t t-sm t-spirit t-b" text-anchor="middle" x="370" y="96">÷10²~10³</text>
<!-- 평생 쌓기 -->
<line class="s-spirit w15" marker-end="url(#f08-a)" x1="408" x2="454" y1="150" y2="150"></line>
<text class="t t-sm t-spirit" text-anchor="middle" x="431" y="208">쌓기</text>
<line class="s-spirit w1 dot" x1="431" x2="431" y1="196" y2="156"></line>
<rect class="f-panel s-rule w1" height="116" rx="4" width="168" x="460" y="92"></rect>
<text class="t t-sm t-soft" text-anchor="middle" x="544" y="114">평생 깨어 보는 1.68×10⁹초</text>
<text class="t t-xl t-b" text-anchor="middle" x="544" y="144">≈ 2 TB</text>
<text class="t t-sm" text-anchor="middle" x="544" y="166">1 kB/s(바이트)로 읽을 때</text>
<text class="t t-sm t-rust" text-anchor="middle" x="544" y="190">킬로비트로 읽으면 0.2 TB</text>
<!-- 자막의 숫자 -->
<g class="t t-sm t-soft" text-anchor="middle">
<text x="113" y="276">자막: 10 Gb/s</text>
<text x="243" y="276">자막: 1 Mb/s</text>
<text x="357" y="276">자막: "1 K/s"</text>
</g>
<text class="t t-sm t-rust" text-anchor="middle" x="357" y="294">비트? 바이트?</text>
<text class="t t-sm t-soft" text-anchor="middle" x="544" y="276">대조: 시신경을 그대로 쌓으면</text>
<text class="t t-sm t-soft" text-anchor="middle" x="544" y="294">≈ 210 TB</text>
<text class="t t-sm t-soft" text-anchor="middle" x="320" y="324">높이 = 자릿수(로그 눈금) · 믿을 것은 개별 숫자보다 계단의 모양</text>
</svg></svg>
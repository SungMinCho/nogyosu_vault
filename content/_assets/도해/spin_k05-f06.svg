<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 250" width="800" height="250" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .dash{ stroke-dasharray:4 3 }.dg .f-ink{ fill:var(--ink) }.dg .f-rot{ fill:var(--rot) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="SpinQuant의 흐름: 보정 데이터로 활성만 양자화한 모델의 교차엔트로피를 재고 케일리 갱신으로 R1과 R2를 배운 뒤, 병합하고 GPTQ로 가중치를 양자화해 배포한다" class="dg" height="100%" role="img" style="" viewBox="0 0 800 250" width="100%"><defs><marker id="h4-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="h4-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="bx" height="54" rx="5" width="130" x="20" y="60"></rect><text class="t-s t-b" text-anchor="middle" x="85" y="83">보정 데이터</text><text class="t-s t-mut" text-anchor="middle" x="85" y="100">WikiText2 800개</text><rect class="bx-rot" height="54" rx="5" width="130" x="160" y="60"></rect><text class="t-s t-b" text-anchor="middle" x="225" y="83">모델 + R1·R2</text><text class="t-s t-mut" text-anchor="middle" x="225" y="100">활성만 가짜 양자화</text><rect class="bx" height="54" rx="5" width="130" x="330" y="60"></rect><text class="t-s t-b" text-anchor="middle" x="395" y="83">교차엔트로피</text><text class="t-s t-mut" text-anchor="middle" x="395" y="100">최종 출력 손실</text><rect class="bx-rot" height="54" rx="5" width="130" x="480" y="60"></rect><text class="t-s t-b" text-anchor="middle" x="545" y="83">케일리 갱신</text><text class="t-s t-mut" text-anchor="middle" x="545" y="100">100회 반복</text><line class="ln" marker-end="url(#h4-ink)" x1="152" x2="157" y1="87" y2="87"></line><line class="ln" marker-end="url(#h4-ink)" x1="292" x2="327" y1="87" y2="87"></line><line class="ln" marker-end="url(#h4-ink)" x1="462" x2="477" y1="87" y2="87"></line><path class="ln ln-rot dash" d="M 545.0 116 C 545.0 154, 225.0 154, 225.0 118" marker-end="url(#h4-rot)"></path><text class="t-s t-rot" text-anchor="middle" x="385" y="164">되먹임 — R1·R2만 바뀐다 (모델의 0.26%)</text><line class="ln" marker-end="url(#h4-ink)" x1="620" x2="650" y1="87" y2="87"></line><rect class="bx-grid" height="44" rx="5" width="140" x="652" y="30"></rect><text class="t-s t-b" text-anchor="middle" x="722" y="48">R1·R2 병합</text><text class="t-s t-mut" text-anchor="middle" x="722" y="64">가중치 속으로</text><rect class="bx-grid" height="44" rx="5" width="140" x="652" y="84"></rect><text class="t-s t-b" text-anchor="middle" x="722" y="102">GPTQ</text><text class="t-s t-mut" text-anchor="middle" x="722" y="118">회전된 가중치를 4비트로</text><rect class="bx" height="44" rx="5" width="140" x="652" y="138"></rect><text class="t-s t-b" text-anchor="middle" x="722" y="156">배포</text><text class="t-s t-mut" text-anchor="middle" x="722" y="172">R3·R4는 온라인 하다마드</text><line class="ln" marker-end="url(#h4-ink)" x1="722" x2="722" y1="74" y2="82"></line><line class="ln" marker-end="url(#h4-ink)" x1="722" x2="722" y1="128" y2="136"></line><text class="t-s t-mut" text-anchor="start" x="20" y="230">역할 분담: 회전은 활성을 위해 (학습 중 가중치는 16비트), GPTQ는 가중치를 위해 (회전을 다 배운 뒤).</text></svg></svg>
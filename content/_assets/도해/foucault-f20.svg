<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 412" width="760" height="412" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#DDD8CC; --bg-2:#D3CDBF; --panel:#E9E5DB; --panel-2:#F2EFE8;
  --ink:#1D1913; --ink-2:#3B352B; --mute:#625A4D; --rule:#B4AB9A; --rule-2:#C9C1B1;
  --och:#8A6110; --azu:#1F4E8C; --ver:#AE3519; --lak:#9C2B66;
  --och-w:rgba(138,97,16,.15); --azu-w:rgba(31,78,140,.13); --ver-w:rgba(174,53,25,.13); --lak-w:rgba(156,43,102,.13); --ink-w:rgba(29,25,19,.07);
  --weave:rgba(60,48,30,.045);
  --room:#2E2821; --linen:#CBC2AE; --door:#E3C37C; --glass:#A9C0E0; --ray:rgba(240,214,150,.16);
  --f-disp:"Nanum Myeongjo","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-lat:"Cormorant Garamond","Noto Serif KR",Georgia,serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-ui:"Gothic A1","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"Inconsolata","Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15120E; --bg-2:#1B1712; --panel:#1F1B15; --panel-2:#26211A;
  --ink:#E7E0D2; --ink-2:#CFC6B5; --mute:#A39A89; --rule:#4C4538; --rule-2:#3A342A;
  --och:#D7A64C; --azu:#86AEE6; --ver:#EF7A57; --lak:#E585B6;
  --och-w:rgba(215,166,76,.16); --azu-w:rgba(134,174,230,.15); --ver-w:rgba(239,122,87,.15); --lak-w:rgba(229,133,182,.15); --ink-w:rgba(231,224,210,.07);
  --weave:rgba(255,240,210,.025); --room:#0A0806; --linen:#81776A; --door:#C9A55A; --glass:#7E9DCB; --ray:rgba(240,214,150,.09); color-scheme:dark }}:root[data-theme="dark"]{
  --bg:#15120E; --bg-2:#1B1712; --panel:#1F1B15; --panel-2:#26211A;
  --ink:#E7E0D2; --ink-2:#CFC6B5; --mute:#A39A89; --rule:#4C4538; --rule-2:#3A342A;
  --och:#D7A64C; --azu:#86AEE6; --ver:#EF7A57; --lak:#E585B6;
  --och-w:rgba(215,166,76,.16); --azu-w:rgba(134,174,230,.15); --ver-w:rgba(239,122,87,.15); --lak-w:rgba(229,133,182,.15); --ink-w:rgba(231,224,210,.07);
  --weave:rgba(255,240,210,.025); --room:#0A0806; --linen:#81776A; --door:#C9A55A; --glass:#7E9DCB; --ray:rgba(240,214,150,.09); color-scheme:dark }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{ display:block; width:100%; height:auto }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.6rem 3rem }.lecture{ display:contents }figure.fig{ margin:.6rem 0 .4rem; display:grid; gap:.55rem }.fig .frame{ overflow-x:auto; overscroll-behavior-x:contain; background:var(--panel-2); border:1px solid var(--rule-2); padding:.9rem .8rem;
  background-image:linear-gradient(to right,var(--panel-2) 30%,transparent),linear-gradient(to left,var(--panel-2) 30%,transparent),linear-gradient(to right,var(--ink-w),transparent),linear-gradient(to left,var(--ink-w),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat; background-size:2.2rem 100%,2.2rem 100%,1rem 100%,1rem 100%; background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; height:auto; color:var(--ink) }.t{ font-family:var(--f-ui); font-size:13px; fill:currentColor }.t-s{ font-family:var(--f-ui); font-size:11px; fill:currentColor }.b{ font-weight:700 }.mid{ text-anchor:middle }.mute{ fill:var(--mute) }.s{ fill:none; stroke:currentColor; stroke-width:1.4 }.s-thin{ fill:none; stroke:currentColor; stroke-width:.8 }.dash{ stroke-dasharray:5 4 }.k-mute{ stroke:var(--mute) }.k-rule{ stroke:var(--rule) }.k-azu{ stroke:var(--azu) }.k-ver{ stroke:var(--ver) }.f-ver{ fill:var(--ver) }.f-bg{ fill:var(--panel-2) }.w-azu{ fill:var(--azu-w) }.w-ver{ fill:var(--ver-w) }.w-ink{ fill:var(--ink-w) }.c-azu{ fill:var(--azu) }.c-ver{ fill:var(--ver) }svg.pz-root{width:760px!important;height:412px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><g class="pz-w fw"><svg xmlns="http://www.w3.org/2000/svg" aria-label="세 지역 모두 첫 국면에는 노동, 유기적 구조, 굴절이 바닥선 안쪽에서 표를 받치고, 1795~1800 이음매를 지나면 생산, 생명, 언어들이 바닥선을 뚫고 표상 밖의 층으로 내려가는데, 경제가 먼저, 생물이 다음, 언어가 맨 나중이다" class="pz-inner" height="100%" role="img" viewBox="0 0 760 412" width="100%">
<defs>
<marker id="d-two-phases-vr" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ver" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 열 머리 -->
<text class="t b mid c-azu" x="212" y="28">고전주의의 바탕</text>
<text class="t-s mid mute" x="212" y="46">같음과 다름의 표</text>
<text class="t b mid c-azu" x="380" y="28">첫 국면</text>
<text class="t-s mid mute" x="380" y="46">1775~ · 표 안에서 표를 받친다</text>
<text class="t b mid c-ver" x="625" y="28">둘째 국면</text>
<text class="t-s mid mute" x="625" y="46">~1825 · 표 밖에 제 깊이 · 다음 시간</text>
<!-- 표상 밖의 층(줄마다 바닥선 아래) -->
<rect class="w-ink" height="30" width="615" x="135" y="148"></rect>
<rect class="w-ink" height="30" width="615" x="135" y="258"></rect>
<rect class="w-ink" height="30" width="615" x="135" y="368"></rect>
<!-- 열 구분 · 이음매 -->
<line class="s-thin k-rule" x1="290" x2="290" y1="62" y2="398"></line>
<line class="s k-mute dash" x1="490" x2="490" y1="70" y2="404"></line>
<text class="t-s b mid" x="490" y="66">1795~1800</text>
<!-- 바닥선 = 표상의 울타리 -->
<line class="s k-azu" x1="135" x2="750" y1="148" y2="148"></line>
<line class="s k-azu" x1="135" x2="750" y1="258" y2="258"></line>
<line class="s k-azu" x1="135" x2="750" y1="368" y2="368"></line>
<text class="t-s mute" x="142" y="142">바닥선</text>
<text class="t-s mute" x="142" y="167">표상 밖의 층</text>
<!-- 줄 이름 -->
<text class="t b" x="20" y="122">부의 분석</text>
<text class="t b" x="20" y="232">박물학</text>
<text class="t b" x="20" y="342">일반문법</text>
<!-- 고전주의의 바탕 -->
<text class="t mid c-azu" x="212" y="118">교환 · 필요</text>
<text class="t mid c-azu" x="212" y="228">보이는 형질</text>
<text class="t mid c-azu" x="212" y="338">이름</text>
<!-- 첫 국면: 손님이 바닥선 안쪽에 앉음 -->
<rect class="s-thin k-ver w-azu" height="42" width="160" x="300" y="100"></rect>
<text class="t b mid c-ver" x="380" y="118">노동</text>
<text class="t-s mid mute" x="380" y="134">스미스</text>
<rect class="s-thin k-ver w-azu" height="42" width="160" x="300" y="210"></rect>
<text class="t b mid c-ver" x="380" y="228">유기적 구조</text>
<text class="t-s mid mute" x="380" y="244">쥐시외·비크다지르·라마르크</text>
<rect class="s-thin k-ver w-azu" height="42" width="160" x="300" y="320"></rect>
<text class="t b mid c-ver" x="380" y="338">굴절</text>
<text class="t-s mid mute" x="380" y="354">쾨르두·존스</text>
<!-- 둘째 국면: 바닥선을 뚫고 아래층으로 -->
<rect class="f-bg" height="64" width="90" x="520" y="114"></rect>
<rect class="s k-ver w-ver" height="64" width="90" x="520" y="114"></rect>
<text class="t b mid c-ver" x="565" y="136">생산</text>
<text class="t-s mid" x="565" y="168">리카도</text>
<rect class="f-bg" height="64" width="90" x="588" y="224"></rect>
<rect class="s k-ver w-ver" height="64" width="90" x="588" y="224"></rect>
<text class="t b mid c-ver" x="633" y="246">생명</text>
<text class="t-s mid" x="633" y="278">퀴비에</text>
<rect class="f-bg" height="64" width="90" x="655" y="334"></rect>
<rect class="s k-ver w-ver" height="64" width="90" x="655" y="334"></rect>
<text class="t b mid c-ver" x="700" y="356">언어들</text>
<text class="t-s mid" x="700" y="388">보프</text>
<!-- 비스듬히 처지는 화살 셋 -->
<line class="s k-ver" marker-end="url(#d-two-phases-vr)" x1="462" x2="515" y1="121" y2="140"></line>
<text class="t-s b c-ver" x="520" y="106">먼저</text>
<line class="s k-ver" marker-end="url(#d-two-phases-vr)" x1="462" x2="583" y1="231" y2="250"></line>
<text class="t-s b c-ver" x="588" y="216">다음</text>
<line class="s k-ver" marker-end="url(#d-two-phases-vr)" x1="462" x2="650" y1="341" y2="358"></line>
<text class="t-s b c-ver" x="655" y="326">맨 나중</text>
</svg></g></g></g></g></g></svg>
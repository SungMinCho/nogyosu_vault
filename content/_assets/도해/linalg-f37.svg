text><line class="s-grid" fill="none" stroke-width="1" x1="337.9" x2="337.9" y1="44" y2="404"></line><line class="s-ink" fill="none" stroke-width="1.2" x1="40" x2="78" y1="404" y2="404"></line><line class="s-ink" fill="none" stroke-width="1.3" x1="80" x2="86" y1="397" y2="411"></line><line class="s-ink" fill="none" stroke-width="1.3" x1="86" x2="92" y1="397" y2="411"></line><text class="t-lab c-mut" font-size="10" text-anchor="middle" x="56" y="422">기원전후</text><text class="t-lab b" font-size="12" text-anchor="start" x="12" y="64">가우스 소거법</text><rect class="f-wwarn s-none" height="10" width="275.9" x="62" y="75"></rect><line class="s-mut" fill="none" stroke-width="1" x1="80" x2="86" y1="72" y2="88"></line><line class="s-mut" fill="none" stroke-width="1" x1="86" x2="92" y1="72" y2="88"></line><circle class="f-in" cx="62" cy="80" r="5"></circle><circle class="f-out" cx="337.9" cy="80" r="5"></circle><text class="t-lab c-in" font-size="10.5" text-anchor="start" x="64" y="100">구장산술</text><text class="t-lab c-out" font-size="10.5" text-anchor="end" x="354" y="64">‘가우스’ 20세기 중반</text><text class="t-lab b" font-size="12" text-anchor="start" x="12" y="122">크라메르 공식</text><rect class="f-wwarn s-none" height="10" width="1.6" x="175" y="133"></rect><circle class="f-in" cx="175" cy="138" r="5"></circle><circle class="f-out" cx="176.6" cy="138" r="5"></circle><text class="t-lab c-in" font-size="10.5" text-anchor="end" x="167" y="158">매클로린 1748</text><text class="t-lab c-out" font-size="10.5" text-anchor="start" x="183.6" y="158">크라메르 1750</text><text class="t-lab b" font-size="12" text-anchor="start" x="12" y="180">행렬식 → ‘행렬’</text><rect class="f-wwarn s-none" height="10" width="134.7" x="122.6" y="191"></rect><circle class="f-in" cx="122.6" cy="196" r="5"></circle><circle class="f-out" cx="257.3" cy="196" r="5"></circle><text class="t-lab c-in" font-size="10.5" text-anchor="end" x="114.6" y="216">세키 1683</text><text class="t-lab c-out" font-size="10.5" text-anchor="end" x="354" y="180">실베스터 ‘matrix’ 1850</text><text class="t-num" font-size="9.5" text-anchor="middle" x="190" y="199.5">+167년</text><text class="t-lab b" font-size="12" text-anchor="start" x="12" y="238">그람–슈미트</text><rect class="f-wwarn s-none" height="10" width="99.2" x="226.6" y="249"></rect><circle class="f-in" cx="226.6" cy="254" r="5"></circle><circle class="f-out" cx="325.8" cy="254" r="5"></circle><text class="t-lab c-in" font-size="10.5" text-anchor="end" x="218.6" y="274">라플라스 1812</text><text class="t-lab c-out" font-size="10.5" text-anchor="end" x="354" y="238">웡이 이름 붙임 1935</text><text class="t-num" font-size="9.5" text-anchor="middle" x="276.2" y="257.5">+123년</text><text class="t-lab b" font-size="12" text-anchor="start" x="12" y="296">케일리–해밀턴</text><rect class="f-wwarn s-none" height="10" width="16.1" x="263.7" y="307"></rect><circle class="f-in" cx="263.7" cy="312" r="5"></circle><circle class="f-out" cx="279.9" cy="312" r="5"></circle><text class="t-lab c-in" font-size="10.5" text-anchor="end" x="255.7" y="332">케일리 2×2만 1858</text><text class="t-lab c-out" font-size="10.5" text-anchor="end" x="354" y="296">프로베니우스 증명 1878</text><text class="t-lab b" font-size="12" text-anchor="start" x="12" y="354">에카르트–영</text><rect class="f-wwarn s-none" height="10" width="23.4" x="303.3" y="365"></rect><circle class="f-in" cx="303.3" cy="370" r="5"></circle><circle class="f-out" cx="326.6" cy="370" r="5"></circle><text class="t-lab c-in" font-size="10.5" text-anchor="end" x="295.3" y="390">슈미트 1907</text><text class="t-lab c-out" font-size="10.5" text-anchor="end" x="354" y="354">에카르트–영 1936</text></svg></g></g></g></g></svg>
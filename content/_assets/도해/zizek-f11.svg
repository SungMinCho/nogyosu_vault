<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 262" width="760" height="262" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#E5E6E1; --panel:#F0F1EC; --ink:#1B1D21; --mute:#5B5F63; --rule:#C3C6C0;
  --sub:#1D4F93; --sym:#855D00; --jou:#AE2E1C;
  --sub-t:rgba(29,79,147,.12); --sym-t:rgba(201,150,20,.22); --jou-t:rgba(174,46,28,.12);
  --flb:#1F4F96; --fly:#E3B021; --flr:#C0301F;
  --f-body:"Spectral","Nanum Myeongjo","Noto Serif CJK KR","Noto Serif KR","AppleMyungjo",serif;
  --f-disp:"Hahmlet","Nanum Myeongjo","Noto Serif CJK KR",serif;
  --f-label:"Nanum Gothic","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"Courier Prime","Nanum Gothic Coding","Noto Sans Mono CJK KR",monospace;
  --f-lat:"Spectral","Nanum Myeongjo",serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121417; --panel:#1B1E22; --ink:#E6E4DE; --mute:#A2A6A9; --rule:#353A40;
    --sub:#86AEEA; --sym:#DDB14C; --jou:#EE7B64;
    --sub-t:rgba(134,174,234,.16); --sym-t:rgba(221,177,76,.18); --jou-t:rgba(238,123,100,.16);
    --flb:#2A5AA0; --fly:#C99A1B; --flr:#B0342A;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121417; --panel:#1B1E22; --ink:#E6E4DE; --mute:#A2A6A9; --rule:#353A40;
  --sub:#86AEEA; --sym:#DDB14C; --jou:#EE7B64;
  --sub-t:rgba(134,174,234,.16); --sym-t:rgba(221,177,76,.18); --jou-t:rgba(238,123,100,.16);
  --flb:#2A5AA0; --fly:#C99A1B; --flr:#B0342A;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:2.2rem 4rem; }.lecture{ display:contents; }.flag svg{ display:block; width:100%; height:auto; }.fig{ margin-block:.6rem; display:grid; gap:.5rem; }.fig-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background:
  linear-gradient(90deg,var(--panel) 30%,transparent) left/2.2rem 100% no-repeat local,
  linear-gradient(270deg,var(--panel) 30%,transparent) right/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent) left/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) right/.8rem 100% no-repeat scroll, var(--panel);
  padding:.6rem .4rem; }.fig svg{ display:block; width:100%; height:auto; min-width:640px; }svg text{ fill:var(--ink); font-family:var(--f-label); }.t-sm{ font-size:12px; }.t-md{ font-size:13.5px; }.t-xl{ font-size:28px; }.t-b{ font-weight:700; }.t-sym{ fill:var(--sym); }.t-jou{ fill:var(--jou); }.t-it{ font-family:var(--f-lat); font-style:italic; }.f-ink{ fill:var(--ink); }.f-panel{ fill:var(--panel); }.f-none{ fill:none; }.f-sym{ fill:var(--sym); }.f-jout{ fill:var(--jou-t); }.s-ink{ stroke:var(--ink); }.s-sym{ stroke:var(--sym); }.s-jou{ stroke:var(--jou); }.fig-scroll .f-panel{ fill:var(--ground); }svg.pz-root{width:760px!important;height:262px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-scroll"><svg xmlns="http://www.w3.org/2000/svg" aria-label="왼쪽의 네 가지 사회적 불안, 경제·정치·도덕·예술이 한 점으로 모여 유대인이라는 이름으로 꿰매진다. 그 이름에서 대상 a, 유대인 안의 유대인보다 더한 것이 생기고, 점선이 되돌아가 모든 불안을 ‘그들이 유대인이니까’로 뒤집는다." class="pz-inner" data-fig="f10" height="100%" role="img" style="--fw:760" viewBox="0 0 760 262" width="100%"><defs><marker id="f10-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f10-a-sym" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-sym" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="s-ink f-panel" height="34" rx="6" stroke-width="1.4" width="200" x="20" y="62"></rect><text class="t-sm" text-anchor="middle" x="120.0" y="83.5">경제 · 실업, 인플레이션</text><line class="s-ink" marker-end="url(#f10-a-ink)" stroke-width="1.2" x1="224" x2="318" y1="79" y2="154.0"></line><rect class="s-ink f-panel" height="34" rx="6" stroke-width="1.4" width="200" x="20" y="114"></rect><text class="t-sm" text-anchor="middle" x="120.0" y="135.5">정치 · 부패</text><line class="s-ink" marker-end="url(#f10-a-ink)" stroke-width="1.2" x1="224" x2="318" y1="131" y2="158.0"></line><rect class="s-ink f-panel" height="34" rx="6" stroke-width="1.4" width="200" x="20" y="166"></rect><text class="t-sm" text-anchor="middle" x="120.0" y="187.5">도덕 · 타락</text><line class="s-ink" marker-end="url(#f10-a-ink)" stroke-width="1.2" x1="224" x2="318" y1="183" y2="162.0"></line><rect class="s-ink f-panel" height="34" rx="6" stroke-width="1.4" width="200" x="20" y="218"></rect><text class="t-sm" text-anchor="middle" x="120.0" y="239.5">예술 · 아방가르드</text><line class="s-ink" marker-end="url(#f10-a-ink)" stroke-width="1.2" x1="224" x2="318" y1="235" y2="166.0"></line><circle class="f-sym" cx="330" cy="160" r="10"></circle><text class="t-md t-b t-sym" text-anchor="middle" x="330" y="196">‘유대인’</text><text class="t-sm t-sym" text-anchor="middle" x="330" y="214">이름 · 누빔점</text><line class="s-sym" marker-end="url(#f10-a-sym)" stroke-width="1.6" x1="344" x2="500" y1="160" y2="160"></line><ellipse class="f-jout s-jou" cx="572" cy="160" rx="64" ry="42" stroke-width="1.6"></ellipse><text class="t-xl t-jou t-it" text-anchor="middle" x="572" y="166">a</text><text class="t-sm t-jou" text-anchor="middle" x="572" y="222">유대인 안의</text><text class="t-sm t-jou" text-anchor="middle" x="572" y="240">유대인보다 더한 것</text><path class="s-ink f-none" d="M 560 116 C 540 44, 300 30, 226 70" marker-end="url(#f10-a-ink)" stroke-dasharray="6 4" stroke-width="1.4"></path><text class="t-sm t-b" text-anchor="middle" x="420" y="40">뒤집힘: ‘그들이 유대인이니까’</text><text class="t-sm t-sym" text-anchor="middle" x="420" y="144">형식적 전환</text></svg></g></g></g></g></svg>
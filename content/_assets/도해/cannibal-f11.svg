sform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w dia"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="데스콜라의 네 존재론 가운데 애니미즘과 자연주의만 한 차원이 같고 다른 차원이 다른 안에서의 대비이고, 토테미즘과 유비론은 내면성과 물리성을 따로 정의해 실체로 굳혀야 채워지는 칸이다. 진짜 대비인 두 칸에서 같은 쪽이 바탕, 다른 쪽이 형상이 되는데, 아마존과 근대는 영혼과 몸이 그 자리를 맞바꾼다. 관점주의는 칸이 아니라 이 영혼과 몸의 구별이 작동하는 방식이다." class="d pz-inner" height="100%" role="img" viewBox="0 0 720 476" width="100%">

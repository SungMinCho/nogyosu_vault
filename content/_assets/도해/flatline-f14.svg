  background-size:40px 100%,40px 100%,14px 100%,14px 100%,12px 12px,12px 12px;
  background-attachment:local,local,scroll,scroll,local,local; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; color:var(--ink) }.fig-frame text, .hero text{ font-family:var(--f-lab); fill:var(--ink); font-size:12px }text.s{ font-size:11px }text.xs{ font-size:10px }text.l{ font-size:14px }text.xl{ font-size:18px }text.b{ font-weight:700 }text.mut{ fill:var(--ink-2) }text.halo{ paint-order:stroke fill; stroke:var(--panel) !important; stroke-width:6px; stroke-linejoin:round }text.he{ font-family:"Noto Serif Hebrew","Noto Sans Hebrew","Times New Roman",serif; font-size:30px }.t-copy{ fill:var(--copy) !important }.t-alarm{ fill:var(--alarm) !important }.s-ink{ stroke:var(--ink); fill:none }.s-grid{ stroke:var(--grid-2); fill:none }.s-copy{ stroke:var(--copy); fill:none }.f-copy{ fill:var(--copy) }.f-alarm-s{ fill:var(--alarm-soft) }.m-ink{ fill:var(--ink) }.m-copy{ fill:var(--copy) }.m-prop{ fill:var(--prop) }.m-code{ fill:var(--code) }.m-alarm{ fill:var(--alarm) }.m-mut{ fill:var(--ink-3) }.dash{ stroke-dasharray:5 4 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="조상 자리는 한 세대마다 두 배라 30대 위에서 10억을 넘는다. 13세기 세계 인구 약 4억을 넘어서는 순간부터 같은 사람이 여러 자리에 들어가야 하고, 족보는 나무가 아니라 접힌 그물이 된다." height="100%" role="img" viewBox="0 0 680 292" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f15-a-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-ink" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f15-a-copy" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-copy" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f15-a-prop" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-prop" d="
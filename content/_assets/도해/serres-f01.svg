<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 340" width="860" height="340" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.fig-svg .tl, .chart .tl{ font-family:var(--f-latin); font-style:italic; }.fig-svg .tm, .chart .tm{ font-family:var(--f-mono); font-size:11px; }.fig-svg .halo, .chart .halo{ paint-order:stroke; stroke:var(--deep); stroke-width:4px; stroke-linejoin:round; }.c-ink2{ fill:var(--ink2) !important }.c-cold{ fill:var(--cold) !important }.c-pass{ fill:var(--pass) !important }.c-order{ fill:var(--order) !important }.s-ink{ stroke:var(--ink) }.s-cold{ stroke:var(--cold) }.s-pass{ stroke:var(--pass) }.s-order{ stroke:var(--order) }.f-none{ fill:none }.f-land{ fill:var(--land) }.f-cold-t{ fill:var(--cold); fill-opacity:.16 }.f-pass-t{ fill:var(--pass); fill-opacity:.16 }.w15{ stroke-width:1.5 }.dash{ stroke-dasharray:5 4 }.mk-pass{ fill:var(--pass) }svg.pz-root{width:860px!important;height:340px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="다섯 권을 연도순으로 늘어놓은 지도. 1권 뒤표지에 이미 2권과 3권의 제목어가 들어 있고, 4권 뒤표지는 1–3권을 위상학과 에너지론으로 요약한 뒤 무질서로 뛰어들며, 5권은 섬과 섬 사이의 통로를 찾는다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 860 340" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F01-ar-pass" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-pass" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="s-ink f-land w15" height="92" rx="2" width="152" x="20" y="120"></rect><text class="tm c-ink2" text-anchor="middle" x="96" y="142">HERMÈS I</text><text class="tb" text-anchor="middle" x="96" y="167">소통</text><text class="ts tl" text-anchor="middle" x="96" y="186">La communication</text><text class="tm c-ink2" text-anchor="middle" x="96" y="203">1968/69 · 248쪽</text><rect class="s-ink f-land w15" height="92" rx="2" width="152" x="182" y="120"></rect><text class="tm c-ink2" text-anchor="middle" x="258" y="142">HERMÈS II</text><text class="tb" text-anchor="middle" x="258" y="167">간섭</text><text class="ts tl" text-anchor="middle" x="258" y="186">L'interférence</text><text class="tm c-ink2" text-anchor="middle" x="258" y="203">1972 · 232쪽</text><rect class="s-ink f-land w15" height="92" rx="2" width="152" x="344" y="120"></rect><text class="tm c-ink2" text-anchor="middle" x="420" y="142">HERMÈS III</text><text class="tb" text-anchor="middle" x="420" y="167">번역</text><text class="ts tl" text-anchor="middle" x="420" y="186">La traduction</text><text class="tm c-ink2" text-anchor="middle" x="420" y="203">1974 · 272쪽</text><rect class="s-cold f-cold-t w15" height="92" rx="2" width="152" x="506" y="120"></rect><text class="tm c-ink2" text-anchor="middle" x="582" y="142">HERMÈS IV</text><text class="tb" text-anchor="middle" x="582" y="167">분배</text><text class="ts tl" text-anchor="middle" x="582" y="186">La distribution</text><text class="tm c-ink2" text-anchor="middle" x="582" y="203">1977 · 296쪽</text><rect class="s-pass f-pass-t w15" height="92" rx="2" width="152" x="668" y="120"></rect><text class="tm c-ink2" text-anchor="middle" x="744" y="142">HERMÈS V</text><text class="tb" text-anchor="middle" x="744" y="167">북서항로</text><text class="ts tl" text-anchor="middle" x="744" y="186">Le passage du Nord-Ouest</text><text class="tm c-ink2" text-anchor="middle" x="744" y="203">1980 · 200쪽</text><path class="s-order w15 f-none" d="M20,104 L20,92 L496,92 L496,104"></path><text class="t c-order" text-anchor="middle" x="258" y="64">구조와 힘 = 위상학 + 에너지론</text><text class="ts" text-anchor="middle" x="258" y="82">IV권 뒤표지가 앞의 세 권을 스스로 묶은 말 · "기능적 기술일 뿐"</text><text class="ts c-cold" text-anchor="middle" x="582" y="82">섬을 떠나 바다로</text><text class="t c-cold" text-anchor="middle" x="582" y="100">무질서</text><text class="ts c-pass" text-anchor="middle" x="744" y="82">섬과 섬 사이</text><text class="t c-pass" text-anchor="middle" x="744" y="100">"인터페이스는 없다"</text><path class="s-pass w15 dash f-none" d="M114.24,212 C114.24,274 258.0,274 258.0,216" marker-end="url(#F01-ar-pass)"></path><path class="s-pass w15 dash f-none" d="M80.80000000000001,212 C80.80000000000001,308 420.0,308 420.0,216" marker-end="url(#F01-ar-pass)"></path><text class="ts tl c-pass halo" text-anchor="middle" x="174" y="274">« interférences »</text><text class="ts tl c-pass halo" text-anchor="middle" x="338" y="300">« traduction »</text><text class="ts" text-anchor="start" x="24" y="328">I권 뒤표지(1968/69)에 이미 II·III권의 제목어가 들어 있다</text></svg></g></g></g></g></svg>
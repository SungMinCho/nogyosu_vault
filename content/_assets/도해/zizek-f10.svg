  padding:.6rem .4rem; }.fig svg{ display:block; width:100%; height:auto; min-width:640px; }svg text{ fill:var(--ink); font-family:var(--f-label); }.t-sm{ font-size:12px; }.t-md{ font-size:13.5px; }.t-b{ font-weight:700; }.t-mute{ fill:var(--mute); }.f-ink{ fill:var(--ink); }.f-mute{ fill:var(--mute); }.f-panel{ fill:var(--panel); }.f-none{ fill:none; }.f-sym{ fill:var(--sym); }.f-symt{ fill:var(--sym-t); }.s-ink{ stroke:var(--ink); }.s-mute{ stroke:var(--mute); }.s-sym{ stroke:var(--sym); }.fig-scroll .f-panel{ fill:var(--ground); }svg.pz-root{width:760px!important;height:250px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-scroll"><svg xmlns="http://www.w3.org/2000/svg" aria-label="세 칸. 형식적 근거: 행성의 운동과 인력이 같은 내용을 주고받는다. 실재적 근거: 가난, 교육, 친구, 날씨가 범죄로 점선을 보내지만 아무것도 강제하지 않는다. 완전한 근거: 같은 목록을 괄호로 묶고 이름 하나가 닫는다." class="pz-inner" data-fig="f09" height="100%" role="img" style="--fw:760" viewBox="0 0 760 250" width="100%"><defs><marker id="f09-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f09-a-mute" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f09-a-sym" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-sym" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-md t-b" text-anchor="start" x="20" y="26">형식적 근거</text><rect class="s-ink f-panel" height="32" rx="6" stroke-width="1.4" width="190" x="35" y="64"></rect><text class="t-md" text-anchor="middle" x="130.0" y="84.5">행성의 운동</text><rect class="s-sym f-symt" height="32" rx="6" stroke-width="1.4" width="190" x="35" y="150"></rect><text class="t-md t-b" text-anchor="middle" x="130.0" y="170.5">인력</text><line class="s-ink" marker-end="url(#f09-a-ink)" stroke-width="1.4" x1="110" x2="110" y1="100" y2="146"></line><line class="s-ink" marker-end="url(#f09-a-ink)" stroke-width="1.4" x1="150" x2="150" y1="146" y2="100"></line><text class="t-sm" text-anchor="start" x="162" y="128">같은 내용</text><text class="t-sm t-mute" text-anchor="start" x="20" y="222">아편 → 수면력 → 아편</text><text class="t-md t-b" text-anchor="start" x="270" y="26">실재적 근거</text><rect class="s-ink f-panel" height="28" rx="6" stroke-width="1.4" width="50" x="273" y="60"></rect><text class="t-sm" text-anchor="middle" x="298.0" y="78.5">가난</text><line class="s-mute" marker-end="url(#f09-a-mute)" stroke-dasharray="4 3" stroke-width="1.1" x1="298" x2="364.0" y1="92" y2="178"></line><rect class="s-ink f-panel" height="28" rx="6" stroke-width="1.4" width="50" x="331" y="60"></rect><text class="t-sm" text-anchor="middle" x="356.0" y="78.5">교육</text><line class="s-mute" marker-end="url(#f09-a-mute)" stroke-dasharray="4 3" stroke-width="1.1" x1="356" x2="378.0" y1="92" y2="178"></line><rect class="s-ink f-panel" height="28" rx="6" stroke-width="1.4" width="50" x="389" y="60"></rect><text class="t-sm" text-anchor="middle" x="414.0" y="78.5">친구</text><line class="s-mute" marker-end="url(#f09-a-mute)" stroke-dasharray="4 3" stroke-width="1.1" x1="414" x2="392.0" y1="92" y2="178"></line><rect class="s-ink f-panel" height="28" rx="6" stroke-width="1.4" width="50" x="447" y="60"></rect><text class="t-sm" text-anchor="middle" x="472.0" y="78.5">날씨</text><line class="s-mute" marker-end="url(#f09-a-mute)" stroke-dasharray="4 3" stroke-width="1.1" x1="472" x2="406.0" y1="92" y2="178"></line><rect class="s-ink f-panel" height="30" rx="6" stroke-width="1.4" width="100" x="335" y="182"></rect><text class="t-md t-b" text-anchor="middle" x="385.0" y="201.5">범죄</text><text class="t-sm t-mute" text-anchor="middle" x="385" y="238">어느 것도 결론을 강제하지 않는다</text><text class="t-md t-b" text-anchor="start" x="520" y="26">완전한 근거</text><rect class="s-ink f-panel" height="24" rx="6" stroke-width="1.4" width="76" x="530" y="58"></rect><text class="t-sm" text-anchor="middle" x="568.0" y="74.5">가난</text><rect class="s-ink f-panel" height="24" rx="6" stroke-width="1.4" width="76" x="530" y="88"></rect><text class="t-sm" text-anchor="middle" x="568.0" y="104.5">교육</text><rect class="s-ink f-panel" height="24" rx="6" stroke-width="1.4" width="76" x="530" y="118"></rect><text class="t-sm" text-anchor="middle" x="568.0" y="134.5">친구</text><rect class="s-ink f-panel" height="24" rx="6" stroke-width="1.4" width="76" x="530" y="148"></rect><text class="t-sm" text-anchor="middle" x="568.0" y="164.5">날씨</text><path class="f-none s-sym" d="M 616 58 Q 628 58 628 70 L 628 106 Q 628 112 636 114 Q 628 116 628 122 L 628 164 Q 628 176 616 176" stroke-width="1.6"></path><line class="s-sym" marker-end="url(#f09-a-sym)" stroke-width="1.4" x1="638" x2="652" y1="114" y2="114"></line><rect class="s-sym f-symt" height="28" rx="6" stroke-width="1.4" width="84" x="656" y="100"></rect><text class="t-sm t-b" text-anchor="middle" x="698.0" y="118.5">이름 하나</text><text class="t-sm t-mute" text-anchor="middle" x="630" y="222">목록을 동어반복이 닫는다</text></svg></g></g></g></g></svg>
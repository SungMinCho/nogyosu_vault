<text class="ts tb" x="16" y="158">펼친다</text>
<text class="tl" x="16" y="175">explication</text>
<text class="tl" x="16" y="192">내가 가서 확인한다</text>
<rect class="f-panel s-ink w1" height="70" width="160" x="16" y="214"></rect>
<text class="ts tb tm" x="96" y="236">사실 · 믿음</text>
<text class="ts tm" x="96" y="255">뱀이 있었다</text>
<text class="ts tb tm" x="96" y="274">→ 대상</text>

<path class="ln" d="M170,204 L664,204"></path>
<path class="ln" d="M170,204 L170,209 M240,204 L240,209 M310,204 L310,209 M380,204 L380,209 M450,204 L450,209 M520,204 L520,209 M590,204 L590,209 M660,204 L660,209"></path>
<text class="t-s t-num t-2" text-anchor="middle" x="170" y="221">0</text>
<text class="t-s t-num t-2" text-anchor="middle" x="240" y="221">5</text>
<text class="t-s t-num t-2" text-anchor="middle" x="310" y="221">10</text>
<text class="t-s t-num t-2" text-anchor="middle" x="380" y="221">15</text>
<text class="t-s t-num t-2" text-anchor="middle" x="450" y="221">20</text>
<text class="t-s t-num t-2" text-anchor="middle" x="520" y="221">25</text>
<text class="t-s t-num t-2" text-anchor="middle" x="590" y="221">30</text>
<text class="t-s t-num t-2" text-anchor="middle" x="660" y="221">35</text>
<text class="t-s t-m" text-anchor="end" x="140" y="221">나이(세)</text>
<!-- 아래: 지표별 '끝' -->
<text class="t-s t-b t-2" x="16" y="250">무엇을 재느냐에 따른 '끝'</text>
<text class="t-s" x="16" y="276">피질 두께 정점</text>
<circle class="f-ink" cx="282" cy="272" r="4.5"></circle>
<text class="t-s" text-anchor="end" x="274" y="276">평균 IQ군 8</text>
<rect class="f-ink" height="8" rx="2" width="14" x="324" y="268"></rect>
<text class="t-s" x="344" y="276">11~12 최상위 IQ군 · 쇼 2006</text>
<text class="t-s" x="16" y="300">인지 능력 성인 수준</text>
<circle class="f-ink" cx="394" cy="296" r="4.5"></circle>
<text class="t-s" x="402" y="300">약 16 · 아이스노글 2019</text>
<text class="t-s" x="16" y="324">심리사회적 성숙</text>
<circle class="f-ink" cx="422" cy="320" r="4.5"></circle>
<path class="ln-2" d="M427,320 L456,320" marker-end="url(#mature-ah)"></path>
<text class="t-s" x="462" y="324">18 이후 · 같은 연구</text>
<text class="t-s t-alarm t-b" x="16" y="348">'25세'</text>
<circle class="f-ink2" cx="464" cy="344" r="4.5"></circle>

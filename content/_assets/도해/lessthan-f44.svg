<text class="t-s" x="98" y="412">열반 원리 — 유기체 이전의 평화로</text>
<text class="t-s" x="98" y="430">가만히 서 있기 — 정지가 대혼란을 부른다</text>
<text class="t-s" x="98" y="448">죽음충동을 열반과 뒤섞는 오독 · ‘더 비싸다’</text>

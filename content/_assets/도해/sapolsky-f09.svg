<path class="ln" d="M394,420 L590,420 M394,414 L394,426 M590,414 L590,426"></path>
<text class="t-s t-b" text-anchor="middle" x="492" y="438">16 → 30 ≈ 14년</text>
</svg></g></g></g></svg>
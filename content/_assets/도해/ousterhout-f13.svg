    --flag:#EF7B57; --flag-soft:rgba(239,123,87,.14);
    --canary:#F4C63A;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1416; --panel:#161D20; --code-bg:#131A1D;

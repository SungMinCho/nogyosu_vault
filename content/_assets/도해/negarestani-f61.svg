  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}}:root[data-theme="dark"]{
  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}.vg{color:var(--vg)}.pb{color:var(--pb)}svg.defs{position:absolute;width:0;height:0;overflow:hidden}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-inline:var(--pad);padding-block:0 4rem}.lecture{display:contents}.webwrap svg{display:block;width:100%;height:auto}.sw-dot.vg{background:var(--vg)}.sw-dot.pb{background:var(--pb)}figure.fig{border:1px solid var(--mark);background:var(--plate);padding:.75rem .75rem .6rem;margin-block:.6rem}.figscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  background:linear-gradient(to right,var(--plate) 30%,transparent),linear-gradient(to left,var(--plate) 30%,transparent) 100% 0,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) 100% 0;
  background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;background-attachment:local,local,scroll,scroll}figure.fig svg{display:block;width:100%;height:auto;min-width:27rem}@media (max-width:34rem){.doc>figure.fig,.lecture>figure.fig{width:calc(100% + var(--pad)*2);max-width:none;margin-inline:calc(var(--pad)*-1);border-inline:0;padding-inline:.6rem}}.terms li.vg{color:var(--vg);background:var(--vg-soft)}.terms li.pb{color:var(--pb);background:var(--pb-soft)}svg .ln,svg .ln-cu,svg .ln-vg,svg .ln-pb,svg .ln-vm{stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}svg .ln:not([fill]),svg .ln-cu:not([fill]),svg .ln-vg:not([fill]),svg .ln-pb:not([fill]),svg .ln-vm:not([fill]){fill:none}svg .ln{stroke:var(--ink)}svg .ln-cu{stroke:var(--cu)}svg .ln-vg{stroke:var(--vg)}svg .ln-pb{stroke:var(--pb)}svg g.ln-vg>rect:not([fill]),svg g.ln-cu>rect:not([fill]),svg g.ln-pb>rect:not([fill]),svg g.ln-vm>rect:not([fill]){fill:none}svg .faint,svg g.faint>*,svg g>.faint{stroke:var(--mark)}svg .dash,svg g.dash>*{stroke-dasharray:4 4}svg text{fill:var(--ink);font-family:var(--f-body)}svg .ts{font-size:13px}svg .tm{font-family:var(--f-mono);font-size:11px}svg .it{font-family:var(--f-latin);font-style:italic;font-size:20px}svg .c{text-anchor:middle}svg text.cu{fill:var(--cu)}svg text.vg{fill:var(--vg)}svg text.pb{fill:var(--pb)}svg text.vm{fill:var(--vm)}.m .sq>.rt path{fill:none;stroke:currentColor;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}.m .sq>.rt path.rh{stroke-width:1.6px}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="생각하는 그것에서 말하는 우리로 — 칸트의 생각하는 x가 말하는 우리로 바뀌었고, 말하는 그것이 그것인지 우리인지는 인정의 행위가 정한다" height="100%" role="img" viewBox="0 0 480 284" width="100%" xmlns="http://www.w3.org/2000/svg"><text class="ts" x="16" y="36">칸트</text><text class="tm" x="16" y="50">A346/B404</text>
<rect class="ln" height="24" width="64" x="100" y="24"></rect><text class="ts c" x="132" y="41">생각하는</text><rect class="ln" height="24" width="36" x="174" y="24"></rect><text class="ts c" x="192" y="41">나</text><rect class="ln" height="24" width="44" x="220" y="24"></rect><text class="ts c" x="242" y="41">그</text><rect class="ln" height="24" width="44" x="274" y="24"></rect><text class="ts c" x="296" y="41">그것</text>
<rect class="ln-pb dash" height="34" rx="3" width="154" x="169" y="19"></rect>
<text class="it pb" x="334" y="42">= x</text>
<text class="tm pb" x="370" y="36">나·그·그것 중</text><text class="tm pb" x="370" y="50">무엇인지 모름</text>
<line class="ln-vg" marker-end="url(#ah-vg)" x1="132" x2="132" y1="50" y2="86"></line>
<line class="ln faint" x1="192" x2="192" y1="55" y2="88"></line>
<line class="ln-vg" marker-end="url(#ah-vg)" x1="242" x2="242" y1="55" y2="86"></line>
<line class="ln faint" x1="296" x2="296" y1="55" y2="88"></line>
<text class="tm" x="16" y="102">네가레스타니</text><text class="tm" x="16" y="116">장 제목</text>
<rect class="ln-vg" fill="url(#h-vg)" fill-opacity="0.45" height="24" width="64" x="100" y="90"></rect><text class="ts c" x="132" y="107">말하는</text><rect class="ln" height="24" width="36" x="174" y="90"></rect><text class="ts c" x="192" y="107">나</text><rect class="ln-vg" fill="url(#h-vg)" fill-opacity="0.45" height="24" width="44" x="220" y="90"></rect><text class="ts c" x="242" y="107">우리</text><rect class="ln" height="24" width="44" x="274" y="90"></rect><text class="ts c" x="296" y="107">그것</text>
<text class="tm vg" x="330" y="102">생각하는 x 대신</text><text class="tm vg" x="330" y="116">말하는 우리</text>
<text class="tm" x="100" y="136">원문: ‘이 나, 또는 우리 또는 그것, 사물, 말하는 것’</text>
<text class="tm" x="100" y="154">7장 끝 403쪽: ‘말하는 그것은 이제 … 대화를 시작할 수 있다’</text>
<text class="ts" x="16" y="188">2026</text><text class="tm" x="16" y="202">우리 앞에</text>
<rect class="ln" height="24" width="64" x="100" y="176"></rect><text class="ts c" x="132" y="193">말하는</text><rect class="ln-vg" fill="url(#h-vg)" fill-opacity="0.45" height="24" width="44" x="220" y="176"></rect><text class="ts c" x="242" y="193">우리</text><rect class="ln-cu" fill="url(#h-cu)" fill-opacity="0.45" height="24" width="44" x="274" y="176"></rect><text class="ts c" x="296" y="193">그것</text>
<path class="ln-vg" d="M248,174 C254,158 284,158 290,172" marker-end="url(#ah-vg)"></path>
<path class="ln-vg" d="M290,202 C284,218 254,218 248,204" marker-end="url(#ah-vg)"></path>
<text class="tm vg" x="330" y="182">→ 말하고 기른다</text>
<text class="tm vg" x="330" y="200">← 이유를 요구한다</text>

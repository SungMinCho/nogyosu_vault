<line class="s-mute w1 dash" x1="600" x2="600" y1="288.8" y2="299.4"></line>
<line class="s-cry w4" x1="600" x2="702" y1="299.4" y2="299.4"></line>
<text class="t t-b t-liq" x="452" y="64">과냉 액체 황</text>
<line class="s-inf w15" marker-end="url(#f10-ar-inf)" x1="522" x2="522" y1="88" y2="280.8"></line>
<text class="t-s t-inf t-b" x="532" y="102">① 프리즘 씨앗</text>
<text class="t t-b t-num" x="532" y="176.4">−112 J/mol</text>
<text class="t-s" x="532" y="193.4">퍼텐셜의 95 %</text>
<line class="s-inf w15" marker-end="url(#f10-ar-inf)" x1="610" x2="610" y1="258.8" y2="296.4"></line>
<text class="t-s t-inf t-b" x="618" y="256.8">② 팔면체 씨앗</text>
<text class="t-s t-num t-b" x="618" y="272.8">−5.6 J/mol · 5 %</text>
<text class="t-s t-cry t-b" text-anchor="middle" x="555.0" y="321.4">단사정 β황 (프리즘)</text>
<text class="t-s" text-anchor="middle" x="555.0" y="336.4">불완전한 개체화</text>
<text class="t-s t-liq" text-anchor="middle" x="555.0" y="350.4">5.6 J/mol 높이에 매달림</text>

  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .mk-nv{ fill:var(--c-nv); stroke:var(--bg); stroke-width:2 }.dg .mk-mx{ fill:var(--c-mx); stroke:var(--bg); stroke-width:2 }.dg .t-nv{ fill:var(--c-nv) }.dg .t-mx{ fill:var(--c-mx) }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="SpinQuant의 LLaMA-3-70B 결과는 자기 보고가 3.8과 5.5인데 세 재현이 6.2 근처에 모이고, QuaRot는 자기 보고 6.66인데 SpinQuant 표에서는 20.2다" class="dg" height="100%" role="img" style="" viewBox="0 0 760 260" width="100%"><line class="ln-hair" x1="230" x2="230" y1="40" y2="200"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="230" y="218">3</text><line class="ln-hair" x1="296.484" x2="296.484" y1="40" y2="200"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="296.484" y="218">4</text><line class="ln-hair" x1="348.054" x2="348.054" y1="40" y2="200"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="348.054" y="218">5</text><line class="ln-hair" x1="390.189" x2="390.189" y1="40" y2="200"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="390.189" y="218">6</text><line class="ln-hair" x1="456.673" x2="456.673" y1="40" y2="200"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="456.673" y="218">8</text><line class="ln-hair" x1="508.242" x2="508.242" y1="40" y2="200"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="508.242" y="218">10</text><line class="ln-hair" x1="601.946" x2="601.946" y1="40" y2="200"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="601.946" y="218">15</text><line class="ln-hair" x1="668.431" x2="668.431" y1="40" y2="200"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="668.431" y="218">20</text><line class="ln-hair" x1="720" x2="720" y1="40" y2="200"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="720" y="218">25</text><text class="t-s t-b" text-anchor="end" x="216" y="84">SpinQuant (70B W4A4KV4)</text><line class="ln-hair" x1="230" x2="720" y1="80" y2="80"></line><circle class="mk-mx" cx="284.6" cy="73" r="6"></circle><text class="t-s t-mx t-b" text-anchor="middle" x="284.63" y="62">v4 3.8</text><circle class="mk-mx" cx="370.1" cy="73" r="6"></circle><text class="t-s t-mx t-b" text-anchor="middle" x="370.08" y="62">v1 5.5</text><circle class="mk-nv" cx="398.1" cy="87" r="6"></circle><circle class="mk-nv" cx="399.3" cy="87" r="6"></circle><circle class="mk-nv" cx="397.8" cy="87" r="6"></circle><text class="t-s t-nv t-b" text-anchor="start" x="392.139" y="110">FlatQuant 6.21 · OSTQuant 6.24 · ResQ 6.2</text><text class="t-s t-b" text-anchor="end" x="216" y="164">QuaRot (70B W4A4KV4)</text><line class="ln-hair" x1="230" x2="720" y1="160" y2="160"></line><circle class="mk-mx" cx="414.3" cy="153" r="6"></circle><text class="t-s t-mx t-b" text-anchor="middle" x="414.307" y="142">자기 보고 6.66</text><circle class="mk-nv" cx="412.2" cy="167" r="6"></circle><circle class="mk-nv" cx="670.7" cy="167" r="6"></circle><text class="t-s t-nv t-b" text-anchor="start" x="406.215" y="190">OSTQuant 6.6 · SpinQuant v1 표 20.2</text><text class="t-s t-mut" text-anchor="start" x="230" y="244">LLaMA-3-70B · WikiText2 ppl (로그 눈금). 파랑 = 자기 보고, 금색 = 남이 다시 잰 값.</text></svg></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 260" width="760" height="260" class="frame fig lecture doc page"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E7EAE8; --panel:#F3F5F4; --code-bg:#EEF1F0;
  --ink:#1B2224; --muted:#586365; --rule:#C1C9C8; --rule-soft:rgba(27,34,36,.07);
  --if:#2A5687; --if-soft:rgba(42,86,135,.12); --if-deep:#15375C;
  --ore:#8A6014; --ore-soft:rgba(138,96,20,.15);
  --cx:#7A3B72; --cx-soft:rgba(122,59,114,.12);
  --flag:#B3381B; --flag-soft:rgba(179,56,27,.10);
  --canary:#E9B30C;
  --f-body:"Source Serif 4","Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-disp:"Do Hyeon","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --f-label:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1416; --panel:#161D20; --code-bg:#131A1D;
    --ink:#E1E7E6; --muted:#95A1A3; --rule:#2F3A3D; --rule-soft:rgba(225,231,230,.06);
    --if:#7EA7DA; --if-soft:rgba(126,167,218,.16); --if-deep:#3B6AA5;
    --ore:#D6A553; --ore-soft:rgba(214,165,83,.17);
    --cx:#CB8EC2; --cx-soft:rgba(203,142,194,.17);
    --flag:#EF7B57; --flag-soft:rgba(239,123,87,.14);
    --canary:#F4C63A;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1416; --panel:#161D20; --code-bg:#131A1D;
  --ink:#E1E7E6; --muted:#95A1A3; --rule:#2F3A3D; --rule-soft:rgba(225,231,230,.06);
  --if:#7EA7DA; --if-soft:rgba(126,167,218,.16); --if-deep:#3B6AA5;
  --ore:#D6A553; --ore-soft:rgba(214,165,83,.17);
  --cx:#CB8EC2; --cx-soft:rgba(203,142,194,.17);
  --flag:#EF7B57; --flag-soft:rgba(239,123,87,.14);
  --canary:#F4C63A;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1rem 3rem }.lecture{ display:contents }.fig{ margin:.6rem 0 }.frame{ overflow-x:auto; overflow-y:hidden; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding-block:.8rem;
  background-image:linear-gradient(to right,var(--bg),var(--bg)),linear-gradient(to right,var(--bg),var(--bg)),
    linear-gradient(to right,var(--rule),transparent),linear-gradient(to left,var(--rule),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat;
  background-size:1.5rem 100%,1.5rem 100%,.6rem 100%,.6rem 100%; background-attachment:local,local,scroll,scroll }.dg{ display:block; width:100%; height:auto }.dg .t, .hero-svg .t{ font-family:var(--f-label); font-size:13px; fill:var(--ink) }.dg .t-s{ font-size:12px }.dg .t-xs{ font-size:11px }.dg .t-b, .hero-svg .t-b{ font-weight:700 }.dg .t-mut, .hero-svg .t-mut{ fill:var(--muted) }.dg .t-cx{ fill:var(--cx) }.dg .t-flag{ fill:var(--flag) }.dg line, .dg polyline, .dg path, .hero-svg line, .hero-svg polyline, .hero-svg path{ fill:none }.f-ink{ fill:var(--ink)!important }.f-bg{ fill:var(--bg)!important }.f-panel{ fill:var(--panel)!important }.f-cx{ fill:var(--cx)!important }.ln{ stroke:var(--ink); stroke-width:1.4 }.ln-mut{ stroke:var(--rule); stroke-width:1.2 }.s-ink-thin{ stroke:var(--ink); stroke-width:1 }.s-if{ stroke:var(--if); stroke-width:1.4 }.s-cx{ stroke:var(--cx); stroke-width:1.4 }.w2{ stroke-width:2 }.w4{ stroke-width:4 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="메서드를 쪼개는 네 경우: 원래 메서드, 홀로 읽히는 자식을 뽑은 경우, 호출자가 하나씩만 부르는 두 메서드로 나눈 경우는 괜찮고, 호출자가 둘을 함께 부르며 상태를 주고받아야 하는 샴쌍둥이 메서드는 레드 플래그다." class="dg" height="100%" role="img" style="" viewBox="0 0 760 260" width="100%"><defs><marker id="a-ink-split" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="a-cx-split" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-cx" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t t-b" text-anchor="middle" x="100.0" y="24.0">(가) 원래 메서드</text><text class="t t-b" text-anchor="middle" x="288.0" y="24.0">(나) 자식을 뽑음</text><line class="ln-mut" x1="194.0" x2="194.0" y1="36.0" y2="250.0"></line><text class="t t-b" text-anchor="middle" x="476.0" y="24.0">(다) 둘로 나눔</text><line class="ln-mut" x1="382.0" x2="382.0" y1="36.0" y2="250.0"></line><text class="t t-b t-flag" text-anchor="middle" x="664.0" y="24.0">(라) 샴쌍둥이</text><line class="ln-mut" x1="570.0" x2="570.0" y1="36.0" y2="250.0"></line><rect class="f-panel s-ink-thin" height="140.0" rx="2" width="90.0" x="55.0" y="56.0"></rect><line class="s-if w4" x1="55.0" x2="145.0" y1="56.0" y2="56.0"></line><text class="t t-s" text-anchor="middle" x="100.0" y="228.0">한 가지 일을 완전히</text><rect class="f-panel s-ink-thin" height="140.0" rx="2" width="76.0" x="214.0" y="56.0"></rect><line class="s-if w4" x1="214.0" x2="290.0" y1="56.0" y2="56.0"></line><rect class="f-panel s-ink-thin" height="58.0" rx="2" width="56.0" x="304.0" y="112.0"></rect><line class="s-if w4" x1="304.0" x2="360.0" y1="112.0" y2="112.0"></line><line class="ln" marker-end="url(#a-ink-split)" x1="291.0" x2="330.0" y1="100.0" y2="110.0"></line><text class="t t-xs t-mut" text-anchor="middle" x="332.0" y="98.0">부름</text><text class="t t-s" text-anchor="middle" x="288.0" y="228.0">자식이 홀로 읽히면 좋음</text><circle class="f-bg s-ink-thin" cx="437" cy="52" r="9"></circle><rect class="f-panel s-ink-thin" height="106.0" rx="2" width="58.0" x="408.0" y="90.0"></rect><line class="s-if w4" x1="408.0" x2="466.0" y1="90.0" y2="90.0"></line><line class="ln" marker-end="url(#a-ink-split)" x1="437.0" x2="437.0" y1="62.0" y2="86.0"></line><circle class="f-bg s-ink-thin" cx="507" cy="52" r="9"></circle><rect class="f-panel s-ink-thin" height="106.0" rx="2" width="58.0" x="478.0" y="90.0"></rect><line class="s-if w4" x1="478.0" x2="536.0" y1="90.0" y2="90.0"></line><line class="ln" marker-end="url(#a-ink-split)" x1="507.0" x2="507.0" y1="62.0" y2="86.0"></line><text class="t t-s" text-anchor="middle" x="472.0" y="228.0">호출자는 하나만 부름</text><circle class="f-bg s-ink-thin" cx="664" cy="52" r="9"></circle><rect class="f-panel s-ink-thin" height="62.0" rx="2" width="56.0" x="598.0" y="96.0"></rect><line class="s-if w4" x1="598.0" x2="654.0" y1="96.0" y2="96.0"></line><rect class="f-panel s-ink-thin" height="62.0" rx="2" width="56.0" x="674.0" y="96.0"></rect><line class="s-if w4" x1="674.0" x2="730.0" y1="96.0" y2="96.0"></line><line class="ln" marker-end="url(#a-ink-split)" x1="658.0" x2="630.0" y1="60.0" y2="92.0"></line><line class="ln" marker-end="url(#a-ink-split)" x1="670.0" x2="700.0" y1="60.0" y2="92.0"></line><path class="s-cx w2" d="M628,164 C640,190 690,190 702,164" marker-end="url(#a-cx-split)"></path><text class="t t-xs t-cx" text-anchor="middle" x="664.0" y="202.0">상태를 주고받음</text><text class="t t-s t-flag" text-anchor="middle" x="664.0" y="228.0">함께 불러야만 동작</text></svg></svg>
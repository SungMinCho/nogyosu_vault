<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 480" width="880" height="480" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.fig-svg .tl, .chart .tl{ font-family:var(--f-latin); font-style:italic; }.fig-svg .halo, .chart .halo{ paint-order:stroke; stroke:var(--deep); stroke-width:4px; stroke-linejoin:round; }.c-fire{ fill:var(--fire) !important }.c-pass{ fill:var(--pass) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-fire{ stroke:var(--fire) }.s-pass{ stroke:var(--pass) }.s-caution{ stroke:var(--caution) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-shoal{ fill:var(--shoal) }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.dash{ stroke-dasharray:5 4 }.mk-ink{ fill:var(--ink) }.mk-fire{ fill:var(--fire) }.mk-pass{ fill:var(--pass) }svg.pz-root{width:880px!important;height:480px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="여자, 재화, 말의 세 교환 회로에서 동 쥐앙은 받기만 하고 되돌리는 화살은 끊겨 있다. 석상과의 회로만 세 박자로 닫힌다. 3막 5장 동 쥐앙의 초대, 4막 8장 석상의 방문과 답례 초대, 5막 6장 동 쥐앙의 방문과 손. 하인 스가나렐의 품삯만 남는다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 880 480" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F09-ar-fire" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-fire" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F09-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F09-ar-pass" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-pass" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="tb" text-anchor="middle" x="115" y="24">세 교환 회로</text><text class="ts" text-anchor="middle" x="115" y="41">레비스트로스: 여자 · 재화 · 말</text><text class="tb" text-anchor="middle" x="775" y="24">석상의 초대</text><text class="ts" text-anchor="middle" x="775" y="41">주기 · 받기 · 갚기</text><rect class="s-ink f-deep w15" height="54" rx="2" width="170" x="30" y="63"></rect><text class="tb" text-anchor="middle" x="115" y="86.5"><tspan dy="0" x="115">여자</tspan></text><text class="ts" text-anchor="middle" x="115" y="102.5">엘비르 · 샤를로트 · 마튀린</text><line class="s-pass w15 f-none" marker-end="url(#F09-ar-pass)" x1="208.839" x2="366.055" y1="82.4118" y2="182.677"></line><line class="s-caution w15 dash f-none" x1="356.377" x2="304.103" y1="197.853" y2="164.515"></line><line class="s-caution w2 f-none" x1="288.985" x2="298.985" y1="153.063" y2="163.063"></line><line class="s-caution w2 f-none" x1="288.985" x2="298.985" y1="163.063" y2="153.063"></line><rect class="s-ink f-deep w15" height="54" rx="2" width="170" x="30" y="188"></rect><text class="tb" text-anchor="middle" x="115" y="211.5"><tspan dy="0" x="115">재화</tspan></text><text class="ts" text-anchor="middle" x="115" y="227.5">디망슈 · 걸인</text><line class="s-pass w15 f-none" marker-end="url(#F09-ar-pass)" x1="204" x2="354" y1="206" y2="206"></line><line class="s-caution w15 dash f-none" x1="354" x2="292" y1="224" y2="224"></line><line class="s-caution w2 f-none" x1="275" x2="285" y1="219" y2="229"></line><line class="s-caution w2 f-none" x1="275" x2="285" y1="229" y2="219"></line><rect class="s-ink f-deep w15" height="54" rx="2" width="170" x="30" y="313"></rect><text class="tb" text-anchor="middle" x="115" y="336.5"><tspan dy="0" x="115">말</tspan></text><text class="ts" text-anchor="middle" x="115" y="352.5">약속 · 맹세 · 위선</text><line class="s-pass w15 f-none" marker-end="url(#F09-ar-pass)" x1="199.161" x2="356.377" y1="332.412" y2="232.147"></line><line class="s-caution w15 dash f-none" x1="366.055" x2="313.781" y1="247.323" y2="280.661"></line><line class="s-caution w2 f-none" x1="298.664" x2="308.664" y1="282.113" y2="292.113"></line><line class="s-caution w2 f-none" x1="298.664" x2="308.664" y1="292.113" y2="282.113"></line><text class="ts c-pass halo" text-anchor="middle" x="285" y="196">받음</text><text class="ts c-caution" text-anchor="middle" x="296" y="245">갚지 않음</text><circle class="s-ink f-deep w2" cx="400" cy="215" r="40"></circle><text class="tb" text-anchor="middle" x="400" y="220">동 쥐앙</text><rect class="s-ink f-shoal w15" height="54" rx="2" width="150" x="700" y="188"></rect><text class="tb" text-anchor="middle" x="775" y="211.5"><tspan dy="0" x="775">석상</tspan></text><text class="ts" text-anchor="middle" x="775" y="227.5">기사단장</text><path class="s-ink w15 f-none" d="M432,192 C470,112 650,110 730,184" marker-end="url(#F09-ar-ink)"></path><text class="ts halo" text-anchor="middle" x="560" y="120">① 3막 5장 · 초대(줌)</text><line class="s-ink w15 f-none" marker-end="url(#F09-ar-ink)" x1="696" x2="444" y1
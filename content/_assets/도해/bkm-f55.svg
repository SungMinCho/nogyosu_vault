<rect class="f-paper2" height="44" rx="4" width="100" x="490" y="54"></rect>
<rect class="no-fill ln2" height="44" rx="4" width="100" x="490" y="54"></rect>
<text class="mid b" x="540.0" y="81.0">주식 시장</text>
<line class="ln-time" marker-end="url(#ar-f22c-t)" x1="112" x2="270" y1="76" y2="76"></line>
<text class="t-num mid t-time halo" x="191" y="68">1,000 차입</text>
<line class="ln" marker-end="url(#ar-f22c)" x1="328" x2="488" y1="76" y2="76"></line>
<text class="t-num mid halo" x="408" y="68">1,000 지수 매입</text>
<text class="t-s mid t-ink2" x="300" y="124">선물 1,040에 매도 — 대금 0</text>
<text class="t-s end" x="592" y="132">오늘 순현금 0</text>
<rect class="f-paper2" height="44" rx="4" width="90" x="20" y="214"></rect>
<rect class="no-fill ln2" height="44" rx="4" width="90" x="20" y="214"></rect>
<text class="mid b" x="65.0" y="241.0">은행</text>
<circle class="f-ink-a" cx="300" cy="236" r="26"></circle><circle class="no-fill ln" cx="300" cy="236" r="26"></circle>
<text class="mid b" x="300" y="241">나</text>
<rect class="f-paper2" height="40" rx="4" width="100" x="490" y="190"></rect>
<rect class="no-fill ln2" height="40" rx="4" width="100" x="490" y="190"></rect>
<text class="mid b" x="540.0" y="215.0">주식 시장</text>
<rect class="f-paper2" height="40" rx="4" width="100" x="490" y="252"></rect>
<rect class="no-fill ln2" height="40" rx="4" width="100" x="490" y="252"></rect>
<text class="mid b" x="540.0" y="277.0">청산소</text>
<line class="ln-time" marker-end="url(#ar-f22c-t)" x1="270" x2="112" y1="236" y2="236"></line>
<text class="t-num mid t-time halo" x="191" y="228">1,040 상환</text>
<path class="ln-risk" d="M488,210 C420,210 380,222 328,228" marker-end="url(#ar-f22c-r)"></path>
<text class="t-num mid t-risk halo" x="410" y="200">S<tspan class="t-xs" dy="4">T</tspan><tspan dy="-4"> + 배당 15</tspan></text>
<path class="ln-risk" d="M488,272 C420,272 380,252 328,244" marker-end="url(#ar-f22c-r)"></path>
<text class="t-num mid t-risk halo" x="410" y="296">1,040 − S<tspan class="t-xs" dy="4">T</tspan></text>
<text class="t-num mid" x="300" y="326">(<tspan class="t-risk">S<tspan class="t-xs" dy="4">T</tspan></tspan><tspan dy="-4"> + 15) + (1,040 − </tspan><tspan class="t-risk">S<tspan class="t-xs" dy="4">T</tspan></tspan><tspan dy="-4">) − 1,040 = </tspan><tspan class="t-alarm b">+15</tspan></text>
</svg></g></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 470" width="640" height="470" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --flour:#EFF0EB; --flour-2:#E6E8E1; --ink:#1C2025; --ink-soft:#4E555D; --rule:#C7CAC1;
  --iron:#3D4652; --water:#1B7480; --spirit:#6448B0; --grain:#A8721A; --rust:#BF4128;
  --water-t:rgba(27,116,128,.12); --spirit-t:rgba(100,72,176,.11); --grain-t:rgba(168,114,26,.13); --rust-t:rgba(191,65,40,.10); --iron-t:rgba(61,70,82,.10);
  --shadow:rgba(28,32,37,.18);
  --display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --body:"Newsreader","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --label:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","Nanum Gothic Coding",ui-monospace,Menlo,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }}:root[data-theme="dark"]{
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents }.lec-no svg{ width:2.2rem; height:2.2rem; flex:none }.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; overflow-y:hidden; border-block:1px solid var(--rule); padding-block:.8rem; background:linear-gradient(to right, var(--flour) 30%, transparent), linear-gradient(to left, var(--flour) 30%, transparent) 100% 0, radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) 100% 0; background-repeat:no-repeat; background-size:2.2rem 100%, 2.2rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; margin-inline:auto; max-width:46rem }.t{ fill:var(--ink); font-family:var(--label); font-size:13px }.t-soft{ fill:var(--ink-soft) }.t-iron{ fill:var(--iron) }.t-water{ fill:var(--water) }.t-spirit{ fill:var(--spirit) }.t-grain{ fill:var(--grain) }.t-rust{ fill:var(--rust) }.t-b{ font-weight:600 }.t-sm{ font-size:11.5px }.t-lg{ font-size:15px }.t-mono{ font-family:var(--mono) }.s-soft{ stroke:var(--ink-soft); fill:none }.s-rule{ stroke:var(--rule); fill:none }.s-iron{ stroke:var(--iron); fill:none }.s-water{ stroke:var(--water); fill:none }.s-spirit{ stroke:var(--spirit); fill:none }.s-grain{ stroke:var(--grain); fill:none }.s-rust{ stroke:var(--rust); fill:none }.f-bg{ fill:var(--flour) }.f-panel{ fill:var(--flour-2) }.f-soft{ fill:var(--ink-soft) }.f-water{ fill:var(--water) }.f-spirit{ fill:var(--spirit) }.f-grain{ fill:var(--grain) }.f-iron-t{ fill:var(--iron-t) }.f-water-t{ fill:var(--water-t) }.f-spirit-t{ fill:var(--spirit-t) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.dash{ stroke-dasharray:5 4 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="같은 '지능'이라도 두 칸은 다르다. LLM은 바깥의 손실로 묶음 훈련된 뒤 가중치가 고정되고 격리 탱크에서 출력만 내보내는 열린 고리다. 바흐가 보는 마음은 필요가 관련성을 정하고 세계와 실시간으로 고리를 닫는다." data-min="560" height="100%" role="img" style="" viewBox="0 0 640 470" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="f24-w" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-water" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f24-g" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-grain" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f24-k" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-soft" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f24-s" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spirit" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 머리 -->
<text class="t t-b t-lg t-water" text-anchor="middle" x="165" y="24">LLM — 열린 고리</text>
<text class="t t-b t-lg t-spirit" text-anchor="middle" x="475" y="24">바흐가 보는 마음 — 닫힌 고리</text>
<!-- ================= 왼쪽: 열린 고리 ================= -->
<rect class="f-panel" height="226" rx="4" width="290" x="20" y="36"></rect>
<!-- 바깥에서 받은 손실 -->
<rect class="f-bg s-grain w15" height="26" rx="3" width="90" x="117" y="46"></rect>
<text class="t t-sm t-grain" text-anchor="middle" x="162" y="64">손실 L</text>
<text class="t t-sm t-soft" x="215" y="64">설계자가 정함</text>
<line class="s-grain w15" marker-end="url(#f24-g)" x1="162" x2="162" y1="72" y2="110"></line>
<!-- 격리 탱크 -->
<rect class="s-iron w15 dash" height="80" rx="4" width="202" x="30" y="90"></rect>
<text class="t t-sm t-iron" x="38" y="162">격리 탱크</text>
<rect class="f-bg s-soft w1" height="30" rx="3" width="58" x="38" y="112"></rect>
<text class="t t-sm t-soft" text-anchor="middle" x="67" y="131">글 더미</text>
<line class="s-water w15" marker-end="url(#f24-w)" x1="96" x2="110" y1="127" y2="127"></line>
<rect class="f-water-t s-water w15" height="30" rx="3" width="100" x="112" y="112"></rect>
<text class="t t-sm t-water" text-anchor="middle" x="148" y="131">가중치 θ</text>
<!-- 자물쇠: 고정 -->
<rect class="f-water" height="11" rx="1.5" width="14" x="188" y="124"></rect>
<path class="s-water w15" d="M191,124 v-4 a4,4 0 0 1 8,0 v4"></path>
<!-- 다음 토큰 → 조수 -->
<line class="s-water w15" marker-end="url(#f24-w)" x1="212" x2="264" y1="127" y2="127"></line>
<text class="t t-sm t-water" text-anchor="middle" x="250" y="118">토큰</text>
<g class="s-soft w15 dash">
<circle cx="284" cy="114" r="7"></circle>
<path d="M284,121 v20 M274,129 h20 M284,141 l-8,12 M284,141 l8,12"></path>
</g>
<text class="t t-sm t-soft" text-anchor="middle" x="284" y="174">'조수'</text>
<!-- 세계 -->
<rect class="f-iron-t s-iron w15" height="28" rx="3" width="100" x="112" y="222"></rect>
<text class="t t-iron" text-anchor="middle" x="162" y="241">세계</text>
<!-- 출력은 나가기만 -->
<path class="s-soft w15 dash" d="M284,182 V236 H216" marker-end="url(#f24-k)"></path>
<text class="t t-sm t-soft" text-anchor="end" x="276" y="212">출력만</text>
<!-- 돌아오는 길은 끊김 -->
<path class="s-soft w15" d="M112,236 C70,236 66,206 66,192"></path>
<path class="s-soft w15" d="M66,184 L66,174" marker-end="url(#f24-k)"></path>
<line class="s-rust w2" x1="56" x2="76" y1="192" y2="184"></line>
<line class="s-rust w2" x1="56" x2="76" y1="198" y2="190"></line>
<text class="t t-sm t-rust" x="84" y="202">실재와 끊김</text>
<!-- ================= 오른쪽: 닫힌 고리 ================= -->
<rect class="f-spirit-t" height="226" rx="4" width="290" x="330" y="36"></rect>
<!-- 필요 체계 -->
<rect class="f-bg s-grain w15" height="26" rx="3" width="90" x="430" y="46"></rect>
<text class="t t-sm t-grain" text-anchor="middle" x="475" y="64">필요 체계</text>
<text class="t t-sm t-soft" x="528" y="64">안에서 정함</text>
<line class="s-grain w15" marker-end="url(#f24-g)" x1="475" x2="475" y1="72" y2="94"></line>
<!-- 지금의 거품 -->
<ellipse class="f-bg s-spirit w2" cx="475" cy="134" rx="76" ry="38"></ellipse>
<text class="t t-sm t-spirit t-b" text-anchor="middle" x="475" y="122">지금</text>
<text class="t t-sm t-spirit" text-anchor="middle" x="475" y="140">정합성 최적화</text>
<!-- 자기조직: 세포에서 바깥으로 -->
<g class="f-spirit">
<circle cx="452" cy="156" r="2.6"></circle><circle cx="462" cy="160" r="2.6"></circle><circle cx="472" cy="157" r="2.6"></circle>
<circle cx="482" cy="161" r="2.6"></circle><circle cx="492" cy="157" r="2.6"></circle><circle cx="502" cy="160" r="2.6"></circle>
</g>
<!-- 고리: 지각 / 행동 -->
<path class="s-water w2" d="M426,236 C362,236 356,134 393,134" marker-end="url(#f24-w)"></path>
<text class="t t-sm t-water" x="384" y="208">지각</text>
<path class="s-water w2" d="M552,134 C596,134 590,236 528,236" marker-end="url(#f24-w)"></path>
<text class="t t-sm t-water" text-anchor="end" x="566" y="208">행동</text>
<rect class="f-iron-t s-iron w15" height="28" rx="3" width="98" x="426" y="222"></rect>
<text class="t t-iron" text-anchor="middle" x="475" y="241">세계</text>
<text class="t t-sm t-soft" text-anchor="middle" x="475" y="208">실시간 고리</text>
<!-- ================= 다섯 쌍 ================= -->
<line class="s-rule w1" x1="20" x2="620" y1="282" y2="282"></line>
<g class="s-rule w1">
<line x1="20" x2="620" y1="318" y2="318"></line><line x1="20" x2="620" y1="354" y2="354"></line>
<line x1="20" x2="620" y1="390" y2="390"></line><line x1="20" x2="620" y1="426" y2="426"></line>
</g>
<line class="s-rule w1" x1="20" x2="620" y1="462" y2="462"></line>
<g>
<text class="t t-sm t-soft t-mono" text-anchor="middle" x="320" y="305">1</text>
<text class="t t-sm t-soft t-mono" text-anchor="middle" x="320" y="341">2</text>
<text class="t t-sm t-soft t-mono" text-anchor="middle" x="320" y="377">3</text>
<text class="t t-sm t-soft t-mono" text-anchor="middle" x="320" y="413">4</text>
<text class="t t-sm t-soft t-mono" text-anchor="middle" x="320" y="449">5</text>
</g>
<text class="t t-water" text-anchor="end" x="300" y="305">다음 토큰 예측</text>
<text class="t t-grain" text-anchor="end" x="300" y="341">바깥에서 받은 손실</text>
<text class="t t-water" text-anchor="end" x="300" y="377">묶음 훈련 · 고정된 가중치</text>
<text class="t t-iron" text-anchor="end" x="300" y="413">격리 탱크 — 실재와 끊긴 입력</text>
<text class="t t-soft" text-anchor="end" x="300" y="449">행위자는 예측의 부산물(딥페이크)</text>
<text class="t t-spirit" x="340" y="305">정합성 최적화</text>
<text class="t t-grain" x="340" y="341">필요 체계가 정하는 관련성</text>
<text class="t t-water" x="340" y="377">실시간 결합 · 실시간 학습</text>
<text class="t t-spirit" x="340" y="413">안에서 바깥으로의 자기조직</text>
<text class="t t-spirit" x="340" y="449">2차 지각이 세우는 지금</text>
</svg></svg>
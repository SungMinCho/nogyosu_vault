  background-position:left center,right center,left center,right center; background-repeat:no-repeat;
  background-size:1.5rem 100%,1.5rem 100%,.6rem 100%,.6rem 100%; background-attachment:local,local,scroll,scroll }.dg{ display:block; width:100%; height:auto }.dg .t, .hero-svg .t{ font-family:var(--f-label); font-size:13px; fill:var(--ink) }.dg .t-b, .hero-svg .t-b{ font-weight:700 }.dg .t-m{ font-family:var(--f-mono) }.dg .t-if, .hero-svg .t-if{ fill:var(--if) }.dg .t-flag{ fill:var(--flag) }.dg line, .dg polyline, .dg path, .hero-svg line, .hero-svg polyline, .hero-svg path{ fill:none }.f-ink{ fill:var(--ink)!important }.f-mut{ fill:var(--muted)!important }.f-bg{ fill:var(--bg)!important }.f-panel{ fill:var(--panel)!important }.f-if{ fill:var(--if)!important }.f-if-deep{ fill:var(--if-deep)!important }.ln{ stroke:var(--ink); stroke-width:1.4 }.ln-hair{ stroke:var(--rule); stroke-width:1 }.ln-mut{ stroke:var(--rule); stroke-width:1.2 }.s-ink-thin{ stroke:var(--ink); stroke-width:1 }.s-rule{ stroke:var(--rule); stroke-width:1 }.s-if{ stroke:var(--if); stroke-width:1.4 }.s-cx{ stroke:var(--cx); stroke-width:1.4 }.dash{ stroke-dasharray:4 3 }svg.pz-root{width:760px!important;height:280px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-
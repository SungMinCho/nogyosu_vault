<line class="s-mute w-thin" marker-end="url(#ah-1503m)" marker-start="url(#ah-1503m)" x1="136" x2="620" y1="44" y2="44"></line>
<text class="t-lab" x="136" y="32">잠재</text>
<text class="t-lab a-end" x="620" y="32">현실</text>
<text class="t-small a-mid" x="336" y="32">실행의 문턱</text>
<line class="s-mute dash" x1="336" x2="336" y1="52" y2="290"></line>
<rect class="f-moon-soft" height="238" width="284" x="336" y="52"></rect>
<text class="t-lab" x="16" y="108">고전 권력</text>
<text class="t-small" x="16" y="124">냉전 · 상호확증파괴</text>
<text class="t-lab" x="16" y="234">테러와의 전쟁</text>
<text class="t-small" x="16" y="250">항구적 비상사태</text>
<circle class="s-moon w-bold" cx="168" cy="112" r="9"></circle>
<text class="t-small a-mid" x="168" y="138">권력</text>
<line class="s-moon" x1="177" x2="201" y1="112" y2="112"></line>
<circle class="f-moon" cx="206" cy="112" r="5"></circle>
<line class="s-moon dot" x1="214" x2="320" y1="112" y2="112"></line>
<line class="s-ink w-bold" x1="326" x2="326" y1="102" y2="122"></line>
<text class="t-lab a-mid" x="267" y="98">"어디 두고 봐!"</text>
<text class="t-small a-mid" x="267" y="136">실행되지 않아야 작동</text>
<text class="t-small a-mid" x="478" y="116">아무것도 실행되지 않는다</text>
<line class="s-mute dash" marker-end="url(#ah-1503m)" x1="204" x2="180" y1="120" y2="224"></line>
<text class="t-small" x="212" y="178">위협의 자리가</text>
<text class="t-small" x="212" y="193">바깥으로 옮겨 감</text>
<circle class="s-gap dash f-gap-soft" cx="176" cy="238" r="11"></circle>
<text class="t-small c-gap a-mid" x="176" y="268">보이지 않는 적</text>
<line class="s-mute dot" marker-end="url(#ah-1503m)" x1="190" x2="273" y1="238" y2="238"></line>
<text class="t-small a-mid" x="231" y="226">"저들이 노린다"</text>
<circle class="s-moon w-bold" cx="286" cy="238" r="9"></circle>
<text class="t-small a-mid" x="286" y="268">권력</text>
<line class="s-moon w-bold" marker-end="url(#ah-1503n)" x1="298" x2="360" y1="238" y2="238"></line>
<circle class="f-moon" cx="368" cy="238" r="4.5"></circle>
<line class="s-moon w-bold" marker-end="url(#ah-1503n)" x1="380" x2="442" y1="238" y2="238"></line>
<circle class="f-moon" cx="450" cy="238" r="4.5"></circle>
<line class="s-moon w-bold" marker-end="url(#ah-1503n)" x1="462" x2="524" y1="238" y2="238"></line>
<circle class="f-moon" cx="532" cy="238" r="4.5"></circle>
<text class="t-lab" x="546" y="243">…</text>
<text class="t-lab a-mid c-moon" x="486" y="220">우리의 대응 조치 — 끝없이 실행</text>
<text class="t-small a-mid" x="486" y="268">선제공격 · 구금 · 감시</text>
<text class="t-small a-mid" x="486" y="284">민주주의에 대한 진짜 위협은 이 조치들</text>
<line class="s-mute w-thin" x1="16" x2="624" y1="306" y2="306"></line>
<text class="t-lab" x="16" y="332">니체 『방랑자와 그의 그림자』 284절</text>
<text class="t-small" x="16" y="352">어느 나라도 정복용이라 하지 않는다 — 모두 "방어용"</text>
<text class="t-small" x="16" y="368">방어는 나의 선함과 이웃의 악함을 깔고서야 선다</text>
<text class="t-small" x="16" y="384">서로의 악의를 전제하는 이 대칭이 전쟁의 원인</text>

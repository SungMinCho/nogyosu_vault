5"></line><line class="s-ink2" stroke-width="1" x1="285" x2="285" y1="150" y2="155"></line><line class="s-ink2" stroke-width="1" x1="355" x2="355" y1="150" y2="155"></line><line class="s-ink2" stroke-width="1" x1="425" x2="425" y1="150" y2="155"></line><text class="t-ink3" style="font-size:10.5px" text-anchor="middle" x="425" y="170">108</text><line class="s-ink2" stroke-width="1" x1="495" x2="495" y1="150" y2="155"></line><line class="s-ink2" stroke-width="1" x1="565" x2="565" y1="150" y2="155"></line><text class="t-ink3" style="font-size:10.5px" text-anchor="middle" x="565" y="170">116</text><line class="s-step" stroke-width="3" x1="215" x2="215" y1="136" y2="164"></line><text class="t-step" style="font-size:13px;font-weight:600" text-anchor="middle" x="215" y="182">96</text><line class="s-step" stroke-width="3" x1="495" x2="495" y1="136" y2="164"></line><text class="t-step" style="font-size:13px;font-weight:600" text-anchor="middle" x="495" y="182">112</text><text class="t-ink2" style="font-size:10.5px" text-anchor="middle" x="215" y="198">대표값</text><text class="t-ink2" style="font-size:10.5px" text-anchor="middle" x="495" y="198">대표값</text><line class="s-ink2" stroke-dasharray="3 3" stroke-width="1.2" x1="355" x2="355" y1="52" y2="156"></line><text class="t-ink2" style="font-size:10.5px" text-anchor="middle" x="355" y="172">경계 104</text><rect class="f-step-soft s-step" height="18" rx="2" stroke-width="1" width="210" x="145" y="86"></rect><rect class="f-fix-soft s-fix" height="18" rx="2" stroke-width="1" width="70" x="355" y="86"></rect><text class="t-ink2" style="font-size:11px" text-anchor="middle" x="250" y="78">x + d 가 떨어질 곳: 92 ~ 108 (폭 Δ = 16)</text><text class="t-step" style="font-size:11.5px;font-weight:600" text-anchor="middle" x="250" y="99">¾ → 96</text><text class="t-fix" style="font-size:11px;font-weight:600" text-anchor="middle" x="390" y="99">¼ → 112</text><path class="s-step" d="M197.5,104 Q197.5,126 215,134" marker-end="url(#dither-a-step)" stroke-width="1.3"></path><path class="s-fix" d="M407.5,104 Q460,122 495,134" marker-end="url(#dither-a-fix)" stroke-width="1.3"></path><circle class="f-sig ring" cx="285" cy="150" r="6"></circle><text class="t-sig" style="font-size:12px;font-weight:600" text-anchor="middle" x="285" y="136">x = 100</text><text class="t-ink" style="font-size:11.5px" text-anchor="middle" x="320" y="226">평균 = 112 × ¼ + 96 × ¾ = 100   ·   최근접 반올림은 언제나 96 (오차 −4가 체계적으로 쌓임)</text></svg></g></g></g></g></svg>
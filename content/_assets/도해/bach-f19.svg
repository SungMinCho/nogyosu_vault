<text class="t t-sm t-soft" x="420" y="172">g를 쥐고 고쳐 쓴다</text>
<text class="t t-sm" x="420" y="108">지각·동기 — 표상임을 안다</text>
<text class="t t-sm t-soft" x="420" y="124">생성하는 마음과의 경계가 녹음</text>
<text class="t t-sm" x="420" y="60">자기 — 행위자 소프트웨어로</text>
<text class="t t-sm t-soft" x="420" y="76">신들·유령들 — 사변</text>
<!-- 정정 쪽지 -->
<rect class="f-rust-t" height="52" rx="4" width="600" x="20" y="390"></rect>
<text class="t t-sm t-rust t-b" x="34" y="411">바흐: 위계로 읽지 말 것 — 비선형(건너뛰고 되돌아감), 비규범(높을수록 낫지 않음)</text>
<text class="t t-sm t-soft" x="34" y="430">다만 '길든 어른'·'지혜' 같은 이름표는 이미 순위를 풍긴다 · 85%는 대담 속 어림수</text>

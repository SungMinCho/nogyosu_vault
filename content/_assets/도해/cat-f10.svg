  --shadow:rgba(0,0,0,.55); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.mast .fig{ margin-top:.6rem }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:.5rem 3rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin:0 }.frame{ overflow-x:auto; overflow-y:hidden; padding-block:.4rem; border-block:1px solid var(--rule);
  background-color:var(--paper);
  background-image:linear-gradient(to right,var(--paper) 30%,transparent),linear-gradient(to left,var(--paper) 30%,transparent),
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent),radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent);
  background-position:left center,right center,left center,right center;
  background-size:40px 100%,40px 100%,14px 100%,14px 100%;
  background-repeat:no-repeat; background-attachment:local,local,scroll,scroll; }.frame svg{ display:block; width:100%; min-width:var(--svgmin,520px); height:auto }.dg{ font-family:var(--f-label); font-size:13px }.dg text{ fill:var(--ink) }.dg .t-s{ font-size:12px }.dg .t-xs{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-num{ font-family:var(--f-mono); font-size:11.5px; font-variant-numeric:tabular-nums }.dg .t-mute{ fill:var(--mute) }.dg .t-on{ fill:var(--paper) }.dg .t-verd{ fill:var(--verd) }.dg .t-verm{ fill:var(--verm) }.dg .s-ink{ stroke:var(--ink) }.dg .s-verd{ stroke:var(--verd) }.dg .s-verm{ stroke:var(--verm) }.dg .f-none{ fill:none }.dg .f-verd{ fill:var(--verd) }.dg .f-verd-soft{ fill:var(--verd-soft) }.card-big.t-verm{ color:var(--verm) }.card-big.t-verd{ color:var(--verd) }.hero-dg .t-num{ font-size:14px }.hero-dg .t-s{ font-size:13.5px }svg.pz-root{width:640px!important;height:230px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="두 줄의 누적 막대. 퍼플렉시티: 학습 없는 CAT가 56퍼센트, 학습으로 20퍼센트 더, 25퍼센트 남음
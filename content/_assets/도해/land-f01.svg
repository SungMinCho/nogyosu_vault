<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 320" width="760" height="320" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-s{ font-size:11.5px }.fig .t-m{ font-size:13.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-sunhi{ fill:var(--sun-hi) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-blood{ fill:var(--blood) }.fig .s-mute{ stroke:var(--ink-2) }.fig .s-rule{ stroke:var(--rule) }.fig .s-sun{ stroke:var(--sun) }.fig .s-sunhi{ stroke:var(--sun-hi) }.fig .w1{ stroke-width:1 }.fig .w25{ stroke-width:2.5 }.fig .dash{ stroke-dasharray:5 4 }.fig .op6{ opacity:.6 }.fig .op3{ opacity:.3 }svg.pz-root{width:760px!important;height:320px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="해가 내놓는 빛 가운데 지구에 닿는 몫은 22억분의 1이지만, 그것만으로도 인류 문명 전체가 쓰는 에너지의 약 8,500배다." class="pz-inner" height="100%" role="img" style="--minw:699px" viewBox="0 0 760 320" width="100%"><defs><marker id="sun-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="sun-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="sun-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="sun-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="sun-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="sun-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><line class="s-sunhi w1 op6" x1="129.515" x2="343.55" y1="122.687" y2="-38.599"></line><line class="s-sunhi w1 op3 dash" x1="343.55" x2="399.454" y1="-38.599" y2="-80.726"></line><line class="s-sunhi w1 op6" x1="133.909" x2="366.933" y1="129.376" y2="-3.00082"></line><line class="s-sunhi w1 op3 dash" x1="366.933" x2="427.7
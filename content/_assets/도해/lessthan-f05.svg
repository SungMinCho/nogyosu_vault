<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 2 900 438" width="900" height="438" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#ECEAF0; --panel:#F7F6F9; --ink:#1D1A26; --muted:#5B5668; --rule:#C9C5D2; --rule-2:#DCD9E2;
  --red:#B42318;   --red-fill:#F3D3CE;
  --flesh:#995532; --flesh-fill:#ECCFBC;
  --cob:#2B4A9B;   --cob-fill:#D3DBF1;
  --verd:#1F6F62;  --verd-fill:#CDE7E1;
  --void:#17141F;  --on-void:#F2EEF7;
  --display-ko:"Hahmlet","Noto Serif KR","Noto Serif CJK KR",serif;
  --body:"Noto Serif KR","Noto Serif CJK KR","Apple SD Gothic Neo",serif;
  --display-la:"GFS Didot","Didot","Bodoni 72","Noto Serif",serif;
  --sans:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Red Hat Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }svg.fig{display:block;width:100%;height:auto;font-family:var(--sans);overflow:visible}svg.fig text{font-family:var(--sans);font-size:14px;fill:var(--ink)}svg.fig .t-s{font-size:12px}svg.fig .t-l{font-size:17px}svg.fig .t-b{font-weight:700}svg.fig .t-mid{text-anchor:middle}svg.fig .t-end{text-anchor:end}svg.fig .t-muted{fill:var(--muted)}svg.fig .f-panel{fill:var(--panel)}svg.fig .f-red{fill:var(--red)}svg.fig .f-redf{fill:var(--red-fill)}svg.fig .f-flesh{fill:var(--flesh)}svg.fig .f-cob{fill:var(--cob)}svg.fig .f-cobf{fill:var(--cob-fill)}svg.fig .f-none{fill:none}svg.fig .s-ink{stroke:var(--ink)}svg.fig .s-muted{stroke:var(--muted)}svg.fig .s-red{stroke:var(--red)}svg.fig .s-cob{stroke:var(--cob)}svg.fig .w15{stroke-width:1.5px}svg.fig .w2{stroke-width:2px}svg.fig .dash{stroke-dasharray:6 5}:root{ --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2); }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{max-width:560px;margin-inline:auto}.doc{padding-inline:var(--pad)}.lecture{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-block:2.5rem 3rem;
  content-visibility:auto;border-top:1px solid var(--rule)}.fig-wrap{margin:.8rem 0 !important}.fig-scroll{overflow-x:auto;background:
  linear-gradient(to right,var(--panel) 30%,transparent) left center/2.2rem 100% no-repeat local,
  linear-gradient(to left,var(--panel) 30%,transparent) right center/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) left center/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) right center/.8rem 100% no-repeat scroll,
  var(--panel);padding:1rem .9rem .6rem}.fig-inner{width:100%}svg.pz-root{width:900px!important;height:438px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig-wrap"><g class="pz-w fig-scroll"><g class="pz-w fig-inner"><svg xmlns="http://www.w3.org/2000/svg" aria-label="여덟 가설을 두 판으로 펼치면 긍정과 부정은 있다·없다가 아니라 is·there is를 따라 갈리고, 부록은 가설 1과 2 사이 갈림선 위에 떠 있는 몫 없는 몫이다" class="fig pz-inner" height="392" role="img" style="x:0px!important;y:48px!important;width:900px!important;height:392px!important;overflow:visible!important" viewBox="0 48 900 392" width="900" x="0" y="48">
<!-- 갈림선 is / there is (판 뒤로 길게) -->
<line class="s-ink w2" x1="20" x2="895" y1="194" y2="194"></line>
<!-- 있다/없다 사이 -->
<line class="s-muted w15 dash" x1="480" x2="480" y1="58" y2="292"></line>
<!-- 판 제목과 열 머리 -->
<text class="t-mid t-b" x="310" y="72">하나가 있다면</text>
<text class="t-mid t-b" x="650" y="72">하나가 있지 않다면</text>
<text class="t-mid t-s t-muted" x="240" y="100">하나에 대해</text>
<text class="t-mid t-s t-muted" x="380" y="100">타자들에 대해</text>
<text class="t-mid t-s t-muted" x="580" y="100">하나에 대해</text>
<text class="t-mid t-s t-muted" x="720" y="100">타자들에 대해</text>
<!-- 행 이름 -->
<text class="t-end t-b" x="160" y="142">is</text>
<text class="t-end t-s" x="160" y="160">존재를 술어로</text>
<text class="t-end t-b" x="160" y="238">there is</text>
<text class="t-end t-s" x="160" y="256">존재 바깥에</text>
<text class="t-b f-cob" x="802" y="152">+ 술어 가능</text>
<text class="t-b f-red" x="802" y="248">− 술어 불가</text>
<!-- 위 행: + -->
<rect class="f-cobf" height="72" rx="4" width="136" x="172" y="110"></rect>
<rect class="f-cobf" height="72" rx="4" width="136" x="312" y="110"></rect>
<rect class="f-cobf" height="72" rx="4" width="136" x="512" y="110"></rect>
<rect class="f-cobf" height="72" rx="4" width="136" x="652" y="110"></rect>
<!-- 아래 행: − -->
<rect class="f-redf" height="72" rx="4" width="136" x="172" y="206"></rect>
<rect class="f-redf" height="72" rx="4" width="136" x="312" y="206"></rect>
<rect class="f-redf" height="72" rx="4" width="136" x="512" y="206"></rect>
<rect class="f-redf" height="72" rx="4" width="136" x="652" y="206"></rect>
<!-- 가설들 -->
<text class="t-mid t-l t-b f-cob" x="240" y="134">2</text>
<text class="t-mid t-s" x="240" y="154">One is</text>
<text class="t-mid t-s t-muted" x="240" y="172">하나는 존재한다</text>
<text class="t-mid t-l t-b f-cob" x="380" y="134">3</text>
<text class="t-mid t-s" x="380" y="154">One is</text>
<text class="t-mid t-s t-muted" x="380" y="172">하나는 존재한다</text>
<text class="t-mid t-l t-b f-cob" x="580" y="134">5</text>
<text class="t-mid t-s" x="580" y="154">One is not</text>
<text class="t-mid t-s t-muted" x="580" y="172">하나는 존재하지 않는다</text>
<text class="t-mid t-l t-b f-cob" x="720" y="134">7</text>
<text class="t-mid t-s" x="720" y="154">One is not</text>
<text class="t-mid t-s t-muted" x="720" y="172">하나는 존재하지 않는다</text>
<text class="t-mid t-l t-b f-red" x="240" y="230">1</text>
<text class="t-mid t-s" x="240" y="250">There is One</text>
<text class="t-mid t-s t-muted" x="240" y="268">하나가 있다</text>
<text class="t-mid t-l t-b f-red" x="380" y="230">4</text>
<text class="t-mid t-s" x="380" y="250">There is One</text>
<text class="t-mid t-s t-muted" x="380" y="268">하나가 있다</text>
<text class="t-mid t-l t-b f-red" x="580" y="230">6</text>
<text class="t-mid t-s" x="580" y="250">There is no One</text>
<text class="t-mid t-s t-muted" x="580" y="268">하나가 없다</text>
<text class="t-mid t-l t-b f-red" x="720" y="230">8</text>
<text class="t-mid t-s" x="720" y="250">There is no One</text>
<text class="t-mid t-s t-muted" x="720" y="268">하나가 없다</text>
<!-- 부록: 1–2 사이 갈림선 위 -->
<rect class="f-panel" height="20" width="125" x="235" y="184"></rect>
<circle class="f-flesh" cx="226" cy="194" r="7"></circle>
<text class="t-s t-b f-flesh" x="240" y="198">부록 · 몫 없는 몫</text>
<text class="t-mid t-s t-muted" x="480" y="314">있다 / 없다로는 갈리지 않는다</text>
<!-- 귀퉁이: 돌라르의 두 원 -->
<text class="t-mid t-s t-muted" x="150" y="338">돌라르의 두 원</text>
<circle class="f-none s-muted w15" cx="174" cy="388" r="40"></circle>
<path class="f-redf s-red w15" d="M150,356 A40,40 0 1 0 150,420 A40,40 0 0 1 150,356 Z"></path>
<path class="f-cobf s-cob w15" d="M150,356 A40,40 0 0 1 150,420 A40,40 0 0 1 150,356 Z"></path>
<text class="t-mid t-b f-red" x="110" y="393">1</text>
<text class="t-mid t-s t-b f-cob" x="150" y="393">2</text>
<text class="t-end t-s" x="80" y="374">하나</text>
<text class="t-s" x="220" y="374">존재</text>
</svg></g></g></g></g></g></svg>
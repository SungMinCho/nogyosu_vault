<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 306" width="700" height="306" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#E8ECE6; --panel:#F2F5F0; --grid:#D3DBD0; --grid-2:#BDC9B9;
  --ink:#1B2024; --ink-2:#4A545B; --ink-3:#6B767C;
  --copy:#3A4C98; --prop:#0B7367; --code:#8E6208; --alarm:#A63B28;
  --copy-soft:rgba(58,76,152,.14); --prop-soft:rgba(11,115,103,.14);
  --code-soft:rgba(142,98,8,.14); --alarm-soft:rgba(166,59,40,.13);
  --shade:rgba(27,32,36,.07);
  --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2);
  --f-disp:"Orbit","Do Hyeon","Nanum Gothic",sans-serif;
  --f-body:"Source Serif 4","Nanum Myeongjo","Noto Serif CJK KR","Noto Serif KR",serif;
  --f-mono:"Martian Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
  --f-lab:"Nanum Gothic Coding","Noto Sans Mono CJK KR","Noto Sans CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#111514; --panel:#171C1B; --grid:#1F2725; --grid-2:#2B3532;
    --ink:#E1E6E0; --ink-2:#AAB4AE; --ink-3:#86918B;
    --copy:#93A5F2; --prop:#43BCA9; --code:#D9A43E; --alarm:#E4795F;
    --copy-soft:rgba(147,165,242,.16); --prop-soft:rgba(67,188,169,.16);
    --code-soft:rgba(217,164,62,.15); --alarm-soft:rgba(228,121,95,.15);
    --shade:rgba(225,230,224,.07);
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111514; --panel:#171C1B; --grid:#1F2725; --grid-2:#2B3532;
  --ink:#E1E6E0; --ink-2:#AAB4AE; --ink-3:#86918B;
  --copy:#93A5F2; --prop:#43BCA9; --code:#D9A43E; --alarm:#E4795F;
  --copy-soft:rgba(147,165,242,.16); --prop-soft:rgba(67,188,169,.16);
  --code-soft:rgba(217,164,62,.15); --alarm-soft:rgba(228,121,95,.15);
  --shade:rgba(225,230,224,.07);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero svg{ display:block; width:100%; height:auto }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:1rem 3rem }.lecture{ display:contents }figure.fig{ margin:.6rem 0 !important }.fig-frame{ overflow-x:auto; border:1px solid var(--grid-2); background-color:var(--panel);
  background-image:
    linear-gradient(90deg,var(--panel) 30%,rgba(0,0,0,0)),
    linear-gradient(90deg,rgba(0,0,0,0),var(--panel) 70%) 100% 0,
    radial-gradient(farthest-side at 0 50%,var(--shade),rgba(0,0,0,0)),
    radial-gradient(farthest-side at 100% 50%,var(--shade),rgba(0,0,0,0)) 100% 0,
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,repeat,repeat;
  background-size:40px 100%,40px 100%,14px 100%,14px 100%,12px 12px,12px 12px;
  background-attachment:local,local,scroll,scroll,local,local; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; color:var(--ink) }.fig-frame text, .hero text{ font-family:var(--f-lab); fill:var(--ink); font-size:12px }text.s{ font-size:11px }text.xs{ font-size:10px }text.l{ font-size:14px }text.xl{ font-size:18px }text.b{ font-weight:700 }text.mut{ fill:var(--ink-2) }text.halo{ paint-order:stroke fill; stroke:var(--panel) !important; stroke-width:6px; stroke-linejoin:round }text.he{ font-family:"Noto Serif Hebrew","Noto Sans Hebrew","Times New Roman",serif; font-size:30px }.t-code{ fill:var(--code) !important }.s-ink{ stroke:var(--ink); fill:none }.s-prop{ stroke:var(--prop); fill:none }.s-code{ stroke:var(--code); fill:none }.f-paper{ fill:var(--panel) }.m-ink{ fill:var(--ink) }.m-copy{ fill:var(--copy) }.m-prop{ fill:var(--prop) }.m-code{ fill:var(--code) }.m-alarm{ fill:var(--alarm) }.m-mut{ fill:var(--ink-3) }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="난초와 말벌의 네 걸음. 탈영토화와 재영토화가 번갈아 서로를 원인으로 삼으며 돈다. 누가 먼저라고 할 수 없는 회로가 리좀이고, 그 만남이 낳는 연결이 코드의 잉여가치다." height="100%" role="img" viewBox="0 0 700 306" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f09-a-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-ink" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f09-a-copy" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-copy" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f09-a-prop" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-prop" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f09-a-code" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-code" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f09-a-alarm" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-alarm" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="f09-a-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="m-mut" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><rect class="f-paper s-prop w2" height="50.0" rx="3" width="240.0" x="230.0" y="30.0"></rect><text class="s b" text-anchor="start" x="240.0" y="50.0">① 난초</text><text class="xs" text-anchor="start" x="240.0" y="69.0">암컷 말벌의 모습·냄새를 꽃에 새긴다</text><rect class="f-paper s-code w2" height="50.0" rx="3" width="240.0" x="446.0" y="124.0"></rect><text class="s b" text-anchor="start" x="456.0" y="144.0">② 말벌</text><text class="xs" text-anchor="start" x="456.0" y="163.0">수컷의 짝짓기 충동이 가짜 암컷에 붙는다</text><rect class="f-paper s-prop w2" height="50.0" rx="3" width="240.0" x="230.0" y="218.0"></rect><text class="s b" text-anchor="start" x="240.0" y="238.0">③ 말벌</text><text class="xs" text-anchor="start" x="240.0" y="257.0">난초 생식 장치의 부품이 된다</text><rect class="f-paper s-code w2" height="50.0" rx="3" width="240.0" x="14.0" y="124.0"></rect><text class="s b" text-anchor="start" x="24.0" y="144.0">④ 난초</text><text class="xs" text-anchor="start" x="24.0" y="163.0">꽃가루가 다른 난초로 옮겨진다</text><path class="s-ink w15" d="M470,55 Q580,60 580,120" marker-end="url(#f09-a-ink)"></path><path class="s-ink w15" d="M580,176 Q580,240 474,243" marker-end="url(#f09-a-ink)"></path><path class="s-ink w15" d="M226,243 Q120,240 120,178" marker-end="url(#f09-a-ink)"></path><path class="s-ink w15" d="M120,122 Q120,60 226,55" marker-end="url(#f09-a-ink)"></path><text class="l b" text-anchor="middle" x="350.0" y="144.0">리좀</text><text class="s t-code" text-anchor="middle" x="350.0" y="164.0">코드의 잉여가치</text><rect class="f-paper s-prop w2" height="8.0" rx="0" width="22.0" x="250.0" y="290.0"></rect><text class="xs" text-anchor="start" x="278.0" y="298.0">탈영토화</text><rect class="f-paper s-code w2" height="8.0" rx="0" width="22.0" x="350.0" y="290.0"></rect><text class="xs" text-anchor="start" x="378.0" y="298.0">재영토화</text></svg></svg>
<text class="t-s t-onshade" text-anchor="middle" x="361" y="142">작용</text>
<rect class="f-panel s-ink w15" height="48" width="150" x="496" y="104"></rect>
<text class="t t-b" text-anchor="middle" x="571" y="125">개체</text>
<text class="t-s t-mute" text-anchor="middle" x="571" y="142">원자 = 이미 개체</text>

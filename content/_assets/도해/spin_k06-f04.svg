<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 270" width="800" height="270" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-pos{ fill:var(--pos) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-stream{ stroke:var(--rot); stroke-width:3 }.dg .f-ink{ fill:var(--ink) }.dg .f-rot{ fill:var(--rot) }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .ssub{ font-size:8px }.dg .tag-n{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="임베딩에 Q를 곱하고 각 층의 입구에 Q 전치, 출구에 Q를 곱하고 헤드에 Q 전치를 곱해 두면 본선 전체가 돌아간 좌표계에서 계산되고 추론 중 회전은 없다" class="dg" height="100%" role="img" style="" viewBox="0 0 800 270" width="100%"><defs><marker id="g4-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="g4-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="ln-stream" x1="140" x2="690" y1="70" y2="70"></line><text class="t-s t-b t-rot" text-anchor="middle" x="415" y="58">본선 위의 값은 처음부터 끝까지 h · Q (돌아간 좌표계)</text><rect class="bx-rot" height="44" rx="4" width="112" x="20" y="48"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="76" y="66">W<tspan class="ssub" dy="3">embd</tspan><tspan dy="-3">​</tspan> · Q</text><text class="t-s t-mut" text-anchor="middle" x="76" y="82">임베딩</text><rect class="bx-rot" height="44" rx="4" width="92" x="698" y="48"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="744" y="66">Qᵀ · W<tspan class="ssub" dy="3">head</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="744" y="82">LM 헤드</text><rect class="tag-n" height="108" rx="6" width="236" x="170" y="120"></rect><text class="t-s t-b" text-anchor="middle" x="288" y="138">층 1</text><rect class="bx-rot" height="40" rx="4" width="64" x="180" y="148"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="212" y="165">÷ rms</text><text class="t-s t-mut" text-anchor="middle" x="212" y="180">통과</text><rect class="bx-rot" height="40" rx="4" width="88" x="252" y="148"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="296" y="165">Qᵀ·diag(γ)·W<tspan class="ssub" dy="3">in</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="296" y="180">입구</text><rect class="bx-rot" height="40" rx="4" width="50" x="348" y="148"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="373" y="165">W<tspan class="ssub" dy="3">out</tspan><tspan dy="-3">​</tspan>·Q</text><text class="t-s t-mut" text-anchor="middle" x="373" y="180">출구</text><text class="t-s t-mut" text-anchor="middle" x="288" y="214">안쪽 비선형은 Q를 보지 않는다</text><line class="ln ln-rot" marker-end="url(#g4-rot)" x1="212" x2="212" y1="72" y2="146"></line><line class="ln ln-rot" marker-end="url(#g4-rot)" x1="373" x2="373" y1="146" y2="74"></line><rect class="tag-n" height="108" rx="6" width="236" x="440" y="120"></rect><text class="t-s t-b" text-anchor="middle" x="558" y="138">층 ℓ</text><rect class="bx-rot" height="40" rx="4" width="64" x="450" y="148"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="482" y="165">÷ rms</text><text class="t-s t-mut" text-anchor="middle" x="482" y="180">통과</text><rect class="bx-rot" height="40" rx="4" width="88" x="522" y="148"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="566" y="165">Qᵀ·diag(γ)·W<tspan class="ssub" dy="3">in</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="566" y="180">입구</text><rect class="bx-rot" height="40" rx="4" width="50" x="618" y="148"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="643" y="165">W<tspan class="ssub" dy="3">out</tspan><tspan dy="-3">​</tspan>·Q</text><text class="t-s t-mut" text-anchor="middle" x="643" y="180">출구</text><text class="t-s t-mut" text-anchor="middle" x="558" y="214">안쪽 비선형은 Q를 보지 않는다</text><line class="ln ln-rot" marker-end="url(#g4-rot)" x1="482" x2="482" y1="72" y2="146"></line><line class="ln ln-rot" marker-end="url(#g4-rot)" x1="643" x2="643" y1="146" y2="74"></line><text class="t-s t-b t-pos" text-anchor="middle" x="415" y="252">가중치 네 종류를 미리 한 번 고쳐 두면 끝 — 추론 중에 곱하는 회전은 0개</text></svg></svg>
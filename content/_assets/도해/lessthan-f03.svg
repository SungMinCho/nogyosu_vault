<rect height="50" rx="4" width="290" x="510" y="307"></rect>
<rect height="50" rx="4" width="290" x="510" y="371"></rect>
</g>
<!-- 오른쪽 칸에 자리 잡은 균열 -->
<g class="f-none s-red w2 round">
<path d="M514,115 L508,128 L517,138 L507,150 L514,165"></path>
<path d="M514,179 L508,192 L517,202 L507,214 L514,229"></path>
<path d="M514,243 L508,256 L517,266 L507,278 L514,293"></path>
<path d="M514,307 L508,320 L517,330 L507,342 L514,357"></path>
<path d="M514,371 L508,384 L517,394 L507,406 L514,421"></path>
</g>
<!-- 다섯 화살표 -->
<g class="s-red w2">
<line marker-end="url(#L01-3-ar-red)" x1="376" x2="502" y1="146" y2="146"></line>
<line marker-end="url(#L01-3-ar-red)" x1="376" x2="502" y1="210" y2="210"></line>
<line marker-end="url(#L01-3-ar-red)" x1="376" x2="502" y1="274" y2="274"></line>
<line marker-end="url(#L01-3-ar-red)" x1="376" x2="502" y1="338" y2="338"></line>
<line marker-end="url(#L01-3-ar-red)" x1="376" x2="502" y1="402" y2="402"></line>
</g>
<text class="t-mid t-s f-red" x="437" y="137">결여</text>
<text class="t-mid t-s f-red" x="437" y="201">이율배반</text>
<text class="t-mid t-s f-red" x="437" y="265">진리가 솟는 과정</text>
<text class="t-mid t-s f-red" x="437" y="329">비극적 간극</text>
<text class="t-mid t-s f-red" x="437" y="393">장애 → 실패</text>
<!-- 차례 번호와 쪽수 -->
<text class="t-mid t-b" x="40" y="137">①</text><text class="t-mid t-b" x="40" y="201">②</text><text class="t-mid t-b" x="40" y="265">③</text><text class="t-mid t-b" x="40" y="329">④</text><text class="t-mid t-b" x="40" y="393">⑤</text>
<text class="t-mid t-s t-muted" x="40" y="163">p. 3</text><text class="t-mid t-s t-muted" x="40" y="227">p. 8</text><text class="t-mid t-s t-muted" x="40" y="291">p. 11</text><text class="t-mid t-s t-muted" x="40" y="355">p. 15</text><text class="t-mid t-s t-muted" x="40" y="419">p. 17</text>
<!-- 왼쪽 칸 -->
<g class="t-mid">
<text class="t-b" x="225" y="137">저능</text>
<text class="t-s" x="225" y="155">기댈 지팡이가 내게 없다</text>
<text class="t-b" x="225" y="201">칸트</text>
<text class="t-s" x="225" y="219">이율배반 = 우리 이성의 한계</text>
<text class="t-b" x="225" y="265">칸트</text>
<text class="t-s" x="225" y="283">가상의 고발 = 우리 앎의 영역</text>
<text class="t-b" x="225" y="329">횔덜린</text>
<text class="t-s" x="225" y="347">간극은 주체와 존재 사이</text>
<text class="t-b" x="225" y="393">인식론적 장애</text>
<text class="t-s" x="225" y="411">우리가 사물을 알 수 없음</text>
</g>
<!-- 오른쪽 칸 -->
<g class="t-mid">
<text class="t-b" x="660" y="137">베실</text>
<text class="t-s" x="660" y="155">신 자신도 저능이다</text>
<text class="t-b" x="660" y="201">헤겔</text>
<text class="t-s" x="660" y="219">사물 자체의 균열</text>
<text class="t-b" x="660" y="265">헤겔</text>
<text class="t-s" x="660" y="283">그 과정의 본래 자리 = 사물 자체</text>
<text class="t-b" x="660" y="329">헤겔</text>
<text class="t-s" x="660" y="347">간극은 존재 안에</text>
<text class="t-b" x="660" y="393">존재론적 실패 <tspan class="t-s t-muted">헤겔의 유일성</tspan></text>
<text class="t-s" x="660" y="411">실패 자체가 진리의 지표</text>
</g>
<!-- 맨 아래 -->
<line class="s-rule w1" x1="80" x2="800" y1="438" y2="438"></line>
<text class="t-mid" x="440" y="462"><tspan class="t-s t-muted">푸는 수가 아니라 다시 읽는 수 — </tspan><tspan class="t-b">문제가 제 자신의 해답이 된다</tspan></text>
</svg></g></g></g></g></g></svg>
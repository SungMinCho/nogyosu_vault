<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 300" width="800" height="300" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="FP4 훈련 처방 다섯 가지에서 순전파, 활성 기울기, 가중치 기울기 각 자리에 회전을 쓰는지를 비교한 표" class="dg" height="100%" role="img" style="" viewBox="0 0 800 300" width="100%"><text class="t-s t-b" text-anchor="middle" x="110" y="30"></text><text class="t-s t-b" text-anchor="middle" x="295" y="30">Fprop</text><text class="t-s t-b" text-anchor="middle" x="485" y="30">Dgrad</text><text class="t-s t-b" text-anchor="middle" x="675" y="30">Wgrad</text><text class="t-s t-b" text-anchor="start" x="30" y="69">쳉·유·박 (MXFP4)</text><rect class="bx" height="34" rx="4" width="182" x="204" y="48"></rect><text class="t-s t-mut" text-anchor="middle" x="295" y="70">BF16 유지</text><rect class="bx-rot" height="34" rx="4" width="182" x="394" y="48"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="485" y="70">RHT + SR</text><rect class="bx-rot" height="34" rx="4" width="182" x="584" y="48"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="675" y="70">RHT + SR</text><text class="t-s t-b" text-anchor="start" x="30" y="113">Quartet (MXFP4)</text><rect class="bx-rot" height="34" rx="4" width="182" x="204" y="92"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="295" y="114">H₃₂ + 가우시안 클립</text><rect class="bx-rot" height="34" rx="4" width="182" x="394" y="92"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="485" y="114">RHT + SR</text><rect class="bx-rot" height="34" rx="4" width="182" x="584" y="92"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="675" y="114">RHT + SR</text><text class="t-s t-b" text-anchor="start" x="30" y="157">NVIDIA (NVFP4)</text><rect class="bx" height="34" rx="4" width="182" x="204" y="136"></rect><text class="t-s t-mut" text-anchor="middle" x="295" y="158">없음</text><rect class="bx" height="34" rx="4" width="182" x="394" y="136"></rect><text class="t-s t-mut" text-anchor="middle" x="485" y="158">없음 · SR</text><rect class="bx-rot" height="34" rx="4" width="182" x="584" y="136"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="675" y="158">RHT₁₆ + SR</text><text class="t-s t-b" text-anchor="start" x="30" y="201">TetraJet-v2 (NVFP4)</text><rect class="bx" height="34" rx="4" width="182" x="204" y="180"></rect><text class="t-s t-mut" text-anchor="middle" x="295" y="202">없음</text><rect class="bx-rot" height="34" rx="4" width="182" x="394" y="180"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="485" y="202">RHT</text><rect class="bx-rot" height="34" rx="4" width="182" x="584" y="180"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="675" y="202">RHT</text><text class="t-s t-b" text-anchor="start" x="30" y="245">Quartet II (NVFP4)</text><rect class="bx" height="34" rx="4" width="182" x="204" y="224"></rect><text class="t-s t-mut" text-anchor="middle" x="295" y="246">없음 · 4/6</text><rect class="bx-rot" height="34" rx="4" width="182" x="394" y="224"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="485" y="246">MS-EDEN</text><rect class="bx-rot" height="34" rx="4" width="182" x="584" y="224"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="675" y="246">MS-EDEN</text><text class="t-s t-mut" text-anchor="start" x="20" y="280">파랑 = 회전(또는 회전 기반 추정기) 있음. MXFP4 쪽은 순전파에도 회전을 썼고, NVFP4 쪽은 순전파에서 회전을 버렸다.</text></svg></svg>
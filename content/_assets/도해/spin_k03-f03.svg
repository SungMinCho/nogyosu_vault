<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 220" width="800" height="220" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .c-cold{ fill:var(--paper); stroke:var(--line); stroke-width:.8 }.dg .c-warm{ fill:var(--spike-soft); stroke:var(--spike); stroke-width:.8 }.dg .c-sel{ fill:var(--rot-soft); stroke:var(--rot); stroke-width:1 }.dg .c-lost{ fill:var(--spike-soft); stroke:var(--spike); stroke-width:1; stroke-dasharray:3 2 }.dg .big{ font-size:20px }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="같은 2행 3열 행렬을 토큰별 자로 양자화하면 작은 값 넷이 0이 되고, 채널별 자로 하면 거의 그대로 남는다" class="dg" height="100%" role="img" style="" viewBox="0 0 800 220" width="100%"><text class="t-b" text-anchor="start" x="64" y="30">원래 X</text><text class="t-s t-mut" text-anchor="start" x="64" y="46">가운데 열이 이상치 채널</text><rect class="c-cold" height="27" rx="2" width="59" x="64" y="62"></rect><text class="t-mono" text-anchor="middle" x="93.5" y="81">1.0</text><rect class="c-warm" height="27" rx="2" width="59" x="126" y="62"></rect><text class="t-mono t-spike t-b" text-anchor="middle" x="155.5" y="81">60</text><rect class="c-cold" height="27" rx="2" width="59" x="188" y="62"></rect><text class="t-mono" text-anchor="middle" x="217.5" y="81">0.5</text><rect class="c-cold" height="27" rx="2" width="59" x="64" y="92"></rect><text class="t-mono" text-anchor="middle" x="93.5" y="111">0.8</text><rect class="c-warm" height="27" rx="2" width="59" x="126" y="92"></rect><text class="t-mono t-spike t-b" text-anchor="middle" x="155.5" y="111">−60</text><rect class="c-cold" height="27" rx="2" width="59" x="188" y="92"></rect><text class="t-mono" text-anchor="middle" x="217.5" y="111">1.2</text><text class="t-s t-mut" text-anchor="end" x="56" y="81">토큰 1</text><text class="t-s t-mut" text-anchor="end" x="56" y="111">토큰 2</text><text class="t-b t-spike" text-anchor="start" x="300" y="30">토큰별 자 (행마다)</text><text class="t-s t-mut" text-anchor="start" x="300" y="46">복원값 — 작은 값이 모두 0</text><rect class="c-lost" height="27" rx="2" width="59" x="300" y="62"></rect><text class="t-mono t-spike t-b" text-anchor="middle" x="329.5" y="81">0</text><rect class="c-cold" height="27" rx="2" width="59" x="362" y="62"></rect><text class="t-mono" text-anchor="middle" x="391.5" y="81">60</text><rect class="c-lost" height="27" rx="2" width="59" x="424" y="62"></rect><text class="t-mono t-spike t-b" text-anchor="middle" x="453.5" y="81">0</text><rect class="c-lost" height="27" rx="2" width="59" x="300" y="92"></rect><text class="t-mono t-spike t-b" text-anchor="middle" x="329.5" y="111">0</text><rect class="c-cold" height="27" rx="2" width="59" x="362" y="92"></rect><text class="t-mono" text-anchor="middle" x="391.5" y="111">−60</text><rect class="c-lost" height="27" rx="2" width="59" x="424" y="92"></rect><text class="t-mono t-spike t-b" text-anchor="middle" x="453.5" y="111">0</text><text class="t-s t-mono t-spike" text-anchor="start" x="492" y="81">s = 8.57</text><text class="t-s t-mono t-spike" text-anchor="start" x="492" y="111">s = 8.57</text><text class="t-b t-rot" text-anchor="start" x="590" y="30">채널별 자 (열마다)</text><text class="t-s t-mut" text-anchor="start" x="590" y="46">복원값 — 거의 그대로</text><rect class="c-sel" height="27" rx="2" width="59" x="590" y="62"></rect><text class="t-mono t-rot t-b" text-anchor="middle" x="619.5" y="81">1.0</text><rect class="c-cold" height="27" rx="2" width="59" x="652" y="62"></rect><text class="t-mono" text-anchor="middle" x="681.5" y="81">60</text><rect class="c-sel" height="27" rx="2" width="59" x="714" y="62"></rect><text class="t-mono t-rot t-b" text-anchor="middle" x="743.5" y="81">0.514</text><rect class="c-sel" height="27" rx="2" width="59" x="590" y="92"></rect><text class="t-mono t-rot t-b" text-anchor="middle" x="619.5" y="111">0.857</text><rect class="c-cold" height="27" rx="2" width="59" x="652" y="92"></rect><text class="t-mono" text-anchor="middle" x="681.5" y="111">−60</text><rect class="c-sel" height="27" rx="2" width="59" x="714" y="92"></rect><text class="t-mono t-rot t-b" text-anchor="middle" x="743.5" y="111">1.2</text><text class="t-s t-mono t-rot" text-anchor="middle" x="619.5" y="136">0.143</text><text class="t-s t-mono t-rot" text-anchor="middle" x="681.5" y="136">8.57</text><text class="t-s t-mono t-rot" text-anchor="middle" x="743.5" y="136">0.171</text><text class="t-s t-mono t-rot" text-anchor="end" x="582" y="136">s =</text><text class="t-s t-mut" text-anchor="start" x="300" y="186">오차² 합</text><text class="t-mono t-b t-spike big" text-anchor="start" x="300" y="208">3.33</text><text class="t-s t-mut" text-anchor="start" x="590" y="186">오차² 합</text><text class="big t-mono t-b t-rot" text-anchor="start" x="590" y="208">0.0035</text><text class="t-s t-mut" text-anchor="start" x="64" y="186">INT4 대칭, 눈금 ±7</text><text class="t-s t-mut" text-anchor="start" x="64" y="202">s = (그 묶음의 최대 |값|) / 7</text></svg></svg>
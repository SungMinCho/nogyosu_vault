ne!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w figscroll"><svg aria-label="세는 지성, 쥐는 이성 — 지성은 과거 상태를 끝없이 거슬러 세다 이율배반에 막히고, 이성은 그 계열 전체를 하나로 쥔다" class="pz-inner" height="100%" role="img" viewBox="0 0 480 306" width="100%" xmlns="http://www.w3.org/2000/svg">
<text class="tk" x="16" y="28">지성 · 나쁜 무한</text>
<text class="tm r cu" x="464" y="28">앞선 상태를 하나씩 거슬러 센다</text>
<line class="ln-cu" marker-end="url(#ah-cu)" x1="431" x2="389" y1="84" y2="84"></line><line class="ln-cu" marker-end="url(#ah-cu)" x1="371" x2="329" y1="84" y2="84"></line><line class="ln-cu" marker-end="url(#ah-cu)" x1="311" x2="269" y1="84" y2="84"></line><line class="ln-cu" marker-end="url(#ah-cu)" x1="251" x2="209" y1="84" y2="84"></line><circle class="dot-cu" cx="440" cy="84" r="6"></circle><circle class="dot-cu" cx="380" cy="84" r="4"></circle><circle class="dot-cu" cx="320" cy="84" r="4"></circle><circle class="dot-cu" cx="260" cy="84" r="4"></circle><circle class="dot-cu" cx="200" cy="84" r="4"></circle>

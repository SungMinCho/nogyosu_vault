<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 260" width="720" height="260" class="frame fig lecture doc page"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E7EAE8; --panel:#F3F5F4; --code-bg:#EEF1F0;
  --ink:#1B2224; --muted:#586365; --rule:#C1C9C8; --rule-soft:rgba(27,34,36,.07);
  --if:#2A5687; --if-soft:rgba(42,86,135,.12); --if-deep:#15375C;
  --ore:#8A6014; --ore-soft:rgba(138,96,20,.15);
  --cx:#7A3B72; --cx-soft:rgba(122,59,114,.12);
  --flag:#B3381B; --flag-soft:rgba(179,56,27,.10);
  --canary:#E9B30C;
  --f-body:"Source Serif 4","Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-disp:"Do Hyeon","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --f-label:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1416; --panel:#161D20; --code-bg:#131A1D;
    --ink:#E1E7E6; --muted:#95A1A3; --rule:#2F3A3D; --rule-soft:rgba(225,231,230,.06);
    --if:#7EA7DA; --if-soft:rgba(126,167,218,.16); --if-deep:#3B6AA5;
    --ore:#D6A553; --ore-soft:rgba(214,165,83,.17);
    --cx:#CB8EC2; --cx-soft:rgba(203,142,194,.17);
    --flag:#EF7B57; --flag-soft:rgba(239,123,87,.14);
    --canary:#F4C63A;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1416; --panel:#161D20; --code-bg:#131A1D;
  --ink:#E1E7E6; --muted:#95A1A3; --rule:#2F3A3D; --rule-soft:rgba(225,231,230,.06);
  --if:#7EA7DA; --if-soft:rgba(126,167,218,.16); --if-deep:#3B6AA5;
  --ore:#D6A553; --ore-soft:rgba(214,165,83,.17);
  --cx:#CB8EC2; --cx-soft:rgba(203,142,194,.17);
  --flag:#EF7B57; --flag-soft:rgba(239,123,87,.14);
  --canary:#F4C63A;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1rem 3rem }.lecture{ display:contents }.fig{ margin:.6rem 0 }.frame{ overflow-x:auto; overflow-y:hidden; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding-block:.8rem;
  background-image:linear-gradient(to right,var(--bg),var(--bg)),linear-gradient(to right,var(--bg),var(--bg)),
    linear-gradient(to right,var(--rule),transparent),linear-gradient(to left,var(--rule),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat;
  background-size:1.5rem 100%,1.5rem 100%,.6rem 100%,.6rem 100%; background-attachment:local,local,scroll,scroll }.dg{ display:block; width:100%; height:auto }.dg .t, .hero-svg .t{ font-family:var(--f-label); font-size:13px; fill:var(--ink) }.dg .t-s{ font-size:12px }.dg .t-xs{ font-size:11px }.dg .t-b, .hero-svg .t-b{ font-weight:700 }.dg .t-m{ font-family:var(--f-mono) }.dg .t-mut, .hero-svg .t-mut{ fill:var(--muted) }.dg .t-if, .hero-svg .t-if{ fill:var(--if) }.dg .t-cx{ fill:var(--cx) }.dg line, .dg polyline, .dg path, .hero-svg line, .hero-svg polyline, .hero-svg path{ fill:none }.f-ink{ fill:var(--ink)!important }.f-bg{ fill:var(--bg)!important }.f-panel{ fill:var(--panel)!important }.f-if-soft{ fill:var(--if-soft)!important }.f-ore-soft{ fill:var(--ore-soft)!important }.ln-mut{ stroke:var(--rule); stroke-width:1.2 }.s-ink-thin{ stroke:var(--ink); stroke-width:1 }.s-rule{ stroke:var(--rule); stroke-width:1 }.s-if{ stroke:var(--if); stroke-width:1.4 }.s-ore{ stroke:var(--ore); stroke-width:1.2 }.dash{ stroke-dasharray:4 3 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="기능 단위 증분은 매번 여러 모듈을 조금씩 건드려 모듈을 조각내고, 추상화 단위 증분은 한 번에 모듈 하나를 완성해 그 위에 기능들이 얹히게 한다." class="dg" height="100%" role="img" style="" viewBox="0 0 720 260" width="100%"><defs><marker id="a-ink-inc" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t t-b" text-anchor="middle" x="180.0" y="24.0">기능 단위 증분</text><text class="t t-b" text-anchor="middle" x="540.0" y="24.0">추상화 단위 증분</text><line class="ln-mut" x1="360.0" x2="360.0" y1="36.0" y2="250.0"></line><rect class="f-panel s-ink-thin" height="150.0" rx="2" width="58.0" x="40.0" y="50.0"></rect><text class="t t-s t-m" text-anchor="middle" x="69.0" y="216.0">M1</text><rect class="f-panel s-ink-thin" height="150.0" rx="2" width="58.0" x="115.0" y="50.0"></rect><text class="t t-s t-m" text-anchor="middle" x="144.0" y="216.0">M2</text><rect class="f-panel s-ink-thin" height="150.0" rx="2" width="58.0" x="190.0" y="50.0"></rect><text class="t t-s t-m" text-anchor="middle" x="219.0" y="216.0">M3</text><rect class="f-panel s-ink-thin" height="150.0" rx="2" width="58.0" x="265.0" y="50.0"></rect><text class="t t-s t-m" text-anchor="middle" x="294.0" y="216.0">M4</text><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="46.0" y="62.0"></rect><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="121.0" y="62.0"></rect><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="196.0" y="62.0"></rect><text class="t t-xs t-mut" text-anchor="end" x="32.0" y="72.0">1</text><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="121.0" y="88.0"></rect><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="271.0" y="88.0"></rect><text class="t t-xs t-mut" text-anchor="end" x="32.0" y="98.0">2</text><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="46.0" y="114.0"></rect><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="196.0" y="114.0"></rect><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="271.0" y="114.0"></rect><text class="t t-xs t-mut" text-anchor="end" x="32.0" y="124.0">3</text><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="46.0" y="140.0"></rect><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="121.0" y="140.0"></rect><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="271.0" y="140.0"></rect><text class="t t-xs t-mut" text-anchor="end" x="32.0" y="150.0">4</text><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="196.0" y="166.0"></rect><rect class="f-ore-soft s-ore" height="12.0" rx="0" width="46.0" x="271.0" y="166.0"></rect><text class="t t-xs t-mut" text-anchor="end" x="32.0" y="176.0">5</text><text class="t t-xs t-cx" text-anchor="middle" x="180.0" y="240.0">기능마다 여러 모듈을 조금씩 — 모듈은 조각난다</text><rect class="f-if-soft s-if" height="150.0" rx="2" width="58.0" x="400.0" y="50.0"></rect><text class="t t-b t-if" text-anchor="middle" x="429.0" y="130.0">1</text><text class="t t-s t-m" text-anchor="middle" x="429.0" y="216.0">M1</text><rect class="f-if-soft s-if" height="150.0" rx="2" width="58.0" x="475.0" y="50.0"></rect><text class="t t-b t-if" text-anchor="middle" x="504.0" y="130.0">2</text><text class="t t-s t-m" text-anchor="middle" x="504.0" y="216.0">M2</text><rect class="f-if-soft s-if" height="150.0" rx="2" width="58.0" x="550.0" y="50.0"></rect><text class="t t-b t-if" text-anchor="middle" x="579.0" y="130.0">3</text><text class="t t-s t-m" text-anchor="middle" x="579.0" y="216.0">M3</text><rect class="f-bg s-rule dash" height="150.0" rx="2" width="58.0" x="625.0" y="50.0"></rect><text class="t t-xs t-mut" text-anchor="middle" x="654.0" y="130.0">다음</text><text class="t t-s t-m" text-anchor="middle" x="654.0" y="216.0">M4</text><text class="t t-xs t-if" text-anchor="middle" x="540.0" y="240.0">증분이 끝나면 모듈 하나가 완성된 추상화로 선다</text></svg></svg>
<text class="t-s b t-ink2" x="222" y="54">자산</text>
<text class="b" x="222" y="78">현금</text><text class="end t-num b" x="380" y="78">46</text>
<text x="222" y="100">매출채권</text><text class="end t-num" x="380" y="100">50</text>
<text x="222" y="122">재고</text><text class="end t-num" x="380" y="122">20</text>
<text x="222" y="144">설비</text><text class="end t-num" x="380" y="144">108</text>
<line class="ln-mute thin" x1="218" x2="382" y1="153" y2="153"></line>
<text class="t-s t-ink2" x="222" y="170">합계</text><text class="end t-num" x="380" y="170">224</text>
<text class="mid t-l" x="300" y="198">=</text>
<!-- 대차대조표: 부채·자본 블록 -->
<rect class="f-paper2" height="146" width="180" x="210" y="206"></rect>
<rect class="no-fill ln2 thin" height="146" width="180" x="210" y="206"></rect>
<text class="t-s b t-ink2" x="222" y="228">부채 · 자본</text>
<text x="222" y="252">매입채무</text><text class="end t-num" x="380" y="252">20</text>
<text x="222" y="274">차입금</text><text class="end t-num" x="380" y="274">80</text>
<text x="222" y="296">납입자본</text><text class="end t-num" x="380" y="296">100</text>
<text class="b t-ret" x="222" y="318">이익잉여금</text><text class="end t-num b t-ret" x="380" y="318">24</text>
<line class="ln-mute thin" x1="218" x2="382" y1="327" y2="327"></line>
<text class="t-s t-ink2" x="222" y="344">합계</text><text class="end t-num" x="380" y="344">224</text>
<!-- 손익계산서 -->
<rect class="no-fill ln2 thin" height="146" width="166" x="14" y="206"></rect>
<text class="t-s b t-ink2" x="24" y="228">손익계산서</text>
<text x="24" y="252">매출</text><text class="end t-num" x="170" y="252">200</text>
<text x="24" y="274">비용 합계</text><text class="end t-num" x="170" y="274">−170</text>
<line class="ln-mute thin" x1="20" x2="172" y1="283" y2="283"></line>
<text class="b t-ret" x="24" y="298">순이익</text><text class="end t-num b t-ret" x="170" y="298">30</text>
<text class="t-s" x="24" y="318">유보(배당 6 뺌)</text><text class="end t-num" x="170" y="318">24</text>
<text class="t-xs t-ink2" x="24" y="342">비용 = 원가·인건비 등</text>
<path class="ln" d="M176,313 L207,313" marker-end="url(#ar-f19a)"></path>
<!-- 현금흐름표 -->
<rect class="no-fill ln2 thin" height="146" width="166" x="420" y="32"></rect>
<text class="t-s b t-ink2" x="430" y="54">현금흐름표</text>
<text class="b t-alarm" x="430" y="78">영업</text><text class="end t-num b t-alarm" x="576" y="78">−8</text>
<text x="430" y="100">투자</text><text class="end t-num" x="576" y="100">−120</text>
<text x="430" y="122">재무</text><text class="end t-num" x="576" y="122">+174</text>
<line class="ln-mute thin" x1="426" x2="578" y1="131" y2="131"></line>
<text class="b" x="430" y="148">합</text><text class="end t-num b" x="576" y="148">+46</text>
<path class="ln" d="M424,143 C404,132 410,84 394,77" marker-end="url(#ar-f19a)"></path>
<!-- 오른쪽 아래 경보 -->
<text class="t-s b t-ret" x="420" y="252">순이익 30</text>
<text class="t-s b t-alarm" x="420" y="276">영업현금 −8</text>
<text class="t-xs t-ink2" x="420" y="304">금고의 46은 주주 100과</text>
<text class="t-xs t-ink2" x="420" y="322">은행 80이 넣은 돈의 남은 몫</text>
</svg></g></g></g></g></g></svg>
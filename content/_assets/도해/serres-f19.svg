<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 440" width="900" height="440" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.c-cold{ fill:var(--cold) !important }.c-pass{ fill:var(--pass) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-cold{ stroke:var(--cold) }.s-pass{ stroke:var(--pass) }.f-none{ fill:none }.f-cold{ fill:var(--cold) }.f-ink-t{ fill:var(--ink); fill-opacity:.08 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.mk-pass{ fill:var(--pass) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="여섯 겹의 상자. 맨 안쪽은 원자들의 열 소음이고, 바깥으로 분자, 세포, 기관, 몸, 말하는 입이 차례로 감싼다. 상자마다 아래 층위에서 정보와 소음이 짝으로 올라오고, 상자의 벽이 정류기가 되어 아래의 소음 일부를 위의 정보로 바꾼다. 각 상자는 바깥 상자에게 들여다볼 수 없는 블랙박스, 곧 무의식이다. 마지막 관찰자는 언어를 내는 자이고 첫 송신자는 알 수 없다." class="fig-svg" height="100%" role="img" viewBox="0 0 900 440" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F21-ar-pass" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-pass" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="s-ink2 f-ink-t w1" height="372" rx="3" width="580" x="40" y="50"></rect><rect class="s-ink2 f-ink-t w1" height="310" rx="3" width="500" x="80" y="106"></rect><rect class="s-ink2 f-ink-t w1" height="248" rx="3" width="420" x="120" y="162"></rect><rect class="s-ink2 f-ink-t w1" height="186" rx="3" width="340" x="160" y="218"></rect><rect class="s-ink2 f-ink-t w1" height="124" rx="3" width="260" x="200" y="274"></rect><rect class="s-ink2 f-ink-t w1" height="62" rx="3" width="180" x="240" y="330"></rect><text class="t" text-anchor="start" x="212" y="307">분자</text><text class="t" text-anchor="start" x="172" y="251">세포</text><text class="t" text-anchor="start" x="132" y="195">기관</text><text class="t" text-anchor="start" x="92" y="139">몸</text><text class="t" text-anchor="start" x="52" y="83">말하는 입</text><text class="ts c-pass" text-anchor="start" x="132" y="83">마지막 관찰자 · 언어를 내는 자</text><text class="t" text-anchor="start" x="250" y="354">원자 · 열 소음</text><text class="ts c-caution" text-anchor="start" x="250" y="373">첫 송신자 = ?</text><line class="s-pass w15 f-none" x1="352" x2="352" y1="380" y2="330"></line><path class="s-cold w1 f-none" d="M382.0,380.0 L386.0,375.0 L378.0,370.0 L386.0,365.0 L378.0,360.0 L386.0,355.0 L378.0,350.0 L386.0,345.0 L382.0,340.0"></path><polygon class="s-cold f-cold w1" points="377,340 387,340 382,331"></polygon><line class="s-ink w2 f-none" x1="375" x2="389" y1="330" y2="330"></line><path class="s-pass w15 f-none" d="M382,329 C382,318 352,322 352,310"></path><line class="s-pass w15 f-none" x1="352" x2="352" y1="310" y2="274"></line><path class="s-cold w1 f-none" d="M382.0,306.0 L386.0,301.0 L378.0,296.0 L386.0,291.0 L378.0,286.0 L382.0,284.0"></path><polygon class="s-cold f-cold w1" points="377,284 387,284 382,275"></polygon><line class="s-ink w2 f-none" x1="375" x2="389" y1="274" y2="274"></line><path class="s-pass w15 f-none" d="M382,273 C382,262 352,266 352,254"></path><line class="s-pass w2 f-none" x1="352" x2="352" y1="254" y2="218"></line><path class="s-cold w1 f-none" d="M382.0,250.0 L386.0,245.0 L378.0,240.0 L386.0,235.0 L378.0,230.0 L382.0,228.0"></path><polygon class="s-cold f-cold w1" points="377,228 387,228 382,219"></polygon><line class="s-ink w2 f-none" x1="375" x2="389" y1="218" y2="218"></line><path class="s-pass w15 f-none" d="M382,217 C382,206 352,210 352,198"></path><line class="s-pass w2 f-none" x1="352" x2="352" y1="198" y2="162"></line><path class="s-cold w1 f-none" d="M382.0,194.0 L386.0,189.0 L378.0,184.0 L386.0,179.0 L378.0,174.0 L382.0,172.0"></path><polygon class="s-cold f-cold w1" points="377,172 387,172 382,163"></polygon><line class="s-ink w2 f-none" x1="375" x2="389" y1="162" y2="162"></line><path class="s-pass w15 f-none" d="M382,161 C382,150 352,154 352,142"></path><line class="s-pass w3 f-none" x1="352" x2="352" y1="142" y2="106"></line><path class="s-cold w1 f-none" d="M382.0,138.0 L386.0,133.0 L378.0,128.0 L386.0,123.0 L378.0,118.0 L382.0,116.0"></path><polygon class="s-cold f-cold w1" points="377,116 387,116 382,107"></polygon><line class="s-ink w2 f-none" x1="375" x2="389" y1="106" y2="106"></line><path class="s-pass w15 f-none" d="M382,105 C382,94 352,98 352,86"></path><line class="s-pass w3 f-none" x1="352" x2="352" y1="86" y2="50"></line><path class="s-cold w1 f-none" d="M382.0,82.0 L386.0,77.0 L378.0,72.0 L386.0,67.0 L378.0,62.0 L382.0,60.0"></path><polygon class="s-cold f-cold w1" points="377,60 387,60 382,51"></polygon><line class="s-ink w2 f-none" x1="375" x2="389" y1="50" y2="50"></line><path class="s-pass w15 f-none" d="M382,49 C382,38 352,42 352,30"></path><line class="s-pass w3 f-none" marker-end="url(#F21-ar-pass)" x1="352" x2="352" y1="30" y2="8"></line><text class="ts c-pass" text-anchor="start" x="362" y="18">말 · 언어</text><text class="ts c-pass" text-anchor="end" x="344" y="304">정보</text><text class="ts c-cold" text-anchor="start" x="391" y="304">소음</text><text class="ts" text-anchor="start" x="394" y="344">정류</text><text class="tb" text-anchor="middle" x="765" y="38">벽 하나를 확대하면</text><line class="s-ink2 w2 f-none" x1="668" x2="866" y1="150" y2="150"></line><text class="ts" text-anchor="start" x="676" y="214">아래 층위</text><text class="ts" text-anchor="start" x="676" y="86">위 층위</text><line class="s-pass w15 f-none" x1="730" x2="730" y1="222" y2="150"></line><path class="s-cold w15 f-none" d="M790.0,222.0 L795.0,216.0 L785.0,210.0 L795.0,204.0 L785.0,198.0 L795.0,192.0 L785.0,186.0 L795.0,180.0 L785.0,174.0 L795.0,168.0 L790.0,162.0"></path><polygon class="s-cold f-cold w1" points="784,162 796,162 790,152"></polygon><line class="s-ink w3 f-none" x1="781" x2="799" y1="150" y2="150"></line><path class="s-pass w2 f-none" d="M790,148 C790,128 730,136 730,116"></path><line class="s-pass w3 f-none" marker-end="url(#F21-ar-pass)" x1="730" x2="730" y1="150" y2="64"></line><path class="s-cold w1 f-none" d="M826.0,138.0 L829.0,133.0 L823.0,128.0 L829.0,123.0 L823.0,118.0 L829.0,113.0 L823.0,108.0 L829.0,103.0 L823.0,98.0 L829.0,93.0 L823.0,88.0 L829.0,83.0 L823.0,78.0 L829.0,73.0 L826.0,70.0"></path><text class="ts c-pass" text-anchor="end" x="722" y="196">정보</text><text class="ts c-cold" text-anchor="start" x="800" y="196">소음</text><text class="ts" text-anchor="start" x="804" y="168">정류기</text><text class="ts c-pass" text-anchor="start" x="740" y="104">정보 + 정류된 몫</text><text class="ts c-cold" text-anchor="start" x="836" y="76">새 소음</text><text class="t" text-anchor="middle" x="765" y="262">같은 소음 p = 0.1, 두 장부</text><text class="ts c-caution" text-anchor="middle" x="765" y="284">X를 되찾는 쪽: 0.469 → 0.211 bit</text><text class="ts c-pass" text-anchor="middle" x="765" y="302">Y를 재료로 쓰는 쪽: 0.469 → 0.680 bit</text><text class="ts" text-anchor="middle" x="765" y="340">각 상자는 바깥 상자에게</text><text class="ts" text-anchor="middle" x="765" y="357">블랙박스, 곧 무의식</text></svg></svg>
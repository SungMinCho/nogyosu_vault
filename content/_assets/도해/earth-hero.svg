  background-repeat:no-repeat; background-size:40px 100%, 40px 100%, 14px 100%, 14px 100%; background-attachment:local, local, scroll, scroll;
  background-color:var(--panel); border:1px solid var(--rule); padding:.6rem .4rem }.frame svg{ display:block; width:100%; height:auto }svg text{ font-family:var(--f-sans); fill:var(--ink); font-size:13px }svg .tl{ font-size:13.5px }svg .ts{ font-size:12.5px }svg .tn{ font-family:var(--f-mono); font-size:12px }svg .tbig{ font-size:15px; font-weight:500 }svg .tb{ font-weight:700 }svg .tn.tb{ font-weight:600 }svg .t2{ fill:var(--ink2) }svg .t-on{ fill:var(--on) }.f-umber{fill:var(--umber)}.f-blue-l{fill:var(--blue-l)}.f-brass{fill:var(--brass)}.f-panel{fill:var(--panel)}.f-none{fill:none}.s-blue{stroke:var(--blue)}.s-ink2{stroke:var(--ink2)}svg line, svg path, svg polyline, svg rect, svg circle{ stroke-width:1 }.nostroke{ stroke:none }svg pattern line{ stroke-width:1.1 }svg.pz-root{width:720px!important;height:234px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w mast"><g class="pz-w cert"><g class="pz-w fig"><g class="pz-w frame"><g class="pz-w hero-w"><svg aria-label="지구의 장부 2025년 말: 금융 회사의 금융 자산 550조, 가계·기업·정부의 금융 자산 약 630조, 실물 자산 620조 달러. 총계 약 1,800조 중 순자산은 약 600조." class="pz-inner" height="100%" id="hero" role="img" style="" viewBox="0 0 720 234" widt
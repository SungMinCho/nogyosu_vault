<text class="t-mid t-s t-muted" x="217.5" y="332">돈이냐 목숨이냐 — 무엇을 골라도 잃는다</text>
<!-- 이행 -->
<line class="s-ink w2" marker-end="url(#L03-3-ar-ink)" x1="378" x2="488" y1="185" y2="185"></line>

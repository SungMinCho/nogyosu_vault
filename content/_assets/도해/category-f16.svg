    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.22), transparent) left center / .8rem 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.22), transparent) right center / .8rem 100% no-repeat scroll;
  background-attachment:local,local,scroll,scroll }.frame > svg{ display:block; width:100%; min-width:var(--minw,0px); height:auto; margin-inline:auto; max-width:48rem }.panels{ display:flex; flex-wrap:wrap; justify-content:center; gap:1.1rem 1.8rem; overflow:visible; background:none }.panel{ flex:1 1 calc(var(--pw) * .72px); max-width:calc(var(--pw) * 1.25px); min-width:0; display:grid; gap:.3rem; align-content:start }.panel svg{ display:block; width:100%; height:auto }.fig svg text{ font-family:var(--f-sign); fill:var(--ink) }.fig svg .t{ font-size:15px }.fig svg .t-arrow, .fig svg .t-fun, .fig svg .t-nat, .fig svg .t-univ, .fig svg .t-alarm{ font-size:15px }.fig svg .t-alarm{ fill:var(--c-alarm) }.fig svg tspan.t-univ{ fill:var(--c-univ) }.fig svg .i, .fig svg tspan.i{ font-family:KaTeX_Math,"Times New Roman",serif; font-style:italic }.fig svg .num{ font-weight:600; font-variant-numeric:tabular-nums }.fig svg tspan.sub{ font-size:70% }.ln{ fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-width:3px }.ln-arrow{ stroke:var(--c-arrow) }.ln-alarm{ stroke:var(--c-alarm) }.mk-arrow{ fill:var(--c-arrow) }.mk-fun{ fill:var(--c-fun) }.mk-nat{ fill:var(--c-nat) }.mk-univ{ fill:var(--c-univ) }.mk-alarm{ fill:var(--c-alarm) }.mk-ink{ fill:var(--ink) }.mk-mute{ fill:var(--ink-2) }.dot{ fill:var(--ink) }.dot-alarm{ fill:var(--c-alarm) }.blob{ fill:var(--paper-2); stroke:var(--ink-2); stroke-width:1.5px }.mini svg{ width:100%; height:auto; display:block }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="합집합 {1,2,3}에서는 원소 2가 f를 따라 p로도, g를 따라 q로도 가야 해서 함수가 되지 못한다" height="100%" role="img" viewBox="0 0 300 230" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="cop-a-m-arrow" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-arrow" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="cop-a-m-fun" markerHeight="11" 
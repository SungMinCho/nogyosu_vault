  --brass:#AE8C1F; --brass-l:#5A4A17; --brass-d:#7D640F; --brass-top:#D2B04A; --violet:#9570D2; --violet-l:#2D2342; --violet-d:#C2A8EC;
  --verm:#D85E3D; --verm-l:#45241B; --verm-d:#F09A80; --on:#0F1513; --shadow:rgba(0,0,0,.55); --stripe:1.6%; color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}a:focus-visible, .frame:focus-visible{ outline:2px solid var(--violet); outline-offset:3px }.mast{ max-width:var(--shell); margin:0 auto; padding-inline:var(--pad); padding-block:2.2rem 1rem; position:relative }.cert{ position:relative; border:1px solid var(--rule); background:var(--panel); padding:1.4rem 1.1rem 1rem; overflow:hidden }.cert::before{ content:""; position:absolute; inset:5px; border:3px double var(--rule); pointer-events:none }.cert .frame{ background:transparent }@media (max-width:40em){.hero-w{ display:none }.cert .frame{ padding:.6rem .2rem }}.fig{ margin:.4rem 0 .4rem }.frame{ overflow-x:auto; background:

<path class="sea-s" d="M330 84 a46 46 0 1 1 -32 14" marker-end="url(#arS)"></path>
<text class="sm" text-anchor="middle" x="330" y="126">되먹임</text>
<text class="sm" text-anchor="middle" x="330" y="144">우연 → 정보</text>
<path class="chaff-s" d="M110 70 q60 20 64 44" marker-end="url(#arC)"></path>
<path class="chaff-s" d="M550 70 q-60 20 -64 44" marker-end="url(#arC)"></path>
<text class="sm chaff-t" text-anchor="middle" x="86" y="60">우연</text>
<text class="sm chaff-t" text-anchor="middle" x="574" y="60">우연</text>
<text class="sm" text-anchor="middle" x="330" y="206">흡수된 것은 체계를 키운다</text>
<g class="fire-s">
<line x1="60" x2="152" y1="262" y2="262"></line><line x1="60" x2="152" y1="286" y2="286"></line>

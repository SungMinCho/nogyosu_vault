<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 740 262" width="740" height="262" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;

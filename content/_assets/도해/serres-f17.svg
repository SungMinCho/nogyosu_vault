<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 446" width="900" height="446" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.fig-svg .tl, .chart .tl{ font-family:var(--f-latin); font-style:italic; }.fig-svg .halo, .chart .halo{ paint-order:stroke; stroke:var(--deep); stroke-width:4px; stroke-linejoin:round; }.c-cold{ fill:var(--cold) !important }.c-fire{ fill:var(--fire) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-rule{ stroke:var(--rule) }.s-cold{ stroke:var(--cold) }.s-fire{ stroke:var(--fire) }.s-caution{ stroke:var(--caution) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-fire{ fill:var(--fire) }.f-cold-t{ fill:var(--cold); fill-opacity:.16 }.f-fire-t{ fill:var(--fire); fill-opacity:.16 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.dash{ stroke-dasharray:5 4 }.dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }.mk-cold{ fill:var(--cold) }.mk-fire{ fill:var(--fire) }.mk-caution{ fill:var(--caution) }svg.pz-root{width:900px!important;height:446px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="왼쪽: 시냇물은 위에서 아래로만 흐른다. 늑대는 상류, 어린양은 스무 걸음, 13–16미터 아래에 있다. 늑대가 흐린 물은 30초쯤 뒤 어린양에게 닿지만 어린양이 흐린 물은 거슬러 오르지 못한다. 오른쪽: 늑대는 질 때마다 고발 대상을 더 큰 집합으로 넓힌다. 너, 작년의 너, 네 형, 네 족속, 너희와 목동과 개. 어린양은 흐름, 출생, 혈통의 순서로 세 번 반박하고, 마지막 집합 앞에서는 반박할 순서가 없다. 늑대는 소문을 근거로 어린양을 숲으로 끌고 가 재판 절차 없이 먹는다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 900 446" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F19-ar-caution" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-caution" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F19-ar-cold" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-cold" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F19-ar-fire" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-fire" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="tb" text-anchor="middle" x="150" y="28">흐름의 순서</text><text class="ts" text-anchor="middle" x="150" y="46">물은 위에서 아래로만</text><path class="s-cold f-cold-t w1" d="M125.0,62.0 L125.2,66.0 L125.7,70.0 L126.3,74.0 L127.2,78.0 L128.1,82.0 L129.0,86.0 L129.8,90.0 L130.4,94.0 L130.9,98.0 L131.0,102.0 L130.9,106.0 L130.5,110.0 L129.8,114.0 L129.0,118.0 L128.1,122.0 L127.2,126.0 L126.4,130.0 L125.7,134.0 L125.2,138.0 L125.0,142.0 L125.1,146.0 L125.4,150.0 L126.0,154.0 L126.8,158.0 L127.7,162.0 L128.6,166.0 L129.5,170.0 L130.2,174.0 L130.7,178.0 L131.0,182.0 L131.0,186.0 L130.7,190.0 L130.1,194.
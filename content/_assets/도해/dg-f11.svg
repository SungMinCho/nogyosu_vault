263.7,339.5 C254.8,338.2 237.3,337.9 229.9,336.2 C222.5,334.5 218.5,331.7 219.2,329.3 C220.0,326.9 231.5,324.3 234.6,322.0 C237.7,319.7 236.1,317.8 237.8,315.7 C239.5,313.6 241.1,311.4 244.8,309.4 C248.5,307.4 255.7,306.0 260.0,303.9 C264.3,301.7 264.1,298.3 270.4,296.5 C276.6,294.6 287.2,292.8 297.6,292.6 C308.1,292.3 322.6,294.8 333.0,295.1 C343.4,295.4 350.5,294.8 360.0,294.4 C369.5,294.0 380.0,292.4 389.7,292.4 C399.3,292.5 408.2,293.9 417.9,294.7 C427.6,295.4 439.1,295.7 447.8,297.0 C456.5,298.2 466.7,299.8 470.1,302.1 C473.4,304.3 466.7,307.9 467.8,310.2 C468.9,312.5 471.5,314.0 476.6,316.0 C481.8,317.9 495.5,319.8 498.6,322.0 Z" stroke-width="1.8"></path><text class="f-ochre-t t-b halo" text-anchor="middle" x="360" y="320">질료 — 형식 없음</text><text class="f-ochre-t t-s halo" text-anchor="middle" x="360" y="339">그물 바깥 · 기관 없는 몸</text><ellipse class="f-indigo f-indigo-f" cx="360" cy="58" rx="66" ry="26" stroke-width="2"></ellipse><text class="f-indigo-t t-l t-b" text-anchor="middle" x="360" y="63">지층 = 몸통</text><path class="f-indigo f-none" d="M296,64 C276,72 262,86 252,104" stroke-width="3"></path><path class="f-indigo f-none" d="M424,64 C444,72 458,86 468,104" stroke-width="3"></path><rect class="f-indigo f-panel-f" height="110" rx="3" stroke-width="2" width="210" x="40" y="104"></rect><text class="f-indigo-t t-l t-b" text-anchor="middle" x="145.0" y="96">내용</text><line class="f-indigo f-none f-dash" stroke-width="1.2" x1="40" x2="166" y1="159.0" y2="159.0"></line><text class="f-ink-t t-b" text-anchor="start" x="52" y="126">형식</text><text class="f-ink2-t t-s" text-anchor="start" x="52" y="145">사암–셰일의 교대</text><text class="f-ink-t t-b" text-anchor="start" x="52" y="181.0">실체</text><text class="f-ink2-t t-s" text-anchor="start" x="52" y="200.0">골라낸 퇴적 단위</text><text class="f-muted-t t-s" text-anchor="end" x="242" y="163.0">양태적 구별</text><rect class="f-indigo f-panel-f" height="110" rx="3" stroke-width="2" width="210" x="470" y="104"></rect><text class="f-indigo-t t
<path class="t-jag s-jag w1" d="M484.6,459.1 L494.6,459.1 L498.6,463.1 L498.6,471.1 L484.6,471.1 Z"></path><path class="f-panel s-jag w1" d="M494.6,459.1 L494.6,463.1 L498.6,463.1 Z"></path>

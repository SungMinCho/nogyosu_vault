<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 412" width="800" height="412" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .t-pos{ fill:var(--pos) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-mut{ stroke:var(--muted) }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-spike{ stroke:var(--spike) }.dg .dash{ stroke-dasharray:4 3 }.dg .ln-stream{ stroke:var(--rot); stroke-width:3 }.dg .f-ink{ fill:var(--ink) }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .f-pos{ fill:var(--pos) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-pos{ fill:var(--pos-soft); stroke:var(--pos) }.dg .bx-on{ fill:var(--paper); stroke:var(--rot); stroke-width:1.4; stroke-dasharray:5 3 }.dg .ssub{ font-size:8px }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:800px!important;height:412px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="QuaRot와 SpinQuant가 한 트랜스포머 층 안에 회전을 넣는 네 자리: 병합되는 곳과 온라인인 곳, 그리고 RoPE와 비선형 앞에서 병합이 막히는 모습" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 800 412" width="100%"><defs><marker id="qr-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="qr-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="qr-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="qr-pos" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-pos" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="ln-stream" x1="10" x2="790" y1="30" y2="30"></line><text class="t-s t-b t-rot" text-anchor="start" x="14" y="20">잔차 흐름 h·Q — R1 · 1a (임베딩과 모든 W에 병합)</text><line class="ln" marker-end="url(#qr-ink)" x1="75" x2="75" y1="30" y2="80"></line><path class="ln" d="M 12 30 L 12 322 L 18 322" marker-end="url(#qr-ink)"></path><rect class="bx" height="44" rx="4" width="110" x="20" y="82"></rect><text class="t-b" text-anchor="middle" x="75" y="100">RMSNorm</text><text class="t-s t-mut" text-anchor="middle" x="75" y="116">γ → W로 흡수</text><rect class="bx bx-rot" height="44" rx="4" width="130" x="160" y="82"></rect><text class="t-b t-rot" text-anchor="middle" x="225" y="100">W<tspan class="ssub" dy="3">q</tspan><tspan dy="-3">​</tspan> · W<tspan class="ssub" dy="3">k</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="225" y="116">Qᵀ 병합</text><rect class="bx bx-pos" height="44" rx="4" width="120" x="320" y="82"></rect><text class="t-b t-pos" text-anchor="middle" x="380" y="100">RoPE Θ<tspan class="ssub" dy="3">m</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="380" y="116">위치마다 다름</text><rect class="bx-on" height="44" rx="4" width="130" x="470" y="82"></rect><text class="t-b t-rot" text-anchor="middle" x="535" y="100">H<tspan class="ssub" dy="3">dh</tspan><tspan dy="-3">​</tspan> 온라인</text><text class="t-s t-mut" text-anchor="middle" x="535" y="116">R3 · 1d</text><rect class="bx" height="44" rx="4" width="130" x="630" y="82"></rect><text class="t-b" text-anchor="middle" x="695" y="100">QKᵀ 점수</text><text class="t-s t-mut" text-anchor="middle" x="695" y="116">K는 4비트 캐시</text><line class="ln" marker-end="url(#qr-ink)" x1="131" x2="158" y1="104" y2="104"></line><line class="ln" marker-end="url(#qr-ink)" x1="291" x2="318" y1="104" y2="104"></line><line class="ln" marker-end="url(#qr-ink)" x1="441" x2="468" y1="104" y2="104"></line><line class="ln" marker-end="url(#qr-ink)" x1="601" x2="628" y1="104" y2="104"></line><path class="ln" d="M 75 126 L 75 172 L 158 172" marker-end="url(#qr-ink)"></path><rect class="bx bx-rot" height="44" rx="4" width="130" x="160" y="150"></rect><text class="t-b t-rot" text-anchor="middle" x="225" y="168">W<tspan class="ssub" dy="3">v</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="225" y="184">Qᵀ · H<tspan class="ssub" dy="3">dh</tspan><tspan dy="-3">​</tspan> 병합 (R2)</text><rect class="bx" height="44" rx="4" width="120" x="320" y="150"></rect><text class="t-b" text-anchor="middle" x="380" y="168">softmax · V</text><text class="t-s t-mut" text-anchor="middle" x="380" y="184">토큰만 섞음</text><rect class="bx-on" height="44" rx="4" width="130" x="470" y="150"></rect><text class="t-b t-rot" text-anchor="middle" x="535" y="168">헤드 사이 H</text><text class="t-s t-mut" text-anchor="middle" x="535" y="184">온라인 · 1c</text><rect class="bx bx-rot" height="44" rx="4" width="130" x="630" y="150"></rect><text class="t-b t-rot" text-anchor="middle" x="695" y="168">W<tspan class="ssub" dy="3">o</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="695" y="184">H · Q 병합</text><line class="ln" marker-end="url(#qr-ink)" x1="291" x2="318" y1="172" y2="172"></line><line class="ln" marker-end="url(#qr-ink)" x1="441" x2="468" y1="172" y2="172"></line><line class="ln" marker-end="url(#qr-ink)" x1="601" x2="628" y1="172" y2="172"></line><path class="ln ln-mut" d="M 670 126 L 400 148" marker-end="url(#qr-ink)"></path><path class="ln" d="M 760 172 L 772 172 L 772 34" marker-end="url(#qr-ink)"></path><rect class="bx" height="44" rx="4" width="110" x="20" y="300"></rect><text class="t-b" text-anchor="middle" x="75" y="318">RMSNorm</text><text class="t-s t-mut" text-anchor="middle" x="75" y="334">γ → W로 흡수</text><rect class="bx bx-rot" height="44" rx="4" width="130" x="160" y="300"></rect><text class="t-b t-rot" text-anchor="middle" x="225" y="318">W<tspan class="ssub" dy="3">gate</tspan><tspan dy="-3">​</tspan> · W<tspan class="ssub" dy="3">up</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="225" y="334">Qᵀ 병합</text><rect class="bx" height="44" rx="4" width="120" x="320" y="300"></rect><text class="t-b" text-anchor="middle" x="380" y="318">silu ⊙</text><text class="t-s t-mut" text-anchor="middle" x="380" y="334">비선형</text><rect class="bx-on" height="44" rx="4" width="130" x="470" y="300"></rect><text class="t-b t-rot" text-anchor="middle" x="535" y="318">H 온라인</text><text class="t-s t-mut" text-anchor="middle" x="535" y="334">R4 · 1b</text><rect class="bx bx-rot" height="44" rx="4" width="130" x="630" y="300"></rect><text class="t-b t-rot" text-anchor="middle" x="695" y="318">W<tspan class="ssub" dy="3">down</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="695" y="334">H · W · Q 병합</text><line class="ln" marker-end="url(#qr-ink)" x1="131" x2="158" y1="322" y2="322"></line><line class="ln" marker-end="url(#qr-ink)" x1="291" x2="318" y1="322" y2="322"></line><line class="ln" marker-end="url(#qr-ink)" x1="441" x2="468" y1="322" y2="322"></line><line class="ln" marker-end="url(#qr-ink)" x1="601" x2="628" y1="322" y2="322"></line><path class="ln" d="M 760 322 L 784 322 L 784 34" marker-end="url(#qr-ink)"></path><path class="ln ln-spike dash" d="M 490 80 Q 380 48 270 80" marker-end="url(#qr-spike)"></path><text class="t-b t-spike" text-anchor="middle" x="380" y="58">✕</text><text class="t-s t-spike" text-anchor="start" x="398" y="58">RoPE를 못 건넘</text><path class="ln ln-spike dash" d="M 490 298 Q 380 266 270 298" marker-end="url(#qr-spike)"></path><text class="t-b t-spike" text-anchor="middle" x="380" y="276">✕</text><text class="t-s t-spike" text-anchor="start" x="398" y="276">비선형을 못 건넘</text><path class="ln ln-rot" d="M 225 196 Q 380 234 695 196" marker-end="url(#qr-rot)"></path><text class="t-s t-b t-rot" text-anchor="middle" x="380" y="234">✓ 헤드 안 H<tspan class="ssub" dy="3">dh</tspan><tspan dy="-3">​</tspan>는 통과</text><text class="t-s t-mut" text-anchor="middle" x="380" y="248">softmax·V는 채널을 안 건드린다</text><rect class="bx bx-rot" height="12" rx="2" width="20" x="20" y="368"></rect><text class="t-s" text-anchor="start" x="46" y="378">병합 — 추론 비용 0</text><rect class="bx-on" height="12" rx="2" width="20" x="180" y="368"></rect><text class="t-s" text-anchor="start" x="206" y="378">온라인 하다마드 — 층당 1½번</text><rect class="bx bx-pos" height="12" rx="2" width="20" x="400" y="368"></rect><text class="t-s" text-anchor="start" x="426" y="378">RoPE — 위치에 따라 다른 회전</text><text class="t-s t-mut" text-anchor="start" x="20" y="400">자리 이름 — R1–R4: SpinQuant · 1a–1d: QuaRot</text></svg></g></g></g></g></svg>
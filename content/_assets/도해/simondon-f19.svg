<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 446" width="760" height="446" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#E6ECE9; --panel:#F2F5F3; --ink:#172120; --ink-2:#4A5755; --rule:#B6C3BF;
  --liq:#1B6971; --liq-soft:#CFE0DE; --liq-dot:#7FA9AB;
  --cry:#866207; --cry-soft:#EAD9A0; --cry-deep:#C9A43C;
  --inf:#5B3D8F; --inf-soft:#DCD3EA;
  --brk:#983B20; --brk-soft:#EFD5CB;
  --shade:#0E1514; --on-shade:#E6ECE9;
  --f-display:"Hahmlet","Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR",serif;
  --f-body:"Gowun Batang","Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR",serif;
  --f-latin:"Old Standard TT","Gowun Batang","Noto Serif CJK KR",serif;
  --f-mono:"Cutive Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","Courier New",monospace;
  --pad:1.05rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1716; --panel:#15211F; --ink:#DCE6E3; --ink-2:#9EB0AC; --rule:#2D3F3C;
  --liq:#58B4BC; --liq-soft:#163538; --liq-dot:#3C7176;
  --cry:#D8B24B; --cry-soft:#3A3014; --cry-deep:#9C7E2C;
  --inf:#A88DDC; --inf-soft:#2A2140;
  --brk:#E27D57; --brk-soft:#3C2219;
  --shade:#050909; --on-shade:#C9D6D2; color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#0E1716; --panel:#15211F; --ink:#DCE6E3; --ink-2:#9EB0AC; --rule:#2D3F3C;
  --liq:#58B4BC; --liq-soft:#163538; --liq-dot:#3C7176;
  --cry:#D8B24B; --cry-soft:#3A3014; --cry-deep:#9C7E2C;
  --inf:#A88DDC; --inf-soft:#2A2140;
  --brk:#E27D57; --brk-soft:#3C2219;
  --shade:#050909; --on-shade:#C9D6D2; color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.hero-fig svg{ width:100%; height:auto; display:block }figure.fig{ margin:.4rem 0 .6rem }.fig-frame{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background:
  linear-gradient(to right,var(--paper),var(--paper)) left/1.2rem 100% no-repeat local,
  linear-gradient(to left,var(--paper),var(--paper)) right/1.2rem 100% no-repeat local,
  linear-gradient(to right,rgba(0,0,0,.18),rgba(0,0,0,0)) left/.7rem 100% no-repeat scroll,
  linear-gradient(to left,rgba(0,0,0,.18),rgba(0,0,0,0)) right/.7rem 100% no-repeat scroll;
  background-color:var(--paper) }.fig-frame svg{ display:block; width:100%; min-width:560px; height:auto }.fig svg text, .hero-fig text{ font-family:var(--f-body); fill:var(--ink) }.t{ font-size:13px }.t-s{ font-size:11px }.t-num{ font-family:var(--f-latin) !important; font-variant-numeric:tabular-nums }.t-b{ font-weight:700 }.t-mute{ fill:var(--ink-2) !important }.t-cry{ fill:var(--cry) !important }.t-inf{ fill:var(--inf) !important }.halo{ paint-order:stroke; stroke:var(--paper); stroke-width:4px; stroke-linejoin:round }.f-none{ fill:none }.f-panel{ fill:var(--panel) }.f-ink{ fill:var(--ink) }.f-mute{ fill:var(--ink-2) }.f-cry{ fill:var(--cry) }.f-inf{ fill:var(--inf) }.s-ink{ stroke:var(--ink) }.s-mute{ stroke:var(--ink-2) }.s-rule{ stroke:var(--rule) }.s-cry{ stroke:var(--cry) }.s-inf{ stroke:var(--inf) }.w05{ stroke-width:.6 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.dash{ stroke-dasharray:5 4 }.dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }.hero-fig .band:hover polygon, .hero-fig .band:focus polygon{ fill:var(--inf-soft) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="정보의 세 축. 바닥면은 양(신호의 수)과 질(좋은 형태), 세로는 강도(주체의 극성을 정하는 세기). 정사각형은 질이 높고 양이 적고 강도가 낮다. 모래 더미는 양이 많고 질과 강도가 낮고, 파르테논은 양은 모래 더미와 같은 높이에서 질만 높다. 정밀 사진에서 대비를 높이고 초점을 흐린 고대비 사진은 양과 질이 깎이고 강도가 오른다. 냄새는 양과 질이 바닥인데 강도가 높고, 아이가 처음 본 사자는 그 위쪽에 있다. 셋째 축은 앞의 두 축의 조합으로 만들어지지 않는다." height="100%" role="img" viewBox="0 0 760 446" width="100%">
<defs>
<marker id="f19-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>

<rect class="f-cobf s-cob w15" height="34" rx="3" width="95" x="735" y="398"></rect>
<text class="t-mid t-s" x="782.5" y="420">인민</text>
<line class="s-red w15 dash" marker-end="url(#L03-3-ar-red)" marker-start="url(#L03-3-ar-red)" x1="524" x2="592" y1="415" y2="415"></line>
<text class="t-mid t-s f-red" x="558" y="404">거리</text>
<text class="t-mid t-s f-red" x="715" y="403">거리</text>
<line class="s-red w15 dash" marker-end="url(#L03-3-ar-red)" marker-start="url(#L03-3-ar-red)" x1="699" x2="731" y1="415" y2="415"></line>
<text class="t-mid t-s t-muted" x="715" y="455">그 거리가 이미 당과 인민 안에</text>

<line class="s-verd" marker-end="url(#ar-paths-v)" stroke-width="1.5" x1="260" x2="170" y1="204" y2="250"></line>
<line class="s-verd" marker-end="url(#ar-paths-v)" stroke-width="1.5" x1="400" x2="490" y1="204" y2="250"></line>
<text class="t-mute t-s" text-anchor="middle" x="330" y="236">가족 안에서 어느 회전 Q?</text>
<rect class="f-plate s-ink" height="72" rx="4" stroke-width="1.4" width="280" x="20" y="254"></rect><text class="t-b" text-anchor="middle" x="160.0" y="276">T = H·M̂ (대칭 M̂)</text><text class="t-s t-verm" text-anchor="middle" x="160.0" y="295">농도 쪽 최적성 증명 없음</text>
<rect class="f-plate s-ink" height="72" rx="4" stroke-width="1.4" width="280" x="360" y="254"></rect><text class="t-b" text-anchor="middle" x="500.0" y="276">T = H·S^(−½)·Uᵀ·W′ᵀ</text><text class="t-s" text-anchor="middle" x="500.0" y="295">FP 최적 · INT d^o(1)배 이내</text>

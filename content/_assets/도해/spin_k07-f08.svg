<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 790 334" width="790" height="334" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .f-ink{ fill:var(--ink) }.dg .tag-n{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:790px!important;height:334px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="회전 방법들을 변환의 범위(직교, 직교 더하기 축척, 가역 아핀)와 정하는 방식(고정, 값싼 목표, 종단 학습)의 격자에 배치한 지도" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 790 334" width="100%"><defs><marker id="i7-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-s t-b" text-anchor="middle" x="251.667" y="290">고정 · 닫힌 꼴</text><text class="t-s t-b" text-anchor="middle" x="455" y="290">값싼 분포 목표</text><text class="t-s t-b" text-anchor="middle" x="658.333" y="290">종단 학습</text><text class="t-s t-b" text-anchor="end" x="140" y="82.3333">가역 아핀</text><rect class="tag-n" height="72.6667" rx="4" width="199.333" x="152" y="42"></rect><rect class="tag-n" height="72.6667" rx="4" width="199.333" x="355.333" y="42"></rect><rect class="tag-n" height="72.6667" rx="4" width="199.333" x="558.667" y="42"></rect><text class="t-s t-b" text-anchor="end" x="140" y="159">직교 + 축척</text><rect class="tag-n" height="72.6667" rx="4" width="199.333" x="152" y="118.667"></rect><rect class="tag-n" height="72.6667" rx="4" width="199.333" x="355.333" y="118.667"></rect><rect class="tag-n" height="72.6667" rx="4" width="199.333" x="558.667" y="118.667"></rect><text class="t-s t-b" text-anchor="end" x="140" y="235.667">직교</text><rect class="tag-n" height="72.6667" rx="4" width="199.333" x="152" y="195.333"></rect><rect class="tag-n" height="72.6667" rx="4" width="199.333" x="355.333" y="195.333"></rect><rect class="tag-n" height="72.6667" rx="4" width="199.333" x="558.667" y="195.333"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="251.667" y="82.3333">WUSH (하다마드 + 2차 모멘트)</text><text class="t-s t-b t-spike" text-anchor="middle" x="658.333" y="82.3333">FlatQuant (온라인)</text><text class="t-s t-b t-rot" text-anchor="middle" x="658.333" y="159">OSTQuant</text><text class="t-s t-b t-rot" text-anchor="middle" x="251.667" y="159">DuQuant (평활화 + 탐욕 회전)</text><text class="t-s t-b t-rot" text-anchor="middle" x="251.667" y="227.667">QuaRot (무작위 하다마드)</text><text class="t-s t-b t-rot" text-anchor="middle" x="251.667" y="243.667">ResQ (PCA + 무작위)</text><text class="t-s t-b t-rot" text-anchor="middle" x="455" y="211.667">KurTail (첨도)</text><text class="t-s t-b t-rot" text-anchor="middle" x="455" y="227.667">DartQuant (채찍)</text><text class="t-s t-b t-rot" text-anchor="middle" x="455" y="243.667">OptRot (4제곱합)</text><text class="t-s t-b t-rot" text-anchor="middle" x="455" y="259.667">DFRot (가중 MSE)</text><text class="t-s t-b t-rot" text-anchor="middle" x="658.333" y="227.667">SpinQuant</text><text class="t-s t-b t-rot" text-anchor="middle" x="658.333" y="243.667">ButterflyQuant · HARP</text><text class="t-s t-mut" text-anchor="start" x="150" y="24">변환을 정하는 방식 → (오른쪽일수록 비싸다)</text><text class="t-s t-mut" text-anchor="start" x="20" y="318">↑ 위로 갈수록 넓은 변환 — 대신 병합이 어려워진다(가역 아핀은 RMSNorm을 통과 못 함).</text></svg></g></g></g></g></svg>
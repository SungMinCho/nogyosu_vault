<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 740 282" width="740" height="282" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-s{ font-size:11.5px }.fig .t-l{ font-size:16px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-frame{ fill:var(--paper-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-zero{ fill:var(--zero) }.fig .f-zerosoft{ fill:var(--zero-soft) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-ledgersoft{ fill:var(--ledger-soft) }.fig .f-blood{ fill:var(--blood) }.fig .s-ink{ stroke:var(--ink) }.fig .s-mute{ stroke:var(--ink-2) }.fig .s-sun{ stroke:var(--sun) }.fig .s-ledger{ stroke:var(--ledger) }.fig .w1{ stroke-width:1 }.fig .w2{ stroke-width:2 }svg.pz-root{width:740px!important;height:282px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="다람쥐 장부(설명용 가정값). 쓴 20보다 얻은 30이 많아 ψ₁ &lt; ψ₂가 되고, 그 흑자는 해에서 참나무를 거쳐 도토리로 들어온 증여다." class="pz-inner" height="100%" role="img" style="--minw:681px" viewBox="0 0 740 282" width="100%"><defs><marker id="psi-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="psi-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="psi-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="psi-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="psi-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="psi-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><text class="t-b" text-anchor="middle" x="370" y="26">ψ₁ &lt; ψ₂ — 쓴 것보다 많이 얻는다</text><text class="t-s f-mute" x="20" y="52">벽 안 · ψ (묶인 에너지)</text><rect class="f-zerosoft" height="52" rx="4" width="700" x="20" y="212"></rect><text class="t-s t-b f-zero" x="32" y="243">벽 밖 · φ — 무차별한 흐름</text><rect class="f-ledgersoft s-ledger" height="60" rx="5" width="150" x="40" y="72"></rect><text class="t-s f-mute" text-anchor="middle" x="115" y="95.5">아침</text><text class="t-l t-b" text-anchor="middle" x="115" y="117.5">ψ₁ = 100</text><rect class="f-ledgersoft s-ledger" height="60" rx="5" width="150" x="550" y="72"></rect><text class="t-s f-mute" text-anchor="middle" x="625" y="95.5">저녁</text><text class="t-l t-b" text-anchor="middle" x="625" y="117.5">ψ₂ = 110</text><text class="t-s t-b f-ledger" text-anchor="middle" x="625" y="62">100 − 20 + 30 = 110</text><rect class="f-frame s-mute" height="44" rx="5" width="200" x="240" y="80"></rect><text class="t-s" text-anchor="middle" x="340" y="106.5">다람쥐가 돌아다닌다</text><line class="s-mute" marker-end="url(#psi-mute)" x1="190" x2="236" y1="102" y2="102"></line><line class="s-mute" marker-end="url(#psi-mute)" x1="440" x2="546" y1="102" y2="102"></line><line class="s-ink w2" marker-end="url(#psi-ink)" x1="282" x2="282" y1="124" y2="208"></line><text class="t-s t-b" x="292" y="160">지출 ψ→φ  −20</text><text class="t-s f-mute" x="292" y="178">열 · 숨 · 배설</text><line class="s-sun w2" marker-end="url(#psi-sun)" x1="408" x2="408" y1="210" y2="128"></line><text class="t-s t-b f-sun" x="418" y="160">획득 φ→ψ  +30</text><text class="t-s f-mute" x="418" y="178">도토리</text><text class="t-s t-b f-sun" x="530" y="238">해 → 참나무 → 도토리</text><text class="t-s f-mute" x="530" y="256">흑자의 원천 · 일방적 증여</text><line class="s-sun w1" marker-end="url(#psi-sun)" x1="524" x2="414" y1="234" y2="216"></line></svg></g></g></g></g></svg>
<text class="t-s" text-anchor="middle" x="228" y="168">명령 거부</text>
<text class="t-s" text-anchor="middle" x="228" y="188">술 안 마시기</text>
<text class="t-s" text-anchor="middle" x="228" y="208">약 없인 운전 안 함</text>
<text class="t-s" text-anchor="middle" x="228" y="228">버티고 나아가기</text>
<text class="t-s" text-anchor="middle" x="228" y="248">코걸이 안 하기</text>

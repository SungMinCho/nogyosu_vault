<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 220" width="760" height="220" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-spike{ fill:var(--spike) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .mk-nv{ fill:var(--c-nv); stroke:var(--bg); stroke-width:2 }.dg .mk-mx{ fill:var(--c-mx); stroke:var(--bg); stroke-width:2 }.dg .t-nv{ fill:var(--c-nv) }.dg .t-mx{ fill:var(--c-mx) }.dg .zone-b2{ fill:var(--spike-soft); stroke:var(--spike); stroke-width:1; stroke-dasharray:4 3 }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="최댓값을 6에 맞추면 최댓값의 66.7퍼센트와 100퍼센트 사이에 표현점이 없고, 4에 맞추면 그 구멍이 75퍼센트와 100퍼센트 사이로 줄어든다" class="dg" height="100%" role="img" style="" viewBox="0 0 760 220" width="100%"><text class="t-s t-b t-nv" text-anchor="end" x="138" y="74">최댓값을 6에 맞춤</text><rect class="zone-b2" height="24" rx="2" width="183.333" x="516.667" y="58"></rect><line class="ln" x1="150" x2="700" y1="70" y2="70"></line><circle class="mk-nv" cx="150.0" cy="70" r="5"></circle><circle class="mk-nv" cx="195.8" cy="70" r="5"></circle><circle class="mk-nv" cx="241.7" cy="70" r="5"></circle><circle class="mk-nv" cx="287.5" cy="70" r="5"></circle><circle class="mk-nv" cx="333.3" cy="70" r="5"></circle><circle class="mk-nv" cx="425.0" cy="70" r="5"></circle><circle class="mk-nv" cx="516.7" cy="70" r="5"></circle><circle class="mk-nv" cx="700.0" cy="70" r="5"></circle><text class="t-s t-spike" text-anchor="middle" x="608.333" y="52">구멍 67% ~ 100%</text><text class="t-s t-b t-mx" text-anchor="end" x="138" y="144">최댓값을 4에 맞춤</text><rect class="zone-b2" height="24" rx="2" width="137.5" x="562.5" y="128"></rect><line class="ln" x1="150" x2="700" y1="140" y2="140"></line><circle class="mk-mx" cx="150.0" cy="140" r="5"></circle><circle class="mk-mx" cx="218.8" cy="140" r="5"></circle><circle class="mk-mx" cx="287.5" cy="140" r="5"></circle><circle class="mk-mx" cx="356.2" cy="140" r="5"></circle><circle class="mk-mx" cx="425.0" cy="140" r="5"></circle><circle class="mk-mx" cx="562.5" cy="140" r="5"></circle><circle class="mk-mx" cx="700.0" cy="140" r="5"></circle><text class="t-s t-spike" text-anchor="middle" x="631.25" y="122">구멍 75% ~ 100%</text><text class="t-s t-mono t-mut" text-anchor="middle" x="150" y="200">0</text><text class="t-s t-mono t-mut" text-anchor="middle" x="287.5" y="200">0.25</text><text class="t-s t-mono t-mut" text-anchor="middle" x="425" y="200">0.5</text><text class="t-s t-mono t-mut" text-anchor="middle" x="562.5" y="200">0.75</text><text class="t-s t-mono t-mut" text-anchor="middle" x="700" y="200">1</text><text class="t-s t-mut" text-anchor="start" x="150" y="30">블록 최댓값을 1로 놓았을 때 표현할 수 있는 크기</text></svg></svg>
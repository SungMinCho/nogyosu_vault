<!-- 회사 2: ROE 10% -->
<rect class="f-ink-a" height="60" width="100" x="280" y="260"></rect>
<rect class="no-fill ln2 thin" height="60" width="100" x="280" y="260"></rect>
<text class="mid t-s t-ink2" x="330" y="226">PVGO 0</text>
<text class="mid b" x="330" y="249">P₀ = 50</text>
<text class="mid t-num t-ink2" x="330" y="296">50</text>
<!-- 회사 3: ROE 8% -->
<rect class="f-ink-a" height="46" width="100" x="440" y="274"></rect>
<rect class="f-alarm-a" height="14" width="100" x="440" y="260"></rect>
<rect class="no-fill ln-alarm thin dash" height="14" width="100" x="440" y="260"></rect>
<line class="ln" x1="440" x2="540" y1="274" y2="274"></line>
<line class="ln2 thin" x1="440" x2="440" y1="274" y2="320"></line>
<line class="ln2 thin" x1="540" x2="540" y1="274" y2="320"></line>
<text class="mid t-s t-alarm" x="490" y="226">PVGO −11.5</text>
<text class="mid b" x="490" y="249">P₀ = 38.5</text>
<text class="mid t-num t-ink2" x="490" y="302">38.5</text>
<!-- 아래 이름표 -->
<text class="mid b t-ret" x="170" y="346">ROE 15% &gt; k</text>
<text class="mid b" x="330" y="346">ROE 10% = k</text>
<text class="mid b t-alarm" x="490" y="346">ROE 8% &lt; k</text>
<text class="mid t-xs t-ink2" x="170" y="370">g 9% · P/E 40</text>
<text class="mid t-xs t-ink2" x="330" y="370">g 6% · P/E 10</text>
<text class="mid t-xs t-ink2" x="490" y="370">g 4.8% · P/E 7.7</text>
<text class="end t-xs t-mute" x="92" y="264">50</text>
</svg></g></g></g></g></g></svg>
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-sunsoft{ fill:var(--sun-soft) }.fig .f-zero{ fill:var(--zero) }.fig .f-zerosoft{ fill:var(--zero-soft) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-blood{ fill:var(--blood) }.fig .f-river{ fill:url(#river-g) }.fig .sc-sun{ stop-color:var(--sun-soft) }.fig .sc-zero{ stop-color:var(--zero-soft) }.fig .s-ink{ stroke:var(--ink) }.fig .s-mute{ stroke:var(--ink-2) }.fig .s-sun{ stroke:var(--sun) }.fig .s-zero{ stroke:var(--zero) }.fig .w1{ stroke-width:1 }.fig .w15{ stroke-width:1.5 }.fig .w2{ stroke-width:2 }svg.pz-root{width:740px!important;height:262px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!impo
<text class="ts c" x="240" y="252">‘그것’인가 ‘우리’인가 — 발견되는 답이 아니라 만들어지는 답</text>
<text class="tm c vg" x="240" y="273">인정은 발견이 아니라 행위이고, 양쪽으로 흐른다</text>

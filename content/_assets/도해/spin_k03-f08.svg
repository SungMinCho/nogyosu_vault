    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .t-grid{ fill:var(--grid) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-grid{ stroke:var(--grid) }.dg .dash{ stroke-dasharray:4 3 }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .ln-mut-hair{ stroke:var(--muted); stroke-width:1 }.dg .f-ink{ fill:var(--ink) }.dg .f-mut{ fill:var(--muted) }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .plot-bg{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .ctr{ fill:none; stroke-width:1.4 }.dg .ctr-1{ stroke:var(--rot) }.dg .ctr-2{ stroke:var(--spike) }.dg .dot-sp{ fill:var(--spike); stroke:var(--paper); stroke-width:1.5 }.dg .dot-rt{ fill:var(--rot); stroke:var(--paper); stroke-width:1.5 }.dg .ser-ink{ fill:none; stroke:var(--ink); stroke-width:2 }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:790px!important;height:360px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!
)"/><g class="pz-w wrap"><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="약정 100짜리 사모펀드의 해마다 순현금흐름 막대와 누적선. 처음 4년은 캐피털 콜로 누적이 −71까지 파였다가, 회수가 시작되며 7년째에 플러스로 올라서 10년 뒤 +75로 끝난다." class="dg pz-inner" height="100%" role="img" viewBox="0 0 600 340" width="100%">

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 512" width="900" height="512" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tl, .chart .tl{ font-family:var(--f-latin); font-style:italic; }.fig-svg .tm, .chart .tm{ font-family:var(--f-mono); font-size:11px; }.fig-svg .halo, .chart .halo{ paint-order:stroke; stroke:var(--deep); stroke-width:4px; stroke-linejoin:round; }.c-ink2{ fill:var(--ink2) !important }.c-cold{ fill:var(--cold) !important }.c-fire{ fill:var(--fire) !important }.c-pass{ fill:var(--pass) !important }.c-order{ fill:var(--order) !important }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-cold{ stroke:var(--cold) }.s-fire{ stroke:var(--fire) }.s-pass{ stroke:var(--pass) }.s-order{ stroke:var(--order) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-land{ fill:var(--land) }.f-ink{ fill:var(--ink) }.f-fire{ fill:var(--fire) }.f-fire-t{ fill:var(--fire); fill-opacity:.16 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.dash{ stroke-dasharray:5 4 }.mk-ink{ fill:var(--ink) }.mk-fire{ fill:var(--fire) }.mk-pass{ fill:var(--pass) }svg.pz-root{width:900px!important;height:512px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="세르가 나란히 놓은 지붕 셋과 대포. 휘트브레드 양조장의 완벽한 기하 골조, 나무를 철이 거드는 라이트의 대장간, 직각을 잃고 화로가 중심에 선 터너의 주조소, 그리고 주조소가 만드는 대포. 아래 연표는 같은 길을 라그랑주 1788의 단순 기계에서 카르노 1824의 불의 기계로, 아버지 라자르 카르노에서 아들 사디로 읽는다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 900 512" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F17-ar-fire" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-fire" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F17-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F17-ar-pass" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-pass" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t" text-anchor="middle" x="115" y="40">휘트브레드 양조장</text><text class="ts" text-anchor="middle" x="115" y="57">개러드 1784</text><polygon class="s-order f-land w2" points="35,150 115,80 195,150"></polygon><line class="s-order w2 f-none" x1="115" x2="115" y1="80" y2="150"></line><line class="s-order w15 f-none" x1="115" x2="75" y1="150" y2="115"></line><line class="s-order w15 f-none" x1="115" x2="155" y1="150" y2="115"></line><path class="s-order w1 f-none" d="M123,150 L123,142 L115,142"></path><line class="s-order w2 f-none" x1="45" x2="45" y1="150" y2="195"></line><line class="s-order w2 f-none" x1="185" x2="185" y1="150" y2="195"></line><line class="s-ink w15 f-none" x1="25" x2="205" y1="195" y2="195"></line><text class="t c-order" text-anchor="middle" x="115" y="216">완벽한 기하 골조</text><text class="ts" text-anchor="middle" x="115" y="233">힘: 사람 · 말 · 바람 · 물</text><text class="t" text-anchor="middle" x="325" y="40">라이트 〈대장간〉</text><text class="ts" text-anchor="middle" x="325" y="57">1772</text><path class="s-order f-land w2" d="M245,150 Q290,128 325,86 Q360,128 405,150 Z"></path><line class="s-order w2 f-none" x1="245" x2="405" y1="150" y2="150"></line><line class="s-order w15 f-none" x1="325" x2="325" y1="86" y2="150"></line><line class="s-order w15 f-none" x1="325" x2="290" y1="150" y2="124"></line><line class="s-order w15 f-none" x1="325" x2="360" y1="150" y2="124"></line><line class="s-ink w3 f-none" x1="248" x2="402" y1="156" y2="156"></line><rect class="s-ink f-ink w1" height="10" rx="0" width="12" x="319" y="84"></rect><rect class="s-ink f-ink w1" height="10" rx="0" width="12" x="243" y="146"></rect><rect class="s-ink f-ink w1" height="10" rx="0" width="12" x="395" y="146"></rect><rect class="s-ink f-ink w1" height="10" rx="0" width="12" x="319" y="144"></rect><line class="s-order w2 f-none" x1="255" x2="255" y1="150" y2="195"></line><line class="s-order w2 f-none" x1="395" x2="395" y1="150" y2="195"></line><line class="s-ink w15 f-none" x1="235" x2="415" y1="195" y2="195"></line><text class="t" text-anchor="middle" x="325" y="216">나무를 철이 거든다</text><text class="ts" text-anchor="middle" x="325" y="233">화로는 보이지 않는다</text><text class="t" text-anchor="middle" x="535" y="40">터너의 주조소</text><text class="ts" text-anchor="middle" x="535" y="57">약 1797</text><path class="s-cold w2 f-none" d="M455,153 L493,120 L530,97"></path><path class="s-cold w2 f-none" d="M548,87 L584,118 L616,145"></path><line class="s-cold w15 f-none" x1="538" x2="547" y1="94" y2="140"></line><line class="s-cold w2 f-none" x1="455" x2="529" y1="153" y2="149"></line><line class="s-cold w2 f-none" x1="541" x2="616" y1="157" y2="145"></line><line class="s-cold w15 f-none" x1="500" x2="478" y1="150" y2="124"></line><line class="s-cold w15 f-none" x1="572" x2="596" y1="152" y2="128"></line><line class="s-cold w2 f-none" x1="463" x2="458" y1="152" y2="195"></line><line class="s-cold w2 f-none" x1="607" x2="613" y1="147" y2="195"></line><line class="s-ink w15 f-none" x1="445" x2="625" y1="195" y2="195"></line><path class="s-fire f-fire w15" d="M516,195 L516,178 A19,19 0 0 1 554,178 L554,195 Z"></path><circle class="s-fire f-fire-t w2" cx="588" cy="176" r="9"></circle><line class="s-fire w15 f-none" x1="577.608" x2="572.412" y1="170" y2="167"></line><line class="s-fire w15 f-none" x1="583.896" x2="581.844" y1="164.724" y2="159.086"></line><line class="s-fire w15 f-none" x1="592.104" x2="594.156" y1="164.724" y2="159.086"></line><line class="s-fire w15 f-none" x1="598.392" x2="603.588" y1="170" y2="167"></line><line class="s-fire w15 f-none" x1="599.818" x2="605.727" y1="178.084" y2="179.126"></line><line class="s-fire w15 f-none" x1="595.713" x2="599.57" y1="185.193" y2="189.789"></line><text class="t c-cold" text-anchor="middle" x="535" y="216">무질서 · 화로가 중심</text><text class="ts c-fire" text-anchor="middle" x="535" y="233">불의 원천 둘: 화로 입구 · 검은 복사</text><text class="t c-fire" text-anchor="middle" x="775" y="40">대포</text><text class="ts" text-anchor="middle" x="775" y="57">검고 무시무시한</text><polygon class="s-fire f-fire w15" points="718.993,169.621 849.746,130.779 846.254,117.221 713.007,146.379"></polygon><circle class="s-fire f-fire w15" cx="712" cy="159" r="7"></circle><line class="s-ink w3 f-none" x1="752" x2="694" y1="172" y2="195"></line><circle class="s-ink f-deep w2" cx="752" cy="172" r="22"></circle><line class="s-ink w1 f-none" x1="732" x2="772" y1="172" y2="172"></line><line class="s-ink w1 f-none" x1="734.679" x2="769.321" y1="162" y2="182"></line><line class="s-ink w1 f-none" x1="742" x2="762" y1="154.679" y2="189.321"></line><line class="s-ink w1 f-none" x1="752" x2="752" y1="152" y2="192"></line><line class="s-ink w1 f-none" x1="762" x2="742" y1="154.679" y2="189.321"></line><line class="s-ink w1 f-none" x1="769.321" x2="734.679" y1="162" y2="182"></line><line class="s-ink w15 f-none" x1="670" x2="870" y1="195" y2="195"></line><text class="t c-fire" text-anchor="middle" x="775" y="216">주조소가 만드는 것</text><line class="s-fire w2 f-none" marker-end="url(#F17-ar-fire)" x1="622" x2="694" y1="112" y2="112"></line><text class="ts halo" text-anchor="middle" x="658" y="104">만든다</text><line class="s-ink w15 f-none" marker-end="url(#F17-ar-ink)" x1="35" x2="612" y1="258" y2="258"></line><text class="ts" text-anchor="middle" x="323" y="278">단계마다 더 뜨겁고, 경계는 덜 기하적이다</text><text class="t" text-anchor="start" x="620" y="262">정역학은 죽었다</text><line class="s-ink w15 f-none" x1="50" x2="850" y1="340" y2="340"></line><line class="s-ink w1 f-none" x1="50" x2="50" y1="336" y2="344"></line><text class="tm c-ink2" text-anchor="middle" x="50" y="356">1770</text><line class="s-ink w1 f-none" x1="150" x2="150" y1="336" y2="344"></line><text class="tm c-ink2" text-anchor="middle" x="150" y="356">1780</text><line class="s-ink w1 f-none" x1="250" x2="250" y1="336" y2="344"></line><text class="tm c-ink2" text-anchor="middle" x="250" y="356">1790</text><line class="s-ink w1 f-none" x1="350" x2="350" y1="336" y2="344"></line><text class="tm c-ink2" text-anchor="middle" x="350" y="356">1800</text><line class="s-ink w1 f-none" x1="450" x2="450" y1="336" y2="344"></line><text class="tm c-ink2" text-anchor="middle" x="450" y="356">1810</text><line class="s-ink w1 f-none" x1="550" x2="550" y1="336" y2="344"></line><text class="tm c-ink2" text-anchor="middle" x="550" y="356">1820</text><line class="s-ink w1 f-none" x1="650" x2="650" y1="336" y2="344"></line><text class="tm c-ink2" text-anchor="middle" x="650" y="356">1830</text><line class="s-ink w1 f-none" x1="750" x2="750" y1="336" y2="344"></line><text class="tm c-ink2" text-anchor="middle" x="750" y="356">1840</text><line class="s-ink w1 f-none" x1="850" x2="850" y1="336" y2="344"></line><text class="tm c-ink2" text-anchor="middle" x="850" y="356">1850</text><line class="s-ink2 w1 f-none" x1="70" x2="70" y1="335" y2="308"></line><circle class="s-ink f-deep w15" cx="70" cy="340" r="3.5"></circle><text class="ts" text-anchor="start" x="66" y="304">1772 라이트 〈대장간〉</text><line class="s-ink2 w1 f-none" x1="190" x2="190" y1="335" y2="326"></line><circle class="s-ink f-deep w15" cx="190" cy="340" r="3.5"></circle><text class="ts" text-anchor="start" x="186" y="322">1784 개러드 (위키 1783)</text><line class="s-ink2 w1 f-none" x1="320" x2="320" y1="335" y2="308"></line><circle class="s-ink f-deep w15" cx="320" cy="340" r="3.5"></circle><text class="ts" text-anchor="start" x="316" y="304">약 1797 터너, 작업장을 주조소로</text><line class="s-ink2 w1 f-none" x1="790" x2="790" y1="335" y2="326"></line><circle class="s-ink f-deep w15" cx="790" cy="340" r="3.5"></circle><text class="ts" text-anchor="end" x="794" y="322">〈비, 증기, 속도〉 1844</text><circle class="s-ink f-ink w15" cx="180" cy="340" r="3.5"></circle><line class="s-ink2 w1 f-none" x1="180" x2="180" y1="345" y2="364"></line><text class="t c-order" text-anchor="end" x="172" y="380">라자르 카르노 1783</text><text class="ts" text-anchor="end" x="172" y="398">『기계 일반 시론』</text><circle class="s-ink f-ink w15" cx="230" cy="340" r="3.5"></circle><line class="s-ink2 w1 f-none" x1="230" x2="230" y1="345" y2="364"></line><text class="t c-order" text-anchor="start" x="234" y="380">1788 라그랑주</text><text class="ts" text-anchor="start" x="234" y="398">『해석역학』 · 그림 없는 역학</text><circle class="s-ink f-ink w15" cx="590" cy="340" r="3.5"></circle><line class="s-ink2 w1 f-none" x1="590" x2="590" y1="345" y2="364"></line><text class="t c-fire" text-anchor="start" x="598" y="380">1824 사디 카르노 (아들)</text><text class="ts" text-anchor="start" x="598" y="398">『불의 동력에 관한 고찰』</text><text class="ts c-fire" text-anchor="end" x="172" y="414">아버지 · '승리의 조직자'</text><text class="ts c-ink2" text-anchor="start" x="10" y="304">그림</text><text class="ts c-ink2" text-anchor="start" x="10" y="380">책</text><line class="s-pass w2 f-none" marker-end="url(#F17-ar-pass)" x1="236" x2="576" y1="430" y2="430"></line><text class="ts c-pass halo" text-anchor="middle" x="406" y="424">개러드 → 터너 = 라그랑주 → 카르노</text><text class="ts c-order" text-anchor="start" x="236" y="448">단순 기계</text><text class="ts c-fire" text-anchor="end" x="576" y="448">불의 기계</text><path class="s-fire w15 f-none dash" d="M180,366 L180,462 L590,462 L590,370" marker-end="url(#F17-ar-fire)"></path><text class="t c-fire" text-anchor="middle" x="385" y="482">과학의 카르노는 전쟁의 카르노의 딸</text><text class="ts tl" text-anchor="middle" x="385" y="499">Carnot-la-ciencia es la hija de Carnot-la-guerra</text></svg></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 400" width="720" height="400" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2{ stroke:var(--ink-2); }.f-ink2-t{ fill:var(--ink-2); }.f-muted{ stroke:var(--muted); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-indigo-f{ fill:var(--indigo-soft); }.f-madder{ stroke:var(--madder); }.f-madder-t{ fill:var(--madder); }.f-ochre-t{ fill:var(--ochre); }.f-mend-t{ fill:var(--mend); }.f-shade-f{ fill:var(--shade); }.f-panel-f{ fill:var(--panel); }.f-none{ fill:none; }.f-dash{ stroke-dasharray:6 5; }.f-dot{ stroke-dasharray:2 4; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-l{ font-size:15px; }svg .t-xl{ font-size:18px; }svg .t-mono{ font-family:var(--f-mono); }svg .t-b{ font-weight:700; }svg .halo{ paint-order:stroke; stroke:var(--panel); stroke-width:4px; stroke-linejoin:round; }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="왼쪽 기표적 체제에서는 전제군주의 얼굴인 중심에서 원들이 번지고 해석이 기호를 기호로 되돌리며 원을 키우며, 도주선은 속죄 동물에 막히고 희생양만 음의 부호를 달고 접선으로 쫓겨난다. 오른쪽 후기표적 체제에서는 주체화의 점에서 나온 언표행위의 주체가 언표의 주체로 떨어지면 소송 하나가 끝나고 다음 소송이 시작되며, 풀려난 도주선도 마디마디 잘려 음으로 막혀 있다." height="100%" role="img" viewBox="0 0 720 400" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f13-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f13-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f13-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5"
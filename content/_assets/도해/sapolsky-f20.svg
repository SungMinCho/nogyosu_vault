<text class="t-b" x="332" y="18">② 새폴스키의 목록 뒤</text>
<text class="t-s t-m" x="470" y="18">같은 입력, 두 칸 모두</text>
<rect class="f-inkw ln-2" height="26" rx="3" width="300" x="332" y="46"></rect>
<text class="t-s" text-anchor="middle" x="482" y="63">혈당 · 수면 · 납 · 문화 · 땀 냄새 …</text>
<rect class="f-paper ln" height="154" rx="2" width="110" x="342" y="104"></rect>
<text class="t-s t-b" text-anchor="middle" x="397" y="122">생물학적인 것</text>

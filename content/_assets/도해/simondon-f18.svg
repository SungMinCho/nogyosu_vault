nt;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="왼쪽에서 오른쪽으로 절대 외부, 병합된 외부성인 장의 빈 공간, 장 상피의 막, 내부 환경인 피, 내분비샘 세포의 막, 절대 내부가 이어진다. 장의 빈 공간은 입과 항문으로 막 없이 바깥과 이어져 있어 바깥과 같은 색이고, 중간수용기 눈이 그 안을 살피며 배출 운동이 그것을 바깥으로 비운다. 피는 장 막에 대해서는 안쪽, 샘 막에 대해서는 바깥쪽이다. 막마다 나트륨-칼륨 펌프가 있다. 아래: 막 한 겹뿐인 단세포, 넓이에 비례한 네모로 본 소장 점막 약 30제곱미터 대 피부 약 1.8제곱미터, 그리고 확대한 막 하나 — 바깥은 올 것, 안은 응축된 과거, 막은 현재." class="pz-inner" height="100%" role="img" viewBox="0 0 760 440" width="100%">

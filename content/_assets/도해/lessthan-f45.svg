<circle class="f-ink" cx="735" cy="44" r="3.5"></circle>
<text class="t-mid t-s" x="735" y="32">정수리 = 브라시에</text>
<ellipse class="f-none s-flesh w2" cx="790" cy="84" rx="12" ry="4"></ellipse>
<text class="t-mid t-s f-flesh" x="735" y="104">고랑 속 원운동 = 라캉</text>

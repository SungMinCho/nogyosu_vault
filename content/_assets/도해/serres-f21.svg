<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 500" width="900" height="500" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .halo, .chart .halo{ paint-order:stroke; stroke:var(--deep); stroke-width:4px; stroke-linejoin:round; }.c-cold{ fill:var(--cold) !important }.c-pass{ fill:var(--pass) !important }.c-order{ fill:var(--order) !important }.c-caution{ fill:var(--caution) !important }.s-ink2{ stroke:var(--ink2) }.s-cold{ stroke:var(--cold) }.s-pass{ stroke:var(--pass) }.s-order{ stroke:var(--order) }.s-caution{ stroke:var(--caution) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-land{ fill:var(--land) }.f-ink2{ fill:var(--ink2) }.f-pass{ fill:var(--pass) }.f-caution{ fill:var(--caution) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.dash{ stroke-dasharray:5 4 }.mk-pass{ fill:var(--pass) }svg.pz-root{width:900px!important;height:500px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="북서항로의 개념도. 대서양에서 데이비스 해협과 배핀만을 지나 랭커스터 해협과 배로 해협으로 서쪽으로 간 뒤 길이 갈라진다. 북쪽 맥클루어 해협은 다년빙으로 자주 막히고, 가운데 프린스오브웨일스 해협은 아문센만으로 내려가며, 아문센이 간 남쪽 길은 필 해협과 프랭클린 해협, 레이·심프슨 해협, 퀸모드만, 코로네이션만, 돌핀앤드유니언 해협을 지나 아문센만으로 나온다. 다시 보퍼트해, 포인트배로, 베링 해협을 지나 태평양으로 간다. 아문센은 요아 항에서 두 겨울을 났다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 900 500" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F23-ar-pass" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-pass" d="M0,0 L10,5 L0,10 z"></path></marker></defs><polygon class="s-order f-land w1" points="818,0 900,0 900,330 872,346 846,322 832,262 814,200 802,140 808,70"></polygon><polygon class="s-order f-land w1" points="692,176 716,170 744,194 768,242 772,290 760,330 738,364 712,372 690,352 668,322 640,302 614,284 604,262 614,238 642,214 664,196"></polygon><polygon class="s-order f-land w1" points="572,66 700,58 736,88 722,120 692,128 622,126 577,124 562,98"></polygon><polygon class="s-order f-land w1" points="550,172 598,168 606,200 594,236 556,242 548,206"></polygon><polygon class="s-order f-land w1" points="462,172 522,170 526,214 516,262 476,268 456,230"></polygon><polygon class="s-order f-land w1" points="486,300 526,292 538,308 536,340 510,348 484,334"></polygon><polygon class="s-order f-land w1" points="320,172 430,170 440,200 442,250 452,298 436,328 400,336 362,338 332,326 320,296 328,250 322,206"></polygon><polygon class="s-order f-land w1" points="212,168 296,166 302,200 298,250 282,282 240,288 214,252 206,206"></polygon><polygon class="s-order f-land w1" points="320,62 452,58 470,90 446,122 380,128 322,120 308,92"></polygon><polygon class="s-order f-land w1" points="0,236 20,246 34,300 38,350 30,384 0,394"></polygon><polygon class="s-order f-land w1" points="60,386 72,330 64,300 80,250 98,214 130,234 170,262 210,284 240,302 262,320 300,348 340,360 380,372 420,366 440,376 480,372 520,370 548,362 552,330 556,290 560,254 592,252 606,282 640,312 662,342 692,382 740,400 782,420 800,460 800,500 96,500 72,462 90,430 78,398"></polygon><path class="s-ink2 w15 dash f-none" d="M536.0,152.0 L470.0,148.0 L400.0,148.0 L312.0,147.0"></path><path class="s-ink2 w15 dash f-none" d="M312.0,147.0 L308.0,180.0 L306.0,250.0 L288.0,292.0 L272.0,300.0"></path><path class="s-cold w3 dash f-none" d="M312.0,147.0 L250.0,146.0 L190.0,150.0"></path><path class="s-pass w3 f-none" d="M852.0,482.0 L812.0,380.0 L800.0,300.0 L790.0,220.0 L762.0,160.0 L722.0,152.0 L640.0,152.0 L560.0,152.0 L536.0,152.0 L534.0,200.0 L536.0,262.0 L546.0,286.0 L548.0,318.0 L546.0,344.0 L512.0,358.0 L470.0,358.0 L420.0,352.0 L370.0,350.0 L334.0,340.0 L304.0,324.0 L272.0,300.0 L226.0,270.0 L172.0,248.0 L130.0,222.0 L100.0,202.0 L78.0,222.0 L58.0,272.0 L50.0,320.0 L48.0,372.0 L46.0,412.0 L40.0,452.0" marker-end="url(#F23-ar-pass)"></path><circle class="s-pass f-deep w2" cx="546" cy="344" r="5"></circle><circle class="s-pass f-deep w2" cx="172" cy="248" r="4"></circle><circle class="s-caution f-caution w1" cx="722" cy="152" r="4"></circle><circle class="s-caution f-caution w1" cx="258" cy="169" r="4"></circle><circle class="s-pass f-pass w1" cx="80" cy="402" r="3.5"></circle><text class="t c-cold" text-anchor="middle" x="852" y="410">대서양</text><text class="ts" text-anchor="middle" x="852" y="496">1903.6.16 출항</text><text class="t c-cold" text-anchor="middle" x="784" y="112">배핀만</text><text class="ts halo" text-anchor="start" x="814" y="293">데이비스</text><text class="ts halo" text-anchor="start" x="814" y="311">해협</text><text class="t c-cold" text-anchor="middle" x="150" y="112">보퍼트해</text><text class="t c-cold" text-anchor="middle" x="36" y="484">태평양</text><text class="ts halo" text-anchor="middle" x="668" y="142">랭커스터 해협</text><text class="ts halo" text-anchor="middle" x="586" y="142">배로 해협</text><text class="ts" text-anchor="start" x="552" y="210">필 해협</text><text class="ts" text-anchor="start" x="562" y="280">프랭클린 해협</text><text class="ts" text-anchor="start" x="560" y="318">레이 해협</text><text class="ts c-pass" text-anchor="start" x="560" y="350">요아 항 · 두 겨울 1903–05</text><text class="ts" text-anchor="middle" x="500" y="388">심프슨 해협</text><text class="ts" text-anchor="middle" x="456" y="404">퀸모드만</text><text class="ts" text-anchor="middle" x="372" y="392">코로네이션만</text><text class="ts" text-anchor="middle" x="300" y="376">돌핀앤드유니언 해협</text><text class="ts" text-anchor="middle" x="244" y="334">아문센만</text><text class="ts c-pass" text-anchor="middle" x="172" y="286">셋째 겨울 1905–06</text><circle class="f-ink2" cx="98" cy="214" r="2.5"></circle><text class="ts" text-anchor="middle" x="100" y="186">포인트배로</text><text class="ts" text-anchor="start" x="70" y="372">베링 해협</text><text class="ts c-pass" text-anchor="start" x="92" y="416">놈 1906.8.31</text><text class="ts halo" text-anchor="middle" x="252" y="137">맥클루어 해협</text><text class="ts c-cold" text-anchor="middle" x="252" y="99">얼음 · 다년빙으로</text><text class="ts c-cold" text-anchor="middle" x="252" y="117">자주 막힘</text><text class="ts" text-anchor="start" x="334" y="200">← 프린스오브</text><text class="ts" text-anchor="start" x="346" y="216">웨일스 해협</text><text class="ts c-order" text-anchor="middle" x="864" y="160">그린란드</text><text class="ts c-order" text-anchor="middle" x="690" y="300">배핀섬</text><text class="ts c-order" text-anchor="middle" x="386" y="86">멜빌섬</text><text class="ts" text-anchor="middle" x="386" y="102">1819 패리</text><text class="ts c-order" text-anchor="middle" x="384" y="282">빅토리아섬</text><text class="ts c-order" text-anchor="middle" x="256" y="250">뱅크스섬</text><text class="ts c-caution" text-anchor="middle" x="256" y="190">1853 머시만</text><text class="ts c-caution" text-anchor="middle" x="256" y="207">배 버리고 뭍으로</text><text class="ts c-caution" text-anchor="middle" x="650" y="98">1616 배핀·바일럿</text><text class="ts c-caution" text-anchor="middle" x="650" y="114">입구에서 얼음에 막힘</text><line class="s-pass w3 f-none" x1="560" x2="594" y1="436" y2="436"></line><text class="ts" text-anchor="start" x="602" y="440">아문센 1903–06 · 요아호 47톤, 7명</text><line class="s-cold w3 dash f-none" x1="560" x2="594" y1="456" y2="456"></line><text class="ts" text-anchor="start" x="602" y="460">얼음으로 자주 막힘</text><line class="s-ink2 w15 dash f-none" x1="560" x2="594" y1="476" y2="476"></line><text class="ts" text-anchor="start" x="602" y="480">다른 갈래</text><text class="ts c-order" text-anchor="middle" x="330" y="450">북아메리카 본토</text><text class="ts c-order" text-anchor="middle" x="17" y="322">아시아</text><text class="ts c-order" text-anchor="start" x="20" y="30">캐나다 북극 군도: 섬 36,563개</text><text class="ts" text-anchor="start" x="20" y="46">배핀섬 하나가 면적의 36%</text></svg></g></g></g></g></svg>
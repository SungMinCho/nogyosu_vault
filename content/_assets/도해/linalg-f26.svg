}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#0C2240; --paper-2:#112D55; --sheet:#0F284B; --ink:#E3EBF5; --ink-2:#9CB0C9; --rule:#2B4B77; --grid:#1B3960; --axis:#6F88A8;
  --c-in:#8CC0FF; --c-out:#FF906C; --c-inv:#F0C659; --c-orth:#56D0BA; --c-warn:#D6A5EA; --c-null:#93A4BA;
  --w-in:rgba(140,192,255,.14); --w-out:rgba(255,144,108,.16); --w-inv:rgba(240,198,89,.16); --w-orth:rgba(86,208,186,.15); --w-warn:rgba(214,165,234,.26); --w-mut:rgba(156,176,201,.12);

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 330" width="800" height="330" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .t-grid{ fill:var(--grid) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-spike{ stroke:var(--spike) }.dg .dash{ stroke-dasharray:4 3 }.dg .ln-stream{ stroke:var(--rot); stroke-width:3 }.dg .f-ink{ fill:var(--ink) }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-spike{ fill:var(--spike-soft); stroke:var(--spike) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.dg .bx-on{ fill:var(--paper); stroke:var(--rot); stroke-width:1.4; stroke-dasharray:5 3 }.dg .ssub{ font-size:8px }svg.pz-root{width:800px!important;height:330px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="오프라인 R1은 잔차를 돌리고 RMSNorm의 감마를 가중치에 녹이지만, AMD의 온라인 R1은 잔차를 돌리지 않고 감마를 제자리에 둔 채 평활 D를 감마에 녹이고 블록 128 회전을 층마다 온라인으로 곱한다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 800 330" width="100%"><defs><marker id="am-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="am-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="am-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-b" text-anchor="start" x="16" y="38">오프라인 R1 — QuaRot · SpinQuant (INT4에서의 표준)</text><line class="ln-stream" x1="16" x2="150" y1="79" y2="79"></line><text class="t-s t-b t-rot" text-anchor="start" x="20" y="70">잔차 h · Q</text><rect class="bx" height="42" rx="4" width="150" x="160" y="58"></rect><text class="t-s t-b" text-anchor="middle" x="235" y="76">RMSNorm</text><text class="t-s t-mut" text-anchor="middle" x="235" y="91">γ를 떼어 냄</text><line class="ln" marker-end="url(#am-ink)" x1="311" x2="368" y1="79" y2="79"></line><rect class="bx bx-rot" height="42" rx="4" width="200" x="370" y="58"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="470" y="76">W<tspan class="ssub" dy="3">qkv</tspan><tspan dy="-3">​</tspan> ← Qᵀ · diag(γ) · W</text><text class="t-s t-mut" text-anchor="middle" x="470" y="91">회전·γ 모두 가중치에</text><path class="ln ln-spike dash" d="M 235 102 Q 330 148 440 102" marker-end="url(#am-spike)"></path><text class="t-s t-spike" text-anchor="middle" x="338" y="142">γ가 가중치로 — 2강의 γ 이상치가 W 안에</text><rect class="bx bx-spike" height="42" rx="4" width="180" x="600" y="58"></rect><text class="t-s t-b t-spike" text-anchor="middle" x="690" y="76">비용 0</text><text class="t-s t-mut" text-anchor="middle" x="690" y="91">MXFP4에선 “해롭다”(AMD)</text><text class="t-b" text-anchor="start" x="16" y="180">온라인 R1 — AMD ROCm (MXFP4, MI355X)</text><line class="ln" x1="16" x2="150" y1="221" y2="221"></line><text class="t-s t-b" text-anchor="start" x="20" y="212">잔차 h (안 돌림)</text><rect class="bx bx-grid" height="42" rx="4" width="150" x="160" y="200"></rect><text class="t-s t-b t-grid" text-anchor="middle" x="235" y="218">RMSNorm · γ·D</text><text class="t-s t-mut" text-anchor="middle" x="235" y="233">D(평활)를 γ에 녹임</text><line class="ln" marker-end="url(#am-ink)" x1="311" x2="338" y1="221" y2="221"></line><rect class="bx-on" height="42" rx="4" width="150" x="340" y="200"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="415" y="218">R 온라인</text><text class="t-s t-mut" text-anchor="middle" x="415" y="233">블록 128 · 케일리 학습</text><line class="ln" marker-end="url(#am-ink)" x1="491" x2="518" y1="221" y2="221"></line><rect class="bx bx-rot" height="42" rx="4" width="170" x="520" y="200"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="605" y="218">W ← Rᵀ · D⁻¹ · W</text><text class="t-s t-mut" text-anchor="middle" x="605" y="233">qkv 하나 · gate_up 하나</text><rect class="bx bx-rot" height="42" rx="4" width="90" x="700" y="200"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="745" y="218">R2 병합</text><text class="t-s t-mut" text-anchor="middle" x="745" y="233">v→o 헤드별</text><text class="t-s t-mut" text-anchor="start" x="160" y="264">R3(Q·K) · R4(down_proj) 꺼 둠 — "r3": false, "r4": false</text><text class="t-s t-mut" text-anchor="start" x="160" y="282">O = D·R → O·Oᵀ = D·Dᵀ ≠ I (비직교) · 손실 KL-Top 1000 · pileval 700스텝</text></svg></g></g></g></g></svg>
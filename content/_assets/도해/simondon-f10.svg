<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 400" width="720" height="400" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#E6ECE9; --panel:#F2F5F3; --ink:#172120; --ink-2:#4A5755; --rule:#B6C3BF;
  --liq:#1B6971; --liq-soft:#CFE0DE; --liq-dot:#7FA9AB;
  --cry:#866207; --cry-soft:#EAD9A0; --cry-deep:#C9A43C;
  --inf:#5B3D8F; --inf-soft:#DCD3EA;
  --brk:#983B20; --brk-soft:#EFD5CB;
  --shade:#0E1514; --on-shade:#E6ECE9;
  --f-display:"Hahmlet","Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR",serif;
  --f-body:"Gowun Batang","Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR",serif;
  --f-latin:"Old Standard TT","Gowun Batang","Noto Serif CJK KR",serif;
  --f-mono:"Cutive Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","Courier New",monospace;
  --pad:1.05rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1716; --panel:#15211F; --ink:#DCE6E3; --ink-2:#9EB0AC; --rule:#2D3F3C;
  --liq:#58B4BC; --liq-soft:#163538; --liq-dot:#3C7176;
  --cry:#D8B24B; --cry-soft:#3A3014; --cry-deep:#9C7E2C;
  --inf:#A88DDC; --inf-soft:#2A2140;
  --brk:#E27D57; --brk-soft:#3C2219;
  --shade:#050909; --on-shade:#C9D6D2; color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#0E1716; --panel:#15211F; --ink:#DCE6E3; --ink-2:#9EB0AC; --rule:#2D3F3C;
  --liq:#58B4BC; --liq-soft:#163538; --liq-dot:#3C7176;
  --cry:#D8B24B; --cry-soft:#3A3014; --cry-deep:#9C7E2C;
  --inf:#A88DDC; --inf-soft:#2A2140;
  --brk:#E27D57; --brk-soft:#3C2219;
  --shade:#050909; --on-shade:#C9D6D2; color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.hero-fig svg{ width:100%; height:auto; display:block }figure.fig{ margin:.4rem 0 .6rem }.fig-frame{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background:
  linear-gradient(to right,var(--paper),var(--paper)) left/1.2rem 100% no-repeat local,
  linear-gradient(to left,var(--paper),var(--paper)) right/1.2rem 100% no-repeat local,
  linear-gradient(to right,rgba(0,0,0,.18),rgba(0,0,0,0)) left/.7rem 100% no-repeat scroll,
  linear-gradient(to left,rgba(0,0,0,.18),rgba(0,0,0,0)) right/.7rem 100% no-repeat scroll;
  background-color:var(--paper) }.fig-frame svg{ display:block; width:100%; min-width:560px; height:auto }.fig svg text, .hero-fig text{ font-family:var(--f-body); fill:var(--ink) }.t{ font-size:13px }.t-s{ font-size:11px }.t-num{ font-family:var(--f-latin) !important; font-variant-numeric:tabular-nums }.t-b{ font-weight:700 }.t-mute{ fill:var(--ink-2) !important }.t-liq{ fill:var(--liq) !important }.t-cry{ fill:var(--cry) !important }.t-inf{ fill:var(--inf) !important }.t-brk{ fill:var(--brk) !important }.f-none{ fill:none }.f-ink{ fill:var(--ink) }.f-liq-soft{ fill:var(--liq-soft) }.f-cry-soft{ fill:var(--cry-soft) }.f-cry-deep{ fill:var(--cry-deep) }.f-inf{ fill:var(--inf) }.s-none{ stroke:none }.s-ink{ stroke:var(--ink) }.s-mute{ stroke:var(--ink-2) }.s-rule{ stroke:var(--rule) }.s-liq{ stroke:var(--liq) }.s-cry{ stroke:var(--cry) }.s-inf{ stroke:var(--inf) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w4{ stroke-width:4.5 }.dash{ stroke-dasharray:5 4 }.dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }.hero-fig .band:hover polygon, .hero-fig .band:focus polygon{ fill:var(--inf-soft) }svg.pz-root{width:720px!important;height:400px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="황의 준안정 사다리. 왼쪽은 U자관 세 개: 95.4 °C 아래에서는 프리즘 가지가 접촉선부터 흐려지고, 딱 95.4 °C에서는 전선이 멈추며, 95.4–115 °C에서는 팔면체 가지가 흐려진다. 오른쪽은 90 °C 과냉 액체 황의 계단으로, 프리즘 씨앗이 112 J/mol을 내려 단사정 β황 층계참에, 팔면체 씨앗이 5.6 J/mol을 더 내려 사방정 α황 바닥에 이른다. 높이는 비례로 그렸고 첫 계단이 퍼텐셜의 95 %, 둘째가 5 %다." class="pz-inner" height="100%" role="img" viewBox="0 0 720 400" width="100%">
<defs>
<marker id="f10-ar-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f10-ar-inf" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-inf" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<text class="t t-b" x="20" y="24">U자관: 안정한 쪽이 먹어 들어간다</text>
<text class="t t-b t-num" text-anchor="middle" x="78" y="56">95.4 °C 아래</text>
<text class="t-s t-mute" text-anchor="middle" x="78" y="72">팔면체가 안정</text>
<text class="t t-b t-num" text-anchor="middle" x="202" y="56">딱 95.4 °C</text>
<text class="t-s t-mute" text-anchor="middle" x="202" y="72">둘의 G가 같음</text>
<text class="t t-b t-num" text-anchor="middle" x="326" y="56">95.4–115 °C</text>
<text class="t-s t-mute" text-anchor="middle" x="326" y="72">프리즘이 안정</text>

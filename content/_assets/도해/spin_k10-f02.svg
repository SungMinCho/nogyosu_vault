class="f-rot" height="38.5" rx="0" width="13" x="584" y="183.5"></rect><rect class="f-rot" height="38.5" rx="0" width="13" x="601" y="183.5"></rect><line class="ln" x1="546" x2="618" y1="222" y2="222"></line><text class="t-s t-mut" text-anchor="middle" x="582" y="238">X 채널 최대</text><rect class="f-mut" height="11" rx="0" width="13" x="660" y="211"></rect><rect class="f-mut" height="11" rx="0" width="13" x="677" y="211"></rect><rect class="f-mut" height="11" rx="0" width="13" x="694" y="211"></rect><rect class="f-mut" height="11" rx="0" width="13" x="711" y="211"></rect><line class="ln" x1="656" x2="728" y1="222" y2="222"></line><text class="t-s t-mut" text-anchor="middle" x="692" y="238">W 행 최대</text><text class="t-s t-b" text-anchor="middle" x="582" y="256">κ(X) = 1.34</text><text class="t-s" text-anchor="middle" x="692" y="256">고르게 섞임</text><path class="ln ln-spike" d="M 318 186 C 318 120, 420 120, 420 186" marker-end="url(#dvr-spike)"></path><text class="t-s t-spike" text-anchor="middle" x="369" y="118">÷2.83 → ×2.83 옮김</text><text class="t-s t-spike" text-anchor="middle" x="369" y="280">이상치는 여전히 2번 채널에</text><line class="ln ln-rot" marker-end="url(#dvr-rot)" x1="570" x2="556" y1="60" y2="157.5"></line><line class="ln ln-rot" marker-end="url(#dvr-rot)" x1="570" x2="573" y1="60" y2="179.5"></line><line class="ln ln-rot" marker-end="url(#dvr-rot)" x1="570" x2="590" y1="60" y2="179.5"></line><line class="ln ln-rot" marker-end="url(#dvr-rot)" x1="570" x2="607" y1="60" y2="179.5"></line><text class="t-s t-rot" text-anchor="start" x="578" y="58">2번의 에너지를 네 채널로 흩음</text><text class="t-s t-mut" text-anchor="middle" x="629" y="280">같은 토큰 (1, 8, 1, 1) × H₄/2 = (5.5, −3.5, 3.5, −3.5)</text></svg></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 360" width="720" height="360" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-xs{ font-size:10.5px }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-frame{ fill:var(--paper-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-sunsoft{ fill:var(--sun-soft) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-blood{ fill:var(--blood) }.fig .s-ink{ stroke:var(--ink) }.fig .s-mute{ stroke:var(--ink-2) }.fig .s-sun{ stroke:var(--sun) }.fig .w1{ stroke-width:1 }.fig .w15{ stroke-width:1.5 }svg.pz-root{width:720px!important;height:360px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="사이클론은 바다의 잠열을 회전으로 바꾸는 자가증폭 고리다. 한가운데 눈은 고요한 저기압, 랜드의 말로 움직이지 않는 모터다." class="pz-inner" height="100%" role="img" style="--minw:662px" viewBox="0 0 720 360" width="100%"><defs><marker id="cyclone-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="cyclone-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="cyclone-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="cyclone-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="cyclone-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="cyclone-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><circle class="f-frame s-mute w1" cx="360" cy="186" r="52"></circle><text class="t-b" text-anchor="middle" x="360" y="178">눈</text><text class="t-xs f-mute" text-anchor="middle" x="360" y="198">고요한 저기압</text><text class="t-xs f-mute" text-anchor="middle" x="360" y="213">움직이지 않는 모터</text><rect class="f-sunsoft s-sun" height="46" rx="5" width="176" x="134" y="117"></rect><text class="t-s t-b" text-anchor="middle" x="222" y="136">① 따뜻한 바다에서 증발</text><text class="t-s f-mute" text-anchor="middle" x="222" y="153">잠열 흡수</text><rect class="f-sunsoft s-sun" height="46" rx="5" width="176" x="272" y="23"></rect><text class="t-s t-b" text-anchor="middle" x="360" y="42">② 높은 곳에서 응결</text><text class="t-s f-mute" text-anchor="middle" x="360" y="59">잠열 방출</text><rect class="f-frame s-mute" height="46" rx="5" width="176" x="412" y="117"></rect><text class="t-s t-b" text-anchor="middle" x="500" y="136">③ 공기가 데워져</text><text class="t-s f-mute" text-anchor="middle" x="500" y="153">더 빨리 상승</text><rect class="f-frame s-mute" height="46" rx="5" width="176" x="384" y="279"></rect><text class="t-s t-b" text-anchor="middle" x="472" y="298">④ 지표 기압 하강</text><text class="t-s f-mute" text-anchor="middle" x="472" y="315">습한 공기 빨려 듦</text><rect class="f-frame s-mute" height="46" rx="5" width="176" x="160" y="279"></rect><text class="t-s t-b" text-anchor="middle" x="248" y="298">⑤ 코리올리로 휘어 회전</text><text class="t-s f-mute" text-anchor="middle" x="248" y="315">바람이 세진다</text><path class="s-ink w15" d="M196,116 C200,84 236,56 268,50" marker-end="url(#cyclone-ink)"></path><path class="s-ink w15" d="M452,50 C486,56 520,86 522,114" marker-end="url(#cyclone-ink)"></path><path class="s-ink w15" d="M540,164 C556,214 540,256 520,278" marker-end="url(#cyclone-ink)"></path><line class="s-ink w15" marker-end="url(#cyclone-ink)" x1="382" x2="340" y1="302" y2="302"></line><path class="s-ink w15" d="M196,278 C176,248 172,200 186,164" marker-end="url(#cyclone-ink)"></path><text class="t-xs f-mute" text-anchor="middle" x="360" y="352">되먹임: 회전이 빨라질수록 증발이 늘고, 증발이 늘수록 회전이 빨라진다</text></svg></g></g></g></g></svg>
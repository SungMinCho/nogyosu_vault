<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 286" width="720" height="286" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-xs{ font-size:10.5px }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-ledgersoft{ fill:var(--ledger-soft) }.fig .f-blood{ fill:var(--blood) }.fig .s-rule{ stroke:var(--rule) }.fig .s-ledger{ stroke:var(--ledger) }.fig .w1{ stroke-width:1 }.fig .dash{ stroke-dasharray:5 4 }svg.pz-root{width:720px!important;height:286px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="기호 하나의 최대 정보량은 log₂(가짓수) 비트다. 실제 영어는 글자당 1비트 남짓이고, 나머지는 오류를 잡아 주는 여분이다." class="pz-inner" height="100%" role="img" style="--minw:662px" viewBox="0 0 720 286" width="100%"><defs><marker id="bits-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="bits-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="bits-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="bits-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="bits-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="bits-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><line class="s-rule dash w1" x1="200" x2="200" y1="18" y2="222"></line><text class="t-xs f-mute" text-anchor="middle" x="200" y="242">0</text><line class="s-rule dash w1" x1="272" x2="272" y1="18" y2="222"></line><text class="t-xs f-mute" text-anchor="middle" x="272" y="242">2</text><line class="s-rule dash w1" x1="344" x2="344" y1="18" y2="222"></line><text class="t-xs f-mute" text-anchor="middle" x="344" y="242">4</text><line class="s-rule dash w1" x1="416" x2="416" y1="18" y2="222"></line><text class="t-xs f-mute" text-anchor="middle" x="416" y="242">6</text><line class="s-rule dash w1" x1="488" x2="488" y1="18" y2="222"></line><text class="t-xs f-mute" text-anchor="middle" x="488" y="242">8</text><line class="s-rule dash w1" x1="560" x2="560" y1="18" y2="222"></line><text class="t-xs f-mute" text-anchor="middle" x="560" y="242">10</text><line class="s-rule dash w1" x1="632" x2="632" y1="18" y2="222"></line><text class="t-xs f-mute" text-anchor="middle" x="632" y="242">12</text><line class="s-rule dash w1" x1="704" x2="704" y1="18" y2="222"></line><text class="t-xs f-mute" text-anchor="middle" x="704" y="242">14</text><text class="t-s f-mute" text-anchor="middle" x="452" y="270">log₂(가짓수) — 기호 하나의 최대 정보량, 비트</text><text class="t-s" text-anchor="end" x="188" y="47">동전 (2가지)</text><rect class="f-ledgersoft s-ledger" height="28" rx="2" width="36" x="200" y="28"></rect><text class="t-s t-b" x="244" y="47">1 비트</text><text class="t-s" text-anchor="end" x="188" y="95">DNA 염기 (4가지)</text><rect class="f-ledgersoft s-ledger" height="28" rx="2" width="72" x="200" y="76"></rect><text class="t-s t-b" x="280" y="95">2 비트</text><text class="t-s" text-anchor="end" x="188" y="143">영어 알파벳 (26자)</text><rect class="f-ledgersoft s-ledger" height="28" rx="2" width="169.216" x="200" y="124"></rect><text class="t-s" text-anchor="end" x="188" y="191">한글 음절 (11,172자)</text><rect class="f-ledgersoft s-ledger" height="28" rx="2" width="484.114" x="200" y="172"></rect><rect class="f-ledger" height="28" rx="2" width="36" x="200" y="124"></rect><text class="t-s t-b" x="377.216" y="136">최대 4.7 비트</text><text class="t-xs f-mute" x="377.216" y="151">실제 영어 ≈ 1 비트 · 나머지는 여분</text><text class="t-s t-b" text-anchor="end" x="676.114" y="191">13.4 비트</text></svg></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 308" width="760" height="308" class="fig-scroll fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#E5E6E1; --panel:#F0F1EC; --ink:#1B1D21; --mute:#5B5F63; --rule:#C3C6C0;
  --sub:#1D4F93; --sym:#855D00; --jou:#AE2E1C;
  --sub-t:rgba(29,79,147,.12); --sym-t:rgba(201,150,20,.22); --jou-t:rgba(174,46,28,.12);
  --flb:#1F4F96; --fly:#E3B021; --flr:#C0301F;
  --f-body:"Spectral","Nanum Myeongjo","Noto Serif CJK KR","Noto Serif KR","AppleMyungjo",serif;
  --f-disp:"Hahmlet","Nanum Myeongjo","Noto Serif CJK KR",serif;
  --f-label:"Nanum Gothic","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"Courier Prime","Nanum Gothic Coding","Noto Sans Mono CJK KR",monospace;
  --f-lat:"Spectral","Nanum Myeongjo",serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121417; --panel:#1B1E22; --ink:#E6E4DE; --mute:#A2A6A9; --rule:#353A40;
    --sub:#86AEEA; --sym:#DDB14C; --jou:#EE7B64;
    --sub-t:rgba(134,174,234,.16); --sym-t:rgba(221,177,76,.18); --jou-t:rgba(238,123,100,.16);
    --flb:#2A5AA0; --fly:#C99A1B; --flr:#B0342A;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121417; --panel:#1B1E22; --ink:#E6E4DE; --mute:#A2A6A9; --rule:#353A40;
  --sub:#86AEEA; --sym:#DDB14C; --jou:#EE7B64;
  --sub-t:rgba(134,174,234,.16); --sym-t:rgba(221,177,76,.18); --jou-t:rgba(238,123,100,.16);
  --flb:#2A5AA0; --fly:#C99A1B; --flr:#B0342A;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:2.2rem 4rem; }.lecture{ display:contents; }.flag svg{ display:block; width:100%; height:auto; }.fig{ margin-block:.6rem; display:grid; gap:.5rem; }.fig-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background:
  linear-gradient(90deg,var(--panel) 30%,transparent) left/2.2rem 100% no-repeat local,
  linear-gradient(270deg,var(--panel) 30%,transparent) right/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent) left/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) right/.8rem 100% no-repeat scroll, var(--panel);
  padding:.6rem .4rem; }.fig svg{ display:block; width:100%; height:auto; min-width:640px; }svg text{ fill:var(--ink); font-family:var(--f-label); }.t-sm{ font-size:12px; }.t-md{ font-size:13.5px; }.t-b{ font-weight:700; }.t-mute{ fill:var(--mute); }.t-sym{ fill:var(--sym); }.f-ink{ fill:var(--ink); }.f-none{ fill:none; }.f-sym{ fill:var(--sym); }.s-sub{ stroke:var(--sub); }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="왼쪽 남성 쪽: 닫힌 원 안에 모든 요소가 있고, 원 바깥 위에 예외 하나가 떠서 원을 닫는다. 오른쪽 여성 쪽: 원이 오른쪽에서 열려 있고 요소들이 흐려지며 끝없이 이어지며, 바깥의 예외는 없다." data-fig="f05" height="100%" role="img" style="--fw:760" viewBox="0 0 760 308" width="100%"><defs><marker id="f05-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-md t-b" text-anchor="start" x="20" y="26">남성 · 역학적 이율배반</text><circle class="f-none s-sub" cx="195" cy="165" r="85" stroke-width="2"></circle><circle class="f-ink" cx="160" cy="120" r="4"></circle><circle class="f-ink" cx="195" cy="112" r="4"></circle><circle class="f-ink" cx="232" cy="124" r="4"></circle><circle class="f-ink" cx="140" cy="150" r="4"></circle><circle class="f-ink" cx="178" cy="146" r="4"></circle><circle class="f-ink" cx="215" cy="150" r="4"></circle><circle class="f-ink" cx="250" cy="158" r="4"></circle><circle class="f-ink" cx="150" cy="182" r="4"></circle><circle class="f-ink" cx="188" cy="180" r="4"></circle><circle class="f-ink" cx="228" cy="186" r="4"></circle><text class="t-sm t-b" text-anchor="middle" x="195" y="272">∀x Φx · 모두가 법 아래</text><circle class="f-sym" cx="195" cy="52" r="7"></circle><text class="t-md t-b t-sym" text-anchor="start" x="212" y="50">∃x ¬Φx</text><text class="t-sm" text-anchor="start" x="212" y="68">바깥의 하나: 원초적 아버지 · 자유</text><text class="t-sm t-mute" text-anchor="start" x="20" y="296">칸트: 정립과 반정립 모두 참 (현상 / 본체
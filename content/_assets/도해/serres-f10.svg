  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.c-fire{ fill:var(--fire) !important }.c-order{ fill:var(--order) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-rule{ stroke:var(--rule) }.s-fire{ stroke:var(--fire) }.s-order{ stroke:var(--order) }.s-caution{ stroke:var(--caution) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-land{ fill:var(--land) }.f-fire-t{ fill:var(--fire); fill-opacity:.16 }.f-ink-t{ fill:var(--ink); fill-opacity:.08 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.w4{ stroke-width:4 }.dash{ stroke-dasharray:5 4 }.dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }.mk-fire{ fill:var(--fire) }svg.pz-root{width:860px!important;height:560px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="대피라미드의 남북 단면을 축척대로 그린 그림. 해가 45°일 때 꼭짓점의 그림자는 중심에서 146.6 m 떨어진 곳에 떨어지지만, 그중 115.17 m는 돌 밑에 있고 북면 밖으로 보이는 것은 31.4 m뿐이다. 높이와 반변은 돌 속을 지나는 점선이고, 중심에는 닿을 수 없다. 2 m 지팡이는 2 m 그림자를 드리운다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 860 560" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F12-ar-fire" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-fire" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="s-ink w3 f-none" x1="20" x2="46" y1="26" y2="26"></line><text class="ts" text-anchor="start" x="54" y="30">잴 수 있는 선 — 실선 셋</text><line class="s-ink w15 dash f-none" x1="20" x2="46" y1="46" y2="46"></line><text class="ts" text-anchor="start" x="54" y="50">셈으로만 아는 선 — 점선 둘</text><circle class="s-fire f-fire-t w15" cx="232.52" cy="40" r="12"></circle><line class="s-fire w1 f-none" x1="248.52" x2="253.52" y1="40" y2="40"></line><line class="s-fire w1 f-none" x1="243.834" x2="247.369" y1="51.3137" y2="54.8492"></line><line class="s-fire w1 f-none" x1="232.52" x2="232.52" y1="56" y2="61"></line><line class="s-fire w1 f-none" x1="221.206" x2="217.671" y1="51.3137" y2="54.8492"></line><line class="s-fire w1 f-none" x1="216.52" x2="211.52" y1="40" y2="40"></line><line class="s-fire w1 f-none" x1="221.206" x2="217.671" y1="28.6863" y2="25.1508"></line><line class="s-fire w1 f-none" x1="232.52" x2="232.52" y1="24" y2="19"></line><line class="s-fire w1 f-none" x1="243.834" x2="247.369" y1="28.6863" y2="25.1508"></line><text class="t c-fire" text-anchor="start" x="274.52" y="44">해 · 고도 45°</text><text class="ts" text-anchor="start" x="274.52" y="60">그림자가 키와 같아지는 시각</text><line class="s-fire w1 f-none" marker-end="url(#F12-ar-fire)" x1="190.52" x2="280.043" y1="82" y2="171.523"></line><line class="s-fire w1 f-none" marker-end="url(#F12-ar-fire)" x1="148.52" x2="243.086" y1="124" y2="218.566"></line><text class="ts c-fire" text-anchor="end" x="136.52" y="118">평행한 햇살</text><polygon class="f-land" points="66.626,450 320,127.48 573.374,450"></polygon><polygon class="f-ink-t" points="320,127.48 573.374,450 642.52,450"></polygon><polyline class="s-order w2 f-none" points="66.626,450 320,127.48 573.374,450"></polyline><line class="s-rule w1 f-none" x1="66.626" x2="320" y1="450" y2="450"></line><line class="s-fire w15 f-none" x1="241.02" x2="642.52" y1="48.5" y2="450"></line><line class="s-ink w15 f-none" x1="16" x2="66.626" y1="450" y2="450"></line><line class="s-ink w15 f-none" x1="642.52" x2="844" y1="450" y2="450"></line><text class="ts" text-anchor="start" x="22" y="442">남</text><text class="ts" text-anchor="end" x="838" y="442">북</text><line class="s-ink w15 dash f-none" x1="320" x2="320" y1="127.48" y2="450"></line><line class="s-ink w2 dash f-none" x1="320" x2="573.374" y1="450" y2="450"></line><path class="s-ink w1 f-none" d="M330,450 L330,440 L320,440"></path><text class="t" text-anchor="start" x="330" y="296">높이 146.6 m</text><text class="ts" text-anchor="start" x="330" y="312">돌 속을 지나는 선</text><text class="ts c-order" text-anchor="middle" x="228" y="404">돌 · 무덤</text><line class="s-ink w4 f-none" x1="573.374" x2="642.52" y1="450" y2="450"></line><path class="s-ink w1 f-none" d="M608.5,450 A34,34 0 0 1 618.5,426.0"></path><text class="ts" text-anchor="middle" x="588.52" y="442">45°</text><path class="s-order w1 f-none" d="M549.4,450 A24,24 0 0 1 558.5,431.1"></path><text class="ts c-order" text-anchor="end" x="541.374" y="442">경사 51.84°</text><circle class="s-caution f-deep w2" cx="320" cy="450" r="5"></circle><text class="t c-caution" text-anchor="end" x="308" y="440">중심 — 닿을 수 없다</text><line class="s-ink w2 f-none" x1="642.52" x2="642.52" y1="450" y2="445.6"></line><line class="s-ink w4 f-none" x1="642.52" x2="646.92" y1="450" y2="450"></line><line class="s-ink2 w1 dot f-none" x1="320" x2="320" y1="457" y2="526"></line><line class="s-ink2 w1 dot f-none" x1="573.374" x2="573.374" y1="457" y2="478"></line><line class="s-ink2 w1 dot f-none" x1="642.52" x2="642.52" y1="457" y2="526"></line><line class="s-ink2 w1 f-none" x1="320" x2="573.374" y1="472" y2="472"></line><line class="s-ink2 w1 f-none" x1="573.374" x2="642.52" y1="472" y2="472"></line><line class="s-ink2 w1 f-none" x1="320" x2="320" y1="467" y2="477"></line><line class="s-ink2 w1 f-none" x1="573.374" x2="573.374" y1="467" y2="477"></line><line class="s-ink2 w1 f-none" x1="642.52" x2="642.52" y1="467" y2="477"></line><text class="ts" text-anchor="middle" x="446.687" y="490">반변 115.17 m — 돌 밑, 셈으로 더한다</text><text class="t" text-anchor="middle" x="607.947" y="490">31.4 m</text><text class="ts" text-anchor="middle" x="607.947" y="508">보이는 꼬리</text><line class="s-ink w15 f-none" x1="320" x2="642.52" y1="520" y2="520"></line><line class="s-ink w15 f-none" x1="320" x2="320" y1="514" y2="526"></line><line class="s-ink w15 f-none" x1="642.52" x2="642.52" y1="514" y2="526"></line><text class="t" text-anchor="middle" x="481.26" y="540">중심에서 그림자 끝까지 146.6 m = 높이</text><rect class="s-rule f-deep w1" height="168" rx="2" width="170" x="672" y="196"></rect><text class="ts" text-anchor="middle" x="757" y="214">지팡이 — 확대</text><line class="s-ink w15 f-none" x1="686" x2="830" y1="322" y2="322"></line><line class="s-fire w15 f-none" x1="690" x2="782" y1="230" y2="322"></line><line class="s-ink w3 f-none" x1="726" x2="726" y1="322" y2="266"></line><line class="s-ink w4 f-none" x1="726" x2="782" y1="322" y2="322"></line><path class="s-ink w1 f-none" d="M764,322 A18,18 0 0 1 769.3,309.3"></path><text class="t" text-anchor="end" x="718" y="298">2 m</text><text class="t" text-anchor="middle" x="754" y="340">2 m</text><text class="ts" text-anchor="middle" x="757" y="356">같은 45° → 닮은 삼각형</text><line class="s-ink2 w1 dot f-none" x1="672" x2="646.52" y1="364" y2="442"></line></svg></g></g></g></g></svg>
  background-repeat:no-repeat; background-size:40px 100%, 40px 100%, 14px 100%, 14px 100%; background-attachment:local, local, scroll, scroll;
  background-color:var(--panel); border:1px solid var(--rule); padding:.6rem .4rem }.frame svg{ display:block; width:100%; height:auto }svg text{ font-family:var(--f-sans); fill:var(--ink); font-size:13px }svg .tl{ font-size:13.5px }svg .ts{ font-size:12.5px }svg .tx{ font-size:11.5px }svg .tn{ font-family:var(--f-mono); font-size:12px }svg .tbig{ font-size:15px; font-weight:500 }svg .tb{ font-weight:700 }svg .tn.tb{ font-weight:600 }svg .t2{ fill:var(--ink2) }svg .t-on{ fill:var(--on) }.f-umber{fill:var(--umber)}.f-blue{fill:var(--blue)}.f-violet-l{fill:var(--violet-l)}.f-ink2{fill:var(--ink2)}.f-panel{fill:var(--panel)}.f-none{fill:none}.s-violet{stroke:var(--violet)}.s-ink2{stroke:var(--ink2)}svg line, svg path, svg polyline, svg rect, svg circle{ stroke-width:1 }.sw2{ stroke-width:2 !important }.dash{ stroke-dasharray:5 4 }.nostroke{ stroke:none }svg pattern line{ stroke-width:1.1 }svg.pz-root{width:620px!important;height:300px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="공장 100짜리 회사 주식이 240에 거래될 때. 가계 장부 +240(그중 기대분 140), 회사 장부 −140, 섬 전체 100. 기대분은 가계의 부에서는 보이
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 790 270" width="790" height="270" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .dot-sp{ fill:var(--spike); stroke:var(--paper); stroke-width:1.5 }.dg .dot-rt{ fill:var(--rot); stroke:var(--paper); stroke-width:1.5 }.dg .zone-b2{ fill:var(--spike-soft); stroke:var(--spike); stroke-width:1; stroke-dasharray:4 3 }.dg .zone-g2{ fill:var(--rot-soft); stroke:var(--rot); stroke-width:1 }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="벡터 (4,1,0,-1)을 하다마드로 돌리면 (2,2,3,1)이 되어 최솟값과 최댓값 사이의 폭이 5에서 2로 줄고 확률적 반올림의 분산 합이 10에서 2로 준다" class="dg" height="100%" role="img" style="" viewBox="0 0 790 270" width="100%"><text class="t-b t-spike" text-anchor="start" x="30" y="38">원래 x = (4, 1, 0, −1) · 폭 5 · 분산 합 10</text><rect class="zone-b2" height="18" rx="2" width="350" x="150" y="81"></rect><line class="ln" x1="80" x2="570" y1="90" y2="90"></line><line class="ln" x1="80" x2="80" y1="87" y2="93"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="80" y="126">−2</text><line class="ln" x1="150" x2="150" y1="87" y2="93"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="150" y="126">−1</text><line class="ln" x1="220" x2="220" y1="87" y2="93"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="220" y="126">0</text><line class="ln" x1="290" x2="290" y1="87" y2="93"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="290" y="126">1</text><line class="ln" x1="360" x2="360" y1="87" y2="93"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="360" y="126">2</text><line class="ln" x1="430" x2="430" y1="87" y2="93"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="430" y="126">3</text><line class="ln" x1="500" x2="500" y1="87" y2="93"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="500" y="126">4</text><line class="ln" x1="570" x2="570" y1="87" y2="93"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="570" y="126">5</text><circle class="dot-sp" cx="500" cy="72" r="5"></circle><text class="t-s t-mut" text-anchor="start" x="509" y="76">분산 0</text><circle class="dot-sp" cx="290" cy="72" r="5"></circle><text class="t-s t-mut" text-anchor="start" x="299" y="76">분산 6</text><circle class="dot-sp" cx="220" cy="72" r="5"></circle><text class="t-s t-mut" text-anchor="start" x="229" y="76">분산 4</text><circle class="dot-sp" cx="150" cy="72" r="5"></circle><text class="t-s t-mut" text-anchor="start" x="159" y="76">분산 0</text><text class="t-s t-b" text-anchor="middle" x="150" y="112">lo</text><text class="t-s t-b" text-anchor="middle" x="500" y="112">hi</text><text class="t-b t-rot" text-anchor="start" x="30" y="160">보내기 전에 x·H₄/2 = (2, 2, 3, 1) · 폭 2 · 분산 합 2</text><rect class="zone-g2" height="18" rx="2" width="140" x="290" y="203"></rect><line class="ln" x1="80" x2="570" y1="212" y2="212"></line><line class="ln" x1="80" x2="80" y1="209" y2="215"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="80" y="248">−2</text><line class="ln" x1="150" x2="150" y1="209" y2="215"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="150" y="248">−1</text><line class="ln" x1="220" x2="220" y1="209" y2="215"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="220" y="248">0</text><line class="ln" x1="290" x2="290" y1="209" y2="215"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="290" y="248">1</text><line class="ln" x1="360" x2="360" y1="209" y2="215"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="360" y="248">2</text><line class="ln" x1="430" x2="430" y1="209" y2="215"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="430" y="248">3</text><line class="ln" x1="500" x2="500" y1="209" y2="215"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="500" y="248">4</text><line class="ln" x1="570" x2="570" y1="209" y2="215"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="570" y="248">5</text><circle class="dot-rt" cx="360" cy="194" r="5"></circle><text class="t-s t-mut" text-anchor="start" x="369" y="198">분산 1</text><circle class="dot-rt" cx="360" cy="180" r="5"></circle><text class="t-s t-mut" text-anchor="start" x="369" y="184">분산 1</text><circle class="dot-rt" cx="430" cy="194" r="5"></circle><text class="t-s t-mut" text-anchor="start" x="439" y="198">분산 0</text><circle class="dot-rt" cx="290" cy="194" r="5"></circle><text class="t-s t-mut" text-anchor="start" x="299" y="198">분산 0</text><text class="t-s t-b" text-anchor="middle" x="290" y="234">lo</text><text class="t-s t-b" text-anchor="middle" x="430" y="234">hi</text><text class="t-s t-b" text-anchor="start" x="600" y="70">1비트 확률적 반올림:</text><text class="t-s" text-anchor="start" x="600" y="88">값마다 lo 아니면 hi로.</text><text class="t-s t-mono" text-anchor="start" x="600" y="106">분산 = (hi − x)(x − lo)</text><text class="t-s t-rot" text-anchor="start" x="600" y="124">→ 폭이 좁을수록 작다</text></svg></svg>
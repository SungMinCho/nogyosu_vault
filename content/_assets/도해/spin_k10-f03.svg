<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 300" width="800" height="300" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-spike{ fill:var(--spike) }.dg .t-pos{ fill:var(--pos) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-grid{ stroke:var(--grid) }.dg .dash{ stroke-dasharray:4 3 }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .f-rot{ fill:var(--rot) }.dg .f-grid{ fill:var(--grid) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .thick{ stroke-width:2.4 }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="벡터 (3, 4)와 하다마드 H₂로 한 교환 시험 네 개. RMSNorm과 쌍 안의 회전은 두 길이 같은 점에 닿고, ReLU는 다른 점, RoPE 90도는 정반대 점에 닿는다" class="dg" height="100%" role="img" style="" viewBox="0 0 800 300" width="100%"><defs><marker id="m2-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="m2-grid" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-grid" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="bx" height="216" rx="6" width="184" x="8" y="32"></rect><line class="ln-hair" x1="22" x2="178" y1="140" y2="140"></line><line class="ln-hair" x1="100" x2="100" y1="62" y2="218"></line><text class="t-s t-b" text-anchor="middle" x="100" y="50">① RMSNorm</text><path class="ln ln-rot thick" d="M100,140 L150.4,147.2" marker-end="url(#m2-rot)"></path><path class="ln ln-grid dash" d="M100,140 L150.4,147.2" marker-end="url(#m2-grid)"></path><text class="t-s t-b t-pos" text-anchor="middle" x="100" y="236">같은 점 ✓</text><rect class="bx" height="216" rx="6" width="184" x="208" y="32"></rect><line class="ln-hair" x1="222" x2="378" y1="140" y2="140"></line><line class="ln-hair" x1="300" x2="300" y1="62" y2="218"></line><text class="t-s t-b" text-anchor="middle" x="300" y="50">② ReLU</text><path class="ln ln-rot thick" d="M300,140 L363.6,140.0" marker-end="url(#m2-rot)"></path><path class="ln ln-grid dash" d="M300,140 L363.6,149.1" marker-end="url(#m2-grid)"></path><text class="t-s t-b t-spike" text-anchor="middle" x="300" y="236">다른 점 ✗</text><rect class="bx" height="216" rx="6" width="184" x="408" y="32"></rect><line class="ln-hair" x1="422" x2="578" y1="140" y2="140"></line><line class="ln-hair" x1="500" x2="500" y1="62" y2="218"></line><text class="t-s t-b" text-anchor="middle" x="500" y="50">③ RoPE 90°</text><path class="ln ln-rot thick" d="M500,140 L509.1,76.4" marker-end="url(#m2-rot)"></path><path class="ln ln-grid dash" d="M500,140 L490.9,203.6" marker-end="url(#m2-grid)"></path><text class="t-s t-b t-spike" text-anchor="middle" x="500" y="236">정반대 ✗</text><rect class="bx" height="216" rx="6" width="184" x="608" y="32"></rect><line class="ln-hair" x1="622" x2="778" y1="140" y2="140"></line><line class="ln-hair" x1="700" x2="700" y1="62" y2="218"></line><text class="t-s t-b" text-anchor="middle" x="700" y="50">④ RoPE + 쌍 회전</text><path class="ln ln-rot thick" d="M700,140 L635.8,137.2" marker-end="url(#m2-rot)"></path><path class="ln ln-grid dash" d="M700,140 L635.8,137.2" marker-end="url(#m2-grid)"></path><text class="t-s t-b t-pos" text-anchor="middle" x="700" y="236">같은 점 ✓</text><line class="ln ln-rot thick" x1="150" x2="180" y1="280" y2="280"></line><text class="t-s" text-anchor="start" x="186" y="284">돌리고 → f : f(x·R)</text><line class="ln ln-grid dash" x1="420" x2="450" y1="280" y2="280"></line><text class="t-s" text-anchor="start" x="456" y="284">f → 돌리고 : f(x)·R</text></svg></svg>
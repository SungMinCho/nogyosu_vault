<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 206" width="440" height="206" class="frame fig herofig mast doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#F1F2EC; --paper:#FAFAF6; --soft:#E3E6DE; --tie:#B9BEB5; --stack:#C9CDC4; --grid:#DCE0D6; --rule:#CDD3CA;
  --ink:#1B2420; --ink-2:#44504A; --muted:#6E7871; --on:#FFFFFF;
  --pot:#23825A; --risk:#C0392B; --eq:#A0700F; --un:#2F5DA8; --warn:#8A4FB8;
  --eq-bg:#F3E7CC; --risk-bg:#F6DEDA;
  --f-body:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-disp:"Song Myung","Nanum Myeongjo","Noto Serif KR",serif;
  --f-num:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --f-dg:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --f-math:"Noto Sans Math","STIX Two Math","Cambria Math",math;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}}:root[data-theme="dark"]{
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:2.2rem 4rem}.doc>figure,.lecture>figure,.lecture>.cards,.doc>.mast,.doc>.toc,.doc>.legend,.doc>.cheat,.doc>.foot{max-width:var(--wide)}.mast{display:grid;gap:1.1rem;padding-block:1rem 1.6rem;border-bottom:1px solid var(--rule)}.fig{margin:.6rem 0 !important;display:grid;gap:.55rem}.fig .frame{overflow-x:auto;background:
  linear-gradient(90deg,var(--paper) 30%,transparent),linear-gradient(270deg,var(--paper) 30%,transparent),
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent),
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent) 100% 0;
  background-color:var(--paper);background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll;
  border:1px solid var(--rule);border-radius:3px;padding:.7rem}.herofig{margin-top:.4rem !important}.dg{display:block;width:100%;height:auto;font-family:var(--f-dg)}.dg text{fill:var(--ink);font-size:12px}.dg text.mu{fill:var(--muted)}.dg text.b{font-weight:700}.dg .on{fill:var(--on)}.dg text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}.dg text.card{font-family:var(--f-num)}.dg .f-eq{fill:var(--eq)}.dg .f-un{fill:var(--un)}.dg .f-soft{fill:var(--soft)}.dg .f-riskbg{fill:var(--risk-bg)}.dg .s-ink{stroke:var(--ink);stroke-width:1.2}.dg .s-risk{stroke:var(--risk);stroke-width:1.6}.dg circle:hover,.dg rect[class]:hover{filter:brightness(1.08)}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="폰 노이만 포커의 균형(베팅이 팟 크기일 때): 베터는 가장 약한 1/9로 블러프하고 가장 강한 2/9로 밸류 베팅하며 가운데 2/3은 체크한다. 콜러는 5/9 위에서만 콜한다." class="dg" height="100%" role="img" viewBox="0 0 440 206" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern height="6" id="hh-risk" patternTransform="rotate(45)" patternUnits="userSpaceOnUse" width="6"><rect class="f-riskbg" height="6" width="6"></rect><line class="s-risk" style="stroke-width:2" x1="0" x2="0" y1="0" y2="6"></line></pattern></defs><text class="mu" style="font-size:12px" text-anchor="end" x="426.0" y="46.0">베터의 손 세기 x →</text><rect class="f-hatch" fill="url(#hh-risk)" height="36.0" rx="0" width="45.8" x="14.0" y="58.0"></rect><rect class="f-soft" height="36.0" rx="0" width="270.7" x="61.8" y="58.0"></rect><rect class="f-eq" height="36.0" rx="0" width="91.6" x="334.4" y="58.0"></rect><text class="mu" style="font-size:12.5px" text-anchor="middle" x="197.1" y="81.0">체크 — 쇼다운 가치로 지킨다</text><text class="on" style="font-size:13px;font-weight:700" text-anchor="middle" x="380.2" y="81.0">밸류</text><text class="b" style="font-size:13px" text-anchor="start" x="14.0" y="46.0">블러프</text><text class="mu" style="font-size:12px" text-anchor="end" x="426.0" y="128.0">콜러의 손 세기 y →</text><rect class="f-soft" height="36.0" rx="0" width="226.9" x="14.0" y="140.0"></rect><rect class="f-un" height="36.0" rx="0" width="183.1" x="242.9" y="140.0"></rect><text class="mu" style="font-size:13px" text-anchor="middle" x="128.4" y="163.0">폴드</text><text class="on" style="font-size:13px;font-weight:700" text-anchor="middle" x="334.4" y="163.0">콜</text><text class="num" style="font-size:12px" text-anchor="middle" x="14.0" y="109.0">0</text><text class="num" style="font-size:12px" text-anchor="middle" x="59.8" y="109.0">1/9</text><text class="num" style="font-size:12px" text-anchor="middle" x="334.4" y="109.0">7/9</text><text class="num" style="font-size:12px" text-anchor="middle" x="426.0" y="109.0">1</text><text class="num" style="font-size:12px" text-anchor="middle" x="14.0" y="191.0">0</text><text class="num" style="font-size:12px" text-anchor="middle" x="242.9" y="191.0">5/9</text><text class="num" style="font-size:12px" text-anchor="middle" x="426.0" y="191.0">1</text><line class="s-ink" x1="59.8" x2="59.8" y1="54.0" y2="98.0"></line><line class="s-ink" x1="334.4" x2="334.4" y1="54.0" y2="98.0"></line><line class="s-ink" x1="242.9" x2="242.9" y1="136.0" y2="180.0"></line></svg></svg>
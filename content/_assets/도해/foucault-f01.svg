<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 740 436" width="740" height="436" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#DDD8CC; --bg-2:#D3CDBF; --panel:#E9E5DB; --panel-2:#F2EFE8;
  --ink:#1D1913; --ink-2:#3B352B; --mute:#625A4D; --rule:#B4AB9A; --rule-2:#C9C1B1;
  --och:#8A6110; --azu:#1F4E8C; --ver:#AE3519; --lak:#9C2B66;
  --och-w:rgba(138,97,16,.15); --azu-w:rgba(31,78,140,.13); --ver-w:rgba(174,53,25,.13); --lak-w:rgba(156,43,102,.13); --ink-w:rgba(29,25,19,.07);
  --weave:rgba(60,48,30,.045);
  --room:#2E2821; --linen:#CBC2AE; --door:#E3C37C; --glass:#A9C0E0; --ray:rgba(240,214,150,.16);
  --f-disp:"Nanum Myeongjo","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-lat:"Cormorant Garamond","Noto Serif KR",Georgia,serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-ui:"Gothic A1","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"Inconsolata","Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15120E; --bg-2:#1B1712; --panel:#1F1B15; --panel-2:#26211A;
  --ink:#E7E0D2; --ink-2:#CFC6B5; --mute:#A39A89; --rule:#4C4538; --rule-2:#3A342A;
  --och:#D7A64C; --azu:#86AEE6; --ver:#EF7A57; --lak:#E585B6;
  --och-w:rgba(215,166,76,.16); --azu-w:rgba(134,174,230,.15); --ver-w:rgba(239,122,87,.15); --lak-w:rgba(229,133,182,.15); --ink-w:rgba(231,224,210,.07);
  --weave:rgba(255,240,210,.025); --room:#0A0806; --linen:#81776A; --door:#C9A55A; --glass:#7E9DCB; --ray:rgba(240,214,150,.09); color-scheme:dark }}:root[data-theme="dark"]{
  --bg:#15120E; --bg-2:#1B1712; --panel:#1F1B15; --panel-2:#26211A;
  --ink:#E7E0D2; --ink-2:#CFC6B5; --mute:#A39A89; --rule:#4C4538; --rule-2:#3A342A;
  --och:#D7A64C; --azu:#86AEE6; --ver:#EF7A57; --lak:#E585B6;
  --och-w:rgba(215,166,76,.16); --azu-w:rgba(134,174,230,.15); --ver-w:rgba(239,122,87,.15); --lak-w:rgba(229,133,182,.15); --ink-w:rgba(231,224,210,.07);
  --weave:rgba(255,240,210,.025); --room:#0A0806; --linen:#81776A; --door:#C9A55A; --glass:#7E9DCB; --ray:rgba(240,214,150,.09); color-scheme:dark }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{ display:block; width:100%; height:auto }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.6rem 3rem }.lecture{ display:contents }figure.fig{ margin:.6rem 0 .4rem; display:grid; gap:.55rem }.fig .frame{ overflow-x:auto; overscroll-behavior-x:contain; background:var(--panel-2); border:1px solid var(--rule-2); padding:.9rem .8rem;
  background-image:linear-gradient(to right,var(--panel-2) 30%,transparent),linear-gradient(to left,var(--panel-2) 30%,transparent),linear-gradient(to right,var(--ink-w),transparent),linear-gradient(to left,var(--ink-w),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat; background-size:2.2rem 100%,2.2rem 100%,1rem 100%,1rem 100%; background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; height:auto; color:var(--ink) }.t{ font-family:var(--f-ui); font-size:13px; fill:currentColor }.t-s{ font-family:var(--f-ui); font-size:11px; fill:currentColor }.t-m{ font-family:var(--f-mono); font-size:12.5px; fill:currentColor }.b{ font-weight:700 }.mid{ text-anchor:middle }.mute{ fill:var(--mute) }.s{ fill:none; stroke:currentColor; stroke-width:1.4 }.s-thin{ fill:none; stroke:currentColor; stroke-width:.8 }.s-bold{ fill:none; stroke:currentColor; stroke-width:2.4 }.dash{ stroke-dasharray:5 4 }.k-mute{ stroke:var(--mute) }.k-rule{ stroke:var(--rule) }.k-lak{ stroke:var(--lak) }.f-ink{ fill:currentColor }.f-bg{ fill:var(--panel-2) }.w-ink{ fill:var(--ink-w) }.c-lak{ fill:var(--lak) }svg.pz-root{width:740px!important;height:436px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><g class="pz-w fw"><svg xmlns="http://www.w3.org/2000/svg" aria-label="입속과 해부대 위에서는 이질적인 것들이 한 자리에 함께 놓이지만, 보르헤스의 목록에는 그 자리가 없고 알파벳 순서만 칸을 꿰며, 여덟째 칸 h는 자기를 포함한 모든 칸을 품는다." class="pz-inner" height="100%" role="img" viewBox="0 0 740 436" width="100%">
<defs>
<marker id="d-borges-ar" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 비교 ① 걸신들린 입: 이질적인 것들이 한 입 '안'에 -->
<text class="t-s b mute" x="24" y="22">비교 ① 걸신들린 입</text>
<path class="s w-ink" d="M30,92 Q185,4 340,92 Q185,180 30,92 Z"></path>
<text class="t mid" x="185" y="88">아메보사이트 · 암모나이트 · 아홀로틀</text>
<text class="t mid" x="185" y="110">아나콘다 · 회충 …</text>
<text class="t mid b" x="185" y="164">자리 = 입 속</text>
<!-- 비교 ② 해부대: 재봉틀과 우산이 해부대 '위'에 -->
<text class="t-s b mute" x="400" y="22">비교 ② 로트레아몽의 해부대</text>
<rect class="s-thin f-bg" height="36" rx="3" width="86" x="470" y="80"></rect>
<text class="t mid" x="513" y="103">재봉틀</text>
<rect class="s-thin f-bg" height="36" rx="3" width="62" x="594" y="80"></rect>
<text class="t mid" x="625" y="103">우산</text>
<rect class="s w-ink" height="10" width="280" x="420" y="118"></rect>
<line class="s" x1="444" x2="444" y1="128" y2="146"></line>
<line class="s" x1="676" x2="676" y1="128" y2="146"></line>
<text class="t mid b" x="560" y="164">자리 = 해부대 위</text>
<line class="s-thin k-rule" x1="20" x2="720" y1="184" y2="184"></line>
<!-- 보르헤스의 목록 -->
<text class="t-s b mute" x="24" y="208">보르헤스의 중국 백과사전 — a부터 n까지 열네 칸 가운데 몇 칸</text>
<!-- h가 품는 것: 모든 칸, h 자신까지 -->
<text class="t-s mid" x="370" y="227">h 칸 ‘안’ = 모든 칸, h 자신까지</text>
<path class="s-thin" d="M50,246 L50,236 L690,236 L690,246"></path>
<line class="s-thin" marker-end="url(#d-borges-ar)" x1="496" x2="496" y1="266" y2="239"></line>
<text class="t-s" x="503" y="256">품는다</text>
<!-- 알파벳의 실 (칸 뒤로 지나감) -->
<line class="s-thin" x1="40" x2="700" y1="300" y2="300"></line>
<text class="t mid mute" x="166" y="292">…</text>
<text class="t mid mute" x="276" y="292">…</text>
<text class="t mid mute" x="530" y="292">…</text>
<!-- 칸들 -->
<text class="t-m mid mute" x="98" y="258">a</text>
<rect class="s f-bg" height="52" rx="4" width="96" x="50" y="266"></rect>
<text class="t mid" x="98" y="288">황제에게</text>
<text class="t mid" x="98" y="305">속한 것</text>
<rect class="s f-bg" height="52" rx="4" width="70" x="186" y="266"></rect>
<text class="t mid" x="221" y="297">인어</text>
<text class="t-m mid mute" x="341" y="258">g</text>
<rect class="s f-bg" height="52" rx="4" width="90" x="296" y="266"></rect>
<text class="t mid" x="341" y="295">떠돌이 개</text>
<circle class="f-ink" cx="341" cy="309" r="3"></circle>
<text class="t-m mid mute" x="458" y="258">h <tspan class="t-s">· 여덟째</tspan></text>
<rect class="s-bold f-bg" height="52" rx="4" width="104" x="406" y="266"></rect>
<text class="t mid b" x="458" y="288">이 분류에</text>
<text class="t mid b" x="458" y="305">포함된 것</text>
<text class="t-m mid mute" x="620" y="258">n</text>
<rect class="s f-bg" height="52" rx="4" width="140" x="550" y="266"></rect>
<text class="t mid" x="620" y="288">멀리서 보면</text>
<text class="t mid" x="620" y="305">파리처럼 보이는 것</text>
<!-- 알파벳의 실이 남은 '과' -->
<line class="s-thin k-mute" x1="166" x2="166" y1="303" y2="328"></line>
<text class="t-s mid" x="166" y="342">‘과’ = 알파벳 순서뿐</text>
<!-- 손으로 굴려 보기: g의 개 한 마리는 h에도 -->
<path class="s-thin" d="M341,313 C341,348 458,348 458,321" marker-end="url(#d-borges-ar)"></path>
<text class="t-s mid" x="400" y="364">그 개는 h에도 든다</text>
<!-- 치워진 바닥 -->
<rect class="s k-lak dash" height="12" width="640" x="50" y="378"></rect>
<line class="s k-lak dash" x1="74" x2="74" y1="390" y2="410"></line>
<line class="s k-lak dash" x1="666" x2="666" y1="390" y2="410"></line>
<text class="t mid b c-lak" x="370" y="410">자리 = 없음</text>
<text class="t-s mid mute" x="370" y="427">만날 곳은 언어(목소리·종이)뿐 — 늘어놓을 뿐 공간을 내주지 않는다</text>
</svg></g></g></g></g></g></svg>
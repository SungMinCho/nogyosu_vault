<text class="tb tm" x="344" y="50">짐승 · 식물 · 영</text>
<text class="ts tm c-jag" x="344" y="70">동물 인척 (재규어 = 처남)</text>
<text class="tb tm" x="344" y="118">다른 마을 · 적 · 백인</text>
<text class="ts tm c-jag" x="344" y="138">인척 = 적 (처남 · 토자바르)</text>
<text class="tb tm" x="344" y="184">이상적 마을</text>
<text class="tl tm" x="344" y="201">마을 내혼</text>
<text class="ts tm c-uru tb" x="344" y="223">인척 → 혈족으로 위장</text>
<text class="ts tm" x="344" y="243">사촌 · 아들의 외삼촌</text>
<text class="ts tm" x="344" y="262">한 몸(우나 카로)</text>
<text class="tm" x="344" y="308">누이</text>
<text class="ts tb te" x="480" y="272">실제 마을</text>
<text class="tl te" x="480" y="288">사위 · 장인</text>
<text class="tl te c-jag" x="480" y="304">= 숨은 인척</text>
<text class="ts tb c-jag" x="16" y="42">투피남바 포로</text>
<text class="tl" x="16" y="60">바깥에서 끌려와</text>
<text class="tl" x="16" y="77">안에서 처남이 됨</text>
<text class="tl" x="16" y="94">아내 = 처형자의 누이</text>
<path class="s-dim w1 dot" d="M110,101 L194.5,156.3"></path>
<path class="f-panel s-jag w1" d="M203.5,156.7 L211.9,171.2 L195.1,171.2 Z"></path>
<path class="s-jag w2 round" d="M201.5,175.3 Q173.5,225.3 228.2,274" marker-end="url(#f21-a-jag)"></path>
<path class="f-jag" d="M240.2,265.4 L248.6,279.9 L231.8,279.9 Z"></path>
<text class="ts tb c-jag" x="252.2" y="279">처남</text>
<line class="s-ink w2" marker-end="url(#f21-a-ink)" x1="144" x2="308" y1="352" y2="352"></line>
<text class="tl" x="144" y="340">혼인이 안쪽으로 다가간다</text>
<circle class="f-uru" cx="220" cy="352" r="4.5"></circle>
<text class="ts tm" x="220" y="372">교차사촌</text>
<circle class="f-uru" cx="280" cy="352" r="4.5"></circle>
<text class="ts tm" x="280" y="372">누이의 딸</text>
<text class="tl tm" x="280" y="388">우대혼</text>
<path class="s-ink w1 dot" d="M314,316 V360 M374,316 V360"></path>
<text class="ts tb tm" x="344" y="357">하한</text>
<text class="tl tm" x="344" y="372">닿지 않음</text>
<line class="s-ink w3" marker-end="url(#f21-a-w3)" x1="380" x2="662" y1="352" y2="352"></line>
<line class="s-ink w1 dash" x1="504" x2="504" y1="316" y2="360"></line>
<text class="ts" x="380" y="340">혈족이 무표</text>
<text class="ts te" x="662" y="340">인척이 무표</text>
<text class="ts tb tm" x="504" y="374">위장이 뒤집힌다</text>
<text class="ts c-uru" x="380" y="404">현실적 혼인 많음</text>
<text class="tl te" x="636" y="404">혼인 없음</text>
<path class="f-uru" d="M380,410 L636,417 L380,424 Z"></path>
<path class="f-jag" d="M380,445 L636,438 L636,452 Z"></path>
<text class="tl" x="380" y="472">인척 강도 약함</text>
<text class="ts te c-jag" x="636" y="472">인척 강도 강함</text>
<text class="ts tb" x="16" y="472">모든 현실적 내혼은 잠재적 외혼의 하한</text>
</svg></g></g></g></g></svg>
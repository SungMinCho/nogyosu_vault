<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 620 250" width="620" height="250" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#F1F2EC; --paper:#FAFAF6; --soft:#E3E6DE; --tie:#B9BEB5; --stack:#C9CDC4; --grid:#DCE0D6; --rule:#CDD3CA;
  --ink:#1B2420; --ink-2:#44504A; --muted:#6E7871; --on:#FFFFFF;
  --pot:#23825A; --risk:#C0392B; --eq:#A0700F; --un:#2F5DA8; --warn:#8A4FB8;
  --eq-bg:#F3E7CC; --risk-bg:#F6DEDA;
  --f-body:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-disp:"Song Myung","Nanum Myeongjo","Noto Serif KR",serif;
  --f-num:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --f-dg:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --f-math:"Noto Sans Math","STIX Two Math","Cambria Math",math;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}}:root[data-theme="dark"]{
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:2.2rem 4rem}.lecture{display:contents}.fig{margin:.6rem 0 !important;display:grid;gap:.55rem}.fig .frame{overflow-x:auto;background:
  linear-gradient(90deg,var(--paper) 30%,transparent),linear-gradient(270deg,var(--paper) 30%,transparent),
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent),
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent) 100% 0;
  background-color:var(--paper);background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll;
  border:1px solid var(--rule);border-radius:3px;padding:.7rem}.dg{display:block;width:100%;height:auto;font-family:var(--f-dg)}.dg text{fill:var(--ink);font-size:12px}.dg text.mu{fill:var(--muted)}.dg text.b{font-weight:700}.dg text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}.dg text.card{font-family:var(--f-num)}.dg .f-ink{fill:var(--ink)}.dg .f-paper{fill:var(--paper)}.dg .f-soft{fill:var(--soft)}.dg .f-eqbg{fill:var(--eq-bg)}.dg .f-riskbg{fill:var(--risk-bg)}.dg .s-ink{stroke:var(--ink);stroke-width:1.2}.dg .s-risk{stroke:var(--risk);stroke-width:1.6}.dg .s-eq{stroke:var(--eq);stroke-width:1.6}.dg .s-warn{stroke:var(--warn);stroke-width:1.6}.dg .nofill{fill:none}.dg circle:hover,.dg rect[class]:hover{filter:brightness(1.08)}svg.pz-root{width:620px!important;height:250px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="턴에서 6bb를 콜할 때의 나무: 19.6% 확률로 하트가 와서 지금 팟 15.1bb에 앞으로 받을 돈 M을 얻고, 80.4%는 6bb를 잃는다. 본전이 되려면 M이 9.6bb 이상이어야 한다. 점선은 맞추고도 더 높은 플러시에 지는 리버스 임플라이드 갈래." class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 620 250" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar-imp" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="f-paper s-ink" height="50.0" rx="4" width="128.0" x="12.0" y="96.0"></rect><text class="b" style="font-size:13px" text-anchor="middle" x="76.0" y="117.0">턴: 6bb 콜</text><text class="mu num" style="font-size:12px" text-anchor="middle" x="76.0" y="134.0">팟 15.1bb</text><path class="s-ink nofill" d="M140,112 C180,112 186,52 226,52" marker-end="url(#ar-imp)"></path><path class="s-ink nofill" d="M140,130 C180,130 186,196 226,196" marker-end="url(#ar-imp)"></path><text style="font-size:12px" text-anchor="start" x="150.0" y="44.0">하트 9/46 · 19.6%</text><text style="font-size:12px" text-anchor="start" x="150.0" y="232.0">블랭크 37/46 · 80.4%</text><rect class="f-eqbg s-eq" height="42.0" rx="4" width="150.0" x="230.0" y="30.0"></rect><text class="b num" style="font-size:14px" text-anchor="middle" x="305.0" y="48.0">+15.1 + M</text><text class="mu" style="font-size:11px" text-anchor="middle" x="305.0" y="64.0">지금 팟 + 앞으로 받을 돈</text><rect class="f-riskbg s-risk" height="42.0" rx="4" width="150.0" x="230.0" y="176.0"></rect><text class="b num" style="font-size:14px" text-anchor="middle" x="305.0" y="194.0">−6</text><text class="mu" style="font-size:11px" text-anchor="middle" x="305.0" y="210.0">리버에 접는다</text><path class="s-warn nofill" d="M380,44 C420,44 420,24 452,24" marker-end="url(#ar-imp)" stroke-dasharray="4 3"></path><text class="wn-k" style="font-size:12px" text-anchor="start" x="458.0" y="22.0">더 높은 플러시에 지면</text><text class="num" style="font-size:12px" text-anchor="start" x="458.0" y="37.0">−(6 + 리버 베팅)</text><rect class="f-soft" height="66.0" rx="4" width="196.0" x="410.0" y="92.0"></rect><text class="mu" style="font-size:12px" text-anchor="middle" x="508.0" y="112.0">본전 조건</text><text class="num" style="font-size:12px" text-anchor="middle" x="508.0" y="130.0">0.196(15.1 + M) = 0.804 × 6</text><text class="b num" style="font-size:14px" text-anchor="middle" x="508.0" y="149.0">M ≥ 9.6bb</text></svg></g></g></g></g></svg>
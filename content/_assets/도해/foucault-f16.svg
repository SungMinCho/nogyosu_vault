<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 740 400" width="740" height="400" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#DDD8CC; --bg-2:#D3CDBF; --panel:#E9E5DB; --panel-2:#F2EFE8;
  --ink:#1D1913; --ink-2:#3B352B; --mute:#625A4D; --rule:#B4AB9A; --rule-2:#C9C1B1;
  --och:#8A6110; --azu:#1F4E8C; --ver:#AE3519; --lak:#9C2B66;
  --och-w:rgba(138,97,16,.15); --azu-w:rgba(31,78,140,.13); --ver-w:rgba(174,53,25,.13); --lak-w:rgba(156,43,102,.13); --ink-w:rgba(29,25,19,.07);
  --weave:rgba(60,48,30,.045);
  --room:#2E2821; --linen:#CBC2AE; --door:#E3C37C; --glass:#A9C0E0; --ray:rgba(240,214,150,.16);
  --f-disp:"Nanum Myeongjo","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-lat:"Cormorant Garamond","Noto Serif KR",Georgia,serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-ui:"Gothic A1","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"Inconsolata","Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15120E; --bg-2:#1B1712; --panel:#1F1B15; --panel-2:#26211A;
  --ink:#E7E0D2; --ink-2:#CFC6B5; --mute:#A39A89; --rule:#4C4538; --rule-2:#3A342A;
  --och:#D7A64C; --azu:#86AEE6; --ver:#EF7A57; --lak:#E585B6;
  --och-w:rgba(215,166,76,.16); --azu-w:rgba(134,174,230,.15); --ver-w:rgba(239,122,87,.15); --lak-w:rgba(229,133,182,.15); --ink-w:rgba(231,224,210,.07);
  --weave:rgba(255,240,210,.025); --room:#0A0806; --linen:#81776A; --door:#C9A55A; --glass:#7E9DCB; --ray:rgba(240,214,150,.09); color-scheme:dark }}:root[data-theme="dark"]{
  --bg:#15120E; --bg-2:#1B1712; --panel:#1F1B15; --panel-2:#26211A;
  --ink:#E7E0D2; --ink-2:#CFC6B5; --mute:#A39A89; --rule:#4C4538; --rule-2:#3A342A;
  --och:#D7A64C; --azu:#86AEE6; --ver:#EF7A57; --lak:#E585B6;
  --och-w:rgba(215,166,76,.16); --azu-w:rgba(134,174,230,.15); --ver-w:rgba(239,122,87,.15); --lak-w:rgba(229,133,182,.15); --ink-w:rgba(231,224,210,.07);
  --weave:rgba(255,240,210,.025); --room:#0A0806; --linen:#81776A; --door:#C9A55A; --glass:#7E9DCB; --ray:rgba(240,214,150,.09); color-scheme:dark }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{ display:block; width:100%; height:auto }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.6rem 3rem }.lecture{ display:contents }figure.fig{ margin:.6rem 0 .4rem; display:grid; gap:.55rem }.fig .frame{ overflow-x:auto; overscroll-behavior-x:contain; background:var(--panel-2); border:1px solid var(--rule-2); padding:.9rem .8rem;
  background-image:linear-gradient(to right,var(--panel-2) 30%,transparent),linear-gradient(to left,var(--panel-2) 30%,transparent),linear-gradient(to right,var(--ink-w),transparent),linear-gradient(to left,var(--ink-w),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat; background-size:2.2rem 100%,2.2rem 100%,1rem 100%,1rem 100%; background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; height:auto; color:var(--ink) }.t{ font-family:var(--f-ui); font-size:13px; fill:currentColor }.t-s{ font-family:var(--f-ui); font-size:11px; fill:currentColor }.t-d{ font-family:var(--f-disp); font-weight:800; font-size:16px; fill:currentColor }.b{ font-weight:700 }.mid{ text-anchor:middle }.end{ text-anchor:end }.mute{ fill:var(--mute) }.s{ fill:none; stroke:currentColor; stroke-width:1.4 }.s-thin{ fill:none; stroke:currentColor; stroke-width:.8 }.dash{ stroke-dasharray:5 4 }.k-och{ stroke:var(--och) }.k-azu{ stroke:var(--azu) }.f-azu{ fill:var(--azu) }.f-ink{ fill:currentColor }.f-bg{ fill:var(--panel-2) }.f-none{ fill:none }.w-och{ fill:var(--och-w) }.w-azu{ fill:var(--azu-w) }.c-och{ fill:var(--och) }.c-azu{ fill:var(--azu) }svg.pz-root{width:740px!important;height:400px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><g class="pz-w fw"><svg xmlns="http://www.w3.org/2000/svg" aria-label="돈이 딛고 선 바닥이 세 번 바뀐다: 16세기 탑의 바닥이던 값짐이 17세기엔 맨 위로 올라가 탑이 뒤집히고, 담보에선 바닥이 물물교환의 두 토막으로 쪼개져 동전이 그 틈을 건너는 볼모가 되며, 볼모를 무엇이 받치느냐에서 길이 갈린다" class="pz-inner" height="100%" role="img" viewBox="0 0 740 400" width="100%">
<defs>
<marker id="d-money-three-ar" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="d-money-three-az" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-azu" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 머리: 세 시대 -->
<text class="t b mid c-och" x="110" y="26">16세기</text>
<text class="t-d mid c-och" x="110" y="50">실재하는 표지</text>
<text class="t-s mid mute" x="110" y="70">귀해서 돈이다</text>
<text class="t b mid c-azu" x="325" y="26">17세기 중상주의</text>
<text class="t-d mid c-azu" x="325" y="50">기호</text>
<text class="t-s mid mute" x="325" y="70">돈이라서 귀하다</text>
<text class="t b mid c-azu" x="592.5" y="26">17세기 말 ~ 18세기</text>
<text class="t-d mid c-azu" x="592.5" y="50">담보</text>
<text class="t-s mid mute" x="592.5" y="70">미뤄 둔 교환의 볼모</text>
<!-- 1. 16세기: 값짐이 바닥인 탑 -->
<circle class="s k-och w-och" cx="110" cy="128" r="20"></circle>
<circle class="s-thin k-och f-none" cx="110" cy="128" r="14"></circle>
<text class="t b mid c-och" x="110" y="133">금</text>
<text class="t-s c-och" x="138" y="126">기호=내용</text>
<text class="t-s c-och" x="138" y="140">한 몸</text>
<rect class="s-thin k-och f-none" height="24" width="120" x="50" y="152"></rect>
<text class="t mid" x="110" y="168">바꾼다</text>
<rect class="s-thin k-och f-none" height="24" width="120" x="50" y="180"></rect>
<text class="t mid" x="110" y="196">잰다</text>
<rect class="s-thin k-och f-none" height="24" width="120" x="50" y="208"></rect>
<text class="t mid" x="110" y="224">값을 가진다</text>
<rect class="s k-och w-och" height="38" width="190" x="15" y="236"></rect>
<text class="t b mid c-och" x="110" y="260">금속 자체의 값짐</text>
<!-- 화살 1 -->
<line class="s" marker-end="url(#d-money-three-ar)" x1="178" x2="258" y1="192" y2="192"></line>
<text class="t-s b mid" x="217" y="184">뒤집힌다</text>
<!-- 2. 17세기: 대신함이 바닥인 탑 (값짐은 맨 위로) -->
<circle class="s k-azu f-bg" cx="325" cy="156" r="20"></circle>
<text class="t-s mid mute" x="325" y="160">금</text>
<text class="t-s mute" x="352" y="160">알맞은 몸</text>
<rect class="s-thin k-azu f-none" height="24" width="120" x="265" y="180"></rect>
<text class="t mid" x="325" y="196">값을 가진다</text>
<rect class="s-thin k-azu f-none" height="24" width="120" x="265" y="208"></rect>
<text class="t mid" x="325" y="224">잰다</text>
<rect class="s k-azu w-azu" height="38" width="170" x="240" y="236"></rect>
<text class="t b mid c-azu" x="325" y="260">대신함 · 교환 기능</text>
<!-- 화살 2 -->
<line class="s" marker-end="url(#d-money-three-ar)" x1="392" x2="452" y1="192" y2="192"></line>
<text class="t-s b mid" x="422" y="184">쪼갠다</text>
<!-- 3. 담보: 물물교환을 두 토막으로 -->
<rect class="s k-azu w-azu" height="38" width="107" x="460" y="236"></rect>
<text class="t-s mid mute" x="513.5" y="251">앞 토막</text>
<text class="t mid" x="513.5" y="267">물건 → 돈</text>
<rect class="s k-azu dash f-none" height="38" width="51" x="567" y="236"></rect>
<text class="t-s mid c-azu" x="592.5" y="259">미룸</text>
<rect class="s k-azu w-azu" height="38" width="107" x="618" y="236"></rect>
<text class="t-s mid mute" x="671.5" y="251">뒤 토막</text>
<text class="t mid" x="671.5" y="267">돈 → 다른 물건</text>
<path class="s k-azu" d="M513 234 Q592.5 152 672 232" marker-end="url(#d-money-three-az)"></path>
<circle class="f-bg" cx="592.5" cy="193" r="18"></circle>
<circle class="s k-azu w-azu" cx="592.5" cy="193" r="18"></circle>
<text class="t-s b mid c-azu" x="592.5" y="197">볼모</text>
<text class="t-s mid" x="592.5" y="166">들고 건넌다</text>
<!-- 갈림길: 볼모를 무엇이 받치나 -->
<line class="s-thin" x1="592.5" x2="592.5" y1="274" y2="296"></line>
<circle class="f-ink" cx="592.5" cy="296" r="3"></circle>
<text class="t-s end mute" x="584" y="289">이단의 지점</text>
<line class="s-thin" x1="592.5" x2="520" y1="296" y2="318"></line>
<line class="s-thin" x1="592.5" x2="665" y1="296" y2="318"></line>
<text class="t-s b mid" x="520" y="334">바깥 재산에 기댐</text>
<circle class="s k-azu f-bg" cx="470" cy="358" r="10"></circle>
<line class="s-thin dash" x1="481" x2="527" y1="358" y2="358"></line>
<text class="t-s mid mute" x="504" y="351">거리</text>
<rect class="s-thin k-azu f-none" height="20" width="62" x="528" y="348"></rect>
<text class="t-s mid" x="559" y="362">땅 · 회사</text>
<text class="t-s mid" x="520" y="388">로 · 돈 = 수단</text>
<text class="t-s b mid" x="665" y="334">제 금속에 기댐</text>
<circle class="s k-azu w-azu" cx="650" cy="358" r="12"></circle>
<text class="t-s b mid c-azu" x="650" y="362">금</text>
<text class="t-s mute" x="670" y="362">거리 0</text>
<text class="t-s mid" x="665" y="388">1726~ · 수단이자 대상</text>
</svg></g></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 660 262" width="660" height="262" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  --bg:#EDE7DA; --panel:#F6F2E8; --ink:#241E17; --dim:#6B6152; --rule:#CCC2AC;
  --sea:#1B5064; --chaff:#96660C; --fire:#A2432A; --ground:#476844;
  --disp:"Kirang Haerang","Song Myung","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --body:"Cardo","Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif;
  --mono:"Anonymous Pro",ui-monospace,"DejaVu Sans Mono",monospace;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15120F; --panel:#1E1A15; --ink:#EAE3D3; --dim:#9C927F; --rule:#3B352C;
  --sea:#63B2C6; --chaff:#D5A03E; --fire:#DE7A57; --ground:#86AC82;
}}:root[data-theme="dark"]{
  --bg:#15120F; --panel:#1E1A15; --ink:#EAE3D3; --dim:#9C927F; --rule:#3B352C;
  --sea:#63B2C6; --chaff:#D5A03E; --fire:#DE7A57; --ground:#86AC82;
}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.3rem;
  padding-inline:var(--pad);padding-block:0 4rem}.lecture{display:contents}.hero-svg .sea-g path{fill:none;stroke:var(--sea);stroke-width:1.6;opacity:.75}.hero-svg .chaff-g circle{fill:var(--chaff);opacity:.85}.hero-svg .oar path{fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.hero-svg .oar circle{fill:var(--ink)}.hero-svg .chaff-t{fill:var(--chaff)}figure.dia{margin:1.6rem 0}.frame{overflow-x:auto;border:1px solid var(--rule);background:var(--panel);padding:.9rem .7rem;
  background-image:linear-gradient(90deg,var(--panel),transparent 12px),
    linear-gradient(-90deg,var(--panel),transparent 12px),
    linear-gradient(90deg,rgba(0,0,0,.14),transparent 12px),
    linear-gradient(-90deg,rgba(0,0,0,.14),transparent 12px);
  background-repeat:no-repeat;background-size:24px 100%,24px 100%,12px 100%,12px 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll}.frame svg{display:block;width:100%;min-width:480px;height:auto;color:var(--ink)}svg .bx{fill:none;stroke:currentColor;stroke-width:1.5}svg .bx.dash,svg .dash{stroke-dasharray:5 4}svg .ln{fill:none;stroke:currentColor;stroke-width:1.5}svg .ln[marker-end],svg path.ln{fill:none}svg .sm{font-family:var(--mono);font-size:11px;fill:var(--dim)}svg .ttl{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;fill:currentColor}svg .rule{stroke:var(--rule);stroke-width:1}svg .chaff-s{fill:var(--chaff);stroke:var(--chaff);stroke-width:1.8}svg .chaff-s[d]{fill:none}svg .fire-s{fill:none;stroke:var(--fire);stroke-width:1.8}svg .fire-s circle{fill:var(--fire)}svg .chaff-t{fill:var(--chaff)}svg .fire-t{fill:var(--fire)}svg marker#ar path{fill:currentColor;stroke:none}svg marker#arC path{fill:var(--chaff);stroke:none}svg marker#arF path{fill:var(--fire);stroke:none}svg marker#arS path{fill:var(--sea);stroke:none}svg text{dominant-baseline:auto}svg.pz-root{width:660px!important;height:262px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w dia"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="우카시에비치는 값을 0과 1 사이에 놓고 귄터는 0과 1 너머에 놓는다" class="pz-inner" height="100%" role="img" viewBox="0 0 660 262" width="100%"><defs>
<marker id="ar" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z"></path></marker>
<marker id="arC" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z"></path></marker>
<marker id="arF" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z"></path></marker>
<marker id="arS" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0 L10 5 L0 10 z"></path></marker>
</defs>
<text class="ttl" x="8" y="22">우카시에비치 (1920) — 값이 사이에 놓인다</text>
<line class="ln" x1="80" x2="480" y1="62" y2="62"></line>
<g class="bx"><circle cx="80" cy="62" r="6"></circle><circle cx="480" cy="62" r="6"></circle></g>
<circle class="chaff-s" cx="280" cy="62" fill="none" r="7"></circle>
<g class="sm"><text text-anchor="middle" x="80" y="88">0</text><text text-anchor="middle" x="480" y="88">1</text></g>
<text class="sm chaff-t" text-anchor="middle" x="280" y="88">½</text>
<text class="sm" text-anchor="middle" x="560" y="66">단맥락적</text>
<line class="rule" x1="8" x2="652" y1="112" y2="112"></line>
<text class="ttl" x="8" y="144">귄터 — 값이 0과 1 너머에 놓인다</text>
<rect class="bx" height="60" rx="4" width="180" x="60" y="164"></rect>
<text class="sm" text-anchor="middle" x="150" y="158">콘텍스투어 1 — 고전 논리가 엄밀히 성립</text>
<g class="bx"><circle cx="105" cy="196" r="6"></circle><circle cx="195" cy="196" r="6"></circle></g>
<line class="ln" x1="105" x2="195" y1="196" y2="196"></line>
<g class="sm"><text text-anchor="middle" x="105" y="218">0</text><text text-anchor="middle" x="195" y="218">1</text></g>
<rect class="bx" height="60" rx="4" width="180" x="420" y="164"></rect>
<text class="sm" text-anchor="middle" x="510" y="158">콘텍스투어 2</text>
<g class="bx"><circle cx="465" cy="196" r="6"></circle><circle cx="555" cy="196" r="6"></circle></g>
<line class="ln" x1="465" x2="555" y1="196" y2="196"></line>
<g class="sm"><text text-anchor="middle" x="465" y="218">0</text><text text-anchor="middle" x="555" y="218">1</text></g>
<path class="fire-s" d="M248 194 L412 194" marker-end="url(#arF)"></path>
<text class="sm fire-t" text-anchor="middle" x="330" y="186">초접합 = 맥락 교체</text>
<text class="sm fire-t" text-anchor="middle" x="330" y="244">하나의 튜링 기계로 환원되지 않는다</text>
</svg></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 290" width="760" height="290" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#E5E6E1; --panel:#F0F1EC; --ink:#1B1D21; --mute:#5B5F63; --rule:#C3C6C0;
  --sub:#1D4F93; --sym:#855D00; --jou:#AE2E1C;
  --sub-t:rgba(29,79,147,.12); --sym-t:rgba(201,150,20,.22); --jou-t:rgba(174,46,28,.12);
  --flb:#1F4F96; --fly:#E3B021; --flr:#C0301F;
  --f-body:"Spectral","Nanum Myeongjo","Noto Serif CJK KR","Noto Serif KR","AppleMyungjo",serif;
  --f-disp:"Hahmlet","Nanum Myeongjo","Noto Serif CJK KR",serif;
  --f-label:"Nanum Gothic","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"Courier Prime","Nanum Gothic Coding","Noto Sans Mono CJK KR",monospace;
  --f-lat:"Spectral","Nanum Myeongjo",serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121417; --panel:#1B1E22; --ink:#E6E4DE; --mute:#A2A6A9; --rule:#353A40;
    --sub:#86AEEA; --sym:#DDB14C; --jou:#EE7B64;
    --sub-t:rgba(134,174,234,.16); --sym-t:rgba(221,177,76,.18); --jou-t:rgba(238,123,100,.16);
    --flb:#2A5AA0; --fly:#C99A1B; --flr:#B0342A;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121417; --panel:#1B1E22; --ink:#E6E4DE; --mute:#A2A6A9; --rule:#353A40;
  --sub:#86AEEA; --sym:#DDB14C; --jou:#EE7B64;
  --sub-t:rgba(134,174,234,.16); --sym-t:rgba(221,177,76,.18); --jou-t:rgba(238,123,100,.16);
  --flb:#2A5AA0; --fly:#C99A1B; --flr:#B0342A;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:2.2rem 4rem; }.lecture{ display:contents; }.flag svg{ display:block; width:100%; height:auto; }.fig{ margin-block:.6rem; display:grid; gap:.5rem; }.fig-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background:
  linear-gradient(90deg,var(--panel) 30%,transparent) left/2.2rem 100% no-repeat local,
  linear-gradient(270deg,var(--panel) 30%,transparent) right/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent) left/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) right/.8rem 100% no-repeat scroll, var(--panel);
  padding:.6rem .4rem; }.fig svg{ display:block; width:100%; height:auto; min-width:640px; }svg text{ fill:var(--ink); font-family:var(--f-label); }.t-sm{ font-size:12px; }.t-md{ font-size:13.5px; }.t-lg{ font-size:18px; }.t-b{ font-weight:700; }.t-mute{ fill:var(--mute); }.t-sub{ fill:var(--sub); }.t-it{ font-family:var(--f-lat); font-style:italic; }.f-mute{ fill:var(--mute); }.f-ground{ fill:var(--ground); }.f-panel{ fill:var(--panel); }.f-none{ fill:none; }.f-sub{ fill:var(--sub); }.s-ink{ stroke:var(--ink); }.s-mute{ stroke:var(--mute); }.s-sub{ stroke:var(--sub); }.fig-scroll .f-panel{ fill:var(--ground); }svg.pz-root{width:760px!important;height:290px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-scroll"><svg xmlns="http://www.w3.org/2000/svg" aria-label="표상들의 장 한가운데에 구멍이 있고, 모든 표상에서 그 구멍으로 점선이 동반한다. 구멍에서 생각하는 사물로 가는 데카르트의 화살표는 칸트가 끊었다." class="pz-inner" data-fig="f02" height="100%" role="img" style="--fw:760" viewBox="0 0 760 290" width="100%"><defs><marker id="f02-a-sub" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-sub" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f02-a-mute" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="f-panel s-mute" height="240" rx="10" stroke-width="1.2" width="460" x="20" y="30"></rect><text class="t-sm t-mute" text-anchor="start" x="36" y="52">표상들의 장 (현상)</text><rect class="s-ink f-ground" height="26" rx="13" stroke-width="1.4" width="76" x="52" y="72"></rect><text class="t-sm" text-anchor="middle" x="90.0" y="89.5">나무</text><line class="s-sub" marker-end="url(#f02-a-sub)" stroke-dasharray="3 3" stroke-width="1" x1="126.7" x2="197.8" y1="91.4" y2="131.7"></line><rect class="s-ink f-ground" height="26" rx="13" stroke-width="1.4" width="76" x="330" y="62"></rect><text class="t-sm" text-anchor="middle" x="368.0" y="79.5">종소리</text><line class="s-sub" marker-end="url(#f02-a-sub)" stroke-dasharray="3 3" stroke-width="1" x1="333.5" x2="279.7" y1="83.1" y2="126.7"></line><rect class="s-ink f-ground" height="26" rx="13" stroke-width="1.4" width="76" x="398" y="100"></rect><text class="t-sm" text-anchor="middle" x="436.0" y="117.5">빨강</text><line class="s-sub" marker-end="url(#f02-a-sub)" stroke-dasharray="3 3" stroke-width="1" x1="396.7" x2="285.2" y1="116.0" y2="141.5"></line><rect class="s-ink f-ground" height="26" rx="13" stroke-width="1.4" width="76" x="340" y="226"></rect><text class="t-sm" text-anchor="middle" x="378.0" y="243.5">기억</text><line class="s-sub" marker-end="url(#f02-a-sub)" stroke-dasharray="3 3" stroke-width="1" x1="344.4" x2="278.7" y1="230.3" y2="174.9"></line><rect class="s-ink f-ground" height="26" rx="13" stroke-width="1.4" width="76" x="52" y="218"></rect><text class="t-sm" text-anchor="middle" x="90.0" y="235.5">숫자 7</text><line class="s-sub" marker-end="url(#f02-a-sub)" stroke-dasharray="3 3" stroke-width="1" x1="125.2" x2="199.5" y1="223.4" y2="171.9"></line><rect class="s-ink f-ground" height="26" rx="13" stroke-width="1.4" width="76" x="40" y="144"></rect><text class="t-sm" text-anchor="middle" x="78.0" y="161.5">이 책상</text><line class="s-sub" marker-end="url(#f02-a-sub)" stroke-dasharray="3 3" stroke-width="1" x1="118.0" x2="194.0" y1="156.3" y2="152.0"></line><text class="t-sm t-sub" text-anchor="start" x="300" y="104">동반한다</text><circle class="f-ground s-sub" cx="240" cy="150" r="42" stroke-dasharray="5 4" stroke-width="2"></circle><text class="t-lg t-sub t-it" text-anchor="middle" x="240" y="157">= X</text><text class="t-sm t-b" text-anchor="middle" x="240" y="212">‘나는 생각한다’</text><rect class="s-ink f-panel" height="56" rx="6" stroke-width="1.4" width="180" x="560" y="124"></rect><text class="t-md" text-anchor="middle" x="650.0" y="156.5"></text><text class="t-md t-b" text-anchor="middle" x="650" y="148">레스 코기탄스</text><text class="t-sm" text-anchor="middle" x="650" y="167">(생각하는 사물)</text><line class="s-mute" marker-end="url(#f02-a-mute)" stroke-dasharray="6 4" stroke-width="1.4" x1="284" x2="554" y1="150" y2="150"></line><path class="s-ink f-none" d="M 506 138 L 530 162 M 530 138 L 506 162" stroke-width="2.6"></path><text class="t-sm t-b" text-anchor="middle" x="518" y="186">칸트가 끊음</text><text class="t-sm" text-anchor="middle" x="650" y="108">데카르트의 바꿔치기</text></svg></g></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 620 300" width="620" height="300" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#E4E9E2; --panel:#EDF1EB; --ink:#17201C; --ink2:#46524C; --ink3:#6F7B74; --rule:#C1CAC0; --hair:#D2D9D0;
  --umber:#8C4D12; --umber-l:#E4CFBA; --blue:#22508F; --blue-l:#CCD8EA; --blue-d:#1A3E70;

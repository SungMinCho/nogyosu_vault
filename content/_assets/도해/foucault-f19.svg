<text class="t-s" x="494" y="447">종의 지시</text>
<text class="t-s b" x="494" y="462">화폐 담보</text>
<text class="t-d end c-azu" x="246" y="414">파생</text>
<text class="t-s end" x="246" y="432">비유</text>

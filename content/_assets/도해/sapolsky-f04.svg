<path class="ln-alarm w-heavy" d="M403,40 L403,64"></path>
<text class="t-s t-alarm t-b halo" text-anchor="middle" x="462" y="43">뒤늦게 브레이크</text>
<path class="ln-g" d="M16,162 L664,162"></path>
<!-- 아래: 두 시간축 -->
<path class="ln-m dot" d="M300,182 L300,428"></path>
<path class="ln-m dot" d="M318,182 L318,428"></path>
<text class="t-s t-neuro t-b" text-anchor="end" x="294" y="186">P200 위협 · &lt;200ms</text>

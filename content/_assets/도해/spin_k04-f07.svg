}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .f-ink{ fill:var(--ink) }.dg .halo{ paint-order:stroke; stroke:var(--paper); stroke-width:4px; stroke-linejoin:round }.dg .hm{ fill:var(--rot) }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="한 원소에 몰린 가중치와 대각 헤시안을 하다마드로 돌리면 원소가 고르게 퍼지고, 헤시안은 대각이 같고 비대각이 고른 상관 행렬이 된다" class="dg" height="100%" role="img" style="" viewBox="0 0 790 300" width="100%"><defs><marker id="f6-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-b" text-anchor="start" x="30" y="28">가중치 W (2 × 2)</text><rect class="hm" height="42" rx="2" style="fill-opacity:0.86" width="42" x="40" y="50"></rect><text class="t-s t-mono halo" text-anchor="middle" x="61" y="75">4</text><rect class="hm" height="42" rx="2" style="fill-opacity:0.06" width="42" x="84" y="50"></rect><text class="t-s t-mono halo" text-anchor="middle" x="105" y="75">0</text><rect class="hm" height="42" rx="2" style="fill-opacity:0.06" width="42" x="40" y="94"></rect><text class="t-s t-mono halo" text-anchor="middle" x="61" y="119">0</text><rect class="hm" height="42" rx="2" style="fill-opacity:0.06" width="42" x="84" y="94"></rect><text class="t-s t-mono halo" text-anchor="mi
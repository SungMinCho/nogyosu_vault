er-t t-s" text-anchor="middle" x="642" y="178">닫히지 않고</text><text class="f-madder-t t-s" text-anchor="middle" x="642" y="194">열린 채 이어짐</text><circle class="f-ink f-ink-t" cx="96" cy="250" r="4.2" stroke-width="1"></circle><circle class="f-ink f-ink-t" cx="96" cy="100" r="4.2" stroke-width="1"></circle><circle class="f-ink f-ink-t" cx="216" cy="100" r="4.2" stroke-width="1"></circle><circle class="f-ink f-ink-t" cx="216" cy="182" r="4.2" stroke-width="1"></circle><circle class="f-ink f-ink-t" cx="336" cy="182" r="4.2" stroke-width="1"></circle><circle class="f-ink f-ink-t" cx="336" cy="120" r="4.2" stroke-width="1"></circle><circle class="f-ink f-ink-t" cx="456" cy="120" r="4.2" stroke-width="1"></circle><circle class="f-ink f-ink-t" cx="456" cy="226" r="4.2" stroke-width="1"></circle><circle class="f-ink f-ink-t" cx="576" cy="226" r="4.2" stroke-width="1"></circle><circle class="f-ink f-ink-t" cx="576" cy="150" r="4.2" stroke-width="1"></circle><text class="f-ink2-t t-s halo" text-anchor="start" x="226" y="82">혼인·아이 등록</text><line class="f-ink2 f-none" stroke-width="1" x1="222" x2="219" y1="86" y2="95"></line><path class="f-indigo f-indigo-f" d="M389,172 L403,172 L396,160 Z" stroke-width="1.3"></path><line class="f-indigo f-none" stroke-width="2" x1="370" x2="422" y1="153" y2="167"></line><rect class="f-indigo f-indigo-f" height="10" rx="1" stroke-width="1.1" width="12" x="370" y="141"></rect><rect class="f-indigo f-indigo-f" height="16" rx="1" stroke-width="1.1" width="20" x="406" y="148"></rect><text class="f-indigo-t t-s t-b" text-anchor="middle" x="396" y="194">코드의 잉여가치</text><text class="f-indigo-t t-s" text-anchor="middle" x="396" y="210">넘침과 모자람</text><line class="f-indigo f-none f-dot" stroke-width="1" x1="366" x2="344" y1="154" y2="178"></line></svg></g></g></g></g></svg>
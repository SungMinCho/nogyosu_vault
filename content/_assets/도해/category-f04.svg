<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 220" width="260" height="220" class="panel frame panels fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.katex svg{fill:currentColor;stroke:currentColor;display:block;height:inherit;position:absolute;width:100%}.katex svg path{stroke:none}.katex svg{fill-rule:nonzero;fill-opacity:1;stroke-width:1;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:4;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1}:root{
  --paper:#F2F3F1; --paper-2:#E6E9E8; --ink:#15181C; --ink-2:#4A535B; --rule:#C3C9CD;
  --c-arrow:#1D5BB5;   
  --c-fun:#C3432A;     
  --c-nat:#15774A;     
  --c-univ:#9A690A;    
  --c-alarm:#8A3A91;   
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-body:"Hahmlet","Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-sign:"Jost","Do Hyeon","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --paper:#101316; --paper-2:#181D21; --ink:#E3E6E8; --ink-2:#9EA7AF; --rule:#2F363C;
    --c-arrow:#6FA3F0; --c-fun:#EE7A5D; --c-nat:#4DC388; --c-univ:#E0AA44; --c-alarm:#C98ED4;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --paper:#101316; --paper-2:#181D21; --ink:#E3E6E8; --ink-2:#9EA7AF; --rule:#2F363C;
  --c-arrow:#6FA3F0; --c-fun:#EE7A5D; --c-nat:#4DC388; --c-univ:#E0AA44; --c-alarm:#C98ED4;
  color-scheme:dark;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:2.2rem 4rem }.lecture{ display:contents }.legend svg{ width:3.2rem; height:1.2rem; overflow:visible }.fig{ margin:0; display:grid; gap:.6rem; padding-block:.4rem }.frame{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  background:
    linear-gradient(to right, var(--paper) 30%, transparent) left center / 2rem 100% no-repeat local,
    linear-gradient(to left, var(--paper) 30%, transparent) right center / 2rem 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.22), transparent) left center / .8rem 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.22), transparent) right center / .8rem 100% no-repeat scroll;
  background-attachment:local,local,scroll,scroll }.frame > svg{ display:block; width:100%; min-width:var(--minw,0px); height:auto; margin-inline:auto; max-width:48rem }.panels{ display:flex; flex-wrap:wrap; justify-content:center; gap:1.1rem 1.8rem; overflow:visible; background:none }.panel{ flex:1 1 calc(var(--pw) * .72px); max-width:calc(var(--pw) * 1.25px); min-width:0; display:grid; gap:.3rem; align-content:start }.panel svg{ display:block; width:100%; height:auto }.fig svg text{ font-family:var(--f-sign); fill:var(--ink) }.fig svg .t{ font-size:15px }.fig svg .t-arrow, .fig svg .t-fun, .fig svg .t-nat, .fig svg .t-univ, .fig svg .t-alarm{ font-size:15px }.fig svg .t-arrow{ fill:var(--c-arrow) }.fig svg tspan.t-univ{ fill:var(--c-univ) }.fig svg .i, .fig svg tspan.i{ font-family:KaTeX_Math,"Times New Roman",serif; font-style:italic }.fig svg tspan.sub{ font-size:70% }.ln{ fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-width:3px }.ln-arrow{ stroke:var(--c-arrow) }.mk-arrow{ fill:var(--c-arrow) }.mk-fun{ fill:var(--c-fun) }.mk-nat{ fill:var(--c-nat) }.mk-univ{ fill:var(--c-univ) }.mk-alarm{ fill:var(--c-alarm) }.mk-ink{ fill:var(--ink) }.mk-mute{ fill:var(--ink-2) }.st{ fill:var(--paper); stroke:var(--ink); stroke-width:3.5px }.st-num{ stroke-width:3px }.mini svg{ width:100%; height:auto; display:block }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="모노이드 범주: 역은 하나, 노선은 모두 그 역에서 나가 그 역으로 돌아오는 순환선" height="100%" role="img" viewBox="0 0 260 220" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="poles-b-m-arrow" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-arrow" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="poles-b-m-fun" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-fun" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="poles-b-m-nat" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-nat" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="poles-b-m-univ" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-univ" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="poles-b-m-alarm" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-alarm" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="poles-b-m-ink" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-ink" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="poles-b-m-mute" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-mute" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><path class="ln ln-arrow" d="M124.0,110.2 C90.0,55.7 170.0,55.7 136.7,108.3" marker-end="url(#poles-b-m-arrow)" style="stroke-width:2.5px"></path><text class="t-arrow" text-anchor="middle" x="130.0" y="58.0">"a"</text><path class="ln ln-arrow" d="M146.0,124.4 C202.9,112.2 177.6,181.7 143.4,137.0" marker-end="url(#poles-b-m-arrow)" style="stroke-width:2.5px"></path><text class="t-arrow" text-anchor="middle" x="194.0" y="153.3">"b"</text><path class="ln ln-arrow" d="M118.1,135.7 C82.4,181.7 57.1,112.2 112.0,124.4" marker-end="url(#poles-b-m-arrow)" style="stroke-width:2.5px"></path><text class="t-arrow" text-anchor="middle" x="66.0" y="153.3">"ab"</text><circle class="st st-num" cx="130.0" cy="125.0" r="16"></circle><text class="t" text-anchor="middle" x="130.0" y="131.0">★</text></svg></svg>
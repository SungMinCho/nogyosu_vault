<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 350" width="760" height="350" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .t-pos{ fill:var(--pos) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-spike{ stroke:var(--spike) }.dg .dash{ stroke-dasharray:4 3 }.dg .f-mut{ fill:var(--muted) }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .dot-q{ fill:var(--paper); stroke:var(--ink); stroke-width:1.4 }.dg .dot-rt{ fill:var(--rot); stroke:var(--paper); stroke-width:1.5 }.dg .thick{ stroke-width:2.4 }.dg .ring{ fill:none; stroke:var(--muted); stroke-width:1.1; stroke-dasharray:4 3 }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:760px!important;height:350px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="회전 행렬들의 집합을 원으로 그리면, 보통 경사하강은 접선 방향으로 나가 원을 벗어나고 케일리 걸음은 원 위를 따라 움직인다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 760 350" width="100%"><defs><marker id="h3-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="h3-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="h3-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mut" d="M0,0 L10,5 L0,10 z"></path></marker></defs><circle class="ring" cx="190" cy="200" r="108"></circle><circle class="dot-q" cx="128.1" cy="111.5" r="5.5"></circle><text class="t-s t-b" text-anchor="end" x="118.054" y="103.532">R (지금)</text><line class="ln ln-spike dash" marker-end="url(#h3-spike)" x1="128.054" x2="209.969" y1="111.532" y2="54.1739"></line><text class="t-s t-b t-spike" text-anchor="start" x="215.969" y="38.1739">보통 경사하강</text><text class="t-s t-spike" text-anchor="start" x="215.969" y="52.1739">곡면을 벗어남 (열 길이 1.118)</text><path class="ln ln-rot thick" d="M 128.1 111.5 A 108 108 0 0 1 212.5 94.4" marker-end="url(#h3-rot)"></path><circle class="dot-rt" cx="212.5" cy="94.4" r="5.5"></circle><text class="t-s t-b t-rot" text-anchor="middle" x="208.454" y="120.36">케일리 걸음 R′</text><text class="t-s t-rot" text-anchor="middle" x="208.454" y="136.36">곡면 위에 머묾</text><text class="t-s t-mut" text-anchor="middle" x="190" y="334">점선 원 = 회전 행렬들의 집합 (다양체)</text><text class="t-b" text-anchor="start" x="470" y="50">한 걸음의 처방</text><text class="t-s t-b" text-anchor="start" x="470" y="82">① 기울기 G를 구한다</text><text class="t-s t-b" text-anchor="start" x="470" y="126">② 반대칭으로 바꾼다:</text><text class="t-s t-mono t-rot" text-anchor="start" x="484" y="143">Y = Ĝ − Ĝᵀ  (접하는 방향)</text><text class="t-s t-b" text-anchor="start" x="470" y="170">③ 케일리 변환:</text><text class="t-s t-mono t-rot" text-anchor="start" x="484" y="187">(I − α/2·Y)⁻¹ (I + α/2·Y)</text><text class="t-s t-b" text-anchor="start" x="470" y="214">④ 지금의 R에 곱한다:</text><text class="t-s t-mono t-rot" text-anchor="start" x="484" y="231">R′ = (작은 회전) · R</text><text class="t-s t-b t-pos" text-anchor="start" x="470" y="270">몇 걸음을 가든 R은 회전 — 모델은 그대로.</text></svg></g></g></g></g></svg>
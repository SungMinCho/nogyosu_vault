<text class="t-mid t-s f-red" x="138" y="404">거리</text>
<text class="t-mid t-s t-muted" x="280" y="455">자살 = 당과 인민에게서 소외</text>
<circle class="f-red" cx="510" cy="415" r="7"></circle>
<text class="t-mid t-s" x="510" y="447">나</text>
<rect class="f-cobf s-cob w15" height="34" rx="3" width="95" x="600" y="398"></rect>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 470" width="760" height="470" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#E6ECE9; --panel:#F2F5F3; --ink:#172120; --ink-2:#4A5755; --rule:#B6C3BF;
  --liq:#1B6971; --liq-soft:#CFE0DE; --liq-dot:#7FA9AB;
  --cry:#866207; --cry-soft:#EAD9A0; --cry-deep:#C9A43C;
  --inf:#5B3D8F; --inf-soft:#DCD3EA;
  --brk:#983B20; --brk-soft:#EFD5CB;
  --shade:#0E1514; --on-shade:#E6ECE9;
  --f-display:"Hahmlet","Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR",serif;
  --f-body:"Gowun Batang","Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR",serif;
  --f-latin:"Old Standard TT","Gowun Batang","Noto Serif CJK KR",serif;
  --f-mono:"Cutive Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","Courier New",monospace;
  --pad:1.05rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1716; --panel:#15211F; --ink:#DCE6E3; --ink-2:#9EB0AC; --rule:#2D3F3C;
  --liq:#58B4BC; --liq-soft:#163538; --liq-dot:#3C7176;
  --cry:#D8B24B; --cry-soft:#3A3014; --cry-deep:#9C7E2C;
  --inf:#A88DDC; --inf-soft:#2A2140;
  --brk:#E27D57; --brk-soft:#3C2219;
  --shade:#050909; --on-shade:#C9D6D2; color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#0E1716; --panel:#15211F; --ink:#DCE6E3; --ink-2:#9EB0AC; --rule:#2D3F3C;
  --liq:#58B4BC; --liq-soft:#163538; --liq-dot:#3C7176;
  --cry:#D8B24B; --cry-soft:#3A3014; --cry-deep:#9C7E2C;
  --inf:#A88DDC; --inf-soft:#2A2140;
  --brk:#E27D57; --brk-soft:#3C2219;
  --shade:#050909; --on-shade:#C9D6D2; color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.hero-fig svg{ width:100%; height:auto; display:block }figure.fig{ margin:.4rem 0 .6rem }.fig-frame{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background:
  linear-gradient(to right,var(--paper),var(--paper)) left/1.2rem 100% no-repeat local,
  linear-gradient(to left,var(--paper),var(--paper)) right/1.2rem 100% no-repeat local,
  linear-gradient(to right,rgba(0,0,0,.18),rgba(0,0,0,0)) left/.7rem 100% no-repeat scroll,
  linear-gradient(to left,rgba(0,0,0,.18),rgba(0,0,0,0)) right/.7rem 100% no-repeat scroll;
  background-color:var(--paper) }.fig-frame svg{ display:block; width:100%; min-width:560px; height:auto }.fig svg text, .hero-fig text{ font-family:var(--f-body); fill:var(--ink) }.t{ font-size:13px }.t-s{ font-size:11px }.t-num{ font-family:var(--f-latin) !important; font-variant-numeric:tabular-nums }.t-b{ font-weight:700 }.t-mute{ fill:var(--ink-2) !important }.t-inf{ fill:var(--inf) !important }.t-brk{ fill:var(--brk) !important }.f-ink{ fill:var(--ink) }.f-rule{ fill:var(--rule) }.f-inf{ fill:var(--inf) }.s-ink{ stroke:var(--ink) }.s-mute{ stroke:var(--ink-2) }.s-inf{ stroke:var(--inf) }.s-brk{ stroke:var(--brk) }.w05{ stroke-width:.6 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w4{ stroke-width:4.5 }.dash{ stroke-dasharray:5 4 }.op5{ opacity:.5 }.hero-fig .band:hover polygon, .hero-fig .band:focus polygon{ fill:var(--inf-soft) }svg.pz-root{width:760px!important;height:470px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="전자기 복사의 로그 자. 위는 10⁻¹³ m에서 3×10⁴ m까지 약 17.5 자릿수에 감마선, X선, 자외선, 가시광선(0.24 자릿수의 좁은 띠), 적외선, 틈, 헤르츠파를 놓은 것. 가운데는 10 µm에서 1 m까지 확대한 띠로, 헤르츠 1886(데시미터), 리기 1897(2.5 cm), 보스 5 mm와 레베데프 6 mm, 니콜스·티어 1923(0.22 mm), 글라골레바-아르카디예바 1924(82 µm)가 전기적 방법으로 짧은 쪽으로 다가오고, 루벤스·폰 바이어 1911(약 0.3 mm)과 니콜스·티어의 적외 0.42 mm가 광학적 방법으로 마주 와서 82 µm–0.42 mm가 겹친다. 시몽동이 적은 0.124–0.343 mm보다 넓다. 아래는 같은 축척의 반사 사다리(은 거울과 보랏빛, 금속 그물과 데시미터파, 철탑 줄과 수백 m파)와 회절 사다리(결정 그물과 X선, 새긴 격자와 가시광, 산봉우리와 TV 미터파)." class="pz-inner" height="100%" role="img" viewBox="0 0 760 470" width="100%">
<defs>
<marker id="f12-ar-ink" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f12-ar-inf" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-inf" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<text class="t t-b" x="36" y="20">한 자 위의 여섯 영역 — 파장 10⁻¹³ m ~ 3×10⁴ m, 약 17.5 자릿수</text>
<text class="t-s t-mute" text-anchor="end" x="726" y="20">로그 눈금, 한 칸 = 10배</text>

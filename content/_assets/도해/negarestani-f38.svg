  --f-latin:"EB Garamond","Noto Serif KR",Georgia,serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem;
}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}}:root[data-theme="dark"]{
  --paper:#151715; --plate:#1C1F1C; --ink:#E7E3DA; --ink-2:#A7A39A; --rule:#323632; --mark:#3D423D;
  --cu:#D49261; --vg:#5DB5A1; --pb:#8AAADB; --vm:#E8705A;
  --cu-soft:rgba(212,146,97,.13); --vg-soft:rgba(93,181,161,.12); --pb-soft:rgba(138,170,219,.12); --vm-soft:rgba(232,112,90,.10);
  color-scheme:dark}.pb{color:var(--pb)}.vm{color:var(--vm)}svg.defs{position:absolute;width:0;height:0;overflow:hidden}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-inline:var(--pad);padding-block:0 4rem}.lecture{display:contents}.webwrap svg{display:block;width:100%;height:auto}.sw-dot.pb{background:var(--pb)}.sw-dot.vm{background:var(--vm)}figure.fig{border:1px solid var(--mark);background:var(--plate);padding:.75rem .75rem .6rem;margin-block:.6rem}.figscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  background:linear-gradient(to right,var(--plate) 30%,transparent),linear-gradient(to left,var(--plate) 30%,transparent) 100% 0,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent),radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) 100% 0;
  background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;background-attachment:local,local,scroll,scroll}figure.fig svg{display:block;width:100%;height:auto;min-width:27rem}@media (max-width:34rem){.doc>figure.fig,.lecture>figure.fig{width:calc(100% + var(--pad)*2);max-width:none;margin-inline:calc(var(--pad)*-1);border-inline:0;padding-inline:.6rem}}.terms li.pb{color:var(--pb);background:var(--pb-soft)}.terms li.vm{color:var(--vm);background:var(--vm-soft)}svg .ln,svg .ln-cu,svg .ln-vg,svg .ln-pb,svg .ln-vm{stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}svg .ln:not([fill]),svg .ln-cu:not([fill]),svg .ln-vg:not([fill]),svg .ln-pb:not([fill]),svg .ln-vm:not([fill]){fill:none}svg .ln{stroke:var(--ink)}svg .ln-pb{stroke:var(--pb)}svg .ln-vm{stroke:var(--vm)}svg g.ln-vg>rect:not([fill]),svg g.ln-cu>rect:not([fill]),svg g.ln-pb>rect:not([fill]),svg g.ln-vm>rect:not([fill]){fill:none}svg .thick,svg g.thick>*{stroke-width:2.6}svg .faint,svg g.faint>*,svg g>.faint{stroke:var(--mark)}svg .bg,svg .bg:not([fill]){fill:var(--plate)}svg text{fill:var(--ink);font-family:var(--f-body)}svg .ts{font-size:13px}svg .tm{font-family:var(--f-mono);font-size:11px}svg .c{text-anchor:middle}svg .r{text-anchor:end}svg text.cu{fill:var(--cu)}svg text.vg{fill:var(--vg)}svg text.pb{fill:var(--pb)}svg text.vm{fill:var(--vm)}.m .sq>.rt path{fill:none;stroke:currentColor;stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}.m .sq>.rt path.rh{stroke-width:1.6px}svg.pz-root{width:480px!important;height:300px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w figscroll"><svg aria-label="웃음 자루와 스택 — 유한 상태 넷은 무한한 웃음을 내지만 균형 웃음을 세려면 스택이 있어야 한다" class="pz-inner" height="100%" role="img" viewBox="0 0 480 300" width="100%" xmlns="http://www.w3.org/2000/svg"><line class="ln" marker-end="url(#ah)" x1="14" x2="31" y1="70" y2="70"></line><circle class="ln bg" cx="50" cy="70" r="17"></circle><text class="ts c" x="50" y="75">1</text><circle class="ln bg" cx="160" cy="70" r="17"></circle><text class="ts c" x="160" y="75">2</text><circle class="ln bg" cx="290" cy="70" r="17"></circle><text class="ts c" x="290" y="75">3</text><circle class="ln bg" cx="410" cy="70" r="17"></circle><circle class="ln" cx="410" cy="70" r="13"></circle><text class="ts c" x="410" y="75">4</text>
<text class="ts" x="20" y="24">웃음 자루: 상태 넷</text>
<text class="tm r pb" x="460" y="24">(h(a|e|o))⁺!</text>
<line class="ln" marker-end="url(#ah)" x1="68" x2="141" y1="70" y2="70"></line>
<text class="tm c" x="104" y="62">h</text>
<line class="ln" marker-end="url(#ah)" x1="178" x2="271" y1="70" y2="70"></line>
<text class="tm c" x="224" y="62">a | e | o</text>
<line class="ln" marker-end="url(#ah)" x1="308" x2="391" y1="70" y2="70"></line>
<text class="tm c" x="349" y="62">!</text>
<path class="ln" d="M282,86 C260,120 190,120 168,88" marker-end="url(#ah)"></path>
<text class="tm c" x="225" y="128">h</text>
<text class="tm c" x="240" y="150">1–4음절: 3 + 9 + 27 + 81 = 120가지 · 길이 제한은 없다</text>
<line class="ln faint" x1="20" x2="460" y1="164" y2="164"></line>
<text class="ts" x="20" y="186">균형 웃음 (ha)<tspan baseline-shift="super" font-size="9">k</tspan>(ho)<tspan baseline-shift="super" font-size="9">k</tspan>!는 못 센다</text>
<text class="tm r" x="44" y="204">ha¹</text><text class="tm r" x="44" y="220">ha²</text><text class="tm r" x="44" y="236">ha³</text><text class="tm r" x="44" y="252">ha⁴</text><text class="tm r" x="44" y="268">ha⁵</text><circle class="ln" cx="140" cy="206" r="6"></circle><circle class="ln" cx="140" cy="224" r="6"></circle><circle class="ln" cx="140" cy="242" r="6"></circle><circle class="ln" cx="140" cy="260" r="6"></circle>
<g class="ln"><line x1="48" x2="132" y1="200" y2="206"></line><line x1="48" x2="132" y1="232" y2="242"></line><line x1="48" x2="132" y1="248" y2="259"></line></g>
<line class="ln-vm thick" x1="48" x2="132" y1="216" y2="224"></line>
<line class="ln-vm thick" x1="48" x2="132" y1="264" y2="226"></line>
<text class="tm vm" x="154" y="222">ha²와 ha⁵가 한 상태에</text>
<text class="tm vm" x="154" y="238">→ ha²ho⁵! 도 통과</text>
<text class="tm" x="154" y="262">상황 다섯, 상태 넷</text>
<text class="ts c pb" x="380" y="186">스택이 있어야 센다</text>
<g class="ln-pb"><rect fill="url(#h-pb)" height="10" width="80" x="340" y="250"></rect><rect fill="url(#h-pb)" height="10" width="80" x="340" y="236"></rect><rect fill="url(#h-pb)" height="10" width="80" x="340" y="222"></rect></g>
<path class="ln-pb" d="M332,204 L332,264 L428,264 L428,204"></path>
<text class="tm pb" x="436" y="230">↑ ha</text>
<text class="tm pb" x="436" y="256">↓ ho</text>
<text class="tm c" x="380" y="284">비면 통과 · 정규 → 문맥 자유</text>
</svg></g></g></g></g></svg>
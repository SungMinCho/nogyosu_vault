<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 360" width="800" height="360" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .t-pos{ fill:var(--pos) }.dg .t-doubt{ fill:var(--doubt) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-spike{ stroke:var(--spike) }.dg .ln-pos{ stroke:var(--pos) }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .f-pos{ fill:var(--pos) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-spike{ fill:var(--spike-soft); stroke:var(--spike) }.dg .bx-pos{ fill:var(--pos-soft); stroke:var(--pos) }.dg .thick{ stroke-width:2.4 }.dg .big{ font-size:20px }.lecture > .frame{ max-width:var(--wide) }.dg .bx-doubt{ fill:var(--doubt-soft); stroke:var(--doubt) }.dg .ln-doubt{ stroke:var(--doubt) }.dg .f-doubt{ fill:var(--doubt) }svg.pz-root{width:800px!important;height:360px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="2 곱하기 2 요인 설계. 병합 여부와 양자화 여부를 바꾼 네 칸 A B C D로 기능 변화와 양자화 손실을 떼어 재고, D에 짧은 미세조정을 더한 E로 회복을 잰다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 800 360" width="100%"><defs><marker id="m13-doubt" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-doubt" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="m13-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="m13-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="m13-pos" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-pos" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-s t-b" text-anchor="middle" x="260" y="36">원래 모델</text><text class="t-s t-b" text-anchor="middle" x="510" y="36">R을 RoPE 앞에 병합</text><text class="t-s t-b" text-anchor="end" x="110" y="108">양자화 끔</text><text class="t-s t-b" text-anchor="end" x="110" y="268">Q·K 양자화 켬</text><rect class="bx" height="56" rx="6" width="120" x="200" y="80"></rect><text class="t-b big" text-anchor="middle" x="216" y="114">A</text><text class="t-s t-b" text-anchor="middle" x="272" y="104">기준</text><text class="t-s t-mono t-mut" text-anchor="middle" x="272" y="122">6.00</text><rect class="bx-doubt" height="56" rx="6" width="120" x="450" y="80"></rect><text class="t-b big" text-anchor="middle" x="466" y="114">B</text><text class="t-s t-b" text-anchor="middle" x="522" y="104">병합만</text><text class="t-s t-mono t-mut" text-anchor="middle" x="522" y="122">6.30</text><rect class="bx-spike" height="56" rx="6" width="120" x="200" y="240"></rect><text class="t-b big" text-anchor="middle" x="216" y="274">C</text><text class="t-s t-b" text-anchor="middle" x="272" y="264">양자화만</text><text class="t-s t-mono t-mut" text-anchor="middle" x="272" y="282">7.20</text><rect class="bx-rot" height="56" rx="6" width="120" x="450" y="240"></rect><text class="t-b big" text-anchor="middle" x="466" y="274">D</text><text class="t-s t-b" text-anchor="middle" x="522" y="264">병합 + 양자화</text><text class="t-s t-mono t-mut" text-anchor="middle" x="522" y="282">6.60</text><path class="ln ln-doubt thick" d="M322,108 L446,108" marker-end="url(#m13-doubt)"></path><text class="t-s t-b t-doubt" text-anchor="middle" x="385" y="100">기능 변화 B − A</text><path class="ln ln-spike thick" d="M260,138 L260,236" marker-end="url(#m13-spike)"></path><text class="t-s t-b t-spike" text-anchor="end" x="252" y="190">원래의 양자화 손실 C − A</text><path class="ln ln-rot thick" d="M510,138 L510,236" marker-end="url(#m13-rot)"></path><text class="t-s t-b t-rot" text-anchor="start" x="518" y="190">병합 모델의 양자화 손실 D − B</text><rect class="bx-pos" height="56" rx="6" width="148" x="640" y="240"></rect><text class="t-s t-b" text-anchor="middle" x="714" y="264">E = D + 짧은 미세조정</text><text class="t-s t-mut" text-anchor="middle" x="714" y="282">다른 분포로 평가</text><path class="ln ln-pos thick" d="M572,268 L636,268" marker-end="url(#m13-pos)"></path><text class="t-s t-b t-pos" text-anchor="middle" x="604" y="260">회복?</text><text class="t-s t-mut" text-anchor="start" x="20" y="330">목적: D − B &lt; C − A · 값: B − A · D − A 하나만 보고하면 둘이 섞인다 (숫자는 가상의 perplexity)</text></svg></g></g></g></g></svg>
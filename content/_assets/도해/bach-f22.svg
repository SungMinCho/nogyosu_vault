<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 340" width="600" height="340" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --flour:#EFF0EB; --flour-2:#E6E8E1; --ink:#1C2025; --ink-soft:#4E555D; --rule:#C7CAC1;
  --iron:#3D4652; --water:#1B7480; --spirit:#6448B0; --grain:#A8721A; --rust:#BF4128;
  --water-t:rgba(27,116,128,.12); --spirit-t:rgba(100,72,176,.11); --grain-t:rgba(168,114,26,.13); --rust-t:rgba(191,65,40,.10); --iron-t:rgba(61,70,82,.10);
  --shadow:rgba(28,32,37,.18);
  --display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --body:"Newsreader","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --label:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","Nanum Gothic Coding",ui-monospace,Menlo,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }}:root[data-theme="dark"]{
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents }.lec-no svg{ width:2.2rem; height:2.2rem; flex:none }.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; overflow-y:hidden; border-block:1px solid var(--rule); padding-block:.8rem; background:linear-gradient(to right, var(--flour) 30%, transparent), linear-gradient(to left, var(--flour) 30%, transparent) 100% 0, radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) 100% 0; background-repeat:no-repeat; background-size:2.2rem 100%, 2.2rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; margin-inline:auto; max-width:46rem }.t{ fill:var(--ink); font-family:var(--label); font-size:13px }.t-soft{ fill:var(--ink-soft) }.t-iron{ fill:var(--iron) }.t-water{ fill:var(--water) }.t-spirit{ fill:var(--spirit) }.t-b{ font-weight:600 }.t-sm{ font-size:11.5px }.t-lg{ font-size:15px }.t-mono{ font-family:var(--mono) }.s-soft{ stroke:var(--ink-soft); fill:none }.s-rule{ stroke:var(--rule); fill:none }.s-iron{ stroke:var(--iron); fill:none }.s-water{ stroke:var(--water); fill:none }.s-spirit{ stroke:var(--spirit); fill:none }.f-panel{ fill:var(--flour-2) }.f-soft{ fill:var(--ink-soft) }.f-water{ fill:var(--water) }.f-spirit{ fill:var(--spirit) }.f-iron-t{ fill:var(--iron-t) }.f-spirit-t{ fill:var(--spirit-t) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="진화의 단위 계보 — 다윈의 종(복제되는 것: 번식하는 개체의 생김새) → 도킨스의 유전자(DNA 서열) → 바흐의 소프트웨어 행위자(제어의 조직, 어떤 기층으로든 재구현되며 스스로를 고쳐 쓰는 패턴)." data-min="520" height="100%" role="img" style="" viewBox="0 0 600 340" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="f23-a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-soft" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f23-w" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-water" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f23-s" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spirit" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 머리 줄 -->
<text class="t t-sm t-soft t-mono" text-anchor="middle" x="100" y="26">1859</text>
<text class="t t-sm t-soft t-mono" text-anchor="middle" x="300" y="26">1976</text>
<text class="t t-sm t-soft t-mono" text-anchor="middle" x="500" y="26">2024</text>
<!-- 칸 1: 다윈 · 종 -->
<rect class="f-panel s-iron w15" height="150" rx="4" width="160" x="20" y="36"></rect>
<text class="t t-sm t-soft" text-anchor="middle" x="100" y="58">다윈 『종의 기원』</text>
<text class="t t-b t-lg t-iron" text-anchor="middle" x="100" y="80">종</text>
<!-- 개체 셋, 생김새가 이어진다 -->
<g class="s-iron w15">
<ellipse cx="62" cy="128" rx="16" ry="11"></ellipse><circle cx="80" cy="121" r="6"></circle>
<ellipse cx="122" cy="128" rx="16" ry="11"></ellipse><circle cx="140" cy="121" r="6"></circle>
</g>
<line class="s-water w15" marker-end="url(#f23-w)" x1="84" x2="100" y1="140" y2="140"></line>
<text class="t t-sm t-water" text-anchor="middle" x="100" y="166">번식으로</text>
<!-- 칸 2: 도킨스 · 유전자 -->
<rect class="f-panel s-water w15" height="150" rx="4" width="160" x="220" y="36"></rect>
<text class="t t-sm t-soft" text-anchor="middle" x="300" y="58">도킨스 『이기적 유전자』</text>
<text class="t t-b t-lg t-water" text-anchor="middle" x="300" y="80">유전자</text>
<!-- 이중 나선 -->
<path class="s-water w15" d="M244,112 C256,98 268,98 280,112 S304,126 316,112 S340,98 352,112"></path>
<path class="s-iron w15" d="M244,112 C256,126 268,126 280,112 S304,98 316,112 S340,126 352,112"></path>
<g class="s-rule w1">
<line x1="254" x2="254" y1="104" y2="120"></line><line x1="268" x2="268" y1="102" y2="122"></line>
<line x1="292" x2="292" y1="104" y2="120"></line><line x1="304" x2="304" y1="102" y2="122"></line>
<line x1="328" x2="328" y1="104" y2="120"></line><line x1="340" x2="340" y1="102" y2="122"></line>
</g>
<text class="t t-sm t-iron" text-anchor="middle" x="300" y="146">개체 = 운반자</text>
<text class="t t-sm t-water" text-anchor="middle" x="300" y="166">중합효소로</text>
<!-- 칸 3: 바흐 · 소프트웨어 행위자 -->
<rect class="f-spirit-t s-spirit w2" height="150" rx="4" width="160" x="420" y="36"></rect>
<text class="t t-sm t-soft" text-anchor="middle" x="500" y="58">바흐 · AGI-24</text>
<text class="t t-b t-lg t-spirit" text-anchor="middle" x="500" y="80">소프트웨어 행위자</text>
<!-- 같은 패턴, 다른 기층 셋 -->
<g class="s-spirit w15">
<path d="M444,106 l8,-8 l8,8 l-8,8 z"></path>
<path d="M492,106 l8,-8 l8,8 l-8,8 z"></path>
<path d="M540,106 l8,-8 l8,8 l-8,8 z"></path>
</g>
<rect class="f-iron-t s-iron w1" height="10" rx="2" width="28" x="438" y="118"></rect>
<rect class="f-iron-t s-iron w1" height="10" rx="2" width="28" x="486" y="118"></rect>
<rect class="f-iron-t s-iron w1" height="10" rx="2" width="28" x="534" y="118"></rect>
<text class="t t-sm t-iron" text-anchor="middle" x="452" y="144">세포</text>
<text class="t t-sm t-iron" text-anchor="middle" x="500" y="144">뇌</text>
<text class="t t-sm t-iron" text-anchor="middle" x="548" y="144">실리콘</text>
<text class="t t-sm t-water" text-anchor="middle" x="500" y="166">어떤 기층으로든</text>
<!-- 칸 사이: 시점의 이동 -->
<line class="s-soft w15" marker-end="url(#f23-a)" x1="182" x2="216" y1="111" y2="111"></line>
<line class="s-soft w15" marker-end="url(#f23-a)" x1="382" x2="416" y1="111" y2="111"></line>
<!-- 무엇이 복제되는가 -->
<line class="s-rule w1" x1="20" x2="580" y1="208" y2="208"></line>
<text class="t t-b" x="20" y="230">무엇이 복제되는가</text>
<text class="t" text-anchor="middle" x="100" y="258">개체의 생김새</text>
<text class="t" text-anchor="middle" x="300" y="258">DNA 서열</text>
<text class="t t-spirit" text-anchor="middle" x="500" y="258">제어의 조직</text>
<text class="t t-sm t-soft" text-anchor="middle" x="100" y="278">번식하는 개체</text>
<text class="t t-sm t-soft" text-anchor="middle" x="300" y="278">수명·다산성·충실도</text>
<text class="t t-sm t-soft" text-anchor="middle" x="500" y="278">스스로를 고쳐 쓰는 패턴</text>
<!-- 불변량 축 -->
<line class="s-spirit w15" marker-end="url(#f23-s)" x1="20" x2="576" y1="306" y2="306"></line>
<text class="t t-sm t-soft" x="20" y="328">보존되는 것이 점점 기층에서 멀어진다</text>
<text class="t t-sm t-spirit" text-anchor="end" x="580" y="328">바흐: 진짜 불변량은 소프트웨어</text>
</svg></svg>
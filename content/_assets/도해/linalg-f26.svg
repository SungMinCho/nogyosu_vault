}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:1rem 3rem}.lecture{display:contents}.fig{margin:.6rem 0}.panels{display:flex;flex-wrap:wrap;gap:1rem 1.2rem;justify-content:center;align-items:flex-start}.pn{display:block;flex:1 1 17.5rem;max-width:21rem;height:auto;background:var(--sheet);border:1px solid var(--rule)}.pn.sm{flex:1 1 12.5rem;max-width:15rem}.pn.tall{max-width:23rem}svg text{font-family:var(--f-mono)}.t-lab{font-family:var(--f-body);fill:var(--ink)}.t-head{font-family:var(--f-disp);fill:var(--ink)}.t-math{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;fill:var(--ink)}.c-inv{color:var(--c-inv);fill:var(--c-inv)}.s-in{stroke:var(--c-in)}.s-out{stroke:var(--c-out)}.s-inv{stroke:var(--c-inv)}.s-axis{stroke:var(--axis)}.f-in{fill:var(--c-in)}.f-out{fill:var(--c-out)}.f-inv{fill:var(--c-inv)}.f-orth{fill:var(--c-orth)}.f-warn{fill:var(--c-warn)}.f-null{fill:var(--c-null)}.f-ink{fill:var(--ink)}.f-mut{fill:var(--ink-2)}.f-win{fill:var(--w-in)}.f-wout{fill:var(--w-out)}line,polyline,path{fill:none}.katex svg path{fill:currentColor}polygon.s-in,polygon.s-out{stroke-linejoin:round}svg.pz-root{width:300px!important;height:250px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture main"><g class="pz-w fig"><g class="pz-w panels"><svg aria-label="기저를 (1,1), (1,-1)로 바꾸면 A는 한 방향을 3배로 늘이고 다른 방향은 그대로 두는 대각 변환이다." class="pn pz-inner" height="100%" role="img" viewBox="0 0 300 250" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="dbb-in" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-in" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="dbb-out" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-out" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="dbb-inv" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-inv" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="dbb-orth" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-orth" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="dbb-warn" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-warn" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="dbb-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="dbb-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mut" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="dbb-null" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-null" d="M0,1 L10,5 L0,9 z"></path></marker></defs><text class="t-head" font-size="13" text-anchor="start" x="12" y="20">고유 모눈에서 본 A</text><line class="s-axis" fill="none" stroke-width="1.2" x1="18.4" x2="283.6" y1="150" y2="150"></line><line class="s-axis" fill="none" stroke-width="1.2" x1="100" x2="100" y1="224.8" y2="24.2"></line><line class="s-inv" fill="none" stroke-dasharray="2 3" stroke-width="1.2" x1="59.2" x2="225.8" y1="190.8" y2="24.2"></line><line class="s-inv" fill="none" stroke-dasharray="2 3" stroke-width="1.2" x1="38.8" x2="168" y1="88.8" y2="218"></line><polygon class="f-win s-in" points="100,150 134,116 168,150 134,184" stroke-dasharray="3 3" stroke-width="1.2"></polygon><polygon class="f-wout s-out" points="100,150 202,48 236,82 134,184" stroke-width="1.6"></polygon><line class="s-inv" fill="none" marker-end="url(#dbb-inv)" stroke-width="2.6" x1="100" x2="202" y1="150" y2="48"></line><line class="s-inv" fill="none" marker-end="url(#dbb-inv)" stroke-width="2.6" x1="100" x2="134" y1="150" y2="184"></line><text class="t-math c-inv" font-size="12" text-anchor="end" x="194" y="44">Ab<tspan dy="4" font-size="72%">1</tspan><tspan dy="-4"></tspan> = 3b<tspan dy="4" font-size="72%">1</tspan><tspan dy="-4"></tspan></text><text class="t-math c-inv" font-size="12" text-anchor="start" x="142" y="198">Ab<tspan dy="4" font-size="72%">2</tspan><tspan dy="-4"></tspan> = b<tspan dy="4" font-size="72%">2</tspan><tspan dy="-4"></tspan></text><text class="t-lab" font-size="12" text-anchor="middle" x="150" y="240">한 방향으로 3배 늘일 뿐이다</text></svg></g></g></g></g></svg>
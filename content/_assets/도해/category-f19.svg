<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 340 260" width="340" height="260" class="panel frame panels fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.katex svg{fill:currentColor;stroke:currentColor;display:block;height:inherit;position:absolute;width:100%}.katex svg path{stroke:none}.katex svg{fill-rule:nonzero;fill-opacity:1;stroke-width:1;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:4;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1}:root{
  --paper:#F2F3F1; --paper-2:#E6E9E8; --ink:#15181C; --ink-2:#4A535B; --rule:#C3C9CD;
  --c-arrow:#1D5BB5;   
  --c-fun:#C3432A;     
  --c-nat:#15774A;     
  --c-univ:#9A690A;    
  --c-alarm:#8A3A91;   
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-body:"Hahmlet","Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-sign:"Jost","Do Hyeon","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --paper:#101316; --paper-2:#181D21; --ink:#E3E6E8; --ink-2:#9EA7AF; --rule:#2F363C;
    --c-arrow:#6FA3F0; --c-fun:#EE7A5D; --c-nat:#4DC388; --c-univ:#E0AA44; --c-alarm:#C98ED4;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --paper:#101316; --paper-2:#181D21; --ink:#E3E6E8; --ink-2:#9EA7AF; --rule:#2F363C;
  --c-arrow:#6FA3F0; --c-fun:#EE7A5D; --c-nat:#4DC388; --c-univ:#E0AA44; --c-alarm:#C98ED4;
  color-scheme:dark;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:2.2rem 4rem }.lecture{ display:contents }.legend svg{ width:3.2rem; height:1.2rem; overflow:visible }.fig{ margin:0; display:grid; gap:.6rem; padding-block:.4rem }.frame{ overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch;
  background:
    linear-gradient(to right, var(--paper) 30%, transparent) left center / 2rem 100% no-repeat local,
    linear-gradient(to left, var(--paper) 30%, transparent) right center / 2rem 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.22), transparent) left center / .8rem 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.22), transparent) right center / .8rem 100% no-repeat scroll;
  background-attachment:local,local,scroll,scroll }.frame > svg{ display:block; width:100%; min-width:var(--minw,0px); height:auto; margin-inline:auto; max-width:48rem }.panels{ display:flex; flex-wrap:wrap; justify-content:center; gap:1.1rem 1.8rem; overflow:visible; background:none }.panel{ flex:1 1 calc(var(--pw) * .72px); max-width:calc(var(--pw) * 1.25px); min-width:0; display:grid; gap:.3rem; align-content:start }.panel svg{ display:block; width:100%; height:auto }.fig svg text{ font-family:var(--f-sign); fill:var(--ink) }.fig svg .t{ font-size:15px }.fig svg .t-s{ font-size:13px; fill:var(--ink-2) }.fig svg .t-arrow, .fig svg .t-fun, .fig svg .t-nat, .fig svg .t-univ, .fig svg .t-alarm{ font-size:15px }.fig svg .t-arrow{ fill:var(--c-arrow) }.fig svg .t-nat{ fill:var(--c-nat) }.fig svg .t-univ{ fill:var(--c-univ) }.fig svg tspan.t-univ{ fill:var(--c-univ) }.fig svg .i, .fig svg tspan.i{ font-family:KaTeX_Math,"Times New Roman",serif; font-style:italic }.fig svg tspan.sub{ font-size:70% }.ln{ fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-width:3px }.ln-arrow{ stroke:var(--c-arrow) }.ln-nat{ stroke:var(--c-nat) }.mk-arrow{ fill:var(--c-arrow) }.mk-fun{ fill:var(--c-fun) }.mk-nat{ fill:var(--c-nat) }.mk-univ{ fill:var(--c-univ) }.mk-alarm{ fill:var(--c-alarm) }.mk-ink{ fill:var(--ink) }.mk-mute{ fill:var(--ink-2) }.mini svg{ width:100%; height:auto; display:block }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="요네다의 한 줄: 𝒞(A,A)의 항등 1_A가 FA의 원소 x로 가면, 𝒞(A,B)의 f는 자연성 때문에 Ff(x)로 갈 수밖에 없다" height="100%" role="img" viewBox="0 0 340 260" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="yon-b-m-arrow" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-arrow" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="yon-b-m-fun" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-fun" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="yon-b-m-nat" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-nat" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="yon-b-m-univ" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-univ" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="yon-b-m-alarm" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-alarm" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="yon-b-m-ink" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-ink" d="M0,0.8 L10,5 L0,9.2 z"></path></marker><marker id="yon-b-m-mute" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto" refX="8.5" refY="5" viewBox="0 0 10 10"><path class="mk mk-mute" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><path class="ln ln-arrow" d="M114.0,50.0 L226.0,50.0" marker-end="url(#yon-b-m-arrow)" style="stroke-width:3.5px"></path><text class="t-arrow i" text-anchor="middle" x="170.0" y="36.0">f ∘ −</text><path class="ln ln-arrow" d="M100.0,200.0 L240.0,200.0" marker-end="url(#yon-b-m-arrow)" style="stroke-width:3.5px"></path><text class="t-arrow i" text-anchor="middle" x="170.0" y="190.0">Ff</text><path class="ln ln-nat" d="M70.0,88.0 L70.0,178.0" marker-end="url(#yon-b-m-nat)" style="stroke-width:3.5px"></path><text class="t-nat i" text-anchor="end" x="58.0" y="132.0">α<tspan class="sub" dy="4">A</tspan></text><path class="ln ln-nat" d="M270.0,88.0 L270.0,178.0" marker-end="url(#yon-b-m-nat)" style="stroke-width:3.5px"></path><text class="t-nat i" text-anchor="start" x="282.0" y="132.0">α<tspan class="sub" dy="4">B</tspan></text><text class="t i" text-anchor="middle" x="70.0" y="56.0">𝒞(A, A)</text><text class="t i" text-anchor="middle" x="270.0" y="56.0">𝒞(A, B)</text><text class="t i" text-anchor="middle" x="70.0" y="206.0">FA</text><text class="t i" text-anchor="middle" x="270.0" y="206.0">FB</text><text class="t-univ i" text-anchor="middle" x="70.0" y="78.0">∋ 1<tspan class="sub" dy="4">A</tspan></text><text class="t-s i" text-anchor="middle" x="270.0" y="78.0">∋ f</text><text class="t-univ i" text-anchor="middle" x="70.0" y="228.0">∋ x</text><text class="t-univ i" text-anchor="middle" x="270.0" y="228.0">∋ Ff(x)</text><text class="t-univ i" text-anchor="middle" x="170.0" y="252.0">α<tspan class="sub" dy="4">B</tspan><tspan dy="-4">(f) = Ff(x)</tspan></text></svg></svg>
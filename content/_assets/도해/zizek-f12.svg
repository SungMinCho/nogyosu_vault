  linear-gradient(270deg,var(--panel) 30%,transparent) right/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent) left/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) right/.8rem 100% no-repeat scroll, var(--panel);
  padding:.6rem .4rem; }.fig svg{ display:block; width:100%; height:auto; min-width:640px; }svg text{ fill:var(--ink); font-family:var(--f-label); }.t-sm{ font-size:12px; }.t-md{ font-size:13.5px; }.t-lg{ font-size:18px; }.t-b{ font-weight:700; }.t-mute{ fill:var(--mute); }.t-sub{ fill:var(--sub); }.t-sym{ fill:var(--sym); }.t-jou{ fill:var(--jou); }.f-ink{ fill:var(--ink); }.f-ground{ fill:var(--ground); }.f-none{ fill:none; }.f-sym{ fill:var(--sym); }.f-jou{ fill:var(--jou); }.f-subt{ fill:var(--sub-t); }.f-symt{ fill:var(--sym-t); }.f-jout{ fill:var(--jou-t); }.s-ink{ stroke:var(--ink); }.s-mute{ stroke:var(--mute); }.s-sub{ stroke:var(--sub); }.s-sym{ stroke:var(--sym); }.s-jou{ stroke:var(--jou); }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="세 장면. 모차르트: 주체가 모든 걸 걸고 탄원하면 대타자가 은총으로 되돌려 준다. 바그너: 주체가 죽게 해 달라고 해도 대타자는 침묵하고 되돌아오는 화살표가 끊기며 아물지 않는 상처가 주체에 붙어 돈다. 파르지팔: 창이 상처를 내고 같은 창이 상처를 닫아 고리가 닫힌다." data-fig="f11" height="100%" role="img" style="--fw:760" viewBox="0 0 760 256" width="100%"><defs><marker id="f11-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f11-a-sym" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-sym" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f11-a-jou" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-jou" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-md t-b" text-anchor="start" x="20" y="26">모차르트 · 실재의 응답</text><circle class="f-subt s-sub" cx="70" cy="140" r="26" stroke-width="1.6"></circle><text class="t-lg t-sub" text-anchor="middle" x="70" y="146">$</text><rect class="s-sym f-symt" height="44" rx="6" stroke-width="1.4" width="84" x="160" y="118"></rect><text class="t-md t-b" 
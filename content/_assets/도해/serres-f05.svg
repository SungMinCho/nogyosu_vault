<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 410" width="880" height="410" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.fig-svg .tm, .chart .tm{ font-family:var(--f-mono); font-size:11px; }.fig-svg .halo, .chart .halo{ paint-order:stroke; stroke:var(--deep); stroke-width:4px; stroke-linejoin:round; }.s-ink{ stroke:var(--ink) }.s-ink2{ stroke:var(--ink2) }.s-rule{ stroke:var(--rule) }.s-pass{ stroke:var(--pass) }.s-order{ stroke:var(--order) }.f-none{ fill:none }.f-deep{ fill:var(--deep) }.f-land{ fill:var(--land) }.f-pass{ fill:var(--pass) }.f-pass-t{ fill:var(--pass); fill-opacity:.16 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.dash{ stroke-dasharray:5 4 }.dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }.mk-ink{ fill:var(--ink) }svg.pz-root{width:880px!important;height:410px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="왼쪽은 데카르트의 사슬로, 첫 고리와 끝 고리만 남고 가운데 고리들은 열거로 지워져 흐려진다. 가운데는 모나드 여섯이 서로 직접 영향을 주는 완전그래프로 채널이 15개, 오른쪽은 신이라는 중심 하나를 거치는 별로 채널이 6개다. 모나드가 1,000개면 499,500개 대 1,000개다." class="fig-svg pz-inner" height="100%" role="img" viewBox="0 0 880 410" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F07-ar-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="tb" text-anchor="middle" x="150" y="30">데카르트 · 고리 없는 사슬</text><text class="ts" text-anchor="middle" x="150" y="48">열거가 가운데 고리를 지운다</text><text class="tb" text-anchor="middle" x="440" y="30">서로 직접 영향</text><text class="ts" text-anchor="middle" x="440" y="48">완전그래프 · 창을 다 뚫은 세계</text><text class="tb" text-anchor="middle" x="730" y="30">중심 하나</text><text class="ts" text-anchor="middle" x="730" y="48">별 · 신이 모두를 맞춘다</text><line class="s-rule w1 dot f-none" x1="295" x2="295" y1="18" y2="300"></line><line class="s-rule w1 dot f-none" x1="585" x2="585" y1="18" y2="300"></line><ellipse class="s-ink w2 f-none" cx="52" cy="140" rx="20" ry="11"></ellipse><ellipse class="s-ink2 w15 dash f-none" cx="84" cy="140" rx="20" ry="11"></ellipse><ellipse class="s-rule w15 dot f-none" cx="116" cy="140" rx="20" ry="11"></ellipse><ellipse class="s-rule w15 dot f-none" cx="148" cy="140" rx="20" ry="11"></ellipse><ellipse class="s-rule w15 dot f-none" cx="180" cy="140" rx="20" ry="11"></ellipse><ellipse class="s-ink2 w15 dash f-none" cx="212" cy="140" rx="20" ry="11"></ellipse><ellipse class="s-ink w2 f-none" cx="244" cy="140" rx="20" ry="11"></ellipse><text class="ts" text-anchor="middle" x="148" y="116">지워진 고리들</text><text class="ts" text-anchor="middle" x="52" y="172">첫 고리</text><text class="ts" text-anchor="middle" x="244" y="172">끝 고리</text><line class="s-ink w15 f-none" marker-end="url(#F07-ar-ink)" marker-start="url(#F07-ar-ink)" x1="58" x2="238" y1="196" y2="196"></line><text class="ts halo" text-anchor="middle" x="148" y="192">거리 → 0</text><text class="tm" text-anchor="middle" x="150" y="228">0.99¹⁰ ≈ 0.904 → 0.99</text><text class="ts" text-anchor="middle" x="150" y="246">직관 하나처럼</text><line class="s-pass w1 f-none" x1="440" x2="504.086" y1="74" y2="111"></line><line class="s-pass w1 f-none" x1="440" x2="504.086" y1="74" y2="185"></line><line class="s-pass w1 f-none" x1="440" x2="440" y1="74" y2="222"></line><line class="s-pass w1 f-none" x1="440" x2="375.914" y1="74" y2="185"></line><line class="s-pass w1 f-none" x1="440" x2="375.914" y1="74" y2="111"></line><line class="s-pass w1 f-none" x1="504.086" x2="504.086" y1="111" y2="185"></line><line class="s-pass w1 f-none" x1="504.086" x2="440" y1="111" y2="222"></line><line class="s-pass w1 f-none" x1="504.086" x2="375.914" y1="111" y2="185"></line><line class="s-pass w1 f-none" x1="504.086" x2="375.914" y1="111" y2="111"></line><line class="s-pass w1 f-none" x1="504.086" x2="440" y1="185" y2="222"></line><line class="s-pass w1 f-none" x1="504.086" x2="375.914" y1="185" y2="185"></line><line class="s-pass w1 f-none" x1="504.086" x2="375.914" y1="185" y2="111"></line><line class="s-pass w1 f-none" x1="440" x2="375.914" y1="222" y2="185"></line><line class="s-pass w1 f-none" x1="440" x2="375.914" y1="222" y2="111"></line><line class="s-pass w1 f-none" x1="375.914" x2="375.914" y1="185" y2="111"></line><circle class="s-ink f-deep w15" cx="440" cy="74" r="7"></circle><circle class="s-ink f-deep w15" cx="504.086" cy="111" r="7"></circle><circle class="s-ink f-deep w15" cx="504.086" cy="185" r="7"></circle><circle class="s-ink f-deep w15" cx="440" cy="222" r="7"></circle><circle class="s-ink f-deep w15" cx="375.914" cy="185" r="7"></circle><circle class="s-ink f-deep w15" cx="375.914" cy="111" r="7"></circle><line class="s-pass w15 f-none" x1="730" x2="730" y1="148" y2="74"></line><line class="s-pass w15 f-none" x1="730" x2="794.086" y1="148" y2="111"></line><line class="s-pass w15 f-none" x1="730" x2="794.086" y1="148" y2="185"></line><line class="s-pass w15 f-none" x1="730" x2="730" y1="148" y2="222"></line><line class="s-pass w15 f-none" x1="730" x2="665.914" y1="148" y2="185"></line><line class="s-pass w15 f-none" x1="730" x2="665.914" y1="148" y2="111"></line><circle class="s-ink f-deep w15" cx="730" cy="74" r="7"></circle><circle class="s-ink f-deep w15" cx="794.086" cy="111" r="7"></circle><circle class="s-ink f-deep w15" cx="794.086" cy="185" r="7"></circle><circle class="s-ink f-deep w15" cx="730" cy="222" r="7"></circle><circle class="s-ink f-deep w15" cx="665.914" cy="185" r="7"></circle><circle class="s-ink f-deep w15" cx="665.914" cy="111" r="7"></circle><circle class="s-order f-land w2" cx="730" cy="148" r="16"></circle><text class="t" text-anchor="middle" x="730" y="153">신</text><text class="t" text-anchor="middle" x="440" y="254">채널 n(n − 1)/2 = 15</text><text class="t" text-anchor="middle" x="730" y="254">채널 n = 6</text><text class="ts" text-anchor="middle" x="440" y="274">첫째 답 · "영향"은 말뿐이라 버림</text><text class="ts" text-anchor="middle" x="730" y="274">둘째·셋째 답 · 그림은 같은 별</text><text class="ts" text-anchor="middle" x="730" y="291">기회원인론 매 순간 / 예정조화 단 한 번</text><line class="s-rule w1 f-none" x1="20" x2="860" y1="312" y2="312"></line><text class="t" text-anchor="start" x="20" y="334">n = 1,000일 때 채널 수 (막대 길이 = 실제 비율)</text><rect class="s-pass f-pass-t w1" height="16" rx="0" width="700" x="150" y="348"></rect><text class="ts" text-anchor="end" x="140" y="360">완전그래프</text><text class="tm" text-anchor="end" x="842" y="360">499,500</text><rect class="s-pass f-pass w1" height="16" rx="0" width="1.4014" x="150" y="376"></rect><text class="ts" text-anchor="end" x="140" y="388">별</text><text class="tm" text-anchor="start" x="160" y="388">1,000 — 약 500분의 1</text></svg></g></g></g></g></svg>
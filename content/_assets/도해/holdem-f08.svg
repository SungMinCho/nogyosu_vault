<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 620 196" width="620" height="196" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#F1F2EC; --paper:#FAFAF6; --soft:#E3E6DE; --tie:#B9BEB5; --stack:#C9CDC4; --grid:#DCE0D6; --rule:#CDD3CA;
  --ink:#1B2420; --ink-2:#44504A; --muted:#6E7871; --on:#FFFFFF;
  --pot:#23825A; --risk:#C0392B; --eq:#A0700F; --un:#2F5DA8; --warn:#8A4FB8;
  --eq-bg:#F3E7CC; --risk-bg:#F6DEDA;
  --f-body:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-disp:"Song Myung","Nanum Myeongjo","Noto Serif KR",serif;
  --f-num:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --f-dg:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --f-math:"Noto Sans Math","STIX Two Math","Cambria Math",math;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}}:root[data-theme="dark"]{
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:2.2rem 4rem}.lecture{display:contents}.fig{margin:.6rem 0 !important;display:grid;gap:.55rem}.fig .frame{overflow-x:auto;background:
  linear-gradient(90deg,var(--paper) 30%,transparent),linear-gradient(270deg,var(--paper) 30%,transparent),
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent),
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent) 100% 0;
  background-color:var(--paper);background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll;
  border:1px solid var(--rule);border-radius:3px;padding:.7rem}.dg{display:block;width:100%;height:auto;font-family:var(--f-dg)}.dg text{fill:var(--ink);font-size:12px}.dg text.mu{fill:var(--muted)}.dg text.b{font-weight:700}.dg .on{fill:var(--on)}.dg text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}.dg text.card{font-family:var(--f-num)}.dg .f-eq{fill:var(--eq)}.dg .f-un{fill:var(--un)}.dg circle:hover,.dg rect[class]:hover{filter:brightness(1.08)}svg.pz-root{width:620px!important;height:196px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="투시 게임: 카드로는 50 대 50이지만 균형에서 팟은 75 대 25로 갈린다. 베터의 75는 넛이 접힐 때 25, 넛이 콜을 받을 때 50에서 오고, 블러프 자체의 몫은 0이다." class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 620 196" width="100%" xmlns="http://www.w3.org/2000/svg"><text class="b" style="font-size:13px" text-anchor="start" x="12.0" y="50.0">카드(에퀴티)</text><rect class="f-eq" height="26.0" rx="0" width="209.0" x="150.0" y="34.0"><title>베터 50%</title></rect><rect class="f-un" height="26.0" rx="0" width="209.0" x="361.0" y="34.0"><title>콜러 50%</title></rect><text class="on num" style="font-size:13px;font-weight:700" text-anchor="middle" x="255.0" y="52.0">베터 50</text><text class="on num" style="font-size:13px;font-weight:700" text-anchor="middle" x="465.0" y="52.0">콜러 50</text><text class="b" style="font-size:13px" text-anchor="start" x="12.0" y="114.0">팟(실제 몫)</text><rect class="f-eq" height="26.0" rx="0" width="104.0" x="150.0" y="98.0"><title>넛 + 상대 폴드: 0.5×0.5×1 = 0.25</title></rect><rect class="f-eq" height="26.0" rx="0" width="208.0" x="256.0" y="98.0"><title>넛 + 상대 콜: 0.5×0.5×2 = 0.5</title></rect><rect class="f-un" height="26.0" rx="0" width="104.0" x="466.0" y="98.0"><title>콜러 0.25</title></rect><text class="on num" style="font-size:13px;font-weight:700" text-anchor="middle" x="202.5" y="116.0">25</text><text class="on num" style="font-size:13px;font-weight:700" text-anchor="middle" x="360.0" y="116.0">50</text><text class="on num" style="font-size:13px;font-weight:700" text-anchor="middle" x="517.5" y="116.0">25</text><text class="mu" style="font-size:11px" text-anchor="middle" x="202.5" y="142.0">넛, 상대 폴드</text><text class="mu" style="font-size:11px" text-anchor="middle" x="360.0" y="142.0">넛, 상대 콜 (팟 + 콜)</text><text class="mu" style="font-size:11px" text-anchor="middle" x="517.5" y="142.0">콜러</text><text class="mu" style="font-size:12px" text-anchor="start" x="150.0" y="176.0">블러프의 몫: 접히면 +12.5, 콜당하면 −12.5 → 0</text><text class="mu" style="font-size:12px" text-anchor="start" x="150.0" y="20.0">투시 게임 · 팟 100 · 팟 크기 베팅 · 넛 확률 ½</text></svg></g></g></g></g></svg>
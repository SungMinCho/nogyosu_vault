<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 790 300" width="790" height="300" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-spike{ fill:var(--spike) }.dg .t-pos{ fill:var(--pos) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .f-ink{ fill:var(--ink) }.dg .f-spike{ fill:var(--spike) }.dg .f-pos{ fill:var(--pos) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-spike{ fill:var(--spike-soft); stroke:var(--spike) }.dg .bx-pos{ fill:var(--pos-soft); stroke:var(--pos) }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="RMSNorm의 γ를 γ 나누기 s로 바꾸고 W에 diag(s)를 미리 곱하면, X를 s로 나누는 일이 추론 비용 없이 일어난다" class="dg" height="100%" role="img" style="" viewBox="0 0 790 300" width="100%"><defs><marker id="k6-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="k6-pos" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-pos" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="k6-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-b" text-anchor="start" x="24" y="32">원래</text><rect class="bx" height="42" rx="4" width="98" x="24" y="46"></rect><text class="t-b" text-anchor="middle" x="73" y="63">h</text><text class="t-s t-mut" text-anchor="middle" x="73" y="79">잔차 흐름</text><line class="ln" marker-end="url(#k6-ink)" x1="124" x2="145" y1="67" y2="67"></line><rect class="bx" height="42" rx="4" width="98" x="148" y="46"></rect><text class="t-b" text-anchor="middle" x="197" y="63">÷ rms</text><text class="t-s t-mut" text-anchor="middle" x="197" y="79">행(토큰)마다</text><line class="ln" marker-end="url(#k6-ink)" x1="248" x2="269" y1="67" y2="67"></line><rect class="bx" height="42" rx="4" width="98" x="272" y="46"></rect><text class="t-b" text-anchor="middle" x="321" y="63">× γ</text><text class="t-s t-mut" text-anchor="middle" x="321" y="79">열(채널)마다</text><line class="ln" marker-end="url(#k6-ink)" x1="372" x2="393" y1="67" y2="67"></line><rect class="bx-spike" height="42" rx="4" width="98" x="396" y="46"></rect><text class="t-b t-spike" text-anchor="middle" x="445" y="63">X</text><text class="t-s t-mut" text-anchor="middle" x="445" y="79">이상치 열</text><line class="ln" marker-end="url(#k6-ink)" x1="496" x2="517" y1="67" y2="67"></line><rect class="bx" height="42" rx="4" width="98" x="520" y="46"></rect><text class="t-b" text-anchor="middle" x="569" y="72">· W</text><line class="ln" marker-end="url(#k6-ink)" x1="620" x2="641" y1="67" y2="67"></line><rect class="bx" height="42" rx="4" width="98" x="644" y="46"></rect><text class="t-b" text-anchor="middle" x="693" y="72">Y</text><text class="t-b t-pos" text-anchor="start" x="24" y="142">옮긴 뒤</text><rect class="bx" height="42" rx="4" width="98" x="24" y="156"></rect><text class="t-b" text-anchor="middle" x="73" y="173">h</text><text class="t-s t-mut" text-anchor="middle" x="73" y="189">잔차 흐름</text><line class="ln" marker-end="url(#k6-ink)" x1="124" x2="145" y1="177" y2="177"></line><rect class="bx" height="42" rx="4" width="98" x="148" y="156"></rect><text class="t-b" text-anchor="middle" x="197" y="173">÷ rms</text><text class="t-s t-mut" text-anchor="middle" x="197" y="189">행(토큰)마다</text><line class="ln" marker-end="url(#k6-ink)" x1="248" x2="269" y1="177" y2="177"></line><rect class="bx-pos" height="42" rx="4" width="98" x="272" y="156"></rect><text class="t-b t-pos" text-anchor="middle" x="321" y="173">× γ ⊘ s</text><text class="t-s t-mut" text-anchor="middle" x="321" y="189">숫자 D개만 고침</text><line class="ln" marker-end="url(#k6-ink)" x1="372" x2="393" y1="177" y2="177"></line><rect class="bx-pos" height="42" rx="4" width="98" x="396" y="156"></rect><text class="t-b t-pos" text-anchor="middle" x="445" y="173">X ⊘ s</text><text class="t-s t-mut" text-anchor="middle" x="445" y="189">평평</text><line class="ln" marker-end="url(#k6-ink)" x1="496" x2="517" y1="177" y2="177"></line><rect class="bx-pos" height="42" rx="4" width="98" x="520" y="156"></rect><text class="t-b t-pos" text-anchor="middle" x="569" y="173">· diag(s)·W</text><text class="t-s t-mut" text-anchor="middle" x="569" y="189">미리 곱함</text><line class="ln" marker-end="url(#k6-ink)" x1="620" x2="641" y1="177" y2="177"></line><rect class="bx" height="42" rx="4" width="98" x="644" y="156"></rect><text class="t-b" text-anchor="middle" x="693" y="173">Y</text><text class="t-s t-mut" text-anchor="middle" x="693" y="189">똑같다</text><text class="t-s t-pos" text-anchor="start" x="24" y="236">고치는 것은 γ의 숫자 D개와 가중치 한 번 — 모두 오프라인이라 추론 비용은 0.</text><rect class="bx-spike" height="34" rx="4" width="560" x="24" y="250"></rect><text class="t-s t-spike" text-anchor="start" x="36" y="271">앞이 SiLU·GELU 같은 비선형 f라면: f(u) ⊘ s ≠ f(u ⊘ s) — 나눗셈을 흡수할 자리가 없다.</text></svg></svg>
  background-position:left center,right center,left center,right center; background-repeat:no-repeat;
  background-size:20px 100%,20px 100%,10px 100%,10px 100%; background-attachment:local,local,scroll,scroll }.fig-frame svg{ display:block; width:100%; min-width:540px; height:auto; padding:.4rem }.dg{ font-family:var(--f-diag); font-size:12px }.dg text{ fill:var(--ink) }.dg .t-ink{ fill:var(--ink) }.dg .t-ink2{ fill:var(--ink-2) }.dg .t-ink3{ fill:var(--ink-3) }.dg .t-step{ fill:var(--step) }.dg .t-sig{ fill:var(--sig) }.dg .t-fix{ fill:var(--fix) }.dg line, .dg polyline, .dg path, .dg ellipse{ fill:none }.dg .s-ink2{ stroke:var(--ink-2) }.dg .s-step{ stroke:var(--step) }.dg .s-fix{ stroke:var(--fix) }.dg .f-sig{ fill:var(--sig) }.dg .f-step-soft{ fill:var(--step-soft) }.dg .f-fix-soft{ fill:var(--fix-soft) }.dg .ring{ stroke:var(--panel); stroke-width:2px }.dg .mk-ink{ fill:var(--ink) }.dg .mk-ink2{ fill:var(--ink-2) }.dg .mk-step{ fill:var(--step) }.dg .mk-sig{ fill:var(--sig) }.dg .mk-tooth{ fill:var(--tooth) }.dg .mk-fix{ fill:var(--fix) }svg.pz-root{width:640px!important;height:236px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig wide"><g class="pz-w fig-frame"><svg xmlns="http://www.w3.org/2000/svg" 
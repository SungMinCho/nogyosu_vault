<!-- A. 짧은 노출 -->
<text class="t-b" x="16" y="214">짧은 노출</text>
<text class="t-s t-m" x="16" y="230">100ms 뒤 차폐</text>
<text class="t-s t-m" x="16" y="245">역치 아래</text>
<rect class="f-ink2" height="16" width="80" x="140" y="202"></rect>

play:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w figscroll"><svg aria-label="따옴표 안과 바깥 — 같은 인상도 지금으로 붙잡으면 ‘이다’, 재생으로 붙잡으면 ‘이었다’: 시제는 지금과의 관계다" class="pz-inner" height="100%" role="img" viewBox="0 0 480 270" width="100%" xmlns="http://www.w3.org/2000/svg">

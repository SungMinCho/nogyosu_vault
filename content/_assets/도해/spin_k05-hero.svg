  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.doc > .masthead, .doc > .toc, .doc > .colophon{ max-width:var(--shell) }.masthead{ display:grid; grid-template-columns:minmax(0,1fr); gap:1.4rem; padding-block:1.2rem .6rem; border-bottom:1px solid var(--line) }@media (min-width:52em){.masthead{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:end }}.mast-fig{ min-width:0 }.hero-svg{ max-width:26rem; margin-inline:auto }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .dot-q{ fill:var(--paper); stroke:var(--ink); stroke-width:1.4 }.dg .dot-rt{ fill:var(--rot); stroke:var(--paper); stroke-width:1.5 }.dg .ring{ fill:none; stroke:var(--muted); stroke-width:1.1; stroke-dasharray:4 3 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="회전 행렬들의 곡면을 나타내는 원 위에서 무작위 회전에서 출발해 작은 걸음으로 원을 따라 학습된 회전까지 걸어가는 점들" class="dg hero-svg" height="100%" role="img" viewBox="0 0 300 180" width="100%"><circle class="ring" cx="120" cy="92" r="74"></circle><circle class="dot-q" cx="55.9" cy="55.0" r="3.5"></circle><path class="ln ln-rot" d="M 55.9 55.0 A 74 74 0 0 1 74.4 33.7"></path><circle class="dot-q" cx="74.4" cy="33.7" r="4.1"></circle><path class="ln ln-rot" d="M 74.4 33.7 A 74 74 0 0 1 97.1 21.6"></path><circle class="dot-q" cx="97.1" cy="21.6" r="4.7"></circle><path class="ln ln-rot" d="M 97.1 21.6 A 74 74 0 0 1 117.4 18.0"></path><circle class="dot-q" cx="117.4" cy="18.0" r="5.3"></circle><path class="ln ln-rot" d="M 117.4 18.0 A 74 74 0 0 1 132.8 19.1"></path><circle class="dot-q" cx="132.8" cy="19.1" r="5.9"></circle><path class="ln ln-rot" d="M 132.8 19.1 A 74 74 0 0 1 144.1 22.0"></path><circle class="dot-q" cx="144.1" cy="22.0" r="6.5"></circle><path class="ln ln-rot" d="M 144.1 22.0 A 74 74 0 0 1 151.3 24.9"></path><circle class="dot-rt" cx="151.3" cy="24.9" r="7.1"></circle><text class="t-s t-b" text-anchor="end" x="49.9141" y="47">R₀ 무작위</text><text class="t-s t-b t-rot" text-anchor="start" x="161.274" y="18.9332">학습된 R</text><text class="t-s t-mut" text-anchor="middle" x="120" y="98">회전들의</text><text class="t-s t-mut" text-anchor="middle" x="120" y="114">곡면</text></svg></svg>
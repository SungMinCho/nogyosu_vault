<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 258" width="720" height="258" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-s{ font-size:11.5px }.fig .t-l{ font-size:16px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-blood{ fill:var(--blood) }.fig .s-ink{ stroke:var(--ink) }.fig .s-rule{ stroke:var(--rule) }.fig .s-zero{ stroke:var(--zero) }.fig .s-ledger{ stroke:var(--ledger) }.fig .w2{ stroke-width:2 }.fig .w3{ stroke-width:3 }.fig .dash{ stroke-dasharray:5 4 }svg.pz-root{width:720px!important;height:258px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="끝에는 두 뜻이 있다. 칸트가 목적(텔로스)을 무한히 멀리 두자 종말(테르미누스)은 무한히 밀려나야 했고, 니체 이후 끝은 바깥이 아니라 안에서 온다." class="pz-inner" height="100%" role="img" style="--minw:662px" viewBox="0 0 720 258" width="100%"><defs><marker id="ends-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="ends-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="ends-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="ends-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="ends-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="ends-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><text class="t-b f-ledger" x="20" y="28">칸트 — 그리고 우리의 '진보'</text><line class="s-ledger w2" x1="40" x2="590" y1="82" y2="82"></line><line class="s-ledger w2 dash" x1="590" x2="668" y1="82" y2="82"></line><text class="t-l t-b f-ledger" text-anchor="middle" x="684" y="89">∞</text><text class="t-s f-ledger" text-anchor="end" x="700" y="60">텔로스 · 신성함 — 무한히 먼 목적</text><circle class="f-ink" cx="200" cy="82" r="6"></circle><line class="s-ink w2" marker-end="url(#ends-ink)" x1="210" x2="252" y1="82" y2="82"></line><text class="t-s" text-anchor="middle" x="200" y="108">걷는 자 — 도중에 끝나면 안 된다</text><text class="t-s f-mute" text-anchor="middle" x="200" y="125">→ 영혼 불멸의 '요청'</text><text class="t-s f-mute" x="420" y="118">종말(테르미누스)은 무한히 뒤로 밀린다</text><line class="s-rule" x1="20" x2="700" y1="146" y2="146"></line><text class="t-b f-zero" x="20" y="176">니체 이후 — 랜드</text><line class="s-ink w2" x1="40" x2="466" y1="218" y2="218"></line><circle class="f-ink" cx="200" cy="218" r="6"></circle><line class="s-zero w3" x1="472" x2="472" y1="194" y2="242"></line><text class="t-s t-b f-zero" x="486" y="214">테르미누스 — 안에서 오는 끝장</text><text class="t-s f-mute" x="486" y="232">텔로스 없음 → 역사는 유산된다</text></svg></g></g></g></g></svg>
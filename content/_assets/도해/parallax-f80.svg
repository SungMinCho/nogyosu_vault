<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 420" width="640" height="420" class="pz-root"><style>:root{
  --bg:#E6E9EC; --bg2:#DCE0E4; --bg3:#F1F3F4;
  --fg:#15181D; --mute:#5B626B; --rule:#B6BDC4; --faint:#CDD2D7;
  --star:#33409C; --sun:#A2560F; --moon:#24695D; --gap:#C42A1B; --fix:#8C2C80;
  --f-display:"Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR",serif;
  --f-body:"Literata","Nanum Myeongjo","Noto Serif KR","Noto Serif CJK KR",Georgia,serif;
  --f-label:"IBM Plex Sans KR","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  --f-mono:"Spline Sans Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F13; --bg2:#151920; --bg3:#1B2029;
  --fg:#E3E6EA; --mute:#9AA2AC; --rule:#343B45; --faint:#262C35;
  --star:#A3ACFF; --sun:#F0A24C; --moon:#6CC6B1; --gap:#FF6B5B; --fix:#E68BD8;
  color-scheme:dark }}:root[data-theme="dark"]{
  --bg:#0D0F13; --bg2:#151920; --bg3:#1B2029;
  --fg:#E3E6EA; --mute:#9AA2AC; --rule:#343B45; --faint:#262C35;
  --star:#A3ACFF; --sun:#F0A24C; --moon:#6CC6B1; --gap:#FF6B5B; --fix:#E68BD8;
  color-scheme:dark }:root{ --pad:max(16px, env(safe-area-inset-left, 0px)); --padR:max(16px, env(safe-area-inset-right, 0px));
  --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + 4rem); }@media (min-width:34em){:root{ --pad:max(1.6rem, env(safe-area-inset-left, 0px)); --padR:max(1.6rem, env(safe-area-inset-right, 0px)) }}@media (min-width:52em){:root{ --pad:max(2rem, env(safe-area-inset-left, 0px)); --padR:max(2rem, env(safe-area-inset-right, 0px)) }}.plate svg{display:block;width:100%;height:auto}.plate .lstar circle.core{stroke:none}.plate .lstar text{font-family:var(--f-mono);font-size:12px;font-weight:500}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.3rem;padding:0 var(--padR) 0 var(--pad);margin:3rem 0 0}.lecture{display:contents}.lhead,.fig{scroll-margin-top:1rem}figure.fig{margin:.6rem 0 !important;padding:0}.fig .frame{border:1px solid var(--rule);background:var(--bg3);padding:1rem;overflow-x:auto;
  background-image:linear-gradient(to right,var(--bg3) 30%,transparent),linear-gradient(to left,var(--bg3) 30%,transparent),
  linear-gradient(to right,rgba(0,0,0,.12),transparent),linear-gradient(to left,rgba(0,0,0,.12),transparent);
  background-position:left center,right center,left center,right center;background-repeat:no-repeat;
  background-size:2rem 100%,2rem 100%,.8rem 100%,.8rem 100%;background-attachment:local,local,scroll,scroll}.fig .frame.wide svg{min-width:34rem}.fig svg{display:block;width:100%;height:auto;overflow:visible}.s-ink{stroke:var(--fg)}.s-mute{stroke:var(--mute)}.s-star{stroke:var(--star)}.s-sun{stroke:var(--sun)}.s-moon{stroke:var(--moon)}.s-gap{stroke:var(--gap)}.fig svg .w-thin{stroke-width:.8}.fig svg .w-bold{stroke-width:2.4}.fig svg .dash{stroke-dasharray:5 4}.f-ink{fill:var(--fg)}.f-mute{fill:var(--mute)}.f-gap{fill:var(--gap)}.f-bg2{fill:var(--bg2)}.fig svg text{fill:var(--fg);font-family:var(--f-label);font-size:13px;stroke:none}.fig svg .t-small{font-size:11px;fill:var(--mute)}.fig svg .c-star{fill:var(--star)}.fig svg .c-sun{fill:var(--sun)}.fig svg .c-moon{fill:var(--moon)}.fig svg .a-mid{text-anchor:middle}svg.pz-root{width:640px!important;height:420px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="간극의 이주: 두 관점 사이에 있던 빨간 틈이 대상 안으로, 신 안으로, 뇌 안으로, 사회적 유대 안으로 옮겨 가다가 마지막에 '무언가와 무 사이'의 최소 차이로 줄어든다" class="pz-inner" height="100%" role="img" viewBox="0 0 640 420" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah-1601" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0 0L10 5L0 10Z"></path></marker></defs>
<text class="t-small" x="16" y="22">빨강 = 같은 간극. 강을 지날 때마다 그것이 놓인 자리가 바뀐다</text>
<rect class="s-mute f-bg2 w-thin" height="160" width="190" x="16" y="36"></rect>
<text class="t-lab" x="26" y="58">① 두 관점 사이</text>
<text class="t-small" x="26" y="76">1강 · 서론</text>
<circle class="s-ink" cx="72" cy="132" r="26"></circle>
<circle class="s-ink" cx="150" cy="132" r="26"></circle>
<line class="s-gap w-bold dash" x1="111" x2="111" y1="104" y2="160"></line>
<text class="t-small a-mid" x="111" y="186">공통 지반 없음</text>
<rect class="s-mute f-bg2 w-thin" height="160" width="190" x="225" y="36"></rect>
<text class="t-lab c-star" x="235" y="58">② 대상 안</text>
<text class="t-small" x="235" y="76">2–3강 · 최소 차이 = 주체</text>
<circle class="s-star" cx="320" cy="132" r="36"></circle>
<circle class="f-gap" cx="334" cy="124" r="8"></circle>
<text class="t-small a-mid" x="320" y="186">관측자의 자리가 얼룩으로</text>
<rect class="s-mute f-bg2 w-thin" height="160" width="190" x="434" y="36"></rect>
<text class="t-lab c-star" x="444" y="58">③ 신 안</text>
<text class="t-small" x="444" y="76">4–6강 · 유물론적 신학</text>
<rect class="s-star" height="64" width="80" x="489" y="98"></rect>
<line class="s-gap w-bold" x1="529" x2="529" y1="98" y2="162"></line>
<text class="t-small a-mid" x="529" y="186">신이 자기와 어긋난다</text>
<line class="s-mute" marker-end="url(#ah-1601)" x1="206" x2="222" y1="116" y2="116"></line>
<line class="s-mute" marker-end="url(#ah-1601)" x1="415" x2="431" y1="116" y2="116"></line>
<path class="s-mute" d="M529 198 V210 H111 V222" marker-end="url(#ah-1601)"></path>
<rect class="s-mute f-bg2 w-thin" height="160" width="190" x="16" y="226"></rect>
<text class="t-lab c-sun" x="26" y="248">④ 자연·뇌 안</text>
<text class="t-small" x="26" y="266">7–10강 · 자유의 고리</text>
<path class="s-sun w-bold" d="M111 290 A34 34 0 1 1 82 307"></path>
<path class="s-sun w-bold" d="M82 307 L92 316"></path>
<path class="s-gap w-bold" d="M86 300 L76 314"></path>
<text class="t-small a-mid" x="111" y="376">고리를 끊는 '아니' = 자유</text>
<rect class="s-mute f-bg2 w-thin" height="160" width="190" x="225" y="226"></rect>
<text class="t-lab c-moon" x="235" y="248">⑤ 사회적 유대 안</text>
<text class="t-small" x="235" y="266">11–13강 · 대상 a의 정치</text>
<rect class="s-moon" height="66" width="40" x="255" y="284"></rect>
<rect class="s-moon" height="66" width="40" x="300" y="284"></rect>
<rect class="s-moon" height="66" width="40" x="345" y="284"></rect>
<line class="s-gap w-bold" x1="248" x2="392" y1="350" y2="284"></line>
<text class="t-small a-mid" x="320" y="376">모든 집단을 안에서 가르는 금</text>
<rect class="s-mute f-bg2 w-thin" height="160" width="190" x="434" y="226"></rect>
<text class="t-lab c-moon" x="444" y="248">⑥ 무언가와 무 사이</text>
<text class="t-small" x="444" y="266">14–15강 · 바틀비</text>
<rect class="f-ink" height="54" width="54" x="470" y="292"></rect>
<rect class="s-ink dash" height="54" width="54" x="534" y="292"></rect>
<line class="s-gap w-bold" x1="529" x2="529" y1="286" y2="352"></line>
<text class="t-small a-mid" x="497" y="364">체제</text>
<text class="t-small a-mid" x="561" y="364">무</text>
<text class="t-small a-mid" x="529" y="380">가장 작은 간극</text>
<line class="s-mute" marker-end="url(#ah-1601)" x1="206" x2="222" y1="306" y2="306"></line>
<line class="s-mute" marker-end="url(#ah-1601)" x1="415" x2="431" y1="306" y2="306"></line>
<text class="t-small" x="16" y="410">⑥의 꼴은 ①로 돌아가지 않고 1부의 존재론적 차이(존재자 | 존재)와 겹친다</text>
</svg></g></g></g></g></svg>
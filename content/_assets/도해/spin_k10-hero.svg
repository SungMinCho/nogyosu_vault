<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 152" width="260" height="152" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.doc > .masthead, .doc > .toc, .doc > .colophon{ max-width:var(--shell) }.masthead{ display:grid; grid-template-columns:minmax(0,1fr); gap:1.4rem; padding-block:1.2rem .6rem; border-bottom:1px solid var(--line) }@media (min-width:52em){.masthead{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:end }}.mast-fig{ min-width:0 }.hero-svg{ max-width:26rem; margin-inline:auto }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-doubt{ fill:var(--doubt) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-spike{ stroke:var(--spike) }.dg .ln-pos{ stroke:var(--pos) }.dg .ln-grid{ stroke:var(--grid) }.dg .thick{ stroke-width:2.4 }.dg .ln-ink{ stroke:var(--ink) }.dg .bx-doubt{ fill:var(--doubt-soft); stroke:var(--doubt) }svg.pz-root{width:260px!important;height:152px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w masthead"><g class="pz-w mast-fig"><svg xmlns="http://www.w3.org/2000/svg" aria-label="다섯 가닥의 선이 하나의 매듭으로 모이고, 그 아래 물음표 아홉 개가 놓여 있다" class="dg hero-svg pz-inner" height="100%" role="img" viewBox="0 0 260 152" width="100%"><path class="ln ln-rot thick" d="M8,14 C70,14 110,52 160,46"></path><path class="ln ln-pos thick" d="M8,30 C70,30 110,52 160,46"></path><path class="ln ln-grid thick" d="M8,46 C70,46 110,52 160,46"></path><path class="ln ln-spike thick" d="M8,62 C70,62 110,52 160,46"></path><path class="ln ln-ink thick" d="M8,78 C70,78 110,52 160,46"></path><circle class="bx-doubt" cx="162" cy="46" r="7"></circle><line class="ln ln-ink thick" x1="170" x2="252" y1="46" y2="46"></line><text class="t-s t-b" text-anchor="middle" x="210" y="36">다섯 가닥</text><circle class="bx-doubt" cx="18" cy="118" r="10"></circle><text class="t-s t-b t-doubt" text-anchor="middle" x="18" y="122.5">?</text><circle class="bx-doubt" cx="45" cy="118" r="10"></circle><text class="t-s t-b t-doubt" text-anchor="middle" x="45" y="122.5">?</text><circle class="bx-doubt" cx="72" cy="118" r="10"></circle><text class="t-s t-b t-doubt" text-anchor="middle" x="72" y="122.5">?</text><circle class="bx-doubt" cx="99" cy="118" r="10"></circle><text class="t-s t-b t-doubt" text-anchor="middle" x="99" y="122.5">?</text><circle class="bx-doubt" cx="126" cy="118" r="10"></circle><text class="t-s t-b t-doubt" text-anchor="middle" x="126" y="122.5">?</text><circle class="bx-doubt" cx="153" cy="118" r="10"></circle><text class="t-s t-b t-doubt" text-anchor="middle" x="153" y="122.5">?</text><circle class="bx-doubt" cx="180" cy="118" r="10"></circle><text class="t-s t-b t-doubt" text-anchor="middle" x="180" y="122.5">?</text><circle class="bx-doubt" cx="207" cy="118" r="10"></circle><text class="t-s t-b t-doubt" text-anchor="middle" x="207" y="122.5">?</text><circle class="bx-doubt" cx="234" cy="118" r="10"></circle><text class="t-s t-b t-doubt" text-anchor="middle" x="234" y="122.5">?</text><text class="t-s t-mut" text-anchor="middle" x="130" y="146">아홉 의심 — 그리고 내 실험의 설계도</text></svg></g></g></g></svg>
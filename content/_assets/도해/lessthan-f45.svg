<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 420" width="860" height="420" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#ECEAF0; --panel:#F7F6F9; --ink:#1D1A26; --muted:#5B5668; --rule:#C9C5D2; --rule-2:#DCD9E2;
  --red:#B42318;   --red-fill:#F3D3CE;
  --flesh:#995532; --flesh-fill:#ECCFBC;
  --cob:#2B4A9B;   --cob-fill:#D3DBF1;
  --verd:#1F6F62;  --verd-fill:#CDE7E1;
  --void:#17141F;  --on-void:#F2EEF7;
  --display-ko:"Hahmlet","Noto Serif KR","Noto Serif CJK KR",serif;
  --body:"Noto Serif KR","Noto Serif CJK KR","Apple SD Gothic Neo",serif;
  --display-la:"GFS Didot","Didot","Bodoni 72","Noto Serif",serif;
  --sans:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"Red Hat Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR",ui-monospace,monospace;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#14121A; --panel:#1C1925; --ink:#E8E4EF; --muted:#A39DB0; --rule:#3A3546; --rule-2:#2A2633;
  --red:#F06A5C;   --red-fill:#4A1F1C;
  --flesh:#E0A07E; --flesh-fill:#4A3428;
  --cob:#93ABEC;   --cob-fill:#22304F;
  --verd:#5EC4B0;  --verd-fill:#173A35;
  --void:#040306;  --on-void:#E8E4EF;
  color-scheme:dark; }svg.fig{display:block;width:100%;height:auto;font-family:var(--sans);overflow:visible}svg.fig text{font-family:var(--sans);font-size:14px;fill:var(--ink)}svg.fig .t-s{font-size:12px}svg.fig .t-l{font-size:17px}svg.fig .t-b{font-weight:700}svg.fig .t-la{font-family:var(--display-la)}svg.fig .t-it{font-style:italic}svg.fig .t-mid{text-anchor:middle}svg.fig .t-end{text-anchor:end}svg.fig .t-muted{fill:var(--muted)}svg.fig .f-ink{fill:var(--ink)}svg.fig .f-rule2{fill:var(--rule-2)}svg.fig .f-flesh{fill:var(--flesh)}svg.fig .f-void{fill:var(--void)}svg.fig .f-onvoid{fill:var(--on-void)}svg.fig .f-none{fill:none}svg.fig .s-ink{stroke:var(--ink)}svg.fig .s-muted{stroke:var(--muted)}svg.fig .s-rule{stroke:var(--rule)}svg.fig .s-panel{stroke:var(--panel)}svg.fig .s-flesh{stroke:var(--flesh)}svg.fig .w1{stroke-width:1px}svg.fig .w15{stroke-width:1.5px}svg.fig .w2{stroke-width:2px}svg.fig .w3{stroke-width:3px}svg.fig .dot{stroke-dasharray:1.5 4;stroke-linecap:round}svg.fig .round{stroke-linecap:round;stroke-linejoin:round}:root{ --pad:1.15rem; --measure:39rem; --wide:52rem; --shell:calc(var(--wide) + var(--pad)*2); }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.hero-fig svg{max-width:560px;margin-inline:auto}.doc{padding-inline:var(--pad)}.lecture{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.15rem;padding-block:2.5rem 3rem;
  content-visibility:auto;border-top:1px solid var(--rule)}.fig-wrap{margin:.8rem 0 !important}.fig-scroll{overflow-x:auto;background:
  linear-gradient(to right,var(--panel) 30%,transparent) left center/2.2rem 100% no-repeat local,
  linear-gradient(to left,var(--panel) 30%,transparent) right center/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) left center/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 22%,transparent),transparent) right center/.8rem 100% no-repeat scroll,
  var(--panel);padding:1rem .9rem .6rem}.fig-inner{width:100%}svg.pz-root{width:860px!important;height:420px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig-wrap"><g class="pz-w fig-scroll"><g class="pz-w fig-inner"><svg xmlns="http://www.w3.org/2000/svg" aria-label="브라시에의 죽음충동은 존재하는 것을 0, 곧 무의 공백으로 되돌려 거기서 멈추게 하는 화살이고, 라캉의 죽음충동은 0에 닿지조차 못한 채 공백 둘레를 영원히 도는 언데드의 원이다. 궁극의 선택은 무(멸종)와 무보다 적은 것(그래도 그것은 움직인다) 사이에 있다." class="fig pz-inner" height="100%" role="img" viewBox="0 0 860 420" width="100%">
<defs>
<marker id="L15-3-ar-ink" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="L15-3-ar-flesh" markerHeight="11" markerUnits="userSpaceOnUse" markerWidth="11" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-flesh" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 0 아래: 무보다 적은 자리 -->
<rect class="f-rule2" height="180" width="800" x="30" y="120"></rect>

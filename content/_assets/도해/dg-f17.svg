}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),

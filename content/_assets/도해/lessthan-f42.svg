</defs>
<!-- 존재론적 순서 축 -->
<line class="s-muted w15" marker-end="url(#L14-3-ar-muted)" x1="22" x2="22" y1="330" y2="104"></line>
<text class="t-mid t-s t-muted" x="22" y="350">먼저</text>
<text class="t-mid t-s t-muted" x="22" y="92">나중</text>
<line class="s-rule w1 dash" x1="296" x2="296" y1="24" y2="400"></line>
<line class="s-rule w1 dash" x1="586" x2="586" y1="24" y2="400"></line>
<!-- 셸링 -->
<text class="t-mid t-l t-b" x="160" y="36">셸링</text>
<text class="t-mid t-s t-muted" x="160" y="58">선이 먼저, 악은 대립 속에서만</text>
<rect class="f-cobf s-cob w2" height="36" rx="6" width="150" x="120" y="98"></rect>
<text class="t-mid t-b f-cob" x="195" y="121">선의 계시 · 전능</text>
<path class="f-redf s-red w15 round" d="M60,186 L74,176 L82,190 L96,174 L106,190 L120,178 L130,194 L124,212 L108,206 L96,220 L84,206 L70,216 L58,204 z"></path>
<text class="t-mid t-b f-red" x="94" y="200">악</text>
<text class="t-s t-b f-red" x="146" y="196">비본질</text>
<text class="t-s t-muted" x="146" y="212">대립 속에서만 실재</text>
<text class="t-s t-muted" x="146" y="228">전능을 돋보일 들러리</text>
<path class="f-none s-ink w15" d="M94,288 L94,226" marker-end="url(#L14-3-ar-ink)"></path>

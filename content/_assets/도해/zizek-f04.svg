  radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) right/.8rem 100% no-repeat scroll, var(--panel);
  padding:.6rem .4rem; }.fig svg{ display:block; width:100%; height:auto; min-width:640px; }svg text{ fill:var(--ink); font-family:var(--f-label); }.t-sm{ font-size:12px; }.t-md{ font-size:13.5px; }.t-b{ font-weight:700; }.t-mute{ fill:var(--mute); }.t-sub{ fill:var(--sub); }.t-sym{ fill:var(--sym); }.t-jou{ fill:var(--jou); }.f-ground{ fill:var(--ground); }.f-panel{ fill:var(--panel); }.f-sym{ fill:var(--sym); }.f-subt{ fill:var(--sub-t); }.f-symt{ fill:var(--sym-t); }.f-jout{ fill:var(--jou-t); }.s-ink{ stroke:var(--ink); }.s-mute{ stroke:var(--mute); }.s-sub{ stroke:var(--sub); }.s-sym{ stroke:var(--sym); }.s-jou{ stroke:var(--jou); }.fig-scroll .f-panel{ fill:var(--ground); }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="왼쪽: 상품들의 등가 계열에서 금이 빠져나와 모든 상품의 가치를 재는 일반적 등가물이 되고, 계열 안의 제 자리는 비어 있다. 오른쪽: 임금 3실링으로 산 노동력이 12시간 동안 6실링의 가치를 보태 3실링의 잉여를 낳는다." data-fig="f03" height="100%" role="img" style="--fw:760" viewBox="0 0 760 284" width="100%"><defs><marker id="f03-a-sym" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-sym" d="M0,0 L10,5 L0,10 z"></path></marker><pattern height="6" id="f03-h" patternTransform="rotate(45)" patternUnits="userSpaceOnUse" width="6"><rect class="f-jout" height="6" width="6"></rect><line class="s-jou" stroke-width="2" x1="0" x2="0" y1="0" y2="6"></line></pattern></defs><text class="t-sm t-mute" text-anchor="start" x="20" y="24">가치형태 — 계열에서 빠져나온 보편자</text><rect class="s-ink f-panel" height="28" rx="6" stroke-width="1.4" width="52" x="20" y="196"></rect><text class="t-sm" text-anchor="middle" x="46.0" y="214.5">아마포</text><rect class="s-ink f-panel" height="28" rx="6" stroke-width="1.4" width="52" x="80" y="196"></rect><text class="t-sm" text-anchor="middle" x="106.0" y="214.5">저고리</text><rect class="s-ink f-panel" height="28" rx="6" stroke-width="1.4" width="52" x="140" y="196"></rect><text 
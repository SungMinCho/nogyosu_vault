<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 300" width="760" height="300" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#EEEDF1; --paper-2:#E2E1E8; --ink:#1C1A25; --ink-2:#575465; --rule:#C9C7D3;
  --sun:#8A5300; --sun-hi:#DA9B1E; --sun-soft:#F3DEB0;
  --zero:#3B3896; --zero-soft:#D7D5F1;
  --ledger:#21654D; --ledger-soft:#CFE4DA;
  --blood:#A11F3A; --blood-soft:#F2D2D9;
  --eclipse:#1C1A25; --shadow:rgba(28,26,37,.22);
  --f-display:"Song Myung","Nanum Myeongjo","Noto Serif KR","AppleMyungjo",serif;
  --f-body:"Gowun Batang","Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }}:root[data-theme="dark"]{
  --paper:#121119; --paper-2:#1B1A24; --ink:#E7E4EE; --ink-2:#A6A2B5; --rule:#353240;
  --sun:#EDB24F; --sun-hi:#E3A43A; --sun-soft:#3F2F12;
  --zero:#ADA9FF; --zero-soft:#272552;
  --ledger:#72CFA8; --ledger-soft:#17362A;
  --blood:#F5809A; --blood-soft:#471925;
  --eclipse:#06050A; --shadow:rgba(0,0,0,.6); color-scheme:dark }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem;
  padding-inline:var(--pad); padding-block:0 4rem }.lecture{ display:contents }.fig{ display:grid; gap:.55rem; margin-block:.7rem }.fig .frame{ overflow-x:auto; border-radius:6px; padding:1rem 1rem .9rem;
  background:
    linear-gradient(to right,var(--paper-2) 30%,transparent) left center/2.4rem 100% no-repeat,
    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-eclipse{ fill:var(--eclipse) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-none{ fill:none }.fig .f-frame{ fill:var(--paper-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-blood{ fill:var(--blood) }.fig .s-ink{ stroke:var(--ink) }.fig .s-rule{ stroke:var(--rule) }.fig .s-sun{ stroke:var(--sun) }.fig .s-sunhi{ stroke:var(--sun-hi) }.fig .s-blood{ stroke:var(--blood) }.fig .w15{ stroke-width:1.5 }.fig .w2{ stroke-width:2 }.fig .w3{ stroke-width:3 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="넘침의 출구가 바깥 전쟁에서 막히자 같은 넘침이 요새 안으로 말려들었다. 랜드가 질 드 레를 읽는 경제적 구조다." height="100%" role="img" style="--minw:699px" viewBox="0 0 760 300" width="100%"><defs><marker id="fortress-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="fortress-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="fortress-sun" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-sun" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="fortress-zero" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-zero" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="fortress-ledger" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ledger" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="fortress-blood" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-blood" d="M0,0.6 L10,5 L0,9.4 z"></path></marker></defs><line class="s-rule" x1="380" x2="380" y1="16" y2="284"></line><text class="t-b" x="20" y="28">봉건 — 출구는 바깥 전쟁</text><rect class="f-frame s-ink w2" height="72" rx="1" width="72" x="114" y="114"></rect><rect class="f-frame s-ink w15" height="16" rx="1" width="16" x="106" y="106"></rect><rect class="f-frame s-ink w15" height="16" rx="1" width="16" x="106" y="178"></rect><rect class="f-frame s-ink w15" height="16" rx="1" width="16" x="178" y="106"></rect><rect class="f-frame s-ink w15" height="16" rx="1" width="16" x="178" y="178"></rect><text class="t-s f-sun" x="24" y="100">농민의 넘치는 생산</text><line class="s-sun w15" marker-end="url(#fortress-sun)" x1="30" x2="104" y1="150" y2="150"></line><line class="s-sun w15" marker-end="url(#fortress-sun)" x1="52" x2="112" y1="232" y2="184"></line><line class="s-blood w3" marker-end="url(#fortress-blood)" x1="196" x2="350" y1="150" y2="150"></line><text class="t-s t-b f-blood" text-anchor="middle" x="272" y="136">전장 — 밖의 구경거리</text><text class="t-s f-mute" text-anchor="middle" x="272" y="172">모두가 보는 낭비</text><text class="t-b" x="398" y="28">합리화 이후 — 출구가 막힘</text><rect class="f-frame s-ink w2" height="72" rx="1" width="72" x="494" y="114"></rect><rect class="f-frame s-ink w15" height="16" rx="1" width="16" x="486" y="106"></rect><rect class="f-frame s-ink w15" height="16" rx="1" width="16" x="486" y="178"></rect><rect class="f-frame s-ink w15" height="16" rx="1" width="16" x="558" y="106"></rect><rect class="f-frame s-ink w15" height="16" rx="1" width="16" x="558" y="178"></rect><text class="t-s f-sun" x="404" y="100">같은 넘침</text><line class="s-sun w15" marker-end="url(#fortress-sun)" x1="408" x2="484" y1="150" y2="150"></line><line class="s-sun w15" marker-end="url(#fortress-sun)" x1="430" x2="492" y1="232" y2="184"></line><line class="s-blood w3" x1="576" x2="640" y1="150" y2="150"></line><line class="s-ink w3" x1="652" x2="652" y1="112" y2="188"></line><text class="t-s f-mute" x="664" y="138">전쟁이라는</text><text class="t-s f-mute" x="664" y="155">출구가 막힘</text><path class="s-blood w2" d="M640,152 C676,236 568,250 540,172" marker-end="url(#fortress-blood)"></path><circle class="f-eclipse" cx="530" cy="150" r="15"></circle><circle class="s-sunhi w15 f-none" cx="530" cy="150" r="19"></circle><text class="t-s t-b f-blood" text-anchor="middle" x="530" y="266">요새의 심장이 종착지 — 은밀한 살인</text><text class="t-s f-mute" text-anchor="middle" x="530" y="284">바타유의 '검은 태양'</text></svg></svg>
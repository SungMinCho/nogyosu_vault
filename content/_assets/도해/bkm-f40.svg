<path class="ln-time thick" d="M404.0,204.6 A105,105 0 0 1 314.6,294.0" marker-end="url(#ar-f17b)"></path>
<circle class="f-ink" cx="300.0" cy="85.0" r="5"></circle>
<text class="b mid" x="300.0" y="71.0">정점</text>
<circle class="f-ink" cx="300.0" cy="295.0" r="5"></circle>
<text class="b mid" x="300.0" y="321.0">저점</text>
<text class="t-s mid t-ink2" x="300" y="184">경기순환</text>
<text class="t-xs mid t-ink2" x="300" y="204">시계 방향으로 흐른다</text>
<text class="b" x="40" y="250">회복 초기</text>
<text class="t-s" x="40" y="270">금융 · 경기 소비재(내구재)</text>
<text class="b" x="40" y="92">확장 후기</text>
<text class="t-s" x="40" y="112">기술 · 자본재(제조)</text>
<text class="b end" x="560" y="92">정점 무렵</text>
<text class="t-s end" x="560" y="112">에너지 · 원자재</text>
<text class="b end" x="560" y="250">수축</text>
<text class="t-s end" x="560" y="270">필수소비재 · 보건 · 유틸리티</text>
<text class="t-xs end t-ret" x="560" y="344">실측 1963–2026 수축기, 시장 대비 %p/년</text>

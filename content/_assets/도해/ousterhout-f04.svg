<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 320" width="760" height="320" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E7EAE8; --panel:#F3F5F4; --code-bg:#EEF1F0;
  --ink:#1B2224; --muted:#586365; --rule:#C1C9C8; --rule-soft:rgba(27,34,36,.07);
  --if:#2A5687; --if-soft:rgba(42,86,135,.12); --if-deep:#15375C;
  --ore:#8A6014; --ore-soft:rgba(138,96,20,.15);
  --cx:#7A3B72; --cx-soft:rgba(122,59,114,.12);
  --flag:#B3381B; --flag-soft:rgba(179,56,27,.10);
  --canary:#E9B30C;
  --f-body:"Source Serif 4","Noto Serif KR","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --f-disp:"Do Hyeon","Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --f-label:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
  --f-mono:"Red Hat Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1416; --panel:#161D20; --code-bg:#131A1D;
    --ink:#E1E7E6; --muted:#95A1A3; --rule:#2F3A3D; --rule-soft:rgba(225,231,230,.06);
    --if:#7EA7DA; --if-soft:rgba(126,167,218,.16); --if-deep:#3B6AA5;
    --ore:#D6A553; --ore-soft:rgba(214,165,83,.17);
    --cx:#CB8EC2; --cx-soft:rgba(203,142,194,.17);
    --flag:#EF7B57; --flag-soft:rgba(239,123,87,.14);
    --canary:#F4C63A;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1416; --panel:#161D20; --code-bg:#131A1D;
  --ink:#E1E7E6; --muted:#95A1A3; --rule:#2F3A3D; --rule-soft:rgba(225,231,230,.06);
  --if:#7EA7DA; --if-soft:rgba(126,167,218,.16); --if-deep:#3B6AA5;
  --ore:#D6A553; --ore-soft:rgba(214,165,83,.17);
  --cx:#CB8EC2; --cx-soft:rgba(203,142,194,.17);
  --flag:#EF7B57; --flag-soft:rgba(239,123,87,.14);
  --canary:#F4C63A;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1rem 3rem }.lecture{ display:contents }.fig{ margin:.6rem 0 }.frame{ overflow-x:auto; overflow-y:hidden; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding-block:.8rem;
  background-image:linear-gradient(to right,var(--bg),var(--bg)),linear-gradient(to right,var(--bg),var(--bg)),
    linear-gradient(to right,var(--rule),transparent),linear-gradient(to left,var(--rule),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat;
  background-size:1.5rem 100%,1.5rem 100%,.6rem 100%,.6rem 100%; background-attachment:local,local,scroll,scroll }.dg{ display:block; width:100%; height:auto }.dg .t, .hero-svg .t{ font-family:var(--f-label); font-size:13px; fill:var(--ink) }.dg .t-s{ font-size:12px }.dg .t-xs{ font-size:11px }.dg .t-b, .hero-svg .t-b{ font-weight:700 }.dg .t-m{ font-family:var(--f-mono) }.dg .t-mut, .hero-svg .t-mut{ fill:var(--muted) }.dg .t-if, .hero-svg .t-if{ fill:var(--if) }.dg .t-cx{ fill:var(--cx) }.dg line, .dg polyline, .dg path, .hero-svg line, .hero-svg polyline, .hero-svg path{ fill:none }.f-ink{ fill:var(--ink)!important }.f-panel{ fill:var(--panel)!important }.f-cx-soft{ fill:var(--cx-soft)!important }.ln{ stroke:var(--ink); stroke-width:1.4 }.ln-thin{ stroke:var(--ink); stroke-width:1 }.ln-mut{ stroke:var(--rule); stroke-width:1.2 }.s-ink-thin{ stroke:var(--ink); stroke-width:1 }.s-if{ stroke:var(--if); stroke-width:1.4 }.s-cx{ stroke:var(--cx); stroke-width:1.4 }.w2{ stroke-width:2 }svg.pz-root{width:760px!important;height:320px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w page"><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="HTTP 요청을 다 읽으려면 빈 줄을 찾고 머리글의 Content-Length를 파싱해야 하므로, 읽기 클래스와 파싱 클래스를 나누면 두 클래스가 모두 HTTP 형식을 알게 된다. 한 클래스로 합치면 그 지식이 한 곳에 숨는다." class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 760 320" width="100%"><defs><marker id="a-ink-http" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="f-panel s-ink-thin" height="54.0" rx="3" width="112.0" x="10.0" y="48.0"></rect><text class="t t-s t-b" text-anchor="middle" x="66.0" y="70.0">소켓에서 읽기</text><text class="t t-xs t-m" text-anchor="middle" x="66.0" y="90.0">145 바이트</text><line class="ln" marker-end="url(#a-ink-http)" x1="123.0" x2="135.0" y1="75.0" y2="75.0"></line><rect class="f-cx-soft s-cx" height="54.0" rx="3" width="112.0" x="136.0" y="48.0"></rect><text class="t t-s t-b" text-anchor="middle" x="192.0" y="70.0">빈 줄 찾기</text><text class="t t-xs t-m" text-anchor="middle" x="192.0" y="90.0">112째 바이트</text><line class="ln" marker-end="url(#a-ink-http)" x1="249.0" x2="261.0" y1="75.0" y2="75.0"></line><rect class="f-cx-soft s-cx" height="54.0" rx="3" width="112.0" x="262.0" y="48.0"></rect><text class="t t-s t-b" text-anchor="middle" x="318.0" y="70.0">머리글 파싱</text><text class="t t-xs t-m" text-anchor="middle" x="318.0" y="90.0">Length: 33</text><line class="ln" marker-end="url(#a-ink-http)" x1="375.0" x2="387.0" y1="75.0" y2="75.0"></line><rect class="f-panel s-ink-thin" height="54.0" rx="3" width="112.0" x="388.0" y="48.0"></rect><text class="t t-s t-b" text-anchor="middle" x="444.0" y="70.0">더 읽기</text><text class="t t-xs t-m" text-anchor="middle" x="444.0" y="90.0">+33 바이트</text><line class="ln" marker-end="url(#a-ink-http)" x1="501.0" x2="513.0" y1="75.0" y2="75.0"></line><rect class="f-panel s-ink-thin" height="54.0" rx="3" width="112.0" x="514.0" y="48.0"></rect><text class="t t-s t-b" text-anchor="middle" x="570.0" y="70.0">본문</text><text class="t t-xs t-m" text-anchor="middle" x="570.0" y="90.0">%EC%84%B1…</text><line class="ln" marker-end="url(#a-ink-http)" x1="627.0" x2="639.0" y1="75.0" y2="75.0"></line><rect class="f-panel s-ink-thin" height="54.0" rx="3" width="112.0" x="640.0" y="48.0"></rect><text class="t t-s t-b" text-anchor="middle" x="696.0" y="70.0">URL 해독</text><text class="t t-xs t-m" text-anchor="middle" x="696.0" y="90.0">성민, hi!</text><path class="ln-thin" d="M10,40 L10,34 L500,34 L500,40"></path><text class="t t-s" text-anchor="middle" x="255.0" y="28.0">‘읽기’ 단계가 해야 하는 일</text><path class="ln-thin" d="M136,110 L136,116 L752,116 L752,110"></path><text class="t t-s t-cx" text-anchor="middle" x="444.0" y="134.0">‘파싱’ 단계가 해야 하는 일 — 자주색 두 칸은 양쪽이 모두 안다</text><line class="ln-mut" x1="380.0" x2="380.0" y1="158.0" y2="310.0"></line><text class="t t-b" text-anchor="middle" x="195.0" y="176.0">시간적 분해: 형식 지식이 두 곳에</text><rect class="f-panel s-ink-thin" height="34.0" rx="3" width="140.0" x="30.0" y="196.0"></rect><text class="t t-s t-m" text-anchor="middle" x="100.0" y="218.0">RequestReader</text><rect class="f-panel s-ink-thin" height="34.0" rx="3" width="140.0" x="220.0" y="196.0"></rect><text class="t t-s t-m" text-anchor="middle" x="290.0" y="218.0">RequestParser</text><ellipse class="f-cx-soft s-cx" cx="195" cy="284" rx="86" ry="18"></ellipse><text class="t t-s t-cx" text-anchor="middle" x="195.0" y="289.0">HTTP 형식 지식</text><line class="s-cx w2" x1="100.0" x2="150.0" y1="231.0" y2="266.0"></line><line class="s-cx w2" x1="290.0" x2="240.0" y1="231.0" y2="266.0"></line><line class="ln" marker-end="url(#a-ink-http)" x1="171.0" x2="218.0" y1="213.0" y2="213.0"></line><text class="t t-xs t-mut" text-anchor="middle" x="195.0" y="206.0">문자열</text><text class="t t-b" text-anchor="middle" x="570.0" y="176.0">정보 은닉: 형식 지식이 한 곳에</text><rect class="f-panel s-if" height="110.0" rx="4" width="260.0" x="440.0" y="192.0"></rect><text class="t t-s t-m t-if" text-anchor="middle" x="570.0" y="216.0">HttpRequest</text><text class="t t-xs t-m" text-anchor="middle" x="570.0" y="238.0">getParam(name) · getIntParam(name)</text><ellipse class="f-cx-soft s-cx" cx="570" cy="276" rx="86" ry="16"></ellipse><text class="t t-s t-cx" text-anchor="middle" x="570.0" y="281.0">HTTP 형식 지식</text></svg></g></g></g></g></g></svg>
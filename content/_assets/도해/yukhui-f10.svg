<line x1="152" x2="176" y1="262" y2="262"></line><line x1="152" x2="176" y1="286" y2="286"></line>
<line x1="484" x2="508" y1="262" y2="262"></line><line x1="484" x2="508" y1="286" y2="286"></line>
</g>
<g class="sm fire-t">
<text text-anchor="start" x="58" y="256">자연의 무력함 — 헤겔 §18</text>
<text text-anchor="start" x="58" y="280">멈추지 않는 탐색 — §20</text>
<text text-anchor="end" x="602" y="256">새 규범을 세우는 힘 — 캉길렘 §30</text>
<text text-anchor="end" x="602" y="280">왜 없이 피는 장미 — 하이데거 §38</text>
</g>
<line class="sea-s dash" x1="180" x2="180" y1="240" y2="300"></line>
<line class="sea-s dash" x1="480" x2="480" y1="240" y2="300"></line>
<text class="ttl fire-t" text-anchor="middle" x="330" y="322">건너오지 않는 것 = 잔존하는 비인간적인 것</text>
</svg></g></g></g></g></svg>
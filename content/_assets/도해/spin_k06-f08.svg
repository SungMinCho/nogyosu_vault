<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 300" width="800" height="300" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .t-grid{ fill:var(--grid) }.dg .t-pos{ fill:var(--pos) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-pos{ stroke:var(--pos) }.dg .dash{ stroke-dasharray:4 3 }.dg .f-ink{ fill:var(--ink) }.dg .f-pos{ fill:var(--pos) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-spike{ fill:var(--spike-soft); stroke:var(--spike) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.dg .tag-pos{ fill:var(--pos-soft); stroke:var(--pos); stroke-width:1 }.dg .ssub{ font-size:8px }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:800px!important;height:300px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="QuaRot는 RoPE를 적용한 뒤의 쿼리와 키에 추론 중 헤드별 하다마드를 곱한다. 과제는 이 하다마드를 RoPE 앞, W_q와 W_k 안으로 옮기는 것이다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 800 300" width="100%"><defs><marker id="g7-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="g7-pos" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-pos" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="bx-rot" height="42" rx="4" width="40" x="30" y="50"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="50" y="75">a</text><line class="ln" marker-end="url(#g7-ink)" x1="71" x2="86" y1="71" y2="71"></line><rect class="bx-rot" height="42" rx="4" width="70" x="88" y="50"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="123" y="67">W<tspan class="ssub" dy="3">q</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="123" y="82">병합 가능</text><line class="ln" marker-end="url(#g7-ink)" x1="159" x2="174" y1="71" y2="71"></line><rect class="bx-spike" height="42" rx="4" width="80" x="176" y="50"></rect><text class="t-s t-b t-spike" text-anchor="middle" x="216" y="67">RoPE</text><text class="t-s t-mut" text-anchor="middle" x="216" y="82">위치마다 회전</text><line class="ln" marker-end="url(#g7-ink)" x1="257" x2="272" y1="71" y2="71"></line><rect class="bx-grid" height="42" rx="4" width="80" x="274" y="50"></rect><text class="t-s t-b t-grid" text-anchor="middle" x="314" y="67">· H<tspan class="ssub" dy="3">dh</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="314" y="82">온라인</text><line class="ln" marker-end="url(#g7-ink)" x1="355" x2="370" y1="71" y2="71"></line><rect class="bx" height="42" rx="4" width="46" x="372" y="50"></rect><text class="t-s t-b" text-anchor="middle" x="395" y="75">Q̃</text><rect class="bx-rot" height="42" rx="4" width="40" x="30" y="130"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="50" y="155">a</text><line class="ln" marker-end="url(#g7-ink)" x1="71" x2="86" y1="151" y2="151"></line><rect class="bx-rot" height="42" rx="4" width="70" x="88" y="130"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="123" y="147">W<tspan class="ssub" dy="3">k</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="123" y="162">병합 가능</text><line class="ln" marker-end="url(#g7-ink)" x1="159" x2="174" y1="151" y2="151"></line><rect class="bx-spike" height="42" rx="4" width="80" x="176" y="130"></rect><text class="t-s t-b t-spike" text-anchor="middle" x="216" y="147">RoPE</text><text class="t-s t-mut" text-anchor="middle" x="216" y="162">위치마다 회전</text><line class="ln" marker-end="url(#g7-ink)" x1="257" x2="272" y1="151" y2="151"></line><rect class="bx-grid" height="42" rx="4" width="80" x="274" y="130"></rect><text class="t-s t-b t-grid" text-anchor="middle" x="314" y="147">· H<tspan class="ssub" dy="3">dh</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="314" y="162">온라인</text><line class="ln" marker-end="url(#g7-ink)" x1="355" x2="370" y1="151" y2="151"></line><rect class="bx" height="42" rx="4" width="46" x="372" y="130"></rect><text class="t-s t-b" text-anchor="middle" x="395" y="155">K̃</text><rect class="bx-grid" height="42" rx="4" width="104" x="436" y="130"></rect><text class="t-s t-b t-grid" text-anchor="middle" x="488" y="147">4비트 KV 캐시</text><text class="t-s t-mut" text-anchor="middle" x="488" y="162">저장</text><line class="ln" marker-end="url(#g7-ink)" x1="420" x2="434" y1="151" y2="151"></line><rect class="bx-rot" height="50" rx="4" width="200" x="560" y="80"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="660" y="100">Q̃ · K̃ᵀ = Q·H·Hᵀ·Kᵀ</text><text class="t-s t-mut" text-anchor="middle" x="660" y="117">= Q·Kᵀ — 점수는 그대로</text><line class="ln" marker-end="url(#g7-ink)" x1="418" x2="556" y1="71" y2="98"></line><line class="ln" marker-end="url(#g7-ink)" x1="540" x2="600" y1="151" y2="132"></line><path class="ln ln-pos dash" d="M 314 96 C 314 120, 123 120, 123 96" marker-end="url(#g7-pos)"></path><rect class="tag-pos" height="20" rx="3" width="172" x="140" y="106"></rect><text class="t-s t-b t-pos" text-anchor="middle" x="226" y="120">과제: H를 W 안으로 옮기기?</text><text class="t-s t-b" text-anchor="start" x="30" y="214">QuaRot: "Pos(RoPE)가 있어서 하다마드를 W<tspan class="ssub" dy="3">q</tspan><tspan dy="-3">​</tspan>와 W<tspan class="ssub" dy="3">k</tspan><tspan dy="-3">​</tspan>에 직접 융합할 수 없다."</text><text class="t-s t-mut" text-anchor="start" x="30" y="236">대안 — RoPE 전의 키를 캐시: 쿼리는 안 돌려도 되지만, 매 단계 캐시된 키 전부를 역회전 + RoPE 다시.</text><text class="t-s t-mut" text-anchor="start" x="30" y="254">디코딩 한 단계: RoPE 뒤 캐싱은 H 두 번, RoPE 전 캐싱은 캐시 길이만큼(예: 4,096번).</text></svg></g></g></g></g></svg>
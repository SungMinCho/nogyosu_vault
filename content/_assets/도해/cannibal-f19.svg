rder:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w dia"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="한 여자는 두 사람이 아니라 막대 하나다. 오빠 갑 쪽 끝에서는 누이, 남편 병 쪽 끝에서는 아내다. 갑은 병에게서 을의 아내 쪽 얼굴을, 병은 갑에게서 을의 누이 쪽 얼굴을 본다. 누이 교환은 잇는 자로 잡힌 성마다 하나씩, 서로가 서로의 판본인 인척 삼각형 둘을 만든다: 을이 갑과 병을 처남-매부로 잇는 삼각형, 갑이 을과 정을 올케-시누이로 잇는 삼각형." class="d pz-inner" height="100%" role="img" viewBox="0 0 700 470" width="100%">

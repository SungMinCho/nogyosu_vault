<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 790 304" width="790" height="304" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-mut{ stroke:var(--muted) }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-spike{ stroke:var(--spike) }.dg .dash{ stroke-dasharray:4 3 }.dg .ln-mut-hair{ stroke:var(--muted); stroke-width:1 }.dg .f-mut{ fill:var(--muted) }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .thick{ stroke-width:2.4 }.dg .ring{ fill:none; stroke:var(--muted); stroke-width:1.1; stroke-dasharray:4 3 }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="길이 2인 화살표를 45도 돌리면 가장 큰 좌표가 2에서 1.41로 줄고, 4차원 벡터 (2,0,0,0)은 (1,1,1,1)이 된다" class="dg" height="100%" role="img" style="" viewBox="0 0 790 304" width="100%"><defs><marker id="f1-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f1-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f1-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mut" d="M0,0 L10,5 L0,10 z"></path></marker></defs><circle class="ring" cx="150" cy="168" r="110"></circle><line class="ln-mut-hair" x1="20" x2="290" y1="168" y2="168"></line><line class="ln-mut-hair" x1="150" x2="150" y1="293" y2="33"></line><line class="ln ln-spike thick" marker-end="url(#f1-spike)" x1="150" x2="256" y1="168" y2="168"></line><line class="ln ln-rot thick" marker-end="url(#f1-rot)" x1="150" x2="224.782" y1="168" y2="93.2183"></line><line class="ln ln-rot dash" x1="227.782" x2="227.782" y1="90.2183" y2="168"></line><line class="ln ln-rot dash" x1="227.782" x2="150" y1="90.2183" y2="90.2183"></line><path class="ln ln-mut" d="M 188 168 A 38 38 0 0 0 176.9 141.1"></path><text class="t-s t-mut" text-anchor="start" x="196" y="156">45°</text><text class="t-s t-b t-spike" text-anchor="start" x="264" y="186">(2, 0)</text><text class="t-s t-b t-rot" text-anchor="start" x="233.782" y="84.2183">(1.41, 1.41)</text><text class="t-s t-mono t-rot" text-anchor="middle" x="227.782" y="184">1.41</text><text class="t-s t-mono t-rot" text-anchor="end" x="142" y="94.2183">1.41</text><text class="t-s t-mut" text-anchor="start" x="220" y="294">점선 원 = 길이 2</text><text class="t-b" text-anchor="start" x="30" y="30">평면에서 45° 돌리기</text><text class="t-b" text-anchor="start" x="400" y="30">n = 4에서: x 와 x · H₄/2</text><rect class="f-spike" height="120" rx="0" width="22" x="400" y="100"></rect><rect class="f-spike" height="1.5" rx="0" width="22" x="430" y="218.5"></rect><rect class="f-spike" height="1.5" rx="0" width="22" x="460" y="218.5"></rect><rect class="f-spike" height="1.5" rx="0" width="22" x="490" y="218.5"></rect><line class="ln" x1="396" x2="516" y1="220" y2="220"></line><text class="t-s t-mono" text-anchor="start" x="400" y="238">x = (2, 0, 0, 0)</text><text class="t-s t-b t-spike" text-anchor="start" x="400" y="256">κ = 2 (최악)</text><text class="t-s t-mut" text-anchor="start" x="400" y="272">길이 2 · rms 1</text><rect class="f-rot" height="60" rx="0" width="22" x="600" y="160"></rect><rect class="f-rot" height="60" rx="0" width="22" x="630" y="160"></rect><rect class="f-rot" height="60" rx="0" width="22" x="660" y="160"></rect><rect class="f-rot" height="60" rx="0" width="22" x="690" y="160"></rect><line class="ln" x1="596" x2="716" y1="220" y2="220"></line><text class="t-s t-mono" text-anchor="start" x="600" y="238">x·H₄/2 = (1, 1, 1, 1)</text><text class="t-s t-b t-rot" text-anchor="start" x="600" y="256">κ = 1 (최선)</text><text class="t-s t-mut" text-anchor="start" x="600" y="272">길이 2 · rms 1</text><line class="ln ln-rot" marker-end="url(#f1-rot)" x1="536" x2="586" y1="160" y2="160"></line></svg></svg>
height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w dia"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="말벌 계통과 난초 계통은 각자 세대를 낳아 내려가고, 두 계통 사이의 반자연적 결연은 이중 포획으로 맞물리지만 말벌-난초를 낳지 않는다. 그래도 각 계통의 다음 세대가 그 결연에 기댄다. 세포 속에서는 주인 세포 계통에 한 번 합쳐진 세균이 미토콘드리아로 남아, 미토콘드리아 단백질 약 1,136종 가운데 98.9%를 핵이 만들고, 어머니 쪽으로만 물려진다." class="d pz-inner" height="100%" role="img" viewBox="0 0 720 408" width="100%">

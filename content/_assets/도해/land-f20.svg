    linear-gradient(to left,var(--paper-2) 30%,transparent) right center/2.4rem 100% no-repeat,
    radial-gradient(farthest-side at 0 50%,var(--shadow),transparent) left center/.9rem 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%,var(--shadow),transparent) right center/.9rem 100% no-repeat,
    var(--paper-2);
  background-attachment:local,local,scroll,scroll }.fig svg{ display:block; width:100%; min-width:var(--minw); height:auto }@media (max-width:40em){.lecture > .fig, .doc > .fig{ width:calc(100% + var(--pad)*2); max-width:none; margin-inline:calc(var(--pad)*-1) }.fig .frame{ border-radius:0; padding-inline:var(--pad) }}.fig svg text{ font-family:var(--f-ui); font-size:13px; fill:var(--ink) }.fig svg :is(line,polyline,polygon,path,rect,circle,ellipse){ stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round }.fig line, .fig polyline, .fig path{ fill:none }.fig .t-xs{ font-size:10.5px }.fig .t-s{ font-size:11.5px }.fig .t-b{ font-weight:600 }.fig .f-ink{ fill:var(--ink) }.fig .f-mute{ fill:var(--ink-2) }.fig .f-sun{ fill:var(--sun) }.fig .f-zero{ fill:var(--zero) }.fig .f-ledger{ fill:var(--ledger) }.fig .f-ledgersoft{ fill:var(--ledger-soft) }.fig .f-blood{ fill:var(--blood) }.fig .s-ink{ stroke:var(--ink) }.fig .s-mute{ stroke:var(--ink-2) }.fig .s-rule{ stroke:var(--rule) }.fig .s-sun{ stroke:var(--sun) }.fig .s-ledger{ stroke:var(--ledger) }.fig .w1{ stroke-width:1 }.fig .w15{ stroke-width:1.5 }.fig .w25{ stroke-width:2.5 }.fig .dash{ stroke-dasharray:5 4 }.fig .op8{ opacity:.8 }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="자를 줄일수록 해안선은 길어진다. D ≈ 1.25이면 자를 100 km에서 1 km로 줄일 때 잰 길이가 약 3.16배가 되고, 어느 값에도 수렴하지 않는다." height="100%" role="img" style="--minw:699px" viewBox="0 0 760 342" width="100%"><defs><marker id="coast-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="coast-mute" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="8.6" refY="5" viewBox="0 0 10 10"><path class="f-mute" d="M0,0.6 L10,5 L0,9.4 z"></path></marker><marker id="coast-sun" markerHeight="9" markerUn
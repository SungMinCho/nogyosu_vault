}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:1rem 3rem}.lecture{display:contents}.fig{margin:.6rem 0}.panels{display:flex;flex-wrap:wrap;gap:1rem 1.2rem;justify-content:center;align-items:flex-start}.pn{display:block;flex:1 1 17.5rem;max-width:21rem;height:auto;background:var(--sheet);border:1px solid var(--rule)}.pn.sm{flex:1 1 12.5rem;max-width:15rem}.pn.tall{max-width:23rem}svg text{font-family:var(--f-mono)}.t-head{font-family:var(--f-disp);fill:var(--ink)}.t-num{font-family:var(--f-mono);fill:var(--ink)}.t-math{font-family:KaTeX_Math,"Times New Roman",serif;font-style:italic;fill:var(--ink)}.c-in{color:var(--c-in);fill:var(--c-in)}.c-orth{color:var(--c-orth);fill:var(--c-orth)}.s-in{stroke:var(--c-in)}.s-out{stroke:var(--c-out)}.s-orth{stroke:var(--c-orth)}.s-ink{stroke:var(--ink)}.f-in{fill:var(--c-in)}.f-out{fill:var(--c-out)}.f-inv{fill:var(--c-inv)}.f-orth{fill:var(--c-orth)}.f-warn{fill:var(--c-warn)}.f-null{fill:var(--c-null)}.f-ink{fill:var(--ink)}.f-mut{fill:var(--ink-2)}.f-win{fill:var(--w-in)}.f-wout{fill:var(--w-out)}.f-worth{fill:var(--w-orth)}.f-wmut{fill:var(--w-mut)}line,polyline,path{fill:none}.katex svg path{fill:currentColor}polygon.s-in,polygon.s-out{stroke-linejoin:round}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="순전파는 x=(1,1)에서 y=(3,1,2), 손실 2.5. 역전파는 g=(1,0,2)가 W 전치를 타고 (7,0)으로 돌아온다." class="pn" height="100%" role="img" viewBox="0 0 360 250" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="bp-in" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-in" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="bp-out" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-out" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="bp-inv" markerHeight="9" markerUnits
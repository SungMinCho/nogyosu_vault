<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 382" width="720" height="382" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink-t{ fill:var(--ink); }.f-ink2-t{ fill:var(--ink-2); }.f-muted{ stroke:var(--muted); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-indigo-f{ fill:var(--indigo-soft); }.f-madder-t{ fill:var(--madder); }.f-ochre-t{ fill:var(--ochre); }.f-mend-t{ fill:var(--mend); }.f-panel-f{ fill:var(--panel); }.f-none{ fill:none; }.f-dash{ stroke-dasharray:6 5; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-b{ font-weight:700; }svg .halo{ paint-order:stroke; stroke:var(--panel); stroke-width:4px; stroke-linejoin:round; }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="아래의 원시 그물(출계·결연·부채 블록)은 끊기지 않은 채 그 모든 선이 위로 끌어올려져 전제군주의 몸이라는 좁은 목 한 점을 지나도록 다시 묶이고, 거기서 왕의 도장을 받아야 유효해진다. 목에서 나오는 것은 신과의 직접 출계와 백성과의 새 결연이고, 확장된 출계가 이 둘로 단락될 때 부채가 무한해진다." height="100%" role="img" viewBox="0 0 720 382" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f06-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f06-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f06-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f06-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f06-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f06-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f06-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="f-muted f-none" stroke-width="1.6" x1="70" x2="70" y1="262" y2="344"></line><line class="f-muted f-none" stroke-width="1.6" x1="180" x2="180" y1="262" y2="344"></line><line class="f-muted f-none" stroke-width="1.6" x1="290" x2="290" y1="262" y2="344"></line><line class="f-muted f-none" stroke-width="1.6" x1="430" x2="430" y1="262" y2="344"></line><line class="f-muted f-none" stroke-width="1.6" x1="540" x2="540" y1="262" y2="344"></line><line class="f-muted f-none" stroke-width="1.6" x1="650" x2="650" y1="262" y2="344"></line><line class="f-muted f-none" stroke-width="1.3" x1="70" x2="180" y1="292" y2="292"></line><rect class="f-muted f-panel-f" height="12" rx="1" stroke-width="1.1" width="16" x="117.0" y="286"></rect><circle class="f-muted f-panel-f" cx="70" cy="292" r="3.2" stroke-width="1.2"></circle><circle class="f-muted f-panel-f" cx="180" cy="292" r="3.2" stroke-width="1.2"></circle><line class="f-muted f-none" stroke-width="1.3" x1="180" x2="290" y1="324" y2="324"></line><rect class="f-muted f-panel-f" height="12" rx="1" stroke-width="1.1" width="16" x="227.0" y="318"></rect><circle class="f-muted f-panel-f" cx="180" cy="324" r="3.2" stroke-width="1.2"></circle><circle class="f-muted f-panel-f" cx="290" cy="324" r="3.2" stroke-width="1.2"></circle><line class="f-muted f-none" stroke-width="1.3" x1="290" x2="430" y1="282" y2="282"></line><rect class="f-muted f-panel-f" height="12" rx="1" stroke-width="1.1" width="16" x="352.0" y="276"></rect><circle class="f-muted f-panel-f" cx="290" cy="282" r="3.2" stroke-width="1.2"></circle><circle class="f-muted f-panel-f" cx="430" cy="282" r="3.2" stroke-width="1.2"></circle><line class="f-muted f-none" stroke-width="1.3" x1="430" x2="540" y1="330" y2="330"></line><rect class="f-muted f-panel-f" height="12" rx="1" stroke-width="1.1" width="16" x="477.0" y="324"></rect><circle class="f-muted f-panel-f" cx="430" cy="330" r="3.2" stroke-width="1.2"></circle><circle class="f-muted f-panel-f" cx="540" cy="330" r="3.2" stroke-width="1.2"></circle><line class="f-muted f-none" stroke-width="1.3" x1="540" x2="650" y1="304" y2="304"></line><rect class="f-muted f-panel-f" height="12" rx="1" stroke-width="1.1" width="16" x="587.0" y="298"></rect><circle class="f-muted f-panel-f" cx="540" cy="304" r="3.2" stroke-width="1.2"></circle><circle class="f-muted f-panel-f" cx="650" cy="304" r="3.2" stroke-width="1.2"></circle><text class="f-muted-t t-s" text-anchor="middle" x="360" y="372">아래 그물은 끊기지 않는다 — 마을끼리 혼인과 빚은 계속</text><line class="f-indigo f-none" stroke-width="1.3" x1="70" x2="360" y1="262" y2="158"></line><circle class="f-indigo f-indigo-t" cx="70" cy="262" r="3" stroke-width="1"></circle><line class="f-indigo f-none" stroke-width="1.3" x1="180" x2="360" y1="262" y2="158"></line><circle class="f-indigo f-indigo-t" cx="180" cy="262" r="3" stroke-width="1"></circle><line class="f-indigo f-none" stroke-width="1.3" x1="290" x2="360" y1="262" y2="158"></line><circle class="f-indigo f-indigo-t" cx="290" cy="262" r="3" stroke-width="1"></circle><line class="f-indigo f-none" stroke-width="1.3" x1="430" x2="360" y1="262" y2="158"></line><circle class="f-indigo f-indigo-t" cx="430" cy="262" r="3" stroke-width="1"></circle><line class="f-indigo f-none" stroke-width="1.3" x1="540" x2="360" y1="262" y2="158"></line><circle class="f-indigo f-indigo-t" cx="540" cy="262" r="3" stroke-width="1"></circle><line class="f-indigo f-none" stroke-width="1.3" x1="650" x2="360" y1="262" y2="158"></line><circle class="f-indigo f-indigo-t" cx="650" cy="262" r="3" stroke-width="1"></circle><line class="f-indigo f-none f-dash" stroke-width="0.9" x1="125.0" x2="360" y1="286" y2="158"></line><line class="f-indigo f-none f-dash" stroke-width="0.9" x1="235.0" x2="360" y1="318" y2="158"></line><line class="f-indigo f-none f-dash" stroke-width="0.9" x1="360.0" x2="360" y1="276" y2="158"></line><line class="f-indigo f-none f-dash" stroke-width="0.9" x1="485.0" x2="360" y1="324" y2="158"></line><line class="f-indigo f-none f-dash" stroke-width="0.9" x1="595.0" x2="360" y1="298" y2="158"></line><text class="f-indigo-t t-b halo" text-anchor="start" x="500" y="219">덧코드화</text><circle class="f-indigo f-indigo-t" cx="360" cy="152" r="8" stroke-width="1.4"></circle><circle class="f-indigo f-none" cx="360" cy="152" r="13" stroke-width="1.2"></circle><text class="f-indigo-t t-b" text-anchor="end" x="338" y="146">전제군주의 몸</text><text class="f-indigo-t t-s" text-anchor="end" x="338" y="163">좁은 목 · 왕의 도장</text><rect class="f-indigo f-indigo-f" height="28" rx="2" stroke-width="1.6" width="60" x="330" y="10"></rect><text class="f-indigo-t t-b" text-anchor="middle" x="360" y="29">신</text><line class="f-indigo f-none" marker-end="url(#f06-a-indigo)" stroke-width="2.2" x1="360" x2="360" y1="137" y2="42"></line><text class="f-indigo-t t-s" text-anchor="end" x="350" y="86">신과의 직접 출계</text><line class="f-indigo f-none" marker-end="url(#f06-a-indigo)" stroke-width="2.2" x1="375" x2="590" y1="152" y2="152"></line><rect class="f-indigo f-indigo-f" height="32" rx="2" stroke-width="1.6" width="112" x="594" y="136"></rect><text class="f-indigo-t t-b" text-anchor="middle" x="650" y="157">백성</text><text class="f-indigo-t t-s" text-anchor="middle" x="480" y="143">새 결연</text><text class="f-indigo-t t-s t-b" text-anchor="start" x="372" y="70">무한 부채</text><text class="f-indigo-t t-s" text-anchor="start" x="372" y="86">계산서 없는 빚</text></svg></svg>
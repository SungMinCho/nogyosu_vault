<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 704" width="1000" height="704" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.mast{ max-width:var(--shell); margin:0 auto; padding-inline:var(--pad); padding-block:2.6rem 1rem; }.quilt{ margin:1.6rem 0 .4rem; }.quilt svg{ display:block; width:100%; height:auto; }.quilt .q-num{ font-family:var(--f-mono); font-size:22px; font-weight:600; fill:var(--ink); paint-order:stroke; stroke:var(--panel); stroke-width:4px; stroke-linejoin:round; }.quilt .q-ttl{ font-family:var(--f-label); font-size:13px; fill:var(--ink-2); paint-order:stroke; stroke:var(--panel); stroke-width:3px; stroke-linejoin:round; }.quilt a:hover .q-patch, .quilt a:focus .q-patch{ stroke:var(--madder); stroke-width:3; }@media (max-width:40em){.quilt .q-ttl{ display:none }.quilt .q-num{ font-size:26px }}.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-indigo{ stroke:var(--indigo); }.f-indigo-f{ fill:var(--indigo-soft); }.f-madder{ stroke:var(--madder); }.f-madder-f{ fill:var(--madder-soft); }.f-ochre-t{ fill:var(--ochre); }.f-ochre-f{ fill:var(--ochre-soft); }.f-mend{ stroke:var(--mend); }.f-mend-t{ fill:var(--mend); }.f-mend-f{ fill:var(--mend-soft); }.f-none{ fill:none; }.f-stitch{ stroke-dasharray:9 6; stroke-linecap:round; }svg text{ font-family:var(--f-label); font-size:13px; }svg.pz-root{width:1000px!important;height:704px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w mast"><g class="pz-w quilt"><svg aria-label="스물네 강을 원서 영역 쪽수에 비례하는 천 조각으로 이어 붙인 퀼트. 위 두 줄은 안티 오이디푸스, 아래 세 줄은 천 개의 고원, 맨 아래 띠는 결산과 반론. 붉은 홈질이 줄마다 조각들을 꿰며 내려오다가 가장자리 밖으로 빠져나간다." class="pz-inner" height="100%" role="img" viewBox="0 0 1000 704" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern height="8" id="tx-weave" patternUnits="userSpaceOnUse" width="8"><rect class="f-indigo-f" height="8" width="8"></rect><path class="f-indigo" d="M0 2H8M0 6H8" opacity=".55" stroke-width="1.2"></path><path class="f-indigo" d="M2 0V8M6 0V8" opacity=".35" stroke-width=".8"></path></pattern><pattern height="9" id="tx-twill" patternUnits="userSpaceOnUse" width="9"><rect class="f-indigo-f" height="9" width="9"></rect><path class="f-indigo" d="M-1 9L9 -1M-1 3L3 -1M5 10L10 5" opacity=".5" stroke-width="1.3"></path></pattern><pattern height="14" id="tx-felt" patternUnits="userSpaceOnUse" width="14"><rect class="f-madder-f" height="14" width="14"></rect><path class="f-madder" d="M2 3q3 2 5 0M8 9q2 3 4 1M1 11q2-2 4 0M10 2q1 2 3 1" opacity=".55" stroke-width=".9"></path></pattern><pattern height="16" id="tx-check" patternUnits="userSpaceOnUse" width="16"><rect class="f-ochre-f" height="16" width="16"></rect><rect class="f-ochre-t" height="8" opacity=".18" width="8"></rect><rect class="f-ochre-t" height="8" opacity=".18" width="8" x="8" y="8"></rect></pattern><pattern height="10" id="tx-stripe" patternUnits="userSpaceOnUse" width="10"><rect class="f-mend-f" height="10" width="10"></rect><rect class="f-mend-t" height="3" opacity=".28" width="10"></rect></pattern><pattern height="12" id="tx-cross" patternUnits="userSpaceOnUse" width="12"><rect class="f-madder-f" height="12" width="12"></rect><path class="f-madder" d="M3 3l6 6M9 3l-6 6" opacity=".5" stroke-width="1"></path></pattern><pattern height="10" id="tx-darn" patternUnits="userSpaceOnUse" width="10"><rect class="f-mend-f" height="10" width="10"></rect><path class="f-mend" d="M0 2H10M0 7H10" opacity=".6" stroke-width="1"></path><path class="f-mend" d="M3 0V10M8 0V10" opacity=".35" stroke-width="1"></path></pattern></defs><a aria-label="1강 그것은 작동한다" href="#L01"><rect class="q-patch f-ink" fill="url(#tx-weave)" height="96.5" stroke-width="1.2" width="111.9" x="14.0" y="14.0"></rect><text class="q-num" x="24.0" y="42.0">1</text></a><a aria-label='2강 "그래서 그거였구나!"' href="#L02"><rect class="q-patch f-ink" fill="url(#tx-twill)" height="96.5" stroke-width="1.2" width="244.7" x="125.9" y="14.0"></rect><text class="q-num" x="135.9" y="42.0">2</text><text class="q-ttl" x="135.9" y="62.0">"그래서 그거였…</text></a><a aria-label="3강 성가족" href="#L03"><rect class="q-patch f-ink" fill="url(#tx-weave)" height="96.5" stroke-width="1.2" width="391.6" x="370.6" y="14.0"></rect><text class="q-num" x="380.6" y="42.0">3</text><text class="q-ttl" x="380.6" y="62.0">성가족</text></a><a aria-label="4강 법은 허구를 금지한다" href="#L04"><rect class="q-patch f-ink" fill="url(#tx-twill)" height="96.5" stroke-width="1.2" width="223.8" x="762.2" y="14.0"></rect><text class="q-num" x="772.2" y="42.0">4</text><text class="q-ttl" x="772.2" y="62.0">법은 허구를 금…</text></a><a aria-label="5강 대지의 몸" href="#L05"><rect class="q-patch f-ink" fill="url(#tx-weave)" height="170.0" stroke-width="1.2" width="214.2" x="14.0" y="110.5"></rect><text class="q-num" x="24.0" y="138.5">5</text><text class="q-ttl" x="24.0" y="158.5">대지의 몸</text></a><a aria-label="6강 운명처럼 오는 자들" href="#L06"><rect class="q-patch f-ink" fill="url(#tx-twill)" height="170.0" stroke-width="1.2" width="123.0" x="228.2" y="110.5"></rect><text class="q-num" x="238.2" y="138.5">6</text><text class="q-ttl" x="238.2" y="158.5">운명처럼 오는 …</text></a><a aria-label="7강 같은 돈이 아니다" href="#L07"><rect class="q-patch f-ink" fill="url(#tx-weave)" height="170.0" stroke-width="1.2" width="198.4" x="351.2" y="110.5"></rect><text class="q-num" x="361.2" y="138.5">7</text><text class="q-ttl" x="361.2" y="158.5">같은 돈이 아니다</text></a><a aria-label="8강 당신의 욕망 기계는 무엇인가" href="#L08"><rect class="q-patch f-ink" fill="url(#tx-twill)" height="170.0" stroke-width="1.2" width="436.4" x="549.6" y="110.5"></rect><text class="q-num" x="559.6" y="138.5">8</text><text class="q-ttl" x="559.6" y="158.5">당신의 욕망 기…</text></a><a aria-label="9강 우리 둘은 이미 여럿이었다" href="#L09"><rect class="q-patch f-ink" fill="url(#tx-felt)" height="101.3" stroke-width="1.2" width="153.1" x="14.0" y="290.5"></rect><text class="q-num" x="24.0" y="318.5">9</text><text class="q-ttl" x="24.0" y="338.5">우리 둘은 이미…</text></a><a aria-label="10강 늑대는 몇 마리였나" href="#L10"><rect class="q-patch f-ink" fill="url(#tx-check)" height="101.3" stroke-width="1.2" width="86.5" x="167.1" y="290.5"></rect><text class="q-num" x="177.1" y="318.5">10</text></a><a aria-label="11강 지구는 자기가 누구라고 생각하는가" href="#L11"><rect class="q-patch f-ink" fill="url(#tx-stripe)" height="101.3" stroke-width="1.2" width="239.7" x="253.7" y="290.5"></rect><text class="q-num" x="263.7" y="318.5">11</text><text class="q-ttl" x="263.7" y="338.5">지구는 자기가 …</text><text class="q-ttl" x="263.7" y="356.5">기원전 10000년</text></a><a aria-label="12강 0이 열두 개 사라진 날" href="#L12"><rect class="q-patch f-ink" fill="url(#tx-cross)" height="101.3" stroke-width="1.2" width="239.7" x="493.3" y="290.5"></rect><text class="q-num" x="503.3" y="318.5">12</text><text class="q-ttl" x="503.3" y="338.5">0이 열두 개 …</text><text class="q-ttl" x="503.3" y="356.5">1923. 11. 20</text></a><a aria-label="13강 도망치는 예언자" href="#L13"><rect class="q-patch f-ink" fill="url(#tx-felt)" height="101.3" stroke-width="1.2" width="253.0" x="733.0" y="290.5"></rect><text class="q-num" x="743.0" y="318.5">13</text><text class="q-ttl" x="743.0" y="338.5">도망치는 예언자</text><text class="q-ttl" x="743.0" y="356.5">기원전 587–기원후 70</text></a><a aria-label="14강 조심스럽게" href="#L14"><rect class="q-patch f-ink" fill="url(#tx-check)" height="111.7" stroke-width="1.2" width="108.7" x="14.0" y="391.8"></rect><text class="q-num" x="24.0" y="419.8">14</text></a><a aria-label="15강 없는 해의 얼굴" href="#L15"><rect class="q-patch f-ink" fill="url(#tx-stripe)" height="111.7" stroke-width="1.2" width="150.9" x="122.7" y="391.8"></rect><text class="q-num" x="132.7" y="419.8">15</text><text class="q-ttl" x="132.7" y="439.8">없는 해의 얼굴</text><text class="q-ttl" x="132.7" y="457.8">0년</text></a><a aria-label="16강 무슨 일이 일어났는가" href="#L16"><rect class="q-patch f-ink" fill="url(#tx-cross)" height="111.7" stroke-width="1.2" width="96.6" x="273.6" y="391.8"></rect><text class="q-num" x="283.6" y="419.8">16</text></a><a aria-label="17강 동네의 파시즘" href="#L17"><rect class="q-patch f-ink" fill="url(#tx-felt)" height="111.7" stroke-width="1.2" width="144.9" x="370.2" y="391.8"></rect><text class="q-num" x="380.2" y="419.8">17</text><text class="q-ttl" x="380.2" y="439.8">동네의 파시즘</text><text class="q-ttl" x="380.2" y="457.8">1933</text></a><a aria-label="18강 쥐가 되는 법" href="#L18"><rect class="q-patch f-ink" fill="url(#tx-check)" height="111.7" stroke-width="1.2" width="470.9" x="515.1" y="391.8"></rect><text class="q-num" x="525.1" y="419.8">18</text><text class="q-ttl" x="525.1" y="439.8">쥐가 되는 법</text><text class="q-ttl" x="525.1" y="457.8">1730</text></a><a aria-label="19강 어둠 속의 노래" href="#L19"><rect class="q-patch f-ink" fill="url(#tx-stripe)" height="142.3" stroke-width="1.2" width="194.4" x="14.0" y="503.6"></rect><text class="q-num" x="24.0" y="531.6">19</text><text class="q-ttl" x="24.0" y="551.6">어둠 속의 노래</text><text class="q-ttl" x="24.0" y="569.6">1837</text></a><a aria-label="20강 바둑알의 전쟁" href="#L20"><rect class="q-patch f-ink" fill="url(#tx-cross)" height="142.3" stroke-width="1.2" width="346.1" x="208.4" y="503.6"></rect><text class="q-num" x="218.4" y="531.6">20</text><text 
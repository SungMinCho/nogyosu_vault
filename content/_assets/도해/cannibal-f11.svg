<text x="16" y="30"><tspan class="tbig tb">데스콜라의 2×2</tspan><tspan class="tl"> 동일시 양식 넷</tspan></text>
<text class="tm" x="236" y="56"><tspan class="ts tb c-uru">물리성 · 몸</tspan><tspan class="tl"> physicalité</tspan></text>
<text class="ts tb c-jen" x="16" y="56">내면성 · 영혼</text>
<text class="tl" x="16" y="74">intériorité</text>
<text class="ts tm c-uru" x="162" y="80">같음 (연속)</text>
<text class="ts tm c-uru" x="310" y="80">다름 (불연속)</text>
<text class="ts c-jen" x="16" y="150">같음</text>
<text class="ts c-jen" x="16" y="167">(연속)</text>
<text class="ts c-jen" x="16" y="278">다름</text>
<text class="ts c-jen" x="16" y="295">(불연속)</text>
<rect class="s-dim w1 dash" height="120" width="140" x="92" y="92"></rect>
<text class="tb tm c-dim" x="162" y="119">토테미즘</text>
<text class="ts tm c-dim" x="162" y="138">오스트레일리아</text>
<text class="tl tm" x="162" y="178">내면성·물리성을</text>
<text class="tl tm" x="162" y="192">따로 정의해야</text>
<text class="tl tm" x="162" y="206">채워짐 = 실체화</text>
<rect class="s-dim w1 dash" height="120" width="140" x="240" y="220"></rect>
<text class="tb tm c-dim" x="310" y="247">유비론</text>
<text class="ts tm c-dim" x="310" y="266">중국·안데스</text>
<text class="ts tm c-dim" x="310" y="283">서아프리카·르네상스</text>
<text class="tl tm" x="310" y="306">내면성·물리성을</text>
<text class="tl tm" x="310" y="320">따로 정의해야</text>
<text class="tl tm" x="310" y="334">채워짐 = 실체화</text>
<rect class="f-panel s-ink w2" height="120" width="140" x="240" y="92"></rect>
<text class="tbig tb tm" x="310" y="130">애니미즘</text>
<text class="ts tm" x="310" y="154">아마존 ·</text>
<text class="ts tm" x="310" y="170">북방 수렵민</text>
<text class="tl tm c-ink" x="310" y="198">안에서의 대비</text>
<rect class="f-panel s-ink w2" height="120" width="140" x="92" y="220"></rect>
<text class="tbig tb tm c-mod" x="162" y="258">자연주의</text>
<text class="ts tm" x="162" y="282">근대 유럽</text>
<text class="ts tm" x="162" y="298">17세기 이래</text>
<text class="tl tm c-ink" x="162" y="326">안에서의 대비</text>
<text class="tbig tb" x="430" y="30">비베이루스 지 카스트루의 축</text>
<text class="tm" x="478" y="60"><tspan class="ts tb">바탕</tspan><tspan class="tl"> ground</tspan></text>
<text class="tl tm" x="478" y="78">같은 쪽</text>
<text class="tm" x="574" y="60"><tspan class="ts tb">형상</tspan><tspan class="tl"> figure</tspan></text>
<text class="tl tm" x="574" y="78">가르는 쪽</text>
<text class="ts tb" x="430" y="116">아마존 — 다자연주의</text>
<rect class="t-jen s-jen w1" height="52" width="96" x="430" y="126"></rect>
<rect class="f-uru" height="52" width="96" x="526" y="126"></rect>
<text class="ts tb tm c-jen" x="478" y="157">영혼 = 공통</text>
<text class="ts tb tm f-bg" x="574" y="157">몸 = 가름</text>
<rect class="t-uru s-uru w1" height="52" width="96" x="430" y="254"></rect>
<rect class="f-jen" height="52" width="96" x="526" y="254"></rect>
<text class="ts tb tm c-uru" x="478" y="285">몸 = 공통</text>
<text class="ts tb tm f-bg" x="574" y="285">정신 = 가름</text>
<text class="ts tb c-mod" x="430" y="326">근대 — 다문화주의</text>
<line class="s-jen w2" marker-end="url(#f08-a-jen)" marker-start="url(#f08-a-jen)" x1="478" x2="574" y1="182" y2="250"></line>

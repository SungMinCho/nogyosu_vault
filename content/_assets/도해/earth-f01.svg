  --verm:#D85E3D; --verm-l:#45241B; --verm-d:#F09A80; --on:#0F1513; --shadow:rgba(0,0,0,.55); --stripe:1.6%; color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}a:focus-visible, .frame:focus-visible{ outline:2px solid var(--violet); outline-offset:3px }.cert .frame{ background:transparent }@media (max-width:40em){.cert .frame{ padding:.6rem .2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:.5rem 2rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .4rem }.frame{ overflow-x:auto; background:

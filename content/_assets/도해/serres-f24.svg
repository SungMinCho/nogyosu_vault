<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 380" width="900" height="380" class="fig-frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  
  --deep:#F1F5F4;      
  --shoal:#DDE9EC;     
  --shoal2:#C6DAE1;    
  --land:#E8DDBF;      
  --ink:#15212A;
  --ink2:#4B5B64;
  --rule:#9DB2BB;
  
  --cold:#2A5C85;      
  --fire:#AE3A2C;      
  --pass:#1C7255;      
  --order:#86621F;     
  --caution:#9E2E79;   
  --f-display:"Do Hyeon","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Myeongjo","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
  --f-latin:"Crimson Pro","Noto Serif","Georgia",serif;
  --f-mono:"Azeret Mono","Nanum Gothic Coding","Noto Sans Mono CJK KR","D2Coding",ui-monospace,monospace;
  --pad:1.15rem; --measure:39rem; --wide:52rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }}:root[data-theme="dark"]{
  --deep:#0D151A; --shoal:#14222A; --shoal2:#1A2E38; --land:#3A3323;
  --ink:#E2E8E9; --ink2:#A1B1B8; --rule:#3C515B;
  --cold:#7EAED8; --fire:#E7796B; --pass:#5BC29B; --order:#D6AD5E; --caution:#DE7CBF;
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.chart svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); margin-top:2.2rem; }.lecture{ display:contents; }figure.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; border:1px solid var(--rule); background:var(--deep);
  background-image:linear-gradient(to right, var(--deep) 30%, transparent), linear-gradient(to left, var(--deep) 30%, transparent), linear-gradient(to right, rgba(0,0,0,.14), transparent), linear-gradient(to left, rgba(0,0,0,.14), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:2.4rem 100%, 2.4rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; min-width:34rem; }.fig-svg text, .chart text{ font-family:var(--f-body); fill:var(--ink); }.fig-svg .t{ font-size:13px; }.fig-svg .ts{ font-size:11.5px; fill:var(--ink2); }.fig-svg .tb{ font-size:14.5px; font-family:var(--f-display); }.c-fire{ fill:var(--fire) !important }.c-pass{ fill:var(--pass) !important }.c-order{ fill:var(--order) !important }.c-caution{ fill:var(--caution) !important }.s-ink{ stroke:var(--ink) }.s-rule{ stroke:var(--rule) }.s-fire{ stroke:var(--fire) }.s-pass{ stroke:var(--pass) }.s-order{ stroke:var(--order) }.s-caution{ stroke:var(--caution) }.f-none{ fill:none }.f-land{ fill:var(--land) }.f-fire-t{ fill:var(--fire); fill-opacity:.16 }.f-pass-t{ fill:var(--pass); fill-opacity:.16 }.f-caution-t{ fill:var(--caution); fill-opacity:.14 }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.mk-fire{ fill:var(--fire) }.mk-pass{ fill:var(--pass) }.mk-order{ fill:var(--order) }.mk-caution{ fill:var(--caution) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="다섯 갈래의 실이 다섯 권을 지나며 어떻게 바뀌는지 보여 주는 표. 세 번째 사람은 적에서 건너는 자로, 앎의 그림은 그물에서 군도로, 같음은 구조 동형에서 때로는 연결된 앎으로, 불과 메시지는 하나의 환율로 묶이고, 죽음의 실은 처음부터 끝까지 밑에 깔린다." class="fig-svg" height="100%" role="img" viewBox="0 0 900 380" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="F26-ar-caution" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-caution" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F26-ar-fire" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-fire" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F26-ar-order" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-order" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="F26-ar-pass" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-pass" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="tb" text-anchor="middle" x="205" y="28">I 소통</text><text class="tb" text-anchor="middle" x="355" y="28">II 간섭</text><text class="tb" text-anchor="middle" x="505" y="28">III 번역</text><text class="tb" text-anchor="middle" x="655" y="28">IV 분배</text><text class="tb" text-anchor="middle" x="805" y="28">V 북서항로</text><line class="s-ink w15 f-none" x1="130" x2="880" y1="40" y2="40"></line><text class="t c-pass" text-anchor="end" x="116" y="76">세 번째 사람</text><rect class="s-pass f-pass-t w1" height="34" rx="2" width="134" x="138" y="54"></rect><text class="ts" text-anchor="middle" x="205" y="76">배제할 악마</text><line class="s-pass w1 f-none" marker-end="url(#F26-ar-pass)" x1="273" x2="285" y1="71" y2="71"></line><rect class="s-pass f-pass-t w1" height="34" rx="2" width="134" x="288" y="54"></rect><text class="ts" text-anchor="middle" x="355" y="76">가로채는 나</text><line class="s-pass w1 f-none" marker-end="url(#F26-ar-pass)" x1="423" x2="435" y1="71" y2="71"></line><rect class="s-pass f-pass-t w1" height="34" rx="2" width="134" x="438" y="54"></rect><text class="ts" text-anchor="middle" x="505" y="76">번역자·배반자</text><line class="s-pass w1 f-none" marker-end="url(#F26-ar-pass)" x1="573" x2="585" y1="71" y2="71"></line><rect class="s-pass f-pass-t w1" height="34" rx="2" width="134" x="588" y="54"></rect><text class="ts" text-anchor="middle" x="655" y="76">바다 그 자체</text><line class="s-pass w1 f-none" marker-end="url(#F26-ar-pass)" x1="723" x2="735" y1="71" y2="71"></line><rect class="s-pass f-pass-t w1" height="34" rx="2" width="134" x="738" y="54"></rect><text class="ts" text-anchor="middle" x="805" y="76">교육받은 제3자</text><text class="t c-order" text-anchor="end" x="116" y="138">앎의 그림</text><rect class="s-order f-land w1" height="34" rx="2" width="134" x="138" y="116"></rect><text class="ts" text-anchor="middle" x="205" y="138">사슬 → 그물</text><line class="s-order w1 f-none" marker-end="url(#F26-ar-order)" x1="273" x2="285" y1="133" y2="133"></line><rect class="s-order f-land w1" height="34" rx="2" width="134" x="288" y="116"></rect><text class="ts" text-anchor="middle" x="355" y="138">표 · 격자</text><line class="s-order w1 f-none" marker-end="url(#F26-ar-order)" x1="423" x2="435" y1="133" y2="133"></line><rect class="s-order f-land w1" height="34" rx="2" width="134" x="438" y="116"></rect><text class="ts" text-anchor="middle" x="505" y="138">나무의 번역</text><line class="s-order w1 f-none" marker-end="url(#F26-ar-order)" x1="573" x2="585" y1="133" y2="133"></line><rect class="s-order f-land w1" height="34" rx="2" width="134" x="588" y="116"></rect><text class="ts" text-anchor="middle" x="655" y="138">점·그물·구름</text><line class="s-order w1 f-none" marker-end="url(#F26-ar-order)" x1="723" x2="735" y1="133" y2="133"></line><rect class="s-order f-land w1" height="34" rx="2" width="134" x="738" y="116"></rect><text class="ts" text-anchor="middle" x="805" y="138">프랙털 군도</text><text class="t c-order" text-anchor="end" x="116" y="200">같음</text><rect class="s-order f-land w1" height="34" rx="2" width="134" x="138" y="178"></rect><text class="ts" text-anchor="middle" x="205" y="200">구조와 모델</text><line class="s-order w1 f-none" marker-end="url(#F26-ar-order)" x1="273" x2="285" y1="195" y2="195"></line><rect class="s-order f-land w1" height="34" rx="2" width="134" x="288" y="178"></rect><text class="ts" text-anchor="middle" x="355" y="200">운반 · 상호참조</text><line class="s-order w1 f-none" marker-end="url(#F26-ar-order)" x1="423" x2="435" y1="195" y2="195"></line><rect class="s-order f-land w1" height="34" rx="2" width="134" x="438" y="178"></rect><text class="ts" text-anchor="middle" x="505" y="200">최적 불변</text><line class="s-order w1 f-none" marker-end="url(#F26-ar-order)" x1="573" x2="585" y1="195" y2="195"></line><rect class="s-order f-land w1" height="34" rx="2" width="134" x="588" y="178"></rect><text class="ts" text-anchor="middle" x="655" y="200">드문 섬</text><line class="s-order w1 f-none" marker-end="url(#F26-ar-order)" x1="723" x2="735" y1="195" y2="195"></line><rect class="s-order f-land w1" height="34" rx="2" width="134" x="738" y="178"></rect><text class="ts" text-anchor="middle" x="805" y="200">"때로는 연결된"</text><text class="t c-fire" text-anchor="end" x="116" y="262">불과 메시지</text><rect class="s-fire f-fire-t w1" height="34" rx="2" width="134" x="138" y="240"></rect><text class="ts" text-anchor="middle" x="205" y="262">소음 속 소통</text><line class="s-fire w1 f-none" marker-end="url(#F26-ar-fire)" x1="273" x2="285" y1="257" y2="257"></line><rect class="s-fire f-fire-t w1" height="34" rx="2" width="134" x="288" y="240"></rect><text class="ts" text-anchor="middle" x="355" y="262">사물의 정보</text><line class="s-fire w1 f-none" marker-end="url(#F26-ar-fire)" x1="423" x2="435" y1="257" y2="257"></line><rect class="s-fire f-fire-t w1" height="34" rx="2" width="134" x="438" y="240"></rect><text class="ts" text-anchor="middle" x="505" y="262">정보 = 음엔트로피</text><line class="s-fire w1 f-none" marker-end="url(#F26-ar-fire)" x1="573" x2="585" y1="257" y2="257"></line><rect class="s-fire f-fire-t w1" height="34" rx="2" width="134" x="588" y="240"></rect><text class="ts" text-anchor="middle" x="655" y="262">두 가지 모터</text><line class="s-fire w1 f-none" marker-end="url(#F26-ar-fire)" x1="723" x2="735" y1="257" y2="257"></line><rect class="s-fire f-fire-t w1" height="34" rx="2" width="134" x="738" y="240"></rect><text class="ts" text-anchor="middle" x="805" y="262">얼어붙은 불꽃</text><text class="t c-caution" text-anchor="end" x="116" y="324">죽음</text><rect class="s-caution f-caution-t w1" height="34" rx="2" width="134" x="138" y="302"></rect><text class="ts" text-anchor="middle" x="205" y="324">석상의 손</text><line class="s-caution w1 f-none" marker-end="url(#F26-ar-caution)" x1="273" x2="285" y1="319" y2="319"></line><rect class="s-caution f-caution-t w1" height="34" rx="2" width="134" x="288" y="302"></rect><text class="ts" text-anchor="middle" x="355" y="324">죽음의 항목 · 원죄</text><line class="s-caution w1 f-none" marker-end="url(#F26-ar-caution)" x1="423" x2="435" y1="319" y2="319"></line><rect class="s-caution f-caution-t w1" height="34" rx="2" width="134" x="438" y="302"></rect><text class="ts" text-anchor="middle" x="505" y="324">타나토크라시</text><line class="s-caution w1 f-none" marker-end="url(#F26-ar-caution)" x1="573" x2="585" y1="319" y2="319"></line><rect class="s-caution f-caution-t w1" height="34" rx="2" width="134" x="588" y="302"></rect><text class="ts" text-anchor="middle" x="655" y="324">칼 그늘</text><line class="s-caution w1 f-none" marker-end="url(#F26-ar-caution)" x1="723" x2="735" y1="319" y2="319"></line><rect class="s-caution f-caution-t w1" height="34" rx="2" width="134" x="738" y="302"></rect><text class="ts" text-anchor="middle" x="805" y="324">폭력과 성스러움</text><line class="s-rule w1 f-none" x1="130" x2="880" y1="356" y2="356"></line></svg></svg>
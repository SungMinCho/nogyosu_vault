rcle><circle class="st" cx="391.7" cy="132.4" r="10"></circle><circle class="st" cx="345.2" cy="275.6" r="10"></circle><circle class="st" cx="194.8" cy="275.6" r="10"></circle><circle class="st" cx="148.3" cy="132.4" r="10"></circle><text class="t mono" text-anchor="middle" x="270.0" y="24.0">(AB)(CD)</text><text class="t mono" text-anchor="start" x="409.7" y="137.4">A(B(CD))</text><text class="t mono" text-anchor="middle" x="353.2" y="305.6">A((BC)D)</text><text class="t mono" text-anchor="middle" x="186.8" y="305.6">(A(BC))D</text><text class="t mono" text-anchor="end" x="130.3" y="137.4">((AB)C)D</text><text class="t-s" text-anchor="middle" x="270.0" y="176.0">실선 두 걸음</text><text class="t-s" text-anchor="middle" x="270.0" y="196.0">= 점선 세 걸음</text></svg></svg>
ing:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w dia"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="상대주의는 서로 다른 여러 표상이 하나의 자연을 가리키는 그림이다. 다자연주의는 사람이라는 같은 눈이 몸마다 다른 세계, 곧 피와 맥주와 구운 생선을 보는 그림이고, 세 시선을 이어 늘여도 모두가 함께 보는 X에는 닿지 않는다. X는 없다." class="d pz-inner" height="100%" role="img" viewBox="0 0 680 496" width="100%">

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 280" width="720" height="280" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .ser-nv{ fill:none; stroke:var(--c-nv); stroke-width:2 }.dg .ser-mx{ fill:none; stroke:var(--c-mx); stroke-width:2 }.dg .t-nv{ fill:var(--c-nv) }.dg .t-mx{ fill:var(--c-mx) }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:720px!important;height:280px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="확률적 반올림한 내적의 분산 상한이 회전 없이는 블록 크기에 비례해 늘지만 무작위 하다마드 뒤에는 블록 크기의 로그에 비례해 거의 평평하다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 720 280" width="100%"><line class="ln-hair" x1="80" x2="80" y1="40" y2="230"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="80" y="248">16</text><line class="ln-hair" x1="185" x2="185" y1="40" y2="230"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="185" y="248">32</text><line class="ln-hair" x1="290" x2="290" y1="40" y2="230"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="290" y="248">64</text><line class="ln-hair" x1="395" x2="395" y1="40" y2="230"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="395" y="248">128</text><line class="ln-hair" x1="500" x2="500" y1="40" y2="230"></line><text class="t-s t-mono t-mut" text-anchor="middle" x="500" y="248">256</text><polyline class="ser-nv" points="80.0,218.8 185.0,207.6 290.0,185.3 395.0,140.6 500.0,51.2"></polyline><polyline class="ser-mx" points="80.0,218.8 185.0,216.0 290.0,213.2 395.0,210.4 500.0,207.6"></polyline><text class="t-s t-b t-nv" text-anchor="start" x="508" y="55.1765">회전 없이: ∝ b</text><text class="t-s t-b t-mx" text-anchor="start" x="508" y="211.647">RHT 뒤: ∝ log b</text><text class="t-s t-mut" text-anchor="middle" x="290" y="268">블록 크기 b</text><text class="t-s t-mut" text-anchor="start" x="30" y="24">확률적 반올림 내적의 분산 상한 (b = 16을 1로, 도식)</text></svg></g></g></g></g></svg>
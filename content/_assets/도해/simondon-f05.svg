m:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="한계가 시간에 따라 얼마나 바뀌느냐를 가로축으로 놓은 사슬. 왼쪽 끝 벽돌 틀은 몇 초 동안 고정되고 탈형은 한 번이며 평형이 틀 밖에서도 보존된다. 가운데 빚기는 구멍 틀과 매끈한 압연기로 단면은 고정되고 탈형은 연속이다. 줄무늬 압연기에서 변조가 시작되고, 오른쪽 끝 3극관 격자는 한계를 나노초마다 다시 긋는다. 에너지 담지자는 점토, 쇠, 물, 공기, 전자 순으로 묽고 가벼워진다. 아래 왼쪽은 음극, 격자, 양극의 3극관 단면으로 작은 격자 전압이 큰 전류를 조절한다. 아래 오른쪽 로그 눈금에서 시몽동이 적은 수 밀리초는 정정되고 실제 평형 시간은 약 0.7에서 1 나노초, 벽돌의 몇 초와 약 10의 9제곱 배 차이다." class="pz-inner" height="100%" role="img" viewBox="0 0 760 460" width="100%">

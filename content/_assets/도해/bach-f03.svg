<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 352" width="600" height="352" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --flour:#EFF0EB; --flour-2:#E6E8E1; --ink:#1C2025; --ink-soft:#4E555D; --rule:#C7CAC1;
  --iron:#3D4652; --water:#1B7480; --spirit:#6448B0; --grain:#A8721A; --rust:#BF4128;
  --water-t:rgba(27,116,128,.12); --spirit-t:rgba(100,72,176,.11); --grain-t:rgba(168,114,26,.13); --rust-t:rgba(191,65,40,.10); --iron-t:rgba(61,70,82,.10);
  --shadow:rgba(28,32,37,.18);
  --display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --body:"Newsreader","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --label:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","Nanum Gothic Coding",ui-monospace,Menlo,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }}:root[data-theme="dark"]{
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents }.lec-no svg{ width:2.2rem; height:2.2rem; flex:none }.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; overflow-y:hidden; border-block:1px solid var(--rule); padding-block:.8rem; background:linear-gradient(to right, var(--flour) 30%, transparent), linear-gradient(to left, var(--flour) 30%, transparent) 100% 0, radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) 100% 0; background-repeat:no-repeat; background-size:2.2rem 100%, 2.2rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; margin-inline:auto; max-width:46rem }.t{ fill:var(--ink); font-family:var(--label); font-size:13px }.t-soft{ fill:var(--ink-soft) }.t-water{ fill:var(--water) }.t-rust{ fill:var(--rust) }.t-b{ font-weight:600 }.t-sm{ font-size:11.5px }.s-soft{ stroke:var(--ink-soft); fill:none }.s-rule{ stroke:var(--rule); fill:none }.s-water{ stroke:var(--water); fill:none }.s-rust{ stroke:var(--rust); fill:none }.f-bg{ fill:var(--flour) }.f-panel{ fill:var(--flour-2) }.f-water-t{ fill:var(--water-t) }.f-rust-t{ fill:var(--rust-t) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }svg.pz-root{width:600px!important;height:352px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="수학은 모든 형식 언어의 넓은 들판이고, 그 안의 작은 구성적 영역만이 구현 가능한 계산이다. 들판의 나머지(완성된 무한, 이름 붙일 수 없는 실수, 네모난 원)는 명세로만 존재한다." class="pz-inner" data-min="500" height="100%" role="img" style="" viewBox="0 0 600 352" width="100%" xmlns="http://www.w3.org/2000/svg">
<!-- 들판: 명세의 왕국 -->
<path class="f-panel s-soft w15" d="M44 30 C160 10 440 10 556 30 C590 50 594 296 560 320 C440 342 160 342 44 322 C10 300 8 52 44 30 Z"></path>
<text class="t t-b" x="48" y="56">명세의 왕국 — 수학</text>
<text class="t t-sm t-soft" x="48" y="74">모든 형식 언어 · 무엇이든 적을 수 있다</text>
<!-- 구현의 왕국: 계산 -->
<ellipse class="f-water-t s-water w2" cx="184" cy="190" rx="112" ry="70"></ellipse>
<text class="t t-water t-b" text-anchor="middle" x="184" y="156">구현의 왕국 — 계산</text>
<text class="t t-sm t-water" text-anchor="middle" x="184" y="174">구성적 · 유한한 걸음</text>
<g class="t t-sm" text-anchor="middle">
<text x="184" y="202">π = 다가가는 절차</text>
<text x="184" y="220">√2 뉴턴법 · 유한 오토마타</text>
<text x="184" y="238">무한 대신 유계 없음</text>
</g>
<!-- 들판의 나머지: 명세로만 -->
<text class="t t-sm t-soft t-b" x="352" y="98">명세로만 존재 — 구현하는 전이가 없다</text>
<rect class="f-bg s-rule w1" height="54" rx="4" width="196" x="352" y="110"></rect>
<text class="t" x="364" y="132">완성된 무한</text>
<text class="t t-sm t-soft" x="364" y="152">무한 걸음을 다 마친 상태</text>
<rect class="f-bg s-rule w1" height="54" rx="4" width="196" x="352" y="174"></rect>
<text class="t" x="364" y="196">이름 붙일 수 없는 실수</text>
<text class="t t-sm t-soft" x="364" y="216">거의 모든 실수 — 적어 낼 기계가 없다</text>
<!-- 들판 가장자리: 모순 -->
<rect class="f-rust-t s-rust w1" height="54" rx="4" width="196" x="352" y="238"></rect>
<text class="t t-rust" x="364" y="260">네모난 원</text>
<text class="t t-sm t-rust" x="364" y="280">다섯 글자로 적히지만 모순</text>
<!-- 두 차원의 정리 -->
<text class="t t-sm t-soft" x="48" y="290">언어로는: 수학 ⊃ 계산</text>
<text class="t t-sm t-water" x="48" y="308">존재로는: 실재하는 것은 계산뿐</text>
</svg></g></g></g></g></svg>
<text class="tl tm" x="496.0" y="235.0">마이 신들</text>
<rect class="f-panel s-ink w2" height="74" width="226" x="194" y="184"></rect>
<text class="ts tb tm" x="307.0" y="203">샤먼 — 집전자 = 희생물</text>

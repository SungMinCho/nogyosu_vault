-anchor="middle" x="520" y="248">전문가 2</text><rect class="f-rot" height="102.857" rx="0" width="40" x="560" y="127.143"></rect><text class="t-s t-mono" text-anchor="middle" x="580" y="121.143">1.96</text><text class="t-s t-mut" text-anchor="middle" x="580" y="248">전문가 3</text><rect class="f-mut-s" height="10" rx="0" width="40" x="620" y="220"></rect><text class="t-s t-mono t-mut halo" text-anchor="middle" x="640" y="196">0.40</text><text class="t-s t-mut halo" text-anchor="middle" x="640" y="212">(축 아래)</text><text class="t-s t-mut" text-anchor="middle" x="640" y="248">전문가 4</text><line class="ln" x1="424" x2="680" y1="230" y2="230"></line><text class="t-s t-b t-rot" text-anchor="middle" x="550" y="274">top-2 → 전문가 1, 3</text><path class="ln ln-ink" d="M345,108 L385,108" marker-end="url(#m11-ink)"></path></svg></svg>
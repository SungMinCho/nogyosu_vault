<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 310 160" width="310" height="160" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.doc > .masthead, .doc > .toc, .doc > .colophon{ max-width:var(--shell) }.masthead{ display:grid; grid-template-columns:minmax(0,1fr); gap:1.4rem; padding-block:1.2rem .6rem; border-bottom:1px solid var(--line) }@media (min-width:52em){.masthead{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:end }}.mast-fig{ min-width:0 }.hero-svg{ max-width:26rem; margin-inline:auto }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-spike{ fill:var(--spike) }.dg .t-ink{ fill:var(--ink) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-mut{ stroke:var(--muted) }.dg .ln-spike{ stroke:var(--spike) }.dg .f-ink{ fill:var(--ink) }.dg .thick{ stroke-width:2.4 }.dg .clock{ fill:var(--paper); stroke:var(--ink-2); stroke-width:1.2 }.dg .brick{ fill:var(--spike-soft); stroke:var(--spike); stroke-width:.8 }svg.pz-root{width:310px!important;height:160px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w masthead"><g class="pz-w mast-fig"><svg xmlns="http://www.w3.org/2000/svg" aria-label="속도가 다른 두 시계 사이에 RoPE라는 벽돌 벽이 있어 병합된 회전이 넘지 못한다" class="dg hero-svg pz-inner" height="100%" role="img" viewBox="0 0 310 160" width="100%"><circle class="clock" cx="60" cy="70" r="40"></circle><line class="ln ln-mut" x1="60" x2="94" y1="70" y2="70"></line><line class="ln ln-spike thick" x1="60" x2="26.3403" y1="70" y2="65.2019"></line><circle class="f-ink" cx="60" cy="70" r="2.5"></circle><text class="t-s t-b t-ink" text-anchor="middle" x="60" y="126">빠른 시계</text><circle class="clock" cx="250" cy="70" r="40"></circle><line class="ln ln-mut" x1="250" x2="284" y1="70" y2="70"></line><line class="ln ln-spike thick" x1="250" x2="283.985" y1="70" y2="68.9802"></line><circle class="f-ink" cx="250" cy="70" r="2.5"></circle><text class="t-s t-b t-ink" text-anchor="middle" x="250" y="126">느린 시계</text><rect class="brick" height="16" rx="1" width="20" x="140" y="26"></rect><rect class="brick" height="16" rx="1" width="20" x="162" y="26"></rect><rect class="brick" height="16" rx="1" width="20" x="151" y="44"></rect><rect class="brick" height="16" rx="1" width="20" x="173" y="44"></rect><rect class="brick" height="16" rx="1" width="20" x="140" y="62"></rect><rect class="brick" height="16" rx="1" width="20" x="162" y="62"></rect><rect class="brick" height="16" rx="1" width="20" x="151" y="80"></rect><rect class="brick" height="16" rx="1" width="20" x="173" y="80"></rect><rect class="brick" height="16" rx="1" width="20" x="140" y="98"></rect><rect class="brick" height="16" rx="1" width="20" x="162" y="98"></rect><text class="t-s t-b t-spike" text-anchor="middle" x="155" y="130">RoPE</text><text class="t-s t-mut" text-anchor="middle" x="155" y="148">병합 회전은 넘지 못한다</text></svg></g></g></g></svg>
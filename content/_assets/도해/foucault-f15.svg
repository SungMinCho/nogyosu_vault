<defs>
<marker id="d-table-time-ar" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="d-table-time-arl" markerHeight="7" markerUnits="strokeWidth" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-lak" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 시간: 표 바깥에 따로 그은 선 -->
<text class="t b" x="24" y="28">시간 — 표 위에 따로 그은 사건들의 줄</text>
<text class="t-s end mute" x="716" y="28">곧든 꺾이든 돌든, 선 하나</text>

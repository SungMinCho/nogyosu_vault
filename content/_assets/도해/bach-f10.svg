<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 392" width="600" height="392" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --flour:#EFF0EB; --flour-2:#E6E8E1; --ink:#1C2025; --ink-soft:#4E555D; --rule:#C7CAC1;
  --iron:#3D4652; --water:#1B7480; --spirit:#6448B0; --grain:#A8721A; --rust:#BF4128;
  --water-t:rgba(27,116,128,.12); --spirit-t:rgba(100,72,176,.11); --grain-t:rgba(168,114,26,.13); --rust-t:rgba(191,65,40,.10); --iron-t:rgba(61,70,82,.10);
  --shadow:rgba(28,32,37,.18);
  --display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --body:"Newsreader","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --label:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","Nanum Gothic Coding",ui-monospace,Menlo,monospace;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
  color-scheme:light;
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }}:root[data-theme="dark"]{
  --flour:#11151A; --flour-2:#181E25; --ink:#E3E5E0; --ink-soft:#A2A9B0; --rule:#2F363E;
  --iron:#A3AEBB; --water:#52B9C4; --spirit:#AE9AEE; --grain:#E3AC4C; --rust:#F07C61;
  --water-t:rgba(82,185,196,.14); --spirit-t:rgba(174,154,238,.13); --grain-t:rgba(227,172,76,.13); --rust-t:rgba(240,124,97,.12); --iron-t:rgba(163,174,187,.10);
  --shadow:rgba(0,0,0,.55); color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents }.lec-no svg{ width:2.2rem; height:2.2rem; flex:none }.fig{ margin:.6rem 0; }.fig-frame{ overflow-x:auto; overflow-y:hidden; border-block:1px solid var(--rule); padding-block:.8rem; background:linear-gradient(to right, var(--flour) 30%, transparent), linear-gradient(to left, var(--flour) 30%, transparent) 100% 0, radial-gradient(farthest-side at 0 50%, var(--shadow), transparent), radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) 100% 0; background-repeat:no-repeat; background-size:2.2rem 100%, 2.2rem 100%, .8rem 100%, .8rem 100%; background-attachment:local, local, scroll, scroll; }.fig-frame svg{ display:block; width:100%; height:auto; margin-inline:auto; max-width:46rem }.t{ fill:var(--ink); font-family:var(--label); font-size:13px }.t-soft{ fill:var(--ink-soft) }.t-water{ fill:var(--water) }.t-spirit{ fill:var(--spirit) }.t-grain{ fill:var(--grain) }.t-rust{ fill:var(--rust) }.t-b{ font-weight:600 }.t-sm{ font-size:11.5px }.halo{ paint-order:stroke; stroke:var(--flour); stroke-width:4px; stroke-linejoin:round }.s-soft{ stroke:var(--ink-soft); fill:none }.s-water{ stroke:var(--water); fill:none }.s-spirit{ stroke:var(--spirit); fill:none }.s-grain{ stroke:var(--grain); fill:none }.s-rust{ stroke:var(--rust); fill:none }.f-bg{ fill:var(--flour) }.f-soft{ fill:var(--ink-soft) }.f-spirit{ fill:var(--spirit) }.f-grain{ fill:var(--grain) }.f-rust{ fill:var(--rust) }.f-spirit-t{ fill:var(--spirit-t) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.w3{ stroke-width:3 }.dash{ stroke-dasharray:5 4 }svg.pz-root{width:600px!important;height:392px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-frame"><svg aria-label="바깥의 마음이 자기 모형이라는 꼭두각시를 만들어 동기 신호의 줄로 조종한다. 줄은 꼭두각시에게 느낌으로 도착하고, 당기는 손과 꼭두각시 사이의 이음매에서 고통이 생긴다(8강)." class="pz-inner" data-min="520" height="100%" role="img" style="" viewBox="0 0 600 392" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="f10-g" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-grain" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="f10-s" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-soft" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<!-- 바깥의 마음 -->
<rect class="f-spirit-t" height="360" rx="6" width="560" x="20" y="16"></rect>
<text class="t t-spirit t-b" x="36" y="42">바깥의 마음 — 생성하는 자</text>
<!-- 계산들 -->
<g class="s-water w15">
<rect class="f-bg" height="30" rx="15" width="120" x="40" y="70"></rect>
<rect class="f-bg" height="30" rx="15" width="120" x="40" y="110"></rect>
<rect class="f-bg" height="30" rx="15" width="120" x="40" y="150"></rect>
</g>
<text class="t t-water" text-anchor="middle" x="100" y="90">지각</text>
<text class="t t-water" text-anchor="middle" x="100" y="130">평가</text>
<text class="t t-water" text-anchor="middle" x="100" y="170">동기 계산</text>
<text class="t t-sm t-soft" x="40" y="202">설정값 − 현재값</text>
<!-- 계산 → 손 -->
<path class="s-grain w15" d="M162 160 C 210 150, 230 120, 254 103" marker-end="url(#f10-g)"></path>
<text class="t t-sm t-grain halo" x="196" y="128">줄에 실음</text>
<!-- 손: 조종 막대 -->
<g class="s-spirit w3">
<line x1="262" x2="398" y1="96" y2="96"></line>
<line x1="330" x2="330" y1="74" y2="120"></line>
</g>
<text class="t t-spirit t-b" x="410" y="101">손 — 줄을 당긴다</text>
<text class="t t-grain t-b" x="404" y="150">동기 신호</text>
<text class="t t-sm t-grain" x="404" y="167">배고픔 같은 것</text>
<!-- 자기 모형 상자 -->
<rect class="f-bg s-spirit w15" height="160" rx="4" width="270" x="200" y="186"></rect>
<!-- 줄 = 동기 신호: 위는 당김, 이음매 아래는 느낌 -->
<g class="s-grain w15">
<line x1="266" x2="274.7" y1="96" y2="186"></line>
<line x1="394" x2="385.3" y1="96" y2="186"></line>
<line x1="330" x2="330" y1="120" y2="186"></line>
</g>
<g class="s-grain w15 dash">
<line marker-end="url(#f10-g)" x1="274.7" x2="281.5" y1="186" y2="258"></line>
<line marker-end="url(#f10-g)" x1="385.3" x2="378.5" y1="186" y2="258"></line>
<line marker-end="url(#f10-g)" x1="330" x2="330" y1="186" y2="205"></line>
</g>
<!-- 이음매 = 고통의 자리 -->
<line class="s-rust w3" x1="200" x2="470" y1="186" y2="186"></line>
<g class="f-rust">
<circle cx="274.7" cy="186" r="4.5"></circle>
<circle cx="330" cy="186" r="4.5"></circle>
<circle cx="385.3" cy="186" r="4.5"></circle>
</g>
<text class="t t-sm t-rust t-b" x="482" y="182">이음매에서</text>
<text class="t t-sm t-rust" x="482" y="199">아픔이 고통으로</text>
<text class="t t-sm t-rust t-b" x="482" y="218">→ 8강</text>
<!-- 꼭두각시 -->
<circle class="f-spirit-t s-spirit w2" cx="330" cy="222" r="13"></circle>
<g class="s-spirit w2">
<line x1="330" x2="330" y1="235" y2="290"></line>
<polyline points="330,246 305,255 282,262"></polyline>
<polyline points="330,246 355,255 378,262"></polyline>
<polyline points="330,290 319,312 314,336"></polyline>
<polyline points="330,290 341,312 346,336"></polyline>
</g>
<g class="f-spirit">
<circle cx="305" cy="255" r="2.5"></circle><circle cx="355" cy="255" r="2.5"></circle>
<circle cx="319" cy="312" r="2.5"></circle><circle cx="341" cy="312" r="2.5"></circle>
</g>
<text class="t t-sm t-grain t-b" x="210" y="298">느낌으로 도착</text>
<text class="t t-sm" x="210" y="315">“내가 배고프다”</text>
<text class="t t-sm t-soft" x="392" y="298">자기 줄은</text>
<text class="t t-sm t-soft" x="392" y="315">보지 못한다</text>
<text class="t t-spirit t-b" x="200" y="366">자기 모형 — 꼭두각시 · NPC</text>
<!-- 왼쪽 주석 -->
<text class="t t-sm t-soft" x="40" y="300">보는 자가 아니라</text>
<text class="t t-sm t-soft" x="40" y="316">결과가 적히는 자리</text>
<line class="s-soft w1" marker-end="url(#f10-s)" x1="152" x2="194" y1="306" y2="306"></line>
</svg></g></g></g></g></svg>
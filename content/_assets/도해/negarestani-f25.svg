<text class="tm pb" x="16" y="80">‘Iₒ be₁’</text><text class="tm" x="16" y="96">마주한 것</text><text class="tm pb" x="16" y="130">‘Iₒ be₂’</text><text class="tm" x="16" y="146">떠올린 것</text><text class="tm pb" x="16" y="180">‘Iₒ be₃’</text><text class="tm" x="16" y="196">예기한 것</text><text class="ts c" x="179" y="81">이다</text><text class="tm c" x="179" y="97">지금 것을 지금으로</text><text class="ts c" x="289" y="81">이었다</text><text class="tm c" x="289" y="97">인상의 기억</text><text class="ts c" x="179" y="131">기억의 인상</text><text class="tm c" x="179" y="147">기억이 지금 떠오름</text><text class="ts c" x="399" y="131">또 그러겠지</text><text class="tm c" x="399" y="147">기억한 것을 예기</text><text class="ts c" x="179" y="181">역시 왔다</text><text class="tm c vm" x="179" y="197">예측 오차의 자리</text><text class="ts c" x="289" y="181">올 줄 알았지</text><text class="tm c" x="289" y="197">예기를 기억</text>

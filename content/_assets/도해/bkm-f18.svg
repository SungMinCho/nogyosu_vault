r(--paper)"/><g class="pz-w wrap"><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig narrow"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="시장 샤프 비율 0.44와 정보비율 0.20을 직각의 두 변으로 하는 삼각형. 최적 포트폴리오의 샤프 비율은 빗변 0.483으로, 단순 합 0.64보다 훨씬 짧다." class="dg pz-inner" height="100%" role="img" viewBox="0 0 420 212" width="100%">

<text class="t t-spirit" text-anchor="middle" x="270" y="357">1 반응적 생존</text>
<text class="t t-spirit" text-anchor="middle" x="270" y="309">2 개인적 자아</text>
<text class="t t-spirit t-b" text-anchor="middle" x="270" y="261">3 사회적 자아</text>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 790 334" width="790" height="334" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .f-ink{ fill:var(--ink) }.dg .f-mut{ fill:var(--muted) }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .f-grid{ fill:var(--grid) }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:790px!important;height:334px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="평평한 벡터를 하다마드만으로 돌리면 한 칸에 몰리지만, 부호 하나를 먼저 뒤집어 두면 다시 평평하게 나온다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 790 334" width="100%"><defs><marker id="f3-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f3-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f3-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-b t-spike" text-anchor="start" x="30" y="20">H만</text><text class="t-s t-mut" text-anchor="start" x="150" y="20">평평한 입력이 하필 첫 행 무늬와 맞아 한 칸에 몰린다</text><line class="ln" x1="36" x2="162" y1="86" y2="86"></line><rect class="f-mut" height="23" rx="0" width="22" x="40" y="63"></rect><rect class="f-mut" height="23" rx="0" width="22" x="70" y="63"></rect><rect class="f-mut" height="23" rx="0" width="22" x="100" y="63"></rect><rect class="f-mut" height="23" rx="0" width="22" x="130" y="63"></rect><text class="t-s t-mono" text-anchor="start" x="40" y="126">(0.5, 0.5, 0.5, 0.5)</text><text class="t-s t-b t-mut" text-anchor="start" x="40" y="142">κ = 1</text><line class="ln" marker-end="url(#f3-ink)" x1="240" x2="330" y1="86" y2="86"></line><text class="t-s t-b" text-anchor="middle" x="285" y="78">× H₄/2</text><line class="ln" x1="366" x2="492" y1="86" y2="86"></line><rect class="f-spike" height="46" rx="0" width="22" x="370" y="40"></rect><rect class="f-spike" height="1.5" rx="0" width="22" x="400" y="86"></rect><rect class="f-spike" height="1.5" rx="0" width="22" x="430" y="86"></rect><rect class="f-spike" height="1.5" rx="0" width="22" x="460" y="86"></rect><text class="t-s t-mono" text-anchor="start" x="370" y="126">(1, 0, 0, 0)</text><text class="t-s t-b t-spike" text-anchor="start" x="370" y="142">κ = 2</text><text class="t-b t-rot" text-anchor="start" x="30" y="170">D 먼저, 그다음 H</text><text class="t-s t-mut" text-anchor="start" x="150" y="170">부호를 무작위로 뒤집어 두면 그런 불운이 사라진다</text><line class="ln" x1="36" x2="162" y1="236" y2="236"></line><rect class="f-mut" height="23" rx="0" width="22" x="40" y="213"></rect><rect class="f-grid" height="23" rx="0" width="22" x="70" y="236"></rect><rect class="f-mut" height="23" rx="0" width="22" x="100" y="213"></rect><rect class="f-mut" height="23" rx="0" width="22" x="130" y="213"></rect><text class="t-s t-mono" text-anchor="start" x="40" y="276">(0.5, -0.5, 0.5, 0.5)</text><text class="t-s t-b t-mut" text-anchor="start" x="40" y="292">κ = 1</text><line class="ln" marker-end="url(#f3-ink)" x1="240" x2="330" y1="236" y2="236"></line><text class="t-s t-b" text-anchor="middle" x="285" y="228">× H₄/2</text><line class="ln" x1="366" x2="492" y1="236" y2="236"></line><rect class="f-rot" height="23" rx="0" width="22" x="370" y="213"></rect><rect class="f-rot" height="23" rx="0" width="22" x="400" y="213"></rect><rect class="f-rot" height="23" rx="0" width="22" x="430" y="236"></rect><rect class="f-rot" height="23" rx="0" width="22" x="460" y="213"></rect><text class="t-s t-mono" text-anchor="start" x="370" y="276">(0.5, 0.5, -0.5, 0.5)</text><text class="t-s t-b t-rot" text-anchor="start" x="370" y="292">κ = 1</text><text class="t-s t-mut" text-anchor="start" x="40" y="322">두 번째 줄의 입력은 첫 줄의 두 번째 부호만 뒤집은 것 (D = diag(1, −1, 1, 1)). 금색 막대는 음수.</text></svg></g></g></g></g></svg>
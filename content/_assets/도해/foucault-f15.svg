<text class="t-s mid" x="256" y="210">네발짐승</text>
<text class="t-s mid b c-azu" x="303" y="210">원숭이</text>
<text class="t-s mid" x="342" y="210">사람</text>
<text class="t-s b c-azu" x="24" y="246">빈틈없는 그물 — 형질로 이웃한다</text>
<text class="t-s mute" x="24" y="262">폴립·날다람쥐·원숭이가 사이를 메운다 (보네)</text>

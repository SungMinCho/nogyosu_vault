<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 330" width="720" height="330" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2-t{ fill:var(--ink-2); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-madder{ stroke:var(--madder); }.f-madder-t{ fill:var(--madder); }.f-ochre{ stroke:var(--ochre); }.f-ochre-t{ fill:var(--ochre); }.f-ochre-f{ fill:var(--ochre-soft); }.f-mend-t{ fill:var(--mend); }.f-panel-f{ fill:var(--panel); }.f-none{ fill:none; }.f-dash{ stroke-dasharray:6 5; }.f-dot{ stroke-dasharray:2 4; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-l{ font-size:15px; }svg .t-mono{ font-family:var(--f-mono); }svg .t-b{ font-weight:700; }svg .halo{ paint-order:stroke; stroke:var(--panel); stroke-width:4px; stroke-linejoin:round; }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="연결 종합: 흐름을 내는 기계 옆에 그 흐름을 끊어 받는 기계가 '그리고… 그다음에'로 이어 붙고, 입처럼 한 기관이 여러 흐름에 동시에 꽂힌다. 그 짝짓기가 극한에 이른 자리에서 모든 것이 멈추는 기관 없는 몸이 셋째 항으로 끼어들지만, 계열은 삼각형이 되지 않고 2·1·2·1의 선으로 이어진다." height="100%" role="img" viewBox="0 0 720 330" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f01-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f01-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f01-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f01-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f01-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f01-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f01-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="f-ink2-t t-s" text-anchor="start" x="16" y="26">연결 종합 — 생산의 생산</text><rect class="f-ink f-panel-f" height="44" rx="2" stroke-width="1.5" width="104" x="16" y="92"></rect><text class="f-ink-t" text-anchor="middle" x="68.0" y="118.5">젖가슴</text><rect class="f-ink f-panel-f" height="44" rx="2" stroke-width="1.5" width="104" x="160" y="92"></rect><text class="f-ink-t" text-anchor="middle" x="212.0" y="118.5">입</text><rect class="f-ink f-panel-f" height="44" rx="2" stroke-width="1.5" width="104" x="304" y="92"></rect><text class="f-ink-t" text-anchor="middle" x="356.0" y="118.5">위장</text><rect class="f-ink f-panel-f" height="44" rx="2" stroke-width="1.5" width="104" x="448" y="92"></rect><text class="f-ink-t" text-anchor="middle" x="500.0" y="118.5">장</text><rect class="f-ink f-panel-f" height="44" rx="2" stroke-width="1.5" width="104" x="592" y="92"></rect><text class="f-ink-t" text-anchor="middle" x="644.0" y="118.5">항문</text><line class="f-madder f-none" marker-end="url(#f01-a-madder)" stroke-width="2" x1="122" x2="157" y1="114.0" y2="114.0"></line><text class="f-madder-t t-s halo" text-anchor="middle" x="140.0" y="105.0">젖</text><line class="f-indigo f-none" stroke-width="3" x1="160.5" x2="160.5" y1="100" y2="128"></line><line class="f-madder f-none" marker-end="url(#f01-a-madder)" stroke-width="2" x1="266" x2="301" y1="114.0" y2="114.0"></line><text class="f-madder-t t-s halo" text-anchor="middle" x="284.0" y="105.0">삼킨 것</text><line class="f-indigo f-none" stroke-width="3" x1="304.5" x2="304.5" y1="100" y2="128"></line><line class="f-madder f-none" marker-end="url(#f01-a-madder)" stroke-width="2" x1="410" x2="445" y1="114.0" y2="114.0"></line><text class="f-madder-t t-s halo" text-anchor="middle" x="428.0" y="105.0">흐름</text><line class="f-indigo f-none" stroke-width="3" x1="448.5" x2="448.5" y1="100" y2="128"></line><line class="f-madder f-none" marker-end="url(#f01-a-madder)" stroke-width="2" x1="554" x2="589" y1="114.0" y2="114.0"></line><text class="f-madder-t t-s halo" text-anchor="middle" x="572.0" y="105.0">흐름</text><line class="f-indigo f-none" stroke-width="3" x1="592.5" x2="592.5" y1="100" y2="128"></line><text class="f-indigo-t t-s" text-anchor="middle" x="212.0" y="166">절단 = 흐름의 일부를 끊어 받기</text><line class="f-indigo f-none f-dot" stroke-width="1" x1="152.0" x2="182.0" y1="152" y2="138"></line><line class="f-madder f-none" marker-end="url(#f01-a-madder)" stroke-width="1.6" x1="186.0" x2="186.0" y1="44" y2="89"></line><line class="f-madder f-none" marker-end="url(#f01-a-madder)" stroke-width="1.6" x1="238.0" x2="238.0" y1="89" y2="44"></line><text class="f-madder-t t-s" text-anchor="end" x="178.0" y="52">숨</text><text class="f-madder-t t-s" text-anchor="start" x="246.0" y="52">말</text><line class="f-madder f-none" marker-end="url(#f01-a-madder)" stroke-width="2" x1="698" x2="712" y1="114.0" y2="114.0"></line><text class="f-ink2-t t-s" text-anchor="start" x="16" y="206">이항-선형 계열</text><rect class="f-ink f-panel-f" height="34" rx="2" stroke-width="1.5" width="44" x="16" y="232"></rect><rect class="f-ink f-panel-f" height="34" rx="2" stroke-width="1.5" width="44" x="72" y="232"></rect><line class="f-madder f-none" stroke-width="2" x1="60" x2="72" y1="249" y2="249"></line><ellipse class="f-ochre f-ochre-f" cx="186" cy="249" rx="62" ry="26" stroke-width="1.8"></ellipse><text class="f-ochre-t t-s" text-anchor="middle" x="186" y="244">기관 없는 몸</text><text class="f-ochre-t t-s" text-anchor="middle" x="186" y="263">정지</text><rect class="f-ink f-panel-f" height="34" rx="2" stroke-width="1.5" width="44" x="262" y="232"></rect><rect class="f-ink f-panel-f" height="34" rx="2" stroke-width="1.5" width="44" x="318" y="232"></rect><line class="f-madder f-none" stroke-width="2" x1="306" x2="318" y1="249" y2="249"></line><ellipse class="f-ochre f-ochre-f" cx="432" cy="249" rx="62" ry="26" stroke-width="1.8"></ellipse><text class="f-ochre-t t-s" text-anchor="middle" x="432" y="244">기관 없는 몸</text><text class="f-ochre-t t-s" text-anchor="middle" x="432" y="263">정지</text><rect class="f-ink f-panel-f" height="34" rx="2" stroke-width="1.5" width="44" x="508" y="232"></rect><rect class="f-ink f-panel-f" height="34" rx="2" stroke-width="1.5" width="44" x="564" y="232"></rect><line class="f-madder f-none" stroke-width="2" x1="552" x2="564" y1="249" y2="249"></line><path class="f-ochre f-none f-dash" d="M616,249 q20,-12 40,0 t40,0" stroke-width="1.8"></path><text class="f-ink-t t-l t-mono t-b" text-anchor="middle" x="66" y="296">2</text><text class="f-ink-t t-l t-mono t-b" text-anchor="middle" x="186" y="296">1</text><text class="f-ink-t t-l t-mono t-b" text-anchor="middle" x="312" y="296">2</text><text class="f-ink-t t-l t-mono t-b" text-anchor="middle" x="432" y="296">1</text><text class="f-ink-t t-l t-mono t-b" text-anchor="middle" x="558" y="296">2</text><text class="f-ink-t t-l t-mono t-b" text-anchor="middle" x="676" y="296">…</text><text class="f-ink2-t t-s" text-anchor="middle" x="360.0" y="320">셋째 항이 끼어들어도 삼각형(엄마-아빠-나)이 되지 않는다</text></svg></svg>
<line class="s-ink w15" marker-end="url(#f01-ar-ink)" x1="438" x2="493" y1="128" y2="128"></line>
<circle class="f-paper s-brk w15" cx="571" cy="36" r="11"></circle>
<text class="t t-b t-brk" text-anchor="middle" x="571" y="41">?</text>
<text class="t-s t-mute" x="590" y="32">구성된 개체에서</text>
<text class="t-s t-mute" x="590" y="46">거슬러 찾음</text>
<line class="s-brk w15 dash" marker-end="url(#f01-ar-brk)" x1="571" x2="571" y1="48" y2="100"></line>
<text class="t-s t-b t-brk" x="580" y="72">원자론</text>
<text class="t-s t-brk" x="580" y="87">개체화 뒤에서 멈춤</text>
<path class="f-none s-brk w15 dash" d="M560,33 C440,0 240,2 153,100" marker-end="url(#f01-ar-brk)"></path>
<text class="t-s t-b t-brk" text-anchor="middle" x="361" y="54">질료형상론</text>
<text class="t-s t-brk" text-anchor="middle" x="361" y="69">개체화 앞에서 멈춤</text>
<text class="t-s t-mute" text-anchor="middle" x="361" y="93">어느 쪽도 가운데에 들어가지 않음</text>
<line class="s-rule w1 dot" x1="20" x2="700" y1="182" y2="182"></line>

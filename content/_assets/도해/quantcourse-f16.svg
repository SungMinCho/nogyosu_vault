<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 392" width="640" height="392" class="fig-frame fig wide lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --paper:#F3F2F6; --panel:#FAF9FC; --band:#ECEAF1;
  --ink:#1E1B26; --ink-2:#4F4A5C; --ink-3:#7E788B; --rule:#D8D4E0;
  --step:#5A3E9B; --sig:#8F6B00; --tooth:#B42A62; --fix:#0A7FA0;
  --step-soft:#E6E0F3; --sig-soft:#F2E8D0; --tooth-soft:#F6DFE8; --fix-soft:#D8EDF3; --fix-faint:rgba(10,127,160,.08);
  --f-display:"Grandiflora One","Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --f-mono:"Sometype Mono","Nanum Gothic Coding",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-diag:"Nanum Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15131B; --panel:#1D1A25; --band:#1B1922;
  --ink:#ECE9F2; --ink-2:#B9B4C6; --ink-3:#8C8799; --rule:#34303F;
  --step:#8E78E0; --sig:#BC8A12; --tooth:#E0607A; --fix:#22A6B4;
  --step-soft:#2B2444; --sig-soft:#33290F; --tooth-soft:#3B1E2B; --fix-soft:#11303A; --fix-faint:rgba(34,166,180,.10);
  color-scheme:dark; }}:root[data-theme="dark"]{
  --paper:#15131B; --panel:#1D1A25; --band:#1B1922;
  --ink:#ECE9F2; --ink-2:#B9B4C6; --ink-3:#8C8799; --rule:#34303F;
  --step:#8E78E0; --sig:#BC8A12; --tooth:#E0607A; --fix:#22A6B4;
  --step-soft:#2B2444; --sig-soft:#33290F; --tooth-soft:#3B1E2B; --fix-soft:#11303A; --fix-faint:rgba(34,166,180,.10);
  color-scheme:dark; }@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.3rem; padding-inline:var(--pad); padding-block:0 3rem }.lecture{ display:contents }.hero-fig svg{ width:100%; height:auto; display:block }.fig{ margin-block:.6rem !important }.fig-frame{ background:var(--panel); border:1px solid var(--rule); border-radius:4px; overflow-x:auto;
  background-image:linear-gradient(to right,var(--panel),var(--panel)),linear-gradient(to right,var(--panel),var(--panel)),
    linear-gradient(to right,rgba(0,0,0,.12),transparent),linear-gradient(to left,rgba(0,0,0,.12),transparent);
  background-position:left center,right center,left center,right center; background-repeat:no-repeat;
  background-size:20px 100%,20px 100%,10px 100%,10px 100%; background-attachment:local,local,scroll,scroll }.fig-frame svg{ display:block; width:100%; min-width:540px; height:auto; padding:.4rem }.dg{ font-family:var(--f-diag); font-size:12px }.dg text{ fill:var(--ink) }.dg .t-ink{ fill:var(--ink) }.dg .t-ink2{ fill:var(--ink-2) }.dg .t-step{ fill:var(--step) }.dg .t-sig{ fill:var(--sig) }.dg .t-tooth{ fill:var(--tooth) }.dg line, .dg polyline, .dg path, .dg ellipse{ fill:none }.dg .s-ink2{ stroke:var(--ink-2) }.dg .s-step{ stroke:var(--step) }.dg .s-sig{ stroke:var(--sig) }.dg .s-tooth{ stroke:var(--tooth) }.dg .f-tooth{ fill:var(--tooth) }.dg .f-step-soft{ fill:var(--step-soft) }.dg .f-sig-soft{ fill:var(--sig-soft) }.dg .f-paper{ fill:var(--panel) }.dg .mk-ink{ fill:var(--ink) }.dg .mk-ink2{ fill:var(--ink-2) }.dg .mk-step{ fill:var(--step) }.dg .mk-sig{ fill:var(--sig) }.dg .mk-tooth{ fill:var(--tooth) }.dg .mk-fix{ fill:var(--fix) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="커틀러의 1차 오차 되먹임은 한 표본의 반올림 오차를 다음 표본 하나에 계수 1로 넘기고, GPTQ는 한 열의 오차를 뒤의 모든 열에 헤시안이 정한 계수로 넘긴다." class="dg" height="100%" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 640 392" width="100%"><defs><marker id="fb-a-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="fb-a-step" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-step" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="fb-a-sig" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-sig" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="fb-a-tooth" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-tooth" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="fb-a-fix" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-fix" d="M0,1 L10,5 L0,9 z"></path></marker><marker id="fb-a-ink2" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="mk-ink2" d="M0,1 L10,5 L0,9 z"></path></marker></defs><text class="t-ink" style="font-size:12.5px;font-weight:600" x="20" y="26">(가) 커틀러 1954 · 1차 오차 되먹임</text><text class="t-sig" style="font-size:13px;font-weight:600" text-anchor="middle" x="40" y="75">w<tspan dy="4" font-size="10">t</tspan></text><line class="s-ink2" marker-end="url(#fb-a-ink2)" stroke-width="1.4" x1="56" x2="111" y1="70" y2="70"></line><circle class="f-paper s-ink2" cx="126" cy="70" r="13" stroke-width="1.4"></circle><text class="t-ink" style="font-size:15px;font-weight:600" text-anchor="middle" x="126" y="75">+</text><line class="s-ink2" marker-end="url(#fb-a-ink2)" stroke-width="1.4" x1="139" x2="214" y1="70" y2="70"></line><rect class="f-step-soft s-step" height="40" rx="4" stroke-width="1.4" width="86" x="216" y="50"></rect><text class="t-step" style="font-size:12px;font-weight:600" text-anchor="middle" x="259" y="75">Q 반올림</text><line class="s-ink2" marker-end="url(#fb-a-ink2)" stroke-width="1.4" x1="302" x2="418" y1="70" y2="70"></line><text class="t-step" style="font-size:13px;font-weight:600" text-anchor="middle" x="438" y="75">ŵ<tspan dy="4" font-size="10">t</tspan></text><circle class="f-tooth" cx="180" cy="70" r="3"></circle><circle class="f-tooth" cx="360" cy="70" r="3"></circle><polyline class="s-tooth" marker-end="url(#fb-a-tooth)" points="180,70 180,126 256,126" stroke-width="1.3"></polyline><polyline class="s-tooth" marker-end="url(#fb-a-tooth)" points="360,70 360,126 284,126" stroke-width="1.3"></polyline><circle class="f-paper s-tooth" cx="270" cy="126" r="12" stroke-width="1.3"></circle><text class="t-tooth" style="font-size:15px;font-weight:600" text-anchor="middle" x="270" y="131">−</text><text class="t-tooth" style="font-size:10px" text-anchor="middle" x="204" y="120">입력</text><text class="t-tooth" style="font-size:10px" text-anchor="middle" x="336" y="120">출력</text><polyline class="s-tooth" marker-end="url(#fb-a-tooth)" points="270,138 270,168 126,168 126,132" stroke-width="1.3"></polyline><text class="t-tooth" style="font-size:11px" text-anchor="middle" x="200" y="184">오차 e<tspan dy="4" font-size="9">t</tspan><tspan dy="-4"> = 입력 − 출력</tspan></text><rect class="f-paper s-tooth" height="30" rx="4" stroke-width="1.3" width="52" x="100" y="100"></rect><text class="t-tooth" style="font-size:12.5px;font-weight:600" text-anchor="middle" x="126" y="120">z⁻¹</text><line class="s-tooth" marker-end="url(#fb-a-tooth)" stroke-width="1.3" x1="126" x2="126" y1="100" y2="85"></line><text class="t-ink2" style="font-size:11px" x="470" y="66">한 표본 늦춰</text><text class="t-ink2" style="font-size:11px" x="470" y="82">다음 표본 하나에 계수 1로</text><text class="t-ink" style="font-size:12.5px;font-weight:600" x="20" y="204">(나) GPTQ = LDLQ · 열 단위 오차 되먹임</text><rect class="f-step-soft s-step" height="40" rx="4" stroke-width="1.3" width="60" x="40" y="262"></rect><text class="t-step" style="font-size:13px;font-weight:600" text-anchor="middle" x="70" y="287">W₁</text><rect class="f-sig-soft s-sig" height="40" rx="4" stroke-width="1.3" width="60" x="114" y="262"></rect><text class="t-sig" style="font-size:13px;font-weight:600" text-anchor="middle" x="144" y="287">W₂</text><rect class="f-sig-soft s-sig" height="40" rx="4" stroke-width="1.3" width="60" x="188" y="262"></rect><text class="t-sig" style="font-size:13px;font-weight:600" text-anchor="middle" x="218" y="287">W₃</text><rect class="f-sig-soft s-sig" height="40" rx="4" stroke-width="1.3" width="60" x="262" y="262"></rect><text class="t-sig" style="font-size:13px;font-weight:600" text-anchor="middle" x="292" y="287">W₄</text><rect class="f-sig-soft s-sig" height="40" rx="4" stroke-width="1.3" width="60" x="336" y="262"></rect><text class="t-sig" style="font-size:13px;font-weight:600" text-anchor="middle" x="366" y="287">W₅</text><rect class="f-sig-soft s-sig" height="40" rx="4" stroke-width="1.3" width="60" x="410" y="262"></rect><text class="t-sig" style="font-size:13px;font-weight:600" text-anchor="middle" x="440" y="287">W₆</text><text class="t-sig" style="font-size:13px;font-weight:600" x="492" y="287">…  W<tspan dy="4" font-size="10">n</tspan></text><line class="s-step" marker-end="url(#fb-a-step)" stroke-width="1.4" x1="70" x2="70" y1="302" y2="336"></line><text class="t-step" style="font-size:11.5px;font-weight:600" text-anchor="middle" x="70" y="352">Q₁ = quant(W₁)</text><text class="t-tooth" style="font-size:11.5px;font-weight:600" x="140" y="378">E₁ = (W₁ − Q₁)/U₁₁</text><path class="s-tooth" d="M84,262 C90,228 134,228 144,260" marker-end="url(#fb-a-tooth)" stroke-width="1.2"></path><path class="s-tooth" d="M84,262 C90,228 208,228 218,260" marker-end="url(#fb-a-tooth)" stroke-width="1.2"></path><path class="s-tooth" d="M84,262 C90,228 282,228 292,260" marker-end="url(#fb-a-tooth)" stroke-width="1.2"></path><path class="s-tooth" d="M84,262 C90,228 356,228 366,260" marker-end="url(#fb-a-tooth)" stroke-width="1.2"></path><path class="s-tooth" d="M84,262 C90,228 430,228 440,260" marker-end="url(#fb-a-tooth)" stroke-width="1.2"></path><text class="t-tooth" style="font-size:11px" text-anchor="middle" x="299" y="222">− E₁ · U₁,ⱼ  (촐레스키 행 = 회귀 계수)</text><text class="t-ink2" style="font-size:11px" x="470" y="336">뒤의 모든 열에,</text><text class="t-ink2" style="font-size:11px" x="470" y="352">H가 정한 계수로 나눠 줌</text></svg></svg>
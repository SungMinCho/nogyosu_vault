<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 320" width="760" height="320" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .bar-nv{ fill:var(--c-nv) }.dg .bar-mx{ fill:var(--c-mx) }.dg .t-nv{ fill:var(--c-nv) }.dg .t-mx{ fill:var(--c-mx) }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="Llama-3.1-8B-Instruct W4A4에서 반올림에 하다마드를 더하면 NVFP4 회복률은 94.67에서 93.82로 떨어지고 MXFP4는 87.83에서 89.26으로 오른다. MR-GPTQ는 각각 96.08과 93.31" class="dg" height="100%" role="img" style="" viewBox="0 0 760 320" width="100%"><line class="ln-hair" x1="80" x2="600" y1="250" y2="250"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="254">75%</text><line class="ln-hair" x1="80" x2="600" y1="208" y2="208"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="212">80%</text><line class="ln-hair" x1="80" x2="600" y1="166" y2="166"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="170">85%</text><line class="ln-hair" x1="80" x2="600" y1="124" y2="124"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="128">90%</text><line class="ln-hair" x1="80" x2="600" y1="82" y2="82"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="86">95%</text><line class="ln-hair" x1="80" x2="600" y1="40" y2="40"></line><text class="t-s t-mono t-mut" text-anchor="end" x="72" y="44">100%</text><rect class="bar-nv" height="165.228" rx="0" width="30" x="100" y="84.772"></rect><text class="t-s t-mono" text-anchor="middle" x="115" y="78.772">94.7</text><rect class="bar-mx" height="107.772" rx="0" width="30" x="134" y="142.228"></rect><text class="t-s t-mono" text-anchor="middle" x="149" y="136.228">87.8</text><text class="t-s" text-anchor="middle" x="132" y="268">RTN</text><rect class="bar-nv" height="158.088" rx="0" width="30" x="204" y="91.912"></rect><text class="t-s t-mono" text-anchor="middle" x="219" y="85.912">93.8</text><rect class="bar-mx" height="119.784" rx="0" width="30" x="238" y="130.216"></rect><text class="t-s t-mono" text-anchor="middle" x="253" y="124.216">89.3</text><text class="t-s" text-anchor="middle" x="236" y="268">RTN + 하다마드</text><rect class="bar-nv" height="157.92" rx="0" width="30" x="308" y="92.08"></rect><text class="t-s t-mono" text-anchor="middle" x="323" y="86.08">93.8</text><rect class="bar-mx" height="39.48" rx="0" width="30" x="342" y="210.52"></rect><text class="t-s t-mono" text-anchor="middle" x="357" y="204.52">79.7</text><text class="t-s" text-anchor="middle" x="340" y="268">QuaRot</text><rect class="bar-nv" height="175.728" rx="0" width="30" x="412" y="74.272"></rect><text class="t-s t-mono" text-anchor="middle" x="427" y="68.272">95.9</text><rect class="bar-mx" height="121.548" rx="0" width="30" x="446" y="128.452"></rect><text class="t-s t-mono" text-anchor="middle" x="461" y="122.452">89.5</text><text class="t-s" text-anchor="middle" x="444" y="268">GPTQ</text><rect class="bar-nv" height="177.072" rx="0" width="30" x="516" y="72.928"></rect><text class="t-s t-mono" text-anchor="middle" x="531" y="66.928">96.1</text><rect class="bar-mx" height="153.804" rx="0" width="30" x="550" y="96.196"></rect><text class="t-s t-mono" text-anchor="middle" x="565" y="90.196">93.3</text><text class="t-s t-b" text-anchor="middle" x="548" y="268">MR-GPTQ</text><rect class="bar-nv" height="10" rx="0" width="10" x="620" y="60"></rect><text class="t-s t-b" text-anchor="start" x="636" y="69">NVFP4</text><rect class="bar-mx" height="10" rx="0" width="10" x="620" y="82"></rect><text class="t-s t-b" text-anchor="start" x="636" y="91">MXFP4</text><text class="t-s" text-anchor="start" x="620" y="130">RTN에 하다마드를 더하면</text><text class="t-s t-nv t-b" text-anchor="start" x="620" y="146">NVFP4 ↓ 0.85</text><text class="t-s t-mx t-b" text-anchor="start" x="620" y="162">MXFP4 ↑ 1.43</text><text class="t-s t-mut" text-anchor="start" x="30" y="24">FP16 대비 회복률 (세로축 75%부터)</text><text class="t-s t-mut" text-anchor="start" x="80" y="300">Llama-3.1-8B-Instruct W4A4. QuaRot는 전역 회전이라 MXFP4에서 무너진다.</text></svg></svg>
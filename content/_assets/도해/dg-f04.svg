<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 322" width="720" height="322" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2{ stroke:var(--ink-2); }.f-ink2-t{ fill:var(--ink-2); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-indigo-f{ fill:var(--indigo-soft); }.f-madder{ stroke:var(--madder); }.f-madder-t{ fill:var(--madder); }.f-madder-f{ fill:var(--madder-soft); }.f-ochre-t{ fill:var(--ochre); }.f-mend{ stroke:var(--mend); }.f-mend-t{ fill:var(--mend); }.f-mend-f{ fill:var(--mend-soft); }.f-panel-f{ fill:var(--panel); }.f-none{ fill:none; }.f-dash{ stroke-dasharray:6 5; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-l{ font-size:15px; }svg .t-b{ font-weight:700; }svg .halo{ paint-order:stroke; stroke:var(--panel); stroke-width:4px; stroke-linejoin:round; }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg aria-label="법은 욕망적 생산을 실제로 누르면서 동시에 근친상간의 그림을 미끼로 내걸고, 주체는 그 그림을 제 욕망이라 믿으며 그 믿음이 다시 금지를 정당해 보이게 해 회로가 닫힌다. 그사이 실제로 눌린 욕망적 생산은 아무도 보지 않는 데 묻히고, 누르는 것과 부르는 것이 다르니 '금지되었으니 원했다'는 추론은 성립하지 않는다." height="100%" role="img" viewBox="0 0 720 322" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f04-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f04-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f04-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f04-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f04-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f04-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f04-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="f-indigo f-indigo-f" height="56" rx="2" stroke-width="1.8" width="200" x="260" y="14"></rect><text class="f-indigo-t t-b" text-anchor="middle" x="360.0" y="38">억압하는 재현</text><text class="f-indigo-t t-s" text-anchor="middle" x="360.0" y="57">법·금지 (가족)</text><line class="f-ink2 f-none" stroke-width="1.6" x1="8" x2="238" y1="204" y2="204"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="12.0" x2="6.0" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="21.2" x2="15.2" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="30.4" x2="24.4" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="39.599999999999994" x2="33.599999999999994" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="48.8" x2="42.8" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="58.0" x2="52.0" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="67.19999999999999" x2="61.19999999999999" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="76.39999999999999" x2="70.39999999999999" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="85.6" x2="79.6" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="94.8" x2="88.8" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="104.0" x2="98.0" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="140.79999999999998" x2="134.79999999999998" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="150.0" x2="144.0" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="159.2" x2="153.2" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="168.39999999999998" x2="162.39999999999998" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="177.6" x2="171.6" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="186.79999999999998" x2="180.79999999999998" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="196.0" x2="190.0" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="205.2" x2="199.2" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="214.39999999999998" x2="208.39999999999998" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="223.6" x2="217.6" y1="206" y2="213"></line><line class="f-ink2 f-none" stroke-width="0.9" x1="232.79999999999998" x2="226.79999999999998" y1="206" y2="213"></line><rect class="f-madder f-dash f-madder-f" height="54" rx="2" stroke-width="1.6" width="210" x="16" y="222"></rect><text class="f-madder-t t-b" text-anchor="middle" x="121.0" y="245">억압된 대리자</text><text class="f-madder-t t-s" text-anchor="middle" x="121.0" y="263">욕망적 생산의 흐름</text><text class="f-muted-t t-s" text-anchor="middle" x="121.0" y="298">아무도 보지 않는 데 묻힘</text><rect class="f-indigo f-indigo-f" height="54" rx="2" stroke-width="1.8" width="210" x="494" y="222"></rect><text class="f-indigo-t t-b" text-anchor="middle" x="599.0" y="245">전치된 피재현자</text><text class="f-indigo-t t-s" text-anchor="middle" x="599.0" y="263">근친상간 이미지 = 미끼</text><rect class="f-ink f-panel-f" height="52" rx="2" stroke-width="1.6" width="148" x="286" y="118"></rect><text class="f-ink-t t-b" text-anchor="middle" x="360.0" y="140">주체</text><text class="f-ink2-t t-s" text-anchor="middle" x="360.0" y="158">‘그게 내 욕망이었다’</text><path class="f-indigo f-none" d="M260,44 L122,44 L122,219" marker-end="url(#f04-a-indigo)" stroke-width="2.2"></path><text class="f-indigo-t t-b" text-anchor="start" x="132" y="120">누름</text><text class="f-indigo-t t-s" text-anchor="start" x="132" y="137">실제로 누르는 것</text><path class="f-indigo f-none" d="M460,44 L600,44 L600,219" marker-end="url(#f04-a-indigo)" stroke-width="2.2"></path><text class="f-indigo-t t-b" text-anchor="start" x="610" y="120">내걺</text><text class="f-indigo-t t-s" text-anchor="start" x="610" y="137">입으로 부르는 것</text><line class="f-ink f-none" marker-end="url(#f04-a-ink)" stroke-width="1.6" x1="548" x2="438" y1="220" y2="164"></line><text class="f-ink2-t t-s halo" text-anchor="middle" x="498" y="196">그림을 봄</text><line class="f-ink f-none" marker-end="url(#f04-a-ink)" stroke-width="1.6" x1="360" x2="360" y1="116" y2="74"></line><text class="f-ink2-t t-s" text-anchor="start" x="368" y="98">금지가 정당해 보임</text><path class="f-ink2 f-none" d="M515.0,104.5 A15,15 0 1 1 516.5,121.6" marker-end="url(#f04-a-ink2)" stroke-width="1.3"></path><text class="f-ink2-t t-s" text-anchor="middle" x="528" y="116">회로</text><line class="f-mend f-none f-dash" stroke-width="1.4" x1="228" x2="492" y1="249.0" y2="249.0"></line><circle class="f-mend f-mend-f" cx="360" cy="249.0" r="14" stroke-width="1.6"></circle><text class="f-mend-t t-l t-b" text-anchor="middle" x="360" y="255.0">≠</text><text class="f-mend-t t-s" text-anchor="middle" x="360" y="298">누르는 것 ≠ 부르는 것</text></svg></svg>
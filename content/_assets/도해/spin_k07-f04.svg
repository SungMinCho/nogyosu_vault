<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 790 280" width="790" height="280" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-mut-hair{ stroke:var(--muted); stroke-width:1 }.dg .f-ink{ fill:var(--ink) }.dg .ring{ fill:none; stroke:var(--muted); stroke-width:1.1; stroke-dasharray:4 3 }.dg .ring-sp{ fill:none; stroke:var(--spike); stroke-width:1.1; stroke-dasharray:4 3 }.lecture > .frame{ max-width:var(--wide) }.dg .ring-rt{ fill:none; stroke:var(--rot); stroke-width:1.3; stroke-dasharray:4 3 }svg.pz-root{width:790px!important;height:280px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="길이를 맞춘 벡터들이 이루는 원을 직교 행렬은 원으로 보내지만, 가역이되 직교가 아닌 행렬은 타원으로 늘인다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 790 280" width="100%"><defs><marker id="i4-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-s t-b" text-anchor="middle" x="110" y="40">입력: 길이 맞춘 벡터들 (원)</text><circle class="ring" cx="110" cy="150" r="62"></circle><line class="ln-mut-hair" x1="30" x2="190" y1="150" y2="150"></line><line class="ln-mut-hair" x1="110" x2="110" y1="70" y2="230"></line><line class="ln" marker-end="url(#i4-ink)" x1="202" x2="270" y1="150" y2="150"></line><text class="t-s t-b t-rot" text-anchor="middle" x="370" y="40">직교 R: 원은 원 → RMSNorm 통과</text><circle class="ring-rt" cx="370" cy="150" r="62"></circle><line class="ln-mut-hair" x1="290" x2="450" y1="150" y2="150"></line><line class="ln-mut-hair" x1="370" x2="370" y1="70" y2="230"></line><line class="ln" marker-end="url(#i4-ink)" x1="462" x2="530" y1="150" y2="150"></line><text class="t-s t-b t-spike" text-anchor="middle" x="630" y="40">가역 P: 원이 타원 → 통과 못 함</text><ellipse class="ring-sp" cx="630" cy="150" rx="99.2" ry="43.4" transform="rotate(-20 630 150)"></ellipse><line class="ln-mut-hair" x1="550" x2="710" y1="150" y2="150"></line><line class="ln-mut-hair" x1="630" x2="630" y1="70" y2="230"></line><text class="t-s t-mut" text-anchor="middle" x="110" y="250">원래 모델</text><text class="t-s t-rot" text-anchor="middle" x="370" y="250">QuaRot · SpinQuant: 병합, 비용 0</text><text class="t-s t-spike" text-anchor="middle" x="630" y="250">FlatQuant: 온라인 (P = P₁ ⊗ P₂, 연산량의 약 2.6%)</text></svg></g></g></g></g></svg>
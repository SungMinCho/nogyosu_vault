<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 620 178" width="620" height="178" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#F1F2EC; --paper:#FAFAF6; --soft:#E3E6DE; --tie:#B9BEB5; --stack:#C9CDC4; --grid:#DCE0D6; --rule:#CDD3CA;
  --ink:#1B2420; --ink-2:#44504A; --muted:#6E7871; --on:#FFFFFF;
  --pot:#23825A; --risk:#C0392B; --eq:#A0700F; --un:#2F5DA8; --warn:#8A4FB8;
  --eq-bg:#F3E7CC; --risk-bg:#F6DEDA;
  --f-body:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-disp:"Song Myung","Nanum Myeongjo","Noto Serif KR",serif;
  --f-num:"Bodoni Moda","Didot","Bodoni 72","Times New Roman",serif;
  --f-dg:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"Spline Sans Mono","SFMono-Regular","Menlo","Consolas",monospace;
  --f-math:"Noto Sans Math","STIX Two Math","Cambria Math",math;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}}:root[data-theme="dark"]{
  --bg:#0F1915; --paper:#16231D; --soft:#22322A; --tie:#55645B; --stack:#3A4A42; --grid:#24342C; --rule:#2E3F36;
  --ink:#E2E8E0; --ink-2:#B6C0B8; --muted:#8C988F; --on:#0F1915;
  --pot:#3E9A6C; --risk:#D55A4D; --eq:#B88A2C; --un:#6688D0; --warn:#A57BD6;
  --eq-bg:#3A3018; --risk-bg:#3B201C; color-scheme:dark}@media (min-width:34em){:root{--pad:1.6rem}}@media (min-width:52em){:root{--pad:2rem}}.doc{display:grid;grid-template-columns:minmax(0,1fr);row-gap:1.35rem;padding-inline:var(--pad);padding-block:2.2rem 4rem}.lecture{display:contents}.fig{margin:.6rem 0 !important;display:grid;gap:.55rem}.fig .frame{overflow-x:auto;background:
  linear-gradient(90deg,var(--paper) 30%,transparent),linear-gradient(270deg,var(--paper) 30%,transparent),
  radial-gradient(farthest-side at 0 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent),
  radial-gradient(farthest-side at 100% 50%,color-mix(in srgb,var(--ink) 18%,transparent),transparent) 100% 0;
  background-color:var(--paper);background-repeat:no-repeat;background-size:2.2rem 100%,2.2rem 100%,.8rem 100%,.8rem 100%;
  background-position:0 0,100% 0,0 0,100% 0;background-attachment:local,local,scroll,scroll;
  border:1px solid var(--rule);border-radius:3px;padding:.7rem}.dg{display:block;width:100%;height:auto;font-family:var(--f-dg)}.dg text{fill:var(--ink);font-size:12px}.dg text.mu{fill:var(--muted)}.dg text.b{font-weight:700}.dg .on{fill:var(--on)}.dg text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}.dg text.card{font-family:var(--f-num)}.dg .f-eq{fill:var(--eq)}.dg .s-grid{stroke:var(--grid);stroke-width:1}.dg .s-mute{stroke:var(--muted);stroke-width:1.2}.dg circle:hover,.dg rect[class]:hover{filter:brightness(1.08)}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg aria-label="투시 게임에서 세 전략의 베터 EV: 넛만 베팅하는 정직한 전략과 허공을 전부 블러프하는 전략은 둘 다 0.50이고, 블러프를 1 대 2로 섞는 균형 전략만 0.75를 얻는다." class="dg" height="100%" role="img" style="" viewBox="0 0 620 178" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><pattern height="6" id="hh-hon" patternTransform="rotate(45)" patternUnits="userSpaceOnUse" width="6"><line class="s-mute" style="stroke-width:2" x1="0" x2="0" y1="0" y2="6"></line></pattern></defs><line class="s-grid" x1="190.0" x2="190.0" y1="26.0" y2="140.0"></line><text class="mu num" style="font-size:11px" text-anchor="middle" x="190.0" y="158.0">0.00</text><line class="s-grid" x1="280.0" x2="280.0" y1="26.0" y2="140.0"></line><text class="mu num" style="font-size:11px" text-anchor="middle" x="280.0" y="158.0">0.25</text><line class="s-grid" x1="370.0" x2="370.0" y1="26.0" y2="140.0"></line><text class="mu num" style="font-size:11px" text-anchor="middle" x="370.0" y="158.0">0.50</text><line class="s-grid" x1="460.0" x2="460.0" y1="26.0" y2="140.0"></line><text class="mu num" style="font-size:11px" text-anchor="middle" x="460.0" y="158.0">0.75</text><line class="s-grid" x1="550.0" x2="550.0" y1="26.0" y2="140.0"></line><text class="mu num" style="font-size:11px" text-anchor="middle" x="550.0" y="158.0">1.00</text><text style="font-size:13px" text-anchor="start" x="12.0" y="47.0">정직한 전략</text><text class="mu" style="font-size:10.5px" text-anchor="start" x="12.0" y="61.0">넛만 베팅 → 상대는 늘 폴드</text><rect class="f-eq" height="22.0" rx="0" width="180.0" x="190.0" y="36.0"><title>정직한 전략: 베터 EV 0.5</title></rect><rect class="f-hatch" fill="url(#hh-hon)" height="22.0" rx="0" width="88.0" x="372.0" y="36.0"></rect><text class="on num" style="font-size:13px;font-weight:700" text-anchor="end" x="364.0" y="52.0">0.50</text><text style="font-size:13px" text-anchor="start" x="12.0" y="83.0">막 던지는 전략</text><text class="mu" style="font-size:10.5px" text-anchor="start" x="12.0" y="97.0">허공 전부 블러프 → 상대는 늘 콜</text><rect class="f-eq" height="22.0" rx="0" width="180.0" x="190.0" y="72.0"><title>막 던지는 전략: 베터 EV 0.5</title></rect><rect class="f-hatch" fill="url(#hh-hon)" height="22.0" rx="0" width="88.0" x="372.0" y="72.0"></rect><text class="on num" style="font-size:13px;font-weight:700" text-anchor="end" x="364.0" y="88.0">0.50</text><text class="b" style="font-size:13px" text-anchor="start" x="12.0" y="119.0">균형 전략</text><text class="mu" style="font-size:10.5px" text-anchor="start" x="12.0" y="133.0">블러프 : 밸류 = 1 : 2</text><rect class="f-eq" height="22.0" rx="0" width="270.0" x="190.0" y="108.0"><title>균형 전략: 베터 EV 0.75</title></rect><text class="on num" style="font-size:13px;font-weight:700" text-anchor="end" x="454.0" y="124.0">0.75</text><text class="mu" style="font-size:12px" text-anchor="start" x="468.0" y="52.0">팟의 4분의 1이 샌다</text><text class="mu" style="font-size:12px" text-anchor="start" x="190.0" y="16.0">베터의 EV (팟 = 1, 팟 크기 베팅, 넛 확률 ½)</text></svg></svg>
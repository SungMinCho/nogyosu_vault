<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 780 250" width="780" height="250" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-mut{ stroke:var(--muted) }.dg .dash{ stroke-dasharray:4 3 }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .f-ink{ fill:var(--ink) }.dg .f-mut{ fill:var(--muted) }.dg .f-rot{ fill:var(--rot) }.dg .f-rot-s{ fill:var(--rot-soft); stroke:var(--rot); stroke-width:1 }.dg .dot-q{ fill:var(--paper); stroke:var(--ink); stroke-width:1.4 }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:780px!important;height:250px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="무작위 회전의 결과는 13점, 하다마드도 6점 흔들렸고, 학습된 회전의 우위는 반올림일 때 5.5점에서 GPTQ일 때 2.2점으로 줄었다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 780 250" width="100%"><defs><marker id="var-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-b" text-anchor="start" x="20" y="26">(a) 무작위 회전 100번의 흩어짐 — 폭만 논문 수치</text><text class="t-s" text-anchor="start" x="20" y="64">무작위 직교</text><rect class="f-mut" height="16" rx="3" width="221" x="140" y="70"></rect><text class="t-s t-b" text-anchor="start" x="367" y="82">13점</text><text class="t-s" text-anchor="start" x="20" y="106">무작위 하다마드</text><rect class="f-rot-s" height="16" rx="3" width="102" x="242" y="112"></rect><text class="t-s t-b" text-anchor="start" x="350" y="124">6점</text><text class="t-s" text-anchor="start" x="20" y="148">케일리로 학습</text><rect class="f-rot" height="16" rx="3" width="17" x="335.5" y="154"></rect><text class="t-s t-b" text-anchor="start" x="358.5" y="166">좁게 모임</text><line class="ln" x1="140" x2="225" y1="212" y2="212"></line><line class="ln" x1="140" x2="140" y1="207" y2="217"></line><line class="ln" x1="225" x2="225" y1="207" y2="217"></line><text class="t-s" text-anchor="middle" x="182.5" y="232">5점</text><text class="t-s t-mut" text-anchor="start" x="250" y="232">가로 위치는 도식 (LLaMA-2-7B W4A4 제로샷)</text><text class="t-b" text-anchor="start" x="460" y="26">(b) LLaMA-3-8B W4A4KV4 제로샷 평균</text><line class="ln-hair" x1="470" x2="470" y1="60" y2="180"></line><text class="t-s t-mut" text-anchor="middle" x="470" y="198">56</text><line class="ln-hair" x1="552.857" x2="552.857" y1="60" y2="180"></line><text class="t-s t-mut" text-anchor="middle" x="552.857" y="198">60</text><line class="ln-hair" x1="635.714" x2="635.714" y1="60" y2="180"></line><text class="t-s t-mut" text-anchor="middle" x="635.714" y="198">64</text><line class="ln-hair" x1="718.571" x2="718.571" y1="60" y2="180"></line><text class="t-s t-mut" text-anchor="middle" x="718.571" y="198">68</text><line class="ln ln-mut dash" x1="751.714" x2="751.714" y1="52" y2="180"></line><text class="t-s t-mut" text-anchor="middle" x="751.714" y="46">FP 69.6</text><text class="t-s t-b" text-anchor="end" x="462" y="96">반올림</text><line class="ln ln-mut" x1="523.857" x2="637.786" y1="92" y2="92"></line><circle class="dot-q" cx="523.9" cy="92" r="6"></circle><circle class="f-rot" cx="637.8" cy="92" r="6"></circle><text class="t-s t-b t-rot" text-anchor="middle" x="580.821" y="82">5.5점</text><text class="t-s t-mut" text-anchor="middle" x="523.857" y="112">58.6</text><text class="t-s t-rot" text-anchor="middle" x="637.786" y="112">64.1</text><text class="t-s t-b" text-anchor="end" x="462" y="154">GPTQ</text><line class="ln ln-mut" x1="621.214" x2="666.786" y1="150" y2="150"></line><circle class="dot-q" cx="621.2" cy="150" r="6"></circle><circle class="f-rot" cx="666.8" cy="150" r="6"></circle><text class="t-s t-b t-rot" text-anchor="middle" x="644" y="140">2.2점</text><text class="t-s t-mut" text-anchor="middle" x="621.214" y="170">63.3</text><text class="t-s t-rot" text-anchor="middle" x="666.786" y="170">65.5</text><circle class="dot-q" cx="600" cy="226" r="5"></circle><text class="t-s" text-anchor="start" x="610" y="230">QuaRot</text><circle class="f-rot" cx="672" cy="226" r="5"></circle><text class="t-s" text-anchor="start" x="682" y="230">SpinQuant</text></svg></g></g></g></g></svg>
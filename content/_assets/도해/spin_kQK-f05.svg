4"></rect><rect class="tile-m" height="16" rx="1" width="16" x="372" y="134"></rect><rect class="tile-p" height="16" rx="1" width="16" x="390" y="134"></rect><rect class="tile-m" height="16" rx="1" width="16" x="408" y="134"></rect><rect class="tile-p" height="16" rx="1" width="16" x="426" y="134"></rect><rect class="tile-p" height="16" rx="1" width="16" x="300" y="152"></rect><rect class="tile-p" height="16" rx="1" width="16" x="318" y="152"></rect><rect class="tile-m" height="16" rx="1" width="16" x="336" y="152"></rect><rect class="tile-m" height="16" rx="1" width="16" x="354" y="152"></rect><rect class="tile-m" height="16" rx="1" width="16" x="372" y="152"></rect><rect class="tile-m" height="16" rx="1" width="16" x="390" y="152"></rect><rect class="tile-p" height="16" rx="1" width="16" x="408" y="152"></rect><rect class="tile-p" height="16" rx="1" width="16" x="426" y="152"></rect><rect class="tile-p" height="16" rx="1" width="16" x="300" y="170"></rect><rect class="tile-m" height="16" rx="1" width="16" x="318" y="170"></rect><rect class="tile-m" height="16" rx="1" width="16" x="336" y="170"></rect><rect class="tile-p" height="16" rx="1" width="16" x="354" y="170"></rect><rect class="tile-m" height="16" rx="1" width="16" x="372" y="170"></rect><rect class="tile-p" height="16" rx="1" width="16" x="390" y="170"></rect><rect class="tile-p" height="16" rx="1" width="16" x="408" y="170"></rect><rect class="tile-m" height="16" rx="1" width="16" x="426" y="170"></rect><text class="t-s t-spike" text-anchor="middle" x="372" y="206">모든 쌍을 섞음 ✗ — 교환 안 함</text><text class="t-b" text-anchor="start" x="560" y="50">왜 쌍을 섞으면 안 되나</text><text class="t-s" text-anchor="start" x="560" y="74">쌍 1은 e^(iΔθ₁), 쌍 2는 e^(iΔθ₂)를</text><text class="t-s" text-anchor="start" x="560" y="90">곱받는다. 섞은 뒤 곱하나 곱한 뒤</text><text class="t-s" text-anchor="start" x="560" y="106">섞나가 θ₁ ≠ θ₂면 다르다.</text><text class="t-b" text-anchor="start" x="560" y="140">쌍 안에서는</text><text class="t-s" text-anchor="start" x="560" y="162">복소수 곱끼리는 순서가 상관없다.</text><text class="t-s t-spike" text-anchor="start" x="560" y="178">단, 행렬식 −1인 거울(H₂)은</text><text class="t-s t-spike" text-anchor="start" x="560" y="194">각을 뒤집는다: F·R(φ)·Fᵀ = R(−φ).</text><text class="t-s t-mut" text-anchor="start" x="560" y="230">왕 외 (2026): RoPE와 교환하는</text><text class="t-s t-mut" text-anchor="start" x="560" y="246">직교 행렬은 쌍별 회전뿐.</text></svg></g></g></g></g></svg>
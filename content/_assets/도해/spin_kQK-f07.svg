<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 230" width="800" height="230" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-pos{ fill:var(--pos) }.dg .f-mut{ fill:var(--muted) }.dg .f-rot{ fill:var(--rot) }.dg .f-pos{ fill:var(--pos) }.dg .f-grid{ fill:var(--grid) }.lecture > .frame{ max-width:var(--wide) }.dg .t-paper{ fill:var(--paper) }svg.pz-root{width:800px!important;height:230px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="메모리를 읽고 쓰는 시간이 대부분인 커널에서는 RoPE, 하다마드, 양자화 계산이 메모리 시간 뒤에 숨어 전체 시간이 거의 늘지 않는다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 800 230" width="100%"><text class="t-b" text-anchor="start" x="30" y="26">"RoPE + 하다마드 + FP8 양자화" 융합 커널의 시간 (도식)</text><text class="t-s t-b" text-anchor="end" x="160" y="66">메모리</text><text class="t-s t-mut" text-anchor="end" x="160" y="80">읽기 · 쓰기</text><rect class="f-mut" height="34" rx="3" width="570" x="170" y="52"></rect><text class="t-s t-b t-paper" text-anchor="middle" x="455" y="74">Q, K 읽기 → 쓰기 (시간 대부분)</text><text class="t-s t-b" text-anchor="end" x="160" y="124">계산</text><rect class="f-rot" height="30" rx="3" width="70" x="190" y="108"></rect><text class="t-s t-b t-paper" text-anchor="middle" x="225" y="128">RoPE</text><rect class="f-grid" height="30" rx="3" width="90" x="266" y="108"></rect><text class="t-s t-b t-paper" text-anchor="middle" x="311" y="128">H (896번)</text><rect class="f-pos" height="30" rx="3" width="50" x="362" y="108"></rect><text class="t-s t-b t-paper" text-anchor="middle" x="387" y="128">FP8</text><text class="t-s t-pos" text-anchor="start" x="428" y="128">← 메모리 시간 뒤에 숨는다</text><text class="t-s" text-anchor="start" x="30" y="176">FA3: "회전 임베딩은 메모리 대역폭 병목이므로" 블록 양자화와 무작위 하다마드를 거기 융합해도 속도 저하가 없다.</text><text class="t-s t-mono" text-anchor="start" x="30" y="198">HadaCore (Llama 3.1-8B MMLU): BF16 65.38 · FP8 어텐션 64.40 · FP8 + 하다마드 65.09</text></svg></g></g></g></g></svg>
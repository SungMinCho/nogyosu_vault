<rect class="f-panel s-ink w1" height="80" width="200" x="148" y="44"></rect>
<text class="tm" x="248" y="70"><tspan class="tb">프랑스 철학</tspan><tspan class="tl"> 1960~70년대</tspan></text>
<text class="ts tm" x="248" y="94">데리다 · 푸코 · 라캉</text>
<text class="ts tm" x="248" y="112">들뢰즈와 가타리</text>
<rect class="t-mod s-mod w1" height="80" width="200" x="452" y="44"></rect>
<text class="tb tm" x="552" y="78">영미 분석철학 · 인지과학</text>
<text class="ts tm" x="552" y="102">“영국식 스콜라 논리”</text>
<rect class="f-panel s-ink w1" height="76" width="200" x="148" y="284"></rect>
<text class="tb tm" x="248" y="316">프랑스 인류학</text>
<text class="tl tm" x="248" y="338">1990~2000년대</text>
<rect class="t-uru s-uru w1" height="76" width="200" x="452" y="284"></rect>
<text class="tm" x="552" y="310"><tspan class="tb">영미 인류학</tspan><tspan class="tl"> 1980~90년대</tspan></text>
<text class="ts tm c-uru" x="552" y="332">토박이의 경험-실용적 아비투스</text>
<text class="tl tm" x="552" y="349">몸에 밴 성향</text>
<line class="s-mod w2" marker-end="url(#f10-a-mod)" x1="470" x2="331" y1="124" y2="283"></line>
<line class="s-ink w2" marker-end="url(#f10-a-ink)" x1="330" x2="469" y1="124" y2="283"></line>
<line class="s-dim" x1="168" x2="168" y1="124" y2="192"></line>
<line class="s-dim" marker-end="url(#f10-a-dim)" x1="168" x2="168" y1="216" y2="283"></line>
<path class="s-ink w2" d="M162,198 L174,210 M174,198 L162,210"></path>
<text class="tl" x="180" y="208">거의 닿지 않음</text>
<text class="tl te" x="329" y="146">1966 존스홉킨스</text>
<text class="tl te" x="329" y="162">구조주의와 해체가 한 배에</text>
<text class="ts tb" x="466.5" y="246">“프랑스 이론” · 접붙이기</text>
<text class="tl" x="466.5" y="264">받아들여진 곳에서 붙은 이름표</text>
<text class="tl c-mod" x="473" y="146">맥도날드 프랑스 1 → 1,161곳</text>
<text class="tl c-mod" x="473" y="162">3.6년마다 두 배 (1972→2009)</text>
<text class="ts tb te c-mod" x="333.5" y="246">분석철학의 가맹점 · 인지주의</text>
<text class="tl te c-mod" x="333.5" y="264">“맥도날드만큼 빠르게”</text>
<path class="s-dim w2 round" d="M390,295 Q397,294 400,306 Q403,318 410,317 M409,295 L391,317"></path>
<text class="tl tm" x="400" y="338">교차</text>
<circle class="s-ink w1 dot" cx="48" cy="322" r="25"></circle>
<text class="ts tm" x="48" y="326.5">라투르</text>
<circle class="s-ink w1 dot" cx="106" cy="322" r="25"></circle>
<text class="ts tm" x="106" y="326.5">쥘리앵</text>
<text class="tl" x="16" y="264">늘 있는 예외</text>
<text class="tl" x="16" y="280">분류상·정치상 변두리</text>
<rect class="t-mod s-mod w1" height="46" width="332" x="16" y="390"></rect>
<text class="ts tb" x="28" y="409">뒤르켐적 기층</text>
<text class="tl" x="28" y="427">1895 『사회학적 방법의 규칙들』 → 모스</text>
<line class="s-mod w2" marker-end="url(#f10-a-mod)" x1="248" x2="248" y1="360" y2="388.5"></line>
<text class="ts c-mod" x="260" y="380">다시 빨려 듦</text>
<line class="s-rule" x1="16" x2="704" y1="448" y2="448"></line>
<text class="ts" x="16" y="468">레비스트로스의 농담 <tspan class="tb">“엔트로폴로지”</tspan>가 자기 지시적이 됨</text>
<text class="tl" x="16" y="488">— 분과가 바깥의 차이와 맞물리지 못하고 제 안에서 고르게 식는다</text>
</svg></g></g></g></g></svg>
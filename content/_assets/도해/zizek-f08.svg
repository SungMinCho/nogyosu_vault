<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 332" width="760" height="332" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#E5E6E1; --panel:#F0F1EC; --ink:#1B1D21; --mute:#5B5F63; --rule:#C3C6C0;
  --sub:#1D4F93; --sym:#855D00; --jou:#AE2E1C;
  --sub-t:rgba(29,79,147,.12); --sym-t:rgba(201,150,20,.22); --jou-t:rgba(174,46,28,.12);
  --flb:#1F4F96; --fly:#E3B021; --flr:#C0301F;
  --f-body:"Spectral","Nanum Myeongjo","Noto Serif CJK KR","Noto Serif KR","AppleMyungjo",serif;
  --f-disp:"Hahmlet","Nanum Myeongjo","Noto Serif CJK KR",serif;
  --f-label:"Nanum Gothic","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"Courier Prime","Nanum Gothic Coding","Noto Sans Mono CJK KR",monospace;
  --f-lat:"Spectral","Nanum Myeongjo",serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121417; --panel:#1B1E22; --ink:#E6E4DE; --mute:#A2A6A9; --rule:#353A40;
    --sub:#86AEEA; --sym:#DDB14C; --jou:#EE7B64;
    --sub-t:rgba(134,174,234,.16); --sym-t:rgba(221,177,76,.18); --jou-t:rgba(238,123,100,.16);
    --flb:#2A5AA0; --fly:#C99A1B; --flr:#B0342A;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121417; --panel:#1B1E22; --ink:#E6E4DE; --mute:#A2A6A9; --rule:#353A40;
  --sub:#86AEEA; --sym:#DDB14C; --jou:#EE7B64;
  --sub-t:rgba(134,174,234,.16); --sym-t:rgba(221,177,76,.18); --jou-t:rgba(238,123,100,.16);
  --flb:#2A5AA0; --fly:#C99A1B; --flr:#B0342A;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:2.2rem 4rem; }.lecture{ display:contents; }.flag svg{ display:block; width:100%; height:auto; }.fig{ margin-block:.6rem; display:grid; gap:.5rem; }.fig-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background:
  linear-gradient(90deg,var(--panel) 30%,transparent) left/2.2rem 100% no-repeat local,
  linear-gradient(270deg,var(--panel) 30%,transparent) right/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent) left/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) right/.8rem 100% no-repeat scroll, var(--panel);
  padding:.6rem .4rem; }.fig svg{ display:block; width:100%; height:auto; min-width:640px; }svg text{ fill:var(--ink); font-family:var(--f-label); }.t-sm{ font-size:12px; }.t-md{ font-size:13.5px; }.t-b{ font-weight:700; }.t-mute{ fill:var(--mute); }.t-sub{ fill:var(--sub); }.t-jou{ fill:var(--jou); }.f-ink{ fill:var(--ink); }.f-ground{ fill:var(--ground); }.f-panel{ fill:var(--panel); }.f-subt{ fill:var(--sub-t); }.f-jout{ fill:var(--jou-t); }.s-ink{ stroke:var(--ink); }.s-mute{ stroke:var(--mute); }.s-sub{ stroke:var(--sub); }.s-jou{ stroke:var(--jou); }.fig-scroll .f-panel{ fill:var(--ground); }svg.pz-root{width:760px!important;height:332px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w fig-scroll"><svg xmlns="http://www.w3.org/2000/svg" aria-label="두 칸 곱하기 두 칸 표. 동기가 병리적이냐 비병리적이냐, 행위가 법에 맞느냐 어긋나느냐. 비병리적 열에서 도덕적 행위와 악마적 악은 점선 하나로만 갈리고 그 차이는 순전히 형식적이다. 아래는 선 +a, 결여 0, 악 −a의 수직선." class="pz-inner" data-fig="f07" height="100%" role="img" style="--fw:760" viewBox="0 0 760 332" width="100%"><defs><marker id="f07-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-md t-b" text-anchor="middle" x="305" y="40">병리적 동기 (경향성)</text><text class="t-md t-b" text-anchor="middle" x="600" y="40">비병리적 동기 (원칙)</text><text class="t-md t-b" text-anchor="start" x="20" y="110">법에 맞음</text><text class="t-md t-b" text-anchor="start" x="20" y="210">법에 어긋남</text><rect class="f-panel s-mute" height="90" stroke-width="1.3" width="290" x="160" y="60"></rect><text class="t-md t-b" text-anchor="start" x="174" y="86">불순함 impuritas</text><text class="t-sm" text-anchor="start" x="174" y="108">의무에 맞되 다른 동기가 섞임</text><text class="t-sm t-mute" text-anchor="start" x="174" y="130">예: 아이를 괴롭히는 엄격한 교사</text><rect class="f-panel s-mute" height="90" stroke-width="1.3" width="290" x="160" y="160"></rect><text class="t-md t-b" text-anchor="start" x="174" y="186">연약함 fragilitas</text><text class="t-sm" text-anchor="start" x="174" y="208">‘어쩌겠어, 나도 인간인걸’</text><text class="t-sm t-mute" text-anchor="start" x="174" y="230">메타언어의 자리로 도망</text><rect class="f-subt s-sub" height="90" stroke-width="1.3" width="280" x="460" y="60"></rect><text class="t-md t-b t-sub" text-anchor="start" x="474" y="86">도덕적 행위</text><text class="t-sm" text-anchor="start" x="474" y="108">의무에서, 의무를 위해</text><rect class="f-jout s-jou" height="90" stroke-dasharray="6 4" stroke-width="1.3" width="280" x="460" y="160"></rect><text class="t-md t-b t-jou" text-anchor="start" x="474" y="186">악마적 악</text><text class="t-sm" text-anchor="start" x="474" y="208">칸트가 배제 (《종교》 6:35)</text><text class="t-sm t-mute" text-anchor="start" x="474" y="230">돈 조반니의 ‘싫다!’</text><line class="s-ink" stroke-dasharray="2 3" stroke-width="2" x1="460" x2="740" y1="155" y2="155"></line><rect class="f-ground" height="18" width="146" x="590" y="146"></rect><text class="t-sm t-b" text-anchor="middle" x="663" y="159">차이는 순전히 형식적</text><text class="t-sm t-b" text-anchor="start" x="160" y="274">전도 perversitas: 자기애를 법 위에 — 근본악, 모든 준칙의 뿌리</text><line class="s-ink" stroke-width="1.2" x1="480" x2="730" y1="300" y2="300"></line><line class="s-ink" stroke-width="1.4" x1="500" x2="500" y1="294" y2="306"></line><text class="t-sm" text-anchor="middle" x="500" y="288">−a 악</text><line class="s-ink" stroke-width="1.4" x1="605" x2="605" y1="294" y2="306"></line><text class="t-sm" text-anchor="middle" x="605" y="288">0 결여</text><line class="s-ink" stroke-width="1.4" x1="710" x2="710" y1="294" y2="306"></line><text class="t-sm" text-anchor="middle" x="710" y="288">+a 선</text><text class="t-sm t-mute" text-anchor="middle" x="605" y="322">+a + (−a) = 0 — 결여가 아니라 두 힘의 정지</text></svg></g></g></g></g></svg>
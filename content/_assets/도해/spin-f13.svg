<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 780 262" width="780" height="262" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .cloud{ fill:var(--rot-soft); stroke:var(--rot); stroke-width:1.4 }.dg .wcloud{ fill:none; stroke:var(--grid); stroke-width:1.8; stroke-dasharray:5 3 }svg.pz-root{width:780px!important;height:262px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="활성 공분산과 가중치 2차 모멘트가 엇갈린 원래 상태에서 정렬은 0.02이고, 같은 각도로 함께 돌려도 0.02 그대로이며, CAT의 대각 변환으로 둘을 원으로 맞추면 0.5가 된다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 780 262" width="100%"><text class="t-b" text-anchor="middle" x="130" y="24">원래</text><line class="ln-hair" x1="50" x2="210" y1="118" y2="118"></line><line class="ln-hair" x1="130" x2="130" y1="38" y2="198"></line><ellipse class="cloud" cx="130" cy="118" rx="14" ry="60" transform="rotate(0 130 118)"></ellipse><ellipse class="wcloud" cx="130" cy="118" rx="60" ry="14" transform="rotate(0 130 118)"></ellipse><text class="t-b" text-anchor="middle" x="130" y="226">A = 0.020  (−17.1 dB)</text><text class="t-b" text-anchor="middle" x="390" y="24">회전 R (28.6°)</text><line class="ln-hair" x1="310" x2="470" y1="118" y2="118"></line><line class="ln-hair" x1="390" x2="390" y1="38" y2="198"></line><ellipse class="cloud" cx="390" cy="118" rx="14" ry="60" transform="rotate(-28.6 390 118)"></ellipse><ellipse class="wcloud" cx="390" cy="118" rx="60" ry="14" transform="rotate(-28.6 390 118)"></ellipse><text class="t-b" text-anchor="middle" x="390" y="226">A = 0.020  (그대로)</text><text class="t-b" text-anchor="middle" x="650" y="24">CAT 대각 M</text><line class="ln-hair" x1="570" x2="730" y1="118" y2="118"></line><line class="ln-hair" x1="650" x2="650" y1="38" y2="198"></line><ellipse class="cloud" cx="650" cy="118" rx="37" ry="37" transform="rotate(0 650 118)"></ellipse><ellipse class="wcloud" cx="650" cy="118" rx="37" ry="37" transform="rotate(0 650 118)"></ellipse><text class="t-b t-rot" text-anchor="middle" x="650" y="226">A = 0.500  (−3.0 dB)</text><ellipse class="cloud" cx="40" cy="250" rx="10" ry="5"></ellipse><text class="t-s" text-anchor="start" x="56" y="254">활성 x의 공분산 Σₓ</text><ellipse class="wcloud" cx="220" cy="250" rx="10" ry="5"></ellipse><text class="t-s" text-anchor="start" x="236" y="254">가중치 WᵀW</text><text class="t-s t-mut" text-anchor="start" x="420" y="254">겹칠수록 정렬 A가 크다 · 회전은 두 타원을 함께 돌릴 뿐</text></svg></g></g></g></g></svg>
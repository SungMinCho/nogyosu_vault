-s t-b" text-anchor="middle" x="390" y="186">down</text><text class="t-s t-mut" text-anchor="middle" x="390" y="200">Hᵀ·W·R1</text><rect class="tag-n" height="160" rx="6" width="100" x="450" y="60"></rect><text class="t-s t-b" text-anchor="middle" x="500" y="78">전문가 2</text><rect class="bx-rot" height="34" rx="4" width="84" x="458" y="88"></rect><text class="t-s t-b" text-anchor="middle" x="500" y="102">gate · up</text><text class="t-s t-mut" text-anchor="middle" x="500" y="116">R1ᵀ 병합 (공유)</text><rect class="bx-grid" height="34" rx="4" width="84" x="458" y="130"></rect><text class="t-s t-b" text-anchor="middle" x="500" y="144">· H (블록)</text><text class="t-s t-mut" text-anchor="middle" x="500" y="158">전문가 내부 축</text><rect class="bx-rot" height="34" rx="4" width="84" x="458" y="172"></rect><text class="t-s t-b" text-anchor="middle" x="500" y="186">down</text><text class="t-s t-mut" text-anchor="middle" x="500" y="200">Hᵀ·W·R1</text><rect class="tag-n" height="160" rx="6" width="100" x="560" y="60"></rect><text class="t-s t-b" text-anchor="middle" x="610" y="78">전문가 3</text><rect class="bx-rot" height="34" rx="4" width="84" x="568" y="88"></rect><text class="t-s t-b" text-anchor="middle" x="610" y="102">gate · up</text><text class="t-s t-mut" text-anchor="middle" x="610" y="116">R1ᵀ 병합 (공유)</text><rect class="bx-grid" height="34" rx="4" width="84" x="568" y="130"></rect><text class="t-s t-b" text-anchor="middle" x="610" y="144">· H (블록)</text><text class="t-s t-mut" text-anchor="middle" x="610" y="158">전문가 내부 축</text><rect class="bx-rot" height="34" rx="4" width="84" x="568" y="172"></rect><text class="t-s t-b" text-anchor="middle" x="610" y="186">down</text><text class="t-s t-mut" text-anchor="middle" x="610" y="200">Hᵀ·W·R1</text><rect class="tag-n" height="160" rx="6" width="100" x="670" y="60"></rect><text class="t-s t-b" text-anchor="middle" x="720" y="78">전문가 4</text><rect class="bx-rot" height="34" rx="4" width="84" x="678" y="88"></rect><text class="t-s t-b" text-anchor="middle" x="720" y="102">gate · up</text><text class="t-s t-mut" text-anchor="middle" x="720" y="116">R1ᵀ 병합 (공유)</text><rect class="bx-grid" height="34" rx="4" width="84" x="678" y="130"></rect><text class="t-s t-b" text-anchor="middle" x="720" y="144">· H (블록)</text><text class="t-s t-mut" text-anchor="middle" x="720" y="158">전문가 내부 축</text><rect class="bx-rot" height="34" rx="4" width="84" x="678" y="172"></rect><text class="t-s t-b" text-anchor="middle" x="720" y="186">down</text><text class="t-s t-mut" text-anchor="middle" x="720" y="200">Hᵀ·W·R1</text><line class="ln" marker-end="url(#l8-ink)" x1="312" x2="338" y1="80" y2="80"></line><text class="t-s" text-anchor="start" x="30" y="252">정규화 뒤 입력을 라우터와 모든 전문가가 같이 본다 → 병합되는 R1(과 γ)은 모두가 공유해야 한다.</text><text class="t-s t-mut" text-anchor="start" x="30" y="274">전문가마다 다를 수 있는 회전은 전문가 내부 축(down_proj 입력)뿐. 블록 하다마드는 같은 행렬이라 그룹 GEMM에 잘 맞는다. (조사자의 추론)</text></svg></g></g></g></g></svg>
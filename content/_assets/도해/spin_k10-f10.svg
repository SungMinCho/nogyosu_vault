<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 330" width="800" height="330" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-grid{ fill:var(--grid) }.dg .t-doubt{ fill:var(--doubt) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.lecture > .frame{ max-width:var(--wide) }.dg .bx-doubt{ fill:var(--doubt-soft); stroke:var(--doubt) }.dg .ln-doubt{ stroke:var(--doubt) }.dg .f-doubt{ fill:var(--doubt) }svg.pz-root{width:800px!important;height:330px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="학습의 가치를 두고 갈린 두 진영. 왼쪽은 학습 이득이 작고 비싸다는 증거, 오른쪽은 학습으로 크게 이긴 방법들, 가운데는 두 진영이 서로 다른 작동점에 서 있었음을 보여 주는 네 축" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 800 330" width="100%"><text class="t-b t-grid" text-anchor="middle" x="130" y="30">비싼 학습의 값을 의심</text><text class="t-b t-rot" text-anchor="middle" x="670" y="30">학습으로 크게 이김</text><rect class="bx-grid" height="46" rx="5" width="220" x="20" y="46"></rect><text class="t-s t-b" text-anchor="middle" x="130" y="65">SpinQuant 자기 표</text><text class="t-s t-mut" text-anchor="middle" x="130" y="81">GPTQ와 함께면 5.5 → 2.2점</text><rect class="bx-grid" height="46" rx="5" width="220" x="20" y="102"></rect><text class="t-s t-b" text-anchor="middle" x="130" y="121">ReSpinQuant (2026)</text><text class="t-s t-mut" text-anchor="middle" x="130" y="137">학습된 R1·R2 ≈ 하다마드</text><rect class="bx-grid" height="46" rx="5" width="220" x="20" y="158"></rect><text class="t-s t-b" text-anchor="middle" x="130" y="177">BASE-Q (2025)</text><text class="t-s t-mut" text-anchor="middle" x="130" y="193">이득 제한적, 전 모델 역전파 비용</text><rect class="bx-grid" height="46" rx="5" width="220" x="20" y="214"></rect><text class="t-s t-b" text-anchor="middle" x="130" y="233">DartQuant (2025)</text><text class="t-s t-mut" text-anchor="middle" x="130" y="249">종단 학습은 보정 세트에 과적합</text><rect class="bx-rot" height="46" rx="5" width="220" x="560" y="46"></rect><text class="t-s t-b" text-anchor="middle" x="670" y="65">DFRot</text><text class="t-s t-mut" text-anchor="middle" x="670" y="81">거대 활성에 가중한 손실</text><rect class="bx-rot" height="46" rx="5" width="220" x="560" y="102"></rect><text class="t-s t-b" text-anchor="middle" x="670" y="121">FlatQuant</text><text class="t-s t-mut" text-anchor="middle" x="670" y="137">학습형 아핀 (비직교)</text><rect class="bx-rot" height="46" rx="5" width="220" x="560" y="158"></rect><text class="t-s t-b" text-anchor="middle" x="670" y="177">OSTQuant</text><text class="t-s t-mut" text-anchor="middle" x="670" y="193">직교 + 축척, QSUR</text><rect class="bx-rot" height="46" rx="5" width="220" x="560" y="214"></rect><text class="t-s t-b" text-anchor="middle" x="670" y="233">OptRot (2025)</text><text class="t-s t-mut" text-anchor="middle" x="670" y="249">4제곱합, 데이터 없이</text><text class="t-s t-b t-doubt" text-anchor="middle" x="400" y="46">갈리는 작동점</text><line class="ln ln-doubt" x1="300" x2="500" y1="80" y2="80"></line><circle class="f-doubt" cx="300" cy="80" r="3.5"></circle><circle class="f-doubt" cx="500" cy="80" r="3.5"></circle><text class="t-s" text-anchor="start" x="300" y="72">반올림</text><text class="t-s" text-anchor="end" x="500" y="72">GPTQ</text><line class="ln ln-doubt" x1="300" x2="500" y1="130" y2="130"></line><circle class="f-doubt" cx="300" cy="130" r="3.5"></circle><circle class="f-doubt" cx="500" cy="130" r="3.5"></circle><text class="t-s" text-anchor="start" x="300" y="122">LLaMA-2</text><text class="t-s" text-anchor="end" x="500" y="122">LLaMA-3</text><line class="ln ln-doubt" x1="300" x2="500" y1="180" y2="180"></line><circle class="f-doubt" cx="300" cy="180" r="3.5"></circle><circle class="f-doubt" cx="500" cy="180" r="3.5"></circle><text class="t-s" text-anchor="start" x="300" y="172">직교</text><text class="t-s" text-anchor="end" x="500" y="172">비직교</text><line class="ln ln-doubt" x1="300" x2="500" y1="230" y2="230"></line><circle class="f-doubt" cx="300" cy="230" r="3.5"></circle><circle class="f-doubt" cx="500" cy="230" r="3.5"></circle><text class="t-s" text-anchor="start" x="300" y="222">비싼 종단 CE</text><text class="t-s" text-anchor="end" x="500" y="222">값싼 모양 목표</text><rect class="bx-doubt" height="36" rx="5" width="500" x="150" y="284"></rect><text class="t-s t-b" text-anchor="middle" x="400" y="307">정면 대결 = 비교하려는 것 하나만 다르고, 나머지는 모두 같게</text></svg></g></g></g></g></svg>
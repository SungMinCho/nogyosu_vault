sibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w figscroll"><svg aria-label="납작한 그림과 깊은 그림 — 납작한 그림은 재료를 지워 돌멩이에게도 마음을 주고, 깊은 그림은 층위마다 다른 제약이 맞물린 것을 본다" class="pz-inner" height="100%" role="img" viewBox="0 0 480 270" width="100%" xmlns="http://www.w3.org/2000/svg">

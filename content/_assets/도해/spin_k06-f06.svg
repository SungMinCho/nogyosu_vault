<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 250" width="800" height="250" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .t-grid{ fill:var(--grid) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-spike{ stroke:var(--spike) }.dg .dash{ stroke-dasharray:4 3 }.dg .f-ink{ fill:var(--ink) }.dg .f-spike{ fill:var(--spike) }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-spike{ fill:var(--spike-soft); stroke:var(--spike) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.dg .ssub{ font-size:8px }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:800px!important;height:250px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="FFN에서 SiLU와 원소별 곱 뒤의 값에 추론 중 하다마드를 곱하고, 그 역은 down_proj 가중치에 병합한다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 800 250" width="100%"><defs><marker id="g5-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="g5-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker></defs><rect class="bx-rot" height="44" rx="4" width="50" x="30" y="60"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="55" y="77">b</text><text class="t-s t-mut" text-anchor="middle" x="55" y="92">본선에서</text><line class="ln" marker-end="url(#g5-ink)" x1="81" x2="96" y1="82" y2="82"></line><rect class="bx-rot" height="44" rx="4" width="136" x="98" y="60"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="166" y="77">Qᵀ·diag(γ)·W<tspan class="ssub" dy="3">gate</tspan><tspan dy="-3">​</tspan></text><text class="t-s t-mut" text-anchor="middle" x="166" y="92">병합</text><line class="ln" marker-end="url(#g5-ink)" x1="235" x2="250" y1="82" y2="82"></line><rect class="bx-spike" height="44" rx="4" width="118" x="252" y="60"></rect><text class="t-s t-b t-spike" text-anchor="middle" x="311" y="77">SiLU ⊙ (·W<tspan class="ssub" dy="3">up</tspan><tspan dy="-3">​</tspan>)</text><text class="t-s t-mut" text-anchor="middle" x="311" y="92">원소별 비선형</text><line class="ln" marker-end="url(#g5-ink)" x1="371" x2="386" y1="82" y2="82"></line><rect class="bx-grid" height="44" rx="4" width="70" x="388" y="60"></rect><text class="t-s t-b t-grid" text-anchor="middle" x="423" y="77">· H</text><text class="t-s t-mut" text-anchor="middle" x="423" y="92">온라인</text><line class="ln" marker-end="url(#g5-ink)" x1="459" x2="474" y1="82" y2="82"></line><rect class="bx-rot" height="44" rx="4" width="120" x="476" y="60"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="536" y="77">Hᵀ·W<tspan class="ssub" dy="3">down</tspan><tspan dy="-3">​</tspan>·Q</text><text class="t-s t-mut" text-anchor="middle" x="536" y="92">병합</text><line class="ln" marker-end="url(#g5-ink)" x1="597" x2="612" y1="82" y2="82"></line><rect class="bx-rot" height="44" rx="4" width="70" x="614" y="60"></rect><text class="t-s t-b t-rot" text-anchor="middle" x="649" y="85">+ 본선</text><text class="t-s t-b t-grid" text-anchor="middle" x="423" y="124">추론 중 곱한다</text><path class="ln ln-spike dash" d="M 423 54 C 423 26, 536 26, 536 54" marker-end="url(#g5-spike)"></path><text class="t-s t-spike" text-anchor="middle" x="480" y="22">역(Hᵀ)은 W<tspan class="ssub" dy="3">down</tspan><tspan dy="-3">​</tspan>에 미리</text><text class="t-s" text-anchor="start" x="30" y="160">LLaMA-2-7B는 폭 11008 = 2⁶ × 172 → H = H₆₄ ⊗ H₁₇₂ (172 크기는 코드에 숫자로 박혀 있음)</text><text class="t-s t-mono" text-anchor="start" x="30" y="182">비용: 11008 × (172 + 6) ≈ 196만 덧셈 / down_proj GEMM 11008 × 4096 ≈ 4,509만 곱셈-누산 → 약 4.3%</text><text class="t-s t-mut" text-anchor="start" x="30" y="206">폭이 2의 거듭제곱(예: 8192)이면 0.3% 수준. 논문이 잰 실제 오버헤드는 최대 7%.</text></svg></g></g></g></g></svg>
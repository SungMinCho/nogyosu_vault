<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 350" width="720" height="350" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-mut{ stroke:var(--muted) }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .ln-mut-hair{ stroke:var(--muted); stroke-width:1 }.dg .ser-nv{ fill:none; stroke:var(--c-nv); stroke-width:2 }.dg .ser-mx{ fill:none; stroke:var(--c-mx); stroke-width:2 }.dg .mk-nv{ fill:var(--c-nv); stroke:var(--bg); stroke-width:2 }.dg .mk-mx{ fill:var(--c-mx); stroke:var(--bg); stroke-width:2 }.dg .zone-bad{ fill:var(--spike-soft); opacity:.55 }.dg .zone-good{ fill:var(--rot-soft); opacity:.55 }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="회전 후 오차를 회전 전 오차로 나눈 비: E4M3 스케일은 G 8·16에서 1보다 커서 손해이고 32 근처에서 교차하며, E8M0 스케일은 모든 G에서 1보다 작아 이득이다" class="dg" height="100%" role="img" style="" viewBox="0 0 720 350" width="100%"><rect class="zone-bad" height="97.7143" rx="0" width="482" x="78" y="44"></rect><rect class="zone-good" height="130.286" rx="0" width="482" x="78" y="141.714"></rect><text class="t-s t-mut" text-anchor="start" x="86" y="60">회전이 오차를 키움</text><text class="t-s t-mut" text-anchor="start" x="86" y="264">회전이 오차를 줄임</text><line class="ln-hair" x1="78" x2="560" y1="239.429" y2="239.429"></line><text class="t-s t-mut" text-anchor="end" x="70" y="243.429">0.7</text><line class="ln-hair" x1="78" x2="560" y1="206.857" y2="206.857"></line><text class="t-s t-mut" text-anchor="end" x="70" y="210.857">0.8</text><line class="ln-hair" x1="78" x2="560" y1="174.286" y2="174.286"></line><text class="t-s t-mut" text-anchor="end" x="70" y="178.286">0.9</text><line class="ln-hair" x1="78" x2="560" y1="109.143" y2="109.143"></line><text class="t-s t-mut" text-anchor="end" x="70" y="113.143">1.1</text><line class="ln-hair" x1="78" x2="560" y1="76.5714" y2="76.5714"></line><text class="t-s t-mut" text-anchor="end" x="70" y="80.5714">1.2</text><line class="ln ln-mut" x1="78" x2="560" y1="141.714" y2="141.714"></line><text class="t-s t-b" text-anchor="end" x="70" y="145.714">1.0</text><line class="ln-mut-hair" x1="78" x2="78" y1="272" y2="277"></line><text class="t-s t-mut" text-anchor="middle" x="78" y="292">8</text><line class="ln-mut-hair" x1="198.5" x2="198.5" y1="272" y2="277"></line><text class="t-s t-mut" text-anchor="middle" x="198.5" y="292">16</text><line class="ln-mut-hair" x1="319" x2="319" y1="272" y2="277"></line><text class="t-s t-mut" text-anchor="middle" x="319" y="292">32</text><line class="ln-mut-hair" x1="439.5" x2="439.5" y1="272" y2="277"></line><text class="t-s t-mut" text-anchor="middle" x="439.5" y="292">64</text><line class="ln-mut-hair" x1="560" x2="560" y1="272" y2="277"></line><text class="t-s t-mut" text-anchor="middle" x="560" y="292">128</text><text class="t-s t-mut" text-anchor="middle" x="319" y="312">그룹 크기 G (로그 눈금)</text><text class="t-s t-mut" text-anchor="start" x="22" y="30">회전 후 오차 ÷ 회전 전 오차</text><polyline class="ser-nv" points="78.0,73.3 198.5,118.9 319.0,154.7 439.5,180.8 560.0,206.9"></polyline><circle class="mk-nv" cx="78.0" cy="73.3" r="5"><title>E4M3 스케일 · NVFP4식, G = 8: 1.21</title></circle><circle class="mk-nv" cx="198.5" cy="118.9" r="5"><title>E4M3 스케일 · NVFP4식, G = 16: 1.07</title></circle><circle class="mk-nv" cx="319.0" cy="154.7" r="5"><title>E4M3 스케일 · NVFP4식, G = 32: 0.96</title></circle><circle class="mk-nv" cx="439.5" cy="180.8" r="5"><title>E4M3 스케일 · NVFP4식, G = 64: 0.88</title></circle><circle class="mk-nv" cx="560.0" cy="206.9" r="5"><title>E4M3 스케일 · NVFP4식, G = 128: 0.80</title></circle><text class="t-s t-b" text-anchor="start" x="572" y="21
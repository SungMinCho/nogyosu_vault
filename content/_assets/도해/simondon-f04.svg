  linear-gradient(to left,var(--paper),var(--paper)) right/1.2rem 100% no-repeat local,
  linear-gradient(to right,rgba(0,0,0,.18),rgba(0,0,0,0)) left/.7rem 100% no-repeat scroll,
  linear-gradient(to left,rgba(0,0,0,.18),rgba(0,0,0,0)) right/.7rem 100% no-repeat scroll;
  background-color:var(--paper) }.fig-frame svg{ display:block; width:100%; min-width:560px; height:auto }.fig svg text, .hero-fig text{ font-family:var(--f-body); fill:var(--ink) }.t{ font-size:13px }.t-s{ font-size:11px }.t-b{ font-weight:700 }.t-mute{ fill:var(--ink-2) !important }.t-brk{ fill:var(--brk) !important }.t-onshade{ fill:var(--on-shade) !important }.f-none{ fill:none }.f-panel{ fill:var(--panel) }.f-ink{ fill:var(--ink) }.f-shade{ fill:var(--shade) }.s-ink{ stroke:var(--ink) }.s-rule{ stroke:var(--rule) }.s-brk{ stroke:var(--brk) }.w1{ stroke-width:1 }.w15{ stroke-width:1.5 }.w2{ stroke-width:2 }.dot{ stroke-dasharray:1.5 3.5; stroke-linecap:round }.hero-fig .band:hover polygon, .hero-fig .band:focus polygon{ fill:var(--inf-soft) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--paper)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="두 반쪽 사슬. 왼쪽 형상 쪽 사슬은 직각 평행육면체라는 관념에서 주형 설계, 나무판 짜 맞추기, 칠과 가루 뿌리기를 거쳐 물질화된 형상인 주형으로 내려온다. 오른쪽 질료 쪽 사슬은 골풀 뿌리와 자갈이 섞인 늪가 날점토에서 말리기, 빻기, 체질, 적시기와 반죽을 거쳐 콜로이드인 준비된 점토로 올라간다. 두 사슬은 가운데 손, 주형, 점토가 이루는 하나의 에너지 계에서 몇 초 동안 만나는데, 질료형상 도식은 양 끝의 두 상자만 보고 이 가운데를 어두운 지대로 남긴다. 오른쪽 로그 눈금에서 어두운 지대는 벽돌 크기, 10의 마이너스 1제곱 미터 등급에 걸려 있다." height="100%" role="img" viewBox="0 0 760 440" width="100%">

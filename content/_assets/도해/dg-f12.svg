<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 304" width="720" height="304" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2-t{ fill:var(--ink-2); }.f-muted-t{ fill:var(--muted); }.f-indigo{ stroke:var(--indigo); }.f-indigo-t{ fill:var(--indigo); }.f-madder-t{ fill:var(--madder); }.f-ochre{ stroke:var(--ochre); }.f-ochre-t{ fill:var(--ochre); }.f-ochre-f{ fill:var(--ochre-soft); }.f-mend-t{ fill:var(--mend); }.f-panel-f{ fill:var(--panel); }.f-none{ fill:none; }.f-dash{ stroke-dasharray:6 5; }.f-dot{ stroke-dasharray:2 4; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-l{ font-size:15px; }svg .t-xl{ font-size:18px; }svg .t-mono{ font-family:var(--f-mono); }svg .t-b{ font-weight:700; }svg.pz-root{width:720px!important;height:304px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="1923년 11월 20일의 선언은 1달러에 붙은 값의 속성만 4.2 × 10¹² 종이마르크에서 4.2 렌텐마르크로 바꾸었다. 아래에 깔린 종이와 금과 땅이라는 몸들은 그날을 끊김 없이 지나가니, 이것이 비물체적 변형이다." class="pz-inner" height="100%" role="img" viewBox="0 0 720 304" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f12-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f12-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f12-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f12-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f12-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f12-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f12-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="f-ink2-t t-s" text-anchor="start" x="16" y="26">값 — 비물체적 속성</text><rect class="f-ochre f-ochre-f" height="74" rx="3" stroke-width="1.8" width="262" x="24" y="40"></rect><text class="f-ink2-t t-s" text-anchor="middle" x="155.0" y="64">1 달러 =</text><rect class="f-ochre f-ochre-f" height="74" rx="3" stroke-width="1.8" width="262" x="434" y="40"></rect><text class="f-ink2-t t-s" text-anchor="middle" x="565.0" y="64">1 달러 =</text><text class="f-ochre-t t-xl t-b" text-anchor="middle" x="155.0" y="96">4.2 × 10<tspan class="t-s" dy="-6">12</tspan><tspan dy="6"> 종이마르크</tspan></text><text class="f-ochre-t t-xl t-b" text-anchor="middle" x="565.0" y="96">4.2 렌텐마르크</text><line class="f-indigo f-none" marker-end="url(#f12-a-indigo)" stroke-width="3" x1="292" x2="426" y1="77" y2="77"></line><text class="f-indigo-t t-l t-b" text-anchor="middle" x="359" y="66">선언</text><text class="f-indigo-t t-s t-mono" text-anchor="middle" x="359" y="96">1923.11.20</text><text class="f-ink2-t t-s" text-anchor="middle" x="359" y="112">자릿수 열둘이 접힘</text><text class="f-ink2-t t-s" text-anchor="start" x="16" y="150">물체 — 몸들</text><text class="f-ink-t" text-anchor="start" x="16" y="182.5">종이</text><line class="f-ink f-none" stroke-width="1.6" x1="64" x2="704" y1="178" y2="178"></line><text class="f-ink-t" text-anchor="start" x="16" y="214.5">금</text><line class="f-ink f-none" stroke-width="2.4" x1="64" x2="704" y1="210" y2="210"></line><text class="f-ink-t" text-anchor="start" x="16" y="246.5">땅</text><line class="f-ink f-none" stroke-width="3.4" x1="64" x2="704" y1="242" y2="242"></line><line class="f-indigo f-none f-dash" stroke-width="1.2" x1="359" x2="359" y1="124" y2="262"></line><circle class="f-indigo f-panel-f" cx="359" cy="178" r="3.2" stroke-width="1.2"></circle><circle class="f-indigo f-panel-f" cx="359" cy="210" r="3.2" stroke-width="1.2"></circle><circle class="f-indigo f-panel-f" cx="359" cy="242" r="3.2" stroke-width="1.2"></circle><line class="f-ochre f-none f-dot" stroke-width="1.2" x1="155" x2="155" y1="116" y2="238"></line><text class="f-ochre-t t-s" text-anchor="start" x="163" y="140">같은 몸들</text><line class="f-ochre f-none f-dot" stroke-width="1.2" x1="565" x2="565" y1="116" y2="238"></line><text class="f-ochre-t t-s" text-anchor="start" x="573" y="140">지표 — 땅·자산</text><text class="f-ink-t" text-anchor="middle" x="359" y="286">같은 날 — 몸은 그대로, 값만 바뀐다</text></svg></g></g></g></g></svg>
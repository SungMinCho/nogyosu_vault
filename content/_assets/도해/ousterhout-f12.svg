t-s" text-anchor="end" x="160.0" y="69.0">캐시 미스</text><rect class="f-ore s-ore" height="14.0" rx="2" width="44.5" x="170.0" y="57.0"></rect><text class="t t-s" text-anchor="end" x="160.0" y="97.0">새 비휘발성 메모리</text><rect class="f-ore s-ore" height="14.0" rx="2" width="8.1" x="259.1" y="85.0"></rect><text class="t t-s" text-anchor="end" x="160.0" y="125.0">데이터센터 왕복</text><rect class="f-ore s-ore" height="14.0" rx="2" width="65.2" x="356.7" y="113.0"></rect><text class="t t-s" text-anchor="end" x="160.0" y="153.0">플래시 입출력</text><rect class="f-ore s-ore" height="14.0" rx="2" width="93.3" x="356.7" y="141.0"></rect><text class="t t-s" text-anchor="end" x="160.0" y="181.0">디스크 입출력</text><rect class="f-ore s-ore" height="14.0" rx="2" width="28.1" x="608.6" y="169.0"></rect><text class="t t-s" text-anchor="end" x="160.0" y="209.0">광역 네트워크 왕복</text><rect class="f-ore s-ore" height="14.0" rx="2" width="93.3" x="636.7" y="197.0"></rect></svg></g></g></g></g></g></svg>
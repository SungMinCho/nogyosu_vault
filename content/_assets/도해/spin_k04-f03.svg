<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 790 290" width="790" height="290" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .t-grid{ fill:var(--grid) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-spike{ stroke:var(--spike) }.dg .dash{ stroke-dasharray:4 3 }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .dot-q{ fill:var(--paper); stroke:var(--ink); stroke-width:1.4 }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:790px!important;height:290px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="빠른 월시-하다마드 변환의 나비 구조. 네 입력이 두 단의 덧셈과 뺄셈만으로 하다마드 행렬을 곱한 결과가 된다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 790 290" width="100%"><defs><marker id="f2-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f2-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="ln ln-rot" x1="78" x2="254" y1="60" y2="60"></line><line class="ln ln-rot" x1="78" x2="254" y1="115" y2="60"></line><line class="ln ln-rot" x1="78" x2="254" y1="60" y2="115"></line><line class="ln ln-spike dash" x1="78" x2="254" y1="115" y2="115"></line><line class="ln ln-rot" x1="78" x2="254" y1="170" y2="170"></line><line class="ln ln-rot" x1="78" x2="254" y1="225" y2="170"></line><line class="ln ln-rot" x1="78" x2="254" y1="170" y2="225"></line><line class="ln ln-spike dash" x1="78" x2="254" y1="225" y2="225"></line><line class="ln ln-rot" x1="344" x2="478" y1="60" y2="60"></line><line class="ln ln-rot" x1="344" x2="478" y1="170" y2="60"></line><line class="ln ln-rot" x1="344" x2="478" y1="115" y2="115"></line><line class="ln ln-rot" x1="344" x2="478" y1="225" y2="115"></line><line class="ln ln-rot" x1="344" x2="478" y1="60" y2="170"></line><line class="ln ln-spike dash" x1="344" x2="478" y1="170" y2="170"></line><line class="ln ln-rot" x1="344" x2="478" y1="115" y2="225"></line><line class="ln ln-spike dash" x1="344" x2="478" y1="225" y2="225"></line><circle class="dot-q" cx="70" cy="60" r="7"></circle><text class="t-b" text-anchor="end" x="56" y="64">a</text><rect class="bx" height="24" rx="4" width="88" x="256" y="48"></rect><text class="t-s t-mono" text-anchor="middle" x="300" y="64">a + b</text><rect class="bx-rot" height="24" rx="4" width="100" x="480" y="48"></rect><text class="t-s t-mono t-rot" text-anchor="middle" x="530" y="64">a+b+c+d</text><circle class="dot-q" cx="70" cy="115" r="7"></circle><text class="t-b" text-anchor="end" x="56" y="119">b</text><rect class="bx" height="24" rx="4" width="88" x="256" y="103"></rect><text class="t-s t-mono" text-anchor="middle" x="300" y="119">a − b</text><rect class="bx-rot" height="24" rx="4" width="100" x="480" y="103"></rect><text class="t-s t-mono t-rot" text-anchor="middle" x="530" y="119">a−b+c−d</text><circle class="dot-q" cx="70" cy="170" r="7"></circle><text class="t-b" text-anchor="end" x="56" y="174">c</text><rect class="bx" height="24" rx="4" width="88" x="256" y="158"></rect><text class="t-s t-mono" text-anchor="middle" x="300" y="174">c + d</text><rect class="bx-rot" height="24" rx="4" width="100" x="480" y="158"></rect><text class="t-s t-mono t-rot" text-anchor="middle" x="530" y="174">a+b−c−d</text><circle class="dot-q" cx="70" cy="225" r="7"></circle><text class="t-b" text-anchor="end" x="56" y="229">d</text><rect class="bx" height="24" rx="4" width="88" x="256" y="213"></rect><text class="t-s t-mono" text-anchor="middle" x="300" y="229">c − d</text><rect class="bx-rot" height="24" rx="4" width="100" x="480" y="213"></rect><text class="t-s t-mono t-rot" text-anchor="middle" x="530" y="229">a−b−c+d</text><text class="t-s t-mut" text-anchor="middle" x="70" y="30">입력</text><text class="t-s t-mut" text-anchor="middle" x="300" y="30">1단: 이웃끼리</text><text class="t-s t-mut" text-anchor="middle" x="530" y="30">2단: 두 칸 건너</text><text class="t-s t-mut" text-anchor="start" x="70" y="266">파란 선 = 더하기, 붉은 점선 = 빼기. 단마다 덧셈·뺄셈 n번, 단은 log₂ n개.</text><text class="t-s t-b" text-anchor="start" x="620" y="60">원소 하나당 연산 (n = 4096)</text><text class="t-s" text-anchor="start" x="620" y="90">조밀한 행렬</text><text class="t-mono t-b t-spike" text-anchor="end" x="780" y="90">4096</text><text class="t-s" text-anchor="start" x="620" y="124">크로네커 64⊗64</text><text class="t-mono t-b t-grid" text-anchor="end" x="780" y="124">128</text><text class="t-s" text-anchor="start" x="620" y="158">나비 (FWHT)</text><text class="t-mono t-b t-rot" text-anchor="end" x="780" y="158">12</text><text class="t-s t-mut" text-anchor="start" x="620" y="196">나비는 곱셈 없이</text><text class="t-s t-mut" text-anchor="start" x="620" y="212">덧셈·뺄셈만.</text></svg></g></g></g></g></svg>
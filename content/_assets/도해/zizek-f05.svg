  --sub:#86AEEA; --sym:#DDB14C; --jou:#EE7B64;
  --sub-t:rgba(134,174,234,.16); --sym-t:rgba(221,177,76,.18); --jou-t:rgba(238,123,100,.16);
  --flb:#2A5AA0; --fly:#C99A1B; --flr:#B0342A;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:2.2rem 4rem; }.lecture{ display:contents; }.flag svg{ display:block; width:100%; height:auto; }.fig{ margin-block:.6rem; display:grid; gap:.5rem; }.fig-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--rule); background:
  linear-gradient(90deg,var(--panel) 30%,transparent) left/2.2rem 100% no-repeat local,
  linear-gradient(270deg,var(--panel) 30%,transparent) right/2.2rem 100% no-repeat local,
  radial-gradient(farthest-side at 0 50%,rgba(0,0,0,.18),transparent) left/.8rem 100% no-repeat scroll,
  radial-gradient(farthest-side at 100% 50%,rgba(0,0,0,.18),transparent) right/.8rem 100% no-repeat scroll, var(--panel);
  padding:.6rem .4rem; }.fig svg{ display:block; width:100%; height:auto; min-width:640px; }svg text{ fill:var(--ink); font-family:var(--f-label); }.t-sm{ font-size:12px; }.t-md{ font-size:13.5px; }.t-b{ font-weight:700; }.t-mute{ fill:var(--mute); }.t-sub{ fill:var(--sub); }.f-ink{ fill:var(--ink); }.f-panel{ fill:var(--panel); }.f-none{ fill:none; }.f-subt{ fill:var(--sub-t); }.s-ink{ stroke:var(--ink); }.s-sub{ stroke:var(--sub); }.fig-scroll .f-panel{ fill:var(--ground); }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="두 줄의 이행. 위: 봉건적 종교 사회에서 프로테스탄티즘을 거쳐 세속 자본주의로. 아래: 자연에서 세계의 밤과 광기를 거쳐 상징 질서로. 가운데 매개자는 점선으로 흐리고, 도착한 쪽에서 매개자로 되돌아가는 화살표가 흔적을 지운다." data-fig="f04" height="100%" role="img" style="--fw:760" viewBox="0 0 760 282" width="100%"><defs><marker id="f04-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-sm t-b t-mute" text-anchor="start" x="20" y="28">베버 · 제임슨(1973)</text><rect class="s-ink f-panel" height="44" rx="6" stroke-width="1.4" width="180" x="20" y="48"></rect><text class="t-md" text-anchor="middle" x="110.0" y="74.5">봉건적 종교 사회</text><rect class="s-sub f-subt" height="44" rx="6" stroke-dasharray="5 4" stroke-width="1.4" width="180" x="290" y="48"></rect><text class="t-md t-sub" text-anchor="middle" x="380.0" y="74.5">프로테스탄티즘</text><rect class="s-ink f-panel" height="44" rx="6" stroke-width="1.4" width="180" x="560" y="48"></rect><text class="t-md" text-anchor="middle" x="650.0" y="74.5">세속 자본주의</text><line class="s-ink" marker-end="url(#f04-a-ink)" stroke-width="1.4" x1="204" x2="284" y1="70" y2="70"></line><text class="t-sm" text-anchor="middle" x="245" y="40">금욕을 일상으로</text><line class="s-ink" marker-end="url(#f04-a-ink)" stroke-width="1.4" x1="474" x2="554" y1="70" y2="70"></line><text class="t-sm" text-anchor="middle" x="515" y="40">종교 없이 굴러감</text><text class="t-sm t-b t-mute" text-anchor="start" x="20" y="148">지젝의 주체</text><rect class="s-ink f-panel" height="44" rx="6" stroke-width="1.4" width="180" x="20" y="168"></rect><text class="t-md" text-anchor="middle" x="110.0" y="194.5">자연 · 실체</text><rect class="s-sub f-subt" height="44" rx="6" stroke-dasharray="5 4" stroke-width="1.4" width="180" x="290" y="168"></rect><text class="t-md t-sub" text-anchor="middle" x="380.0" y="194.5">세계의 밤 · 광기</text><rect class="s-ink f-panel" height="44" rx="6" stroke-width="1.4" width="180" x="560" y="168"></rect><text class="t-md" text-anchor="middle" x="650.0" y="194.5">상징 질서</text><line class="s-ink" marker-end="url(#f04-a-ink)" stroke-width="1.4" x1="204" x2="284" y1="190" y2="190"></line><text class="t-sm" text-anchor="middle" x="245" y="160">모든 연결을 끊음</text><line class="s-ink" marker-end="url(#f04-a-ink)" stroke-width="1.4" x1="474" x2="554" y1="190" y2="190"></line><text class="t-sm" text-anchor="middle" x="515" y="160">밤을 잊은 주체</text><path class="s-ink f-none" d="M 650 216 C 640 262, 400 262, 386 222" marker-end="url(#f04-a-ink)" stroke-dasharray="5 3" stroke-width="1.3"></path><text class="t-sm t-b" text-anchor="middle" x="515" y="272">흔적을 지운다</text></svg></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 260 152" width="260" height="152" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.doc > .masthead, .doc > .toc, .doc > .colophon{ max-width:var(--shell) }.masthead{ display:grid; grid-template-columns:minmax(0,1fr); gap:1.4rem; padding-block:1.2rem .6rem; border-bottom:1px solid var(--line) }@media (min-width:52em){.masthead{ grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:end }}.mast-fig{ min-width:0 }.hero-svg{ max-width:26rem; margin-inline:auto }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-grid{ fill:var(--grid) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .f-mut{ fill:var(--muted) }.dg .f-spike{ fill:var(--spike) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.dg .t-nv{ fill:var(--c-nv) }.dg .t-mx{ fill:var(--c-mx) }svg.pz-root{width:260px!important;height:152px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w masthead"><g class="pz-w mast-fig"><svg xmlns="http://www.w3.org/2000/svg" aria-label="16개 원소 블록 하나에 큰 봉우리 하나가 있고 자 하나를 나눠 쓴다. MXFP4에서는 회전이 약, NVFP4에서는 독" class="dg hero-svg pz-inner" height="100%" role="img" viewBox="0 0 260 152" width="100%"><rect class="f-mut" height="5.4" rx="0" width="11" x="10" y="84.6"></rect><rect class="f-mut" height="3.6" rx="0" width="11" x="23" y="86.4"></rect><rect class="f-mut" height="7.2" rx="0" width="11" x="36" y="82.8"></rect><rect class="f-mut" height="4.5" rx="0" width="11" x="49" y="85.5"></rect><rect class="f-spike" height="63" rx="0" width="11" x="62" y="27"></rect><rect class="f-mut" height="5.4" rx="0" width="11" x="75" y="84.6"></rect><rect class="f-mut" height="2.7" rx="0" width="11" x="88" y="87.3"></rect><rect class="f-mut" height="6.3" rx="0" width="11" x="101" y="83.7"></rect><rect class="f-mut" height="3.6" rx="0" width="11" x="114" y="86.4"></rect><rect class="f-mut" height="5.4" rx="0" width="11" x="127" y="84.6"></rect><rect class="f-mut" height="4.5" rx="0" width="11" x="140" y="85.5"></rect><rect class="f-mut" height="7.2" rx="0" width="11" x="153" y="82.8"></rect><rect class="f-mut" height="3.6" rx="0" width="11" x="166" y="86.4"></rect><rect class="f-mut" height="5.4" rx="0" width="11" x="179" y="84.6"></rect><rect class="f-mut" height="6.3" rx="0" width="11" x="192" y="83.7"></rect><rect class="f-mut" height="4.5" rx="0" width="11" x="205" y="85.5"></rect><line class="ln" x1="8" x2="218" y1="90" y2="90"></line><rect class="bx-grid" height="20" rx="3" width="32" x="224" y="70"></rect><text class="t-s t-b t-grid" text-anchor="middle" x="240" y="84">2ᵉ</text><text class="t-s t-mut" text-anchor="middle" x="114" y="106">블록 하나 · 자 하나</text><text class="t-s t-b t-mx" text-anchor="middle" x="130" y="124">MXFP4: 봉우리가 잘린다 → 회전이 약</text><text class="t-s t-b t-nv" text-anchor="middle" x="130" y="142">NVFP4: 봉우리가 공짜다 → 회전이 독</text></svg></g></g></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 814.6 324" width="814.6" height="324" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-mut{ stroke:var(--muted) }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-mut-hair{ stroke:var(--muted); stroke-width:1 }.dg .f-mut{ fill:var(--muted) }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .f-grid{ fill:var(--grid) }.dg .dot-sp{ fill:var(--spike); stroke:var(--paper); stroke-width:1.5 }.dg .dot-rt{ fill:var(--rot); stroke:var(--paper); stroke-width:1.5 }.dg .halo{ paint-order:stroke; stroke:var(--paper); stroke-width:4px; stroke-linejoin:round }.dg .ring{ fill:none; stroke:var(--muted); stroke-width:1.1; stroke-dasharray:4 3 }.dg .ring-sp{ fill:none; stroke:var(--spike); stroke-width:1.1; stroke-dasharray:4 3 }.lecture > .frame{ max-width:var(--wide) }svg.pz-root{width:814.6px!important;height:324px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="RMSNorm의 길이 맞추기는 벡터를 원 위로 보내므로 회전과 순서를 바꿔도 같지만, γ는 원을 타원으로 늘여 순서에 따라 결과가 달라진다" class="dg pz-inner" height="324" role="img" style="x:0px!important;y:0px!important;width:790px!important;height:324px!important;overflow:visible!important" viewBox="0 0 790 324" width="790" x="0" y="0"><defs><marker id="g2-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="g2-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="g2-grid" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-grid" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="g2-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mut" d="M0,0 L10,5 L0,10 z"></path></marker></defs><text class="t-b" text-anchor="start" x="30" y="28">길이 맞추기: 모든 벡터를 원 위로</text><line class="ln-mut-hair" x1="20" x2="320" y1="168" y2="168"></line><line class="ln-mut-hair" x1="170" x2="170" y1="38" y2="298"></line><circle class="ring" cx="170" cy="168" r="87.7"></circle><line class="ln ln-mut" marker-end="url(#g2-mut)" x1="170" x2="222.7" y1="168" y2="97.94"></line><line class="ln ln-rot" marker-end="url(#g2-rot)" x1="170" x2="240.06" y1="168" y2="220.7"></line><text class="t-s t-b" text-anchor="start" x="228.7" y="93.94">x / rms</text><text class="t-s t-b t-rot" text-anchor="start" x="246.06" y="234.7">(x·R) / rms = (x / rms)·R</text><text class="t-s t-mut" text-anchor="start" x="30" y="290">점선 원 = 반지름 √D. 원은 돌려도 원이다.</text><text class="t-b t-spike" text-anchor="start" x="400" y="28">γ = (2, 1)은 원을 타원으로 늘인다</text><line class="ln-mut-hair" x1="410" x2="710" y1="168" y2="168"></line><line class="ln-mut-hair" x1="560" x2="560" y1="38" y2="298"></line><ellipse class="ring-sp" cx="560" cy="168" rx="175.4" ry="87.7"></ellipse><circle class="dot-sp" cx="630.1" cy="273.4" r="5.5"></circle><circle class="dot-rt" cx="700.1" cy="220.7" r="5.5"></circle><text class="t-s t-b t-spike halo" text-anchor="end" x="620.06" y="277.4">γ 다음 회전 (1.13, −1.70)</text><text class="t-s t-b t-rot halo" text-anchor="end" x="690.12" y="236.7">회전 다음 γ (2.26, −0.85)</text><text class="t-s t-mut" text-anchor="start" x="400" y="312">순서를 바꾸면 다른 점 — γ는 회전과 교환하지 않는다. 그래서 다음 행렬에 흡수한다.</text></svg></g></g></g></g></svg>
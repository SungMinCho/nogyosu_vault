<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 300" width="800" height="300" class="frame fig lecture doc"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mono{ font-family:var(--f-mono); font-size:11.5px }.dg .t-mut{ fill:var(--muted) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .bar-nv{ fill:var(--c-nv) }.dg .bar-mx{ fill:var(--c-mx) }.dg .t-nv{ fill:var(--c-nv) }.dg .t-mx{ fill:var(--c-mx) }.lecture > .frame{ max-width:var(--wide) }</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><svg xmlns="http://www.w3.org/2000/svg" aria-label="쌍별 회전만 쓰면 하다마드보다 1B에서 1.33, 3B 0.48, 8B 0.19, Mistral 0.05 퍼플렉서티가 나빠진다. 쌍별 회전은 스파이크를 두 칸에만 펴기 때문이다" class="dg" height="100%" role="img" style="" viewBox="0 0 800 300" width="100%"><text class="t-s t-b" text-anchor="start" x="30" y="26">쌍별 회전만 쓸 때 하다마드 대비 ppl 증가 (W4A4KV4)</text><text class="t-s" text-anchor="end" x="122" y="60">Llama-3.2-1B</text><rect class="bar-nv" height="24" rx="0" width="247.724" x="130" y="44"></rect><text class="t-s t-mono t-b" text-anchor="start" x="383.724" y="61">+1.33</text><text class="t-s" text-anchor="end" x="122" y="100">Llama-3.2-3B</text><rect class="bar-nv" height="24" rx="0" width="89.7929" x="130" y="84"></rect><text class="t-s t-mono t-b" text-anchor="start" x="225.793" y="101">+0.48</text><text class="t-s" text-anchor="end" x="122" y="140">Llama-3.1-8B</text><rect class="bar-nv" height="24" rx="0" width="35.2486" x="130" y="124"></rect><text class="t-s t-mono t-b" text-anchor="start" x="171.249" y="141">+0.19</text><text class="t-s" text-anchor="end" x="122" y="180">Mistral-7B</text><rect class="bar-nv" height="24" rx="0" width="9.99143" x="130" y="164"></rect><text class="t-s t-mono t-b" text-anchor="start" x="145.991" y="181">+0.05</text><text class="t-s t-mut" text-anchor="start" x="30" y="222">쌍별 ∘ 하다마드(온라인)로 합성하면 하다마드와 ±0.01 이내. (왕 외, 2026)</text><text class="t-s t-b" text-anchor="start" x="470" y="26">스파이크 하나를 펴면 (16칸만 그림)</text><text class="t-s t-b t-mx" text-anchor="start" x="470" y="56">하다마드</text><rect class="bar-mx" height="16" rx="0" width="14" x="470" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="488" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="506" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="524" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="542" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="560" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="578" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="596" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="614" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="632" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="650" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="668" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="686" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="704" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="722" y="94"></rect><rect class="bar-mx" height="16" rx="0" width="14" x="740" y="94"></rect><line class="ln" x1="468" x2="758" y1="110" y2="110"></line><text class="t-s t-b t-mx" text-anchor="start" x="766" y="104">κ = 1</text><text class="t-s t-b t-nv" text-anchor="start" x="470" y="146">쌍별 회전</text><rect class="bar-nv" height="45.28" rx="0" width="14" x="470" y="154.72"></rect><rect class="bar-nv" height="45.28" rx="0" width="14" x="488" y="154.72"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="506" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="524" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="542" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="560" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="578" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="596" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="614" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="632" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="650" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="668" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="686" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="704" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="722" y="200"></rect><rect class="bar-nv" height="1" rx="0" width="14" x="740" y="200"></rect><line class="ln" x1="468" x2="758" y1="200" y2="200"></line><text class="t-s t-b t-nv" text-anchor="start" x="766" y="194">κ = 8</text><text class="t-s t-mut" text-anchor="start" x="470" y="262">κ는 헤드 폭 128 기준. INT4 오차 ∝ κ² → 약 64배.</text><text class="t-s t-mut" text-anchor="start" x="470" y="280">8비트(±127)면 눈금이 넉넉해 대등.</text></svg></svg>
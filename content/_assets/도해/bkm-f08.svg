<line class="ln" marker-end="url(#ar-f04b)" x1="377" x2="428" y1="178" y2="222"></line>
<text class="t-xs end halo" x="398" y="226">④ ETF 매도</text>
<!-- gap band -->
<line class="grid" x1="20" x2="580" y1="290" y2="290"></line>
<text class="b t-s" x="20" y="324">되먹임</text>
<rect class="f-alarm-a" height="12" width="200" x="200" y="306"></rect>
<line class="ax" x1="160" x2="440" y1="318" y2="318"></line>
<line class="ax" x1="200" x2="200" y1="312" y2="324"></line>
<line class="ax" x1="400" x2="400" y1="312" y2="324"></line>
<line class="ln-alarm thin" marker-end="url(#ar-f04b-alarm)" x1="208" x2="282" y1="300" y2="300"></line>
<line class="ln-alarm thin" marker-end="url(#ar-f04b-alarm)" x1="392" x2="318" y1="300" y2="300"></line>
<text class="t-xs t-num mid" x="200" y="338">NAV 100</text>
<text class="t-xs t-num mid" x="400" y="338">ETF 101</text>
<text class="t-xs t-alarm end" x="580" y="314">틈 = 차익 기회</text>
<text class="t-xs t-ink2 end" x="580" y="332">닫힐 때까지 ①–④ 반복</text>
</svg></g></g></g></g></g></svg>
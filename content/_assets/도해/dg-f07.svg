<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 384" width="720" height="384" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --ground:#EEF0F2;      
  --panel:#F7F8F9;
  --ink:#24262B;         
  --ink-2:#4A4E57;
  --muted:#6C7280;
  --rule:#C9CED6;
  --indigo:#2B4278;      
  --indigo-soft:#D6DCEA;
  --madder:#A7352B;      
  --madder-soft:#F0D9D5;
  --ochre:#9A6A0E;       
  --ochre-soft:#F1E5C8;
  --mend:#2C6A66;        
  --mend-soft:#D3E6E3;
  --shade:#1C1F26;       

  --f-display:"Diphylleia","Gowun Batang","Noto Serif KR",serif;
  --f-body:"Gowun Batang","Alegreya","Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Alegreya","Gowun Batang",serif;
  --f-label:"Gowun Dodum","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono","Gowun Dodum",ui-monospace,monospace;

  --pad:1.15rem; --measure:39rem; --wide:51rem;
  --shell:calc(var(--wide) + var(--pad)*2);
}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
    --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
    --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
    color-scheme:dark;
  }}:root[data-theme="dark"]{
  --ground:#13161D; --panel:#1A1E27; --ink:#E4E6EA; --ink-2:#C2C6CE; --muted:#9298A4; --rule:#343A47;
  --indigo:#93A8DE; --indigo-soft:#232D47; --madder:#E58A7E; --madder-soft:#3F2422;
  --ochre:#D9AE58; --ochre-soft:#3A3020; --mend:#7CC3BC; --mend-soft:#1D3533; --shade:#07090D;
  color-scheme:dark;
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}.quilt svg{ display:block; width:100%; height:auto; }.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:0 4rem; }.lecture{ display:contents; }.fig{ margin:.6rem 0; }.fig .frame{ overflow-x:auto; background:var(--panel); border:1px solid var(--rule); padding:1rem .8rem;
  background-image:linear-gradient(to right, var(--panel), var(--panel)), linear-gradient(to right, var(--panel), var(--panel)),
    linear-gradient(to right, rgba(0,0,0,.12), transparent), linear-gradient(to left, rgba(0,0,0,.12), transparent);
  background-position:left center, right center, left center, right center; background-repeat:no-repeat;
  background-size:20px 100%, 20px 100%, 10px 100%, 10px 100%; background-attachment:local, local, scroll, scroll; }.fig svg{ display:block; width:100%; min-width:34rem; height:auto; margin:0 auto; color:var(--ink); }.fig.narrow svg{ min-width:22rem; }.f-ink{ stroke:var(--ink); }.f-ink-t{ fill:var(--ink); }.f-ink2{ stroke:var(--ink-2); }.f-ink2-t{ fill:var(--ink-2); }.f-muted{ stroke:var(--muted); }.f-muted-t{ fill:var(--muted); }.f-indigo-t{ fill:var(--indigo); }.f-madder{ stroke:var(--madder); }.f-madder-t{ fill:var(--madder); }.f-ochre{ stroke:var(--ochre); }.f-ochre-t{ fill:var(--ochre); }.f-ochre-f{ fill:var(--ochre-soft); }.f-mend-t{ fill:var(--mend); }.f-panel-f{ fill:var(--panel); }.f-none{ fill:none; }.f-dash{ stroke-dasharray:6 5; }.f-dot{ stroke-dasharray:2 4; }svg text{ font-family:var(--f-label); font-size:13px; }svg .t-s{ font-size:11.5px; }svg .t-l{ font-size:15px; }svg .t-mono{ font-family:var(--f-mono); }svg .t-b{ font-weight:700; }svg.pz-root{width:720px!important;height:384px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:transparent"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg aria-label="위: 땅과 연장에서 떨어져 나온 자유로운 노동자의 흐름과 옛 사회체의 구멍에서 흘러나온 화폐 자본의 흐름이 우연히 한 점에서 만나고, 그 자리에 자본이라는 충만한 몸이 선다(결합 종합). 아래: 그 몸에서 나온 두 관에는 같은 100이 적혀 있지만, 은행이 무에서 양 끝을 기입하는 굵은 자금 조달의 흐름과 임금으로 나가 재화로 사라지는 가는 구매력의 흐름은 차원이 다르고, 이윤은 가는 관 옆으로 나란히 흘러든다." class="pz-inner" height="100%" role="img" viewBox="0 0 720 384" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="f07-a-ink" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f07-a-ink2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink2-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f07-a-muted" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-muted-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f07-a-indigo" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-indigo-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f07-a-madder" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-madder-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f07-a-ochre" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ochre-t" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="f07-a-mend" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mend-t" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="f-madder f-none" stroke-width="30" x1="290" x2="520" y1="232" y2="232"></line><text class="f-panel-f t-l t-b" text-anchor="middle" x="318" y="237">−</text><text class="f-panel-f t-l t-b" text-anchor="middle" x="508" y="237">+</text><text class="f-panel-f t-l t-mono t-b" text-anchor="middle" x="412" y="238">100</text><text class="f-madder-t t-s" text-anchor="middle" x="412" y="206">은행이 무에서 양 끝(−·+)을 기입</text><text class="f-madder-t t-b" text-anchor="start" x="530" y="228">자금 조달·신용</text><text class="f-ink2-t t-s" text-anchor="start" x="530" y="245">자본의 역량의 기호</text><line class="f-madder f-none" stroke-width="5" x1="280" x2="500" y1="300" y2="300"></line><text class="f-madder-t t-l t-mono t-b" text-anchor="middle" x="400" y="291">100</text><rect class="f-ink2 f-panel-f" height="28" rx="2" stroke-width="1.3" width="70" x="504" y="286"></rect><text class="f-ink2-t t-s" text-anchor="middle" x="539" y="304">소비재</text><line class="f-muted f-none f-dot" stroke-width="1.2" x1="578" x2="594" y1="300" y2="300"></line><text class="f-muted-t t-s" text-anchor="start" x="598" y="304">사라짐</text><text class="f-madder-t t-b" text-anchor="start" x="320" y="326">지불수단·임금</text><text class="f-ink2-t t-s" text-anchor="start" x="420" y="326">무력한 교환가치의 기호</text><line class="f-madder f-none f-dash" marker-end="url(#f07-a-madder)" stroke-width="1.4" x1="320" x2="600" y1="346" y2="346"></line><text class="f-madder-t t-s" text-anchor="start" x="320" y="368">이윤의 유입 — 환류 옆으로 나란히</text><path class="f-ink2 f-none" d="M652,216 L660,216 L660,304 L652,304" stroke-width="1.2"></path><text class="f-ink2-t t-s" text-anchor="start" x="666" y="262">같은 100</text><text class="f-ink2-t t-s" text-anchor="start" x="666" y="278">다른 차원</text><ellipse class="f-ochre f-ochre-f" cx="205" cy="262" rx="100" ry="60" stroke-width="1.8"></ellipse><text class="f-ochre-t t-b" text-anchor="middle" x="199" y="260">자본 — 충만한 몸</text><text class="f-ochre-t t-s" text-anchor="middle" x="199" y="279">결합 종합</text><rect class="f-ochre f-ochre-f" height="34" rx="2" stroke-width="1.4" width="120" x="16" y="14"></rect><text class="f-ochre-t t-s" text-anchor="middle" x="76" y="36">땅·연장</text><line class="f-ink f-none" stroke-width="1.4" x1="66" x2="86" y1="56" y2="52"></line><line class="f-ink f-none" stroke-width="1.4" x1="66" x2="86" y1="62" y2="58"></line><text class="f-ink2-t t-s" text-anchor="start" x="94" y="62">떨어져 나옴</text><path class="f-madder f-none" d="M76,68 C76,118 104,142 146,162" stroke-width="2.4"></path><path class="f-madder f-none f-dot" d="M146,162 L197,196" marker-end="url(#f07-a-madder)" stroke-width="2"></path><text class="f-madder-t t-b" text-anchor="start" x="88" y="104">자유로운 노동자</text><rect class="f-ink2 f-panel-f" height="34" rx="2" stroke-width="1.4" width="150" x="440" y="14"></rect><text class="f-ink2-t t-s" text-anchor="middle" x="515" y="36">옛 사회체의 구멍</text><path class="f-madder f-none" d="M515,50 C515,112 430,146 330,162" stroke-width="2.4"></path><path class="f-madder f-none f-dot" d="M330,162 L215,197" marker-end="url(#f07-a-madder)" stroke-width="2"></path><text class="f-madder-t t-b" text-anchor="end" x="482" y="104">탈코드화된 화폐 자본</text><text class="f-ink2-t t-s" text-anchor="middle" x="235" y="150">우연한 마주침</text></svg></g></g></g></g></svg>
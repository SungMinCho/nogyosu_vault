<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 670" width="860" height="670" class="pz-root"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}:root{
  --bg:#E8EBE7; --paper:#F4F6F2; --ink:#1B2230; --ink-2:#3A4352; --muted:#5C6572; --line:#C2C8C0;
  --rot:#2B4A99; --rot-soft:#DCE3F3; --spike:#B0392A; --spike-soft:#F2DAD4;
  --grid:#8A5D0B; --grid-soft:#F0E4C8; --pos:#08705F; --pos-soft:#D2EAE4; --doubt:#7A3566; --doubt-soft:#EEDCE8;
  --tile-m:#F4F6F2; --c-nv:#8A5D0B; --c-mx:#2B4A99;
  --f-body:"Literata","Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --f-disp:"Black Han Sans","Noto Serif KR","Apple SD Gothic Neo",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-dg:"Gowun Dodum","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --pad:1.15rem; --measure:39rem; --wide:51rem; --shell:calc(var(--wide) + var(--pad)*2);
}@media (min-width:34em){:root{ --pad:1.6rem }}@media (min-width:52em){:root{ --pad:2rem }}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
    --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
    --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
  }}:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#11151B; --paper:#18202A; --ink:#E3E7EC; --ink-2:#C4CAD3; --muted:#98A2AE; --line:#2F3946;
  --rot:#8DA7EE; --rot-soft:#1E2944; --spike:#EE7C6B; --spike-soft:#3A211D; --grid:#DCA84C; --grid-soft:#342A12;
  --pos:#4CC4B2; --pos-soft:#11302B; --doubt:#D588BF; --doubt-soft:#33202E; --tile-m:#18202A; --c-nv:#B8872F; --c-mx:#6F8AD6;
}.doc{ display:grid; grid-template-columns:minmax(0,1fr); row-gap:1.35rem; padding-inline:var(--pad); padding-block:1.5rem 4rem }.lecture{ display:contents }.fig{ margin:.4rem 0 .2rem }.frame{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:3px;
  background:
    linear-gradient(to right, var(--bg) 30%, transparent) left center / 24px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 30%, transparent) right center / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.18), transparent) left center / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.18), transparent) right center / 10px 100% no-repeat scroll; }.frame:focus-visible{ outline:2px solid var(--rot) }.dg{ width:100%; height:auto; display:block; font-family:var(--f-dg) }.dg text{ font-size:12px; fill:var(--ink) }.dg .t-s{ font-size:10.5px }.dg .t-b{ font-weight:700 }.dg .t-mut{ fill:var(--muted) }.dg .t-rot{ fill:var(--rot) }.dg .t-spike{ fill:var(--spike) }.dg .t-grid{ fill:var(--grid) }.dg .t-pos{ fill:var(--pos) }.dg .t-ink{ fill:var(--ink) }.dg .ln{ stroke:var(--ink); stroke-width:1.4; fill:none }.dg .ln-mut{ stroke:var(--muted) }.dg .ln-rot{ stroke:var(--rot) }.dg .ln-spike{ stroke:var(--spike) }.dg .ln-pos{ stroke:var(--pos) }.dg .ln-grid{ stroke:var(--grid) }.dg .dash{ stroke-dasharray:4 3 }.dg .ln-hair{ stroke:var(--line); stroke-width:1 }.dg .f-ink{ fill:var(--ink) }.dg .f-mut{ fill:var(--muted) }.dg .f-rot{ fill:var(--rot) }.dg .f-spike{ fill:var(--spike) }.dg .f-pos{ fill:var(--pos) }.dg .bx{ fill:var(--paper); stroke:var(--line); stroke-width:1 }.dg .bx-rot{ fill:var(--rot-soft); stroke:var(--rot) }.dg .bx-spike{ fill:var(--spike-soft); stroke:var(--spike) }.dg .bx-pos{ fill:var(--pos-soft); stroke:var(--pos) }.dg .bx-grid{ fill:var(--grid-soft); stroke:var(--grid) }.dg .bx-mut{ fill:var(--paper); stroke:var(--muted) }.dg .bx-ink{ fill:var(--paper); stroke:var(--ink-2) }.dg .tag-pos{ fill:var(--pos-soft); stroke:var(--pos); stroke-width:1 }.dg .ssub{ font-size:8px }svg.pz-root{width:860px!important;height:670px!important;padding:0!important;margin:0!important;border:0!important;overflow:hidden!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;box-shadow:none!important;outline:0!important;transform:none!important;opacity:1!important;visibility:visible!important}g.pz-w{display:inline!important;opacity:1!important;visibility:visible!important;transform:none!important;filter:none!important;animation:none!important;transition:none!important;clip-path:none!important;mask:none!important}svg.pz-inner{display:inline!important;min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;padding:0!important;margin:0!important;border:0!important;transform:none!important;opacity:1!important;visibility:visible!important}</style><rect x="-10%" y="-10%" width="120%" height="120%" style="fill:var(--bg)"/><g class="pz-w doc"><g class="pz-w lecture"><g class="pz-w fig"><g class="pz-w frame"><svg xmlns="http://www.w3.org/2000/svg" aria-label="회전 양자화 계보도: 여덟 층위의 논문들이 아이디어 의존 순서로 화살표로 이어진다" class="dg pz-inner" height="100%" role="img" style="" viewBox="0 0 860 670" width="100%"><defs><marker id="lin-ink" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-ink" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="lin-rot" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-rot" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="lin-spike" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-spike" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="lin-pos" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-pos" d="M0,0 L10,5 L0,10 z"></path></marker><marker id="lin-mut" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path class="f-mut" d="M0,0 L10,5 L0,10 z"></path></marker></defs><line class="ln-hair" x1="8" x2="852" y1="71" y2="71"></line><text class="t-b t-mut" text-anchor="start" x="10" y="43">뿌리</text><text class="t-s t-mut" text-anchor="start" x="10" y="58">1867–2017</text><line class="ln-hair" x1="8" x2="852" y1="151" y2="151"></line><text class="t-b t-spike" text-anchor="start" x="10" y="123">적의 발견</text><text class="t-s t-mut" text-anchor="start" x="10" y="138">2021–24</text><line class="ln-hair" x1="8" x2="852" y1="231" y2="231"></line><text class="t-b t-ink" text-anchor="start" x="10" y="203">대각 · 반올림</text><text class="t-s t-mut" text-anchor="start" x="10" y="218">2020–23</text><line class="ln-hair" x1="8" x2="852" y1="311" y2="311"></line><text class="t-b t-rot" text-anchor="start" x="10" y="283">비간섭성</text><text class="t-s t-mut" text-anchor="start" x="10" y="298">2023–24</text><line class="ln-hair" x1="8" x2="852" y1="391" y2="391"></line><text class="t-b t-rot" text-anchor="start" x="10" y="363">계산 불변성</text><text class="t-s t-mut" text-anchor="start" x="10" y="378">2024</text><line class="ln-hair" x1="8" x2="852" y1="478" y2="478"></line><text class="t-b t-rot" text-anchor="start" x="10" y="443">어떤 회전</text><text class="t-s t-mut" text-anchor="start" x="10" y="458">2024–26</text><line class="ln-hair" x1="8" x2="852" y1="561" y2="561"></line><text class="t-b t-pos" text-anchor="start" x="10" y="533">Q·K와 RoPE</text><text class="t-s t-mut" text-anchor="start" x="10" y="548">2021–26</text><line class="ln-hair" x1="8" x2="852" y1="651" y2="651"></line><text class="t-b t-grid" text-anchor="start" x="10" y="623">FP4 블록</text><text class="t-s t-mut" text-anchor="start" x="10" y="638">2023–26</text><rect class="bx bx-mut" height="44" rx="4" width="130" x="110" y="23"></rect><text class="t-b t-mut" text-anchor="middle" x="175" y="41">실베스터 1867</text><text class="t-s t-mut" text-anchor="middle" x="175" y="56">±1 행렬, 재귀 구성</text><rect class="bx bx-mut" height="44" rx="4" width="160" x="410" y="23"></rect><text class="t-b t-mut" text-anchor="middle" x="490" y="41">FJLT 2006 · 수레시 2017</text><text class="t-s t-mut" text-anchor="middle" x="490" y="56">펴고, 양자화하고, 되돌리기</text><rect class="bx bx-spike" height="44" rx="4" width="130" x="110" y="103"></rect><text class="t-b t-spike" text-anchor="middle" x="175" y="121">본다렌코 2021</text><text class="t-s t-mut" text-anchor="middle" x="175" y="136">잔차의 구조적 이상치</text><rect class="bx bx-spike" height="44" rx="4" width="130" x="260" y="103"></rect><text class="t-b t-spike" text-anchor="middle" x="325" y="121">LLM.int8() 2022</text><text class="t-s t-mut" text-anchor="middle" x="325" y="136">6.7B 창발, 6개 차원</text><rect class="bx bx-spike" height="44" rx="4" width="130" x="560" y="103"></rect><text class="t-b t-spike" text-anchor="middle" x="625" y="121">거대 활성 2024</text><text class="t-s t-mut" text-anchor="middle" x="625" y="136">토큰 한두 개의 스칼라</text><rect class="bx bx-ink" height="44" rx="4" width="130" x="110" y="183"></rect><text class="t-b t-ink" text-anchor="middle" x="175" y="201">SmoothQuant 2022</text><text class="t-s t-mut" text-anchor="middle" x="175" y="216">s<tspan class="ssub" dy="3">j</tspan><tspan dy="-3">​</tspan>로 난도 이주</text><rect class="bx bx-ink" height="44" rx="4" width="130" x="260" y="183"></rect><text class="t-b t-ink" text-anchor="middle" x="325" y="201">OS+·AWQ·OmniQuant</text><text class="t-s t-mut" text-anchor="middle" x="325" y="216">이동·축척·학습 2023</text><rect class="bx bx-ink" height="44" rx="4" width="130" x="560" y="183"></rect><text class="t-b t-ink" text-anchor="middle" x="625" y="201">AdaRound → GPTQ</text><text class="t-s t-mut" text-anchor="middle" x="625" y="216">H = 2XXᵀ로 오차 보정</text><rect class="bx bx-rot" height="44" rx="4" width="130" x="410" y="263"></rect><text class="t-b t-rot" text-anchor="middle" x="475" y="281">QuIP 2023</text><text class="t-s t-mut" text-anchor="middle" x="475" y="296">μ-비간섭 · 크로네커</text><rect class="bx bx-rot" height="44" rx="4" width="130" x="560" y="263"></rect><text class="t-b t-rot" text-anchor="middle" x="625" y="281">QuIP# 2024</text><text class="t-s t-mut" text-anchor="middle" x="625" y="296">무작위 하다마드 · E8</text><rect class="bx bx-rot" height="44" rx="4" width="130" x="710" y="263"></rect><text class="t-b t-rot" text-anchor="middle" x="775" y="281">Xi 외 2023</text><text class="t-s t-mut" text-anchor="middle" x="775" y="296">훈련용 하다마드 양자화기</text><rect class="bx bx-rot" height="44" rx="4" width="130" x="260" y="343"></rect><text class="t-b t-rot" text-anchor="middle" x="325" y="361">SliceGPT 2024</text><text class="t-s t-mut" text-anchor="middle" x="325" y="376">RMSNorm 직교 불변</text><rect class="bx bx-rot" height="44" rx="4" width="130" x="410" y="343"></rect><text class="t-b t-rot" text-anchor="middle" x="475" y="361">QuaRot 2024</text><text class="t-s t-mut" text-anchor="middle" x="475" y="376">병합 + 온라인 1½</text><rect class="bx bx-rot" height="44" rx="4" width="130" x="410" y="423"></rect><text class="t-b t-rot" text-anchor="middle" x="475" y="441">SpinQuant 2024</text><text class="t-s t-mut" text-anchor="middle" x="475" y="456">R1·R2 학습 · R3·R4 고정</text><rect class="bx bx-rot" height="58" rx="4" width="280" x="560" y="416"></rect><text class="t-b t-rot" text-anchor="middle" x="700" y="434">여섯 갈래 2024–26</text><text class="t-s t-mut" text-anchor="middle" x="700" y="449">DuQuant · DFRot · FlatQuant</text><text class="t-s t-mut" text-anchor="middle" x="700" y="462">OSTQuant · ResQ · PrefixQuant</text><rect class="bx bx-pos" height="44" rx="4" width="130" x="110" y="513"></rect><text class="t-b t-pos" text-anchor="middle" x="175" y="531">KVQuant 2024</text><text class="t-s t-mut" text-anchor="middle" x="175" y="546">RoPE 전 키 캐시</text><rect class="bx bx-pos" height="44" rx="4" width="130" x="260" y="513"></rect><text class="t-b t-pos" text-anchor="middle" x="325" y="531">DeepSeek-V2 2024</text><text class="t-s t-mut" text-anchor="middle" x="325" y="546">분리 RoPE</text><rect class="bx bx-pos" height="44" rx="4" width="130" x="410" y="513"></rect><text class="t-b t-pos" text-anchor="middle" x="475" y="531">FlashAttention-3</text><text class="t-s t-mut" text-anchor="middle" x="475" y="546">RoPE 커널에 융합</text><rect class="bx bx-pos" height="44" rx="4" width="130" x="560" y="513"></rect><text class="t-b t-pos" text-anchor="middle" x="625" y="531">FPTQuant 2025</text><text class="t-s t-mut" text-anchor="middle" x="625" y="546">쌍별 변환만 병합</text><rect class="bx bx-pos" height="44" rx="4" width="130" x="710" y="513"></rect><text class="t-b t-pos" text-anchor="middle" x="775" y="531">Wang 외 2026</text><text class="t-s t-mut" text-anchor="middle" x="775" y="546">교환군 = 쌍별 회전</text><rect class="bx bx-grid" height="44" rx="4" width="130" x="110" y="603"></rect><text class="t-b t-grid" text-anchor="middle" x="175" y="621">MX 2023 · NVFP4</text><text class="t-s t-mut" text-anchor="middle" x="175" y="636">블록 32 / 16 스케일</text><rect class="bx bx-grid" height="44" rx="4" width="130" x="260" y="603"></rect><text class="t-b t-grid" text-anchor="middle" x="325" y="621">쳉·유·박 2025</text><text class="t-s t-mut" text-anchor="middle" x="325" y="636">역전파 RHT + SR</text><rect class="bx bx-grid" height="44" rx="4" width="130" x="410" y="603"></rect><text class="t-b t-grid" text-anchor="middle" x="475" y="621">Quartet 2025</text><text class="t-s t-mut" text-anchor="middle" x="475" y="636">순전파 하다마드</text><rect class="bx bx-grid" height="44" rx="4" width="130" x="560" y="603"></rect><text class="t-b t-grid" text-anchor="middle" x="625" y="621">NVIDIA 2025</text><text class="t-s t-mut" text-anchor="middle" x="625" y="636">Wgrad에만 16×16</text><rect class="bx bx-grid" height="44" rx="4" width="130" x="710" y="603"></rect><text class="t-b t-grid" text-anchor="middle" x="775" y="621">MR-GPTQ · BRQ</text><text class="t-s t-mut" text-anchor="middle" x="775" y="636">블록 = 그룹 크기</text><line class="ln ln-mut" marker-end="url(#lin-mut)" x1="240" x2="408" y1="45" y2="45"></line><text class="t-s t-mut" text-anchor="middle" x="324" y="38">하다마드 행렬</text><line class="ln ln-rot" marker-end="url(#lin-rot)" x1="475" x2="475" y1="67" y2="261"></line><text class="t-s t-rot" text-anchor="start" x="482" y="170">펴기의 전통</text><line class="ln ln-spike" marker-end="url(#lin-spike)" x1="175" x2="175" y1="147" y2="181"></line><line class="ln ln-spike" marker-end="url(#lin-spike)" x1="300" x2="210" y1="147" y2="181"></line><text class="t-s t-spike" text-anchor="start" x="262" y="170">겨냥</text><line class="ln" marker-end="url(#lin-ink)" x1="240" x2="258" y1="205" y2="205"></line><text class="t-s t-spike" text-anchor="middle" x="325" y="245">⟂ W4A4 천장</text><line class="ln ln-mut dash" marker-end="url(#lin-mut)" x1="600" x2="520" y1="227" y2="263"></line><text class="t-s t-mut" text-anchor="start" x="572" y="256">LDLQ = GPTQ</text><line class="ln ln-rot" marker-end="url(#lin-rot)" x1="540" x2="558" y1="285" y2="285"></line><line class="ln ln-rot" marker-end="url(#lin-rot)" x1="600" x2="520" y1="307" y2="343"></line><line class="ln ln-rot" marker-end="url(#lin-rot)" x1="390" x2="408" y1="365" y2="365"></line><text class="t-s t-rot" text-anchor="end" x="398" y="336">불변성 + 하다마드</text><line class="ln ln-rot" marker-end="url(#lin-rot)" x1="475" x2="475" y1="387" y2="421"></line><text class="t-s t-rot" text-anchor="start" x="482" y="409">같은 네 자리</text><line class="ln ln-rot" marker-end="url(#lin-rot)" x1="540" x2="558" y1="445" y2="445"></line><line class="ln ln-spike dash" marker-end="url(#lin-spike)" x1="700" x2="700" y1="147" y2="414"></line><text class="t-s t-spike" text-anchor="start" x="706" y="352">거대 활성이</text><text class="t-s t-spike" text-anchor="start" x="706" y="366">이유</text><line class="ln ln-pos" marker-end="url(#lin-pos)" x1="450" x2="450" y1="467" y2="511"></line><text class="t-s t-pos" text-anchor="end" x="444" y="493">R3: RoPE 뒤 온라인</text><line class="ln ln-pos dash" marker-end="url(#lin-pos)" x1="515" x2="600" y1="467" y2="511"></line><rect class="tag-pos" height="18" rx="3" width="118" x="606" y="479"></rect><text class="t-s t-b t-pos" text-anchor="middle" x="665" y="492">R3를 병합하려면?</text><line class="ln ln-pos" marker-end="url(#lin-pos)" x1="690" x2="708" y1="535" y2="535"></line><line class="ln ln-pos" marker-end="url(#lin-pos)" x1="240" x2="258" y1="535" y2="535"></line><text class="t-s t-pos" text-anchor="middle" x="250" y="574">같은 벽</text><line class="ln ln-grid" marker-end="url(#lin-ink)" x1="240" x2="258" y1="625" y2="625"></line><line class="ln ln-grid" marker-end="url(#lin-ink)" x1="390" x2="408" y1="625" y2="625"></line><line class="ln ln-grid" marker-end="url(#lin-ink)" x1="540" x2="558" y1="625" y2="625"></line><line class="ln ln-grid" marker-end="url(#lin-ink)" x1="690" x2="708" y1="625" y2="625"></line></svg></g></g></g></g></svg>